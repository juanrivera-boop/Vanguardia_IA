<script>
    const PDF_TEXT = "411  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  La clínica y el laboratorio  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  Utilidad del extendido de sangre periférica:    los leucocitos*  Germán Campuzano Maya 1  “La sangre es pura y elocuente”     (Maxwell Myer Wintrobe, 1901-1986)  Resumen:  a pesar de los grandes avances tecnológicos relacionados con el hemo -  grama, y en particular los derivados de los autoanalizadores de hematología, cada   vez más sofisticados y completos, el extendido de sangre periférica continúa siendo   el  “estándar  de  oro”  del  diagnóstico  de  hematología.  De  acuerdo  con  las  buenas   prácticas de hematología, el extendido de sangre periférica está indicado en todos   los hemogramas que muestren alguna desviación en los recuentos directos, indirec -  tos o calculados, o cuando se sospeche clínicamente de una enfermedad de origen   hematológico o de origen no hematológico con manifestaciones hematológicas, aun   con parámetros entre rangos esperados para la edad y el género. En el extendido de   sangre periférica es posible observar alteraciones relacionadas con la morfología de   los eritrocitos, leucocitos y las plaquetas. En este módulo se analizarán los aspectos   más importantes 1) del recuento total de leucocitos que define los conceptos leuco -  citosis y leucopenia, 2) del recuento diferencial de leucocitos que define los concep -  tos de neutrofilia, neutropenia, agranulocitosis, eosinofilia, eosinopenia, basofilia, ba -  sopenia, linfocitosis, linfocitopenia, monocitosis y monocitopenia y 3) los hallazgos   más representativos de la morfología de los glóbulos blancos como la agregación   de leucocitos, las desviaciones derecha e izquierda, la anomalía de Pelger-Huët, la   anomalía  de  May-Hegglin,  los  cuerpos  de  Döhle,  el  síndrome  de  Chédiak-Higashi,   la anomalía de Alder-Reilly, los cuerpos de Auer y los cuerpos de Barr, entre otros.   Se  definen  los  aspectos  morfológicos  de  las  diferentes  series  que  conforman  los   leucocitos circulantes y se relacionan con los aspectos clínicos más relevantes. Este   módulo,  provee  al  profesional  de  laboratorio  elementos  que  le  permiten  identificar   adecuadamente las diferentes alteraciones de los leucocitos, en tanto que al médico   le proporciona información para que relacione los hallazgos morfológicos de estas   células con la clínica.  Palabras claves:   extendido de sangre periférica, morfología leucocitaria, clínica.  Campuzano-Maya,  G.    Utilidad  clínica  del  extendido  de  sangre  periférica:  los   leucocitos. Medicina & Laboratorio 2008, 14: 411-455.  Módulo 1 (La clínica y el laboratorio), número 70. Editora Médica Colombiana S.A.,   2008 © .  Recibido el 19 de agosto de 2008; aceptado el 5 de septiembre de 2008.  *. Parte 2 de 3  1. Médico especialista en Hematología y Patología Clínica. Profesor  Ad Honorem , Facultad de Medicina, Universidad de   Antioquia. Médico Director, Laboratorio Clínico Hematológico S.A. Medellín, Colombia. Correspondencia: Carrera 43C   No. 5-33, Medellín, Colombia. E-mail: gcampuzano@hematologico.com \nUtilidad clínica del extendido de sangre periférica: los leucocitos  412  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  C omo  se  e xpresó  en  el  módulo  anterior  [1],  a  pesar  del  descomunal  desarrollo  de  los   autoanalizadores de h ematología y de los grandes avances en el campo del laboratorio   clínico en general y de la hematología en particular, el estudio del extendido de sangre   periférica continúa como el “estándar de oro” en el diagnóstico hematológico. De acuerdo con   la clasificación de los hemogramas, según la Sociedad Colombiana de Patología Clínica [2], que   coincide con los estándares internacionales [3] y que es acogida, aunque parcialmente, por el   Ministerio de Protección Social de Colombia [4], el estudio del extendido de la sangre perifé -  rica hace parte integral de los hemogramas tipo I, II, III y IV, y depende de los hallazgos de los   respectivos autoanalizadores de hematología y de las necesidades del médico solicitante, en los   hemogramas tipo V y VI [5]. Muchas enfermedades tienen manifestaciones hematológicas que   en el hemograma se expresan como cambios cuantitativos, que pueden ser determinados por   los métodos convencionales para hacer la prueba, ya sea de forma manual o con la ayuda de los   autoanalizadores de hematología o como cambios cualitativos, solos o asociados con los prime -  ros, que solamente pueden ser definidos mediante un adecuado estudio del extendido de sangre   periférica [5-10].  Con este módulo se complementa parcialmente una serie de módulos que sobre el hemo -  grama se presentó en números anteriores de MEDICINA & LABORATORIO [5, 11], sobre todo   con relación a la utilidad clínica del extendido de sangre periférica [1] y tiene como finalidad   presentar a los profesionales del laboratorio clínico las variables que deben asegurar para que el   hemograma logre su objetivo como prueba de laboratorio, y a los médicos las posibilidades de   aplicación en la clínica que el hemograma le aportan en su diario quehacer. En esta entrega se   revisarán las variaciones más importantes, cuantitativas y cualitativas, relacionadas con los leuco -  citos, dejando para un próximo módulo los aspectos relacionados con las plaquet as.  Los leucocitos  La part e del hemograma que e studia las alteraciones de los leucocitos es el leucograma. El   leucograma se refiere al análisis cuantitativo y cualitativo de los leucocitos en sangre periférica.   El  leucograma,  como  prueba  independiente  o  como  parte  integral  del  hemograma,  tiene  dos   componentes: uno cuantitativo, que corresponde al recuento total de leucocitos y al recuento   diferencial de leucocitos; y, otro cualitativo, que corresponde al estudio morfológico de los leu -  cocitos, que en la práctica hace parte integral del recuento diferencial de leucocitos, sobre todo   en los hemogramas tipo I a IV, el cual es obligatorio hacerlo por métodos manuales y cuando hay   alarmas o recuentos anormales en los hemogramas tipo V y VI [11].  Recuento total de leucocitos  El recuento to tal de leucocitos define algunos de los conceptos claves en el análisis del he -  mograma y en la aplicación de la prueba en la práctica médica. El recuento de leucocitos puede   variar de acuerdo con la edad, el género y la raza [12, 13]. En la  tabla 1  se presentan las variacio -  nes del recuento total y diferencial de leucocitos, derivado del análisis de 18.063 leucogramas,   realizados con un autoanalizador de hematología XE-2100 de Sysmex ® ,  mediante  el  método   de Bhattacharya [14], para definir los valores de referencia de un laboratorio clínico privado de   Medellín, Colombia. El recuento total de leucocitos define los conceptos semiológicos de leuco -  citosis y leucopenia. El recuento total de leucocitos con métodos manuales tiene un coeficiente   de variación (inexactitud) que oscila entre el 6,5%, para los recuentos normales o altos, a 15%,   para los recuentos bajos, en tanto que con los autoanalizadores de hematología oscila entre 1%   y 3%, respectivamente [15, 16].  Leucocitosis  Es el término utilizado para indicar el aumento, con relación al valor máximo esperado para   la edad, el estado fisiológico y el origen étnico, del recuento total de leucocitos [17]. La leucoci - \nCampuzano-Maya G.  413  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  tosis usualmente  se hace a expensas de los polimorfonucleares neutrófilos (neutrofilia), aunque   también se puede presentar por aumento de linfocitos (linfocitosis), polimorfonucleares eosinó -  filos (eosinofilia) o monocitos (monocitosis); además, puede ser a expensas de células inmaduras   como sucede en las leucemias [17]. En todos los casos en donde se encuentre leucocitosis, el   estudio se debe completar con la observación directa de los leucocitos en extendidos de sangre   periférica a cargo de profesionales debidamente entrenados en morfología sanguínea [17]. Es   importante no olvidar que puede haber seudoleucocitosis cuando hay crioglobulina o criofibrinó -  geno [18], agregados de plaquetas [19] y cuando hay eritroblastos: las dos primeras con los autoa -  nalizadores de hematología y la última con los recuentos manuales o con los autoanalizadores de   hematología de las primeras generaciones, situación que no se presenta en los autoanalizadores   de hematología de última generación, cuando se les incorpora el módulo de recuento de eritro -  blastos, como sucede con el XE-2100 de Sysmex ®   [20], entre otros.    Leucopenia  Es el término utilizado para i ndicar la disminución, con relación al valor mínimo esperado para   la edad, el estado fisiológico y el origen étnico, en el recuento total de leucocitos [17]. Como en   el caso de la leucocitosis, la leucopenia usualmente se hace a expensas de los polimorfonuclea -  res neutrófilos (neutropenia), aunque también se puede presentar por disminución de linfocitos   (linfocitopenia) o la combinación de ambos [17]. En todos los casos en donde hay leucopenia, es   necesario que el estudio se complete con la observación directa de los leucocitos en extendidos   de sangre periférica a cargo de profesionales debidamente entrenados en morfología sanguínea   [17]. Además, como en el caso anterior, se puede presentar seudoleucopenia con neutropenia en   individuos con fenómenos de aglutinación al frío [21] o tras la administración de gammaglobulina   que induce un aumento en la agregación de los granulocitos [22].  Recuento diferencial de leucocitos   En la sangre circulan cinco tipos de células que se originan de tres series hematopoyéticas a   saber: de la serie granulocítica, los polimorfonucleares neutrófilos, los polimorfonucleares eosi -  nófilos y los polimorfonucleares basófilos, de la serie linfocítica, los linfocitos y de la serie mono -  Tabla 1.  Valores de referencia para el leucograma por  μ L*  Edad   Leucocitos   Neutrófilos   Eosinófilos   Basófilos   Linfocitos   Monocitos  Recién nacido   9.000 a 30.000   6.000 a 26.000   20 a 850   0 a 640   2.000 a 11.000   400 a 3.100  12 horas   13.000 a 38.000   6.000 a 28.000   20 a 950   0 a 500   2.000 a 11.000   400 a 3.600  24 horas   9.400 a 34.000   5.000 a 21.000   50 a 1.000   0 a 300   2.000 a 11.500   200 a 3.100  1 semana   5.000 a 21.000   1.500 a 10.000   70 a 1.100   0 a 250   2.000 a 17.000   300 a 2.700  1 mes   5.000 a 19.500   1.000 a 9.000   70 a 900   0 a 200   2.500 a 16.500   150 a 2.000  6 meses   6.000 a 17.500   1.000 a 8.500   70 a 750   0 a 200   4.000 a 16.500   100 a 1.300  1 año   6.000 a 17.500   1.500 a 8.500   50 a 700   0 a 200   4.000 a 10.500   50 a 1.100  1 a 4 años   4.500 a 13.000   1.200 a 9.000   30 a 550   0 a 150   2.000 a 9.000   50 a 950  5 a 6 años   4.500 a 13.000   1.200 a 9.000   30 a 550   0 a 150   1.500 a 6.000   50 a 950  7 a 14 años   4.000 a 12.000   1.200 a 9.000   30 a 550   0 a 150   1.500 a 6.000   50 a 950  5 a 14 años   4.000 a 12.000   1.500 a 8.000   30 a 550   0 a 150   1.500 a 6.000   50 a 950  15 a 99 años   4.000 a 11.000   1.500 a 8.000   30 a 550   0 a 150   1.000 a 4.000   50 a 900  * Observación: los valores aquí consignados son los valores de referencia del hemograma tipo VI en el Laboratorio Clí -  nico Hematológico, en Medellín, Colombia, derivados del análisis de 18.063 leucogramas de acuerdo con el método de   Bhattacharya [14]. Sólo pueden ser utilizados como ejemplo, cada laboratorio clínico debe definir sus respectivos valores   de  referencia  de  acuerdo  con  las  características  de  la  población  a  la  que  atiende,  acorde  con  el  instrumento  y  con  la   tecnología utilizada. \nMedicina & Laboratorio, Volumen 14, Números 9-10, 2008  414  Utilidad clínica del extendido de sangre periférica: los leucocitos  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  cítica, los monocitos. I ndependiente de la técnica utilizada para hacer el recuento diferencial de   leucocitos, ya sea por métodos manuales o electrónicos, el observador debe estar en condiciones   de identificar tanto las formas normales como las formas inmaduras y las anormalidades que   puedan presentarse en estas células, como se analizará en el curso de este módulo. Cuando   en el recuento diferencial de leucocitos por métodos electrónicos como los realizados con los   autoanalizadores de hematología de última generación, como el XE-2100 de Sysmex ®   [23] y el   Sapphire de la línea Cell-Dyn de Abbott Diagnostics ®  [24], el instrumento analiza más de 50.000   células por estudio, en el recuento diferencial de leucocitos manual sólo se analizan entre 100   y 200 células [25] y algunos van más allá, estudiando escasamente 50 células, aumentado el   coeficiente de variación.  Es importante recordar que el recuento diferencial de leucocitos por métodos manuales,   además  de  las  relacionadas  con  los  problemas  de  preparación  y  coloración  de  los  extendidos   como claramente está referenciado en la literatura médica [8, 26] como se analizó ampliamente   en un modulo anterior [5], tiene otras fuentes de error como la distribución de las células en el   extendido de sangre periférica, el reconocimiento de las células y los errores estadísticos de la   muestra, debido a que sólo se analizan 100 células; problemas que se resuelven con los recuen -  tos diferenciales de leucocitos de los autoanalizadores de hematología, sobre todo los de últimas   generaciones, por el gran número de células que analizan, la tecnología utilizada (usualmente   láser) y el software instalado en estos instrumentos, con coeficientes de variación por debajo del   5% [27-30].  Recuento diferencial de leucocitos por método manual  Cuando el hemo grama es manual, como en los tipos I y II, semimanual, como el tipo III, y   cuando es de tres partes, como el tipo IV de acuerdo con la clasificación de la Sociedad Colom -  biana de Patología Clínica [2], en todos los casos se debe hacer recuento diferencial de leucocitos   por método manual, siguiendo las técnicas establecidas en los procedimientos de laboratorio clí -  nico para tal fin [25, 31, 32]. Para tener un buen recuento diferencial de leucocitos por el método   manual, es indispensable: (1) hacer un buen extendido de sangre periférica como se analizó en   un módulo anterior [5]; (2) seguir los procedimientos al “pie de la letra” definidos en los manuales   de procedimientos [25, 32], que debe seguir el laboratorio clínico dentro de las buenas prácticas;   y (3) que el personal que haga el recuento esté debidamente capacitado para identificar todas las   células normales y, más importante, las anormales [31] .  Recuento diferencial de leucocitos por métodos electrónicos  Cuando el hemograma e s electrónico, en particular los que entregan un diferencial de cinco   partes, como los hemogramas tipo V y VI de la clasificación de la Sociedad Colombiana de Pato -  logía Clínica [2], en donde el recuento que hace   el instrumento se logra mediante alta tecnología   incorporada a los autoanalizadores de hemato -  logía y al gran número de células analizadas, el   estudio de las alarmas, más que el recuento di -  ferencial de leucocitos, se debe hacer en todos   los casos en donde éstas se presenten siguien -  do estrictamente los protocolos preestablecidos   para estos casos de acuerdo con las diferentes   casas  comerciales  [33].  El  recuento  diferencial   de leucocitos por métodos electrónicos, como   los que se logran con los autoanalizadores de   hematología  de  última  generación,  tiene  una   mayor sensibilidad y especificidad para detec -  tar  alteraciones  en  esta  parte  del  hemograma   100   200   300  Figura  1.   Histograma  de  leucocitos  de  tres  partes.  En  la   primera parte a la izquierda, se separan los restos celulares   de los linfocitos; en la parte central se separan los linfocitos   de una población mezclada, consistente en su mayoría de   monocitos y eosinófilos; y en la tercera parte se separan los   granulocitos de la población central. \nCampuzano-Maya G.  415  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  que los métodos manuales, como contundentemente lo han demostrado varios estudios  [23].   En la  figura 1  se muestra un histograma de un recuento diferencial de leucocitos de tres partes y   en la  figura 2  los citogramas que permiten tener un recuento diferencial de leucocitos de cinco   partes con uno de los autoanalizadores de hematología de última generación, disponible en el   mercado nacional.  El recuento diferencial de leucocitos se expresa en valores absolutos, esto es en células por   unidad de volumen (por  μ L), y no en valores relativos o porcentaje de células, como frecuente -  mente lo hacen muchos laboratorios clínicos. De acuerdo con los valores esperados, que varían   con la edad y el grupo étnico, éstos deben ser ajustados por cada laboratorio clínico, como se   presenta  en  la    tabla     1 ,  previamente  citada.  Independiente  de  los  valores  ajustados  para  cada   caso  en  particular,  el  recuento  diferencial  de  leucocitos  permite  establecer  algunos  conceptos   básicos de gran valor en la interpretación de la prueba y en la clínica, como se analizará a con -  tinuación.  Alteraciones cuantitativas derivadas del recuento diferencial de leucocitos  Del recuento diferencial de leucocitos se derivan conceptos médicos como neutrofilia, neu -  tropenia, agranulocitosis, eosinofilia, eosinopenia, basofilia, basopenia, monocitosis, monocito -  penia, linfocitosis y linfocitopenia, entre otros.  Neutrofilia  Es  el  término  utilizado  para  indicar,  con  relación  al  valor  máximo  esperado  para  la  edad,   el género, el estado fisiológico y el origen étnico, el aumento en el recuento absoluto de los   polimorfonucleares neutrófilos [17]. Fisiológicamente, los neutrófilos se encuentran elevados en   niños recién nacidos, en las mujeres en edad reproductiva, durante los ciclos menstruales y en el   embarazo, particularmente alrededor del trabajo de parto y los primeros días posparto [17]. La   neutrofilia usualmente se presenta por redistribución de las células, con paso del  pool  marginal a   la circulación, tras un estímulo como el estrés (ejercicio, epinefrina, etc.), infecciones bacterianas   L M N B  I N+B   E  Figura 2.  Citograma de leucocitos de un paciente con recuento diferencial de leucocitos normal. En el panel de la izquier -  da, el citograma muestra cuatro poblaciones de leucocitos: linfocitos (L), monocitos (M), neutrofilos y basófilos (N + B) y   eosinófilos (E). En el panel de la derecha, el citograma complementario muestra dos poblaciones: neutrófilos (N) y basófilos   (B). Sysmex ®  XE-2100.  L M N B  I N+B   E \nUtilidad clínica del extendido de sangre periférica: los leucocitos  416  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  o inflamación, o por salida de polimorfonucleares neutrófilos de la medula ósea [17]. Las causas   íntimas por las cuales se presenta neutrofilia son múltiples y para ello es preferible consultar las   tablas, por cierto muy extensas, que traen los textos clásicos de hematología [17, 34] o revisiones   especializadas [35]. Como en las otras alteraciones cuantitativas de los leucocitos, en todos los   casos en donde hay neutrofilia, sobre todo en los hemogramas tipo V y VI, en donde el recuento   diferencial de leucocitos manual o la observación del extendido de sangre periférica es opcional,   es necesario complementar el estudio con la observación directa de los leucocitos en extendidos   de sangre periférica a cargo de profesionales debidamente entrenados en morfología sanguínea   [17].  Neutropenia  Es el término utilizado para indicar, con relación al valor mínimo esperado para la edad, el   género, el estado fisiológico y el origen étnico, la disminución en el recuento absoluto de los po -  limorfonucleares neutrófilos [17]. Con relación a la neutropenia es muy importante recordar que   los valores de referencia en el recuento absoluto de leucocitos y sobre todo de los neutrófilos en   los individuos negros es muy diferente al del resto de la población [36, 37], por lo que más bien   debería llamarse seudoneutropenia étnica [38], cuando en los caucásicos el límite por debajo del   cual se define la neutropenia es de 1.800 neutrófilos por  μ L, en individuos de raza negra este   nivel se ubica en 1.400 neutrófilos por  μ L y en algunos individuos puede estar alrededor de los   1.000 neutrófilos por  μ L [38-41], situación que si no se tiene en cuenta, como frecuentemente   sucede en el medio, puede generar malos diagnósticos, tratamientos innecesarios y costos inúti -  les. Como en las otras alteraciones cuantitativas de los leucocitos, en todos los casos en donde   hay neutropenia, el estudio se debe completar con la observación directa de los leucocitos en   extendidos de sangre periférica a cargo de profesionales debidamente entrenados en morfología   sanguínea [17].  De acuerdo con el recuento absoluto de neutrófilos, la neutropenia se clasifica en media,   cuando el recuento absoluto de neutrófilos está entre 1.000 y 1.500 células por  μ L; moderada,   cuando el recuento absoluto de neutrófilos está entre 500 y 1.000 células por  μ L; y severa,   cuando el recuento absoluto de neutrófilos está por debajo de 500 células por  μ L [42]. Además,   el termino de agranulocitosis se utiliza para definir la ausencia de polimorfonucleares neutrófilos   en el recuento diferencial de leucocitos [42] y para algunos autores cuando el recuento absoluto   de polimorfonucleares neutrófilos está por debajo de 500 por  μ L [43]. La agranulocitosis es la   forma más severa de neutropenia y se caracteriza por una altísima tasa de mortalidad, mortalidad   que puede llegar hasta el 24% [44-49]. Las causas íntimas por las cuales se presenta neutropenia   son múltiples y para ello es preferible consultar las tablas, por cierto muy extensas, que traen los   textos clásicos de hematología [17, 34, 42] o revisiones especializadas [35, 50, 51]. Como en las   otras alteraciones cuantitativas de los leucocitos, en todos los casos en donde hay neutropenia,   sobre todo en los hemogramas tipo V y VI, en donde el recuento diferencial de leucocitos manual   o la observación del extendido de sangre periférica es opcional, es necesario complementar el   estudio con la observación directa de los leucocitos en extendidos de sangre periférica a cargo   de profesionales debidamente entrenados en morfología sanguínea. Ante la presencia de neu -  tropenia debe tenerse en cuenta la posibilidad de una falsa disminución de los neutrófilos por   aglutinación de los granulocitos [21].  Eosinofilia  Es el término utilizado para indicar el aumento, con relación al valor máximo esperado para   la edad y el estado fisiológico, en el recuento absoluto de los polimorfonucleares eosinófilos [17].   El recuento de eosinófilos no varía con el origen étnico, como previamente se había insinuado   para los indios y los negros [17]. La eosinofilia, de acuerdo con el recuento de eosinófilos, inde - \nCampuzano-Maya G.  417  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  pendiente de las variaciones que puedan presentarse localmente con los valores de referencia, la   eosinofilia puede subdividirse en tres grupos: media o mínima, cuando el recuento de eosinófilos   está entre 350 y 1.500 por  μ L; moderada, cuando en recuento de eosinófilos está entre 1.501 y   5.000 por  μ L; y marcada o severa, cuando en recuento de eosinófilos está por encima de 5.001   por  μ L [52-54]. En nuestro medio, la causa más frecuente de eosinofilia, usualmente mínima, son   las enfermedades parasitarias seguida de las enfermedades alérgicas, que ocupan el primer lugar   en los países desarrollados [53]. Las causas íntimas por las cuales se presenta eosinofilia son múl -  tiples y para ello es preferible consultar las tablas que traen los textos clásicos de hematología [17,   52] o revisiones especializadas [53-56]. Como en las otras alteraciones cuantitativas de los leu -  cocitos, en todos los casos en los cuales se encuentra eosinofilia, sobre todo en los hemogramas   tipo V y VI, es necesario complementar el estudio con la observación directa de los leucocitos en   extendidos de sangre periférica a cargo de profesionales debidamente entrenados en morfología   sanguínea [17].  Eosinopenia  Es  el  término  utilizado  para  indicar  la  disminución,  con  relación  al  valor  mínimo  esperado   para la edad, en el recuento absoluto de los polimorfonucleares eosinófilos [17, 52]. Los eosinófi -  los disminuyen fisiológicamente durante la gestación y especialmente durante el trabajo de parto,   aun con fenómenos de degranulación [57]. La eosinopenia es una alteración muy rara y cuando   está  presente  usualmente  pasa  desapercibida  cuando  el  recuento  diferencial  de  leucocitos  se   hace manualmente sobre 100 leucocitos [17]. La eosinopenia se ha informado en pacientes con   síndrome de Down [58], en pacientes con timoma y aplasia pura de eosinófilos [59], destrucción   autoinmune de eosinófilos y basófilos [60] y en pacientes portadores del virus linfotrópico tipo I   (HTLV-I) [61]. Las causas íntimas por las cuales se presenta eosinopenia son múltiples y para ello   es preferible consultar las tablas que traen los textos clásicos de hematología [17, 52] o revisiones   especializadas [62]. Como en las otras alteraciones cuantitativas de los leucocitos, en todos los   casos en donde hay eosinopenia, sobre todo de los hemogramas tipo V y VI, es necesario com -  pletar el estudio con la observación directa de los leucocitos en extendidos de sangre periférica a   cargo de profesionales debidamente entrenados en morfología sanguínea [17].  Basofilia  Es el término utilizado para indicar el aumento, con relación al valor máximo esperado para la   edad, en el recuento absoluto de los polimorfonucleares basófilos [17]. La presencia de basofilia   en sangre periférica es altamente sugestiva de una enfermedad mieloproliferativa [17, 63]. Las   causas íntimas por las cuales se presenta eosinofilia son múltiples y para ello es preferible consul -  tar las tablas que traen los textos clásicos de hematología [17, 64] o revisiones especializadas [63,   65]. Como en las otras alteraciones cuantitativas de los leucocitos, en todos los casos en donde   hay basofilia, sobre todo de los hemogramas tipo V y VI, sola o asociada con otras alteraciones,   es necesario complementar el estudio con la observación directa de los leucocitos en extendidos   de sangre periférica a cargo de profesionales debidamente entrenados en morfología sanguínea   [17].  Basopenia  Es el término utilizado para indicar la disminución, con relación al valor mínimo esperado, en   el recuento absoluto de los polimorfonucleares basófilos [17]. Como en el caso de la eosinopenia,   la basopenia no se detecta en el recuento diferencial de leucocitos cuando se hace por métodos   manuales y por los métodos electrónicos de las primeras generaciones, en particular en los dife -  renciales de tres partes, en donde el diferencial se hace por impedancia [17], siendo detectable,   en teoría, sólo por los autoanalizadores de hematología de última generación como específica - \nUtilidad clínica del extendido de sangre periférica: los leucocitos  418  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  mente los detectan  e l XE-2100 de Sysmex ®   [23] y el Sapphire de la línea Cell-Dyn ®  de Abbott   Diagnostics [24], entre otros. La basopenia es un indicador de ovulación: cae con la ovulación y   se eleva en la fase luteínica [66] y es un hallazgo relativamente frecuente en la urticaria [67-69].   Las causas íntimas por las cuales se presenta basopenia son diversas y para ello es preferible con -  sultar las tablas que traen los textos clásicos de hematología [17, 64] o revisiones especializadas   [64]. Como en las otras alteraciones cuantitativas de los leucocitos, en todos los casos en donde   hay basopenia, sola o asociada con otras alteraciones, es necesario complementar el estudio con   la observación directa de los leucocitos en extendidos de sangre periférica a cargo de profesiona -  les debidamente entrenados en morfología sanguínea [17].  Linfocitosis  Es el término utilizado para indicar el aumento, con relación al valor máximo esperado para la   edad, en el recuento absoluto de los linfocitos [17]. El recuento de linfocitos no tiene diferencia   por género ni por el grupo étnico [17]. Las causas íntimas por las cuales se presenta linfocitosis   son múltiples y para ello es preferible consultar las tablas que traen los textos clásicos de hema -  tología [17] o revisiones especializadas [70]. Como en las otras alteraciones cuantitativas de los   leucocitos, en todos los casos en donde hay linfocitosis, sola o asociada con otras alteraciones,   es necesario complementar el estudio con la observación directa de los leucocitos en extendidos   de sangre periférica a cargo de profesionales debidamente entrenados en morfología sanguínea   [17].  Linfocitopenia  La linfopenia o más correctamente, la linfocitopenia, es el término utilizado para indicar la   disminución, con relación al valor mínimo esperado para la edad, en el recuento absoluto de los   linfocitos [17]. En los niños, en particular en los recién nacidos, en donde el recuento de linfocitos   es relativamente alto, un recuento por debajo de 2.800 por  μ L es altamente sospechoso de una   inmunodeficiencia combinada severa [71]. No hay que olvidar que la leucopenia es un hallazgo   importante en los pacientes infectados por el virus de la inmunodeficiencia humana y este puede   ser el primer signo de la infección [72]. La linfocitopenia, sola o asociada con alteraciones en los   recuentos de los polimorfonucleares neutrófilos, es un hallazgo muy frecuente y como en los   casos anteriores, las causas íntimas por las cuales se presenta son múltiples y para conocerlas es   preferible consultar las tablas que traen los textos clásicos de hematología [17] o revisiones espe -  cializadas [73]. Como en las otras alteraciones cuantitativas de los leucocitos, en todos los casos   en donde hay linfocitopenia, sola o asociada con otras alteraciones, es necesario complementar   el estudio con la observación directa de los leucocitos en extendidos de sangre periférica a cargo   de profesionales debidamente entrenados en morfología sanguínea [17].  Monocitosis  Es el término utilizado para indicar el aumento, con relación al valor máximo esperado para   la edad, en el recuento absoluto de monocitos [17]. El recuento de monocitos tampoco tiene   diferencia por género ni por el grupo étnico [17]. Los monocitos están elevados en neonatos y en   mujeres gestantes, en donde se elevan paralelos con los polimorfonucleares neutrófilos [17]. Las   causas íntimas por las cuales se presenta monocitosis son múltiples y para ello es preferible con -  sultar las tablas que traen los textos clásicos de hematología [17] o revisiones especializadas [74].   Como en las otras alteraciones cuantitativas de los leucocitos, en todos los casos en donde hay   monocitosis, sola o asociada con otras alteraciones, es necesario complementar el estudio con la   observación directa de los leucocitos en extendidos de sangre periférica a cargo de profesionales   debidamente entrenados en morfología sanguínea [17]. \nCampuzano-Maya G.  419  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  M onocitopenia  Es  el  término  utilizado  para  indicar  la  disminución,  con  relación  al  valor  mínimo  esperado   para la edad, en el recuento absoluto de monocitos [17]. Usualmente, la monocitopenia acom -  paña a otras alteraciones del sistema hematopoyético. Los monocitos disminuyen en pacientes   que reciben corticoesteroides y en pacientes con infecciones agudas, cuando hay endotoxinas   [17]. Las causas íntimas por las cuales se presenta monocitopenia son múltiples y para ello es   preferible consultar las tablas que traen los textos clásicos de hematología [17]. Como en las otras   alteraciones cuantitativas de los leucocitos, en todos los casos en donde hay monocitopenia, sola   o asociada con otras alteraciones, es necesario complementar el estudio con la observación di -  recta de los leucocitos en extendidos de sangre periférica a cargo de profesionales debidamente   entrenados en morfología sanguínea [17].  Alteraciones cualitativas en la morfología de los leucocitos  Se refiere a los hallazgos que se derivan de la observación directa de las células en extendidos   de sangre periférica. Pueden ser congénitos o adquiridos, pueden comprometer una o varias se -  ries, se pueden observar células maduras o inmaduras, pueden ser sintomáticas o asintomáticas,   entre otras características que se analizaran a continuación. Para comprender e identificar opor -  tunamente las alteraciones morfológicas de los leucocitos es indispensable conocer los aspectos   básicos de la leucopoyesis y las características más relevantes de la morfología de los leucocitos,   incluidos los precursores que normalmente no circulan en sangre periférica.   Leucopoyesis  El término de leucopoyesis se refiere al proceso de la producción de los leucocitos a partir de   las células madres hematopoyéticas pluripotentes de la medula ósea.  Granulocitopoyesis  La granulocitopoyesis da como resultado la formación de los granulocitos o polimorfonuclea -  res en sus tres formas: neutrófilos, eosinófilos y basófilos. Como se esquematiza en la  figura 3 , la   granulocitopoyesis se lleva a cabo en la medula ósea a partir de una célula madre pluripotencial.   Desde el punto de vista de las diferentes etapas por las cuales debe pasar una célula madre des -  de que recibe la “orden de producción” de un polimorfonuclear, las células se dividen en dos   grandes compartimentos: (1) el proliferativo, que va desde el mieloblasto hasta la etapa final del   mielocito y (2) el de maduración y almacenamiento, que va desde el metamielocito hasta el po -  limorfonuclear neutrófilo, eosinófilo o basófilo. Las células primitivas, o células madre, son pocas   en número pero gracias a los procesos de mitosis a repetición logran producir un buen número   de células antes de llegar a metamielocitos a partir de los cuales no se pueden multiplicar más.   Es importante conocer con detalle cada uno de estos precursores debido a que en cualquier   momento pueden encontrarse en los extendidos de sangre periférica y si no se conocen es po -  sible que pase desapercibido el diagnóstico, que como en el caso de las leucemias puede tener   consecuencias nefastas.   Mieloblasto  Es la célula más inmadura identificable de la serie mieloide, con un diámetro que varía entre   10 y 18  μ m [75]. Su citoplasma característicamente es azul intenso, a menudo con una zona más   clara a nivel de la región perinuclear, es agranular o puede exhibir escasos gránulos azurófilos   según el grado de desarrollo de la célula; su núcleo, redondo u ovalado, ocupa cerca de las tres   cuartas a cuatro quintas partes de la célula, con la cromatina dispuesta en forma de finas fibras y   de aspecto reticular uniforme que se colorea de intenso rojo purpura con los colorantes de Ro -  manovsky, como la coloración de Wright [75]. El núcleo puede llegar a tener hasta seis nucléolos,   siendo lo usual entre dos y cinco, de tamaño mediano, bien definidos y con un borde de croma - \nUtilidad clínica del extendido de sangre periférica: los leucocitos  420  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  Hematopoyesis  MonocitopoyesisGranulopoyesisEritropoyesisTrombopoyesis  Médula ósea HSC CMP   CLP Linfoblasto  Prolinfocito Célula asesinanatural (NK) Céluladendríticalinfoide Célula dendríticamieloide Macrófago Linfocitob Monocitoa Promonocito MonoblastoPromielocitoeosinófilo  Mielocito eosinófilo  Metamielocito eosinófilo Eosinófilo Promielocitoneutrófilo Mieloblasto Mielocito neutrófilo  Metamielocito neutrófilo Neutrófilo Promielocitobasófilo Mielocito basófilo Metamielocito basófilo Basófilo Mastocito EritrocitoPlaquetas Megacariocito Promegacariocito Megacarioblasto Reticulocito Eritroblasto ortocromático Eritroblasto policromatófilo  Eritroblasto basófilo  Proeritroblasto  Banda   B   anda   Banda Plasmocito Linfocito TLinfocito B  Linfopoyesis  Sangre Tejido  Figura 3.  Hematopoyesis normal. Hematopoyesis en los diferentes compartimentos: medula ósea, sangre periférica y tejido   hematopoyético.  Convenciones: HSC: célula madre hematopoyética; CMP: célula progenitora mieloide común; CLP: célula   progenitora linfoide común. a  Otras células se derivan del monocito: osteoclasto, microglia (sistema nervioso central), célula de Langerhans (epidermis),   célula de Kupffer (hígado).   b  Los linfocitos T y B no se diferencian morfológicamente a menos que se utilicen coloraciones   espec
