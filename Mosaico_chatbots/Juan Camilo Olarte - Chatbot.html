 tamaño, es muy semejante   a su precursor, el mieloblasto, salvo que en su citoplasma se evidencian gránulos azurófilos que   se colorean de azul a púrpura rojiza con los colorantes de Romanovsky, como la coloración de   Wrigth, el núcleo es de aspecto redondeado, usualmente está situado excéntricamente, tiene la   cromatina un poco más gruesa que la del mieloblasto y los nucléolos están menos definidos y   en menor cantidad [75]. En las  figuras   6  y  7  se presentan algunos promielocitos en los cuales se   pueden evidenciar las características más importantes de estas células.  Normalmente, sólo se observan promielocitos en la medula ósea en un porcentaje que oscila   entre el 0,5% y el 5% de los precursores leucocitarios [76, 77]. Cuando en la sangre periférica   hay promielocitos lo más seguro es que se esté frente a un diagnóstico de una leucemia aguda,   en este caso a una leucemia promielocítica aguda, clasificada de acuerdo con la clasificación FAB   (franco-americo-británica) como M3 [78]. Los promielocitos también se observan en la sangre   periférica de pacientes con leucemia linfoide aguda e infiltración de la medula ósea (mieloptisis),   entre otras situaciones clínicas.  Mielocito  Las diferencias de esta célula y su predecesor, el promielocito, aparte de que son más peque -  ños, radican en que los gránulos citoplasmáticos han adoptado su carácter de gránulos especí fi -  Figura  6.    Promielocito  en  la  sangre  periférica  de  un  pa -  ciente  con  diagnóstico  de  leucemia  promielocítica  aguda.   Coloración  de  Wright  utilizando  un  extensor  y  coloreador   de  placas  incorporado  al  autoanalizador  de  hematología   XE-Alpha-N de Sysmex ® , 1.000X.  Figura  7.    Promielocito  en  la  medula  ósea  de  un  paciente   con  diagnóstico  de  leucemia  promielocítica  aguda.  Colo -  ración de Wright utilizando un coloreador de placas incor -  porado  al  autoanalizador  de  hematología  XE-Alpha-N  de   Sysmex ® , 1.000X.  10.0 μm   10.0 μm \nUtilidad clínica del extendido de sangre periférica: los leucocitos  422  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  cos, de acuerdo con las células que formará como neutrófilo, eosinófilo o basófilo, además de   que no posee nucléolos. Su tamaño varía entre 12 y 18  μ m de diámetro, aunque en las etapas   iniciales puede llegar a tener 25  μ m de diámetro; el color del citoplasma va desde celeste, en las   primeras etapas, hasta rosa, en las etapas más maduras, el núcleo es redondo u oval y la croma -  tina se observa como unas gruesas fibras, más teñibles que en el promielocito [75]. En las  figuras    8  y  9  se presentan algunos mielocitos, en los cuales se pueden evidenciar las características más   importantes de estas células.  Normalmente,  los  mielocitos sólo se observan en la medula ósea en un porcentaje que oscila   entre el 5% y el 20% de los precursores leucocitarios [76, 77]. Cuando en la sangre periférica hay   mielocitos, sobre todo cuando se encuentran asociados con leucocitosis o la presencia de otros   precursores mieloides, como mieloblastos, promielocitos y metamielocitos, se debe sospechar el   diagnóstico de una enfermedad mieloproliferativa, en particular, una leucemia mieloide crónica   [80]; los mielocitos también pueden aparecer en el extendido de sangre periférica de pacientes   con infiltración, benigna o maligna (mieloptisis), de la médula ósea y en estos casos es usual que   también se observen eritroblastos y otros precursores medulares, lo que se conoce como reacción   leucoeritroblástica, además de las alteraciones morfológicas relacionadas con los eritrocitos como   la presencia de dacriocitos y esquistocitos [1], entre otras. En la sangre periférica de niños recién   nacidos, ocasionalmente se pueden observar mielocitos u otras formas de células más inmaduras,   sobre todo cuando son niños prematuros, como una posible evidencia de la inmadurez del siste -  ma hematopoyético [85]; también se pueden observar mielocitos y otras células más inmaduras   en pacientes con síndrome mielodisplásico [86].  Metamielocito  A partir de esta célula se pierde el poder mitótico de la célula, por lo que esta etapa también   se conoce como posmitótica o de maduración. El citoplasma de la célula es rosado y contiene los   gránulos propios de la serie. Su tamaño varía entre 10 y 18  μ m, el núcleo se observa un poco más   pequeño que sus antecesores y un tanto más indentado o de aspecto “reniforme”, con tendencia   a ubicarse excéntricamente [75]. En las  figuras   10  y  11  se presentan algunos metamielocitos, en   los cuales se pueden evidenciar las características más importantes de estas células.   Normalmente, sólo se observan metamielocitos en la medula ósea, en un porcentaje que os -  cila entre el 10% al 30% de los precursores leucocitarios [76, 77]. Cuando en la sangre periférica   hay metamielocitos, sobre todo cuando se encuentran asociados a leucocitosis o la presencia de   Figura  8.    Mielocito  en  la  sangre  periférica  de  un  paciente   con  diagnóstico  de  leucemia  mieloide  crónica.  Coloración   de Wright utilizando un extensor y coloreador de placas in -  corporado al autoanalizador de hematología XE-Alpha-N de   Sysmex ® , 1.000X.   Figura  9.    Mielocito  en  la  sangre  periférica  de  un  paciente   con  diagnóstico  de  leucemia  mieloide  crónica.  Coloración   de Wright utilizando un extensor y coloreador de placas in -  corporado al autoanalizador de hematología XE-Alpha-N de   Sysmex ® , 1.000X.   10.0 μm   10.0 μm \nCampuzano-Maya G.  423  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  otros  precursores  mieloides,  como  mieloblastos,  promielocitos  y  metamielocitos,  se  debe  sos -  pechar  el  diagnóstico  de  una  enfermedad  mieloproliferativa,  en  particular  el  de  una  leucemia   mieloide crónica [80]; los metamielocitos también se pueden observar en el extendido de sangre   periférica de pacientes con desviación izquierda [87, 88], como se analizará más adelante.  Banda  Esta célula, también conocida como neutrófilo juvenil, neutrófilo no-segmentado o cayado,   representa la forma más inmadura de los polimorfonucleares circulantes. Su tamaño, que varía   entre 10 y 16  μ m, usualmente es más pequeño que el metamielocito y lo más característico es la   forma de su núcleo en U, intensamente teñible, cuya cromatina es más gruesa y aglomerada que   la del polimorfonuclear maduro [75]. En las  figuras   12  y  13  se presentan algunas bandas en las   cuales se pueden evidenciar las características más importantes de estas células.  Las bandas representan entre el 8% y el 20% de los precursores leucocitarios en la medula   ósea [76, 77] y se encuentran en los extendidos de sangre periférica de individuos normales en   Figura 10.  Metamielocito en la sangre periférica de un pa -  ciente  con  diagnóstico  de  leucemia  mieloide  crónica.  Co -  loración  de  Wright  utilizando  un  extensor  y  coloreador  de   placas  incorporado  al  autoanalizador  de  hematología  XE-  Alpha-N de Sysmex ® , 1.000X.  Figura  11.    Metamielocito  en  paciente  con  síndrome  mie -  lodisplásico. Coloración de Wright utilizando un extensor y   coloreador de placas incorporado al autoanalizador de he -  matología XE-Alpha-N de Sysmex ® , 1.000X.  10.0 μm   10.0 μm  Figura  12.   Banda  en  la  sangre  periférica  de  un  paciente   con  diagnóstico  de  síndrome  mielodisplásico.  Coloración   de Wright utilizando un extensor y coloreador de placas in -  corporado al autoanalizador de hematología XE-Alpha-N de   Sysmex ® , 1.000X.  Figura 13.  Banda en la sangre periférica de un paciente con   diagnóstico de infección bacteriana aguda. Además, en el   citoplasma de la célula se evidencia la presencia de granu -  laciones tóxicas. Coloración de Wright utilizando un exten -  sor  y  coloreador  de  placas  incorporado  al  autoanalizador   de hematología XE-Alpha-N de Sysmex ® , 1.000X.  10.0 μm   10.0 μm \nUtilidad clínica del extendido de sangre periférica: los leucocitos  424  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  un número muy variable, explicable por aspectos técnicos que no son objeto de este módulo,   entre el 3% (0 a 700 por  μ L) [89] y 10% (2.000 por  μ L) [90] y puede llegar hasta 21,5% [91].   Como se analizará en detalle más adelante, las bandas se encuentran aumentadas en pacientes   con procesos infecciosos [87, 88], usualmente asociados con neutrofilia, dando el cuadro hema -  tológico que se conoce como “desviación izquierda” [92].   Polimorfonuclear neutrófilo  El polimorfonuclear neutrófilo es la forma más madura de la serie de los granulocitos neutró -  filos. Su tamaño varía entre 10 y 15  μ m y en su citoplasma rosado hay numerosos gránulos neu -  trófilos, finos, uniformemente distribuidos; su núcleo característicamente es lobular y la cantidad   de lóbulos, que pueden sobreponerse en los extendidos de sangre periférica, están conectados   entre sí por finas fibras de cromatina que se observa aglomerada y compacta, pueden estar ubi -  cados en la parte central o excéntricos [75]. En las  figuras   14  y  15  se presentan algunos polimor -  fonucleares neutrófilos, en los cuales se pueden evidenciar las características más importantes de   estas células.  El recuento de polimorfonucleares neutrófilos en medula ósea oscila entre 7% y 25% [76] y   en sangre periférica entre 1.700 y 8.800 por  μ L [75] pero estos valores pueden variar de acuerdo   con las características demográficas de la población a la cual se le presta el servicio, como clara -  mente se evidencia en la  tabla 1 , previamente citada.  Polimorfonuclear eosinófilo  El polimorfonuclear eosinófilo es una célula de origen mieloide, un poco más grande que el   polimorfonuclear neutrófilo, con un diámetro entre 12 y 17  μ m [52]. A diferencia del neutrófilo,   que tiene más de tres lobulaciones, el eosinófilo usualmente es bilobulado y ocasionalmente   trilobulado [93]; y a diferencia de los neutrófilos, los eosinófilos tienen gránulos esféricos, consis -  tentemente grandes, de color anaranjado, que llenan todo el citoplasma de la célula y le dan su   aspecto característico [93]. En las  figuras   16  a  18  se presentan algunos polimorfonucleares eosi -  nófilos, en los cuales se pueden evidenciar las características más importantes de estas células.   Los eosinófilos son más frágiles que los neutrófilos y a menudo se observan “estallados”, dejando   el núcleo rodeado por gránulos libres, como se observa en la  figura   19 .  El recuento de eosinófilos en medula ósea oscila entre 0,2% y 3% y en sangre periférica debe   estar por debajo de 350 células por  μ L [53] de acuerdo con estándares internacionales, recuento   Figura  14.    Polimorfonuclear  neutrófilo  normal.  Coloración   de Wright utilizando un extensor y coloreador de placas in -  corporado al autoanalizador de hematología XE-Alpha-N de   Sysmex ® , 1.000X.  Figura  15.    Polimorfonuclear  neutrófilo  normal.  Coloración   de Wright utilizando un extensor y coloreador de placas in -  corporado al autoanalizador de hematología XE-Alpha-N de   Sysmex ® , 1.000X.  10.0 μm   10.0 μm \nCampuzano-Maya G.  425  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  qu e puede variar cuando se establecen valores de referencia para una determinada población.   Siendo, como realmente son, células de origen mieloide, además de que comparten caracterís -  ticas con los neutrófilos y los basófilos, los eosinófilos tienen algunas alteraciones morfológicas   que vale la pena conocer. Por ejemplo, se pueden observar hipogranulares e hipergranulares   en pacientes con anemia perniciosa [94], en pacientes con hipersegmentación hereditaria de   los eosinófilos [95, 96], en cromosomopatías como el síndrome de Down [58] y en pacientes   con mielocatesis [97], e hiposegmentados en pacientes con anomalía de Pelger-Huët [93] y en   pacientes con deficiencia de lactoferrina [98]. También se presenta en pacientes con síndrome   mielodisplásico [86], en pacientes con mielofibrosis idiopática [99] y en la eosinofilia reactiva   [100]. Los eosinófilos también pueden presentar cuerpos de Barr y núcleos en forma de anillo,   en situaciones y condiciones similares a las que se pueden presentar en el caso de los neutrófilos   [93].  Polimorfonuclear basófilo  Como en el caso anterior, para llegar a esta célula madura, esta serie pasa por las mismas   etapas del neutrófilo y del eosinófilo. El tamaño de los basófilos varía entre 14 y 15  μ m, su cito -  Figura  16.    Mielocito  eosinófilo  en  la  medula  ósea  de  un   paciente  con  diagnóstico  de  síndrome  hipereosinofílico.   Coloración  de  Wright  utilizando  un  coloreador  de  placas   incorporado  al  autoanalizador  de  hematología  XE-Alpha-N   de Sysmex ® , 1.000X.  Figura 17.  Metamielocito eosinófilo en la sangre periférica   de un paciente con diagnóstico de síndrome hipereosinofí -  lico. Coloración de Wright utilizando un extensor y colorea -  dor de placas incorporado al autoanalizador de hematolo -  gía XE-Alpha-N de Sysmex ® , 1.000X.  10.0 μm   10.0 μm  Figura  18.    Polimorfonuclear  eosinófilo  normal  en  sangre   periférica.  Coloración  de  Wright  utilizando  un  extensor  y   coloreador de placas incorporado al autoanalizador de he -  matología XE-Alpha-N de Sysmex ® , 1.000X.  Figura  19.    Polimorfonuclear  eosinófilo  (normal)  estallado.   Coloración de Wright utilizando un extensor y coloreador de   placas  incorporado  al  autoanalizador  de  hematología  XE-  Alpha-N de Sysmex ® , 1.000X.  10.0 μm   10.0 μm \nUtilidad clínica del extendido de sangre periférica: los leucocitos  426  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  plasma  es de col or rosa, contiene grandes grá -  nulos que ocupan la mayoría de la célula [75].   El núcleo, que usualmente no es visible debido   a que lo cubren los gránulos específicos, suele   ser bilobulado. En las  figuras   20  a  22  se pre -  sentan  algunos  polimorfonucleares  basófilos,   en los cuales se pueden evidenciar las caracte -  rísticas más importantes de estas células.  El recuento de polimorfonucleares basófi -  los en medula ósea oscila entre 0,0% y 0,5%   [76] y en sangre periférica entre 0 y 150 por   μ L [64]. Como en los casos anteriores, los po -  limorfonucleares basófilos pueden tener alte -  raciones  morfológicas  que  en  determinado   momento  son  de  utilidad  para  establecer  un   diagnóstico; por ejemplo, se puede encontrar basófilos con citoplasma hipogranular en pacientes   con síndromes mieloproliferativos y en pacientes con síndrome mielodisplásico [93]. También   se puede observar hipogranularidad de los basófilos durante la fase aguda de procesos alérgicos   agudos como la urticaria y el shock anafiláctico [93], en estados de hiperlipidemia posprandial   [93] y como artefacto de laboratorio debido a que los gránulos específicos de los basófilos son so -  lubles al agua y pueden ser destruidos durante la coloración si no se siguen estrictamente buenas   prácticas de laboratorio. Las descripciones de las alteraciones del núcleo de los basófilos son muy   pocas debido a la dificultad para visualizarlos porque están cubiertos con los gránulos específicos   de la célula, como ya se ha expresado.  Otras alteraciones cualitativas de los polimorfonucleares  Aparte de las alteraciones de los granulocitos, hasta ahora analizadas, que en su mayoría se   han referido a las desviaciones en los valores de referencia esperados para cada una de las célu -  las, los polimorfonucleares pueden tener otras alteraciones que vale la pena analizar con mayor   detalle, clasificándolas de acuerdo con el sitio en donde mejor se expresan.  Figura 20.  Promielocito basófilo en la medula ósea de un   paciente  con  diagnóstico  de  leucemia  mieloide  crónica.   Coloración  de  Wright  utilizando  un  coloreador  de  placas   incorporado al autoanalizador de hematología XE-Alpha-N   de Sysmex ® , 1.000X.  Figura 22.  Polimorfonuclear basófilo normal en sangre pe -  riférica. Coloración de Wright utilizando un extensor y colo -  reador de placas incorporado al autoanalizador de hemato -  logía XE-Alpha-N de Sysmex ® , 1.000X.  10.0 μm  10.0 μm  Figura 21.  Mielocito basófilo en la medula ósea de un pa -  ciente  con  diagnóstico  de  leucemia  mieloide  crónica.  Co -  loración  de  Wright  utilizando  un  coloreador  de  placas  in -  corporado al autoanalizador de hematología XE-Alpha-N de   Sysmex ® , 1.000X.  10.0 μm \nCampuzano-Maya G.  427  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  Alteraciones relacionadas con la interacción de los polimorfonucleares con   otras células  Agregación de neutrófilos  Los p olimorfonucleares neutrófilos se pue -  den agregar entre sí, con o sin agregación con -  comitante de plaquetas, como resultado de su   interacción  in vitro  con el EDTA utilizado como   anticoagulante. Se ha observado que este fe -  nómeno,  mucho  menos  frecuente  que  la   aglutinación de plaquetas, es dependiente del   tiempo [10], de ahí la importancia de hacer el   estudio tan pronto como sea posible. También   se ha observado agregación de neutrófilos en   pacientes con mononucleosis infecciosa [101],   en  infecciones  bacterianas  agudas,  en  enfer -  medades autoinmunes y en algunos pacientes   con anticuerpos al frío, con coexistencia de au -  toaglutinación de glóbulos rojos. La agregación   de neutrófilos puede dar una seudoneutrope -  nia si no se tiene precaución y no se piensa en   esta posibilidad, de ahí la necesidad de revisar   todas  las  placas  cuando  los  autoanalizadores   de  hematología  muestran  desviaciones  de  los  valores  esperados  o  alarmas.  En  la    figura  23   se   muestra un caso de autoaglutinación de neutrófilos por EDTA en el cual también se presenta   coincidentemente un fenómeno de satelitismo plaquetario.  Alteraciones relacionadas con el núcleo de los polimorfonucleares   Número de lobulaciones  Los  neutrófilos  se  pueden  clasificar  de   acuerdo con el grado de maduración que se   expresa por el número de lobulaciones del nú -  cleo. En estado de normalidad, se espera que   las bandas, los neutrófilos más jóvenes en la   sangre periférica, estén entre 2 y 3 por  μ L y   que el resto de polimorfonucleares neutrófilos   tenga entre dos y cinco lobulaciones [75]. De   acuerdo con el grado de maduración de los po -  limorfonucleares neutrófilos, tradicionalmente   se han definido dos figuras hematológicas: la   desviación izquierda y la desviación derecha   de los granulocitos que se esquematiza en la   figura 24 .   Desviación izquierda  En  la  desviac ión  izquierda  característica -  mente hay aumento de bandas, y otras formas   menos maduras como metamielocitos, mielo -  Mieloblasto Promielocito Mielocito Metamielocito Banda Granulocito con 2 lóbulos Granulocito con 3 lóbulos Granulocito con 4 lóbulos Granulocito con 5 lóbulos Granulocito con más de 5 lóbulos Anemia perniciosa  Desviación a la derechaDesviación a la izquierda  Infección severa Distribución normalLeucemia mieloide  50  40  30  20  10 0  Figura  24.  Representación esquemática de los  conceptos   de desviación izquierda y desviación derecha.  Figura  23.    Aglutinación  de  neutrófilos  por  EDTA.  Además   de la aglutinación de los leucocitos, en el extendido de san -  gre  periférica  se  observa  satelitismo  plaquetario  concomi -  tante asociado también con el EDTA. Coloración de Wright   utilizando un extensor y coloreador de placas incorporado   al autoanalizador de hematología XE-Alpha-N de Sysmex ® ,   1.000X.  10.0 μm \nUtilidad clínica del extendido de sangre periférica: los leucocitos  428  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  citos y promielocitos, y clásicamente se ha asociado con Infecciones incluida la sepsis neonatal   [102] y la tuberculosis [103], con intoxicaciones por plomo, benzol, en pacientes con síndromes   urémicos, con hemopatías (anemia aplástica, policitemia, agranulocitosis, leucemia mieloide y en   las neoplasias sobreinfectadas [92] en la fiebre por quinidina [104] y en pacientes con síndrome   de Down [105, 106]. Los problemas de la desviación izquierda en la aplicación clínica se deri -  van de que sólo estaría disponible con los recuentos diferenciales de leucocitos que tienen una   gran variabilidad derivada de las variaciones interobservadores [107], la imprecisión del recuento   manual por distribución no uniforme en los extendidos de sangre periférica [91], consumen   mucho tiempo de personal profesional, no están disponibles en ninguno de los autoanalizadores   de hematología hasta ahora desarrollados y al momento de determinar su utilidad clínica no son   costo eficientes [92]. Además, para agravar las limitaciones del recuento de bandas como prueba   de laboratorio, falta de estandarización que permita separar claramente las bandas de los neu -  trófilos a pesar de las esfuerzos de la comunidad científica para lograrlo desde 1948 [108-110],   los valores de referencia oscilan en un rango muy amplio, entre 3% (0 a 700 por  μ L) [89] y 10%   (2.000 por  μ L) [90] y puede llegar hasta 21,5% [91] y está influenciado por las variaciones étnicas   y con la edad [12].  De otro lado, el recuento diferencial de leucocitos derivado de los autoanalizadores de he -  matología,  especialmente  los  de  las  últimas  generaciones,  sólo  determinan  cinco  poblaciones:   polimorfonucleares neutrófilos (incluidas las bandas), polimorfonucleares eosinófilos, polimorfo -  nucleares basófilos, linfocitos y monocitos y alarmas cuando las células nucleadas como eritro -  blastos u otras células blancas no son clasificables dentro de los cinco grupos antes citados, para   que el operador las defina, tras la observación del extendido de sangre periférica [111, 112]. Para   concluir, el recuento de bandas es una prueba que se mantiene en la mente de los profesionales   de la salud, más por una tradición clínica que por una verdadera utilidad en el diagnóstico de   las enfermedades infecciosas que se le atribuye [92]; en otras palabras, es una prueba obsoleta   que debería desaparecer de los portafolios de servicios de los laboratorios clínicos, para dar paso   a pruebas o parámetros de mayor eficiencia clínica, como el índice de granulocitos inmaduros   como se analizará a continuación.  Índice de granulocitos inmaduros.   Hasta que éstos se incorporaron a los autoanalizadores de   hematología, para tener un estudio de granulocitos inmaduros era necesario tener un citómetro   de flujo [113]. Con el tiempo y gracias al desarrollo de los autoanalizadores de hematología se ge -  neró un nuevo parámetro: el de los granulocitos inmaduros para referirse a la presencia en sangre   periférica de metamielocitos, mielocitos y promielocitos, inicialmente aplicado en el diagnóstico   de la sepsis neonatal, teniendo en cuenta el recuento total de granulocitos, los granulocitos inma -  duros y la relación granulocitos inmaduros: granulocitos totales [114]. El aumento de los granu -  locitos inmaduros en la sangre periférica es de importancia en el diagnóstico de enfermedades   hematológicas, especialmente las origen maligno y en procesos infecciosos, la incorporación al   hemograma de rutina del índice de granulocitos inmaduros es de gran importancia para la tami -  zación y diagnóstico temprano de enfermedades malignas con compromiso de los precursores   mieloides y las infecciones [115, 116] y es así como algunos de los autoanalizadores de la última   generación como el XE-2100 de Sysmex ® , lo han incorporado como un parámetro en investiga -  ción que gracias al software especialmente desarrollado (XE-IG Master ® ) permite entregar al mé -  dico el resultado del estudio [117, 118]. El índice de granulocitos inmaduros sin ser equivalente   al recuento de bandas, es un indicador de infección y/o estímulo de los granulocitos a nivel de   la medula ósea, sobre todo en los casos de sepsis, en donde el diagnóstico oportuno es de vital   importancia para evitar un desenlace fatal [119]. En la  figura 25  se muestran los citogramas que   permiten identificar los granulocitos inmaduros como parte integral de un hemograma tipo VI.  Desviación derecha  Contario a lo observado en la desviación izquierda, en donde predominan las formas menos   maduras de los granulocitos, en la desviación derecha, hay un mayor número de polimorfonu - \nCampuzano-Maya G.  429  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  cleares neutrófilos con más de cinco lobulaciones, también conocidos como macropolicitos Des -  de el punto de vista práctico, se considera que hay desviación derecha cuando los macropolicitos   representan más del 5% de los polimorfonucleares neutrófilos. Vale la pena anotar que ninguno   de  los  autoanalizadores  de  hematología  determina  la  presencia  de  macropolicitos,  los  cuales   quedan incluidos en el recuento de polimorfonucleares neutrófilos donde realmente deberían   estar. Como se analizará en el subtítulo siguiente, aparte de la anemia perniciosa en donde los   macropolicitos se han incluido como un criterio para su diagnóstico [94, 120, 121], son otras las   circunstancias  en  las  cuales  se  puede  observar  aumento  de  macropolicitos,  esto  es,  deviación   derecha de los granulocitos.  Macropolicito  El macropolicito o pleocariocito se define como un polimorfonuclear neutrófilo que tiene un   tamaño aproximado del doble del polimorfonuclear neutrófilo normal, esto es, con un diámetro   de 15 a 25  μ m y núcleo hipersegmentado, con más de cinco lobulaciones. Como ya se ha expre -  sado, los macropolicitos característicamente se observan en pacientes con anemia perniciosa [94,   120, 121], pero también se pueden observar en individuos normales que los heredan en forma   autosómica dominante [122] y en pacientes con síndrome mielodisplásico [86], con síndrome   de DiGeorge [122] y tras la administración de G-CSF [123, 124] y esteroides, por ejemplo en el   tratamiento de la púrpura trombocitopénica idiopática [125]. También se pueden observar en   pacientes con anemia ferropénica [126], especialmente cuando hay deficiencia de otras vitami -  nas, en particular las relacionadas con el complejo B y el ácido fólico. La hipersegmentación de   los neutrófilos también puede obedecer a un desorden hereditario autosómico dominante [127]   y en la mielocatesis, un trastorno hereditario caracterizado por neutropenia y alteraciones en las   lobulaciones de los polimorfonucleares neutrófilos [128, 129], íntimamente relacionada con el   síndrome de WHIM (por  warts, hypogammaglobulinemia, recurrent bacterial infection, and mye -  lokathexis ) [97]. Algunos macropolicitos pueden ser binucleados, usualmente gigantes y tetraploi -  des, como sucede en pacientes infectados por el virus de la inmunodeficiencia humana [72]. En   las  figuras   26  y  27  se presentan algunos macropolicitos, en los cuales se pueden evidenciar las   características más importantes de estas células.  L M N B  I N+B   E  Figura 25.  Granulocitos inmaduros. En el panel de la izquierda se observan los granulocitos inmaduros, marcados por un   óvalo, de un paciente con un índice de granulocitos inmaduros de 12%, en tanto que el panel derecho corresponde al índice   de granulocitos inmaduros de un paciente normal.  Convenciones: I: granulocitos inmaduros . Sysmex ®  XE-2100.  L M N B  I N+B   E \nUtilidad clínica del extendido de sangre periférica: los leucocitos  430  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  Anomalía de Pelger-Huët  La anoma lía de Pelger-Huët es una alteración benigna de los leucocitos que se hereda en   forma dominante no ligada al sexo, caracterizada por una morfología particular en los núcleos de   los leucocitos, mejor observada en los polimorfonucleares neutrófilos, en los cuales la segmenta -  ción nuclear está claramente reducida, situación que también puede comprometer los polimor -  fonucleares, los linfocitos y los monocitos [130]. La incidencia de esta anomalía, de acuerdo con   varios estudios, oscila entre uno por cada 1.000 a uno por cada 10.000 personas [131]. La ano -  malía de Pelger-Huët originalmente se observó en personas procedentes de Holanda, Alemania y   Suiza, pero también se ha observado en personas de origen asiático o africano [131]; en nuestro   medio  no  hay  informes  disponibles  y  los  casos  observados  se  presentan  como  una  curiosidad   médica aislada. La importancia de identificar oportuna y adecuadamente la anomalía de Pelger-  Huët radica en que ésta se puede confundir con una desviación izquierda [132, 133], como la   que usualmente se observa en los procesos infecciosos de origen bacteriano [134]. El estudio de   medula ósea, que no es necesario para establecer el diagnóstico, muestra que los precursores   mieloides son normales hasta el mielocito [131]. Además, las células con la anomalía de Pelger-  Huët son funcionalmente adecuadas [135, 136] y en consecuencia pueden fagocitar y matar los   microorganismos [137] y la sobrevida de estas células es similar a las células de la misma estirpe   libres de la anomalía, tanto en humanos [138] como en perros [139], en los cuales también se ha   descrito la anomalía. En las  figuras   28  y  29  se presentan algunos polimorfonucleares neutrófilos   con anomalía de Pelger-Huët, en los cuales se pueden evidenciar las características más impor -  tantes de estas células.  Seudoanomalía de Pelger-Huët  La seudoanomalía de Pelger-Huët, también conocida como anomalía adquirida de Pelger-  Huët, como su nombre lo anticipa, es una forma no hereditaria de la anomalía de Pelger-Huët   [131, 140]. La seudoanomalía de Pelger-Huët se ha observado en varias situaciones clínicas,   entre las cuales se incluyen el mixedema [141], la enteritis aguda, la agranulocitosis, el mielo -  ma múltiple y la malaria; también se puede observar en reacciones leucemoides secundarias a   metástasis a medula ósea [131], en pacientes con hipersensibilidad a medicamentos [140, 142,   143], en pacientes con leucemia mieloide, aguda o crónica [144], en pacientes con metaplasia   mieloide agnogénica [145], en pacientes con síndrome mielodisplásico [146] y en pacientes con   leucemia linfoide crónica [147], entre otras. En las  figuras   30  y  31  se presentan algunos polimor -  Figura 26.  Macropolicitos en la sangre periférica de un pa -  ciente  con  diagnóstico  de  anemia  perniciosa.  Coloración   de  Wright  utilizando  un  extensor  y  coloreador  de  placas   incorporado  al  autoanalizador  de  hematología  XE-Alpha-N   de Sysmex ® , 1.000X.  Figura 27.  Macropolicito en la sangre periférica de un pa -  ciente  con  diagnóstico  de  un  síndrome  mielodisplásico.  Coloración  de  Wright  utilizando  un  extensor  y  coloreador   de  placas  incorporado  al  autoanalizador  de  hematología   XE-Alpha-N de Sysmex ® , 1.000X.  10.0 μm   10.0 μm \nCampuzano-Maya G.  431  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  fonucleares neutrófilos con seudoanomalía de   Pelger-Huët, en los cuales se pueden eviden -  ciar las características más importantes de estas   células.  Neutrófilos necrobióticos  Los  neutrófilos  necrobióticos  se  pueden   observar en los extendidos de sangre periféri -  ca debido a que corresponden a fenómenos   de apoptosis, como parte integral de la muerte   programada de la célula. Cuando estas célu -  las  se  encuentran  aumentadas,  la  mayoría  de   las veces se explican por  procesos infecciosos   [148], pero también se pueden ver en pacien -  tes con leucemia mieloide aguda [149], en los    sín dromes dismielopoyéticos [86] y en pacien -  Figura 28.  Anomalía de Pelger-Huët. Coloración de Wright   utilizando un extensor y coloreador de placas incorporado   al autoanalizador de hematología XE-Alpha-N de Sysmex ® ,   1.000X.  Figura  29.    Anomalía  de  Pelger-Huët.  Mayor  detalle  de  un   polimorfonuclear  neutrófilo  afectado  por  la  anomalía.  Co -  loración  de  Wright  utilizando  un  extensor  y  coloreador  de   placas  incorporado  al  autoanalizador  de  hematología  XE-  Alpha-N de Sysmex ® , 1.000X.  Figura  30.    Seudoanomalía  de  Pelger-Huët  en  un  paciente   con  diagnóstico  de  leucemia  mieloide  crónica.  Coloración   de Wright utilizando un extensor y coloreador de placas in -  corporado al autoanalizador de hematología XE-Alpha-N de   Sysmex ® , 1.000X.  Figura  31.    Seudoanomalía  de  Pelger-Huët  en  un  pacien -  te  con  diagnóstico  de  un  proceso  infeccioso  agudo.  Co -  loración  de  Wright  utilizando  un  extensor  y  coloreador  de   placas  incorporado  al  autoanalizador  de  hematología  XE-  Alpha-N de Sysmex ® , 1.000X.  10.0 μm   10.0 μm  10.0 μm 10.0 μm  Figura 32.  Cambios necrobióticos en el núcleo de un poli -  morfonuclear neutrófilo. Coloración de Wright utilizando un   extensor y coloreador de placas incorporado al autoanaliza -  dor de hematología XE-Alpha-N de Sysmex ® , 1.000X.  10.0 μm \nUtilidad clínica del extendido de sangre periférica: los leucocitos  432  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  tes con anemia perniciosa (deficiencia de vitamina B 12 ) [150]. Una causa frecuente, pero poco   referenciada, de necrobiosis de los polimorfonucleares neutrófilos es la relacionada con el tiem -  po que permanecen las muestras en los laboratorios clínicos antes de ser procesadas, situación   que se puede detectar a partir de las dos primeras horas en que la muestra permanece a tempe -  ratura ambiente en el laboratorio clínico [93], como frecuentemente sucede, sobre todo en los   laboratorios clínicos con sobrecarga de trabajo o poco personal. En la  figura   32  se presenta un   polimorfonuclear neutrófilo con cambios necrobióticos.  Alteraciones relacionadas con el citoplasma de los polimorfonucleares  La mayoría de estas alteraciones están relacionadas con modificaciones en el número y as -  pecto de los gránulos específicos de las células, la presencia de gránulos anormales, inclusiones   intracitoplasmáticas y la presencia de vacuolas.  Reducción de los gránulos específicos  La reducción de los gránulos específicos de los neutrófilos se presenta por múltiples causas,   entre las cuales se incluyen algunas de tipo congénito como la ausencia de los gránulos específicos   en la deficiencia de lactoferrina, situación que se acompaña de infecciones bacterianas a repeti -  ción [151] y en enfermedades adquiridas, como en los síndromes mielodisplásicos, en donde se   acompaña de alteraciones en la segmentación nuclear [86] y en los pacientes infectados por el vi -  rus de la inmunodeficiencia humana [72], en donde, como en el caso de la deficiencia de lactofe -  rrina, puede aumentar la posibilidad de enfermedades bacterianas y después de la administración   de G-CSF [152]. En las  figuras   33  y  34  se presentan algunos polimorfonucleares hipogranulares,   en los cuales se pueden evidenciar las características más importantes de estas células.  Aumento de los gránulos específicos  La más frecuente de estas alteraciones es la conocida como “granulaciones tóxicas”, en donde   los gránulos del neutrófilo se observan de mayor tamaño y más basofílicos (oscuros) debido a la   presencia de abundantes mucosustancias ácidas presentes en el citoplasma de la célula [153]. Si   bien las granulaciones tóxicas se asocian con procesos infecciosos [134, 154], éstas también se   pueden observar en mujeres embarazadas [155], en pacientes con malaria en donde se correlacio -  na con el pronóstico [156] y en pacientes que reciben terapia con citoquinas (G-CFS y GM-CSF)   [157]. En las  figuras   35  y  36  se presentan algunos polimorfonucleares neutrófilos hipergranulares,   en los cuales se pueden evidenciar las características más importantes de estas células.  Figura  34.   Polimorfonuclear  basófilo  hipogranular  en  la   sangre periférica de un paciente con diagnóstico de un sín -  drome dismielopoyético. Coloración de Wright utilizando un   extensor y coloreador de placas incorporado al autoanaliza -  dor de hematología XE-Alpha-N de Sysmex ® , 1.000X.  Figura 33.  Polimorfonuclear neutrófilo agranular en la san -  gre periférica de un paciente con diagnóstico de un síndro -  me  dismielopoyético.  Coloración  de  Wright  utilizando  un   extensor  y  coloreador  de  placas  incorporado  al  autoanali -  zador de hematología XE-Alpha-N de Sysmex ® , 1.000X.  10.0 μm   10.0 μm \nCampuzano-Maya G.  433  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  Presencia de gránulos anormales  En el citoplasma de los polimorfonucleares, más visibles en los neutrófilos, se pueden observar   gránulos, inclusiones o vacuolas que pueden ser la primera manifestación de una enfermedad. A   continuación se analizarán las de mayor impacto clínico.  Anomalía de May-Hegglin  La anomalía de May-Hegglin es un desorden raro, de tipo hereditario dominante, caracteriza -  do por la presencia de inclusiones basofílicas y pironinifílicas en el citoplasma, bien definidas, de   un tamaño de 2 a 5  μ m que se presentan en los granulocitos (neutrófilos, eosinófilos y basófilos) y   en los monocitos que se acompañan de otras alteraciones como la presencia de trombocitopenia   y plaquetas gigantes poco granuladas [158]. Las inclusiones en los neutrófilos en la anomalía de   May-Hegglin son similares en apariencia a los cuerpos de Döhle, pero usualmente son más gran -  des, más redondas y discretas, y usualmente están presentes en un alto porcentaje de las células   [159]. A diferencia de los cuerpos de Döhle, que son reactivos, las inclusiones de May-Hegglin   son  constitucionales  [160]  y  están  compuestas  por  formas  mutantes  de  miosina  no  muscular   [161]. La identificación de esta alteración debe llamar la atención a quien analiza el extendido de   sangre periférica y a quien se le informa, para sospechar, entre otras, una macrotrombocitopenia   hereditaria [162].   Cuerpos de Döhle  Los cuerpos de Döhle son inclusiones pequeñas de azul o gris pálido que aparecen en el   citoplasma de los neutrófilos, únicas o múltiples usualmente localizadas en la periferia de las cé -  lulas, miden entre 1 y 2  μ m de diámetro, pero pueden llegar a tener hasta 5  μ m de diámetro [93,   160] que corresponden a restos de ácido ribonucleico nuclear que se produce por maduración   defectuosa secundaria al aumento de las demandas, como sucede en los procesos infecciosos.   Desde el punto de vista técnico, los cuerpos de Döhle se observan mejor en extendidos de san -  gre periférica sin anticoagulante [93]. La presencia de cuerpos de Döhle en individuos normales   es muy rara: 0,1% [163]. Los cuerpos de Döhle se observan en mujeres embarazadas [164],   en pacientes con infecciones e inflamaciones y tras la aplicación de citoquinas, en particular   G-CSF y GM-CSF [93]; también se han descrito en pacientes con anemia perniciosa, síndrome   mielodisplásico, policitemia rubra vera, anemia hemolítica autoinmune, en pacientes quemados   [165], con granulomatosis de Wegener y en pacientes que reciben medicamentos antineoplási -  Figura  35.    Granulaciones  tóxicas  en  un  polimorfonuclear   neutrófilo de un paciente con diagnóstico de infección bac -  teriana aguda. Coloración de Wright utilizando un extensor   y  coloreador  de  placas  incorporado  al  autoanalizador  de   hematología XE-Alpha-N de Sysmex ® , 1.000X.  Figura  36.    Granulaciones  tóxicas  en  un  polimorfonuclear   neutrófilo de un paciente con diagnóstico de infección bac -  teriana aguda. Coloración de Wright utilizando un extensor   y  coloreador  de  placas  incorporado  al  autoanalizador  de   hematología XE-Alpha-N de Sysmex ® , 1.000X.  10.0 μm   10.0 μm \nUtilidad clínica del extendido de sangre periférica: los leucocitos  434  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  cos, como la  ciclofosfamida [163]. En la  figura   37  se muestra un polimorfonuclear neutrófilo   con cuerpos de Döhle.  Síndrome de Chédiak-Higashi  El síndrome de Chédiak-Higashi, rara en -  fermedad  de  carácter  autosómico  recesivo,   se caracteriza por un defecto en la formación   de lisosomas, que se presenta con albinismo   óculo-cutáneo  parcial,  anormalidades  neuro -  lógicas,  infecciones  bacterianas  a  repetición,   episodios  febriles  intermitentes  y  la  presencia   de  gránulos  prominentes  en  los  leucocitos  y   en  todas  las  células  que  contienen  gránulos   [166-168], que de acuerdo con estudios ul -  traestructurales,  con  la  ayuda  de  microscopía   electrónica, corresponden a la fusión anormal   de lisosomas que constituyen lisosomas gigan -  tes [169, 170]. Esta anormalidad en los poli -  morfonucleares neutrófilos llevan a trastornos   quimiotáxicos, con retardo en la destrucción   de  bacterias  fagocitadas  [171].  La  importan -  cia de identificar la enfermedad radica en la   posibilidad de ser tratada con un trasplante de   medula ósea que la podría curar [168, 172].   En la  figura   38 , se muestra un neutrófilo de un   paciente con síndrome de Chédiak-Higashi, en   el cual se pueden evidenciar las características   más importantes de estas células.  Anomalía de Alder-Reilly  La anomalía de Alder-Reilly es una altera -  ción  hereditaria  en  forma  autosómica  recesi -  va, caracterizada por la presencia de gránulos   azurófilos agrupados en forma de racimo en el   citoplasma de los granulocitos, monocitos y linfocitos. Se diferencian de las granulaciones tóxi -  cas porque se presentan en otras células diferentes a los polimorfonucleares neutrófilos y por la   ausencia de vacuolas tóxicas. La anomalía de Alder-Reilly se asocia con las mucopolisacaridosis.   Desde el punto de vista clínico, la anomalía de Alder-Reilly no interfiere con las funciones propias   de las células en donde se presentan [93]. La anomalía de Alder-Reilly se presenta asociada con   el síndrome de Hunter [173] y la polidistrofia de Maroteaux-Lamy [174]. También se presenta   asociada, como una forma adquirida, con algunas variantes de leucemia aguda [175] y con el   síndrome mielodisplásico [176]. En la  figura     39   se  presentan  algunos  leucocitos  con  anomalía   de Alder-Reilly, en los cuales se pueden evidenciar las características más importantes de esta   anomalía.  Cuerpos de Auer  Los cuerpos de Auer, son gránulos intracitoplasmáticos, de forma alargada, que se encuentran   en  mieloblastos,  promielocitos  y  monoblastos  en  pacientes  con  leucemia  mielobástica  aguda   [177, 178], leucemia promielocítica aguda [179], leucemia mielomonocítica aguda y en la crisis   blástica de la leucemia mieloide crónica [180]. También se pueden observar en pacientes con   síndrome mielodisplásico, anemia refractaria con exceso de blastos [93], algunos casos de leu -  Figura 38.  Polimorfonuclear neutrófilo con inclusiones típi -  cas del síndrome de Chédiak-Higashi. Coloración de Wright   utilizando un extensor y coloreador de placas incorporado   al autoanalizador de hematología XE-Alpha-N de Sysmex ® ,   1.000X.  Figura  37.    Cuerpos  de  Döhle  en  sangre  periférica  de  un   paciente con diagnóstico de una infección bacteriana. Co -  loración  de  Wright  utilizando  un  extensor  y  coloreador  de   placas  incorporado  al  autoanalizador  de  hematología  XE-  Alpha-N de Sysmex ® , 1.000X.  10.0 μm  10.0 μm \nCampuzano-Maya G.  435  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  cemia linfoblástica aguda [181] y en mieloma   múltiple [182]. Los cuerpos de Auer también   se  han  informado  en  células  maduras,  inclui -  dos  los  polimorfonucleares,  como  una  expre -  sión de un clon neoplásico [183-185]. En la  fi -  gura   40  se muestra un mieloblasto con cuerpo   de Auer.  Vacuolización de los   polimorfonucleares  Las vacuolas de los neutrófilos se pueden   presentar  como  resultado  de  la  fusión  de  los   gránulos  específicos  con  vacuolas  fagocíticas   [93] y usualmente se observan en pacientes   con infecciones; también se han observado en   pacientes con intoxicación con etanol [186] y   en los pacientes con la enfermedad de Jordan,   en donde hay vacuolas de grasa [187, 188].   También se acumula en estas células material   relacionado  con  triglicéridos  y  cadenas  largas   de lípidos en el síndrome de Dorfman-Chana -  rin [189, 190] y en pacientes con mielocatesis   [129]. En la  figura 41  se muestra un polimor -  fonuclear neutrófilo vacuolado. Otra forma de   vacuolización de los leucocitos es la vacuoliza -  ción familiar de los leucocitos, anomalía que   será analizada a continuación  Vacuolización familiar de los leucocitos  La vacuolización familiar de los leucocitos   o enfermedad de Jordan es una anomalía ex -  tremadamente  rara,  no  informada  en  el  me -  dio,  caracterizada  por  la  presencia  de  3  a  10   vacuolas, de 2 a 5  μ m, en el citoplasma de los   granulocitos,  los  monocitos  y  ocasionalmente   de los linfocitos y los plasmocitos [191, 192].   Los estudios de histoquímica y fluorescencia   han demostrado que las vacuolas contienen   lípidos [193]. Las vacuolas de esta anomalía se   deben distinguir de las que se presentan en pa -  cientes con infecciones graves, hepatitis tóxica   y cetoacidosis diabética. Se ha observado que   los pacientes con la anomalía de Jordan pue -  den  desarrollar  distrofia  muscular  progresiva   [187] e ictiosis [187, 191].   Inclusiones citoplasmáticas   exógenas  En  el  citoplasma  de  los  polimorfonuclea -  res  neutrófilos  es  posible  observar,  aunque   con baja frecuencia, material fagocitado que   Figura  40.   Cuerpo  de  Auer  en  mieloblasto  en  la  medula   ósea de un paciente con diagnóstico de una leucemia mie -  loide aguda. Coloración de Wright utilizando un coloreador   de  placas  incorporado  al  autoanalizador  de  hematología   XE-Alpha-N de Sysmex ® , 1.000X.  Figura  39.    Anomalía  de  Alder-Reilly  en  un  paciente  con   diagnóstico  de  síndrome  mielodisplásico.  Coloración  de   Wright utilizando un extensor y coloreador de placas incor -  porado  al  autoanalizador  de  hematología  XE-Alpha-N  de   Sysmex ® , 1.000X.  10.0 μm  10.0 μm  Figura 41.  Vacuolas en polimorfonuclear neutrófilo en san -  gre periférica de un paciente con malaria por plasmodium   vivax.  Coloración  de  Wright  utilizando  un  extensor  y  colo -  reador de placas incorporado al autoanalizador de hemato -  logía XE-Alpha-N de Sysmex ® , 1.000X.  10.0 μm \nUtilidad clínica del extendido de sangre periférica: los leucocitos  436  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  contiene  mic roorganismos,  células,  sustancias   como  crioproteínas  [194],  cristales  de  cisti -  na  en  pacientes  con  cistinosis,  especialmente   cuando las células son estudiadas con contras -  te de fase, grandes inclusiones citoplasmáticas   en la intoxicación por colchicina [195] y hemo -  siderina en pacientes con talasemia mayor con   sobrecarga  de  hierro  y  en  septicemia,  espe -  cialmente cuando se utilizan autoanalizadores   de hematología que los identifican falsamente   como eosinófilos [196]. En pacientes con me -  lanoma se ha observado que los polimorfo -  nucleares neutrófilos fagocitan melanina [93]   y  cuando  hay  hiperbilirrubinemia  importante   pueden  observarse  cristales  de  bilirrubina,  fe -  nómeno que se produce  in vitro  tras dejar en   reposo la sangre por más de 30 minutos [197].   También en el citoplasma de los polimorfonu -  cleares  se  pueden  observar  bacterias,  hongos   como   Histoplasma  capsulatum  [198] y parási -  tos como los causantes de la malaria [199, 200]   y  la  toxoplasmosis.  En  las    figuras  42    a    48   se   muestran  algunos  ejemplos  de  inclusiones  in -  tracelulares de origen exógeno.  Eritrofagocitosis  La eritrofagocitosis, un fenómeno en donde   los neutrófilos ingieren eritrocitos, se presenta   en  enfermedades  autoinmunes  como  la  ane -  mia hemolítica autoinmune, la hemoglobinuria   paroxística  por  frío,  en  las  exacerbaciones  de   la enfermedad por hemaglutininas frías [201],   en la anemia hemolítica Coombs positiva y en   las hemólisis inducidas por mordeduras de ser -  piente [93], entre otras situaciones médicas.   También se puede observar en pacientes con   hemoglobinopatías como la anemia falciforme   y las hemoglobinopatías CC y SC [202], en los pacientes que reciben factores de maduración   como G-CSF y GM-CSF [203] y en algunos pacientes con leucemia mieloide crónica [204]. En la   figura   49  se presenta un polimorfonuclear neutrófilo con eritrofagocitosis.   Cuerpos de Barr en los polimorfonucleares   Normalmente, algunos neutrófilos de mujeres tienen, como se observa en la  figura   50 , un   apéndice, también conocido como cuerpo de Barr o cromatina sexual, de más o menos 1,5  μ m   de diám etro que está unido al resto del núcleo por un pequeño filamento que representa el cro -  mosoma X inactivo de la mujer [205, 206]. La posibilidad de observar los apéndices cromosómi -  cos disminuye cuando hay desviación izquierda y aumenta cuando han desviación derecha [10].   Los cuerpos de Barr no se observan en los neutrófilos de los hombres normales, ni en los hombres   con síndrome de feminización testicular, que fenotípicamente son mujeres pero genotípicamente   son hombres (XY), ni en mujeres con síndrome de Turner, en donde sólo hay un cromosoma X (X)   Figura 42.  Citograma que muestra una segunda población   en la zona correspondiente a los eosinófilos (seudoeosinofi -  lia), marcada con un óvalo, que corresponde a Plasmodium   vivax. Sysmex ®  XE-2100.  Figura 43.  Gametocito y trofozoito de  Plasmodium vivax  ob -  servado en la sangre periférica correspondiente al citogra -  ma anterior, en la figura 43. Coloración de Wright utilizando   un extensor y coloreador de placas incorporado al autoana -  lizador de hematología XE-Alpha-N de Sysmex ® , 1.000X.  10.0 μm \nCampuzano-Maya G.  437  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  Figura  47.   Polimorfonuclear  neutrófilo  fagocitando  pla -  quetas  y  gránulos  de  un  polimorfonuclear  eosinófilo  en   un paciente con
