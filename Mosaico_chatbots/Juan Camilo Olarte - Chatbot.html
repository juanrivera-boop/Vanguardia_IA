roporción menor que los observados en   mujeres [10]. Paradójicamente, las mujeres XXX tienen menos cuerpos de Barr que las mujeres   normales XX [10]. El recuento de cuerpos de Barr está disminuido en las mujeres con síndrome   de Down [58]. Proyecciones similares a los palillos en tambor en los núcleos de los polimorfo -  nucleares neutrófilos se pueden observar en pacientes con síndromes de trisomía 13 o síndrome   de Patau  [208].  Otras alteraciones morfológicas de los polimorfonucleares   Además de las alteraciones descritas en los neutrófilos, los eosinófilos y los basófilos, también   se  pueden  observar  en  la  sangre  periférica  o  en  medula  ósea  otras  alteraciones  como  núcleo   en anillo, como se observa en las  figuras 52  y  53 , alteración que se presenta tanto en personas   normales [209], como en pacientes con enfermedades malignas tales como la leucemia mieloide   crónica [210], la leucemia de células peludas [211], la eritroleucemia aguda [212] y el síndrome   mielodisplásico [213] y en enfermedades benignas como la enfermedad de Chagas [214] y el   Figura 51.  Cromatina de Barr en un hombre con síndrome   de  Klinefelter.  Coloración  de  Wright  utilizando  un  extensor   y  coloreador  de  placas  incorporado  al  autoanalizador  de   hematología XE-Alpha-N de Sysmex ® , 1.000X.  Figura 50.  Cromatina de Barr en la sangre periférica de una   mujer.  Coloración  de  Wright utilizando  un  extensor y colo -  reador de placas incorporado al autoanalizador de hemato -  logía XE-Alpha-N de Sysmex ® , 1.000X.  10.0 μm   10.0 μm  Figura 52.  Polimorfonuclear neutrófilo en sangre periférica   con  núcleo  en  “anillo“  en  un  paciente  con  diagnóstico  de   síndrome dismielopoyético. Coloración de Wright utilizando   un extensor y coloreador de placas incorporado al autoana -  lizador de hematología XE-Alpha-N de Sysmex ® , 1.000X.  Figura 53.  Polimorfonucleares neutrófilos en sangre perifé -  rica con núcleo en “anillo“ en un paciente con diagnóstico   de  síndrome  dismielopoyético.  Coloración  de  Wright  utili -  zando  un  extensor  y  coloreador  de  placas  incorporado  al   autoanalizador  de  hematología  XE-Alpha-N  de  Sysmex ® ,   1.000X.  10.0 μm 10.0 μm \nCampuzano-Maya G.  439  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  alcoholism o [215], entre otras enfermedades.   Se pueden observar restos de cromatina nuclear   equivalente a los cuerpos de Howell-Jolly en   los eritrocitos como resultado de fenómenos de   disgranulopoyesis [10], como se observa en la  fi -  gura 54 ; también se pueden observar asociadas   con la terapia con azatioprina y otros citostáti -  cos  [10]  y  en  pacientes  infectados  con  el  virus   de la inmunodeficiencia humana [72, 216].  Monocitopoyesis  Los monocitos tienen un origen medular,   siendo  el  elemento  más  joven  el  monoblasto.   Esta  célula  origina  el  promonocito,  reconoci -  ble en la médula ósea, que se transforma en   monocito y finalmente migra a los tejidos origi -  nando los histiocitos y macrófagos. A continua -  ción se describen cada una de las células que   identifican la serie monocítica.  Monoblastos  El monoblasto es el precursor putativo del promonocito, es difícilmente identificable en la   medula ósea de los individuos normales; no obstante, se conoce gracias a estudios citoquímicos y   al aspecto morfológico y ultraestructural de pacientes con leucemia monoblástica aguda [217], se   le considera claramente diferente a los mieloblastos. El tamaño de los monoblastos es superior al   tamaño de los mieloblastos, con un diámetro que oscila entre 15 y 25  μ m, redondeados con un   gran núcleo de cromatina muy laxa, en donde se visualizan más de cuatro grandes nucléolos de   color azul, que los diferencian de los nucléolos de los mieloblastos y los linfoblastos, entre otras   células con las cuales puede llegar a confundirse, y un citoplasma intensamente basófilo (azul   plomizo) en donde puede haber escasos gránulos peroxidasa positivos [218]. Los monoblastos   probablemente se desarrollan de una célula multipotencial granulocito-monocito [219] como se   esquematiza en la  figura   1 , antes citada. En la  figura   55  se presentan algunos monoblastos y pro -  monocitos, en la cual se pueden evidenciar las características más importantes de estas células.  Como se ha expresado, en los estudios de medula ósea de individuos sanos no se identifican   monoblastos y éstos tampoco aparecen en la sangre periférica. Cuando en la sangre periférica   se  observan  monoblastos  se  debe  pensar  en   el  diagnóstico  de  una  leucemia  monoblástica   aguda [220, 221] o en una leucemia mielomo -  nocítica aguda o crónica [222], las cuales se   confirman o excluyen con el estudio medular y   las coloraciones especiales. También se pueden   observar  monoblastos  en  la  sangre  periférica   de pacientes con diagnóstico de mononucleo -  sis infecciosa, usualmente atípicos [223, 224].  Promonocito  El promonocito es la célula intermedia en -  tre el monoblasto y el monocito [225], que no   se observa en la sangre periférica de individuos   normales. Los promonocitos, pese a su esca -  sa cantidad, son claramente identificables en   Figura  54.    Polimorfonuclear  neutrófilo  con  una  inclusión   citoplasmática  similar  a  los  cuerpos  de  Howell-Jolly  en  un   paciente con diagnóstico de un síndrome dismielopoyético.   Coloración de Wright utilizando un extensor y coloreador de   placas  incorporado  al  autoanalizador  de  hematología  XE-  Alpha-N de Sysmex ® , 1.000X.  10.0 μm  Figura  55.    Leucemia  monoblástica  aguda.  Medula  ósea   en  donde  se  observan  monoblastos  (Mo)  y  promonocitos   (Pmo). Coloración de Wright sobre laminillas, 1.000X.  Mo  Pmo  10.0 μm \nUtilidad clínica del extendido de sangre periférica: los leucocitos  440  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  la  medula ósea. Tienen un tamaño que varía entre 15 y 20  μ m, con una elevada relación nu -  cleocitoplasmática. El núcleo ya toma la forma irregular característica de la serie, con pliegues e   indentaciones, cromatina algo más condensada que su antecesor, el monoblasto, en donde son   visibles uno a dos nucléolos; el citoplasma es intensamente basófilo, debido a su gran cantidad   de polirribosomas, con algunos gránulos azurófilos que en ocasiones lo hacen indistinguible de   un promielocito [226].   Monocitos  Los monocitos, con un diámetro de 15 a 30  μ m, son las células de mayor tamaño halladas   en la sangre periférica de un individuo normal. El núcleo ubicado en el centro es voluminoso,   llegando a ocupar hasta la mitad de la célula, toma formas abigarradas en herradura, indentado,   doblado o plegado sobre si mismo, con cromatina densa y aspecto “peinado” en finas franjas   cromáticas [75]. El monocito, como toda célula madura, no tiene nucléolos. El citoplasma del   monocito es amplio, en ocasiones con formas “mamelonadas” en la periferia, se colorea de azul   plomizo, en donde se visualizan gránulos azurófilos en cantidad variable; además, el citoplasma   de los monocitos normales puede contener algunas vacuolas [93]. En las  figuras   56  y  57  se pre -  sentan monocitos normales, en los cuales se pueden evidenciar las características más importan -  tes de estas células.  Alteraciones morfológicas de los monocitos  Como claramente se observa en las  figuras 58  a  63 , los monocitos expresan sus funciones fa -  gocíticas con mayor evidencia que el resto de las otras células sanguíneas circulantes. Para lograr   el adecuado estudio es indispensable que el observador conozca muy bien estas posibilidades y   sobre todo que disponga de tiempo para alcanzar un buen estudio.   Linfocitopoyesis  El desarrollo de las células linfoides es diferente al de las células mieloides en muchos aspec -  tos. Por ejemplo, los cambios morfológicos no son tan pronunciados, al menos hasta el momento   en el que alcanzan la capacidad de responder a estímulos antigénicos. Las células linfoides circu -  lantes sólo tienen en común la morfología. Desde el punto de vista morfológico en el extendido   de sangre periférica, aunque en la práctica no se discriminan, normalmente se observan tres tipos    de linfocitos: los linfocitos pequeños, los linfocitos medianos y los linfocitos grandes. Como en los   casos anteriores, para un adecuado estudio de la morfología de los linfocitos en sangre periférica   es  indispensable  conocer  todas  las  células  de  la  serie,  tanto  las  normales  como  las  anormales,   Figura  56.    Monocito  normal.     Coloración  de  Wright  utili -  zando  un  extensor  y  coloreador  de  placas  incorporado  al   autoanalizador  de  hematología  XE-Alpha-N  de  Sysmex ® ,   1.000X.  Figura  57.    Monocito  normal.  Coloración  de  Wright  utili -  zando  un  extensor  y  coloreador  de  placas  incorporado  al   autoanalizador  de  hematología  XE-Alpha-N  de  Sysmex ® ,   1.000X.  10.0 μm 10.0 μm \nCampuzano-Maya G.  441  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  Figura  58.    Monocito  reactivo  en  un  paciente  con  un  sín -  drome mononucleósido por  Toxoplasma gondii . Coloración   de  Wright  utilizando  un  extensor  y  coloreador  de  placas   incorporado  al  autoanalizador  de  hematología  XE-Alpha-N   de Sysmex ® .  Figura  60.    Monocito  en  sangre  periférica  de  un  paciente   con  diagnóstico  de  síndrome  de  Chédiak-Higashi.  Colo -  ración  de  Wright  en  extendido  de  sangre  periférica  sobre   laminillas, 1.000X.  10.0 μm  10.0 μm  Figura  62.    Monocito  en  sangre  periférica  fagocitando  pla -  quetas  en  un  paciente  con  diagnóstico  de  púrpura  trom -  bocitopénica idiopática. Coloración de Wright utilizando un   extensor y coloreador de placas incorporado al autoanaliza -  dor de hematología XE-Alpha-N de Sysmex ® , 1.000X.  Figura  59.    Monocito  reactivo  en  un  paciente  con  un  sín -  drome mononucleosido por mononucleosis infecciosa. Co -  loración  de  Wright  utilizando  un  extensor  y  coloreador  de   placas  incorporado  al  autoanalizador  de  hematología  XE-  Alpha-N de Sysmex ® , 1.000X.  Figura  61.   Monocito  en  sangre  periférica  fagocitando  pig -  mento malárico en un paciente con malaria por  Plasmodium   vivax .  Coloración  de  Wright  utilizando  un  extensor  y  colo -  reador de placas incorporado al autoanalizador de hemato -  logía XE-Alpha-N de Sysmex ® , 1.000X.  10.0 μm  10.0 μm  10.0 μm  Figura  63.    Monocito  en  sangre  periférica  fagocitando  pla -  quetas y un polimorfonuclear eosinófilo en un paciente con   diagnóstico  de  púrpura  trombocitopénica  idiopática.  Co -  loración  de  Wright  utilizando  un  extensor  y  coloreador  de   placas  incorporado  al  autoanalizador  de  hematología  XE-  Alpha-N de Sysmex ® , 1.000X.  10.0 μm \nUtilidad clínica del extendido de sangre periférica: los leucocitos  442  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  incluid as las de origen medular, como se analizará a continuación. Los linfocitos que se observan   en la sangre periférica corresponden principalmente a tres tipos de células: (1) los linfocitos B, se   derivan de una célula madre de la medula ósea y maduran allí hasta convertirse en células plas -  máticas que secretan anticuerpos, representan entre el 20% y 45% de los linfocitos circulantes;   (2) los linfocitos T, se forman cuando las células madre linfoides migran de la medula ósea hacia   el timo, de ahí su nombre T, en donde se dividen y maduran; aprenden a diferenciar lo propio y   lo extraño, y cuando están maduros abandonan el timo y van al sistema linfático, especialmente   a los ganglios, en donde funcionan como parte del sistema inmune, representan el 50% y el 70%   de los linfocitos circulantes; y, (3) los linfocitos NK ( natural  killer )  o  células  asesinas  naturales,   morfológicamente más grandes que los linfocitos T y B, producen citoquinas que regulan algunas   funciones de los linfocitos T, los linfocitos B y los macrófagos, representan entre el 5% y el 10%   de los linfocitos circulantes.  Desde el punto de vista morfológico es posible identificar linfoblastos, prolinfocitos y linfoci -  tos pequeños, medianos y grandes, con las características que a continuación se analizarán.   Linfoblasto  El linfoblasto es la primera célula identifi -  cable en la linfocitopoyesis. Tiene un diámetro   que oscila entre 10 y 15  μ m. Su citoplasma es   agranular  y  con  tendencia  a  mostrar  un  color   azul  oscuro  con  formación  de  un  halo  peri -  nuclear más claro que el resto del citoplasma.   El  núcleo  es  redondo  u  ovalado,  usualmente   está  situado  en  la  parte  central  de  la  célula,   con  cromatina  laxa  y  presencia  de  nucléolos   en cantidad de uno a dos. La relación nucleo -  citoplasmática es de alrededor de 4:1. En la   figura   64  se presenta un linfoblasto, en el cual   se  pueden  evidenciar  las  características  más   importantes de esta célula.  Los linfoblastos se pueden observar en san -  gre periférica de pacientes con leucemia linfoi -  de aguda, algunas formas de leucemia linfoide   crónica, algunas formas de linfoma no Hodgkin   y en el linfoma de Burkitt , entre otros.  Prolinfocito  Es la célula intermedia en la linfocitopoye -  sis; tiene un tamaño muy similar al linfoblasto   y en ocasiones es difícil diferenciarlo de él. El   citoplasma es agranular y muy similar al linfo -  blasto,  pero  tiende  a  ocupar  una  mayor  pro -  porción de la célula. El núcleo redondo, oval o   indentado, muestra la cromatina más compac -  tada y los nucléolos, cuando aún son visibles,   no pasan de uno y son menos notorios que los   de los linfoblastos. En la  figura   65  se presentan   algunos prolinfocitos, en los cuales se pueden   evidenciar  las  características  más  importantes   de estas células.  Figura 64.  Linfoblasto en sangre periférica de un paciente   con diagnóstico de leucemia linfoide aguda. Coloración de   Wright utilizando un extensor y coloreador de placas incor -  porado  al  autoanalizador  de  hematología  XE-Alpha-N  de   Sysmex ® , 1.000X.  10.0 μm  Figura  65.    Prolinfocitos  en  sangre  periférica  de  paciente   con  diagnóstico  de  leucemia  linfoide  crónica.  Coloración   de Wright utilizando un extensor y coloreador de placas in -  corporado al autoanalizador de hematología XE-Alpha-N de   Sysmex ® , 1.000X.  10.0 μm \nCampuzano-Maya G.  443  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  Como en el caso anterior, los prolinfocitos se pueden observar en sangre periférica de pacien -  tes con algunas formas de leucemia linfoide crónica y en algunas formas de linfoma no Hodgkin,   entre otros.  Linfocito  Morfológicamente, con las coloraciones de Romanovsky, como la coloración de Wright, en la   sangre periférica se pueden visualizar tres tipos de linfocitos: linfocitos pequeños, linfocitos me -  dianos y linfocitos grandes, con características particulares que serán analizadas a continuación.  Linfocito pequeño  El linfocito pequeño tiene un diámetro que varía entre 8 y 10  μ m,  un  poco  más  grande   que un eritrocito. El citoplasma característicamente forma un anillo alrededor del núcleo que se   observa en el centro o ligeramente excéntrico. El citoplasma es de un color azul celeste a azul   oscuro y ocasionalmente tiene algunos gránulos azurófilos. La relación nucleocitoplasmática varía   de 5:1 a 3:1. El núcleo, usualmente redondo u oval, tiene el tamaño equivalente al tamaño de un   eritrocito y la cromatina se observa compacta   y densa, y característicamente no se observan   nucléolos. En la  figura   66  presenta un linfocito   pequeño, en el cual se pueden evidenciar las   características  más  importantes  de  estas  célu -  las.  Linfocito mediano  Estos linfocitos miden entre 10 y 12  μ m y   pueden llegar hasta 14  μ m. Además del tama -  ño, se diferencian de los linfocitos pequeños   porque tienen más citoplasma y éste es más   basofílico  y  con  mayor  número  de  gránulos   azurófilos. El núcleo puede ser redondo, ova -  lado o indentado, usualmente excéntrico, y la   cromatina aparece menos densa que en los   linfocitos pequeños. Como en el caso anterior,   tampoco  se  observan  nucléolos.  En  la    figura    67  se presenta un linfocito mediano, en el cual   se  pueden  evidenciar  las  características  más   importantes de estas células.  Linfocito grande  Los linfocitos grandes tienen un diámetro   que varía entre 12 y 16  μ m y en algunos casos   pueden llegar a tener más de 20  μ m  de  diá -  metro. El citoplasma es más abundante que en   los linfocitos pequeños o medianos, de color   más basófilo y con mayor número de gránu -  los azurófilos. El citoplasma de los linfocitos   grandes  puede  ser  irregular.  El  núcleo,  usual -  mente excéntrico puede ser redondo, ovalado   o indentado y la cromatina más laxa que los   Figura 66.  Linfocito pequeño normal.  Además, en la parte   inferior del lado izquierdo se observa un neutrófilo normal.   Coloración de Wright utilizando un extensor y coloreador de   placas  incorporado  al  autoanalizador  de  hematología  XE-  Alpha-N de Sysmex ® , 1.000X.  10.0 μm  Figura 67.  Linfocito mediano  normal. Coloración de Wright   utilizando un extensor y coloreador de placas incorporado   al autoanalizador de hematología XE-Alpha-N de Sysmex ® ,   1.000X.  10.0 μm \nUtilidad clínica del extendido de sangre periférica: los leucocitos  444  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  anteriores  y  una   vez  más  sin  nucléolos.  En  la   figura     68    se  presenta  un  linfocito  grande,  en   el cual se pueden evidenciar las características   más importantes de estas células.  Alteraciones morfológicas de los   linfocitos  Además de las alteraciones ya descritas de   los linfocitos se pueden presentar otras relacio -  nadas  con  condiciones  hereditarias,  linfocitos   reactivos,  alteraciones  de  los  linfocitos  en  las   enfermedades  linforreticulares  y  cambios  ne -  crobióticos, como se analizará, con mayor de -  talle, a continuación.  Condiciones hereditarias  Se  pueden  observar  inclusiones  citoplas -  máticas  en  los  linfocitos  en  el  síndrome  de   Chédiak-Higashi, previamente descrito [168],   como se observa en la  figura   69 ; y en el sín -  drome de Alder-Reilly, una alteración heredi -  taria  en  el  metabolismo  de  los  polisacáridos,   asociada  con  gargolismo  y  alteraciones  en  el   crecimiento  esquelético  [176].  También  se   observan  inclusiones  en  pacientes  con  la  en -  fermedad de Tay-Sachs, una rara enfermedad   hereditaria autosómica recesiva, más frecuente   en  judíos,  caracterizada  por  falta  de  una  en -  zima lisosómica denominada hexosaminidasa,   con  acumulación  de  gangliósidos  a  nivel  del   cerebro  que  termina  degenerándose  [227].   Además, se puede observar vacuolización de los linfocitos, en las enfermedades metabólicas   hereditarias, como mucolipidosis tipo II, la mucopolisacaridosis , la anomalía de Jordan, la enfer -  medad de Niemann-Pick, la enfermedad de Wolman, la enfermedad de Pompe, la enfermedad   de Tay-Sachs, la forma juvenil de la enfermedad de Batten, la galactosidemia y la enfermedad de   depósito del ácido siálico, entre otras, [228].  Linfocitos reactivos  Son las manifestaciones morfológicas más frecuentes de estas células. Los linfocitos responden   a las enfermedades virales y a diversos estímulos inmunológicos con aumento en el número de   células y en la actividad. Los linfocitos B pueden transformarse a células plasmáticas y formas   plasmocitoides, también denominadas células de Turk o linfocitos reactivos, como las que se   observan en la  figura   70 . Algunas de estas células pueden mostrar gran producción de inmuno -  globulinas, dando las células espumosas o células Mott o la formación de cristales de inmuno -  globulinas, como se observa en las  figuras 71  y  72.  Tanto los linfocitos T como los linfocitos B   se pueden transformar a inmunoblastos y formas intermedias, dando origen a las células que los   morfólogos conocen como linfocitos o mononucleares atípicos [229], lo mismo que en pacientes   Figura  68.    Linfocito  grande  normal.  Coloración  de  Wright   utilizando un extensor y coloreador de placas incorporado   al autoanalizador de hematología XE-Alpha-N de Sysmex ® ,   1.000X.  10.0 μm  Figura 69.  Linfocito en sangre periférica de un paciente con   diagnóstico  de  síndrome  de  Chédiak-Higashi.  Coloración   de  Wright  en  extendido  de  sangre  periférica  sobre  lamini -  llas, 1.000X.  10.0 μm \nCampuzano-Maya G.  445  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  c on  toxoplasmosis  activa,  infección  por  cito -  megalovirus y mononucleosis infecciosa [230].   Además, algunas “agresiones” graves a los lin -  focitos, como la radiación, pueden expresarse   con linfocitos binucleados.   Cambios en los linfocitos en las   enfermedades linforreticulares  Dependiendo  de  la  enfermedad  de  base,   los  linfocitos,  y  usualmente  los  monocitos,   muestran  alteraciones  características.  En  estas   enfermedades es frecuente observar agregados   de linfocitos, lo cual representa un fenómeno   in  vitro  [231] o en algunos raros casos puede   ser la primera manifestación de un linfoma no-  Hodgkin a distancia [232], especialmente de   linfocitos  “vellosos”  con  compromiso  espléni -  co [231] o linfoma de células en manto [233].   Los linfocitos de la leucemia linfoide crónica   son más frágiles que los linfocitos de otros tipos   y  cuando  se  hacen  los  extendidos  de  sangre   periférica  es  usual  encontrar  muchos  de  ellos   estallados, fenómeno que da origen a las “célu -  las en canasta”, como se observa en las  figuras    73  y  74 , características de esta leucemia [234,   235]. Ocasionalmente, en los casos de discra -  sias de células plasmáticas (mieloma múltiple)   es  posible  observar  plasmocitos  circulantes   [234, 235]. Otras enfermedades linforreticula -  res con manifestaciones en la morfología de los   linfocitos son las que presentan las células de   Sézary, en particular el síndrome de Sézary y   la micosis fungoide [236, 237], como se obser -  va  en  la    figura  75 . Por último en la leucemia   de células peludas es posible evidenciar célu -  las como las que se muestran en la  figura 76 ,   en las cuales el citoplasma característicamente   está desflecado o es “peludo” [238].  Cambios necrobióticos en los   linfocitos  Así como se presentan cambios necrobióti -  cos (apoptóticos) en los polimorfonucleares, en   los linfocitos también se puede presentar este   tipo de morfología, sobre todo en los pacientes   con  linfocitosis  reactivas,  particularmente  las   relacionadas  con  la  mononucleosis  infecciosa   y otras infecciones virales, con morfología muy   similar a la que se observa en los polimorfonu -  cleares neutrófilos.  Figura 71.  Linfocito plasmocitoide (célula Mott) en la san -  gre periférica de un paciente con malaria por  Plasmodium   vivax .  Coloración  de  Wright  utilizando  un  extensor  y  colo -  reador de placas incorporado al autoanalizador de hemato -  logía XE-Alpha-N de Sysmex ® , 1.000X.  10.0 μm  Figura 72.  Célula plasmocitoide con formación de cristales   intracitoplasmáticos en la sangre periférica de un paciente   con  malaria  por    Plasmodium  vivax .  Coloración  de  Wright   utilizando un extensor y coloreador de placas incorporado   al autoanalizador de hematología XE-Alpha-N de Sysmex ® ,   1.000X.  10.0 μm  Figura  70.    Linfocito  reactivo  o  célula  Turk  en  un  paciente   con  una  infección  viral  inespecífica.  Coloración  de  Wright   utilizando un extensor y coloreador de placas incorporado   al autoanalizador de hematología XE-Alpha-N de Sysmex ® ,   1.000X.  10.0 μm \nUtilidad clínica del extendido de sangre periférica: los leucocitos  446  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  Agradecimientos  Al personal técnico del Laboratorio Clínico Hematológico S.A., en particular a las bacteriólo -  gas Gloria Elcy Escobar Gallo y Luz Marina Valencia Zuluaga, quienes colaboraron en la identifi -  cación de las placas de donde proceden la mayoría de las microfotografías que documentan este   módulo, y a Víctor Calvo Betancur por su apoyo en los análisis estadísticos.  Summary:  Despite the huge technological advances associated with the cell blood   count, in particular those derived from the hematology autoanalyzers, each generation   more complete and sophisticated, the blood smear continues as the “gold standard”   for the diagnosis in hematology. According to the good practices in hematology, the   blood smear is indicated in all hemograms that show a deviation in the direct, indirect   or calculated counts, or when there is a hematological or non-hematological entity   suspected to be causing hematological manifestations, regardless of the presence   of  normal  parameters  according  to  the  age  and  gender.  When  observing  a  blood   smear,  abnormalities  associated  with  the  erythrocytes,  leukocytes  and  platelets   can  be  detected.  The  present  module  will  analyze  the  most  important  aspects  of:   Figura  75.    Células  de  Sézary  en  sangre  periférica  de  un   paciente con diagnóstico de micosis fungoide. Coloración   de  Wright  en  extendido  de  sangre  periférica  sobre  lamini -  llas, 1.000X.  10.0 μm  Figura  76.    Linfocitos  “peludos”  en  la  sangre  periférica  de   un  paciente  con  diagnóstico  de  tricoleucemia.  Coloración   de  Wright  en  extendido  de  sangre  periférica  sobre  lamini -  llas, 1.000X.  10.0 μm  Figura  73.    Linfocitos  pequeños  en  la  sangre  periférica  de   un  paciente  con  diagnóstico  de  leucemia  linfoide  crónica.   Coloración de Wright utilizando un extensor y coloreador de   placas  incorporado  al  autoanalizador  de  hematología  XE-  Alpha-N de Sysmex ® , 1.000X.  10.0 μm  Figura  74.  Linfocitos  pequeños  estallados  “células  en   canasta”  en  la  sangre  periférica  de  un  paciente  con  diag -  nóstico de leucemia linfoide crónica. Coloración de Wright   utilizando un extensor y coloreador de placas incorporado   al autoanalizador de hematología XE-Alpha-N de Sysmex ® ,   1.000X.  10.0 μm \nCampuzano-Maya G.  447  Medicina & Laboratorio, Volumen 14, Números 9-10, 2008  Medicina & Laboratorio: Programa de Educación Médica Contínua Certificada Universidad de Antioquia, Edimeco  1)  white  cell  count,  that  defines  the  presence  of  leukocytosis  or  leukopenia;  2)   white cell differential count, that defines neutrophilia, neutropenia, agranulocytosis,   eosinophilia, eosinopenia, basophilia, basopenia, lymphocytosis, lymphocytopenia,   monocytosis  and  monocytopenia;  and  3)  the  most  representative  morphologic   findings in leukocytes, such as leukocyte aggregation, left or right shift, Pelger-Hüet   anomaly,  May-Hegglin  anomaly,  Döhle  bodies,  Chédiak-Higashi  syndrome,  Alder-  Reilly  anomaly,  Auer  bodies,  Barr  bodies,  among  others.  Morphologic  findings  in   circulating  leukocytes  are  defined  and  associated  with  the  most  relevant  clinical   aspects. This module provides the laboratory technologist with the tools necessary to   adequately identify the different findings, as well as the physician with the information   to associate such findings with the clinical entities.  Key words:  Blood smear, leukocyte morphology, clinic.  Campuzano-Maya  G.    Clinical  utility  of  the  blood  smear:  Leukocytes.  Medicina  &   Laboratorio 2008; 14: 411-455.  Module  1  (Clinic  and  laboratory),  number  70.  Editora  Médica  Colombiana  S.A.,   2008 © .  Received on August 19, 2008; accepted on September 5, 2008.  Bibliografía  1.  Campuzano-Maya G.  Utilidad clínica del extendi -  do de sangre periférica: los eritrocitos. Medicina &   Laboratorio 2008; 14: 311-357.  2.    Sociedad Colombiana de Patología Clínica.  Ma -  nual de Codificación, Nomenclatura, Nivelación y   Valores de Exámenes de laboratorio Clínico. Me -  dellín, Colombia: Edimeco S.A.; 2008: 1-100.  3.  College  of  American  Pathologists.   Workload   Recording Method & Personnel Management Ma -  nual. 1992  4.    República  de  Colombia,  Ministerio  de  Protec -  ción Social.  Resolución 1896 de 2001 por la cual   se sustituye integralmente la Clasificación Única   de Procedimientos en Salud.  5.  Campuzano-Maya G.  ¿Cómo obtener un extendi -  do de sangre periférica de óptima calidad? Medi -  cina & Laboratorio 2008; 14: 125-145.  6.  Bessis M.  Blood smears reinterpreted. New York,   USA: Springer-Verlag; 1977: 1-265.  7.    Perkins  SL.    Examination  of  the  blood  and  bone   marrow.  In : Greer JP, Foerster J, Lukens JN, Rodgers   GM, Paraskevas F, Glader B, eds. Wintrobe’s clini -  cal hematology. 11th ed. Philadelphia, PA, USA;   Lipincott Williams & Wilkins. 2004: 1-25.  8.  Bain BJ.  Diagnosis from the blood smear. N Engl J   Med 2005; 353: 498-507.  9.   Bain BJ.  Blood cell mor     function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };

    function rgbToHex(r, g, b) {
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');

    }
    function mixColors(colorA, colorB, amount) {
        const a = hexToRgb(colorA);

        return rgbToHex(a.r + (b.r - a.r) * amount, a.g + (b.g - a.g) * amount, a.b + (b.b - a.b) * amount);
    }
    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;

        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);
    }

        } else if (sender === 'user') {
            const userAvatarUrl = getAvatarUrl('user');
            el.innerHTML = '<div class="message user-message"><div class="message-bubble user-bubble"></div><img class="avatar-img" src="' + userAvatarUrl + '" alt=""></div>';
            el.querySelector('.user-bubble').textContent = message;
        } else {
            el.textContent = message;
        }
        chatDisplay.appendChild(el); chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }
    function updateLastMsg(message) {
        const el = document.getElementById('thinking-msg');
        const botAvatarUrl = getAvatarUrl('bot');
        const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
        const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
        if (el) {
            el.className = 'bot-message';
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;">' + html + '</div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            el.removeAttribute('id');
            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else addMsg(message, 'bot');
        chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }
    function escapeHtml(s) {
        if (s === undefined || s === null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getSessionHTML() {
        const clone = chatDisplay.cloneNode(true);
        const exportStyles =
            'body{font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;line-height:1.65;padding:28px;color:#333;max-width:880px;margin:0 auto;background:#fafafa;}' +
            'h1{color:#007bff;font-size:1.45em;margin-bottom:6px;}' +
            '.meta{color:#444;margin:6px 0;font-size:.95em;}' +
            'hr{border:none;border-top:1px solid #dee2e6;margin:22px 0;}' +
            '.chat-export{padding:4px 0;}' +
            '.chat-export .user-message,.chat-export .bot-message,.chat-export .system-message{margin-bottom:18px;}' +
            '.chat-export .system-message{text-align:center;color:#555;font-style:italic;padding:10px 14px;background:#fff3cd;border-radius:10px;border:1px solid #ffeaa7;}' +
            '.chat-export .system-message.error{background:#f8d7da;color:#721c24;border-color:#f5c6cb;}' +
            '.chat-export .message{display:flex;align-items:flex-end;gap:12px;}' +
            '.chat-export .message.user-message{flex-direction:row-reverse;}' +
            '.chat-export .avatar-img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid #e0e0e0;}' +
            '.chat-export .message-bubble{padding:12px 16px;border-radius:18px;max-width:78%;box-shadow:0 1px 2px rgba(0,0,0,.06);}' +
            '.chat-export .user-bubble{background:#007bff;color:#fff;}' +
            '.chat-export .bot-bubble{background:#e9ecef;color:#212529;}' +
            '.chat-export .bot-bubble strong{color:#007bff;}' +
            '.chat-export .bot-bubble p{margin:0 0 10px;}.chat-export .bot-bubble p:last-child{margin:0;}' +
            '.chat-export pre{background:#2d2d2d;color:#f8f8f2;padding:12px;border-radius:8px;overflow-x:auto;font-size:.9em;}' +
            '.chat-export code{background:#eee;padding:2px 6px;border-radius:4px;font-size:.9em;}' +
            '.chat-export ul,.chat-export ol{margin:8px 0;padding-left:22px;}';
        return '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sesión de chat</title><style>' + exportStyles + '</style></head><body>' +
            '<h1>Sesión de chat</h1>' +
            '<p class="meta"><strong>Documento:</strong> ' + escapeHtml(PDF_NAME) + '</p>' +
            '<p class="meta"><strong>Tema del chatbot:</strong> ' + escapeHtml(CHATBOT_THEME) + '</p>' +
            '<p class="meta"><strong>Modelo:</strong> ' + escapeHtml(MODEL) + '</p>' +
            '<hr><div class="chat-export">' + clone.innerHTML + '</div></body></html>';
    }

    function downloadSessionHtml() {
        const blob = new Blob([getSessionHTML()], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Sesion_Chat_' + Date.now() + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
