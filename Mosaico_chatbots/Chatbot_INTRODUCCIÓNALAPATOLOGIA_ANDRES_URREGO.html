    <style>
        :root{--primary:#007bff;--secondary:#6c757d;--light:#f8f9fa;--dark:#343a40;--success:#28a745;--danger:#dc3545;--warning:orange;--radius:8px;--font:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;--bg:var(--light);--text:var(--dark);--card:#fff;--border:#ddd;--input:#fff;--iborder:#ccc;--bot-bg:#e9ecef;--bot-text:var(--dark);--user-bg:var(--primary);--user-text:#fff;--sys-bg:#fff3cd;--sys-text:#856404;}
        body.dark-mode{--bg:#212529;--text:#f8f9fa;--card:#343a40;--border:#495057;--input:#495057;--iborder:#6c757d;--bot-bg:#495057;--bot-text:#f8f9fa;--sys-bg:#332701;--sys-text:#ffeb8f;}

        button:disabled{background:var(--secondary)!important;opacity:.65;cursor:not-allowed;}

        .chat-display .user-message,.chat-display .bot-message,.chat-display .system-message{margin-bottom:10px;word-wrap:break-word;}
        .chat-display .user-message,.chat-display .bot-message{background:transparent;color:inherit;padding:0;border-radius:0;max-width:100%;text-align:inherit;margin-left:0;}
        .message{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px;max-width:100%;}
        .message.user-message{flex-direction:row-reverse;justify-content:flex-start;}
        .avatar-img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #eee;background-color:#f0f0f0;}

        .message-bubble{padding:10px 15px;border-radius:18px;max-width:85%;word-wrap:break-word;line-height:1.5;display:flex;flex-direction:column;}

        @media(max-width:600px){.input-area{flex-direction:column;}#send-button{width:100%;padding:12px;}}

<script>
    const PDF_TEXT = "UNIVERSIDAD NACIONAL DE  COLOMBIA SEDE MEDELLÍN.      FACULTAD DE ARQUITECTURA.      ESCUELA DE CONSTRUCCIÓN.      ESPECIALIZACIÓN EN PATOLOGÍA DE  LA EDIFICACIÓN Y TÉCNICAS DE   INTERVENCIÓN Y PREVENCIÓN.      Módulo 1: Introducción a la Pato logía de la Construcción.         INTRODUCCION.      Debido a que las edificaciones están expu estas no solamente a las condiciones de   servicio  para  las  que  fueron  diseñadas  y  a   la  acción  mecánica  de  las  cargas  de    servicio;  sino  también,  a  otros  factores   que  tienden  a  deteriorarlas  y  destruirlas    como:  acciones  físicas,  algunas  veces  a  agresiones  de  carácter  químico  o    biológico  y  eventualmente,  a  otras  acci ones  mecánicas,  se  hace  indispensable    profundizar,  no  solo  en  el  diseño  de  las   especificaciones  de  los  materiales  sino    también  en  la  concepción  y  el  dis eño  de  los  elementos  estructurales  y    arquitectónicos,  en  los  procesos  y  técnic as  de  ejecución,  en  la  metodología  de    protección,  y  puesta  en  servicio  y  en  lo s  procedimientos  de  inspección  y  el    mantenimiento de las edificaciones.      Los  daños  que  comúnmente  se  presentan   en  las  edificaciones  generalmente  no    son debidos a una única causa y cada día  conocemos más de la combinación de   circunstancias  que  generan  una  falla  qu e  pueden  aparecer  el  primer  día  o    desarrollarse  a  lo  largo  del  tiempo  de  su   vida  o  presentarse  súbitamente  por    efectos repentinos.        Generalizando,  los  daños   pueden  tener  una  amplia  gama  de  causas  que  de    manera ilustrativa podemos resumir en las si guientes causas: por diseños, por los   procesos  y  sistemas  de  construcción,   por  sobrecargas,  por  los  efectos  de    naturaleza o por la ac tuación del hombre.      Esto nos lleva entonces al concepto de:       Estado patológico de la edificación.      ES UN ESTADO EN EL CUA L LA ESTRUCTURA FISICA  DE LOS MATERIALES,   COMPONENTES  CONSTRUCTIVOS  Y/O   INSTALACIONES  YA  NO  ESTAN  EN    CONDICIONES  DE  CUMPLIR  SUS  FUNC IONES  DE  MANERA  EFICAZ  NI    CORRECTA  NI  SIQUIERA  SEGURA,  TRANSFORMANDO  AL  EDIFICIO  EN  UN    INSALUBRE  Y  PELIGROSO  LUGAR,   CUYO  DERRUMBAMIENTO  APARECE   \nCADA  VEZ  MAS  PROBABL E  Y  CUYA  REPARACION   SE  VUELVE  CADA  VEZ    MAS COMPLEJA (A VECES  IMPOSIBLE) Y COSTOSA.       El  comportamiento  de  las  estructuras  esta   regido  por  ciertas  leyes  mediante  las    cuales es posible conocer e interpreta r su funcionamiento de manera que pueden   asociarse  determinadas  manifestaciones   de  las  deformaciones,  por  ejemplo,  con    ciertas acciones mecánicas de resistencia  o la aparición de ma chas o fisuraciones   a lo largo de las barras de refuerzo  por efectos de procesos químicos.      No puede darse una instrucción única sobr e el tratamiento que debe darse a una   situación  particular.  Cada  caso  exige  un   tratamiento  singular  por  las  condiciones    de  accesibilidad,  localización,  estado   de  deterioro,  costo   de  los  estudios,    disponibilidad  profesional,  acierto  en  el   diagnóstico,  nivel  de  capacitación  y    experiencia de quien diagnostica.      Para  estudiar  las  causas,  evaluar  la   gravedad  de  los  daños,  acertar  en  el    diagnóstico, señalar los proc edimientos de rehabilitación,  calcular el reforzamiento   y establecer los procesos constructivos,  se requiere de técnicas que van desde el   conocimiento  de  la  mecánica  de  los  mate riales,  tanto  tradicionales  como  los  que    van  apareciendo  en  el  mercado,  las  técn icas  para  auscultar  las  estructuras    mediante ensayos destructivos y no destructi vos, los métodos de análisis y diseño   estructural, las técnicas para el conocimiento físico y químico de los materiales.       Dicho  de  otra  manera  es  la   conjunción  de  todos  los  conocimientos  básicos  en    cada  una  de  las  áreas  de  la  In geniería  que  junto  con  la   experiencia  y  pericia  del    profesional  se  logra  poseer   un  nivel  adecuado  para   diagnosticar  y  recomendar    procedimientos de rehabilitación.       VIDA ÚTIL.       La  evidencia  de  estos  inesperados  deter ioros  en  edificaci ones  que  se  habían    construido  para  durar  ilimit adamente,  ha  obligado  a  intr oducir  un  nuevo  concepto    que  se  denomina  'definición  de   la  vida  útil'.  Han  sido  nor teamericanos  y  nórdicos     los  pioneros  que  en  la  década  de  los  70   empezaron  a  enunciar  la  necesidad  de    introducir  este  concepto,  de  que  las  estructuras  en  determinados  ambientes  no    son eternas sino, que van a tener una vida li mitada, cuya duraci ón hay que prever   desde  el  proyecto.  A  pesar  de  los  casi   40  años  transcurridos  desde  las  primeras    iniciativas,  todavía  la  mayoría  de  los   Códigos  de  cálculo  y  ejecución  de  los    diferentes  países  son  ajenos  por  completo   a  la  idea  de  calcular  y  proyectar  para    una durabilidad determinada.      El  concepto  de  vida  útil  de  las  construcciones  y  estructuras  se  inicia  cuando  los    constructores encuentran que determinados materiales y diseños duran unos más   que  otros  y  la  predicción  de  esta  vida  útil   ha  sido  cualitativa   y  empírica.  Además    del  colapso  estructural,  muchos  otros  fa ctores  pueden  influir  en  la  vida  útil  (ACI   \n365,  2000).  En  zonas  de  elevado  riesgo  sí smico  se  deben  evaluar  la  influencia    entre ellos a fin de poder estimar la vida útil de servicio.      Definición de vida útil.      Se entiende como vida útil “el periodo de tiem po en el cual la estructura, es capaz   de  desempeñar  las  funciones  para  la   que  fue  proyect ada  sin  necesidad  de    intervenciones no previstas”, o sea, las  operaciones de mantenimiento previstas y   especificadas  en  la  etapa  de  proyecto,  hac en  parte  del  periodo  de  tiempo  total    durante el cual se admite que la estruc tura está cumpliendo bien su función.      Para una vida útil mínima de 30 años, los el ementos principales que forman parte   de  la  construcción  deberán  conservar  dur ante  ese  tiempo,  por  lo  menos,  sus    cualidades  esenciales  vinculadas  con  la   seguridad  y  la  h abitabilidad.  Para    alcanzar  tal  duración  es  nec esario  poder  realizar  el   mantenimiento,  de  las  partes    accesibles, en los elementos de servicio , en condiciones normales de uso, usando   técnicas  sencillas.  Los  componentes   de  difícil  mantenimiento  y  aquellos    destinados  a  permanecer  ocultos,  deben  construirse  con  materiales  estables,    teniendo en cuenta el envejecimiento.      Métodos y modelos de previsión de vida útil.      Se  han  desarrollado  metodologías  para  predec ir  la  vida  útil  de  las  estructuras    existentes.  Para  ello  se  requiere  de  info rmación  sobre  la  condición  actual  de  la    edificación,  velocidades  de  degradación,  estados  de  cargas  soportados  y    definición del tiempo máximo  de uso. Teniendo en cuen ta la predicción de vida útil   remanente,  se  pueden  tomar  decisiones  ec onómicas  si  la  estructura  puede  ser    reparada, rehabilitada o reem plazada (Helene, 1997).      Se pueden detectar cuatro líneas princi pales de métodos de previsión de vida útil   (ACI  365,  2000)  aplicados  en  su  mayoría   a  hormigones,  que  es  el  material  más    estudiado conjuntamente  con el acero: a) con base en  experiencias anteriores, b)   basadas  en  ensayos  acelerados,  c)  a  tr avés  de  métodos  deterministas  y  d)  a    través de métodos probabilistas.      Los  métodos  basados  en  las  experiencia s  previas  son  los  adoptados  por  la    mayoría  de  los  códigos  en  cuanto  a  recubr imientos  y  resistencias  mínimas,  pero    que  han  demostrado  en  condici ones  ambientales  agresiva s,  no  ser  suficientes    para asegurar la vida útil.   Las especificaciones prescriptivas de los  reglamentos tienden a  establecer límites   frente  a  la  degradación,  pero  no  permiten  ca lcular  la  vida  en  servicio  ni  la    optimización técnica-económica  de sus variables en juego.      Como  se  incorpora  el  tema  del  ries go  sísmico,  se  pueden  considerar  los    requerimientos generales para niveles de co mportamiento en edificios y control de  \ndaños, que si bien están elaborados para  países en desarrollo pueden convertirse   en una guía para valorar daños en otras regi ones sísmicas según sean elementos   verticales,  horizontales,  arquitectónicos,   de  instalaciones  y  de  componentes  no    estructurales, pero no están elaborados  específicamente para viviendas.      Durante  la  vida  útil  de   los  componentes  de  un  edificio,  debe  garantizarse  que  se    mantienen los siguientes aspectos:   •   Prestaciones.   •   Funcionalidad.   •   Especificaciones.   •   Costos iniciales estimados.   •   Listas de chequeo para las fases de construcción.      Igualmente la vida útil debe  estar relacionada con:   •   La caracterización del  medio ambiente.   •   La  información  sobre  la  vida  útil  norma l  de  los  materiales  y  sistemas,  así    como las recomendaciones de mantenimient o asociadas a esta vida útil.    •   Las estimaciones del Costo de Ciclo de Vida.   •   Las listas de chequeo para las fases de evaluación y mantenimiento.         DURABILIDAD.      Durabilidad  es  la  fiabilidad  que  caracteriza  la   aptitud  de  un  material  para  el  fin  al    que es destinado.      También  se  puede  decir  que  es  la  capac idad  del  material  de  mantener  sus    atributos  durante  un  largo  tiempo,  o  lo  mi smo  que  la  capacidad   para  resistir  la    acción del medio ambiente que  lo rodea, de los ataques químicos o biológicos, de   la abrasión y/o de cualquier otro proceso de deterioro.      En  la   durabilidad   intervienen  una  serie  de   parámetros  que  dependen  de    diferentes factores, así:           Dependientes del material:   Composición.   Estructura.   Impurezas.   Morfología (formas).          Dependientes de la aplicación:  Diseño geométrico o de formas.              Estado de la superficie.              Forma de moldeo.              Contacto con otros materiales.         \n    Dependientes del medio  ambiente: Temperatura.   Humedad.   Agentes químicos y/o biológicos.   Agentes tensoactivos.         AGRESIVIDAD DEL MEDIO AMBIENTE.       Las  condiciones  del  medio  ambiente   que  rodea  una  edific ación  tienen  una    incidencia directa sobre los procesos de  deterioro de la misma y para ello, deben   tenerse en cuenta el macroclima, el  clima local y el microclima.      En estructuras expuestas al  aire, las condiciones atmosf éricas que se encuentran   entorno a la edificación (macroclima), ti enen una influencia re lativamente pequeña   sobre la durabilidad de la edificación cuan do la atmósfera no está enrarecida. Pero   cuando  hay  presencia  de  aire  poluto  (smog)   y lluvias ácidas, su impacto sobre la   durabilidad de la edificación puede ser alto.      El  clima  local,  o  sea  aque l  que  rodea  a  la  edificación   hasta  pocos  metros  de    distancia  y  el  microclima,  medio  ambient e  próximo  a  la  superficie  de  la  obra  a    escasos  milímetros  o  centímetros,  son   los  que  ejercen  una  in fluencia  decisiva  en    la durabilidad de los elem entos que la componen.      Del  mismo  modo,  las  estructuras  sumergi das  en  el  suelo  (cimientos,  muros  de    contención,  etc.),  o  en  el  agua  (pilo tes  u  otras  estructuras),  pueden  verse    afectadas  en  su  durabilidad,  por  contacto   superficial  o  saturado  de  sustancias    agresivas con los materiales.      CLASIFICACIÓN DE LA AGRE SIVIDAD DEL MEDIO AMBIENTE.       La  clasificación  de  la  agresividad  de l  medio  ambiente,   de  acuerdo  con  las    condiciones  de  exposición  de  la  edificaci ón  debe  tener  en  cuenta:  el  macroclima,    el microclima, la durabilidad de los materiales.      De  acuerdo  a  los  ambientes  tropicales  como  el  de  Colombia  y  teniendo  como    referencia diferentes normas entre ellas la  NSR 98 y la Icontec, la agresividad del   medio ambiente se puede clasificar así:       Ambiente  ligero  o  débil:   hace  referencia  a  ambientes   secos  como  el  interior  de    edificaciones  de  vivienda,  oficinas,  o  come rcio  (dormitorios,  salas,  oficinas,    almacenes,  etc.),  y  ambientes  exterior es  rurales  donde  la  humedad  relativa  es    inferior  al  60  %.    Es  decir,  ambient es  en  donde  los  materiales  no  estarán    expuestos a ciclos de hum edecimiento y secado, a congelación y deshielo, o con   presencia de sustancias  potencialmente agresivas.     \nAmbiente  moderado:   se  refiere  al  interior  de  edificaciones  con  ambientes    húmedos  y  cambiantes  (humedad  relativa   entre  60%  y  98%),  o  con  riesgo    temporal  de  vapores  de  agua  (baños,  coci nas,  garajes,  lavanderías,  etc.),  y    condensación  del  agua.    Obras  expuestas   a  ciclos  de  humedecimiento  y  secado,    estructuras  en  contacto  con  agua  dulce   en  movimiento,  ambientes  rurales    lluviosos,  ambientes  urbanos  sin  alta  condensación  de  gases  agresivos  y    estructuras en contacto con suelos ordinarios.       Ambiente  severo:   contempla  ambientes  húmedos  con  hielo  de  agua  dulce  y    agentes  de  deshielo,  ambientes  marinos  o   con  macroclima    industrial  y  humedad    relativa  entre  el  60%  y  98%,  ambientes   urbanos  con  alta  condensación  de  gases    agresivos y estructuras en contacto con suelos también agresivos.       Ambiente muy severo:   incluye zonas de salpicaduras o sumergidas en agua de   mar con una cara expuesta al aire, element os en aire saturados de sal, ambientes   con  agua  de  mar  y  hielo,  exposición  direct a  a  líquidos  con  pequ eñas  cantidades    de ácidos, ambientes salinos  o aguas fuertemente oxig enadas, gases agresivos o   suelos particularmente agresivos y am bientes industriales muy agresivos.      FACTORES QUE AFECTAN EL  PROCESO DE DETERIORO.       Los  procesos  de  deterioro  de  los  mate riales  se  pueden  ver  acentuados  por  el    efecto de tres factores: la humedad,  la temperatura y la presión.       Efecto  de  la  humedad:   en  general,  para  que  haya  proc esos  de  deterioro  en  los    materiales, se requiere de la presencia de agua.   El factor principal es el estado de   humedad  en  el  material  y  no  en  la  atmó sfera  circundante.    Sin  embargo,  la    humedad de la atmósfera circundante contri buye los fenómenos de deterioro en la   medida en que se presenten ciclos de hum edecimiento y secado en el material.       Efecto  de  la  temperatura:   cuando  se  hace  referencia   a  la  agresividad  de  los    procesos físicos, mecánicos, químicos o biol ógicos del material, se suele olvidar el   hacer  mención  de  la  temperat ura.    Sin  embargo,  el  efec to  de  la  temperatura,  es    muy  importante  por  cuanto  ella  incide  not ablemente  en  la  velocidad  con  la  cual    pueden ocurrir los fenómenos de deterioro.      Las  reacciones  químicas  usualmente  s on  aceleradas  por   el  aumento  de  la    temperatura.    Una  regla   general  es  que  un  aumento  de   la  temperatura  de  diez    grados  centígrados,  dobla  la  velocidad  de   la  reacción.    Por  ello,  los  climas    tropicales (cálidos y húmedos), se c onsideran más agresivos que los demás.       Efecto  de  la  presión:   la  presión  atmosférica  y  el   régimen  de  vientos,  también    tienen  incidencia  sobre  la  durabilidad  de  los   materiales  expuestos  al  aire,  por    cuanto  puede  darse  deterioro   por  erosión  de  partículas  arrastradas  por  el  viento,    porque  se  pueden  promover  los  ciclos   de  humedecimiento  y  secado,  porque   \ntambién se pueden ver afectados los ciclos  de calentamiento y enfriamiento de la   superficie de la tierra.      Para estructuras sumergidas en el suelo o  en el agua, la acción  de la presión del   medio que la rodea,  el cual puede ser lí quido (agua), sólido (s uelo contaminado o   húmedo),  o  gaseoso  (vapor  de  agua,  oxi geno  u  otros  gases),  puede  ser  más    dramática, por cuanto se  promueve la penetración de  elementos o sustancias que   pueden percolar los materiales.      Contaminación Urbana.        La  contaminación  de  las  ciudades   está  determinada  por  un  sinnúmero  de    variables.  El  ambiente  natur al  regido  por  elementos   geográficos  define  que  una    ciudad  sea  más  contaminada  que  otra;  las  ca racterísticas  del  ambiente  cultural    también  son  determinantes  en  los  grados   de  polución  urbana,  como  se  verá  a    continuación:       Factores naturales que determinan el smog urbano.      Atmósfera  Relieve  Vegetación   Latitud    Inversión térmica    Circulación planetaria    Circulación local    Circulación solenoidal   Altitud Topografía   Cuencas:   tectónicas hidrográficas   Formaciones vegetales   Localización    Cobertura    Densidad      Factores Antrópicos.      Población  Urbanismo  Actividades   Volumen:   Distribución:   Desplazamientos:   Tamaño ciudad    Forma ciudad    Emplazamiento    Periferia   Islas de calor urbano   Industriales:   Transporte:   Recreación:         INVERSIÓN TÉRMICA.       La    inversión  térmica   es  un  fenómeno  meteorológico  que  se  da  en  las  capas    bajas  de  la  atmósfera  terrestre.  Consiste   en  el  aumento  de  la  temperatura  con  la   \naltitud en una capa de la  atmósfera. Como la temperatura suele descender con la   altitud  hasta  el  nivel  de  los  8  a   16  km  de  la  troposfera  a  razón  de    aproximadamente 6,5 C/km, el  aumento de la temperatura  con la altitud se conoce   como  inversión  del  perfil  de  temperatura   normal.  Sin  embargo,  se  trata  de  una    característica  común  de  ciertas  capas  de  la  atmósfera.  Las  inversiones  térmicas    actúan como tapaderas que frenan los movimi entos ascendentes de  la atmósfera.   En efecto, el aire no puede elevarse en u na zona de inversión, puesto que es más   frío y, por tanto, más denso en la zona inferior.      El fenómeno de inversión térmica se pres enta cuando en las noches despejadas el   suelo  ha  perdido  calor  por  radiación,  las   capas  de  aire  cercanas  a  él  se  enfrían    más  rápido  que  las  capas  superiores  de   aire  lo  cual  provoca  que  se  genere  un    gradiente positivo de temperatura con la alti tud (lo que es un fenómeno contrario al   que  se  presenta  normalmente,   la  temperatura  de  la  tropos fera  disminuye  con  la    altitud).  Esto  provoca  que  la  capa  de  ai re  caliente  quede  at rapada  entre  las  2    capas  de  aire  frío  sin  poder  circular,  ya  q ue  la  presencia  de  la  capa  de  aire  frío    cerca del suelo le da gran estabilidad a la  atmósfera porque prácticamente no hay   convección  térmica,  ni  fenómenos  de  transpor te  y  difusión  de  gases  y  esto  hace    que disminuya la velocidad de mezclado vertic al entre la región que hay entre las   2 capas frías de aire.       El  fenómeno  climatológico  denominado  in versión  térmica  se  presenta    normalmente  en  las  mañanas  frías  sobre  los  va lles  de  escasa  circulación  de  aire    en  todos  los  ecosistemas  terrestres.  También  se  presenta  este  fenómeno  en  las    cuencas cercanas a las laderas de las  montañas en noches frías debido a que el   aire  frío  de  las  laderas  desplaza  al  ai re  caliente  de  la  cuenca  provocando  el    gradiente positivo de temperatura.       Los vientos a escala planetaria.      Definen  la  dirección  dominante  y  la  ve locidad  o  fuerza  estacional;  tienen  la    particularidad de mantener la dirección co nstante. La ciudades ubicadas en torno   al  ecuador  están  regidos  por  calmas  o  \" doldrums\";  aquellas  influenciadas  por  los    alisios  tienen velocidades muy debilitadas en  invierno, con un alto número de días   con  calma.  Finalmente,  las   que  se  encuentran  en  latitude s  altas,  reciben  vientos    constantes de velocida d elevada a moderada.    Altitud, inversión té rmica y contaminación.    Como se indicó, dependiendo  de la altitud, una ciudad se ubicará bajo o sobre la   inversión  térmica.  Si  ocurre  lo  primero,   las  condiciones  para  la  contaminación    serán  adversas;  en  cambio  si  se  ubica  sobr e  ella,  estará  bajo  la  influencia  de  la    masa  de  aire  subsidente  libre  de  cont aminación  atmosférica.  Ciudades  ubicadas    en  zonas  montañosas  o  mesetas  altas  frec uentemente  están  sobre  la  inversión    térmica de carácter planetario.   \nRelieve, inversión térmica y contaminación.     En  relieves  montañosos  suele  producir se  una  inversión  térmica  generada  por    masas de aire que al descender por las lade ras se calientan por compresión. Este   fenómeno tiene doble consecuen cia; por una parte, gener a una inversión baja que   limita la dispersión de los c ontaminantes, y por otra, arra stra los contaminantes de   la ciudad hacia un solo sector.    Cuando  una  ciudad  se  encuentra  en  un  área   limitada  total  o  parcialmente  por    montañas, la inversión térmica hace el efec to de una \"tapa de ol la\" que no permite   la  salida  de  los  contaminantes  del   área  urbana;  si  el  fenómeno  se  produce  en    ausencia de vientos, el problema se agudiza.    Relieve, vientos y dispersión de contaminantes.     Al  margen  del  régimen  de  vientos,  el   emplazamiento  de  una   ciudad  en  una  zona    rodeada  por  montañas,  ya  sea  en  una  cuenca  te ctónica  o  una  depresión,  influye    en  la  dispersión  de  los  c ontaminantes,  ya  que  ellos  se   ven  limitados  al  área    circunscrita  por  el  relieve.  Dependiendo   del  tamaño  de  la  geoforma,  los    contaminantes tendrán mayor o menor  espacio para dispersarse.    Una ciudad ubicada en un  valle fluvial o glacial estará limitada por las laderas de   las montañas; los contaminant es tendrán poco espacio y  sólo dos direcciones para   dispersarse. Los factores que determinan di cho espacio son el ancho del valle y la   altura de las laderas.    La  rugosidad  del  terreno,  es  decir  los   accidentes  geográfic os  que  presenta  un    área,  define  la  velocidad  de l  viento  y  su  dirección.  Mientras  más  caótico  se    presenta  el  relieve  mayores  obstáculos  origina  y  por  lo  tanto  genera    comportamientos diferenciados.    Relieve, obstáculos, vientos y  dispersión de contaminantes.     La  localización  de  una  ciudad  con  respec to  al  relieve  circundante  y  las  formas    topográficas  que  en  ella  se  encuentran,   define  la  dirección  del  viento  y  la    circulación de tipo turbulent o. La presencia de cerros is las o de cordones generan   diferentes  tipos  de  flujos;  ellos  pueden  cons tituir  una  ventaja  o  ser  perjudiciales    para la dispersión de contaminantes.    Volumen de población.     El volumen de población define en la mayo ría de los casos el tamaño de la ciudad   y las actividades que allí se desarrollan. Es to no es condición sine qua non, ya que   dependiendo del tipo  de cultura, la pobl ación se aglomerará en espacios mayores  \no  menores.  Es  el  caso  de  las  ci udades  europeas  en  comparación  con  las    norteamericanas;  sin  embargo,  el  modelo   moderno  marca  en  cierta  medida  la    tendencia  a  aumentar  el  tamaño  de  una  ciudad   conforme  crece  su  población.  En    líneas generales, son las grandes ciudades  las que sufren los mayores trastornos   por contaminación atmosférica.    Tamaño y forma de la ciudad.     El  tamaño  de  una  ciudad  es  incidente  en  lo s  procesos  de  contaminación  urbana,    debido  a  que  implica  mayor  población,   actividad  y  más  desplazamientos.  Sin    embargo,  hay  ciudades  que  regulan  su  crecim iento  privilegiando  la  construcción    en altura.    La forma de una ciudad también influye en  los parámetros antes mencionados, ya   que  los  desplazamientos  dentro  de  ella   están  condicionados  por  los  ejes  de    conexión. Por ejemplo, una  ciudad alargada tendr á ejes longitudinal es primarios y   numerosos secundarios; en cambio una ciu dad irregular implica ejes radiales más   eficientes.  El  emplazamiento  en  relieves  planos  o  inclinados  también  genera    diferencias  en  los  movimientos  de  la  población  y  en  la  localización  de  la    infraestructura urbana.    Islas de calor urbano.     Las  islas  de  calor  urbano,  aquellas  zo nas  donde  predomina  el  cemento  y  la    edificación en altura, son centros que c ondicionan la circulación solenoidal.    Dependiendo de su tamaño, del volumen de  la población y de la urbanización, una   ciudad puede tener una o varias islas de calor urbano.    Ciudad, actividades de la pobl ación y contaminación urbana.     Son las actividades de la población las  que producen la contam inación atmosférica   en  una  ciudad.  Estas  actividades  pueden  clasif icarse  en  primaria s,  secundarias  y    terciarias; ellas tienen dife rentes grados de incidencia.    En  general,  las  actividades  primarias  son  extractivas  y  se  desarrollan  en  zonas    rurales.  Sin  embargo,  éstas  se  dan  en  m enor  escala  dentro  de  las  ciudades,  por    ejemplo, extracción de ári dos o pequeña agricultura en  parcelas. La contaminación   que  se  relaciona  a  ellas  se  deriva  de   las  emisiones  de  polvo  en  suspensión    producidas  en  las  faenas,  del  transporte  y  de  los  insumos  utilizados  como    fertilizantes y pesticidas.    Las  actividades  secundarias,   principalmente  las  industr iales,  son  las  que  emiten    mayor  cantidad  de  contaminantes  dada  la   naturaleza  misma  de  los  procesos   \ninvolucrados.  En  general,  las  plantas  de  ener gía  eléctrica,  la  siderurgia  y  otras    derivadas  de  la  petroquímica  son  las   que  producen  mayor  contaminación.  A    menudo,  se  regula  para  que  éstas  se  ubi quen  en  barrios  industriales  o  en  la    periferia,  generando  igualmente  altos   niveles  de  contaminantes  que  pueden    desplazarse por la ciudad a merced del viento.    Las actividades terciarias o de servicios,  en general son inocuas;  tal es el caso de   las labores del gobierno, del comercio y  de la banca. Sin embargo, el transporte es   una  de  las  fuentes  de  mayor  contaminac ión  de  las  ciudades.  Sus  efectos  se    definen  según  el  tamaño  del   parque  automotor,  los  despl azamientos  diarios  y    estacionales de la población y el estado  de las calles (pavimento o tierra).    EL FACTOR TÉRMICO COMO ORIGE N DE DAÑOS EN LA EDIFICACIÓN.      La  temperatura  ambiente  va  a  afectar  ta nto  en  el  período  de  ejecución,  como    durante  la  vida  útil  del   edificio  (incidiendo  dire ctamente  en  los  elementos  y    materiales que conforman las edificaciones).       El  efecto  que  la  oscilación  térmica  provoc a  en  los  edificios  es  el  del  movimiento    tanto de la estructura como del resto  de elementos secundarios que lo componen,   quedando estos sometidos a contracciones y dilataciones.      En general, las características de los mate riales y elementos constructivos frente a   la variación de temperatura van a  depender de los siguientes condicionantes:   •   Condiciones ambientales.    •   Tipología  de  edificación  (luces,  geom etría  y  dimensiones,  soluciones    empleadas).   •   Exposición  del  edificio  o  de  los  el ementos  constructivos  a  los  agentes    térmicos.   •   Tipología de los materiales  (madera, acero, hormigón,etc.).   •   Características  de  los  materiales:  la   conductividad  térmi ca,  coeficiente  de    dilatación, calor específico, re sistencia, retracción, etc.   •   Condiciones de aislamiento.      Las causas que producen la alteración de los materiales en las fachadas pueden   ser:      1.- Agua : marina, de lluvia o de capilaridad (abs orción a través del suelo). El agua   reacciona  con  el  sustrato  pétreo  diso lviendo  sus  componentes  y  actuando  como    vehículo de transporte.    2.- Viento .  El  viento  transporta  partículas  de   arena  que  golpean  los  materiales,    desmoronándolos  al  cabo  del  tiempo,   agravándose  en  presencia  de  sales  y    humedad.  \n3.- Temperatura .  Cambios  de  temperatura,  heladas.  La  congelación  del  agua  o    condensación  del  vapor  de  agua   aumenta  el  volumen  del  material,  las  tensiones    provocadas por el hielo s obre paredes internas y capilares de éste pueden llegar a   romperlo  y  los  ciclos  de  hielo-deshiel o  originan  exfoliaciones.  Los  efectos    provocados  por  el  hielo   dependen  del  volumen  del  mi smo  y  de  su  lugar  de    formación.   4.- Agentes  atmosféricos .  Contaminantes  atmosféricos  como  los  óxidos  de    nitrógeno,  carbono  y  azufre,   que  proceden  de  la  combusti ón  de  hidrocarburos,  el    gas  metano  emitido  por  los   fertilizantes  y  la  quema  de  bosques  y  los  gases  de    combustión  de  residuos  sólidos.  La  pr esencia  de  partículas  atmosféricas    contaminantes produce una degradación en los materiales.   5.- Biodeterioro   o  acción  de   Agentes  biológicos :  los  musgos,  líquenes,  hongos    retienen  humedad,  favorecen  la  colonizaci ón  y  producen  ácidos  que  modifican  el    color del material. Se incluy e la acción de algunas bacter ias, como las autótrofas,   que  se  desarrollan  con  la  propia  acción   de  la  luz,  las  sulfobacterias  que    transforman  compuestos  silicatados  en  ácidos   y  oxidan  el  azufre  a  sulfato  y  las    nitrificantes  que  producen  nitritos  y  nitrat os  que  al  reaccionar  con  el  carbonato    cálcico  de  los  materiales  calcáreos  puede n  formar  nitrato  cálcico.  También  los    insectos  y  los  roedores  movilizan  materi al  y  los  ácidos  (nítrico  y  fosfórico)    presentes en los excrementos de las aves favorecen la degradación del material.      LLUVIA ACIDA.   La  lluvia  ácida  presenta  un  pH  menor  (más   ácido)  que  la  lluvia  normal  o  limpia.    Constituye  un  serio  problema  ambiental   ocasionado  principalmente  por  la    contaminación  de  hidrocarburos  fósiles.   Estos  contaminantes  son  liberados  al    quemar  carbón  y  aceite  cuando  se  usan  co mo  combustible  para  producir  calor,    calefacción o movimiento (gasolina y diesel).       La lluvia ácida se forma generalmente en  las nubes altas donde el SO2 y los NOx   reaccionan  con  el  agua  y  el  oxígeno,  fo rmando  una  solución  diluida  de  ácido    sulfúrico y ácido nítrico. La radiación sola r aumenta la velocidad de esta reacción.    SO3 + H2O --> H2SO4    2NO2 + H20 --> HNO3 + HNO2      La  lluvia,  la  nieve,  la  niebla  y  otras   formas  de  precipitación  arrastran  estos    contaminantes  hacia  las  par tes  bajas  de  la  atmósfer a,  depositándolos  sobre  las    hojas de las plantas, los edificios, los monumentos y el suelo.    Una lluvia  ̈limpia ̈ es imposible de despoj ar de partículas de polvo y polen y de un   pH  cercano  al  5.6  (ligeramente  ácido).  Al   adicionarse  SO2  y  NOx  el  pH  se  torna    dramáticamente ácido (por los  ácidos sulfúrico y nítrico  formados en la atmósfera).    La lluvia ácida huele, se ve y se siente igual que la lluvia normal, y se podría decir   que  podemos  bañarnos  con  ella  sin  sentir   un  efecto  inmediato  especial.  Los    productos  del  hombre,  monument os  y  edificios,  son  más  susceptibles  a  la  acción    de la lluvia ácida. Muchas ruinas han  desaparecido o están  en vías de hacerlo, a   causa de este factor.   \nEl agua de lluvia es ligeram ente ácida porque el agua y  el dióxido de carbono del   aire forman ácido carbónico y tiene un pH  entre 5.7 y 7. En lugares contaminados   por ácido sulfúrico y ácido nítrico el  pH de esa lluvia varía entre 5 y 3.          FENÓMENO PATOLÓGICO CONSTRUCTIVO.      Es  la  disfuncionalidad  de  una  obra,  t anto  en  proceso  constructivo  como  ya    construida.      Los  fenómenos patológicos  son causados por defectos en:   •   Los  diseños  de  las  obras  (arquitectónicos,  estructurales,  constructivos,    técnicos).   •   Los materiales usados.   •   Los procesos constructivos seguidos.   •   Los usos dados a las obras.   •   La acción de los agentes externos.      PROCESO PATOLÓGICO.      Para  atacar  un  problema  constructivo,  debemos   diagnosticarlo ,  es  necesario    conocer    sus  síntomas,  su  estado  actual,  su  proceso,  su  evolución,  sus    causas, su origen.      Estos  aspectos  agrupados  secuencialmente,  es  lo  que  se  llama   el  Proceso    Patológico.      El  Diagnóstico   permite  establecer,  tanto  la   Estrategia  de  Reparación   como  las    Hipótesis para la Prevención.       Esa  secuencia  temporal  del  proceso,   permite  distinguir  tres  partes:   el  Origen,  la    Evolución y el Resultado Final (lesión).   Para  el  estudio  (diagnóstico),  se   debe  recorrer  dicha  secuencia  de  un  modo    inverso,  así:  observar  el  resultado  de  la  lesión,   el  Síntoma,   para,  siguiendo  la    Evolución  de la misma, llegar a su origen,  la Causa.      IMPORTANCIA DE LA PATOLOGÍA  DE LA CONSTRUCCIÓN.   Uno  de  los  inconvenientes  de  la  Patolo gía  de  la  Construcción,  consiste  en    determinar  con  precisión  la  condici ón  de  buen  o  mal  comportamiento  de  una    edificación,  para  lo  cual  se   requiere  criterio   adecuado  por  parte   de  quien  analiza    las evidencias de la eventual falla.  Esa  primera evidencia puede   surgir  por  parte    de cualquier persona, no necesariamente de  alguien vinculado con la construcción   por  lo  que  su  apreciación  no  puede  ser   la  base  para  una  decisión  distinta  de   \nsolicitar  la  presencia   de  quien  conozca  sobre  el   comportamiento  de  las    edificaciones, para dar una opinión cierta  y fundamentada sobre  el posible daño.   Una  de  las  principales  valoraciones  que   se  debe  realizar,  toma  en  cuenta  el    proceso constructivo para determinar si  una manifestación patológica proviene de   tal circunstancia o es fruto de funcionamient o de la edificación en servicio.  De allí   surge la necesidad de conocer  los antecedentes de la es tructura desde el mismo   momento  de  creación,  asociado  con  ca da  uno  de  los  procesos  seguidos  en  la    etapa de su fabricación.      PATOLOGÍA DE LA CONSTRUCCIÓN.      Aparentemente la Patología de la constru cción representa una intromisión en otras   áreas del conocimiento, pero para una mejo r comprensión conceptual de ella más   adelante haremos un símil con las ciencias m édicas, por lo que   históricamente ha   sido empleado como una rama de la medicina en  la cual “La Patología es la parte   de ésta que trata del estudio de las Enferm edades”, es así que  no es a partir de   las personas sanas que se hace la docencia  y práctica médica, sino frente a quien   padece  una  dolencia,  por  lo   que  evaluando  su  cuadro   clínico  se  hace  el    diagnóstico, se formulan estrategias  y se dan pautas para su solución.      Algo  similar  ocurre  con  las  edificaci ones  cuando  a  partir  de  los  daños  que    manifiesten,  se  formulan  procesos  de   intervención  y  se  crean  metodologías  para    evitar que tales hechos se repitan en las nuevas obras.       La palabra PATOLOGÏA tiene su origen  en dos palabras griegas que son:   Pathos:  Enfermedad.   Logos:  Estudio.      La patología clínica se divide en varias partes, así:      •   Etiología:   es  el  estudio  de  las  causas  de  las  enfermedades  y  suele    constituir  la  primera  parte  de  la   exposición  o  descripción  de  los  estados    morbosos.   •   Anatomía patológica:  es el estudio anatómico ma cro y microscópico de los   órganos enfermos.   •   Sintomatología:   es  la  rama  de  la  patología  dedicada  al  estudio  y    conocimiento de los síntomas.   •   Pronóstico:  es el juicio que se forma el médico respecto a los cambios que   pueden  sobrevenir  durante  el   curso  de  una  enfermedad  y  sobre  su  duración  y    terminación según los síntomas que  la han precedido o la acompañan.      La  palabra   Patología    (sustantivo),  designa  la  cienc ia  que  estudia  los  problemas,    su proceso y sus soluciones.  \nPor asociación de términos,  LA PATOLOGÍA DE  LA CONSTRUCCIÓN  se puede   definir como:      La  ciencia  que  tiene  por   objeto  dar  una  explicación   científica  al  comportamiento    anormal (anómalo) de los materiales y de  los subsistemas constructivos, a través   de  un  estudio  sistemático  y  ordenado  de   los  daños  y  deterioros,    analizando  y    determinando sus causas y la manera como  influyen en la obra,  para mediante la   formulación  de  procesos  estimar  la  vida  residual,  y  determinar  las  medidas    correctivas  que  permitan  recuperar  la s  condiciones  de  desempeño  de  la  obra    teniendo  en  cuenta  la  factibilidad  econó mica  y  segura  de  su  reparación  y/o    mantenimiento, o si por el contra rio es necesaria su demolición.      La palabra  Patológico  (adjetivo), califica los procesos  y estudios relativos al tema,   así:  el  término   Proceso  Patológico   de  un  elemento  constructivo  o   Estudio   Patológico  del mismo, se utiliza para determinar  su proceso o su resolución.      Los  problemas  patológicos  pueden  pr esentarse  durante  el  proceso  de    construcción o durante la vida útil  de la obra (período de servicio).      RAMAS DE LA PATOLOGÍA.      Patología Pediátrica    Patología Curativa    Patología Geriátrica   Patología Preventiva   Patología Forense          PATOLOGÍA PEDIÁTRICA:      Estudia  los  procesos  patológicos  desde   el  nacimiento  de  la  obra,  desde  que    comienza la concepción del proyecto.      Se  debe  realizar  entonces,  el  análisis  de l  ciclo  de  vida  desde  el  diseño  hasta  la    demolición.    Las  decisiones  en  el   diseño  pensando  en  la  conservación  y    pronosticando problemas, hacen ahorrar mucho dinero.      Por  su  parte  la  vida  útil  predicha  es  re sultado  de  registro  de  experiencia  o  de    ensayos acelerados.  Una vez que el proyecti sta ha establecido la  vida útil prevista   ha de comprobar que los materiales y sist emas que elige para el proyecto tienen   una vida útil predicha igual o mayor que la prevista.       Durante  la  vida  útil  de   los  componentes  de  un  edificio,  debe  garantizarse  que  se    mantienen los siguientes aspectos:  \n•   Prestaciones.   •   Funcionalidad.   •   Especificaciones.   •   Costos iniciales estimados.   •   Listas de chequeo para las fases de construcción.   Igualmente la vida útil debe  estar relacionada con:   •   La caracterización del  medio ambiente.   •   La  información  sobre  la  vida  útil  norma l  de  los  materiales  y  sistemas,  así    como las recomendaciones de mantenimient o asociadas a esta vida útil.    •   Las estimaciones del Costo de Ciclo de Vida.   •   Las listas de chequeo para las fases  de evaluación y mantenimiento.   PREVENCION DESDE LA CONCEPCION.      Un factor de contribución en muchas fallas  en las edificaciones, se debe a la falta   de una efectiva comunicación entre las partes vinculadas al diseño, construcción,   y mantenimiento de las estructuras.      Es  esencial  que  las  intenciones  del  dis eñador,  los  principios  que  soportan  el    diseño  y  las  razones  de  varios  detalles  o  despieces  sean  comprendidas  por    quienes  son  responsables  de  la  cons trucción  y  de  manera  inversa,  que  el    diseñador  este  completamente  enterado  de   los  procedimientos  constructivos  que    se propongan.      LA RELACION ARQUITECTO-INGENIERO.       Ya  se  mencionó  la  labor  previa  de  C oordinación  que  debe  darse  antes  de  la    formulación  del  Proyecto  Estructural.     Se  insiste  sobre  la  necesidad  de  realizar    rutinariamente  esta  labor  no  sólo  en  be neficio  de  la  creac ión  arquitectónica,    estructural y demás proyectos, sino en cons ideración a los procesos constructivos   ya sea por el desarrollo pau latino del mismo o por el  grado de complejidad que la   obra impone.      No es buena estrategia dejar  para definir en la obra  aspectos que necesariamente   deben  abocarse  durante  la   formulación  de  los  proyectos,  por  cuanto  este    aplazamiento  nada  aporta  a  la   solución  de  cualquier  pr oblema  e  inclusive  puede    representar sobrecostos innecesarios.       La Norma NSR-98 establece (A.9.3.3) la  responsabilidad de la  coordinación entre   los  diferentes  diseños  en  el  profesional   diseñador  de  la  arquitectura,  quien  debe    tomar  todas  las  precauciones  necesarias   para  que  el  diseño  estructural  no  se    afecte por su diseño o por lo s otros diseños de ingeniería.  \nLA COORDINACION DE PROYECTOS.      La  amplia  gama  de  c onocimientos  propios   del  desarrollo  cultural  y  científico  que    hoy poseen todas las profes iones, ha producido en c ada una de ellas un nivel de   especialización  hasta  hace  poco  inimagin able,  de  manera  que  para  el  caso    particular  de  las  edificaciones,  lo  que  antes   era  de  dominio  del  diseñador  y  del    constructor,  hoy  es  realizado  por  un  c onjunto  de  profesionales  de  las  diversas    especialidades,  constituyendo  ese  grupo  té cnico,  un  apreciable  recurso  para    beneficio  del  proyecto  cuando  cada  uno   de  ellos,  bajo  la  coordinación  del    proyectista, desarrollan de m anera coordinada sus actividades.      No  es  lo  mismo  pretender  diseñar  una  estr uctura  de  un  proyecto  arquitectónico    finalizado,  que  haber  participado   como  consultor  estructural  durante  la  génesis  y    desarrollo del proyecto arquitectónico.   Los beneficios que se derivan de tal labor   conjunta saltan a la vista.   Cuando fruto de esa sintonía  profesional, el arquitecto   proyectista  coloca  sobre  la  mesa,  por  ej emplo,  los  conceptos  de  distribución  de    espacios  o  su  propuesta  de  volumetría   y  el  consultor  estructural  asesora  y    conceptualiza el comportamiento de determi nado sistema estructural, el resultado   no  puede  ser  otro  que  una  ar quitectura  con  estructura  a   la  que  sólo  le  hará  falta    determinar su resistencia.       Ha sido costumbre en nuestro  medio, que cualquier anom alía se soluciona con la   ruptura  de  los  elementos  estr ucturales,  con  lo  cual  ha  hecho  carrera  suplantar  la    obligada  coordinación  de  planos  con  la   improvisación  y  falta  de  rigor  en  los    procesos constructivos.      Es necesario aclarar que la  vida útil prevista es la durac ión que el propietario y el   proyectista  establecen  para   el  conjunto  del  edificio  y  sus  componentes.    Ejemplo    de valores mínimos manejados son los siguientes :    Escuelas, edificios oficiales, estructura de hormigón 100 años.   Escuelas, edificios oficiales, estructura de acero 100 años.   Escuelas, edificios oficiales,  estructura de ladrillo 60 años.   Naves en hormigón 40 años.   Naves en acero 40 años.   Naves en ladrillo 25 años.   Para componentes los valores son s ensiblemente inferiores, ejemplos :    Particiones 15 años   Acabados de capa fina 10 años      ALCANCE DE LA PATOLOGIA PEDIATRICA.      En  general,  desde  el  punto  de  vista  de  la   patología  pediátrica,  el  estudio    patológico,  se  convierte  más  en  una  cons ultoría  de  evaluación,  comprobación  y    verificación de los diseños del proyecto y  por lo tanto debe abar car las siguientes   etapas:  \n•   Revisión del proyecto arquitectónico,  constructivo, estructural y técnico.   •   Investigación de la calidad de los materiales a emplear.   •   Investigación de los sistem as constructivos a utilizar.   •   Análisis de la logístic a y proceso de ejecución.      Teniendo  en  cuanta  lo  anterior  es  de   gran  importancia  pod er  en  esta  etapa    pediátrica  de  la  edificación  hacer  un  ri guroso  análisis  y  estudio  de  todos  los    planos,  detalles  y  documentación  que  sobr e  el  mismo  se  genera  en  la  etapa  de    prefactibilidad  y  factibilid ad  y  previa  a  la  construcción  de  manera  que  se  puedan    ver  los  diseños  como  un  todo  integral,  ta l  como  se  comportará  la  edificación    durante  su  vida  útil  y  en  caso  de  encon trar  una  deficiencia  arquitectónica,    estructural,  constructiva  o  técnica,   hacer  las  recomendaciones  necesarias  para    prevenir  desde  este  momento  posibles  fe nómenos  patológicos  y  por  lo  tanto  es    fundamental entonces, definir perfectamente c uál es el alcance del encargo y cuál   es  la  misión  concreta  del  estudio,  pues  la  responsabilidad  puede  quedar  mal    definida. Y por lo tanto podría  permitir la omisión de proc esos de verificación, que   generen  durante  el  proceso  constructivo   o  la  vida  útil  de  la  edificación  la    incorporación de factores de riesgo des encadenantes en fenómenos patológicos.      PLANTEAMIENTO DEL ENCARGO DE  LA PATOLOGIA PEDIATRICA.      En  este  proceso,  será  necesario  hacer   un  trabajo  permanent e  con  el  equipo  de    diseño, mientras el equipo interno de cons ultoría hace los anális is adelantados de   cada tema que afectará a la edificación, es  decir, un estudio de los materiales que   se van planteando un estudio de asoleamient o, de agresividad de  medio ambiente   incluido  el  suelo  así  como  un  estudio   de  cómo  pueden  afectar  los  factores  que    intervienen en la durabilidad.      Este  proceso  es  fundamental  para  poder   ir  haciendo  las  re comendaciones  de    manera oportuna que puedan mejorar los conc eptos de diseño y de selección de   materiales.      La  segunda  posibilidad   que  se  puede  presentar,  es  que   el  proyecto  llegue  a    manos  del  consultor  en  patología  como   proyecto  ya  terminado  o  mejor  diseñado,    lo cual varia considerablement e las condiciones de evaluaci ón, en este caso ya no   se  requiere  un  proceso  tan  lento  y  dispen dioso,  por  el  contrario  es  mucho  mas    corto  y  por  lo  tanto  exigente  pues  se  cu enta  con  menor  tiempo  para  hacer  una    revisión exhaustiva, la cual no puede dejar  nada por fuera de estudio, lo implica un   mayor nivel de concentración, además de  un mayor nivel de disponibilidad de los   diseñadores,  ya  q  en  caso  de  no  contar   la  información  completa  o  de  requerir    aclaraciones a la información suministr ada, esta deberá ser aportada en el menor   tiempo  posible  ya  que  si  el  proceso  de  co nsultaría  es  lento,  esto  puede  generar    tiempos  muertos  en  el  proceso  de  ajuste   del  proyecto  completo  y  que  a  la  final    pueden tener implicaciones en los análisis financieros del proyecto.  \nIMPLICACIONES DEL ENCARGO DE  PATOLOGIA PEDIATRICA.      Cuando  se  pretende  afrontar   un  proceso  de  estudio  y  revisión  de  un  proyecto    desde  la  óptica  de  la  patología  pediátrica,   es  necesario  tener  claridad  en  varios    aspectos que son fundamentales para garantiz ar no solo el éxito de esta labor de   consultoría  sino  también  y   la  más  importante  del  éxito   del  proyecto  constructivo,    entre los cuales se encuentran los siguientes:      •   Será  necesario  que  el  consultor  tenga   conocimiento  de  todo  el  proyecto  y  sus    partes complementaria es decir, será nec esario estudia el  100% del proyecto y   este conocimiento del mismo se debe realiz ar al 200%, esto quiere decir que no   se puede omitir ninguna parte  del mismo por insignificante que parezca, puesto   que  dejar  cualquier  componente  de  la  edifi cación  sin  estudiar  podría  entrañar    algún factor de riesgo para el mismo bien  sea dentro de la etapa constructiva o   de la vida de la edificación .   •   Para  poder  abordar  todos   los  componentes  de  la  edifica ción  como  ya  se  dijo,    será  entonces  necesario  que  el  consul tor  tenga  un  basto  c onocimiento  sobre    todos  los  materiales    a  utilizar,  sobre   los  sistemas  constructivos  a  emplear  y    sobre  todo  de  la  normativa  que  cobija  cada  uno  de  los  materiales  y  de  los    sistemas constructivos a desarrollar en el proceso.   •   Así  mismo  será  requerimiento  fundament al  que  el  consultor  cuente  con  un    equipo de profesionales expertos en cada  uno de los temas de la construcción   y  no  solo  de  la  parte  técnica  sino  también  de  los  complementarios  como    podrían  ser  los  temas  de  urbanismo,  arqui tectura,  asoleamie nto,  financiero  y    etc.,  de  manera  tal  que  la  consultoria   pueda  ser  de  un  aporte  valiosos  en  el    éxito  tanto  técnico  como  financiero  del   proyecto.    Por  lo  tanto  el  consultor    deberá tener a disposición del proyecto un  completo equipo interdisciplinario, lo   que significa casi contar con una empres a constructora dedicada únicamente al   estudio de un proyecto externo a la organización.      PROCESO GENERAL DE EVALUACIÓN.      1. Definición de planos a revisar:      •   Topografía, corte perfiles,  planimetría, altimetría.   •       •   Arquitectónicos:    o   Plantas generales.    o   Cortes  circulaciones,  puntos  fijos,   cuartos  técnicos,  longitudinales  y    transversales, corte por fachada con ventanería y balcones,    o   Fachadas, tantas como tenga el edificio.   o   Cubiertas.    o   Urbanismo.    o   Localización   \n•   Estructurales:    o   Cimentaciones.    o   Contenciones    o   Estructura vertical    o   Estructura horizontal e inclinadas    o   Despieces completos    o   Detalles    •   Técnicos    o   Hidráulicos    o   Sanitarios    o   Eléctricos.    o   Gases    o   Aire acondicionado/calefacción    o   Especiales (ascensores, escaleras,  montacargas, grúas, compuertas   •   Detalles arquitectónicos    •   Detalles constructivos    •   Prediseños especiales       •   Estudios    o   Suelos    o   Asoleamiento    o   Contaminación de la zona.      2. Procedimiento a seguir.      Si  bien  es  cierto  que  cada  profes ional  puede  desarrollar  una  metodología    especifica  para  adelantar  el  estudio   de  la  documentación  del  proyecto,  a    continuación se plantea un modelo de referencia:      En  primer  lugar  se  deberá   hacer  una  revisión  detallada   de  todo  el  proyecto    arquitectónico,  revisando  en   primer  lugar  las  plantas   y  a  continuación  cruzarlas    con  los  cortes  para  identificar  errore s  de  diseño  o  de  dibujo,  es  claro  que  la    revisión  que  se  adelanta  debe  hacerse  sobre  planos  muy  definitivos,  es  decir    planos de construcción, a continuación se  deberán revisar los planos estructurales   verificando que todos los elementos que co mponen la edificación estén completos,   así  mismo  que  tengan  todas  la s  especificaciones  y  definiciones  en  cuanto  a  las    secciones, distribuciones de ref uerzo y diámetros de aceros.      Posteriormente,  se  deberán  inte grar  ambos  proyectos,  es   decir,  arquitectónicos  y    estructurales  para  verificarla  coincide ncia  entre  ambos  y  así  identificar    inconsistencias  que  se  puedan  dar  o  errores  de  dibujo  entre  los  dos  que  puedan    generar errores en el proceso constructivo.     \nLuego  de  tener  la  certeza  de  que  ambos  proyectos  principales  están  aceptados,    se  deberá  continuar  con  los  proyectos  técn icos,  abarcando  los  hidrosanitarios,    eléctricos,  de  gas  y  equipos  especiales,  además  estos  deberán  estar    acompañados  de  las  memorias  de  cálculo   para  garantizar  que  estos  diseños    suplen las demandas mínimas  aceptables de la edificación  próxima a construir, así   mismo se deberá garantizar que los detall es de construcción para estos proyectos   estén completos.      Luego  se  integran  estos  proyectos  a  los   dos  anteriores,  para  verificar  su    compatibilidad técnica, constructiva y funcional.      En  este  momento,  se  tiene  el  suficient e  conocimiento  del  proyecto  para  entrar  a    revisar los detalles constructivos y arquite ctónicos los cuales no solo deben estar   bien  diseñados,  sino  que  también  deben  dar  cl aridad  sobre  los  aspectos  no  muy    claros de la revisión anterior, es decir si  en el proceso anterior se encuentra algo   no muy claro, los detalles tanto construc tivos como arquitectónicos deben resolver   estas  inquietudes,  de  lo  contrario  será  necesario,  hacer  recomendaciones  de    ajuste.      Cuando  se  adelanta  este  proc eso,  el  evaluador  deberá  tomar  conciencia  de  que    esta  haciendo  una  construcción  virtual  de l  proyecto,  es  decir  debe  no  solo    identificar  errores  o  inconsistencia,  sino   que  también  debe  identificar  los  posibles    problemas  o  dificultades  que  se  pueden  pr esentar  durante  la  etapa  constructiva,    con  el  fin  de  hacer  las  recomendaciones  de  ajuste  de  diseños  o  también    establecer las recomendaciones  de construcción que permitan  si no eliminar por lo   menos si minimizar las dificultades en  el  proceso,  ya  que   esto no solo redundará   en  rapidez  de  construcción  y  en  calidad   constructiva  sino  también  en  los    componentes financieros del proyecto.      3. Revisión de especificaciones.      En  primer  lugar  se  debe  garantizar  que   las  especificaciones  de  materiales  a    colocar  en  el  proyecto,  cumplan  con  la s  normas  de  calidad  establecidas  por  el    ente  normalizador  de  cada  país,  en  segundo   lugar  se  debe  asegurar  que  los    materiales  propuestos  cumplan  con  los   requisitos  mínimos  de  durabilidad,  los    cuales deben ser consecuentes con la vida  útil prevista dada para  la edificación, y   si  bien  es  cierto  que  cada  ma terial  podrá  tener  una  vida  út il  diferente  entre  si  y    diferente  a  la  de  la  edificación  como  un   todo,  se  debe  verificar  que  se  encuentra    entre los rangos mínimos aceptables para cada caso.      Finalmente,  se  debe  busca r  que  las  especificacione s  de  cada  material  estén    avalados  por  ensayos  de  laboratorio,  en  caso  contrario  se  debe  buscar  hacer  los    ensayos de calidad mínimos para dar el  visto bueno y de aceptación a cada caso   especifico,  esta  situación  se  debe  dejar   claramente  establecida  al  momento  de    aceptar la evaluación desde el p unto de pediátrico de un proyecto.  \nENTREGABLE.      1.  Acompañamiento  durante  el  proceso:  en  es te  caso  como  se  ha  realizado  una    verificación de los avances durante toda  la etapa de diseño, y se han realizado   las observaciones y correcciones necesarias,  el entregable se constituirá en un   documento resumen de las reuniones y observaciones realizadas a lo largo de    la  revisión  y  verificación  de  los  diseños,   igualmente,  se  dejar á  constancia  de    las  mejoras  que  se  han  obtenido  durante  las  correcciones  realizadas  a  los    diseños.      2.  Revisión  sobre  material  diseñado:    en   este  caso  al  culminar  el  proceso  de    evaluación detallado y recopilando las conclusiones obtenidas por el equipo de   especialistas, se deberá el aborar un documento en el cu al se consignen éstas   y  en  donde  se  podrá  llegar  a  cuatro  pos ibilidades  claramente   definidas,  pero    que  no  necesariamente  tendrán  que  abarc ar  la  totalidad  de  los  diseños,  a    saber:   •   Devolución  de  diseños,  para  su  corrección  discriminando  claramente    cuales son los elementos o aspectos que se consideran se deben corregir y   las  razones  técnicas  para  ello,  en  este  caso  se  deberán  dar  algunas    recomendaciones generales.   •   Recomendaciones:  cuando  los  diseños   se  encuentran  bien,  pero  se    identifican  aspectos  específicos  en  lo s  cuales  se  pueden  hacer  mejoras,    será necesario que el consultor elabor e unas recomendaciones especificas   de  mejoramiento  del  proyecto,  las  cual es  finalmente  será  potestad  de  los    diseñadores  aceptar  o  no,   pero  en  todo  caso  se  debe   dejar  constancia  de    estas  y  por  lo  se  eximirá  de  responsabilidades   al  consultor  si  estas  no    son adoptadas en el proceso.   •   Un  caso  similar  al  anterior  se  da   cuando  el  proyecto  se  encuentra     satisfactorio,  pero  a  juicio  del  c onsultor  se  pueden  plantear  algunas    alternativas  de  materiales  o  de  sistem as  de  ejecución  o  constructivos  que    permitan desarrollar el proceso de ejecución de más óptima desde el punto   de vista de los recursos o de la velocidad de construcción.   •   La ultima posibilidad que se pude identi ficar, es aquella cuando después de   revisar todo el proyecto, éste se enc uentra satisfactorio y como conclusión   final se tendrá la aprobación de los diseños desde el punto de vista de una   evaluación pediátrica.         PATOLOGÍA PREVENTIVA.      Se refiere al mantenimiento de las edifi caciones.  Son las medidas tomadas para   evitar la aparición de  procesos patológicos.        \nVIDA ÚTIL DEL PROYECTO.       También  llamada   período  de  iniciación .    Está  definida  como  aquel  período  de    tiempo necesario, que ha sido previsto por   los  diseñadores  de  la  edificación  para    que un mecanismo de daño o un agente agresor de inicio al deterioro de la misma.   Es  decir,  que  la  vida  útil  del  proyecto  se   cumple  cuando  la  barrera  de  protección    de  la  obra  (por  ejemplo:   revoques  en  mamposterías,  estucos  sobre  revoques,    pinturas  sobre  estucos;  recubrimient o  del  hormigón  sobre  el  acero;  mantos    impermeables;  etc.),  ha  sido   vencida  por  el  agente  agres or,  pero  aún  no  se  ha    iniciado  el  debilitam iento  de  edificación.    Es  entonces  cuando  se  hace  necesario    definir  claramente  de  acuerdo  a  los  materi ales  empleados,  los  procedimientos  de    ejecución seguidos y al subsistema de la edi ficación, las diferentes vidas útiles del   proyecto y en consecuencia la vida útil total del proyecto       ALCANCE DE LA PATO LOGIA PREVENTIVA.      Como  alcance  principal  de  la  patología  pr eventiva,  se  tiene  prevenir  la  aparición    de los fenómenos patológic os durante la vida útil de la edificación.      En  este  caso  se  pueden  ident ificar  dos  aspectos  básico s  hacia  los  cuales  puede    estar orientada la actividad del consultor  en  patología  preventiv a,  y  que  de  una  u    otra  forma  todos  dos  est án  enfocados  a  garantizar  el   buen  comportamiento  y    la    durabilidad  del  edificio  o  de  sus  component es  durante  la  vida  útil  del  mismo,    permitiendo  además,  prolongar  esta  vida   por  encima  de  los  parámetros    establecidos desde la etapa de diseño en cuanto a al vida útil prevista.      Estos  dos  enfoques  serán  predictivo  y   preventivo,  es  entonces  necesario    identificar  cual  de  los  dos  deberá  abordar   el  consultor  en  este  proceso,  el  cual    debe quedar claramente especificado al  momento de aceptar el encargo.      PLANTEAMIENTO DEL ENCARGO DE  LA PATOLOGIA PREVENTIVA.      Cuando  se  llama  al  consultor  para  abordar   un  estudio  dentro  de  esta  rama  de  la    patología se pueden identificar dos casos es pecíficos de encargo, los cuales están   directamente relacionados con los dos  enfoques que se pueden establecer desde   el alcance, a saber:      •   Diseño de manual de mant enimiento, el cual debe  comprender los parámetros   y criterios de mantenimiento,  definición de tiempos y períodos de inspección y   finalmente  plantear  la  me todología  básica  de  inspec ción;  dentro  del  enfoque    predictivo.   •   De acuerdo al documento anterior y re spetando los planteamientos realizados,   ejecutar las inspecciones de mantenimiento.     \nMANTENIMIENTO.       Los  edificios,  tanto  en  su   conjunto  como  para  cada  una  de  sus  unidades,  deben    tener un  uso y un mantenimiento adecuados.  Para ello, resulta esencial  que sus   propietarios y usuarios conozcan las caracter ísticas generales del edificio y las de   sus diferentes partes.      Por otra parte, si el edificio se cons erva en buen estado, mejora el comportamiento   de los materiales, aumentando su durabilidad.  Con un mantenimiento periódico se   evitan  los  gastos  inesperados  que  deben   realizarse  para  subsanar  daños    importantes originados  por un pequeño problem a que se ha ido agravando con el   tiempo.       El  OBJETIVO  del  MANTENIMIENTO  es:  conservar   con  la  menor  inversión  a    través  del  tiempo,  aplicando  una  me todología  con  rigor  técnico,  el   valor  del    patrimonio  construido, ajustándose a las Leye s, Reglamentos y Normas Vigentes,   con  el  manejo  en  forma   planificada   de  los  recursos  económicos,  humanos  y    técnicos  disponibles,  para  alcanzar  la   máxima   seguridad,  eficiencia,  confiabilidad    y  satisfacción  de  los  usuarios;  para  hacer  posible  el   uso  sostenible  de  los    edificios,   manteniendo  satisfactoriamente  sus   cualidades  y  cumpliendo  con  sus    funciones a un  óptimo nivel de exigencias.       Las fases de influencia del mantenimiento.       Las  fases  de  influencia  del  mantenimiento  en  el  proceso  constructivo,  en  este    nuevo  enfoque,  están  centradas  en  el   proyecto,  aunque  se  prolongan  en  la    ejecución.  Son las siguientes:   1.  Concepción.     2.  Establecimiento de la vida  útil prevista del edificio.    3.  Prediseño.     4.  Establecimiento de la vida út il prevista para los componentes.    5.  Evaluación de la vida de servicio de los componentes.    6.  Comprobación de que la vida de servic io predicha es mayor que la prevista.    7.  Realizar el proyecto.    8.  Elaborar el progr ama de mantenimiento.       Los objetivos específicos del Mantenimiento.      •   Evitar, reducir, y en su caso, reparar , las fallas sobre los bienes precitados.   •   Disminuir la gravedad de las  fallas que no se lleguen a evitar.   •   Evitar detenciones inútiles o para de máquinas o equipos.   •   Evitar accidentes.    •   Evitar incidentes y aumentar  la seguridad para las personas.  \n•   Conservar  los  inmuebles  en  condici ones  seguras  y  preestablecidas  de    operación.   •   Balancear  el  costo  de  mantenimiento   con  el  correspondiente  al  lucro    cesante.   •   Alcanzar o prolongar la vida útil de las edificaciones.      TIPOS DE MANTENIMIENTO:      Mantenimiento Preventivo.      Este tipo de mantenimiento surge de la nece sidad de rebajar el  correctivo y todo lo   que  representa.  Pretende  r educir  la  reparación  mediante  una  rutina  de    inspecciones periódicas y la renovación  de los elementos dañados, si la segunda y   tercera no se realizan, la tercera es inevitable.      Características:      Básicamente  consiste  en  programar  revi siones  de  los  elementos  y  materiales,    apoyándose  en  el  conocimiento  de  los  mism os  en  base  a  la  experiencia  y  los    históricos  obtenidos  de  estos.  Se  el abora  un  plan  de  mantenimiento  para  cada    elemento y sistema, donde se realizaran las acciones necesarias.      Mantenimiento Predictivo.      Este  tipo  de  mantenimiento   se  basa  en  predecir  la  falla   antes  de  que  esta  se    produzca.  Se  trata  de  conseguir  adelantarse   a  la  falla  o  al   momento  en  que  el    edificio  o  elemento  deja  de  trabajar  en  su s  condiciones  óptimas.  Para  conseguir    esto se utilizan herramientas y técnicas de monitores de parámetros físicos.      MANUAL DE MANTENIMIENTO.      Para  facilitar  a  los  propietarios  y  usuar ios  la  gestión  de  la  conservación  de  sus    viviendas  y  elementos  comunes,  se  han   desarrollado  los  Manuales  de  Uso  y    Mantenimiento,  que  formando  parte  del  Libr o  del  Edificio,  se  entregan  por  el    promotor  a  los  adquirentes.   El  Manual  recoge  las  indicaci ones  relativas  al  uso  y    mantenimiento de la vivi enda, las revisiones periódica s a las que debe someterse,   y  los  criterios  de  renovación  o  reposición   de  sus  diferentes  elementos,  equipos  o    sistemas.      El manual de mantenimiento es  una guía útil para el propiet ario o inquilino de una   vivienda  o  apartamento,  que  sólo  pret ende  dar  unas  directrices  generales    enfocadas  a  conseguir  una  mayor  durabili dad  de  la  construcción.  Todas  estas    recomendaciones  serán  detalladas  de  forma   clara  y  concisa,  de  manera  que  la    mayor  parte  de  estas  operaciones  enf ocadas  al  mantenimiento  puedan  ser   \nrealizadas,  prácticamente  en  su  totalidad,   por  los  propios  usuarios  del  inmueble,    dejando las operaciones de revisión a ca rgo de profesionales cualificados.      De cada ítem de la edificación se deben establecer los siguientes aspectos:      •   Descripción    •   Precauciones    •   Limpieza    •   Revisiones    •   Acopios       Inspecciones de mantenimiento.      Siguiendo  el  manual  de  m antenimiento y las recomendac iones  metodológicas  allí    establecidas, se considera que las inspec ciones cíclicas, podrán ser realizadas por   el  personal  de  oficios  varios  o  del  ár ea  de  mantenimiento  en   industrias,  pero  de    acuerdo  a  las  observaciones  realizadas  en  ellas  o  al  número  de  secuencias    máximas  admisibles,  será  necesario  pl antear  unas  inspecciones  más  profundas,    que  si  bien  pueden  seguir  la  misma  metodol ogía  establecida  en  el  manual  de    mantenimiento,  deben  ser  ej ecutadas  por  personal  experto  con  una  visión  más    crítica  y contrastada con la vida útil predich a definida en el libro  del edificio y en el   manual de mantenimiento.      Es así que esta actividad puede ser cont ratada de manera permanente o itinerante   y puede coger la totalidad de la edificaci ón o una de sus partes, entendiendo que   este  último  puede  dejar  de  analizar  element os  fundamentales,  por  lo  cual  sería    necesario  dejar  claramente   establecido  los  alcances  y  las  responsabilidades  que    entraña este proceso.      El  profesional  contrato  par a  ejecutar  estas  inspecciones  profundas  y  rigurosas,    debe  ser  experto  no  solo  en  materiales,  sino  también  en  proceso  patológicos  y    debe  tener  la  responsabilidad  de  es tablecer  las  recomendaciones  de    mantenimiento,  así  como  los  procesos   a  desarrollar  y  los  plazos  máximos  que    puede tardarse en iniciar el mantenimiento como tal.      Estas  inspecciones  que  deben  estar   planificadas  desde   el  programa  de    mantenimiento, deben ser abordadas desde el  punto de vista preventivo, pero en   el proceso mismo de inspección se pue den abordar desde el  enfoque correctivo y   esta situación estará determinada por los  hallazgos en cada uno de los recorridos    realizados a los componentes objeto de inspección.              \nCONTROL, VERIFICACIÓN Y LISTAS DE CHEQUEO.      Cuando se contrata con el consultor el  diseño de un program a de mantenimiento,   los  controles  mínimos  a  su  proceso  y   que  deben  ser  verificados  antes  de  la    entrega al cliente son:      •   Programación de tareas.   •   Establecer parámetros de control.   •   Definir especificaciones técnic as de materiales y/o procesos.   •   Definir condiciones contractuales.      La persona responsable de ejecutar este  programa de manteni miento, tendrá a su   cargo la realización y control de las siguientes actividades       •   Coordinación de responsables  de ejecutar actividades.   •   Control de las tareas de mantenimiento.   •   Realización de registro e  informes ojalá sistematizados.   •   Retroalimentación del plan de mantenimiento.      Cuando  se  desarrolla  el  pr oceso  de  inspecciones  permanen tes  o  itinerantes  a  la    edificación,  deberá  ceñirse  rigurosamen te  al  programa  de  mantenimiento    previamente  establecido  y  en  caso  de  no   existir  éste,  se  deberá  diseñar  uno    específico para el componente a evaluar.      ENTREGABLE DE LA  PATOLOGÍA PREVENTIVA.      •   Manual  de  mantenimiento:  éste  será   el  entregable  como  tal,  pero  debe    contener  como  mínimo  entre  otros,   las  recomendaciones   de  mantenimiento,    los producto recomendados para tal fin,  los productos que no se deben utilizar   en  los  procesos  de  mant enimiento,  las  discrimi nación  detallada  de  los    procesos de mantenimiento, y la  periodicidad de los mismos.   •   Inspecciones  de  mantenimiento:  en  este   caso  el  consultor  o  profesional    experto debe hacer entrega de un informe e scrito en el que debe consignar el   resultado de las inspecciones, informando  los elementos en buen  estado, y la   fecha  para  su  próxima  inspección  ruti naria,  los  elementos  o  materiales    deteriorados  y  el  período  de   tiempo  admisible  para  acom eter  su  intervención,    los  procedimientos  para  ello  y  los  mate riales  aceptables  y  requeridos  para    reparar, así mismo deberá consignar  unas recomendaciones mínimas desde el   punto de vista preventivo y que puedan ser  desarrolladas de manera rutinaria   por  los  cuidadores  o  usuario s  del  inmueble  sin  que  esto   signifique  como  tal    iniciar un nuevo proceso de mantenimiento.           \nPATOLOGÍA CURATIVA.       Hace referencia al estudio y diagnóstico de los fenómenos patológicos que puede   presentar una edificación durante su vida útil.      Se relaciona directamente con la vida útil se servicio de la edificación.      VIDA ÚTIL DE SERVICIO.      La vida útil de servicio está definida como  el período de tiempo que se inicia desde   la  ejecución  de  la  obra,  hasta  que  se  completa  un  cierto  y  determinado  nivel    aceptable de deterioro.  Es decir, que la vida  útil de servicio es la suma del período   de iniciación y del período de propagación  del mecanismo de dañ o o del agente de   deterioro que agreden a la edificación.      Por lo anterior, el tiempo de vida útil de servicio de cada obra es muy variable,   dependiendo de cada caso particular, debido  a que cada proyecto tiene un cierto y   determinado nivel de aceptación.      ALCANCE DE LA PA TOLOGIA CURATIVA.      El  alcance  de  la  patología  curativa,  deber á  ser  la  realización  de  un  estudio  que    tenga  el  compromiso  de  identificar   lesiones,  sus  causas  y  hacer  las    recomendaciones  de  intervención  o  actuac ión,  para  proceder  a  realizar  las    correcciones primarias y secundarias y a par tir de estos procedimientos establecer   las recomendaciones de prevención.      PLANTEAMIENTO DEL ENCARGO  DE LA PATOLOGIA CURATIVA.      En  general  un  estudio  patológico  curativo  debe  abarcar  todas  las  etapas    siguientes:   •   Estudio de las acciones.   •   Revisión del proyecto.   •   Investigación de la calidad de los materiales empleados.   •   Investigación de la calidad de ejecución.      Es muy importante entonces, definir perfect amente cuál es el alcance del encargo   y cuál es la misión concreta del estudio,  pues la responsabili dad puede quedar mal   definida.      El especialista que realiza el estudio de be estar atento al hecho de que el tipo de   informe  que  redacta  le  obliga  a  ser  muy   cuidadoso  en  relación  a  las  posibles    personas  implicadas  en  el  origen  de  lo s  daños  registrados;  pero  también  debe    estar  atento  a  las  presiones  que  pueda  re cibir  en  el  sentido  de  “orientar”  el   \nexpediente  en  una  dirección  de terminada  o  de  reducir  la   intensidad  del  estudio    sobre  algunos  aspectos  en  concreto.    Po r  lo  tanto  es  muy  importante  mantener    permanentemente LA IMPARCIALIDAD.      OBTENCIÓN DE LA INFORMACIÓN.      A continuación se estudiarán  los criterios para obtenerla.      Planteémonos las siguientes preguntas:      1.- Cómo deducir la peligrosidad de la lesión?   2.- Cómo deducir la veloci dad del fenómeno  patológico?   3.-  Cómo  obtener  información  sobre  los   sistemas  constructivos  empleados  y    sobre los cálculos estructurales realizados?   4.- Cómo obtener información sobre el suelo de cimentación?      EVALUACIÓN DE LA PELIGROSIDAD DEL FENÓMENO.       En  primer  lugar  se  debe  establecer   claramente,  ante  que  tipo  de  evento  o    fenómeno se encuentra el patólogo antes  de proceder con cualquier evaluación.      En cuanto al procedimiento  de actuación y a las observac iones a realizar, se tiene   el siguiente ejemplo, que puede ser válido pa ra fenómenos de ocurrencia súbita o   de ocurrencia progresiva:      1.  Inspección preliminar desde afuera.   2.  Identificación del tipo  de estructura a evaluar.   3.  Evaluación de elementos estructurales.   4.  Evaluación de elementos No estructurales.   5.  Identificación de otras amenazas.   6.  Conclusiones preliminares de la evaluación.      FENÓMENOS DE O CURRENCIA SÚBITA.       Dadas las características de peligrosidad q ue encierran los eventos de ocurrencia   súbita,  así  como  las  implicaciones  en  cuanto  a  vidas  se  refiere,  se  analizará  la    evaluación  de  la  peligrosidad  en  casos  co mo  terremotos,  explosiones,  incendios,    etc.   De  acuerdo  a  lo  anterior,  los  aspectos  mínimos  a  inspeccionar  que  son    fundamentales y que por ningún mo tivo se deben obviar son:      1.  Suelo.    2.  Estructura.    3.  Cerramientos.    4.  Instalaciones.   \n5.  Carpinterías.       INSPECCIÓN AL SUELO.       Dependiendo  del  fenómeno  que  se  halla   presentado  en  la  edificación,    será    necesario  hacer  una  rápida  evaluaci ón  de  las  condiciones   del  suelo,  para    identificar  los  posibles   factores  de  riesgo  que  se   pueden  generar  y  que  podrían    llegar a agravar las condiciones de estabilid ad del conjunto edilicio; en este orden   de ideas se entenderá que cuando se pres entan sismos, deslizamientos cercanos,   inundaciones,  rupturas  de  redes  s ubterráneas,  explosiones  de  redes  de  gas    subterráneas  y  avalanchas,  entre  otras,   evaluar  las  condiciones  del  terreno  será    imperativo.      En este caso, se debe prestar especial  atención a la presencia de agrietamientos   cercanos  a  la  base  de  la  edificación  y  a  su  direccionamiento,  ya  que  pueden  ser    indicio  de  posibles  movimientos,  tambi én  son  importantes  los  asentamientos    generales,  aislados  o  puntuales,  los  cual es  pueden  aportar  información  valiosa    frente a movimientos del suelo.      Otro  factor  importante  a  ev aluar  en  esta  inspección  será  la  presencia  de    hundimientos  concentrados  en  zonas  cerc anas  a  la  construcción  objeto  de    evaluación, porque indican la  posible presencia de aguas  subterráneas que estén   lavando  finos  al  interior  del  terreno  y   que  puedan  generar  colapsos  o  descensos    súbitos  de  la  edificación,   que  podrían  agravar  el  es tado  patológico  o  impedir    continuar con los procesos de inspección.      INSPECCIONES A LA ESTRUCTURA.      A.-   Columnas,  pilares  o  muros:   estos  elementos  pueden  haber  sido    sobrecargados en el movimiento generaliza do del edificio, como consecuencia del   evento desencadenante de las fallas.       Debe  ser  motivo  de  desalojo  in mediato  la  existencia  de  gr ietas  verticales  o  a  45°    sobre  columnas  de  hormigón  localizadas  ésta s  a  mitad  del  fuste.    Es  síntoma  de    su próximo colapso a compresión.       La  misma  situación  se  presenta  cuand o  se  aprecian  grietas  horizontales  y    abombamientos  en  muros  portantes  (muy  ca racterístico  en  muros  de  ladrillo    hueco).       Frente a desplazamientos de importancia, lo calizados a media altura en columnas   metálicas, debe adoptarse la misma medi da, ya que puede ser el síntoma de que   la columna ha alcanzado la carga crítica de pandeo.     \nEn el caso de estructuras de madera (tr adicional o laminada), se debe verificar el   estado  de  los  elementos  portantes  como   columnas  o  riostras,  evaluando  la    presencia  de  fisuras  que  atraviesen  el  el emento,  desgarres,  así  como  fallas  por    compresión,  si  bien  cualquiera  de  ella s  evidencia  graves  daños,  se  debe    recomendar  desalojo  si  las  fallas  se  pres entan  en  el  tercio  medio  de  la  altura  o    longitud de desarrollo.      Tanto  en  las  estructuras  de  madera  como  las  metálicas,  se  deben  inspeccionar    también  los  nudos,  amarres  y/o  anclaje s,  los  cuales  no  deben  presentar    deformaciones  que  generen  desplazamiento   del  eje  neutro  de  los  elementos    verticales,  pues  desplomes  important es  pueden  reducir  cons iderablemente  la    capacidad  de  carga  y  transmisión  de  la  mi sma.    En  los  elementos  cuya  unión    estructural sea a través de pernos, se debe n evaluar estos, verificando que no se   presenten  roturas  o  deformaciones  de  los   tornillos,  como  tampoco  deben  estar    flojos.      Un  caso  similar  se  presenta  en  las  colu mnas  de  madera  y  algunas  de  metal,  las    cuales llegan a los nudos (cim entaciones o placas) a través de una “caja” metálica;    estas deben estar bien ancladas, además, se debe verificar que no existan fisuras   en dichos elementos, porque de ser así, no  se puede garantizar  la estabilidad de   la “pata“ del elemento vertical estructural.
