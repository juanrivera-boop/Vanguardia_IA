    B.-  Elementos  horizontales  (v igas,  dinteles,  etc.):   deben  ser  observados  con    desconfianza  y  prescribir  su  inmediat o  apuntalamiento,  aque llos  elementos  de    hormigón  armado,  solicitados  a  flexión,   que  presentan  una  marcada  figuración  a    cortante  (cizalladura)  o  grietas  de  im portancia  en  las  zonas  normalmente    traccionadas (vigas y dinteles).       De la misma forma que en el caso anterio r, se debe proceder en dinteles y vigas   metálicas en los que se aprecian alabeos,  ya sea una pérdida del plano vertical del   alma,  un  desplazamiento  horizontal  de  la   aleta  superior  en  el  centro  del  vano  o    ambos a la vez.       En  el  caso  de  entramados  de  madera,  el   procedimiento  de  actuación  es  similar,    cuando  se  encuentran  elementos  que  pres entan  desgarres  o  rajaduras  en  los    puntos cercanos a los nudos o anclajes, así  como aquellas fisuras longitudinales,   las  cuales  evidencian  pérdida  de  la  resi stencia  de  las  vigas.    Igualmente,  las    deformaciones  en  cualquiera  de  los  planos   del  elemento  se  deben  inspeccionar    con detenimiento.      Se  debe  prestar  especial  atención  al  tras lapo  de  las  vigas  con  el  muro.    Es    frecuente  que  el  apoyo  de  las  vigas  sea   deficiente  desde  la  construcción  y  no    admita  movimiento  alguno  sin  peligro  de  que   se  produzca  su  descabalgamiento.      Si el sistema presenta cierta dinámica y  el apoyo de las vigas es inferior a 5 cm.,   se deberá proceder a su apuntalamiento.  \nPor otra parte, uno de los efectos habituales  de un asentamiento diferencial es el   de solicitar a tracción a los techos  y promover recorridos relativos.        C.- Rampas y Escaleras:  aunque el comportamiento es tructural de las rampas y   las  escaleras  es  similar  a  las  placas  y  vigas,  es  necesario  verificar  que  estas  no    presenten grietas o fisuras transversales a  su eje normal en el tercio medio de la   luz, así como tampoco fisuras o grieta s en los puntos de llegada o arranque de las   placas,  porque  podría  indicar  un  rápido   colapso  de  estos  elementos,  que  no    necesariamente lleve al co lapso de la edificación.      En  cualquiera  de  los  casos  anteriorm ente  descritos,  se  deben  observar  con    desconfianza en estructuras de hormigón ar mado, grietas con aberturas mayores   a  5  mm,  núcleos  internos  de  concreto  agr ietado  (siempre  y  cuando  sea  fácil  su    inspección)  y  barras  de  refuerzo  vertic ales  que  se  encuentren  pandeadas  o  con    ausencia de flejes.      INSPECCIONES A LOS CERRAMIENTOS.      En  el  caso  de  los  cerramientos  es  neces ario  estar  atentos  a  cualquier  desplome    de  los  elementos  que  los  componen,  inde pendientemente  del  material  y  sistema    constructivo  en  que  estén  ejecutados,   puesto  que  ante  cualquier  movimiento    adicional se pueden colapsar.      También  reviste  importancia  cualqu ier  pérdida  o  destrucción  de  muros  o    divisiones,  especialmente  si  esto  se  pres enta  en  la  parte  baja  de  ellos,  porque  la    parte  superior  queda  sometida  a  esfuerzos  par a  los  cuales  no  estaba  diseñado  y    al  no  tener  soporte  se  puede  llegar  fácilm ente  al  estado  de  fatiga  y  su  posterior    derrumbamiento.      Dentro  de  los  cerramientos,  también  se  en cuentran  los  cielos;    se  debe  verificar    que  estén  bien  sujetados  y  los  que   se  observen  inestables  deben  ser    desmontados  para  evitar   su  desprendimiento  y  adici onalmente  facilitar  la    inspección de los elementos estructurales.      INSPECCIONES A LAS INSTALACIONES.       En  caso  de  un  fenómeno  de  ocurrencia  súbi ta  cualquiera  que   sea  su  tipo,  como    medida preventiva en primera  instancia se deben cerrar todas las llaves de paso,   especialmente  en  las  instalaciones   de  gas,  puesto  que  cualquier  fuga  es    detonante para una explosión y un incendio.      Se  debe  prestar  atención  a  fugas  que  se   presenten  en  los  abastos  puesto  que    corrientes de agua que no sean controladas  pueden facilitar el lavado de finos en   el terreno e incrementar cualquier  socavamiento de las cimentaciones     \nEn  cuanto  a  las  instalaciones  eléctricas   se  debe  cortar  el  suministro  de  energía    para evitar que se presenten cortos  circuitos que generen mayores problemas.      Es  necesario  tener  en  cuenta  que  tanto  en   el  caso  de  la  evaluación  patológica,    como  de  los  procedimientos  de  salvamento  y  rescate,  se  hace  necesario  contar    con  servicios  de  agua  potable  y  energía  para   facilitar  dichas  actividades,  pero  en    lo  posible  y  hasta  no  realizar  una  pr e-evaluación  de  cada  caso,  lo  más    recomendable  es  obtener  estos  servicios   a  través  de  plantas  generadoras  de    energía,  provistas  de  los  mecanismos  de   seguridad  y  de  sellos  de  protección    contra  explosiones  y  el  suministro   de  agua  hacerlo  a  través  de  hidrantes  o    máquinas de bomberos.      INSPECCIONES A LAS CARPINTERÍAS.       Se  entiende  por  carpinterías  todas  aquel las  conformadas  por   puertas,  ventanas,    pasamanos y muebles fijos, los cuales  se deben inspeccionar en el recorrido que   se realice, prestando espec ial atención a aquellos que  se encuentren bloqueados   o atascados, principalmente  puertas y ventanas, las cuales en tales circunstancias   no  se  deben  intentar  abrir  o   forzar  para  acceder  a  través  de  ellas,  debido  a  que    dependiendo de las características de la ed ificación afectada, estas pueden estar   asumiendo  cargas  que  impi dan  su  normal  funcionamiento   y  el  tratar  de  moverlos    puede  facilitar  el  descabalgamiento  o  cola pso  de  los  elementos  horizontales  que    se encuentren por encimas de ellos; solo en  caso de poder visualizar por medio de   vidrios  o  vanos  cercanos  a  las  puertas   o  ventanas  atascadas  y  de  evaluar  el    estado general del conjunto que  conforma la carpintería, las jambas y el cabezal,   así  como  los  muros  alrededor,  se  podr á  determinar  si  se  derrumban  estos    elementos,  sin  peligro  de  afectar  en  mayor  medida  a  la  edificación  objeto  de    evaluación.      Los  pasamanos,  que  también  hacen  parte  de  las  carpinterías,  deben  ser    evaluados  con  cuidado,  porque  pueden  presentar   fallos  ocultos  como  separación    de  la  base  de  sustentación  o  esfuerzos  c oncentrados  llevándolos   al  límite  de  su    capacidad  mínima  resistente,  que  ante  c ualquier  movimiento  o  presión  mínima    pueden reventar, explotar (caso de pasama nos en vidrio) o caer, generando mas   victimas o afectando al equipo evaluador.      En cualquier caso se debe estar atento a  la presencia de humo, así como al paso   de  éste  o  de  rayos  de  luz  a  través  de  los  elementos  no  estructurales  y    fundamentalmente prestar atención a cualqu ier sonido que se presente durante la   inspección.      FENOMENOS DE EVOLUCIÓN LENTA Y PROGRESIVA.       Al  igual  que  en  las  lesiones  presentadas   por  fenómenos  de  ocurrencia  súbita,  en    el caso de las presentadas por los de evol ución progresiva, también es necesario  \ndeterminar  las  características  del  fenómen o  patológico  y  de  la  edificación  en  que    se presentan.      En  primer  lugar  se  debe  r ealizar  una  inspección  prelim inar  de  carácter  general,    que tiene como fin:      1.  Identificar las zonas afectadas.   2.  Identificar tipo o tipos de lesiones.   3.  Hacer un acopio de información.   4.  Determinar un proceso de diagnóstico.   5.  Hacer recomendaciones preliminares.      CONSIDERACIONES GENERALES PARA  UN PROCESO DE DIAGNÓSTICO.      De  acuerdo  a  lo  planteado  anteriormente,  se  entiende  la  complejidad,  el    compromiso  y  riesgo  de  abordar  un  proces o  de  estudio  patológico  en  cualquiera    de las ramas de la misma, pero en este ca so específicamente se puede considerar   más  complejo,  ya  que  el  objeto  de  estu dio  requiere  de  unas  intervenciones  para    garantizar su estabilidad y permitir que la edi ficación vuelva a su estado original de   prestaciones y funcionamiento; razón por la  cual se considera  la más compleja de   todas las ramas de la patol ogía de la edificación y es  en la que se deben tener en   cuenta mas aspectos y consideraciones, entr e las que se encuent ran, los sistemas   de  recorrido,  procedimientos  para  el  reco rrido,  procedimientos  de  diagnósticos,    registro  y  documentación  de  la  informa ción,  pruebas  y  ensayos  de  campo  y    laboratorio, protocolos para la toma de  muestras, diagnósticos especializados por   medio  de  equipos  más  sofisticados  y  finalm ente  la  redacción  del  informe,  en  el    cual  se  consigna  todo  lo  anterior  y   se  determinan  las  recomendaciones  de    reparación o intervención.      Para  las  inspecciones  existen  algunos   sistemas  de  recorrido  ya  establecidos,    siendo utilizados en diferentes discipli nas y que son aplicables a las evaluaciones   patológicas de acuerdo a cada caso específico, a saber:     º  Espiral:  De lo mas externo a los mas interno recorriendo todo el lugar.  º  Franjas:   Se  realiza  un  recorrido  transversalmente  tomando  franjas  y    regresando, hasta cubrir totalmente el lugar.    º  Cuadriculado:   Se  divide  el  lugar   en  cuadriculas  y  se  hacen  los  recorridos    dos veces por cada lugar.    º  Zonas:  Revisando por separado cada una de las zonas en que se divide el   lugar.  º  Radial:   Se  toman  sectores  de  manera  radi al  y  se  inicia  la  búsqueda  en    cada uno de ellos.      Independiente  del  sistema   de  recorrido  a  seguir  bien  por  metodología  del    profesional  encargado  o  por   las  condiciones  mismas  de  la  edificación  a   \ninspeccionar, hay una serie de aspectos que deben ser tenidos en cuenta, con el   fin de hacer más eficiente y completo el proceso.      •   Plan     de     recorrido .    La  actividad  de  reconocim iento  permite  visualizar,    además,    un  plan  de  recorrido   para  la  toma  de  datos  de  la  edificación  a    levantar,  identificar  los  espacios  por   donde  van  a  pasar  los  cortes,  ubicar    elementos de especial interés constructi vo o patológico, evidenciar dificultades   para la medición, etc.   •   Secuencia  del  recorrido.     Cuando  se  establece  la  numeración  de  los    espacios en el plano general del inmuebl e se intenta hacer lo de tal manera que   su  secuencia  corresponda  a  ese   plan  de  recorrido   que  se  visualizó  antes,  el    cual se procurará cumplir en la medida de lo posible.   •   Observaciones .    Nunca  asuma  dimensiones,  así  usted  cuente  con  “ojo    clínico”,  verifíquelas  siempre.    Se  debe   tratar  de  tomar  la  mayor  cantidad  de    información  posible  en  la  observaci ón,  la  cual  debe  quedar  debidamente    consignada en los planos  o en la libreta de campo.   •   Orden  en  la  toma  de  datos.     El  orden  en  la  toma  de  datos  garantiza    ganancia de   tiempo y precisión.      PROCESO GENERAL DE DIAGNÓSTICO.      1.  Levantamiento Patológico.    2.  Medición de lesiones.   3.  Nivelación.    4.  Registro fotográfico.    5.  Registro de fichas.   6.  Pruebas, ensayos y equipos.   7.  Toma de Muestras.   8.  Pruebas de carga,    9.  Inspección de suelos y cimentaciones      1.- Levantamiento patológico.       Cuando  las  lesiones  que  se  encuentran   son  fisuraciones,  agrietamientos,    desprendimientos  o  afectaciones  que  puedan   ser  de  superficie,  pero  que  se    presentan  en  áreas  relativamente  gr andes,  es  conveniente  realizar  un    levantamiento  patológico;  es  decir,  hacer   un  mapeo  de  lesiones;    el  cual  es    importante  en  el  proceso  de  diagnóstico   porque  permite  ubicar  exactamente  las    lesiones,  registrar  las  característica s  de  estas,  haciendo  las  observaciones    necesarias  evitando  que  se  olviden,  además   constituye  un  registro  gráfico  del    estado  de  la  edificación   para  tener  una  visión  global   del  fenómeno,  permitiendo    comprender mejor la afectación, conform ándose como la documentación completa   del  daño  y  herramienta  de  apoyo  dentro   del  proceso  de  diagnóstico,  permitiendo    complementar los análisis necesarios para  lograr determinar el comportamiento de  \nla  lesión  y  las  posibles  causas,  buscando  recomendar  las  actuaciones  de    reparación,  recuperación  y  manteni miento  más  adecuadas  de  acuerdo  a  cada    caso específico.      Cuando  en  la  documentación  recopilada   con  los  usuarios  se  tiene  acceso  a    planos,  primero  se  deben  confrontar  con  la   obra  y  si  son  coincidentes  con  esta,    sobre copias se procede a realizar el  levantamiento gráfic o o mapeo de lesiones;   en caso de no disponer de el los o no ser coincidentes y  considerarse necesario se   deberá  hacer  un  levantamiento  ar quitectónico  y  sobre  este  realizar  el  registro  de    lesiones.      Con excepción de que la observación se r ealice sobre una fachada o un zona de   patios, es muy frecuente vernos limitados  a espacios muy pequeños, en los cuales   sólo podamos ver una parte muy mínima de  la lesión.  Para extraer conclusiones   sobre  el  trazado  de  las  lesiones  y  sus   peculiaridades,  el  procedimiento  más    habitual  es  el  de  graficar  las  grietas  y/o  demás  lesiones  sobre  secciones  del    edificio,  en  las  que  al  ir  conectando,  piso   a  piso,  lo  observado,  obtendremos  el    total desarrollo del fenómeno.      Cuando las lesiones que se en cuentran, se localizan sobr e los planos horizontales   de  la  edificación  se  gr afican  sobre  plantas;  cuando  estas  se  ubican  en  planos    verticales  sin  afectar  otros  planos  se   grafican  sobre  cortes  que  se  elaboran  de    acuerdo  a  cada  caso  específico,  pero   cuando  las  lesiones  se  encuentran    simultáneamente sobre muros y cielos o  muros y pisos o sobre dos muros que se   encuentran  entre  sí,  se  deben  elaboran  pers pectivas  que  permitan  graficar  el    desarrollo completo de la lesión.      Materiales y Equipos para un Levantamiento.      º Decámetro o lienza.  º Metro o cinta métrica.  º Planillera, preferible mente tamaño oficio.  º Papel cuadriculado  tamaño oficio.    º Nivel de manguera y de burbuja.  º Madeja de hilo o piola de  unos 200 o más metros.  º Escuadra de cantero,  tamaño mediano o grande.  º Plomada de punto y de castaña.  º Un jalón.  º Manila delgada, 10 a 15 m.   pintada a franjas rojas y blancas alternadas.  º Linterna.  º Equipo de protección personal, (es conveniente el uso de zapatos con suela   de caucho).      Personal.     \nEl grupo óptimo de personal es el conform ado por un coordinador  y dos auxiliares   (entre  los  dos  realizan  la   labor  de  levantamiento  y  medi ción).    El  coordinador  de    grupo ordena el recorrido de este, e indica  las posiciones o puntos desde y hasta   donde se realiza la medición, lee y anota las medidas en el croquis.         Graficación.       El proceso de graficación debe  iniciarse con las plantas del  inmueble y de acuerdo   a  lo  observado  se  procederá   a  elaborar  los  distinto s  cortes  y/o  fachadas  que    permitan dibujar completamente  las lesiones y sus recorridos.      Este  croquis  general  sirve  para  consignar  en  él  cotas.;  para  la  identificación    numérica de los distintos espacios de la cons trucción; para identificar la situación y   orientación  de  las  tomas  fotográficas;  par a  colocar  el  norte   y  para  el  rótulo  de    identificación  y  las  mínimas  anotaciones   importantes  que  sean  necesarias  desde    el punto de vista patológico.      Los  demás  croquis,  dependen  de  la  necesidad  de  cada  caso  particular,  de    acuerdo  al  estado  de  deterioro;  en  ellos  se  dibujan  los  distintos  espacios    agrupándolos  por  secuencia  o   continuidad  de  lesiones  y  se  consignan  todas  las    cotas  de  la  medición,  las   diagonales  de  cada  espacio  y   se  detallan  todas  y  cada    una  de  las  lesiones  identificadas  en  la  in spección,  así  como  los  rasgos  más    importantes  de  ellas.    Cada   espacio  debe  quedar  identificado  en  el  centro  con  el    número que aparece en el  croquis general; adi cionalmente la codificación se debe   conservar en el registro fotográfico y de fichas.      2.- Medición de las lesiones.      Cuando se emprende un proceso de diagnóst ico complejo de acuerdo al encargo   que se le ha planteado al patólogo, la  complejidad del fenómeno patológico que se   esté  analizando  y  teniendo  en  cuenta  el  alc ance  del    mismo,  es  decir,  cuando    como  consecuencia  del  estudio  patológ ico  de  una  lesión  en  una  edificación  se    busca  determinar  todos  y  cada  uno  de   los  procedimientos  de  saneamiento,    reparación  y  recuperación  más  las  reco mendaciones  de  manteni miento o cuando   se  prevé  la  posibilidad  de  iniciar  un  pr oceso  legal,  es  importante  hacer  un    seguimiento del comportamiento y evoluc ión de las lesiones identificadas, para lo   cual  es  necesario  realizar  durante  el  ti empo  que  dure  la  evaluación  en  obra  una    medición  del  avance  de  los  fenómenos,   registrando  las  dimensiones  tomadas  en    las plantas o cortes elaborados durante el  proceso de levantam iento patológico.      El procedimiento de medición de lesiones  es importante y comple menta el registro   fotográfico  y  demás  análisis  de  los   fenómenos  patológicos  que  se  encuentren    localizados  sobre  los  planos  verticales   de  una  edificación;  es  muy  práctico  para   \ndeterminar el recorrido de grietas horiz ontales o inclinadas, así como humedades,   desprendimientos de elementos, etc.      La  medición  inicial  de  las  lesiones  se  ha ce  paralela  al  proc eso  de  levantamiento    patológico, aprovechando las plantas o co rtes y demás esquemas para anotar las   dimensiones  junto  a   cada  esquema  de  lesión;  posteri ormente  se  verifican  las    dimensiones  tomadas  inicialmente  y  se   registran  las  posibles  variaciones    observadas,  para  lo  cual  se  debe  m antener  en  la  obra  toda  la  documentación    obtenida durante el mapeo de lesiones.      Cuando se tienen fisuras y/o grietas, es nec esario determinar su longitud, ancho y   la  profundidad,  así  como  los  puntos  de  arranque  y  terminación  definiendo    referencias precisas en obra con respecto a  pisos, cielos y esquinas, las cuales se   deben fechar al momento de hacer la medi ción y posteriormente en cada visita de   inspección  si  se  presenta  variación,  co locar  un  nuevo  punto  de  referencia  con  la    fecha respectiva.      En  las  lesiones  que  se  presentan  como  af ectaciones  de  superficies,  es  decir,    ensuciamientos,  desprendimientos,  humedades ,  meteorizaciones,  manchas,  etc,    es  importante  determinar  el   área  de  afectación  y  dejar  puntos  de  referencia    fechados para posteriores inspecciones.      Otra  alternativa  para  la  medi ción  de  este  tipo  de  lesio nes,  puede  ser  la  de  trazar    un  recuadro  que  enmarque  la   zona  afectada  y  con  respecto  a  este  hacer  las    evaluaciones posteriores en cada visita.      La toma de las dimensiones de la lesión (s ea vertical u horizontal) y su anotación   en los croquis de las plantas es muy sencilla:   se dibuja en el plano el esquema de   esta y en los puntos de arranque y terminaci ón, las medidas que permitan localizar   gráficamente la ubicación exacta de esta (coordenadas).      Cuando  la  lesión  presenta  un  desarrollo  longi tudinal,  al  frente   se  le  anotará  la    dimensión  respectiva,  cuando  la  lesi ón  se  presenta  como  una  afectación  de    superficie y se ha empleado el método del rec uadro, en los costados se anotará la   longitud  y  en  el  centro  se  colocará   el  área  aproximada;   adicionalmente  las    esquinas  del  recuadro  se  deben  localizar  con  respecto  a  algún  elemento    colocando las coordenadas para su exacta ubicación.      Cuando  se  encuentran  lesiones   ubicadas  en  zonas  de  difícil  acceso  o  cuando  se    quiere dejar constancia en el registro fo tográfico de las dim ensiones aproximadas   de las lesiones, se usa el jalón o la mani la pintada con franjas, colocando al lado la   lesión que interese medir haciendo la le ctura de acuerdo a la  franjas del elemento   utilizado.     \nLa medición de las áreas afectadas por un a lesión, puede ser útil adicionalmente,   para  determinar  el  porcentaje  de  af ectación  de  una  edificación,  pero    principalmente para determinar la cantid ad de obra a intervenir y por consiguiente   los costos y los tiempos de reparación.      Como  medida  de  precaución  revise  la  ve rticalidad  (plomada)  y  la  rectitud  de  las    superficies  de  muros.    En  algunas  cons trucciones  se  present an  casos  de  muros    cuyo  espesor  decrece  casi  imperceptiblemente  con  la  altura,  o  presentan    abombamientos,  e  incluso  quiebres,  que   requieren  ser  observados  en  forma    rasante, ya que de frente es casi imposible detectarlos.      3.- Nivelación.       Esta  labor  es  fundamental,  cuando  se   presentan  deflexi ones  de  losas,    hundimientos o elevamientos del suelo,  cuando hay problemas de asentamientos   totales y/o diferenciales que modifican las  características de la edificación, porque   permite  conocer  con  precisión  las  va riaciones  generadas  por  el  fenómeno    patológico que afecta a la construcción.      Consiste en pasar un nivel por las zonas  a evaluar a partir de un punto cero que   se  marca  a  un  (1)  metro  de  altura.    Basta  con  colocar  suavemente  con  lápiz  rojo    triángulos con un vértice hacia abajo en lo s puntos o sitios necesarios para tomar   posteriormente las alturas hacia arriba y hacia abajo del nivel.      Cuando no se dispone de teodolito se puede utilizar el nivel de manguera.      Normalmente  los  pisos  no  presentan  mayore s  desniveles  en  la  superficie  de  un    mismo  espacio;  sin  embargo,  es  pertinent e  verificar  los  posibles  hundimientos  o    abombamientos del mismo,  registrando en el croquis el  sitio donde se presente la   variación del nivel en un circulo con sign os positivo si es  abombamiento o negativo   si es hundimiento; adicionalment e es conveniente incluir fl echas que identifiquen la   dirección del cambio de nivel.  Si está  totalmente nivelado basta  colocar un círculo   en el centro del espacio con su cota respectiva.      Cuando se presentan asentami entos puntuales en pisos,  es conveniente medir la   diferencia de niveles, colo cando una piola tensa entre dos  puntos que se tomen de   referencia y se chequea en el centro con  la ayuda de un metro;  es conveniente y   siempre que se tenga acceso hacer la mism a comprobación en la parte inferior de   la placa que se evaluó.      En  los  casos  en  que  se  identifica  un a  pendiente  anormal  en  las  superficies    horizontales, se debe verificar con la ayuda de una regla y un nivel de burbuja, si   se  dispone  de  un  nivel  con  transport ador  se  puede  dete rminar  rápidamente    cuantos grados de pendiente o de di ferencia presenta la lesión.     \nNota:   Es importante volver con el nivel ado al punto de partida, o a otro intermedio,   para  verificar  posibles  errores  cometidos,   tanto  en  el  interior  como  en  las    fachadas.      En  el  caso  de  edificaciones  que  present an  asentamientos  generales,  estos  se    deben verificar mediante nivelaciones periódi cas de los elementos verticales de la   planta baja       Estas  mediciones  deben  ser  realizadas   por  un  Topógrafo  experto,  quien  con    equipos tradicionales puede alcanz ar precisiones de 0,5 mm.      Las  precauciones  que  se  deben  adoptar  par a  aplicar  este  sistema  con  cierta    rigurosidad y por lo tanto con  unos resultados confiables son:      a)  Emplear aparatos autonivelables.   b)  Tomar como origen del recorrido una  referencia alejada que no pueda verse   involucrada en el asentamiento.   c)  Disponer  referencias  i namovibles  en  las  columnas   o  elementos  verticales,    visibles  desde  un  mínimo  número  de  es taciones,  preferiblemente  una  sola.  El    sistema  que  mejor  soporta  el  paso  del  ti empo,  es  el  de  placas  de  aluminio    marcadas con una incisión horizontal y fijas a las columnas.      Este procedimiento, en caso de ser empl eado durante la constr ucción de la obra,   permite controlar el crecimiento de lo s asentamientos a medida que aumentan las   cargas,  comprobando  si  se  ajusta  a  los   cálculos  teóricos  y  permite  adoptar    soluciones,  si  se  observa  que  los  asentami entos  reales  son  superiores  a  los  del    proyecto, mucho antes de que se produzc an lesiones en los cerramientos o en la   estructura.      Para  controlar  las  deformaciones  de  una  gr ieta  particular  de  un  edificio  que  ya    presenta  una  clara  patología  por  asentam iento  diferencial,  se  puede  realizar    nivelaciones  periódicas  sobre  los  pilare s  de  la  planta  baja  y  dibujar  con  sus    resultados un diagrama de asent amiento-tiempo por pilar.      Para completar la información, es conv eniente obtener datos  sobre las épocas de   máximas  lluvias,  máximos  calores,   máximos  fríos.  Es  normal  observar    incrementos de los asentamient os en épocas de gran lluvia.      Sobre  los  gráficos  deducidos  de  estas   actuaciones,  se  pueden  realizar  una  serie    de precisiones (observaciones),  que aclaren lo representado.      Si en la ordenada (eje Y) se  disponen las deformaciones y  en la abscisa (eje X) los   tiempos, pueden darse las siguientes situaciones:     \nLos incrementos de deformación son menores a medida que aumenta el tiempo de   observación, curva 1:       Es típico de cimentaciones realizadas sobr e un suelo excesivamente compresible,   el cual se va consolidando por efecto de la carga aplicada.      Los incrementos de deformación se mant ienen o aumentan con el tiempo, curvas   2 y 3 respectivamente.       Es  un  caso  anómalo  en  el  que  sobre   el  fenómeno  de  conso lidación  se  le    superponen otras circunstancias tales como : incremento de la carga que se aplica   sobre  las  cimentaciones  (esto  puede  ocurri r  por  crecimiento  del  edificio  o  por    basculamientos  que  concentran  las  carg as  en  las  columnas  perimetrales);    deterioro  progresivo  del  suelo  (se  produce  por  aporte  de  agua  y  aumento    progresivo  de  humedad);  apar ición  de  simas;  lavado  de  suelos  finos;    descompresión lateral del suelo por ex cavaciones próximas no acodaladas.   En estos casos pueden presentarse las curv as 2 ó 3, existiendo  siempre un riesgo   potencial mucho mayor que en el caso de la curva 1.      Los  anteriores  sistemas  de  medida  se   pueden  complementar   con  el  empleo  de    plomadas  (esporádicas  o  fijas),  o  con  cual quier  sistema  que  se  nos  ocurra,  pero,    en general, son de una fiabilidad mucho menor.      Al  mismo  tiempo  que  se  instalan  los   sistemas  de  medida,   se  debe  realizar  una    inspección lo más amplia posible. El obje to es determinar la seguridad que aún le   queda al edificio y poder realizar una prev isión del orden de ma gnitud de los daños   que se van a producir antes de la estabilización del fenómeno (de forma natural o   por medio de recalces, etc.).      De esta inspección y de los primeros datos  extraídos de los sistemas de lecturas   de  las  deformaciones,  se  decide  sobre  la  o portunidad  de  un  des alojo  del  edificio    ya sea inmediato o a un plazo más o menos próximo.      4.- Registro fotográfico.       La fotografía es uno de los mejores métodos de transmisión de la información.      La  información  que  se  acumula  en  la  fotogra fía  de  un  edificio,  de   un  material,  de    un elemento constructivo o de una grieta , es un hecho mucho más objetivo y más   próximo a la realidad, que cu alquier croquis o plano que  realicemos, ya que estos   serán  una  interpretación  subjetiva  y  muy  condicionada  por  las  circunstancias  del    momento.      Teniendo  esto  en  cuenta,  la  fotografía   es  un  soporte  insu stituible  de  las    inspecciones visuales.  \nUno  de  los  problemas  que   se  plantea  a  cualquier  persona  cuando  observa  un    reportaje fotográfico muy amplio, es el  de la identificación de los lugares.      Si sólo se han fotografiado  las lesiones en primer plan o, puede ser difícil situarlas,   porque el edificio inspeccionado puede  estar plagado de grietas parecidas.      Para  evitar  esto  es  conveniente  realizar   fotografías  pasando  de   lo  general  a  lo    particular, del edificio a los distintos  espacios y de éstos a las lesiones que hay en   los pisos y en los muros de los mismos.      Esto  hace  necesario  retomar  la  numeraci ón  y  codificación  de  los  diferentes    espacios,  la  cual  ya  se  había  coloc ado  desde  el  proceso  de  levantamiento    patológico,  además,  es  neces ario  identificar  los  puntos  de  toma  y  dirección  de    toma.    Así  mismo,  es  conveniente  determi nar  la  distancia  a  la  cual  se  está    realizando  la  fotografía,  lo  mismo  que  la   altura  de  la  cámara,  sobre  todo  si  es    necesario estar repitiendo per iódicamente las fotos.      Se  precisa  para  esta  fase  la  identificac ión  de  cada  fotografía ,  para  lo  cual  es    necesaria  la  anotac ión  en  un  listado   aparte,  o  también  y  dependiendo  de  la    metodología  y  organización  de  cada  empr esa  o  equipo  de  patólogos,  se  pueden    usar  fichas  de  registro  fotográfico,   que  permiten  reunir  toda  la  información    necesaria para referenciar cada toma fotogr áfica y el espacio al que pertenece, así   como la ubicación precisa dentro del espacio  para facilitar continuar con el registro   de la lesión en posteriores visitas y as í tener documentado el proceso de evolución   de esta.      La ficha debe contener como mínimo  la siguiente información:      •   Nombre de la obra.   •   Propietario.    •   Localización.    •   Dirección.    •   Fecha de registro.   •   Número de hojas de registro.      En cuanto a cada fotografía se  debe relacionar lo siguiente:      •   Número de fotografía.   •   Número del espacio a que pertenece.   •   Punto de toma.   •   Dirección.    •   Distancia.    •   Fecha.    •   Observaciones.   \n•   Si  se  dispone  de  brújula  se  regist ran  las  coordenadas  de   ubicación  de  la    cámara.      Cuando se hace el registro fotográfico con  cámara digital, es posible incluir dentro   de  la  misma  ficha  una  reducción  de  la  foto   para  dar  mayor  claridad  al  archivo    fotográfico que complementará toda la docum entación, la cual no necesariamente   se  entregará  dentro  del  ex pediente  patológico,  pero  que  constituye  un  soporte    importante para acciones poste riores y que reposará en el  archivo fotográfico de la   empresa.      Finalmente la ficha de registro fotográf ico debe contener el  nombre de la persona   que realizó las tomas.      Personal      El  equipo  mínimo  son  dos  personas:  el  fo tógrafo  y  el  que  a nota  en  la  hoja  de    registro la secuencia fotográfica, y acom oda y fija la vara en el plano del muro de   fachada que se va a documentar.      5.- Registro de información en fichas.       El  manejo  de  fichas  en  el  momento  de   hacer  las  inspecciones  en  la  obra,    garantizará  un  ordenamiento  de  la  informa ción  recolectada,  se   evita  olvidar  el    registro  de  documentación  de  carácter   importante,  se  evita  hacer  anotaciones    escritas  poco  claras  o  significa tivas  y  que  pueden  ser  muy  subjetivas,    adicionalmente,  el  manejo  de  la  misma   ficha  para  cada  observación  permitirá    desarrollar  una  mecánica  de  evaluación  muy  práctica,  ahorrando  tiempo  de    evaluación y finalmente al momento de revi sar toda la información recolectada se   facilitará la visualización  global del fenómeno en estudio.      Cada  empresa  o  patólogo  desarrollará  una   metodología  para  hacer  este  registro,    teniendo  en  cuenta  las  posibles  vari ables  que  se  pueden  presentar,  pero  en    términos generales se debe elaborar una ficha general de lesiones.      Ficha general de lesiones.       Con esta ficha se busca recopilar y cons ignar la mínima información posible para   determinar cuales son las partes de la  edificación que present an afectaciones, las   principales  características  de  ubicaci ón  de  estas  lesiones   encontradas  y  las    posibles causas; además, permite también  clasificar las lesi ones encontradas por   familias de acuerdo a la tipología de las mismas, relacionándolas con cada unidad   funcional de obra afectada.      El contenido mínimo de esta ficha deberá ser:  \n•   Identificación  general   de  la  obra.    Se   registrará  el  nombre  de  la  obra,  del    propietario, ubicación, uso, etc.   •   Identificación  específica  del  element o  afectado.    Nombre  del  elemento    afectado, documentación ex istente de este, etc.   •   Tipo de lesiones encontradas.  Hace referencia a un listado general de las   posibles lesiones a encontrar.   •   Clasificación  de  la  posible  causa.     Si  es  directa  o  indirecta  y  a  que  grupo    pertenece.   •   Características generales del fenómeno.   Fecha de aparición, periodicidad,   etc.   •   Condiciones  especiales.    Hace  refer encia  a  modificaciones  realizadas  a  la    obra o intervenciones constructivas identificables.   •   Descripción del elemento.  Se relaci onará información como localización de   la lesión, orientación del  elemento, nivel de exposici ón, nivel de contaminación,   función, apoyos, armadura y dimensiones.   •   Espacios para gráficos y/o fotografías.      Esta ficha se llenará luego de  haber realizado la inspe cción preliminar y se deberá   revisar  en  cada  visita  posterior,  para  ve rificar  variaciones  de  las  condiciones    inicialmente identificadas.      Ficha de estado patológico por  Unidad Funcional de Obra.       Esta es una ficha que no todas las empresas  o patólogos manej an, pero que es de   gran  importancia  para  elaborar  estudios   de  patología  de  gr an  envergadura,  que    requieren  de  periodos  de  evalua ción  bastante  largos  y  que  serán  la  herramienta    para elaborar proyectos de r ehabilitación o de restauraci ón y por lo t anto exigen un   nivel de rigurosidad en las in specciones tal, que permite  analizar cada parte de la   edificación lesionada desde todas la s variables que la pueden afectar.      Dicha ficha permite analizar cada una de las partes componentes de la edificación   frente a cada una de las posibles lesiones  que pueden sufrir, además, constituye   un  historial  u  hoja  de  vida  de  la  evoluc ión  patológica  de  m anera  independiente,    permitiendo  identificar  el  problema  a  nivel   micro  y  al  recopilar  todas  las  fichas    tener una visión macro de las afectaciones que atacan a la edificación.      Al  igual  que  la  ficha  gener al  de  lesiones,  la  ficha  de  estado  patológico  por    unidades funcionales de obra,  tiene un contenido mínimo, así:      •   Identificación  general.     Se  registrará  el  ti po  de  obra,  propietario,    localización, dirección, carácter , fecha de construcción, etc.   •   Descripción  del  elemento.    Pretende  re coger  las  características  generales    del subsistema afectado.  \n•   Identificación  de  daños  si ntomáticos.    Se  plantean  la s  diferentes  variables    de  lesiones  que  pueden  afectar  al  subsis tema,  así  como  sus  principales    características.   •   Localización  de  la  lesión.     Codifica  cada  lesión   por  elementos  referidos  a    planos existentes.   •   Descripción de la lesión.  Indica las  características generales de cada lesión   en cuanto a forma y dimensiones.      Todas las fichas deberán tener espacios  reservados para hacer las observaciones   que  se  consideren  necesarias  y  además  es pacios  para  insertar  fotografías  de    apoyo o esquemas que se elaboren al  momento de llenar la ficha.       Unidad  Funcional  de  Obra:   son  paquetes  de  component es  que  en  su  conjunto    desempeñan  un  papel  específi co  en  la  obra,  están  a  cargo  de  una  función    determinada,  su  trabajo  sólo  podrá  ser  su stituido  por  el  de  otro  subsistema  con    similares  características  o  funciones ,  aunque  algunos  atributos  de  los  nuevos    componentes, sean diferentes.      Lesiones por unidades funcionales de obra.       Cada unidad funcional de obr a presenta una serie de lesiones que son propias de   cada una de ellas, así:      U.F.O. SUBESTRUCTURA (CIMENTACIONES).      -   Asiento continuo.    -   Asiento diferencial.    -   Cedimiento extremo corto.   -   Cedimiento extremo largo.   -   Descenso de pilares.    -   Deformaciones de estructura.   -   Desniveles en forjados (losas).   -   Desnivel en muros.   -   Desplome de muros.   -   Grietas en cerramientos exteriores.   -   Grietas en cerramientos interiores.   -   Filtraciones.    -   Escorrentías.    -   Corrosión.    -   Rozamiento negativo.    -   Deslizamiento de la cimentación.   -   Rotura de la cimentación.        \nU.F.O. SUBESTRUCTURA (CONTENCIONES).      -   Giro del muro (vuelco).   -   Deslizamiento del muro.   -   Deformación del alzado.   -   Fisuración del muro.   -   Rotura por flexión. nas  pr uebas  y  ensayos  no  destructivos,  así    como algunos equipos usualmente utilizados.      TESTIGOS DE YESO PARA EVOLUC IÓN DE GRIETAS Y FISURAS.      Es  un  procedimiento  de  control  de  deforma ciones  a  nivel  cua litativo  (grietas    activas  y  grietas  pasivas).    Se  trata  de   una  “galleta”  de  yeso,  colocada  sobre  la    obra viva, nunca sobre algún tipo de revest imiento como son pinturas, estucos o   revoques, debe tener muy visible la fecha en que se ha colocado y de estar roto   la fecha de la inspección en que se detectó el rompimiento.      Cuando  se  detecta  un  testigo  fisurado,  además  de  colocar  la  fecha,  se  debe    colocar inmediatamente otro testigo cerca  al anterior, así se tendrá una idea de la   velocidad de avance del fenómeno.      Si se detecta un testigo dudoso, se debe  golpear suavemente con los nudillos para   identificar si está desprendido.      MEDIDOR DE CARBONATACIÓN.                                                   El fenómeno de carbonatación  es una de las principales c ausas de corrosión de la   armadura del hormigón armado, se present a una disminución del Ph del hormigón   cuando  el  dióxido  de  car bono  atmosférico  penetra  y  r eacciona  con  la  humedad    contenida en los poros del hormigón, produci endo ácido carbónico que convierte el   hidróxido  de  calcio  (c al  apagada)  en  carbonat o  de  calcio,  uno  de  los    constituyentes del cemento, que tiene un Ph menos básico y agua, cuando ocurre   esto  se  pierde  la  protección  al  acero   de  refuerzo  que  brinda  el  hormigón  por  su    condición altamente alcalina.  \nEste  es  un  ensayo  que  se  realiza  direct amente  sobre  la  superficie  de  concreto    afectada, es de fácil ejecución y muy  económico, permitiendo obtener información   inmediata.    Por  las  características  del  mi smo,  es  posible  que  cualquier  técnico  lo    realice.  Realmente se mide es el  avance del frente de carbonatación.      EQUIPOS Y HERRAMIENTAS PARA  EVALUACIÓN DE LESIONES.      Existen  varias  herramientas  y  equipos  es pecializados,  para  realizar  pruebas  y    ensayos, (algunos de carácter destructivo  y otros no destructivos), para determinar   la velocidad del fenó meno, cada uno de ellos será  aplicable de acuer do al tipo de   edificación  que  se  esté  evaluando,  así  como  al  tipo  de  fenómeno  patológico    encontrado  y  a  la  gravedad  del  mism o,  determinada  en  las  inspecciones    preliminares.  A continuación  se presentan algunos de ellos:         Medición de grietas y fisuras:      1.  CALIBRADOR PARA MO NITOREO DE GRIETAS.       Es  un  instrumento  sencillo  y  preciso   para  monitorear  el  movimiento  de  las    fracturas y uniones en estructuras de bl oques de hormigón, ladrillo y concreto.      El  dispositivo  esta  compuesto  por  dos  pl acas  acrílicas.    Una  de  ellas  de  color    blanco  con  una  cuadricula  negra  calib rada  en  milímetros.    La  placa    transparente  adyacente  dispone  de  retículos   centrados  en  torn o  a  las  líneas    cero de la cuadricula.      Después de haberse instalado, la cinta  que mantiene unidas la s dos placas se   corta,  con  el  fin  de  permitir  que  esta s  se  muevan  de  m anera  independiente.     Cualquier  movimiento  vertical  u  horizont al  de  la  fisura  hace  que  el  retículo     cambie de posición dentro de la cuadrícula.      Tiene el inconveniente de no dej ar registro escrito y por  lo tanto requiere hacer   una  medición  diaria  y  ojalá  a  la  misma   hora,  incluyéndolas  en  gráficos  de    avance de fisuras.     \n        2.  MEDICIÓN CON “PIE DE REY”.                            Es un sistema fácil y económico, sólo requ iere la instalación de dos guías, una   a  cada  lado  de  la  grieta  en  sentido  perpen dicular  a  ésta,  sobre  las  cuales  se    pueda  colocar  el  pie  de  rey  para  hacer  las   lecturas,  no  se  requiere  dejar  el    equipo permanentemente instalado.      Tiene  el  inconveniente  de   que  las  guías  pueden  ser  gol peadas  y  por  lo  tanto    las  lecturas  pueden  perder   confiabilidad.    Lo  mismo   ocurre  cuando  las  guías    están flojas.         3.  MEDIDOR DE GRIETAS.                                         \nEs  un  equipo  sencillo  y  económico  que  mi de  los  movimientos  del  orden  de  0,01    mm,  está  equipado  de  una  tarjeta  indestructi ble,  que  se  fija  en  la  superficie,  y  un    trazador  señala  cualquier  movimiento,   de  forma  continua,  estableciendo  el    comportamiento verdadero de fisuras o grietas.      Al  contrario  de  los  casos  tradicionales   del  monitoreo  de  lesiones,  que  informa    solamente  del  movimiento  a  la  hora  de  la   medida,  este  detector  de  movimientos,    registra cualquier movimiento que ocurra  durante la noche o el día, en épocas de   lluvia o de tiempo soleado,  durante días o meses.      En  cualquiera  de  los  casos  y  de  los  in strumentos  utilizados  para  deducir  la    velocidad  del  fenómeno,  es   importante  hacer  las  medici ones  siempre  a  la  misma    hora  y  apoyar  la  operación  con  un  termómetr o,  que  permita  analizar  la  influencia    de  la  variación  de  la  tem peratura  ambiente  en  la  magnitud  de  la  abertura  de  la    grieta.      Medición de otro tipo de lesiones.       4.  ULTRASONIDO.                                        El ensayo de ultrasonido es aceptado extens amente para la inspección y el control   de  calidad  del  concreto  armado.    Puede  m edir  y  correlacionar  la  resistencia  del    concreto con los estándares  o las especificaciones de di seño, teniendo en cuenta   el  análisis  no  destructivo  de  toda  la  estr uctura.    Identifica  calidades  del  concreto,    así  como  la  presencia  de  los  hormigueros,  de  las  juntas  frías,  de  las  fisuras  y  de    otros defectos de la homogeneidad del concreto.        Permite lectura directa del tiempo de la tr ansmisión, así como la lectura directa de   la  velocidad  calculada  de  la  onda  de  la   compresión  y  de  la  velocidad  de  la  onda    del  esfuerzo  de  corte,  lectura  direct a  del  módulo  de  la  elasticidad  calculado  y    lectura directa del c oeficiente de Poisson.           \n5.  MEDIDORES DE POTENCIAL DE CORROSION.                                                Este equipo, así como otros similares, permi te medir o hacer levantamientos en el   tiempo de los posibles estados de la corro sión de la armadura de  refuerzo y de su   evolución,  antes  de  que  ocurra  la  pérdida  de  sección  de  éstas,  con  las    consecuencias de los desprendimientos de  la capa de recubrim iento del refuerzo,   comprometiendo en mayor grado la integridad de la estructura.       Provee  una  lectura  inmediata  en  pantalla   de  cristal  líquido.    Los  megaohmios    promueven las lecturas del  voltaje de la corrosión a través de un potenciómetro de   gran alcance.   Este dispositivo es insensible al calor y a la luz del sol.      6.  MEDIDOR DE HUMEDAD.                                 Es  un  equipo  fabricado  par a  medir  rápidamente  la   cantidad  de  humedad  de    cualquier superficie, r epresenta un avance verdadero  en la medida de la humedad   en  materiales  diversos  como  el  concreto,   los  ladrillos,  la  roca,  el  mortero,  la    madera.  Es ideal para localizar el fo co de la humedad en las paredes, estructuras,   siendo medida la cantidad de humedad en su interior.     \nEs  un  equipo  de  fácil  manejo  por  su   reducido  tamaño,  que  no  requiere  de    conexiones o de otros elem entos para su operación, pe rmite hacer lectura directa   sobre la pantalla de crista l líquido sin necesidad de ha cer conversiones o manejar   tablas o gráficos      De  acuerdo  a  las  características  del  materi al,  se  calibra  el  equipo  en  la  densidad    de  trabajo  adecuada,  se  coloca  el  equipo   directamente  sobre  la  superficie  a    evaluar y se enciende, permitiendo hacer u na lectura en porcentaje del contenido   de humedad.      MADERAS:       Las lesiones que pueden presentar las madera s son tan diversas que se requiere   contar  con  una  cantidad  de   elementos  que  permitan  ident ificar  las  diferentes    afecciones en esta, entre los cuales tenemos:     º  Lupa naturalista de 10 X o microscopio de bolsillo de 25 X.  º  Espejo de mano y odontológico.  º  Linterna.  º  Fonendoscopio.  º  Punzón.  º  Mazo o martillo pequeño.  º  Cepillo de alambre y brochas.  º  Prismáticos.  º  Humidímetro y termómetro.  º  Pinzas de naturalista.  º  Taladro.  º  Barrena de Pressler.      INSTALACIONES HIDROSANITARIAS.       Los  equipos  utilizados  para  la  inspecci ón  y  evaluación  de  instalaciones    hidrosanitarias,  tienen  como  uso  fundam ental  la  localización  de  tuberías  y  de    fugas de agua.      z   Magnetómetro,  localizador  de  objetos   ocultos.    Sólo  se  indican  los    objetos  ferromagnéticos,  evitando  de  este  modo  la  realización  de    excavaciones  erróneas.    Localización  ha sta  1,5  metros  de  profundidad.     Identificación  sencilla  y  precisa  de  los   materiales  ocultos  por  su  tamaño.     Puede  emplearse  también  en  el  agua  o  nieve  gracias  a  que  su  barra    sensora es de construcción estanca al agua.              \n                                          z   Membrana  acústica  para  la  localización  de  sonidos  en  el  subsuelo.     Es el primer e indispensable escalón  para la detección de fugas. Posibilidad   de varios prolongadores según nec esidades del usuario.                   z   Detección  de  fugas  de  agua  medi ante  sistema  electroacústico.     Ligero  y  de  gran  resolución  acústica,  muestra  en  pantalla  tres  mediciones    simultáneamente: ruidos momentáneos, mí nimo nivel de ruido de la medida   actual y mínimo nivel de la inmediatam ente anterior.  Sist ema de seguridad   que corta la señal de los auriculares en  caso de irrupción brusca de sonidos   elevados.    Doble  posibilidad  de  se lección  de  filtros  de  frecuencia:    automático o manual (pasos de 50 en 50  Hz).  Moderno, ligero y eficaz.                               z   Detección de fugas de agua mediant e sistema electroacústico.  Con   intensidad  sonora  del  e scape  mediante  gráfico  de  columnas  en  monitor    LCD.    Amplificación  acústica  c on  regulación  de  f iltro  automática    correspondiente,  cuanta  con  micrófonos  empleados  para  el    aprovechamiento óptimo del sonido.         \n               Destructivos:   -   Toma de muestras in situ.   -   Medición  de  pesos  específicos,  rela tivo  y  absoluto,  índice  de  porosidad  y    contenido de humedad, densidades  aparente y real y porosidad.   -   Resistencia mecánica, a compre sión, a tracción, a flexión.   -   Coeficiente de dilatación térmica.   -   Módulo de elasticidad.       7.  EXTRACTOR DE NÚCLEOS.      Es  un  equipo  para  realizar   ensayos  semi  y  destruc tivos,  permitiendo  extraer    núcleos  de  concreto  para  ser  someti dos  a  ensayos  de  compresión  y  así    determinar la resistencia real del  hormigón endurecido puesto en obra.      Para su utilización es necesario complem entar el equipo con brocas de diamante.      7.- MUESTRAS PARA ENSAYOS.       Algunas de las muestras que se pueden tomar para ensayos son:      -   Núcleos de concreto.   -   Chapas de ladrillo.    -   Fragmentos de morteros de pega y/o revoque.   -   Fragmentos de piedras de enchapes.   -   Eflorescencias.    -   Materia vegetal y/o orgánica.   -   Muestras de agua.   -   Ensuciamientos.    -   Insectos para clasificación.   -   Etc.       Cada  una  de  las  muestras  que  se  tom en  deben  tener  unas  características    específicas de acuerdo al ensayo o prueba  a que serán sometidas, pero en todos   los  casos  se  debe  seguir  un  protocolo  para  la  toma,  embalaje  y  despacho  de    estas.      8.- PROTOCOLO PARA TOMA DE MUETRAS.       En caso de tomar muestras de materiales  o de cualquier otro elemento dentro del   proceso de evaluación, se debe seguir un  protocolo de manejo de estos, a saber:  \nº  DEFINICION:   Todos los materiales u objet os  (sólidos,  líquidos,  gaseosos)    que pueden servir para la dete rminación de la verdad du rante la investigación,   son  un  medio  de  prueba  real  y  tangi ble  y  para  que  tengan  valor  deben  ser    debidamente  recolectados,  protegidos,  em balados,  rotulados,  transportados,  y    entregados al funci onario competente.        º  CLASIFICACION:   Se  deben  clasificar  por   separado  los  materiales    pulverulentos,  los  sólidos  y  dentro  de   estos  separar  los  que  corresponden  a    muestras  de  materiales  de  obra,  a  lo s  que  son  material  de  procesos  de    deterioro;  igualmente  se  debe  proceder   con  las  muestras  de  organismos  o    materia vegetal que se requiera  para inspección en laboratorio.       º  RECOLECCION:   No  se  debe  alterar  el  elemento,  para  lo  cual  se  deben    utilizar  los  medios  apropiados  (guantes,   pinzas,  etc.),  hacerlo  con  un  orden  y    no desestimar ninguno.      º  EMBALAJE :  Debe  hacerse  por  separado  y  en  los  medios  apropiados    (bolsas  de  papel,  plásticas,  frascos,   algodón,  etc.),  se  debe  seleccionar  de    acuerdo a la composición y sellar correct amente, evitando la contaminación.      º  ROTULACION:   Requisitos  de  diligencias,  membrete,  ciudad,  fecha  y  hora,    lugar, dirección, sitio, labor atorio, clase de elemento.      º  SOLICITUDES:   Cuando  es  necesario  que  el   laboratorio  nos  emita  un    dictamen pericial respecto a los  elementos de prueba recolectados.      9.- PRUEBAS DE CARGA A LA ESTRUCTURA.       De acuerdo a las evaluaciones preliminares  que se realizaron y del estado en que   se  encontró  la  edificación  es  probable   que  se  determine  la  necesidad  de  hacer    otras  evaluaciones,  como  método  para   acceder  a  información  complementaria,    entre ellas se tienen las pruebas de carga.      Si existen dudas razonables respecto a la  seguridad de la estructura o de alguno   de  sus  elementos  o  si  se  necesita  info rmación  a  cerca  de  la  capacidad  de  carga    de una estructura en servicio para fijar su s limites de carga,  se podrá ordenar que   se  efectúe  una  evaluación  de  la  resistencia  estructural  ya  sea  por  análisis  o    empleando pruebas de carga o por una comb inación de ambos procedimientos.      Cuando sea necesario hacer una prueba de  carga de un elemento o parte de una   estructura,  la  carga  de  prueba  se  aplicará   sin  impacto  a  la  estructura  de  manera    que no se produzca un efecto de arco en los materiales de carga.    La  carga  de  prueba  se  aplicará  por  increm entos  y  se  tomarán  lecturas  de  las    deflexiones  al  final   de  la  aplicación  de  cada  increm ento.    La  carga  de  prueba  se    mantendrá  durante  24  horas  y   se  tomarán  lecturas  de  la s  deflexiones  al  final  de   \ndicho período.  Luego se quitará la carga  y 24 horas después se tomarán lecturas   adicionales de las deflexiones.  Durante el  período que dure la prueba de carga se   debe llevar un registro de los cambios  de temperatura y estado de humedad.      Si  durante  la  prueba  o  al  mom ento  de  retirar  la  carga  el   elemento  o  parte  de  la    estructura  muestra  signos  de  falla,   sería  necesario  hacer  los  cambios  o    modificaciones apropiadas para que la  estructura tenga una capacidad menor.      Algunos casos en los cuales se r equieren hacer pruebas de carga son:   •   Cuando así lo dispongan las Instrucciones, Reglamentos específicos de un   tipo de estructura o el Pliego de Prescr ipciones Técnicas Particulares.    •   Cuando, debido al carácter particular  de la estructura, convenga comprobar   que la misma reúne ciertas condiciones específicas.  En este caso, el Pliego de   Prescripciones  Técnicas  Particulares   establecerá  los  ensayos  oportunos  que    deben realizarse, indicando con toda precisi ón la forma de llevarlos a cabo y el   modo de interpretar los resultados.    •   Cuando a juicio de la Dirección de Ob ra existen dudas razonables sobre la   seguridad, funciona lidad o durabilidad de la estructura.       INSPECCIONES DEL SUBSUELO.      A.- Inspección de la red de desagües y alcantarillado.      Una de las causas más frecuentes de apar ición de lesiones de asentamientos en   edificios, proviene de la incorporación de  agua a suelos limosos  al deteriorarse la   red de aguas residuales y lluvias.  No rmalmente se produce entre los 10 y los 20   años de existencia del edificio.   La  inspección  se  puede  realizar   directamente,  a  la  vista,   lo  que  implica  levantar    gran superficie del piso acabado del  primer piso, con altos costos.      B.-  Inspección  de  tipo,  dimensiones   y  deterioros  que  presenta  la    cimentación.      Para  esta  inspección,  es  necesario  hacer   pozos  tangentes  a  los  cimientos  hasta    alcanzar  el  plano  de   cimentación,  lo  cual  permitirá   inspeccionar  el  suelo  que  le    sirve de soporte.      Es importante anotar que la  excavación disminuye la  capacidad portante del suelo   de  cimentación  y  en  casos  en  que  exist an  movimientos  horizontales  combinados    con los asentamientos (cimentaciones en  laderas y también en suelos deslizantes   o  expansivos),  se  debe  tener  gran  cuidado   en  su  localización,  ya  que  al    desaparecer la reacción pasiv a que ofrecía el suelo exca vado, podría presentarse   un colapso del conjunto.      \nEn  el  caso  de  tratarse  de  una  cimentac ión  por  pilotes,  el  pozo  debe  dejar  al    descubierto la fundación y la cabeza de lo s pilotes, para comprobar la calidad de   los  materiales,  las  dimensiones  y  la  posible   existencia  de  fisuras  en  el  encuentro    de los pilotes y la cimentación, lo cual  es síntoma inequívoco de que han existido   esfuerzos de flexión sobre los pilotes.       C.- Inspección geotécnica del suelo de cimentación.      En principio plantear esta inspección es  similar a hacer un estudio de suelos en la   fase de proyecto.      Es probable que existan sondeo s anteriores, realizados pr eviamente a la ejecución   de  las  cimentaciones,  los  cuales  pueden  ser   erróneos,  insuficientes,  y/o  dar  una    imagen  del  suelo  en  una  fecha  determinada,  que  puede  haber  variado  en  el    transcurso del tiempo.      De  todas  maneras,  son  la  base  de  parti da  para  la  program ación  de  los  sondeos    que van a realizarse.      En lugar de distribuir los sondeos de una m anera uniforme sobre toda la superficie   como  se  hace  en  la  fase  de  proyecto,  se  debe  concentrar  en  aquellos  lugares    donde se aprecie el máximo asentamiento de la construcción.      El trazado de las grietas, permite  situar ese punto con exactitud.      Todo  esto  no  debe  excluir  los   sondeos  necesarios  para  definir  las  características    de la totalidad del terreno.      Si  se  piensa  que  la  causa  puede  ser  exte rior  al  edificio,  como  puede  ser  la    realización de una excavación o una ciment ación en su proximidad, la inspección   puede abarcar una zona muy amplia, y no ti ene que estar circunscrita a los muros   del edificio lesionado.      El  objetivo  de  estos  sondeos  es  co mprobar  la  idoneidad  del  sistema  de    cimentaciones.      Lógicamente  que  si  se  presentan  lesiones   por  asentamientos  diferenciales  se    piense que la cimentación es deficient e, pero hay que demostr ar el por qué.      Si  la  cimentación  es  superficial:    es  nec esario  estudiar  la   compresibilidad  de  los    estratos situados por debajo  del plano de cimentación y  a una profundidad igual al   ancho  del  edificio.    Las  muestras  extr aídas  deben  ser  tanto  alteradas  como    inalteradas.  \nSobre  la  compresibilidad,  es  important e  resaltar  que  se   deben  calcular  los    asentamientos y determinar  el tiempo de consolidación bajo la carga transmitida y   en unas condiciones de contorno lo más próximo posible a la realidad.      La  consolidación  es  un  fenómeno  por  el   cual,  a  costa  del  asentamiento,  se    produce un aumento de la densidad y por lo  tanto de la mejora del suelo.      Es frecuente que si las lesiones son debidas  a una cimentación inicial defectuosa,   se  encuentre  en  el  momento  de  la  inspec ción  próximos  al  fina l  del  fenómeno,  lo    cual  supondría  que  un  recalce  ya  no  es   necesario  por  muy  aparatosas  que  se    presenten las grietas.      Esto se constata tanto a través del tiem po de consolidación, que  sería próximo a la   existencia  del  edificio,  como  de  los   sistemas  de  medida  dispuestos  sobre  las    lesiones, los cuales no deben detec tar movimientos de importancia.      Es  importante  recordar  que  las  arenas   consolidan  en  tiempos  muy  cortos  (en    semanas  o  meses);  los  limos  y  las  arci llas  limosas  lo  hacen  en  períodos  más    largos  (2  ó  3  años);  algunas  arcillas   pueden  alcanzar  5  ó  10  años;  las  turbas    pueden  estar  variando  de  dimensión  un  tiem po  tan  extenso,  q ue  a  la  escala  de    duración de los edificios y de la vida hum ana, podíamos considerar indefinido.      Se  puede  aceptar  que  un  edifici o  es  reparable,  cuando  el  suelo  ha  alcanzado  un    85% de su consolidación total bajo la carga transmitida.      Si  en  el  estudio  se  llega  a  la  conclusi ón  de  que  el  grado  de   consolidación  no    alcanza un valor tan alto, se debe calcular:   •   Cuál es el valor de la deformación que resta.   •   Qué tiempo se tardará en alcanzar esta deformación.      De  la  respuesta  a  estas  dos  consideraciones  y  del  grado  de  deterioro  que    presente  el  edificio,  se  podrá  concluir   la  necesidad  de  abor dar  inmediatamente    costosos trabajos de recalce o bien esper ar la estabilización del edificio.      Si la cimentación es por pilotes y se ha  llegado a la conclusión de que el fallo no   es  atribuible  a  la  estructura  de  los   propios  pilotes,  se  debe  programar  una    inspección para deducir si la  profundidad era la adecuada.      Es importante entonces determinar:      •   La  existencia  de  estratos  blandos  dent ro  del  bulbo  de  presiones  del  pilote.    Falta de empotramiento.      •   Comprobación del comportamient o de los grupos de pilotes.  \n•   Eventual  existencia  de  solicitaciones  mayores  que  las  del  proyecto.    Por    rozamiento negativo y/o cargas inclinadas.      Siempre  se  debe  proceder   a  recalcular  los  pilotes.     Además,  se  debe  mirar  con    desconfianza situaciones como:      •   Rellenos  de  altura  importante  en  la  pr oximidad  de  pilotes  cuyo  fuste  esté    rodeado por suelos compresibles.   •   Cimentaciones  por  losas  r ealizadas  sobre  suelos  mu y  compresibles  y  en  la    proximidad de cimentaciones profundas.   •   Pilotes hincados en suelos granulares  en la proximidad de otros pilotes.   •   Pilotes en laderas inestables.      EXPEDIENTE PATOLÓGICO.      Un  informe  es  un  desarrollo  con  explic aciones  de  un  rec onocimiento  efectuado,    entre tanto un dictamen es  una opinión emitida por un  experto acerca de algo que   se somete a su juicio.      En  el  lenguaje  común  se  entremezclan   ambos  conceptos,  ya  que  a  menudo  los    informes  contienen  opiniones  y  los  di ctámenes  incluyen  descripciones  y    reconocimientos.   Por  lo  tanto  surge  el  concepto  de  EXP EDIENTE  PATOLÓGICO,  el  cual  reúne    ambos conceptos, de una maner a organizada y coherente.      No  siempre  los  expedientes  van  dirigi dos  a  personas  conocedoras  del  tema  y  de    las técnicas que allí se tratan; por eso  los expedientes deben es tructurarse tanto a   nivel  de  lenguaje  como  de  r edacción,  en  forma  clara,   ordenada  y  teniendo  en    mente el perfil del lector no técnic o, técnico, culto e inteligente.      ESTRUCTURACIÓN DE UN EXPEDIENTE DE PATOLOGÍA.      Una posible estructuración de un Ex pediente de Patología, puede ser:      1.  Antecedentes y objeto.   2.  Inspección ocular.    3.  Toma de datos.   4.  Descripción de los daños.   5.  Análisis y cálculos realizados.   6.  Causas posibles.    7.  Factores de riesgo.   8.  Recomendaciones de actuación.    9.  Conclusiones.      \n1.  Antecedentes y objeto.      En  este  primer  apartado  deben  figurar   todos  aquellos  datos  y  actuaciones    correspondientes a la fase previa del  problema, es decir, aquello que se le   comunicó al patólogo como planteamiento del encargo.      En particular merece des tacarse los siguientes.      •   Lista de documentos recibidos  para iniciar el estudio.   •   Mención de las reuniones y contactos sostenidos.   •   Muestras recibidas, si es el caso.   •   Consideraciones previas de carácter general.      Adicionalmente  debe  quedar  clar amente  estipulado  cuál  es  el  objetivo  del    estudio patológico por el cual se llamó al experto, así como el alcance hasta   el cual se espera llegar al terminar el estudio.      2.  Inspección ocular.       Es  la  descripción  detallada  de  las  visi tas  realizadas  al  si tio  donde  se  está    efectuando  el  estudio.    Facilidades   para  acceder  al  sitio  y  posibilidad  de    inspeccionar toda el área afectada.   Zonas mostradas y no mostradas.      Información  verbal  recogida  en  el  sitio  y   quien la suministró, tal como ellas   la  expresaron,  sin  darla  como  opinión   propia;  por  lo  cual  es  conveniente    hacer grabaciones de las entrevistas realiz adas para facilitar su trascripción   textual.      Durante las visitas de inspección, los  usuarios de la edific ación comentarán   hechos  relacionados  con  la   aparición  de  las  lesiones   o  con  la  historia  del    edificio  (fallas  de  instalaciones,  grieta s  observadas  en  la  primera  vida  del    edificio, etc.), que tienen gran interé s para comprender el fenómeno desde   su origen.      La  mejor  posición  es  la  de  dejar  hablar   y  saber  separar  lo  que  realmente    tiene importancia de lo que no la tiene.      3.  Toma de datos.      Después  de  la  visita  de  inspección  puede  ser  necesario  la  realización  de    una  toma  de  datos  a  cargo  de  un  equipo   especializado,  como  por  ejemplo    esclerometrías, ultrasonidos, probetas te stigo, etc.  Todas las muestras que   se tomen se deben codificar para  ser remitidas a laboratorios.     \nTodas las actuaciones se  deben reseñar en este  apartado del informe como   un  contenido  eminentemente  técnico;  per o  las  tablas  de  dat os  se  pueden    manejar  como  un  anexo  al  expediente,  dejando  en  el  texto  sólo  lo  más    importante, así como la ubicación de la s zonas en las cuales se tomaron las   muestras.   Este  capítulo  es  puramente  descrip tivo  y  no  debe  contener  juicios  de    ninguna clase.      4.  Descripción de los daños.      En  él  se  deben  describir  todas  las  le siones,  sin  aludir  a  causas,  en  forma    minuciosa, con un lenguaje preciso y científico, que pueda ser comprensible   para el lector imaginario culto e inte ligente, pero no necesariamente técnico   a quien va dirigido el expedi ente.  Si es necesario, deben insertarse figuras,   fotografías y croquis para  enriquecer el contenido.      5.  Análisis y cálculos realizados.      Se  reseñan  en  este  apartado  las   determinaciones  efectuadas  en  los    laboratorios  a  los  cuales  se  les  env iaron  muestras.    Los  resultados  y    cálculos se insertan dentro del contenido como un anexo.      Las  descripciones  deben  ser  breves  y  precisas,  citando  normas  y    procedimientos,  así  como  las  hipótesis   empleadas  en  los  cálculos.    Debe    ser una información científica sin juicios de causas.      6.  Causas posibles:       Este  capítulo,  el  de  recomendaci ones  y  las  conclusiones,  son  los  más    importantes y decisivos de l expediente.  D eben ir los tres coordinados entre   sí y deben llevar al lector  de lo general a lo particula r y de lo abstracto a lo   concreto.      Al  principio  deben  efectuarse  un  análisis   de  todas  las  causas  y  concausas    que  hayan  podido  influir  en   la  aparición  del  problema.    Algunas  serán    descartadas  en  base  a  los  análisis  y  cálc ulos  realizados,  otras  servirán  de    apoyo para la información final.      Al final del capítulo conv iene dar el dictamen en cuanto a las causas que se   consideren  fueron  las  más  important es,  sin  que  puedan  descartarse  otras    como consecuencias, pero que intervinieron en el estado final del fenómeno   patológico.      7.  Factores de riesgo.  \nAquí  se  deben  hacer  las  recomendaciones  que  sean  necesarias  para    proteger las vidas humanas, así como lo s planteamientos par a evitar que se   agrave  el  proceso,  es  decir,  las  s eñalizaciones,  desvíos,  apuntalamientos,    etc.      8.  Recomendaciones de actuación.       Se  incluyen  las  que  se  consideren  adecuadas  para  la  solución  de  los    problemas detectados, se pueden presentar varias alternativas, así:   •   Estudiar  más  a  fondo  el  proces o,  bien  sea  plant eando  una  nueva    etapa  de  estudio  a  cargo  de  nosotro s  mismos  o  encomendando  dicho    trabajo  a  otros  profesiona les  o  laboratorios  especializados,  si  es  del    caso.   •   Hacer un seguimiento de la evoluc ión del proceso, dejando testigos y   especificando el tiempo mínimo de evaluación.   •   Eliminar  la  causa   primaria  que  se  supone  originó  el  fenómeno    patológico,  explican do  claramente  los  procedimientos  a  seguir,    recomendando una supervisión  y una vigilancia posterior de la evolución   de la intervención.   •   Reparar y reforzar la edificación.   •   En  un  caso  grave  e  irreparabl e,  sugerir  la  demolición  y    reconstrucción de la zona afectada.      9.  Conclusiones.       En  éste  apartado  por  su   importancia  para  el  caso   jurídico  que  se  pueda    generar posteriormente, debe extremarse  el cuidado en su redacción.      El contenido puede resolverse de dos  formas: una es que las conclusiones   sean  un  resumen  del  expediente;  la   otra,  que  se  añada  algún  aspecto    nuevo a lo ya conocido, que ayude a ac larar lo expresado en los apartados   anteriores.      En lo posible las conclusiones de ben ser breves y enumerarse en orden de   importancia  de  acuerdo  a  los  fines  pr opuestos  para  la  realización  del    expediente patológico.      Acabadas las conclusiones se debe terminar  el expediente con un texto que defina   las partes de que consta éste, por ejemplo:      ...”el  presente  expediente  patológico  consta   de.....páginas,  #  de  fotografías,  #  de    croquis o esquemas y # de anexos; contiene  la opinión del firmante de acuerdo a   su  leal  saber  y  entender,  opinión  que   se  somete  a  cualquier  otra  mejor    fundamentada”.  \n   Se  debe  firmar  y  fechar,  así  como  guarda r  una  copia  firmada  de  recibido  por  el    interesado.      REPARACIÓN.      Finalizado  el  diagnóstico  (descripción  de l  proceso  patológico  con  su  origen  o    causa),  se  puede  “aplicar  el  remedio”.    Este  busca   devolver  a  la  unidad    constructiva lesionada  su funcionalidad  arquitectónica original.      El  conjunto  de   actuaciones    (demoliciones,  saneamientos,  nuevos  materiales,    etc.), destinados a  recuperar el estado  constructivo  original  de dicha unidad, se   llama  REPARACIÓN.      La Reparación contempla dos fases:           En la primera, se actúa sobre la caus a o causas, origen del  proceso, hasta su   total anulación.        En la segunda, se actúa sobre la lesi ón o lesiones que constituyen el síntoma   del proceso.      Para  abordar  un  proceso  de  reparación,   se  deberá  apoyar  en   el  diagnóstico  y    analizar detenidamente el  proceso patológico identifica do en dicho estudio, con el   fin  de  elaborar  el  programa  de  intervenc ión  o  reparación,  en  el  cual  será    fundamental  establecer  los  procedimien tos  prioritarios  que  necesariamente    estarán  encaminadas  a  garantizar  la  est abilidad  primaria  de   la  edificación  y    asociada  a  esta  será  necesario  interv enir  de  manera  preventiva  los  factores  de    riesgo  identificados  en  orden   de  gravedad,  posteriorment e,  se  podrá  iniciar  la    reparación  general  de  la  edificación  enc aminada  a  recuperar  las  condiciones  de    comportamiento  estructural  y  estabili dad  general  de  los  componentes  de  la    edificación, teniendo en cuenta las fases de la reparación.      Posteriormente,  se  podrá  continuar   corrigiendo  las  caus as  generadoras  de    lesiones  en  los  demás  elementos  consti tutivos  afectados  y  finalmente  reparando    las lesiones evidentes y terminando con los procesos de acabado.         PATOLOGÍA GERÍATRICA.      La patología geriátrica, se puede consider ar como una rama más especializada y   que  se  deriva  directamente  de  la  patología   curativa,  pues  la  metodología  y  la    conceptualizción  seguida  en  ésta,  son  idénti cas  para  la  patología  geriátrica,  pero    se  pueden  encontrar  dos  situaciones  especi ficas  que  hacen  la  diferencia  y  por    tanto el nivel de mayor especialización, a saber:     \nLa edad de la edificac ión define cual de las dos será  la que se aplique, es decir en   ambos casos se trata de hacer “durar” al edi ficio, pero en este caso especifico, se   contrastará la vida útil prev ista y predicha con la edad de la edificación al momento   de  realizar  el  diagnóstico,  es  decir,   cuando  la  edificación  ha  llegado  a  la  edad    prevista y predicha se asume un proceso geriátrico.      El  segundo  aspecto,  es  el  procedimient o  de  evaluación,  pues  no  solo  se  deberá    identificar el estado actual  de la edificación, sino  que con más detenimiento habrá   que  establecer  el  estado  de   durabilidad  y  conservación  y  por  lo  tanto  la  vida    residual de los componentes constitutivos de  la edificación, bien sea materiales o   sistemas constructivos.      Para  este  caso  se  puede  hacer  una  analo gía  con  una  rama  de  la  medicina  en  la    cual  aparece  el  concepto  de   gerontología,  que  es  básica mente  el  estudio  de  la    vejez,  por  lo  tanto  en  el   caso  de  la  construcción,  lo s  materiales  y  elementos    componente  sufren  de  envejecimiento  y  su   estudio  es  el  que  determina  el    procedimiento de actuación frente a una ed ificación que aunque ya  llegó a la vida   prevista, puede estar en condiciones de co ntinuar prestando servicio, con algunas   intervenciones tendientes a repotenciar la  edificación y no solo desde el punto de   vista estructural.      VIDA ÚTIL RESIDUAL.      Según  Paulo  Helene,  si   durante  la  vida  de  servicio  de  una  obra  se  realiza  una    inspección,  una  evaluación  y  un  diagn óstico  (secuencialmente  y  en  un  período    corto  de  tiempo),  a  partir  de  ellos,     se  puede  entonces  determinar  con  alguna    aproximación  la  vida  útil  residual  de  la  obra .    Por  lo  tanto,  la  vida  útil  residual    corresponde al período de tiempo (contado a  partir de la fecha de la inspección),   en que la obra es capaz de desempeñar sus funciones.      La  inspección,  la  evaluación  y  el   correspondiente  diagnóstico,  pueden  ser    efectuados en cualquier momento de la vida en  uso de la edificación.  Por lo tanto,   ello  puede  generar  distintas  vidas  residuales.     Es  decir,  que  el  plazo  final  puede    ser tanto el límite del proy ecto, como el límite de las condiciones de servicio, o el   límite de fractura, dándose origen a tres vidas útiles residuales.   Por  otro  lado,  si  la  edif icación  es  mantenida   periódicamente  (lavada,  protegida),    rehabilitada  (resanada,  reparada,  reforzada,   reprotegida),  necesariamente  se  da    origen a una nueva vida útil del  proyecto, cuya extensi ón en el tiempo depende del   tipo de mantenimiento o rehabilitación efectuados.      ALCANCE DE LA PATO LOGÍA GERÍATRICA.      El  alcance  de  la  patología  ger iátrica,  deberá  ser  la  realización  de  un  estudio  que    tenga el compromiso de identificar las posib les lesiones presentes, identificar sus   causas; así como el establecimiento de la  vida residual de los materiales, sistemas  \nconstructivos  o  componentes  de  la  edific ación,  definiendo  si  se  requieren    intervenciones  drásticas  o  si  admite  su  permanencia  en  la  obra  de  una  manera    segura para el inmueble y sus habitantes       Una  variable  en  la  vida  de  la  edificación   que  puede  exigir  el  es tudio  de  la  misma    desde el punto de vista de la patología geriá trica, son los posibles cambios de uso   que  ésta  pueda  sufrir,  en  este  caso  será  ne cesario  identificar   si  las  condiciones    actuales  del  bien  objeto  de  estudio,   son  adecuadas  para  adaptarse  al  nuevo  uso    esperado  y  si  su  respuesta,  no  solo  estr uctural,  sino  de  funcionamiento  será    satisfactoria  y  en  caso  negativo,  se   debe  proceder  a  la  elaboración  de  las    recomendaciones para este fin, tratando de  ser lo más respetuosos posible con el   inmueble de manera que no se generen proces os de rechazo entre la edificación   original  y  la  intervención,  que  generen  otro  tipo  de  fenómenos  patológicos  que    disminuyan su potencial vida residual.      PLANTEAMIENTO DEL ENCARGO.      Se encarga a un profesiona l en patología de la construcción adelantar un estudio   geriátrico  de  una  edificación,  cuando  se   tiene  el  interés  o  la  intención  de    conservarla  dentro  del  mismo  concepto   de  funcionamiento  o   a  través  de  un    cambio  de  uso  y  ésta  ha  s uperado la vida útil prevista   desde  su  concepción  y  se    hace necesario evaluar la vida útil residual  de ella y establecer las condiciones en   que  se  encuentra  para  permanecer  en  f uncionamiento  o  para  adecuarla  a  las    nuevas exigencia de uso o de comportamiento.      RESTAURACIÓN Y REHABILITACIÓN.      Para la  RESTAURACIÓN  (Reparación de un elemento  concreto o de un elemento   de  decoración  o  una  obra  de   arte),  el  enfoque  debe  ser  el  mismo,  con  su    diagnóstico  previo  y  la  actuación  sec uencial  sobre  causa  y  lesión.    También  un    edificio monumental se puede restaurar.      REHABILITACIÓN.      La Rehabilitación es la recuperación de la  funcionalidad de un edificio completo.      La rehabilitación exige una serie de fases  que mínimo incluirá las siguientes:          Proyecto arquitectónico (con nuevos usos en caso de darse).       Estudio patológico con diagnósticos parciales.       Reparaciones de las diferentes unidades constructivas dañadas.       Restauración de los distintos element os y objetos individualizables.           \nPROCESO ESPECÍFICO DE DIAGNÓSTICO.      •   Se  hace  fundamental  la   incorporación  de  un   componente  científico    importante para entender los  procesos de envejecimiento a través de ensayos de   laboratorio.   •   Se debe inspeccionar la  totalidad de los sistemas y unidades funcionales de   obra. Así como todos los materi ales constitutivos del mismo.   •   Identificar  los  elementos  que  se  encue ntran  en  el  límite   de  su  vida  útil  o    próximos a colapsos parciales.   •   Realizar  un  análisis  de  posible   comportamiento,  entendiendo  los    requerimientos de conservaci ón, frente al estado actual  para dar recomendaciones   de intervención.      Complementario  a  lo  anterior,  se  cons idera  importante  rea lizar  una  serie  de    estudios  que  si  bien  se  pueden  requerir   en  cualquier  evaluac ión  de  patológica,    para  el  caso  especifico  de  la  geriátrica ,  tendrán  una  mayor  relevancia,  entre  los    que se encuentran los estudios de suelos, es tudios y modelación  estructural de la   edificación, estudio de redes tanto eléctric as como hidrosanitarias y finalmente, un   estudio  ambiental  para  analizar  la  in fluencia  del  clima,  el  macroclima  pero    fundamentalmente  el  microc lima,  lo  que  permitirá  comprender  mucho  mejor  el    proceso evolutivo sufrido por la edificación.      EXPEDIENTE GERÍATRICO.      Como se ha indicado anteriormente, desde  el punto de vista patológico, la rama de   la patología geriátrica, se  dedica a estudiar  las edificaciones que han cumplido con   el ciclo de vida útil prevista y predicha,  lo que puede abarcar t anto a edificaciones   patrimoniales  como  aquellas  qu e  no  lo  sean,  razón  por  la   cual  a  continuación  se    reseñarán  los  requerimientos  del  instru ctivo,  de  la  Dir ección  Nacional  de    Patrimonio  del  Ministerio  de  Cultura  de  la   Republica  de  Colombia ,  los  cuales  se    consideran exigencia para  procesos de restauración.      Para  aquellas  obras  que  no  tiene  el  caráct er  de  patrimoniales,  será  decisión  del    especialista  en  patología  adoptar  esta  me todología  complementando  lo  explicado    en cuanto a expedientes patológicos se refiere.         PATOLOGÍA FORENSE.      Patología  Forense:   Es  la  parte  de  la  patología  que  estudia  los  procesos  que    llevaron a que se presentara un colapsos parcial o total de la edificación.           \nVIDA ÚTIL ÚLTIMA O TOTAL.       La vida útil última o total, llamada también  límite de fractura,  está definida como   el período de tiempo que va desde que se inicia  la ejecución de la obra, hasta que   se presenta su colapso parcial o total.  Es  decir, que la vida útil total es la suma del   período de iniciación de
