l de terioro, del período de propagación del mecanismo de   daño  o  del  agente  de  deterioro  que  agreden   la  obra  y  del  período  de  colapso    parcial o total.      En  la  etapa  de  colapso,   se  pueden  presentar  roturas,   o  colapsos  parciales  o    colapso  total  de  la  obra.    Generalment e  corresponde  al  período  de  tiempo  en  el    cual  puede  haber  una  reducción  significativa   de  la  resistencia  de  los  materiales    (fatiga del material), como cons ecuencia de los mecanismos de daño.      ALCANCE DE LA PATOLOGÍA FORENSE:       Por definición, se entiende que el alcance será la determinación de las causas que   originaron el colapso total o  parcial de la edificación, por lo que se hace necesario   tener conocimiento suficiente so bre estructuras colapsadas.      Cuando  el  colapso  es  parcial  y  dependie ndo  de  los  elementos  afectados,  será    necesario  establecer  el   estado  actual  en  el  que   quedan  los  demás  componentes    del inmueble con el fin de eval uar la posibilid ad de habitación.      PLANTEAMIENTO DEL ENCARGO.      Cuando se llama a un especialista en pat ología de la construcción para enfrentar   el  estudio  de  un  colapso  en  una  edificaci ón,  será  necesario  dejar  claramente    establecido  que  el  estudio  debe  identificar   las  causas  del  colapso,  estudiar  el    estado  de  los  elementos  en  pie  y  fina lmente  diseñar  los  procedimientos  de    desmonte y/o demolición para evitar  daños mayores o riesgo de accidentes.      También  es  necesario  tener  en  cuenta  que  cuando  se  da  esta  situación,    generalmente  se  requiere  de  la  intervenc ión  inmediata  del  especialista,  caso    similar  al  analizado  en  los  fenómenos  de   ocurrencia  súbita;  por  lo  que  se  debe    actuar rápidamente y establec er de la manera mas expedi ta las responsabilidades,   ya que no habrá tiempo para formalizar el encargo.      Cuando se da la situación de intervención in mediata sobre el bien colapsado, toma   prioridad  la  seguridad  del  equipo  evaluador,  por  lo  que  se  debe  disponer  de  los    equipos de seguridad necesarios y apoy ar las actividades de rescate.              \nPROCEDIMIENTO DE IN SPECCIÓN E INGRESO.       El  patólogo  deberá  rea lizar  una  serie  de  inspecci ones  a  la  edificación  para    determinar  la  estabilidad  de  ésta,  est ableciendo  los  procedimientos  necesarios    para  iniciar  las  actividades  de  socorri smo,  salvamento  y  rescate,  que  sean    necesarias,  igualmente  deberá  determinar   las  zonas  criticas  que  requieren    acordonamiento,  cierre  y  las  que  neces itan  apuntalamiento,  así  como  los    procedimientos  correctos  para  realizarlo;  en  caso  de  encontrarse  una  edificación    en estado de inminente col apso, deberá recomendar el des alojo y las respectivas   rutas de evacuación, de acuerdo a las zonas  identificadas como más estables.      Si  bien  es  cierto  que  en  caso  de  un  incendio  es  prioritario  sofocarlo  y  que  en  la    mayoría  de  los  casos  el  patólogo  no  cuent a  con  el  entrenamiento  necesario  para    participar  en  dicha  actividad,  también   lo  es  que  el  profesional  encargado  de    realizar  la  evaluación  patológica  debe  esta r  en  el  sitio  desde  el  momento  en  que    lleguen  los  cuerpos  de  bomberos  y  resca te,  no  solo  para  dar  recomendaciones    que  aporten  a  la  seguridad  de  estas  personas ,  sino  también  para  entrar  a  la    edificación  detrás  de  los  socorristas   (siguiendo  las  recomendaciones  dadas  por    estos), para iniciar su evaluación.      ESTRUCTURAS COLAPSADAS.      Evaluación Preliminar de Daños      •   Fases de la evaluación.   o   Evaluación preliminar de daños.    o   Evaluación detallada de daños.    o   Diagnóstico.    o   Análisis estructural previo al sismo.    •   Objetivos de la evaluación preliminar de daños.   o   Diagnóstico aproximado para det erminar evacuaciones y/o   restricciones a la entrada al edificio.    o   Dictamen técnico preliminar que indique:      Nivel de daño.       Habitabilidad.       Rehabilitación temporal.       Demolición.   •   Organización del personal técnico.   o   Coordinación.    o   Equipo.    o   Actitud.   •   Identificación del sistema estructural.   o   Marcos de concreto reforzado.    o   Paredes estructurales.    o   Marcos y paredes interactuantes.   \no   Marcos metálicos.    o   Estructuras de madera.    o   Estructuras de adobe y bahareque.    o   Combinaciones.   •   Identificación de daños en estructuras de concreto.   o   Agrietamiento.    o   Aplastamientos.    o   Desconchamiento del recubrimiento.    o   Explosión del núcleo confinado.    o   Pandeo del acero.    o   Inspección visual de los puntos es tructuralmente importantes.    o   Inspección de la corrosión del acero.    o   Observación de detalles evidentes de estructuración.   •   Criterios para la evaluación pr eliminar del nivel de daño en   estructuras de concreto.   •   Identificación de daños en  mampostería reforzada.   o   Agrietamiento.    o   Fracturas.    o   Desplomes.    o   Defectos constructivos.   •   Identificación de daños en estructura metálica.   o   Alabeo en patines.    o   Fractura en los patines.    o   Alabeo en el alma.    o   Fractura del alma.    o   Torsión lateral.    o   Deflexiones.   •   Identificación de daños en suelos , cimentaciones y obras de   contención.   o   Asentamientos.    o   Desplomes de elementos verticales.    o   Grietas en el piso.    o   Deslizamientos.   •   Identificación de daños  no estructurales.   o   Juntas de dilatación.    o   Cielos falsos.    o   Pisos.    o   Puertas y ventanas.    o   Divisiones.    o   Elementos decorativos.    o   Instalaciones.   •   Recopilación de información.    •   Análisis de la información.    •   Informe escrito.     \nClasificación de grietas por el tipo de esfuerzo que las produce:   o   Grietas debidas a esfuerzos de flexión.    o   Grietas debidas a esfuerzo cortante.    o   Grietas debidas a esfuerzos de torsión.      Clasificación de grietas por su ancho:   •   Fisuras: ancho < 0.4 mm.    •   Grietas: 0.4 mm ancho < 1.0 mm.    •   Fractura: 1.0 mm ancho < 5.0 mm    •   Dislocación: ancho > 5.0 mm.      Clasificación de grietas por su movimiento:   •   Grietas muertas: son aquellas cuyo  ancho y longitud no varían con el   tiempo; es decir, son estables.    •   Grietas vivas: son aquellas cuyo ancho y longitud varían con el   tiempo, presentando movimiento bajo la  acción de cargas, efectos térmicos,   solicitaciones dinámicas, etc. Son grietas inestables.         OBJETO DE LA INVESTIGACIÓN.  PUNTOS A   INSPECCIONAR  EDIFICIOS PRIVADOS   (A)   EDIFICIOS PÚBLICOS   (B)   1. DAÑOS   ESTRUCTURALES  EXTERIOR  EXTERIOR E INTERIOR   2. OBJETOS   DESPRENDIBLES  EXTERIOR  EXTERIOR E INTERIOR   3. INSTALACIONES     ELECTRICIDAD, GAS,   SUMINSITRO DE AGUA,   SERVICIOS   HIGIENICOS   4. DAÑOS DEBIDOS A   EDIFICIOS   COLINDANTES   EDIFICIOS O   ESTRUCTURAS   COLINDANTES   EDIFICIOS O   ESTRUCTURAS   COLINDANTES         INSPECCION Y EVALUACION DE LA  SEGURIDAD DE LOS EDIFICIOS      En  el  caso  un  gran  terremoto  es  necesaria  una  inspección  de  daños  de  los    edificios situados en las zonas afectadas.      Los edificios dañados  han de quedar clasificados tras  una inspección para verificar   su grado de uso potencial.      Son necesarios dos tipos de evaluación:   \na) En tiempo próximo para ev itar daños con las réplicas.   b) Después del perio do de crisis para su reparación  y refuerzo, ó en su caso, para   su demolición.       \"Cuando  se  registre  un  terremoto  de  intens idad  igual  o  superior  a  VII  se  deberá    realizar  un  informe  en  el  que  se  analicen   las  consecuencias  del  sismo  sobre  la    construcción y el tipo de medidas que proceda adoptar\"       Clasificación de daños    Nota: el modo en que un edificio se deforma bajo la carga de un terremoto depende del tipo de   edificio. En una clasificación genérica se pueden di stinguir los tipos de edificios de fábrica y los de   hormigón armado.    Clasificación de daños en edificios de fábrica    Grado 1:  Daños de despreciables a ligeros    (ningún daño estructural, daños no-estructurales   ligeros)        Fisuras en muy pocos muros.    Caída sólo de pequeños trozos de revestimiento.   Caída de piedras sueltas de las partes altas de los   edificios en muy pocos casos.      Grado 2: Daños moderados    (daños estructurales ligeros, daños no-  estructurales moderados)       Grietas en muchos muros.    Caída de trozos bastante grandes de revestimiento.   Colapso parcial de chimeneas.      Grado 3: Daños de importantes a graves    (daños estructurales moderados, daños no-  estructurales graves)        Grietas grandes y generalizadas en la mayoría de los   muros.   Se sueltan tejas del tejado.   Rotura de chimeneas por la línea del tejado.   Se dañan elementos individuales no-estructurales   (tabiques, hastiales y tejados).     \nGrado 4: Daños muy graves    (daños estructurales graves, daños no-  estructurales muy graves)      Se dañan seriamente los muros.   Se dañan parcialmente los tejados y forjados.       Grado 5: Destrucción     (daños estructurales muy graves)       Colapso total o casi total.       Clasificación de daños en edificios de hormigón armado    Grado 1: Daños de despreciables a ligeros    (ningún daño estructural, daños no-estructurales   ligeros)       Fisuras en el revestimiento de pórticos o en la base   de los muros.   Fisuras en tabiques y particiones.      Grado 2: Daños moderados     (daños estructurales ligeros, daños no-  estructurales moderados)       Grietas en vigas y pilares de pórticos y en muros   estructurales.   Grietas en tabiques y particiones; caída de enlucidos   y revestimientos frágiles. Caída de mortero de las   juntas de paneles prefabricados.       Grado 3: Daños de importantes a graves   (daños estructurales moderados, daños no-  estructurales graves)       Grietas en pilares y en juntas viga/pilar en la base de   los pórticos y en las juntas de los muros acoplados.   Desprendimiento de revocos de hormigón, pandeo   de la armadura de refuerzo.   Grandes grietas en tabiques y particiones; se dañan   paneles de particiones aislados.      \nGrado 4: Daños muy graves     (daños estructurales graves, daños no-  estructurales muy graves)       Grandes grietas en elementos estructurales con   daños en el hormigón por compresión y rotura de   armaduras; fallos en la trabazón de la armadura de   las vigas; ladeo de pilares.   Colapso de algunos pilares o de una planta alta.      Grado 5: Destrucción    (daños estructurales muy graves)       Colapso de la planta baja o de partes (por ejemplo   alas) del edificio.          Definiciones de los grados de intensidad    Organización de la escala:    a)  Efectos en las personas   b)  Efectos en los objetos y en la naturaleza (los efectos y fallos en el terreno se tratan   especialmente en otra sección)   c)  Daños en edificios    Observación preliminar:    Cada grado de intensidad puede incluir también los efectos de la sacudida de los grados de   intensidad menores, aunque dichos efectos no se mencionen explícitamente.    I -  No sentido    a)  No sentido, ni en las condiciones más favorables.      b)  Ningún efecto.      c)  Ningún daño.    II -  Apenas sentido    a)  El temblor es sentido sólo en casos aislados (<1%) de individuos en reposo y en posiciones   especialmente receptivas dentro de edificios.       b)  Ningún efecto.      c)  Ningún daño.    III –  Débil    a)  El terremoto es sentido por algunos dentro de edificios. Las personas en reposo sienten un  \nbalanceo o ligero temblor.      b)  Los objetos colgados oscilan levemente.      c)  Ningún daño.    IV -  Ampliamente observado    a)  El terremoto es sentido dentro de los edificios por muchos y sólo por muy pocos en el exterior.   Se despiertan algunas personas. El nivel de vibr ación no asusta. La vibración es moderada. Los   observadores sienten un leve temblor o cimbreo del ed ificio, la habitación o de la cama, la silla, etc.     b)  Golpeteo de vajillas, cristalerías, ventanas y puerta s. Los objetos colgados oscilan. En algunos   casos los muebles ligeros tiemblan visiblemente.  En algunos casos chasquidos de la carpintería.      c)  Ningún daño.    V –  Fuerte    a)  El terremoto es sentido dentro de los edificios por la mayoría y por algunos en el exterior.   Algunas personas se asustan y corren al exterior . Se despiertan muchas de las personas que   duermen. Los observadores sienten una fuerte  sacudida o bamboleo de todo el edificio, la   habitación o el mobiliario.      b)  Los objetos colgados oscilan co nsiderablemente. Las vajillas y cris talerías chocan entre sí. Los   objetos pequeños, inestables y/o mal apoyados pueden desplazarse o caer. Las puertas y   ventanas se abren o cierran de pronto. En algunos  casos se rompen los cristales de las ventanas.   Los líquidos oscilan y pueden derramarse de recipientes totalmente llenos. Los animales dentro de   edificios se pueden inquietar.      c)  Daños de grado 1 en algunos edificios de clases de vulnerabilidad A y B.    VI -  Levemente dañino    a)  Sentido por la mayoría dentro de los edificio s y por muchos en el exterior. Algunas personas   pierden el equilibrio.  Muchos se asustan  y corren al exterior.      b)  Pueden caerse pequeños objetos de estabilidad ordinaria y los muebles se pueden desplazar.   En algunos casos se pueden romper platos y vasos. Se pueden asustar los animales domésticos   (incluso en el exterior).      c)  Se presentan daños de grado 1 en muchos edif icios de clases de vulnerabilidad A y B; algunos   de clases A y B sufren daños de grado 2; algunos de clase C sufren daños de grado 1.    VII –  Dañino    a)  La mayoría de las personas se asusta e intenta correr fuera de los edificios. Para muchos es   difícil mantenerse de pie, especialmente en plantas superiores.       b)  Se desplazan los muebles y pueden volcarse los que sean inestables. Caída de gran número de   objetos de las estanterías. Salpica el agua de los recipientes, depósitos y estanques.      c)  Muchos edificios de clase de vulnerabilidad  A sufren daños de grado 3; algunos de grado 4.   Muchos edificios de clase de vulnerabilidad B sufren daños de grado 2 ; algunos de grado 3.  \nAlgunos edificios de clase de vulnerabilidad C presentan daños de grado 2.   Algunos edificios de clase de vulnerabilidad D presentan daños de grado 1.    VIII -  Gravemente dañino    a)  Para muchas personas es difícil mantenerse  de pie, incluso fuera de los edificios.      b)  Se pueden volcar los muebles. Caen al suelo objetos como televisiones, máquinas de escribir,   etc. Ocasionalmente las lápidas se pueden desplazar, girar o volcar. En suelo muy blando se   pueden ver ondulaciones.       c)  Muchos edificios de clase de vulnerabilidad  A sufren daños de grado 4; algunos de grado 5.   Muchos edificios de clase de vulnerabilidad B sufren daños de grado 3; algunos de grado 4.   Muchos edificios de clase de vulnerabilidad C sufren daños de grado 2; algunos de grado 3.   Algunos edificios de clase de vulnerabilidad D presentan daños de grado 2.    IX –  Destructor    a)  Pánico general. Las personas pueden ser lanzadas bruscamente al suelo.      b)  Muchos monumentos y columnas se caen o giran. En suelo blando se ven ondulaciones.       c)  Muchos edificios de clase de vulnerabilidad A presentan daños de grado 5.   Muchos edificios de clase de vulnerabilidad B sufren daños de grado 4; algunos de grado 5.   Muchos edificios de clase de vulnerabilidad C sufren daños de grado 3; algunos de grado 4.   Muchos edificios de clase de vulnerabilidad D sufren daños de grado 2; algunos de grado 3.   Algunos edificios de clase de vulnerabilidad E presentan daños de grado 2.    X -  Muy destructor    c)  La mayoría de los edificios de clase de vu lnerabilidad A presentan daños de grado 5.   Muchos edificios de clase de vulner abilidad B sufren d años de grado 5.   Muchos edificios de clase de vulnerabilidad C sufren daños de grado 4; algunos de grado 5.   Muchos edificios de clase de vulnerabilidad D sufren daños de grado 3; algunos de grado 4.   Muchos edificios de clase de vulnerabilidad E sufren daños de grado 2; algunos de grado 3.   Algunos edificios de clase de vulner abilidad F presentan daños de grado 2.    XI –  Devastador    c)  La mayoría de los edificios de clase B de vulnerabilidad presentan daños de grado 5.   La mayoría de los edificios de clase de vulnerabilidad C sufren daños de grado 4; muchos de grado   5.   Muchos edificios de clase de vulnerabilidad D sufren daños de grado 4; algunos de grado 5.   Muchos edificios de clase de vulnerabilidad E sufren daños de grado 3; algunos de grado 4.   Muchos edificios de clase de vulnerabilidad  F sufren daños de grado 2; algunos de grado 3.    XII  - Completamente devastador    c)  Se destruyen todos los edificios de clases de vulnerabilidad A, B y prácticamente todos los de   clase C. Se destruyen la mayoría de los edificios  de clase de vulnerabilidad D, E y F. Los efectos   del terremoto alcanzan los efectos máximos concebibles         \n\"Las  medidas  de  prevención  se  dirigi rán  a  evitar  riesgos  derivados  del    derrumbamiento de edificios dañados  por el terremoto, mediante:   - Desalojo de escombros.   -  Inspección  y  clasificación  de  edifi caciones,  en  función  de  su  estado  y    peligrosidad.   - Reforzamiento y demolición, s egún proceda, de edificios dañados.   - Se contemplarán asimismo las actuac iones de urgencia encaminadas a paliar o   reparar los daños experimentados por estr ucturas de presas, instalaciones en las   que  se  produzcan  y/o  almacenen  sustancia s  peligrosas  y  otras  construcciones  o    edificaciones  cuyo  deterioro  pueda  dar   lugar  a  riesgos  secundarios  o  peligros    asociados.\"      En las inspecciones durante el periodo inm ediato al terremoto, se han de realizar   dos evaluaciones:      1º  Una  inspección  rápida,  para  una  clas ificación  acelerada  del  estado  de    seguridad, que impida el  uso de edificios en mal es tado. Estas inspecciones, han   de  realizarlas  personas  cualificadas,   que  puedan  desplazarse  rápidamente.  Los    datos  tomados  en  esta  inspección  se  refl ejaran  en  la  ficha  adjunta  y  el  resultado    de la misma (hoja de grado de  seguridad de la edificación: roja, amarilla o verde)   se colocará en un lugar bien visible a la entrada del inmueble.      2º  Una  evaluación  detallada  que  permite ,  con  mayores  medios  y  por  técnicas    especializadas,  valorar  cuidadosamente   el  grado  en  que  el  edificio  ha  sido    afectado y emitir un  dictamen fiable del uso que puede  hacerse de la edificación y   las acciones inmediatas que sean necesarias en el mismo.      Cuando  las  inspecciones  se   hayan  realizado,  la  clasific ación  de  la  edificación  ha    de  quedar  reflejada  en  una  hoja   técnica  que  se  fija  en   las  zonas  de  entrada  a  la    construcción para advertir del gr ado de seguridad de la misma.      Las  hojas  tendrán  diferentes  colores   según  el  grado  de  daños  y  estado  de    seguridad.      VERDE: HABITABLE      Para  aquellos  edificios  inspeccionados   en  los  que  aparentemente  no  se  han    detectado daños de importancia  que afecten a la estructu ra, paredes, cimentación,   cubiertas.   Uso no restringido      AMARILLO: Atención. Constru cción dañada. Entrada restringida.     \nDaños  en  la  edificación.   Condiciones  inseguras  sobre  todo  cuando  ocurran    réplicas.  Entrada  sólo  en  caso  de  extr ema  urgencia  y  durante  unos  instantes    solamente.   Necesita una nueva inspección.      ROJO: Peligro. Construcción dañada muy insegura. Prohibida la entrada.      Daños muy graves. Gran peligro. Alto ries go de derrumbamiento con la ocurrencia   de réplicas.   Prohibida la entrada en cualquier caso.      INSPECCION DE EDIFICIOS CON DAÑOS SISMICOS    FICHA PARA LA EVALUACION RAPIDA  DE DAÑOS EN EDIFICACIONES   IDENTIFICACIÓN      UBICACIÓN      USO   Residencial  Laboral  Mixto  Sanitario    Unifamiliar  Plurifam iliar   Aislada  Adosada   TIPOLOGIA  DE  LA    CONSTRUCCIÓN    Nº Plantas: S/ Rasante B/ Rasante      TIPOLOGIA CONSTRUCTIVA      Forjado unidireccional  HORMIGON   ARMADO  Forjado reticular   ACERO   Mampostería   Ladrillo  Fábrica   Bloques   MUROS DE CARGA   Tapial/Adobe   MIXTA (Especificar)            ESTRUCTURA    OTRA (Especificar)      DAÑOS OBSERVADOS      TIPO DE DAÑO  ELEMENTO  DESCRIPCION  Y  CUANTIA  \nDEL DAÑO                  DAÑOS   ESTRUCTURALES                            DAÑOS NO   ESTRUCTURALES             DIAGNOSTICO Y RECOMENDACIONES      GRADO SEGURIDAD   VERDE  AMARILLO  ROJO    RECOMENDACIONES       INSPECCION   DETALLADA   REFUERZO  DEMOLICION        INDICACIONES DE COLAPSO.       Paredes fuera de plomo:      Las  paredes  pandeadas;  las   paredes  que  se  observan   ladeadas;  las  paredes  se    han separado de sus zapatas o pisos y tec hos; y las paredes qu e tienen un efecto   de pliegue o de onda.      Humo y/o agua a través de los ladrillos:      Esto  significa  que  el  cemento  que  mantení a  a  los  ladrillos  unidos  ya  no  está    intacto.  El  mortero  de  peg a  pudo  haberse  hecho  polvo  con  el  movimiento  del    edificio.  Lo  más  importante,   es  que  la  gravedad  es  lo   único  que  mantiene  a  los    ladrillos unidos y en pie, lo que r epresenta una situación muy peligrosa.  \nVigas separadas:      Puede  ser  el  resultado  del   fuego,  explosión,  sism os,  huracanes,  tornados  y    cualquier otra razón que pudiera causar que  un edificio se moviera. En la mayoría   de  las  construcciones  de  tipo  prefabric ados  o  desmontables,  las  vigas  que  van    junto a la pared, son los yugos que sostie nen el techo en su lugar y mantienen las   paredes verticales.      Vigas de acero pandeadas:      Este  es  usualmente  el  resultado  de  un  f uerte  incendio,  donde  las  vigas  de  acero    expuestas a altas temperaturas, se fati gan y fallan, causando qu e se pandeen y se   separen  de  las  paredes.  Las  vigas  de  m adera  laminada,  usualmente  tienen  la    tendencia de absorber más el calor y  mantenerse intactas más tiempo.      Grandes grietas, revoques que se caen:      Después de cualquier evento en que el ed ificio ha sido expues to a movimientos u   otro  tipo  de  perturbaciones,  pueden  haber se  formado  grandes  grietas  o  haberse    desprendido grandes secciones de revoques  o recubrimientos. Esto puede ser un   buen  indicador  de  que  el  edificio  no  es   estable;  puede  haber  alguna  razón  para    creer  que  los  soportes  de  viga s  de  carga  o  paredes  en  el  interior  del  edificio    pueden estar dañados.      Pisos sin drenaje o empapados:      Durante las condiciones de  sofocado del fuego, los bomber os introducen al edificio   cerca  de  dos  toneladas  de  agua  a  cada   minuto,  toda  esta  agua  requiere  ser    desalojada;  debido  a  que  la  mayoría  de  las  estructuras  no  son  capaces  de    soportar esta cantidad de  agua por tiempo prolongado.      Implicación de un incendio fuerte:      Es  común  para  una  estructura  colaps arse  durante  o  poco  después  de  haberse    visto  envuelta  en  un  fuego  excesivo.  El   gran  porcentaje  de  los  incendios  a  los    cuales  asisten  los  bomberos,  son  consid erados  incendios  confinados;  En  otras    palabras,  los  muebles  son  el  material  com bustible;  Si  se  permite  que  el  fuego  se    extienda  a  la  estructura,  cosa  que  no   toma  mucho  tiempo,  entonces  se  debe    considerar la posibilidad ex istente de que se colapse.      Sobrecarga, envejecimiento:      En  las  antiguas  áreas  comerciales,  se   pueden  encontrar  edifi cios  antiguos  de    ladrillo  sobrecargados  de  maquinaria;  lo   que  puede  presentar  un  peligro  obvio    durante  un  sismo.  La  edad  de   cualquier  edificio  deber ía  ser  considerado  un   \nproblema  potencial  en  cualquier  evento;  lo s  techos  viejos,  con  solo  una  pequeña    pendiente, tienden a pandearse con los años;  debido a que los depósitos de agua   durante  cada  período  de  lluvia,  result an  en  grandes  cargas,  por  lo  que  suelen    colapsarse  durante  las  lluvias  fuertes   cuando  la  acumulac ión  de  agua  es    demasiado  rápida  como   para  que  los  desagües  la  drenen.  Una  gran  mayoría  de    los edificios viejos de l adrillos tienen tensores que sost ienen los pisos en el lugar   atornillándolos  a  las  paredes  de  los  la dos,  ayudando  a  la  vez  a  mantener  las    paredes de los lados verticales.      Ruidos:      Es  importante  poner  atención  a  los  sonido s  que  produce  el  edi ficio;  puede  estar    tratando de advertir un peligro  inminente. Después de un  sismo, fuego, explosión,   o  cualquier  otro  evento  desastroso,  un  ed ificio  que  ha  sido  seriamente  dañado,    debe tomar algún tiempo antes de que se col apse. Durante ese ti empo, el edificio   podría crujir, gemir, chasquear, crepitar y  hacer ruidos secos antes de que caiga.         PATRONES DE COLAPSO  POR SISMOS Y VIENTOS       Inclinado , se puede formar cuando una pared exteri or se derrumba y deja el piso   que sostenía soportado por uno de los lado  solamente. Ocurre cuando las uniones   de pared o techo se rompen o separan de  un extremo, provocando que uno de los   lados del piso(s) descanse en el piso de abajo.      Forma  de  V ,  puede  ocurrir  cuando  en  una  pared  interior  de  soporte  o  columna,    falla  o  cuando  las  pesadas  cargas  provoc an  que  se  colapse  cerca  del  centro  del    piso o loza, formando una \"V\".      Apilado , puede ocurrir cuando todos los miembros verticales de soporte fallan y la   mayoría  de  los  pisos  se  colapsan  uno  sobre  otro.  Este  es  más  común  en  los    edificios con pisos pesados.      Voladizo , es un colapso de apil amiento donde algunos de lo s planos de los pisos   se  extienden  hacia  afuera  como  miembros   sin  soporte.  Un  extremo  del  piso  se    sostiene libre porque una o más  paredes han fallado y el otro extremo del piso aún   está sujeto a la pared.                       \nPatrón  de  colapso  pared  /  madera   de  mampostería  no  reforzada            Capacidad normal de la construcción existente sin daño:      •   Un marco de madera o acero del piso  sin daño, soportar á un piso dañado.   * Normalmente toma 2 pisos de concreto sin daño soportar un piso dañado.   * El grosor de los escombros de un  piso dañado deben tomarse en cuenta.      La condición de la estructura a ser s oportada – travesaños de concreto, lozas de   concreto  sólida,  lozas  rotas,  esco mbros  de  mampostería  –  determinan  las    necesidades del sistema de diseminación.   La condición del cimiento / soporte de los re fuerzos, piso sólido / suave, suelo roto,   piso  sobre  un  sótano  abajo,  escombro s,  número  de  pisos  sin  daño  debajo,    determinan el alcance del sistema.       APUNTALAMIENTOS       Definición básica y principios:      Apuntalar o reforzar, es normalmente el s oporte temporal de estructuras durantes   la  construcción,  demolición,  reconstr ucción,  etc.  de  acuer do  a  proveer  la    estabilidad  que  proteger á  apropiadamente  tan  bien  como   a  los  trabajadores  y  el    público.      Apuntalamiento vertical:      El  objetivo  principal  de  este  tipo  de  apunt alamiento  es  estabilizar  pisos  o  techos    dañados.  También  pueden  ser  usados,  para  su stituir  paredes  o  columnas  de    soporte que faltan o que son inestables.  \nEl apuntalamiento horizontal:      El propósito principal de es te apuntalamiento es estabilizar una pared dañada con   una pared en buen estado en vestíbulos, co rredores, o entre construcciones.      El apuntalamiento de ventanas y puertas:      El  propósito  principal  de  es te  tipo  de  apuntalamiento  es   estabilizar  una  ventana,    puerta,  o  cualquier  otra  fuente  de  acce so.  Un  colapso  extensivo  puede  generar    grandes cantidades de escombros que obsta culizan las entradas principales a un   edificio y algunas veces de una ent rada a través de una ventana.       El apuntalamiento inclinado:      El  propósito  principal  del  apuntalamiento   inclinado,  es  de  proveer  soporte  a  las    paredes  y  columnas  inestabl es  o  débiles,  transfiriendo   el  peso  adicional  a  través    del contraviento, hacia el suelo u otros so portes de miembros estructurales y lejos   de la pared o columna.      Los  refuerzos  inclinados  deben  ser  siempr e  instalados  en  serie,  al  menos  dos    deben  ser  levantados  en  cualquier  situac ión  dada,  y  sujetados  juntos  con  una    separación recomendada de 2.4 metros.      Metodología para la patología forense.      1. Aspectos relacionados con la metodología general.   2. La obtención de testimonios.   3. Enmarque general histórico y sint ético de los hechos acontecidos.   4. Elaboración del informe previo.   5. Excavación.   6. Cadena de custodia de las evidencias.   7. Estudio en el laboratorio.      1. Identificación.   2. Diagnóstico del colapso.   3. Etiología.   4. Data del colapso.   5. Circunstancias que  rodearon al colapso.      1º Descripción del edificio objeto del mi smo, en el estado o del modo en que se   halle (observación).   2º Relación detallada de todas las operacio nes practicadas por los peritos y de su   resultado. (Hipótesis y experimentación).   3º Las conclusiones que en vista de tale s datos formulen los peritos, conforme a   los principios y reglas de su ciencia o arte.  \nDICTAMEN.       Igual  que  en  un  estudio  de   patología  preventiva  o  cu rativa,  el  patólogo  deberá    entregar  un  documento  como   resultado  de  su  trabajo  de   investigación  y  estudio,    pero para el caso de la patol ogía forense existe una difer encia importante, la cual   radica en que en aquellos caso s se entregará un expediente,  pero en la forense se   entregará  un  dictamen,  el  cual  tiene  como   característica  fundamental,  el  análisis    de las causas por las cuales se generó el  colapso total o parcial, en este caso no   se  requiere  hacer  descripción  de  daños,  pero   si  se  debe  describir  claramente  el    estado en el que quedó el inmueble.      Un elemento que de acuerdo a las circunst ancias especificas de cada caso, será   posible incluir, es el capitulo de fa ctores de riesgo que puede entrañar el estado en   el que quedo la edificación.      Otro  aspecto  a  tener  en  cuenta,  será  el   desmonte  o  demolición,   la  cual  se  podrá    recomendar  directamente  en  campo  si   este  proceso  se  desarrollará    inmediatamente,  pero  si  por  el  contra rio,  paralelo  a  la  inspección  técnica    patológica,  se  realizarán  actividades   de  otras  disciplinas  como  pueden  ser  las    investigaciones  judiciales,  en  este  caso   el  dictamen  deberá  tener  todas  las    recomendaciones para ejec utar esta actividad.         INGENIERIA VALORATIVA DEL DESEMPEÑO.      El  objetivo  de  este  nuevo  enfoque  técnic o  es  proporcionar  información,  con    indicadores   que  fundamenten  las  toma s  de  decisiones  en  la  construcción,  en  la    compraventa y en el m antenimiento de inmuebles.      Se trata de generar una Me todología Sistematizada para evaluar las funciones que   se desarrollan en los edificios.      El conjunto de procedimientos permite:   A-  detectar  ineficiencias funcionales.   B-  programar  correcciones o mejoras, para optimizar los ciclos de vida útil.   C-  reducir  costos operativos con ahorros energéticos.   D- conocer  desempeños  funcionales para ca lificar inmuebles.   E-  abaratar  el control de las prestaciones, inte rviniendo en la preconstrucción.(ver   gráfico).       DEFINICIONES .      FUNCIÓN:  Es el propósito o uso de  un sistema o cosa.  Se diferencian la función   básica, la secundaria y la innecesaria.     \nCONFIABILIDAD:    Es  la  posibilidad  que  un  sistema  o  cosa  se  desempeñe  o    funcione  durante  su  vida  útil,   como  estaba  definido  en  los  criterios  de  diseño  sin    tener fallas.      COSTO:  Es el monto de bienes y servicios  necesarios para producir, mantener y   operar un sistema o cosa.      COSTO TOTAL:  Durante la vida útil, es el costo  inicial + el costo de operación + el   costo de mantenimiento.      COSTO  FUNCIONAL:   Es  el  costo  de  las  funcione s  básicas,  secundarias  y  las    innecesarias.      VALOR:  Es la relación entre el costo de la función básica y el costo total.   Considerando  los  conceptos  de   función   y   confiabilidad ,  se  calculan  los  costos    funcionales y los  valores  de las distintas alternativas , que fundamentan el análisis   de la Ingeniería Valorativa.      Análisis de Mediciones Sistematizadas.    Las    disciplinas   que  intervienen  en  los  edificios,  son   cada  vez  más  y  con    mayores niveles de complejidad , a causa de las innovac iones tecnológicas que   se  incorporan.    Las  variables  se leccionadas  se  analizan  en  base  a  los    requerimientos  físicos,  quí micos  y  a  las  experiencias   obtenidas  en  distintas    tipologías de edificios.      El    análisis  de  las  mediciones   y  datos  obtenidos,   para  calificar  las  funciones    deben  estar  basados  en  procedimientos  sistematizados,  considerando  las    condiciones estaciona les y operativas.    Las Bases de Datos, permiti rán obtener la información nec esaria para identificar y   planificar las obras de m antenimiento, rehabilitación  y el orden de prioridades.      Las  performances  funcionales  al  relaci onarse  con  parámetros  de  referencia,    posibilitan  que  la  ingeniería  valorativa   optimice  las  prestaciones  necesarias    minimizando  costos.    Los  procedimien tos  desarrollados  para  la  Ingeniería    Valorativa de Desempeños, están bas adas en los siguientes conceptos:      Mediciones ,  aplicando  conocimientos  científicos  y  tecnológicos,   para  obtener    expresiones  numéricas   que  reemplacen  los  subjetiv os  adjetivos  calificativos    (bueno, regular, malo, mucho, poco, etc.).      Sistematización , para dar  base estadística  a las valoraciones funcionales, pues   las  condiciones  estacionales  y  operat ivas  de  los  edificios,  requieren    procedimientos repetitivos.     \nAnálisis ,  con  el  procesamiento  de  los  datos   obtenidos  de  las   variables  medidas    para  obtener  la   evaluación  objetiva   y  cualitativa,  de  las  funciones  primarias,    secundarias e innecesarias.      Ingeniería  Valorativa,   analizando  las  funciones  con  el  fin  de  alcanzar  las    prestaciones  necesarias  al   costo  total   (costo  inicial  +  cost o  operativo  +  costo  de    mantenimiento)  más bajo.       Desempeño ,  determinando  las   performances  funcionales ,  que  según  las    características particulares de cada edificio, se comparan con los  parámetros  que   establezcan las Normas Técnicas Internacionales o Nacionales.      Resumiendo:  esta  Estrategia  resulta  básica  para   conocer,  mantener  o  mejorar    funciones  controlando sus costos en el proyecto  y durante el ciclo de vida útil de   los  edificios,  analizando  De sempeños  y  Consumos  para   Maximizar  Valores  y    Minimizar Costos.          DOCUMENTACION DE IDENTIDAD  TECNOLOGICA DE EDIFICIOS.      Los edificios casi sin excepción, nacen a su  vida útil, luego de concebidos y   construidos,  pero  luego,  los  inmuebles  comienzan  a  ser  utilizados  con  un    grave  e  injustificado  pecado  de  omisión,  en  el  que  se  incurre  con  la    negligencia al no extender sus Documentos de Identidad Tecnológica.       El comprador tiene derecho a  conocer lo que compra , recibiendo la información   con  las  características  detalladas  la   obra  y  su  equipamiento,  que  constituyen    además un  conocimiento ineludible para su conservación .      En 1998 CAVERA (Cám ara de la Vivienda Económica de  la República Argentina)   señalaba  la  diferencia  entre  los  inmuebl es  y  los  bienes  muebles  de  uso,  tales    como  electrodomésticos,  automotores,   computadoras,  todos  los  cuales  se    entregan  con  garantías  escritas,  manual es  de  uso  y  mantenimiento,  con    finalidades  pedagógicas  y  de  asesoramient o,  que  el  usuario  acostumbra  a    reclamar.      DOCUMENTACION DE IDENTIDAD TE CNOLOGICA DEL EDIFICIO (DITE).      La  Carpeta  Técnica  que  debe  recibir   el  comitente  y  luego  ceder  en  las    posteriores  transferencias,  debidame nte  actualizada  tiene  que  tener  el    siguiente contenido mínimo:    •   Planos   generales  del  Edificio,   plantas,  cortes,  fachadas,    instalaciones, volumetría esquemática.   •   Especificaciones  Técnicas   con  materiales  y  componentes    utilizados (marcas y modelos).  Descrip ciones de redes de instalaciones de  \nagua  fría,  caliente,  desagües,  gas,   climatización,  electricidad,    telecomunicaciones,  protección  contra   el  fuego  y  sus  correspondientes    equipos.   •   Garantías  y  Recomendaciones   de  los  fabricantes,  proveedores  y    contratistas para el buen uso y las pr ácticas de conservación de materiales,   componentes, artefactos, redes, equipos y mobiliario.   •   La  Documentación  Técnica   inicial  debe  mantenerse   actualizada ,   con  los  informes  técnicos  fechados,  de  las  revisiones  periódicas  y  de  las    tareas realizadas al producirse modificaciones ulteriores.   •   En los edificios existentes que no dispongan de esta documentación   la  misma  será   exigible   en  las  obras  de  ampliación,  reformas  o    rehabilitación.      APLICACIONES.      Se mencionaran algunas de las vent ajas importantes de la DITE.   1)  El  contenido  de  la  información  técnica   mínima  (DITE)  detallada  anteriormente,    induce al  buen uso y conservación .  Asimismo  facilitará las inspecciones  y la   preparación  de  informes  que  fundamenten   las  intervenciones  para  el    mantenimiento.   2)También la Documentación DITE es neces aria para la aplicación de la Ingeniería   Valorativa de Desempeños, mediante medici ones sistematizadas e indicadores de   desempeños.   3) La DITE además de información previa pa ra la Certificación Energética, puede   conducir con criterios est adísticos y de calificaci ón, a la comparación y   clasificación  de distintas tipologías  edilicias y proporcionar valoraciones   objetivas, útiles para la creciente  demanda cualitativa de los usuarios.         LIBRO DEL EDIFICIO.      Cuando  nos  disponemos  a  adquirir  una  vi vienda  usada,  nuestras  posibilidades    económicas,  el  emplazamiento  del  inmueb le  y  su  aparente  buen  estado  son  los    aspectos  que  principalmente  determinan  que   nos  decantarnos  por  una  u  otra.  La    calidad  de  la  construcción  del  edificio   queda  a  menudo  relegada  a  un  segundo    plano,  bien  porque  no  es  fácil  informars e  sobre  las  condiciones  reales  de    mantenimiento  de  una  vivi enda  (estado  de  la  fachada,  del  tejado...)  y  los    problemas que ha sufrido en el pasado (gri etas, humedades, filtraciones o posibles   defectos  de  construcción),  bien  porque  el   elevado  precio  de  los  inmuebles    construidos  con  materiales  de  primera   los  aleja  de  nuestras  posibilidades.  Como    respuesta a la falta de información sobre el  estado de los edificio s y para asegurar   su  adecuada  construcción  y  conservación,   surge  el  Libro  del  Edificio,  vigente    desde el 6 de mayo de 2000.         \n¿Qué es el Libro del Edificio?        Consta  de  varios  volúmenes  que,   a  modo  de  archivadores,  recogen  toda  la    información a la que la ley obliga. Incluye lo s datos principales del edificio y es una   herramienta  útil  no  sólo  par a  los  usuarios  finales,  sino   también  para  arquitectos,    aparejadores,  promotores,  constructores,   inmobiliarias,  presidentes  de    comunidades de vecinos y administradores de propiedades.       Si se realiza una obra en la fachada, por ejem plo, el libro recogerá los datos de la   empresa que a la que se encargó y los de talles sobre el trabajo efectuado. Debe   ser  conservado  en  el  edificio,  que  po r  ley  deberá  constar  de  un  armario    comunitario con cerradura en el que se guardará.    A los propietarios de las viviendas sólo se  les entregará la parte correspondiente a   sus  obligaciones  en  materia  de  conserva ción  del  inmueble.   Dentro  del  libro,    destaca  por  su  importancia  el  documento  de  especificaciones  técnicas,  esencial    para que se realicen las operaciones de cons ervación y mantenimiento destinadas   a asegurar la vida útil del inmueble.       Información que contiene el Libro del Edificio.        Aunque  no  haya  coincidencia  en  el  conten ido  de  los  libros  de  edificio  de  las    diversas comunidades autónomas y aunque  las denominaciones de sus capítulos   puedan variar, estas son las partes de que debe constar un Libro de Edificio:       Datos básicos.      La información más general del edificio,  relacionada con las partes que intervienen   en  el  proceso  de  construcción:  ubicación   del  edificio,  promotores,  autores  del    proyecto,  dirección  de  la  obra,  constructo r,  licencias,  fechas  de  construcción,    declaración de obra nueva, régimen de pr opiedad, cargas reales y garantías.       Registro de incidencias.       Capítulo  en  el  que  el  presidente  o  el   administrador  de  la  comunidad  anotarán    incidencias como cambios de la propiedad (t itularidad), fecha en la que se registra   la  incidencia,  elección  de  nuevos  pres identes  de  la  comunidad  de  propietarios,    detalles  sobre  las  reformas   y  rehabilitaciones  que  afecten   al  estado  original  del    edificio, subvenciones y beneficios concedi dos para ‘arreglos’ de l edificio, seguros   contratados...       Calendario de mantenimiento.      Se  planifican  las  operaciones  de  manteni miento  que  deben  realiz arse  a  lo  largo    del  año,  sean  obligatorias   o  recomendables.  Para  recoger  estas  revisiones  se    facilitan hojas en las que debe aparecer la  fecha de realización y todos los datos  \ndel  profesional  que  va  a  trabajar  en  el  edi ficio,  además  de  su  firma  y  sello.  Se    sigue el mismo proceso en cada operación.       Manual de uso y manten imiento del edificio.      Se  describen  las  características  construc tivas  del  edificio  y  las  instrucciones  de    uso y mantenimiento recomendables para cada elemento concreto.    Un ejemplo:    Los  elementos  que  forman  parte  de  la  estructura  del  edificio,  paredes  de    carga  incluidas,  no  se  pueden  alterar  sin  el  control  del  Técnico  de    Cabecera. Esta prescripción incluye la  realización de rozas en las paredes   de  carga  y  la  abertura  de  pasos  par a  la  redistribución  de  espacios    interiores.       Manual de uso y mantenimiento para cada vivienda.      Es  un  resumen  del  anterior  donde  se   exponen  los  temas  directamente    relacionados con la propia  vivienda. Se repartirá a ca da miembro que forme parte   de la comunidad de propietarios.    Ejemplos:     Fachada.   No  puede  alterarse  (cerrar  bal cones,  abrir  ventanas  nuevas,    instalar  toldos  o  rótulos  no  apropi ados)  sin  contar  con  las  ordenanzas    municipales  y  la  aprobación  de  la   comunidad  de  propiet arios.  En  los    balcones y galerías no se deben colocar  cargas pesadas, como jardineras o   materiales  almacenados.  También  deber ía  evitarse  que  el  agua  que  se    utiliza para regar gotee  por la fachada.    Acabados de la fachada.  Hay que evitar el trat amiento de las paredes de   fachada  donde  se  encuentre  su  balcón  o   galería  con  colores  diferentes  a    los  del  resto  de  la  fac hada.  En  todo  caso,  se  precisa  del  permiso  de  la    comunidad de propietarios.       Carpeta de planos y memoria constructiva.      Contiene  los  planos  del  alzado,  secciones ,  cimentación  y  estructura  de  cada  una    de  las  instalaciones  del  edificio,  tal   y  como  fueron  ejecutados  en  su  obra,    reflejando las posibles modificaciones al proyecto original.       Archivo de documentos.      Recoge todos los documentos relativos  al edificio que han sido recopilados desde   su  construcción,  y  se  clasifican  y  se  re gistran  convenientement e.  Se  trata  de  las    licencias y el Certificado Final de Obra, la  escritura pública de  declaración de obra   nueva,  los  documentos  de  garantías  y  pó lizas  de  seguros,  la  división  de  la    propiedad  y  cargas  reales,  y  los  document os  que  justifiquen  la  realización  de  las    operaciones de reparación.   \nOtros documentos que también se incluyen.       •   Traslado  de  las  anotaciones  que  se   hagan  en  el  Libro  de  Ordenes    como las incidencias más significativas.    •   Los planos del edificio    •   Las  calidades  de  los  materiales  utilizados,  así  como  las  garantías    que emitan los constructores y sus prov eedores o suministradores sobre la   calidad de sus actividades y materiales.    •   Normas de actuación en caso de emergencia.      REFLEXIONES.       •   CONOCEMOS LOS MATERIALES QUE USAMOS?   •   CONOCEMOS LOS SISTEMAS CONSTRUCTIVOS QUE EMPLEAMOS?   •   SOMOS CONSCIENTES DE LA  DURABILIDAD DE NUESTRAS OBRAS?   •   ESTAMOS CONSCIENTES DE NUESTRO COMPROMISO SOCIAL?   •   ESTAMOS  CONSCIENTES  DE  LA  RESPONSABILIDAD  CIVIL  QUE    TENEMOS?         TRABAJAMOS CON EL HOMBRE Y PARA EL HOMBRE.     \n";

    function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }
    function rgbToHex(r, g, b) {
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
        return '#' + toHex(r) + toHex(g) + toHex(b);
    }
    function mixColors(colorA, colorB, amount) {
        const a = hexToRgb(colorA);
        const b = hexToRgb(colorB);
        return rgbToHex(a.r + (b.r - a.r) * amount, a.g + (b.g - a.g) * amount, a.b + (b.b - a.b) * amount);
    }
    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);
    }
    function getReadableTextColor(bgColor) { return getLuminance(bgColor) > 0.56 ? '#111827' : '#f8fafc'; }
    function generatePalette() {
        const hue = Math.floor(Math.random() * 360);
        const bg = hslToHex(hue, 45 + Math.floor(Math.random() * 20), 16 + Math.floor(Math.random() * 70));
        const text = getReadableTextColor(bg);
        const isDark = getLuminance(bg) < 0.5;
        const accent = hslToHex((hue + 35 + Math.floor(Math.random() * 60)) % 360, 80, isDark ? 55 : 45);
        const card = isDark ? mixColors(bg, '#ffffff', 0.08) : mixColors(bg, '#000000', 0.05);
        const border = isDark ? mixColors(card, '#ffffff', 0.18) : mixColors(card, '#000000', 0.12);
        const input = isDark ? mixColors(card, '#ffffff', 0.07) : mixColors(card, '#000000', 0.04);
        const inputBorder = isDark ? mixColors(border, '#ffffff', 0.12) : mixColors(border, '#000000', 0.1);
        const botBg = isDark ? mixColors(bg, '#ffffff', 0.12) : mixColors(bg, '#000000', 0.06);
        return {
            bgColor: bg,
            textColor: text,
            cardBgColor: card,
            cardBorderColor: border,
            inputBgColor: input,
            inputBorderColor: inputBorder,
            chatBubbleBotBg: botBg,
            chatBubbleBotText: text,
            chatBubbleUserBg: accent,
            chatBubbleUserText: getReadableTextColor(accent),
            primaryColor: accent,
            secondaryColor: isDark ? mixColors(accent, '#ffffff', 0.2) : mixColors(accent, '#000000', 0.2),
            headerBorderColor: border,
            systemMessageBg: isDark ? mixColors(bg, '#fde68a', 0.2) : mixColors(bg, '#fde68a', 0.28),
            systemMessageText: isDark ? '#fef3c7' : '#78350f'
        };
    }
    function buildThemePalette(theme, palette) {
        const base = palette || {
            primaryColor: '#2563eb',
            secondaryColor: '#6b7280',
            bgColor: '#ffffff',
            textColor: '#1f2937',
            cardBgColor: '#ffffff',
            cardBorderColor: '#d1d5db',
            inputBgColor: '#ffffff',
            inputBorderColor: '#cbd5e1',
            chatBubbleBotBg: '#f3f4f6',
            chatBubbleBotText: '#1f2937',
            chatBubbleUserBg: '#2563eb',
            chatBubbleUserText: '#ffffff',
            headerBorderColor: '#e5e7eb',
            systemMessageBg: '#fef3c7',
            systemMessageText: '#92400e'
        };
        const isDark = theme === 'dark';
        const bgColor = isDark ? mixColors(base.bgColor || '#ffffff', '#000000', 0.72) : '#ffffff';
        const textColor = getReadableTextColor(bgColor);
        const cardBgColor = isDark ? mixColors(bgColor, '#ffffff', 0.08) : '#ffffff';
        const cardBorderColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.16) : '#d1d5db';
        const inputBgColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.06) : '#ffffff';
        const inputBorderColor = isDark ? mixColors(cardBorderColor, '#ffffff', 0.12) : '#cbd5e1';
        const chatBubbleBotBg = isDark ? mixColors(bgColor, '#ffffff', 0.12) : '#f3f4f6';
        const chatBubbleBotText = textColor;
        const headerBorderColor = cardBorderColor;
        const systemMessageBg = isDark ? mixColors(bgColor, '#fde68a', 0.2) : '#fef3c7';
        const systemMessageText = isDark ? '#fef3c7' : '#92400e';
        return {
            ...base,
            bgColor,
            textColor,
            cardBgColor,
            cardBorderColor,
            inputBgColor,
            inputBorderColor,
            chatBubbleBotBg,
            chatBubbleBotText,
            headerBorderColor,
            systemMessageBg,
            systemMessageText
        };
    }
    function setPaletteVariables(target, palette) {
        if (!palette) return;
        target.style.setProperty('--primary', palette.primaryColor || '#007bff');
        target.style.setProperty('--secondary', palette.secondaryColor || '#6c757d');

    }

            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
</body>
