escala, aceptando entonces una desventaja  en costes. Ambas son opciones indeseables.  •   D iferenciación  del  producto:   C uando  los  competidores  existentes se benefician de una fuerte imagen de marca y de  la fidelidad de los clientes, la diferenciación crea una barrera  de  entrada,  al  forzar  a  los  entrantes  a  gastar  mucho  para  vencer la lealtad de los consumidores.  •   N ecesidades de capital : La necesidad de invertir muchos  r ecursos  financieros  para  competir  crea  una  barrera  de  entrada, especialmente si el capital es requerido para pu-  blicidad o investigación y desarrollo (I+D), arriesgada o no  r ecuperable. •  C ostes de cambio de proveedor : Esta barrera se crea si exis-  ten costes adicionales que deben asumir los compradores al  cambiar de un proveedor de productos o servicios a otro. •   A cceso  a  los  canales  de  distribución :  La  necesidad  por  parte de un nuevo entrante de asegurar la distribución de su  producto puede crear una barrera de entrada.   •  Desventajas  en  costes  independientes  de  la  escala:   Algu-  nos competidores actuales pueden poseer ventajas que son  independientes del tamaño o las economías de escala.  Esto puede ocurrir por las siguientes razones:  • La propiedad del producto.  • El acceso favorable a las materias primas.  • El subsidio del Gobierno.  • Las políticas gubernamentales favorables.  En un entorno en el cual pocas, o ninguna, de estas barreras de  entrada se encuentran presentes, la amenaza de nuevos entran-  tes será alta. Por ejemplo, si una nueva empresa puede lanzar su  negocio realizando una escasa inversión de capital y puede ope-  r ar eficientemente a pesar de su pequeña escala de producción,  es probable que sea una amenaza probable.  En  el  siguiente  cuadro,  presentamos  algunas  de  las  barreras  de  entrada más frecuentes en la mayoría de sectores.   ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   41  EJEMPLOS DE BARRERAS DE ENTRADA  •   Beneficios no atractivos en el sector.   En los sectores en los que  los beneficios no son excesivamente atractivos, el riesgo de que  nuevos competidores se animen a entrar es menor, por lo tanto,  los beneficios esperados en el sector están actuando como ba-  rrera de entrada a nuevos competidores.   • Sector en etapa de madurez.   C uando el sector en cuestión  atraviesa la etapa de madurez, la rentabilidad obtenida en el  mismo es muy baja, los competidores tienen la necesidad de  desarrollar procesos y gestión muy eficaces, desarrollar nuevas  tecnologías, nuevas líneas de negocio, etc., para permanecer en  el mercado. Por lo tanto, en dichos sectores, como es el caso del  sector de la construcción, existe una barrera a la entrada de  nuevos competidores.   • Economías de escala.   En los sectores en los que existen eco-  nomías de escala, los nuevos competidores tienen que compe-  tir con costes mayores y, por lo tanto, parten de una desventaja  que constituye una barrera a su entrada en el sector. Este es el  caso de la gran mayoría de sectores industriales tradicionales  Estrategias ok.qxd   21/3/05  17:25  Página 41 \nEL PODER DE NEGOCIACIÓN DE LOS CLIENTES   Los clientes amenazan a un sector forzando a la baja los pre-  cios, negociando por mayores niveles de calidad y más servi-  cios, fomentando de este modo la rivalidad entre los compe-  tidores. Este comportamiento por parte de los clientes reduce  la rentabilidad del sector. El poder de cada uno de estos gran-  des grupos de compradores depende de las características de  la  situación  del  mercado  y  de  la  importancia  de  las  compras  de ese grupo comparadas con el negocio total del sector. Un  grupo  de  compradores  tiene  poder  cuando  se  dan  las  si-  guientes condiciones:  •  El  grupo  de   clientes    se  encuentra   concentrado   o  su  compra supone un gran volumen de las ventas del vende-  dor.  Si  un  alto  porcentaje  de  las  ventas  del  proveedor  es  adquirido  por  un  único  comprador,  la  importancia  del  negocio del comprador para el proveedor se incrementa.  Los  compradores  de  grandes  volúmenes  tienen  incluso  mayor poder en los sectores con altos costes fijos.  •  Los   productos   que  compra  el  cliente  son   estándares   o  indiferenciados.  La  falta  de  incertidumbre  de  encontrar  un proveedor alternativo permite a los compradores crear  una  presión  hacia  los  competidores  que  tienen  que  en-  frentarse  los  unos  a  los  otros  para  acaparar  una  mayor  cuota  de  mercado.  Los  compradores  tienen  incluso  ma-  y or  poder  en  el  caso  de  sectores  que  ofrecen  productos  genéricos.  •  Los  compradores  tienen  pocos   costes  de  cambio .  Los  costes de cambio atan al comprador a un vendedor parti-  cular.  En  cambio,  el  poder  del  comprador  se  eleva  si  el  vendedor se enfrente a altos costes de cambio.  •  Los  compradores  obtienen  pocos   beneficios .  Unos  be-  neficios reducidos crean presión para intentar rebajar los  costes de compra. Por otro lado, los compradores que ob-  tienen  altos  beneficios  son  generalmente  menos  sensi-  bles al precio.  •  Los  compradores  plantean  una  verdadera   amenaza .  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 42  donde la dimensión de empresa otorga una ventaja competitiva  a los que ya la poseen (sector del mueble, del acero, productos  disolventes, etc.).   • Diferenciación del producto.   En los sectores que trabajan con  productos diferenciados, las empresas que ya están introduci-  das conocen mejor las necesidades del consumidor y el funcio-  namiento del mercado, por lo tanto, tienen una ventaja que  constituye una barrera de entrada para aquellos que desean in-  troducirse en el sector. Este es el caso de productos muy diferen-  ciados, como el sector de electrodomésticos con alta tecnología  incorporada.   • Inversión en capital.   En los sectores en los que las empresas,  por su actividad, requieren una fuerte inversión en capital para  entrar en el mercado, ésta constituye una barrera de entrada pa-  ra  los nuevos competidores, ya que la necesidad de capital ini-  cial no es accesible para cualquier inversor.   • Imagen de marca.   En los sectores en los que los consumido-  r es son fieles a una marca, esta apreciación de la marca consti-  tuye una barrera de entrada para los nuevos competidores que  entrarían en el mercado con una marca desconocida. Este es el  caso de los sectores de productos deportivos, raquetas, zapati-  llas, etc., donde la imagen de marca está muy reconocida y otor-  ga una imagen de calidad al producto.  E xisten multitud de barreras de entrada en cada sector. Por su  especificidad, las barreras de entrada pueden ser muy distintas  a las de otro sector. Los sectores en los que se dan casi todas las  barreras de entrada son aquellos que disfrutan de una menor  competencia (mercados dominados, por ejemplo, por dos em-  presas a nivel mundial).  Estrategias ok.qxd   21/3/05  17:25  Página 42 \nO curre cuando existe una tendencia en el sector a la inte-  gración hacia atrás.  •  C alidad del producto  del comprador. Cuando la calidad  del producto que ofrece el cliente está directamente rela-  cionada  con  la  calidad  de  sus  proveedores,  las  presiones  en  el  precio  del  producto  suelen  ser  menores  porque  el  cliente valora más la calidad.  En  el  siguiente  cuadro  presentamos  algunos  ejemplos  de  ocasiones en las que los clientes ejercen una gran presión so-  bre los vendedores.   EL PODER DE NEGOCIACIÓN DE LOS PROVEEDORES   Los proveedores pueden ejercer una notable influencia en un  sector presionando en una subida del precio, en el tiempo de  entrega o en la calidad de los productos, y de esta manera ex-  primir la rentabilidad de un sector. Por ello, es de vital impor-  tancia averiguar qué papel juegan dentro del sector. Un gru-  po  de  proveedores  tiene  poder  cuando  se  dan  las  siguientes  condiciones:  •  Existe  un  número  reducido  de  proveedores  o  se  en-  cuentran  concentrados  en  grandes  grupos .  Los  provee-  dores, cuando son escasos o están unidos en asociaciones  o  consorcios,  pueden  fijar  los  precios  con  un  mayor  po-  der porque la oferta es limitada y está muy controlada por  un determinado grupo de proveedores.   •  Importancia  del  sector  para  el  proveedor.   Si  pa ra    los  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   43  EJEMPLOS DE PODER DE NEGOCIACIÓN DE LOS CLIENTES  • Concentración de las ventas.   En los sectores en los que las  ventas están muy concentradas (dos clientes, por ejemplo,  pueden representar el 90% de las ventas.), el poder del cliente  será muy grande por la importancia que tiene el volumen de  negocio de su factura para el vendedor. Este es el caso del sec-  tor de productos alimenticios, cuando las empresas producto-  r as venden a clientes “gigantes” tipo El Corte Inglés, Mercado-  na, Carrefour, etc.   • Productos no diferenciados.   En los sectores en los que el  producto es  commodity   (estándar), los clientes ejercen una  mayor presión en posprecios porque el coste para ellos de  cambiar de proveedor no es excesivo. Este es el caso de los sec-  tores de accesorios comunes, productos alimentarios genera-  les (sal, azúcar, etc.), etc.   • Amenaza de los compradores de integración hacia atrás.   En  los sectores en los que existe una amenaza real por parte de los  clientes de integración hacia atrás, los clientes ejercen una  gran presión sobre el vendedor. Este es el caso de sectores en  los que el cliente puede fabricar el producto que compra o rea-  lizar determinados servicios por sí mismo. Por ejemplo, en el  sector de transporte, determinados clientes pueden considerar  la opción de adquirir una flota de camiones y transportar sus  propios productos.  • Calidad del producto del comprador.   C uando la calidad del  producto final del comprador depende directamente de la cali-  dad del producto del vendedor, el cliente ejercerá una mayor pre-  sión porque su reputación es la que está en juego puesto que es  él, el que se relaciona con el usuario final. Este es el caso, por  ejemplo, de las grandes superficies que adquieren su marca blan-  ca a otros productores, pero ponen su nombre al producto final. E xisten multitud de ocasiones propicias para que el cliente  ejerza una gran presión sobre el vendedor. En cada sector, por  su especificidad, los efectos del poder de los clientes pueden  ser muy distintos a las de otro sector. Los sectores en los que se  da un gran poder de negociación por parte de los clientes el  beneficio del vendedor se ve mermado, puesto que éste tiene  que ceder a la presión de sus clientes.  Estrategias ok.qxd   21/3/05  17:25  Página 43 \nproveedores,  el  sector  en  el  que  opera  nuestra  sociedad  no es estratégico significa que no tienen excesiva depen-  dencia de las ventas en el mismo y, por lo tanto, su poder  de fijación de precios es mayor.   • Importancia del producto.   Si   el producto del proveedor  es indispensable en la producción de nuestra sociedad, el  poder del proveedor se incrementa, dado que la sociedad  no puede producir en su ausencia.   • Diferenciación del producto.   Si   los proveedores compi-  ten  en  base  a  la  diferenciación  del  producto,  aquellos  proveedores  que  hayan  logrado  un  producto  de  mayor  calidad podrán ejercer más presión en el mercado a la ho-  ra  de vender sus productos.  •  Amenaza  de  los  proveedores  de  integración  hacia  de-  lante . Si la amenaza de integración hacia delante por par-  te de los proveedores es importante, éstos podrán ejercer  una mayor presión en el mercado porque pueden acapa-  r ar cuota de mercado en detrimento de la de sus clientes.  En  el  siguiente  cuadro  presentamos  algunos  ejemplos  de  ocasiones  en  las  que  los  proveedores  ejercen  una  gran  pre-  sión sobre los compradores.   PRODUCTOS SUSTITUTIVOS   D entro  de  un  sector  no  sólo  tiene  relevancia  la  actuación  de  los elementos actuales, sino que la posible sustitución de los  mismos  por  otros  de  características  más  o  menos  parecidas  producidos  en  otros  sectores  puede  cambiar  el  devenir  del  mismo sector en un plazo muy corto de tiempo.  T odas las empresas de un sector compiten con otros sectores  que producen productos y servicios sustitutivos.  Los productos y servicios sustitutivos limitan el beneficio po-  tencial  de  un  sector  al  establecer  un  tope  en  los  precios  que  las  empresas  de  ese  sector  pueden  cargar  provechosamente,  y  cuanto  más  atractiva  sea  la  relación  calidad/precio  de  los  productos  sustitutivos,  más  bajo  será  el  tope  de  la  rentabili-  dad del sector.  I dentificar  productos  sustitutivos  implica  buscar  otros  pro-  ductos o servicios que puedan desempeñar la misma función  que  la  oferta  del  sector.  Para  ello,  es  necesario  estar  atento  a  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 44  EJEMPLOS DE PODER DE NEGOCIACIÓN DE LOS PROVEEDORES  • Grupo de proveedores concentrados.   En  determinados secto-  r es, el grupo de proveedores es reducido o está muy concentra-  do. En estos casos, el proveedor ejerce un gran poder sobre el  comprador basándose en la necesidad del producto que tiene el  comprador. Este es el caso del sector de materiales para la cons-  trucción, los proveedores están muy concentrados y dominan  los precios, la distribución, etc.   • Importancia del producto.   C uando el producto que ofrece el  proveedor es indispensable para el productor, la presión que ejer-  ce el proveedor en los precios de venta es mucho mayor. Es el ca-  so del sector de contenedores; para algunos fabricantes el con-  tendor del producto es indispensable para poder distribuirlo.  •   Amenaza de los proveedores de integración hacia delante.   En  los sectores en los que para el proveedor no resulta excesiva-  mente difícil producir/ofrecer el mismo producto/servicio que  su cliente, la presión ejercida será mayor, puesto que existe la  seria amenaza de poder convertirse en un competidor.  E xisten multitud de ocasiones propicias para que el proveedor  ejerza una gran presión sobre el comprador. En cada sector,  por su especificidad, los efectos del poder de los proveedores  pueden ser muy distintos a las de otro sector. En los sectores en  los que se da un gran poder de negociación por parte de los  proveedores, el beneficio del productor se ve mermado, puesto  que éste tiene que ceder a la presión de sus proveedores.  Estrategias ok.qxd   21/3/05  17:25  Página 44 \nlas tendencias del mercado y prever lo mejor posible los cam-  bios que puedan acontecer.  En  el  siguiente  cuadro  presentamos  algunos  ejemplos  de  productos sustitutivos en determinados sectores.  RIVALIDAD ENTRE COMPETIDORES   La  rivalidad  entre  competidores  actuales  se  detecta  por  la  existencia  de  maniobras  competitivas  para  hacerse  con  una  posición.  Las  empresas  usan  tácticas  como  las  guerras  de  precios,  las  guerras  publicitarias,  los  lanzamientos  de  pro-  ductos o el incremento de servicios y garantías para los con-  sumidores. La rivalidad se da cuando los competidores sien-  ten  la  presión  o  actúan  con  arreglo  a  una  oportunidad  para  mejorar su posición.  La  intensidad  de  la  rivalidad  que  hay  entre  los  diferentes  competidores  condiciona  en  gran  medida  la  salud  de  la  que  goza  un  sector  y  claramente  lo  hace  atractivo  o  no  según  el  caso, es por ello por lo que hay que intentar descubrir los en-  tresijos de la competencia que exista en el sector.  La  rivalidad  entre  los  competidores  es  mayor  cuando  se  dan  las siguientes condiciones:  • Existe un  gran número de competidores   de tamaño  simi-  lar    en  el  mercado.  Cuando  se  trata  de  un  sector  donde  hay  muchas empresas, en este entorno la inestabilidad surge de  la  batalla  entre  empresas  que  poseen  recursos  para  mante-  ner la lucha. Las empresas que compiten en el mercado uti-  lizan hoy fundamentalmente el precio, la calidad del servicio  y la imagen para incrementar su cuota de mercado.  • Los competidores ofrecen un  producto similar  poco dife-  r enciado. Cuando los compradores no aprecian la diferen-  ciación  de  los  productos  del  mercado,  la  competencia  se  hará en base a precio y, por lo tanto, será mayor.  •  La   competencia   en  el  sector  es   desleal    y  existen  grandes  presiones  que  ejercen  los  competidores  para  ganar  cuota  de mercado.  • Las  barreras de salida   existentes condicionan a la perma-  nencia en el sector de empresas que no obtienen la renta-  bilidad esperada.  • Se trata de un sector que atraviesa en el ciclo económico  del producto la  etapa de madurez   caracterizada por un ex-  ceso  de  capacidad  productiva  en  el  mercado,  lo  que  con-  duce a fuertes guerras de precios entre los competidores.  En  el  siguiente  cuadro  presentamos  algunos  ejemplos  de  ri-  v alidad de los competidores en determinados sectores.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   45  EJEMPLOS DE PRODUCTOS SUSTITUTIVOS  •   Productos de características similares.   En los sectores en los  que el producto ofrecido tiene sustitutivos directos a un menor  coste, los beneficios del sector se ven mermados por reduccio-  nes en las ventas. Este es el caso, por ejemplo, del sector del  mueble tradicional; hoy en día existen empresas tipo IKEA que  ofrecen un mueble moderno, de peor calidad, pero de muy bajo  coste, es un nuevo concepto de mueble poco duradero que sus-  tituye al mueble tradicional de toda la vida que tenía una media  de duración de 10-15 años. También es el caso de los coches de  motor eléctrico que podrían sustituir a los coches tradicionales  de gasolina.  •   Competencia de nuevos países.   La nueva oferta de productos de  países del este o asiáticos constituye una amenaza real para los  productos tradicionales de occidente porque se producen a un  menor coste que los tradicionales. Los países emergentes están  poniéndose al día y su oferta supone una gran amenaza para los  sectores tradicionales del continente.  En algunos sectores están surgiendo productos sustitutivos a un  menor coste de adquisición que suponen una verdadera amena-  za para los productos tradicionales.  Estrategias ok.qxd   21/3/05  17:25  Página 45 \nECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 46  U no de los análisis que podemos realizar para medir el grado  de rivalidad  de los competidores es el  Análisis de Grupos Es-  tratégicos .  En  un  determinado  sector,  pueden  existir  muchas  empresas  con  diferentes  intereses  y  que  compiten  sobre  bases  distintas.  N uestro objetivo es diseccionar al máximo el sector para poder  distinguir  el  comportamiento  estratégico  de  cada  una  de  las  empresas que lo componen, con la finalidad de poder agrupar a  las compañías que tengan una conducta parecida.  Un    grupo  estratégico   consiste  en  aquellas  empresas  rivales  que tienen enfoques y posiciones competitivas similares en el  mercado.  El análisis de grupos estratégicos pretende identificar las organi-  zaciones  que  tienen  características  estratégicas  análogas,  que  siguen  estrategias  parecidas  o  compiten  sobre  bases  similares.  El propósito es definir qué características resultan más distinti-  v as en un grupo de organizaciones.  Las  utilidades  de  los  grupos  estratégicos  como  herramienta  analítica son las siguientes:  1. Las agrupaciones estratégicas ayudan a una empresa a identi-  ficar las  barreras de entrada  que protegen a un grupo del ata-  que  de  otros  grupos.  Las  barreras  de  movilidad  son  factores  que impiden a las empresas cambiar de una posición estraté-  gica a otra.  2. Las agrupaciones estratégicas ayudan a una empresa a identi-  ficar grupos cuya  posición competitiva  puede ser  marginal  o  imprecisa. De modo que puede anticiparse que estos compe-  tidores son firmes candidatos a abandonar el sector, o inten-  tar entrar en otro grupo.  3. Las agrupaciones estratégicas ayudan a dibujar en un mapa  el  ru mbo de las estrategias  de las empresas. La representa-  ción apunta, partiendo de cada grupo estratégico, la direc-  ción  en  la  cual  el  grupo  parece  estar  moviéndose.  Si  todos  los grupos estratégicos se mueven en una dirección similar,  esto podría indicar un alto grado de volatilidad y de intensi-  dad en la competencia.  4. Los grupos estratégicos son útiles para pensar en las im-  plicaciones  de  cada   tendencia  del  sector   en  cada  grupo  estratégico.  EJEMPLOS DE RIVALIDAD DE LOS COMPETIDORES  • Crecimiento sectorial lento.   En los sectores maduros, las  guerras de las empresas por captar cuota de mercado son  más frecuentes. El mercado no ofrece una demanda nueva y  los competidores deben luchar entre ellos, puesto que incre-  mentar su cuota de mercado supone reducir directamente la  cuota del competidor. Este es el caso de los sectores indus-  triales tradicionales como el del automóvil, las diferentes fir-  mas se esfuerzan por sacar modelos mejores o más atracti-  vos para acaparar cuotas adicionales de mercado.  •   Capacidad productiva del sector excedentaria.   En los secto-  r es en los que existe un exceso de oferta del producto, la riva-  lidad entre los competidores será mayor, debido al deseo de  todos por colocar sus productos en el mercado. Este es el  caso del sector de la vivienda de segunda mano, inmobilia-  r ias y agentes libres se esfuerzan en colocar sus productos  antes de que sus competidores lo hagan.  •   Barreras de salida.   En los sectores en los que existen  importantes barreras de salida, los competidores menos pro-  ductivos se ven obligados a permanecer en el mercado y, por  lo tanto, la rivalidad entre los competidores es mayor.  En algunos sectores la rivalidad entre los competidores es  muy importante, lo que provoca guerras de precio, práctica  de competencia desleal, etc. Los beneficios de estos sectores  se ven mermados por las grandes luchas existentes por aca-  parar cuota de mercado.  Estrategias ok.qxd   21/3/05  17:25  Página 46 \nLas empresas del mismo grupo estratégico tienen varias simili-  tudes:  • Pueden poseer líneas de   productos comparables .  • Pueden estar  integradas verticalmente  en el mismo grado.  • Pueden ofrecer  servicios   y ayuda técnica  similares   a los com-  pradores.  • Pueden atraer a tipos  similares   de    compradores   con los mis-  mos atributos de productos.  • Pueden hacer énfasis en los mismos  canales de distribución.  • Pueden depender de  tecnología   idéntica.  • Pueden vender en el mismo intervalo de   precios/calidad .  El objetivo de este parte del análisis estratégico es aplicar el aná-  lisis de grupos estratégicos a nuestra sociedad, con el fin de de-  terminar el posicionamiento competitivo de la misma.   Pa ra     r ealizar  el  análisis  de  grupos  estratégicos,  hemos  utilizado  como herramienta analítica la matriz de grupos estratégicos. Se  trata de una herramienta que permite valorar comparativamen-  te la posición de los distintos competidores en base a los facto-  r es clave de éxito.  El estudio de la matriz de grupos estratégicos permitirá el cono-  cimiento de los siguientes aspectos:  • Quiénes son los  competidores   directos de la empresa.  • Por qué relación de factores clave de éxito se decanta el merca-  do. Detección de \" huecos estratégicos \" existentes.  • Otras opciones de  posicionamiento   existentes. • Porcentaje del  mercado   en los distintos cuadrantes establecidos. En la fase de elaboración de la matriz de grupos estratégicos, de-  beremos definir los ejes del   mapa de grupos estratégicos :  • Eje X: calidad de producto y servicio.  • Eje Y: competitividad en precio.  El    grado  de  competitividad  en  precios   para  cada  uno  de  los  competidores debe ser evaluado en función de los aspectos que  r igen la competencia en precios en el sector:  En referencia a la  calidad del producto y servicio  que configu-  r aría  la  otra  dimensión  de  la  matriz,  la  sociedad  debe  interro-  garse acerca de los siguientes aspectos:  En el caso en el que la sociedad tenga unidades estratégicas de  negocio muy dispares entre sí o en las cuales compita con em-  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   47  F ACTORES QUE RIGEN LA COMPETENCIA  • Volumen de negocio  • Estructura de costes  • La existencia de economías de escala que pudieran hacer   más competitiva a la empresa  • Gestión de los procesos  • Gestión de las compras  • La existencia de integraciones verticales  • Cumplimiento de plazos  • Política de calidad/precio  • Agresividad en la política de precios.  F ACTORES QUE MIDEN LA CALIDAD  • Gama de productos/servicios  • Número de marcas  • Imagen de marca  • Esfuerzo de marketing  • Canales de distribución  • Normativas de calidad  • Calidad de los productos  • Servicio posventa  • Cumplimiento en los plazos de entrega  • Reclamaciones del cliente  • Relación sociedad con sus clientes  • Preocupación por conocer y satisfacer al cliente  • Diferenciación del servicio  Estrategias ok.qxd   21/3/05  17:25  Página 47 \npresas  muy  diferentes,  deberemos  realizar  un  análisis  de  gru-  pos estratégicos para cada una de las UEN.  D ebe conseguir diseñar una matriz de grupos estratégicos que  le permita evaluar la posición competitiva de la sociedad en el  sector:  CUESTIONES CLAVE DERIVADAS DEL ANÁLISIS DE LAS CINCO FUER-  ZAS DE PORTER (1987)  S iguiendo a Johnson y Scholes (1984), diremos que el análisis  de las cinco fuerzas es muy útil para comprender los factores  que  intervienen  en  el  entorno  industrial  de  su  organización.  El  análisis  de  dichos  factores  le  permitirá  centrar  el  análisis  estratégico.  ¿En  qué  puntos  debe  centrar  dicho  análisis?  ¿Cuáles  son  las  cuestiones clave que le permitirán desarrollar el Plan Estraté-  gico? Plantearse los siguientes interrogantes le ayudará a en-  focar el análisis:  •  ¿Qué   fuerzas   del  entorno  competitivo  son   clave ?  Estas  fuerzas  pueden  variar  en  función  del  tipo  de  industria.  Pa ra     las  empresas  del  sector  de  la  construcción,  el  poder  de  los  proveedores  es  determinante.  Sin  embargo,  para  las empresas de telefonía móvil la rivalidad entre los com-  petidores es crucial.  • ¿Existen  fuerzas subyacentes   a las fuerzas competitivas?  Po r  ejemplo,  la  fortaleza  competitiva  de  IKEA  (empresa  innovadora del sector del mueble) es una amenaza conti-  nua para el sector del mueble tradicional.  • ¿Es probable que cambien estas fuerzas? ¿En qué senti-  do  podrían  cambiar?  En  ocasiones,  algunos   cambios   le-  gislativos  pueden  cambiar  considerablemente  el  futuro  de un sector. Un caso muy claro es el del sector farmacéu-  tico, en España la apertura de farmacias está fuertemente  r estringida  y  si  la  ley  permitiera  abrir  libremente  farma-  cias  o  vender  medicamentos  con  recetas  en  grandes  su-  perficies, el sector experimentaría grandes cambios.  •  ¿Cómo  se  comportan  los   competidores   frente  a  estas  fuerzas competitivas? ¿Cuáles son los puntos fuertes y dé-  biles en relación a las fuerzas que actúan?  •  ¿Qué  pueden  hacer  los  directivos  para   influir  en  las  fuerzas  competitivas   que  afectan  a  su  negocio?  ¿Se  pue-  den  crear  barreras  de  entrada,  aumentar  el  poder  sobre  los proveedores o sobre los clientes, o encontrar la forma  de reducir la rivalidad entre los competidores?  •  ¿Algunas  industrias  son  más  atractivas  que  otras?  Se  puede  afirmar  que  algunas   industrias    son    intrínseca-  mente  más  rentables   que  otras  porque,  por  ejemplo,  la  entrada  es  más  difícil,  o  los  compradores  y  proveedores  tienen menos poder. La estrategia empresarial puede uti-  lizarse  en  el  análisis  de  la  industria  para  identificar  qué  industrias son más o menos atractivas.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 48  F igura 8: Matriz de Grupos Estratégicos  ENTORNO COMPETITIVO  CALIDAD DE  PRODUCTO   Y SERVICIO  PRECIO Alta  Baja  Bajo  N ota: El tamaño de la esfera es representativo del   volumen de negocio de la empresa  Alto  Sociedad 4  Sociedad 1  Sociedad 3  Sociedad 2  Estrategias ok.qxd   21/3/05  17:25  Página 48 \nECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   49  ANÁLISIS INTERNO (CAPACIDADES ESTRATÉGICAS)  Estrategias ok.qxd   21/3/05  17:25  Página 49 \nOBJETIVOS DEL CAPÍTULO  •  ¿Cuál  es  la  capacidad  estratégica  de  nuestra  organiza-  ción para actuar de forma que alcance el éxito?  •  ¿Cuáles  son  los  recursos  y  las  capacidades  de  las  que  dispone  la  organización  para  establecer  ventajas  compe-  titivas sostenibles?  • ¿Cuál es la categoría de actividades en mi empresa y qué  v alor aporta cada una de ellas al producto/servicio final?  •  ¿Cuáles  de  estas  actividades  son  estratégicas,  clave  o  mejorables?  ÍNDICE DEL CAPÍTULO  I. ANÁLISIS DE LA CADENA DE VALOR.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 50  Estrategias ok.qxd   21/3/05  17:25  Página 50 \nEn el capítulo anterior, hemos destacado la importancia de  analizar  y  comprender  el  entorno  externo  en  el  que  se  de-  senvuelve  una  organización.  Este  entorno  genera  tanto  oportunidades como amenazas para el desarrollo estratégi-  co. Pero el éxito de una estrategia también depende de que  la  organización  tenga  la   capacidad  estratégica   para  actuar  con  la  calidad  necesaria  para  alcanzar  el  éxito.  La  capaci-  dad estratégica de una organización depende de tres facto-  r es principales:  •  Los   r ecursos   disponibles,  tanto  inter nos  como  exter-  nos, que sirven para aplicar su estrategia.  •  La   competencia    con  que  se  realizan  las  actividades  en la organización. Normalmente, aquí está la clave de  por qué la empresa obtiene buenos o malos resultados,  más que en los recursos  per se . El  análisis de la cadena  de  valor   puede  ser  útil  para  entender  y  describir  estas  actividades.  A unque toda organización tiene que alcanzar un umbral  de competencias en todas las actividades que emprende,  sólo  algunas  de  estas  actividades  constituyen  una   com-  petencia nuclear . Estas son las que determinan la capa-  cidad  de  la  organización  de  superar  a  la  competencia  (o  dar  más  por  el  mismo  dinero). También  pueden  consti-  tuir la base para crear nuevas oportunidades.  • Y  el  equilibrio   entre  recursos,  actividades  y  unidades  organizativas dentro de la empresa.  METODOLOGÍA   La  metodología  del  Análisis  de  la  Cadena  de Valor  pro-  puesta por Porter (1987) contempla la empresa como una  sucesión  de  actividades  que  van  añadiendo  valor  al  pro-  ducto  o  servicio  que  la  compañía  va  generando  y  que  fi-  nalmente su cliente (consumidor o empresa) le comprará.  Este método es útil para entender las fortalezas construc-  toras de ventajas competitivas o competencias nucleares.   En  términos  competitivos,  el  valor  es  la  cantidad  que  los  compradores están dispuestos a pagar por lo que una em-  presa les proporciona. El valor se mide por los ingresos to-  tales,  que  reflejan  el  precio  de  los  pedidos  de  productos  de la empresa y de la cantidad que vende. Una empresa es  r entable mientras el valor que recibe excede los costes to-  tales involucrados en la creación de su propio producto o  servicio.   Po r ter (1987) definió dos categorías diferentes de activida-  des.  En  primer  lugar,  las   actividades  primarias   –logística  de  entrada,  producción,  logística  de  salida,  marketing  y  ventas,  y  servicios–  contribuyen  a  la  creación  física  del  producto  o  servicio,  su  venta  y  transferencia  a  los  com-  pradores  y  sus  servicios  posventa.  En  segundo  lugar,  las  actividades  de  apoyo  –compras,  desarrollo  tecnológico,  gestión  de  recursos  humanos  e  infraestructuras  de  la  em-  presa– añaden valor por sí solas o añaden valor a través de  importantes  relaciones  tanto  con  actividades  primarias  como con otras de apoyo.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   51  Análisis de la Cadena de Valor  Estrategias ok.qxd   21/3/05  17:25  Página 51 \nACTIVIDADES PRIMARIAS   S iguiendo a Dess y Lumpkin (1984), entre las actividades pri-  marias  de  una  empresa  destacamos  las  siguientes  (aunque  en  función  de  la  estructura  de  su  organización  algunas  pue-  den ser no aplicables a su empresa):  •    Logística interna . La actividad primaria de logística in-  terna  se  asocia  con  la  recepción,  almacenaje  y  distribu-  ción  de  materias  primas  hacia  el  producto.  Incluye  la  re-  cogida  del  material,  el  almacenaje,  el  control  de  existen-  cias,  la  programación  del  transporte  y  las  devoluciones  a  proveedores.  En  esta  actividad  es  primordial  alcanzar  la  máxima eficiencia, puesto que es donde nacen los princi-  pales retrasos de la producción.   •   Pr oducción .  La  producción  incluye  todas  las  activida-  des  asociadas  con  la  transformación  de  la  materia  prima  en el producto final, incluyendo las operaciones de meca-  nizado,  embalaje,  ensamblaje,  pruebas,  pintura  y  prepa-  r ación de instalaciones.  F abricar respetando el medio ambiente es uno de los me-  dios  que  puede  utilizar  la  empresa  para  conseguir  una  ventaja competitiva. Numerosas empresas han consegui-  do reducir los costes asociados con el depósito de sustan-  cias  peligrosas  o  contaminantes  y  de  otros  desechos  de  sus  operaciones  de  fabricación.  Sus  esfuerzos  medioam-  bientales, además de incrementar sus beneficios, les han  otorgado premios y reconocimientos por sus esfuerzos de  r eciclaje que elevan su reputación corporativa.  •   Logística externa.   Las actividades de logística externa se  asocian  con  la  recogida,  el  almacenaje  y  la  distribución  del  producto  o  servicio  a  los  compradores.  Incluyen  los  productos terminados, el almacenaje, la recogida del ma-  terial, el reparto a través de operaciones de transporte, el  proceso de pedidos y la programación.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 52  Actividades  de apoyo  ACTIVIDADES PRIMARIAS  LOGÍSTICA  ENTRADA Recepción  Almacenamiento  Control de existencias  Distribución interna  OPERACIONES O  PRODUCCIÓN  T ransformación física de  los productos y servicios  LOGÍSTICA  SALIDA  Almacenamiento y  distribución de productos  terminados  MARKETING  Y VENTAS  Actividades para  conseguir vender   los productos  POSVENTA  Mantenimiento de la  utilización del producto  Fi gura 9: La cadena de valor - Fuente: Michael Porter (1987)  INFRAESTRUCTURA DE LA EMPRESA  GESTIÓN DE RECURSOS  HUMANOS  DESARROLLO  TECNOLÓGICO  APROVISIONAMIENTOS  MARGEN MARGEN  Estrategias ok.qxd   21/3/05  17:25  Página 52 \nLos sistemas de intercambio electrónico de datos están sien-  do utilizados para coordinar la logística externa. Mediante es-  tos sistemas, los clientes informan electrónicamente a la em-  presa de los productos que necesitan y del nivel de los inven-  tarios  de  sus  centros  de  distribución.  De  este  modo,  la  em-  presa puede pronosticar la demanda futura y determina qué  productos  requieren  reaprovisionamiento  (basándose  en  los  límites  de  inventarios  previamente  establecidos  con  cada  cliente).  Estos  programas  aportan  beneficios  a  ambas  partes  por  dis-  poner de actividades ejemplares en la cadena de valor. Tanto  el  proveedor  como  sus  clientes  salen  ganando.  Las  grandes  empresas  distribuidoras,  cadenas  de  supermercados,  etc.,  han  obtenido  cuantiosos  beneficios  con  la  implantación  de  dichos programas.  •   Ma r keting y ventas.   Las actividades de marketing y ven-  tas  se  encuentran  asociadas  con  las  compras  de  produc-  tos y servicios por parte de los usuarios finales, así como  con  los  incentivos  utilizados  para  hacerles  comprar.  In-  cluyen  las  actividades  de  publicidad,  promoción,  fuerzas  de  ventas,  referencias,  selección  de  la  cadena,  relaciones  con  la  cadena  y  fijación  de  precios.  En  ocasiones,  tener  un  buen  producto  no  es  suficiente,  es  necesario  conven-  cer  al  entorno  de  la  empresa  (clientes,  distribuidores,  re-  presentantes, etc.) del interés de trabajar con determina-  dos productos y de comercializarlos de forma consistente  con la estrategia de dicho producto.  El marketing es a menudo un elemento clave en la venta-  ja  competitiva,  sin  embargo  esta  actividad  no  debe  con-  ducir  a  técnicas  excesivamente  agresivas  que  pueden  provocar acciones inmorales o ilegales.   • Servicios . Esta actividad primaria incluye todas las acti-  vidades asociadas para elevar o mantener el valor del pro-  ducto,  como  por  ejemplo  la  instalación,  la  reparación,  la  formación,  el  suministro  de  componentes  y  el  ajuste  del  producto.  En  la  mayoría  de  los  casos,  un  buen  servicio  al  cliente resulta crítico para añadir valor. La atención perso-  nalizada  del  cliente  provoca  una  mayor  fidelización  del  mismo y como consecuencia un incremento de las ventas.  El siguiente esquema resume las actividades primarias de  una empresa y sus principales características. No obstan-  te, le recordamos que cada organización en función de su  estructura tendrá unas actividades primarias u otras. Por  lo tanto es necesario que aplique el análisis de la cadena  de valor a su organización, con el fin de determinar cuá-  les son las actividades primarias de la misma.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   53  Estrategias ok.qxd   21/3/05  17:25  Página 53 \nACTIVIDADES DE APOYO   C omo en el caso de las actividades primarias, pasamos a des-  cribir  algunas  de  las  actividades  secundarias  principales  de  una  empresa.  No  obstante,  en  función  de  la  estructura  de  su  organización  deberá  determinar  cuáles  de  las  actividades  se-  cundarias expuestas son aplicables a su empresa.  Las actividades de apoyo en la cadena de valor intervienen en  la competitividad dentro de cualquier industria y pueden estar  divididas  en  cuatro  categorías  genéricas,  como  muestra  el  es-  quema que presentamos al final de este apartado.  •   Ap ro visionamientos .  Aprovisionamiento  se  refiere  a  la  función de comprar el material utilizado en la cadena de  v alor  de  la  empresa.  Los  materiales  comprados  incluyen  las  materias  primas,  los  suministros  y  otros  elementos  consumibles,  así  como  los  activos  como  la  maquinaria,  los  equipos  de  laboratorio,  los  equipos  de  oficina  y  los  edificios.  Las mejoras en los procesos de compra aplicadas en deter-  minadas  empresas  han  logrado  maximizar  su  eficiencia,  r educir coste y, en definitiva, incrementar sus beneficios.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 54  Logística Interna   Producción   Logística Externa   Marketing y Ventas   Servicios  ANÁLISIS INTERNO  • Ubicación de las instalaciones de  recepción para minimizar el tiempo  de transporte  • Excelentes materiales y sistemas  de control de inventario  • Sistemas para reducir el tiempo   de envío de devoluciones de  proveedores  • Disposición del almacén y diseños  para incrementar la eficiencia de las  operaciones con los materiales  entrantes  • Plantas de producción  eficientes  para minimizar costes  • Nivel apropiado de automatización  en la fabricación  • Sistemas de control de calidad en  la producción para reducir costes y  elevar la calidad  • Disposición en planta eficiente   y diseño de flujos de trabajo  • Procesos de carga eficaces para  ofrecer entregas rápidas y minimizar  los deterioros  • Procesos eficientes de almacenaje  de productos terminados  • Transporte de productos en lotes  de gran tamaño para minimizar los  costes  • Equipos que permitan recoger un  mayor número de pedidos  • Fuerza de ventas competente y  altamente motivada  • Métodos innovadores para  promocionar y publicitar  • Selección de los canales de  distribución más apropiados  • Estrategias eficaces de precios  • Identificación de segmentos de  clientes adecuados y de sus  necesidades  • Rápida respuesta a las  necesidades y emergencias de los  clientes  • Capacidad de reemplazar las  piezas que lo requieran  • Calidad del personal de servicio y  formación continua  • Garantía apropiada y políticas de  garantía  • Uso adecuado de procedimientos  para solicitar la opinión de los  clientes y actuar en base a esa  información  • Gestión eficaz del inventario de  piezas y equipos  Fi gura 10: Actividades primarias de la cadena de valor - Fuente: Michael Porter (1987)  ACTIVIDADES PRIMARIAS  Estrategias ok.qxd   21/3/05  17:25  Página 54 \n•    D esarrollo  tecnológico.   Si guiendo  a  M.  Bensaou  y  M.  Earl (1998), podemos afirmar que toda actividad de valor  encierra  en  sí  misma  tecnología.  El  conjunto  de  tecnolo-  gías  empleadas  en  la  mayoría  de  empresas  es  muy  am-  plio, yendo desde tecnologías utilizadas para preparar do-  cumentos  y  transportar  bienes  hasta  las  tecnologías  in-  corporadas en procesos y equipos, o en el propio produc-  to.  El  desarrollo  tecnológico  relacionado  con  el  producto  y  sus  características  respalda  toda  la  cadena  de  valor,  mientras  que  otros  desarrollos  tecnológicos  se  encuen-  tran  asociados  con  algunas  actividades  primarias  y  de  apoyo concretas.  •    G estión  de  recursos  humanos.   La  gestión  de  recursos  humanos  consiste  en  actividades  relacionadas  con  el  re-  clutamiento, la contratación, la formación, el desarrollo y  las retribuciones a todas las categorías del personal. Apo-  ya  tanto  las  actividades  primarias  como  las  de  apoyo  (contratando  al  personal  adecuado)  y  la  cadena  de  valor  en  su  globalidad  (negociando  con  los  sindicatos,  funda-  ciones, asociaciones de productores, etc.).  •    G estión  general  (infraestructura  de  la  empresa) .  La  infraestructura de la empresa consiste en un número de  actividades que incluyen la dirección general, la planifi-  cación,  las  finanzas,  la  contabilidad,  la  legislación,  los  asuntos gubernamentales, la gestión de calidad y los sis-  temas  de  información.  La  infraestructura  (a  diferencia  de  las  otras  actividades  de  apoyo)  generalmente  respal-  da  a  todas  las  actividades  de  la  cadena  de  valor  y  no  a  actividades individuales. Aunque la infraestructura de la  empresa sea considerada en ocasiones como una activi-  dad  poco  concreta,  puede  ser  una  poderosa  fuente  de  ventaja competitiva.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   55  ANÁLISIS INTERNO  • Sistemas de planificación eficaces  • Capacidad de alta dirección para evaluar  el entorno  • Consecución de fondos a bajo coste para  financiar inversiones  • Excelentes relaciones con diversos  grupos de interés  • Capacidad de la Alta Dirección para  inculcar los objetivos estratégicos ACTIVIDADES DE APOYO  Gestión General  • Mecanismos efectivos de reclutamiento,  desarrollo y retención de empleados  • Relaciones de calidad con los sindicatos  • Entorno del trabajo de calidad  • Programas de premios e incentivos para  motivar a todos los empleados  Gestión de Recursos Humanos  • Actividades eficaces de investigación y  desarrollo  • Relación de colaboración entre el  departamento de I+D y otros  • Instalaciones  y equipos dotados de la  técnica más moderna  • Cultura para aumentar la creatividad y la  innovación  • Personal de excelente capacitación  profesional  Desarrollo Tecnológico  • Suministro de materias primas  • Desarrollo de relaciones de colaboración  ganar-ganar con los proveedores  • Procesos eficaces de compra, de  publicidad, etc.  • Análisis y selección de fuentes  alternativas de materiales  Aprovisionamiento  Fi gura 11: Actividades de apoyo de la cadena de valor- Fuente: Michael Porter (1987)  Estrategias ok.qxd   21/3/05  17:25  Página 55 \nCONCLUSIONES   C ada sector tiene unas características peculiares que lo di-  ferencian  de  otros  sectores  productivos.  Por  eso  debere-  mos  diseñar  nuestra  propia  cadena  de  valor  a  partir  del  modelo de Porter (1987).  S egún la empresa para la que analicemos la cadena de va-  lor,  tendrán  más  importancia  unos  procesos  u  otros.  Lo  más  importante  es  determinar  cuáles  son  las  actividades  primarias y las actividades de apoyo, y de entre ellas selec-  cionar aquellas que cumplan los siguientes requisitos:  1.  Sean   estratégicas   para  la  sociedad,  es  decir,  aquellas  que supongan una ventaja competitiva para la sociedad.  2. Sean  clave   para la sociedad porque sin ellas no exis-  tiría  el  negocio.  Que  sean  imprescindibles  no  quiere  decir  que  sean  estratégicas,  se  diferencian  de  las  pri-  meras  en  que  no  confieren  una  ventaja  competitiva  a  la  sociedad  y  una  diferenciación  con  respecto  al  resto  de sus competidores.  3.  Sean   mejorables ,  la  sociedad  debe  conocer  los  pun-  tos débiles de la cadena de valor para hacer una mayor  incidencia en su mejora.  En el cuadro siguiente, presentamos el ejemplo de la cade-  na  de  valor  de  una  empresa,  con  el  fin  de  que  resulte  más  fácil  identificar  los  conceptos  teóricos  de  actividades  es-  tratégicas, actividades clave y actividades mejorables.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 56  EJEMPLO DE LA CADENA DE VALOR  Au tovalia, S.A. es una empresa de productos accesorios de la  industria del automóvil, en su cadena de valor se detallan las  siguientes actividades:   • Actividades estratégicas.   S uponen una ventaja competitiva  para la sociedad las siguientes actividades:  • Gerencia  • Aprovisionamientos  • Logística externa y repuestos  • Servicio Posventa  • Actividades clave.   S in las siguientes actividades, no existiría  el negocio de la sociedad:  • Logística interna  • Comercial y marketing  • Producción  • Actividades de apoyo.   Si rv en para mejorar el proceso pro-  ductivo de la sociedad las siguientes actividades:  • Calidad  • Administración y finanzas  • Actividades a mejorar.   En las siguientes actividades la so-  ciedad debe hacer un esfuerzo por mejorar, dada su impor-  tancia en la estrategia de la empresa:  • Recursos humanos  • I+D  Estrategias ok.qxd   21/3/05  17:25  Página 56 \nECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   57  DIAGNÓSTICO ESTRATÉGICO  Estrategias ok.qxd   21/3/05  17:25  Página 57 \nOBJETIVOS DEL CAPÍTULO  • ¿A qué fortalezas y debilidades inherentes a su negocio  debe hacer frente su empresa?  •  ¿A  qué  oportunidades  y  amenazas  consecuencia  del  entorno  en  el  que  desarrolla  su  actividad  debe  hacer  frente su empresa?  •  ¿Qué  estrategias  debe  adoptar  su  empresa  para  trans-  formar  las  debilidades  en  fortalezas  y  las  amenazas  en  oportunidades?  ÍNDICE DEL CAPÍTULO  I. ANÁLISIS DAFO  II. ANÁLISIS CAME  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 58  Estrategias ok.qxd   21/3/05  17:25  Página 58 \nLa  última  gran  faceta  del  análisis  estratégico  consiste  en  identificar cuáles son los aspectos clave que se derivan de los  análisis anteriores: análisis del entorno y análisis interno. Só-  lo en esta etapa es posible determinar claramente cuáles son  las  principales  fuerzas  y  debilidades  de  una  organización,  y  cuál es su importancia estratégica. El análisis empieza a tener  utilidad como punto de partida para elegir entre posibles ac-  tuaciones futuras.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   59  Análisis DAFO  METODOLOGÍA   El  análisis  DAFO  resume  los  aspectos  clave  de  un  análisis  del entorno de una actividad empresarial (perspectiva ex-  terna)  y  de  la  capacidad  estratégica  de  una  organización  (perspectiva interna).  DAFO  es  la  sigla  usada  para  referirse  a  una  herramienta  analítica que permite trabajar con toda la información re-  lativa al negocio, útil para examinar sus debilidades, ame-  nazas, fortalezas y oportunidades.  El  análisis  DAFO  tiene  múltiples  aplicaciones  y  puede  ser  usado  en  diferentes  unidades  de  análisis,  tales  como  pro-  ducto,  mercado,  producto-mercado,  línea  de  productos,  corporación,  empresa,  división,  unidad  estratégica  de  ne-  gocio entre otras.   El análisis DAFO consta de dos perspectivas:  • La perspectiva  interna : tiene que ver con las fortalezas y  las  debilidades  del  negocio,  aspectos  sobre  los  cuales  los  gestores de la empresa tiene algún grado de control.  • La perspectiva  externa : mira las oportunidades que ofre-  ce el mercado y las amenazas que debe enfrentar el nego-  cio  en  el  mercado  seleccionado.  Se  trata  de  aprovechar  al  máximo  esas  oportunidades  y  anular  o  minimizar  esas  amenazas,  circunstancias  sobre  las  cuales  los  promotores  del proyecto tienen poco o ningún control directo.  Los objetivos que se persiguen con este análisis DAFO son  convertir  las  debilidades  en  fortalezas  y  las  amenazas  en  oportunidades.  El procedimiento para llevar a cabo el análisis DAFO es el  siguiente:  1.  Identificar  los  cambios  clave  en  el  entorno  de  la  or-  ganización,  siguiendo  el  tipo  de  análisis  descrito  en  el  “ análisis del entorno (general y competitivo)”.  2. Analizar el perfil de los recursos y capacidades de su  organización,  siguiendo  el  tipo  de  análisis  descrito  en  el “análisis interno”.  3.  Representar  gráficamente  los  resultados  anteriores  en una matriz de cuatro cuadrantes.  4.  Consensuar  con  el  equipo  de  dirección  los  resulta-  dos del análisis anterior.  A modo de ejemplo, vamos a realizar un análisis DAFO de  una sociedad tipo:  Estrategias ok.qxd   21/3/05  17:25  Página 59 \n• LIMITADA   CAPACIDAD   PRODUCTIVA.   Las instalaciones y la maquinaria existentes en la  actualidad funcionan al límite de su capacidad productiva  • NECESIDAD   DIARIA   DE   CHEQUEOS   DE   LA   PLANIFICACIÓN   DE   LA   PRODUCCIÓN. Necesario para  cubrir las necesidades de los clientes  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 60  PERSPECTIVA INTERNA  PERSPECTIVA EXTERNA • P ELIGRO   EN   LA   BÚSQUEDA   DE   PROVEEDORES   ALTERNATIVOS   POR   PARTE   DE   LOS   CLIENTES.   Si la sociedad no es capaz de satisfacer sus necesidades para mantener el  prestigio en el mercado, los clientes buscarán vías alternativas  • EXISTENCIA   DE   ELEVADAS   BARRERAS   DE   ENTRADA (KNOW-HOW). Introducirse en el mercado  es tecnológicamente difícil. La sociedad ha desarrollado su propia maquinaria y  no existe alternativa en el mercado  • COMPETENCIA   ESCASA   Y   DE   PEOR   CALIDAD.   Los productos de la competencia son de  calidad inferior y además su capacidad productiva es menor  • CLIENTES   POTENCIALES   IMPORTANTES   EN   EL   MERCADO   INTERIOR/EXTERIOR.   La sociedad  mantiene relaciones con clientes potenciales del mercado nacional y europeo  • ORGANIZACIÓN   EMPRESARIAL   ESTRUCTURADA   Y   ORGANIZADA. Controles internos de gestión  y organización funcional  • AMBIENTE   DE   TRABAJO   EXCELENTE. Nunca ha habido problemas con el personal, el  objetivo es que el personal se sienta a gusto. El 100% de la plantilla es fija  • P ERSONAL   CUALIFICADO. Todo el personal administrativo tiene formación  académica  • EXCELENTE   CALIDAD   DEL   PRODUCTO. Atestiguado por la certificación de calidad   ISO 9001:2000  • FUERTE   CAPACIDAD   FINANCIERA   Y   ELEVADA   GENERACIÓN   DE   RECURSOS  DEBILIDADES   FORTALEZAS  AMENAZAS   OPORTUNIDADES  Fi gura 12: Ejemplo análisis DAFO  Estrategias ok.qxd   21/3/05  17:25  Página 60 \nLIMITACIONES DEL ANÁLISIS DAFO  El  análisis  DAFO  es  una  herramienta  de  análisis  estratégico  probada  y  real.  Se  utiliza  regularmente  en  los  negocios  para  evaluar  inicialmente  las  oportunidades  y  amenazas  del  en-  torno, así como las fortalezas y debilidades internas de la em-  presa. Pero el análisis DAFO tiene sus limitaciones. Es un pri-  mer  paso  en  el  inicio  de  una  discusión  estratégica,  el  DAFO  aporta la materia prima necesaria para iniciar un análisis es-  tratégico más profundo.  No     se  debe  hacer  del  análisis  DAFO  un  fin  en  sí  mismo,  al-  canzando  temporalmente  conocimientos  sobre  importantes  cuestiones,  pero  fracasando  a  la  hora  de  conducir  a  la  clase  de acciones necesarias para realizar el cambio estratégico.  S iguiendo a Dess y Lumpkin (2003), las limitaciones del aná-  lisis DAFO son principalmente:  •    Las  fortalezas  pueden  no  conducir  a  una  ventaja .  Las  fortalezas  y  capacidades  de  una  empresa,  da  igual  si  son  únicas  o  importantes,  pueden  no  ser  capaces  de  conse-  guir una ventaja competitiva en un mercado.  Si     una  empresa  basa  su  estrategia  en  una  capacidad  que  no puede crear por sí misma o en una ventaja competiti-  va     que  no  puede  sustentar,  el  uso  de  recursos  supone  prácticamente un derroche.  •  El enfoque del DAFO en el entorno es demasiado estre-  cho .  Las  estrategias  que  se  sustentan  en  las  definiciones  tradicionales de su entorno sectorial y competitivo a me-  nudo  tienen  miras  demasiado  estrechas  sobre  los  clien-  tes,  las  tecnologías  y  los  competidores  actuales.  Por  eso  no  consiguen  percibir  importantes  cambios  en  la  perife-  r ia  de  su  entorno  que  pueden  provocar  la  necesidad  de  r edefinir  las  fronteras  de  su  sector  y  de  identificar  una  nueva serie completa de relaciones competitivas.  •    El  DAFO  aporta  una  visión  instantánea  de  un  objetivo  cambiante.   U na debilidad clave del DAFO es que se trata  de  un  análisis  estático.  Centra  demasiado  la  atención  de  la  empresa  en  un  momento  concreto,  sin  embargo,  la  competencia entre empresas se juega a través del tiempo.  C omo las circunstancias, las capacidades y las estrategias  cambian,  las  técnicas  de  análisis  estático  no  revelan  las  dinámicas del entorno competitivo.  •  El DAFO sobredimensiona una única faceta de la estra-  tegia.   A  veces  las  empresas  se  preocupan  de  una  única  fortaleza  o  característica  clave  del  producto  que  están  ofreciendo e ignoran otros factores necesarios para el éxi-  to competitivo.  El  análisis  DAFO  tiene  mucho  que  ofrecer,  pero  sólo  como  punto de partida. Él solo raramente ayudará a una empresa a  desarrollar ventajas competitivas que puedan ser sostenibles  a lo largo del tiempo.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   61  Análisis CAME  C onocer  los  principales  puntos  fuertes  y  débiles  de  la  socie-  dad,  dentro  del  entorno  general,  mediante  la  matriz  DAFO,  permite avanzar en el primer paso de la estrategia, en el que  se propone el tipo de estrategias dependiendo de estos pun-  tos  fuertes  o  débiles  del  diagnóstico.  Por  lo  tanto,  el  análisis  CAME  pretende   C ORREGIR   nuestras  debilidades,   AFRON-  TAR   nuestras  amenazas,   MANTENER   nuestras  fortalezas  y  EXPLOTAR   nuestras oportunidades.   Estrategias ok.qxd   21/3/05  17:25  Página 61 \nLas  oportunidades y amenazas  (análisis externo) son siempre  aspectos relativos a la evolución del entorno, que condicionan  de alguna forma la viabilidad del negocio y actúan en general  como tendencia, es decir, juegan en cierto modo a futuro. Al-  gunos ejemplos pueden ser los siguientes:  P or  contra,  las   fortalezas  y  debilidades   (análisis  interno)  son  siempre  aspectos  relativos  a  las  propias  capacidades  de  los  promotores,  que  condicionan  de  alguna  forma  el  plantea-  miento  del  proyecto  y  juegan  generalmente  a  presente.    Algunos ejemplos pueden ser los siguientes: Esta  reflexión  debe  ayudar  a  enfocar  la  estrategia  del  nego-  cio  (especialmente  la  reflexión  sobre  la  necesaria  combina-  ción  oportunidad-fortaleza,  o  pueden  establecerse  estrate-  gias  que  tiendan  a  corregir  las  debilidades  o  defenderse  de  las amenazas).  Lo que se pretende con esta matriz no es determinar qué es-  trategia  sería  la  mejor,  sino  sólo  contemplar  y  comparar  las  estrategias viables o, al menos, las más significativas.  Las oportunidades y amenazas (“análisis externo”) son siem-  pre aspectos relativos a la evolución del entorno, que condi-  cionan de alguna forma la viabilidad del negocio y actúan en  general  como  tendencia,  es  decir,  juegan  en  cierto  modo  a  futuro. Algunos ejemplos pueden ser los siguientes cuadros:  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 62  EJEMPLOS DE OPORTUNIDADES/AMENAZAS  • Aspectos legislativos (regulaciones, necesidad de  homologaciones)  • Aspectos socioculturales (hábitos de vida, modas)  • Aspectos demográficos (evolución de la pirámide de  población, aspectos migratorios)  • Aspectos económicos (renta disponible, etc.)  • Aspectos políticos (liberalización del comercio,  barreras arancelarias u otro tipo de proteccionismo  nacional)  • Aspectos tecnológicos (avances técnicos)  • Posibles ventajas de situación, locales (especializa-  ción local o acceso a materias primas, proximidad al  mercado u otra ventaja en costes)  EJEMPLOS DE FORTALEZAS Y DEBILIDADES  • Conocimiento del negocio, de clientes, de proveedores, etc.  • Conocimiento de algún aspecto técnico  • Capacidad comercial  • Capacidades generales de gestión  • Capacidad financiera  DAFO/CAME   PUNTOS FUERTES   PUNTOS DÉBILES  OPORTUNIDADES (O)  II.  ESTRATEGIA  DE  CARTERA  DE  NEGOCIO  (ESTRATEGIA  C ORPORATIVA)  III. ESTRATEGIAS COMPETITIVAS  IV. ESTRATEGIAS FUNCIONALES  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 66  Estrategias ok.qxd   21/3/05  17:25  Página 66 \nE xisten estrategias en los distintos niveles de una organización:  • La  estrategia corporativa   está relacionada con el objeti-  vo  y  alcance  global  de  la  organización  para  satisfacer  las  expectativas  de  los  propietarios  o  principales   stakeholders , y añadir valor a las distintas partes (a menu-  do negocios individuales) de la empresa.  La  definición  de  los  tipos  de  negocios,  la  cobertura  geo-  gráfica,  la  tipología  de  productos  o  servicios  a  ofertar  se  incluyen en el nivel corporativo de la estrategia.  •  La   estrategia  competitiva   se  refiere  a  cómo  competir  con  éxito  en  un  determinado  mercado;  se  trata  de  saber  cómo aventajar a los competidores, qué nuevas oportuni-  dades  pueden  identificarse  o  crearse  en  los  mercados,  qué  productos  o  servicios  deben  desarrollarse  en  cada  mercado, y el grado en que éstos satisfacen las necesida-  des de los consumidores.  •  La   estrategia  operativa   se  ocupa  de  cómo  los  distintos  componentes  de  la  organización,  en  términos  de  recur-  sos,  procesos,  personas  y  sus  habilidades,  hacen  efectiva  la estrategia corporativa y competitiva.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   67  ¿En qué mercados y segmentos  debemos competir?, ¿Con qué  productos?, ¿Cómo alcanzar ventajas  competitivas sostenibles en cada  producto/mercado?, ¿Cuáles son las  competencias clave que demanda la  industria en relación con las  competencias desarrolladas por la  empresa?, ¿Cómo puedo   cubrir los gaps?  Esto implica definir las Unidades  Estratégicas de Negocio (UEN)  ¿Cómo contribuyen las distintas  funciones: marketing, diseño,  investigación y desarrollo, finanzas y  producción a la estrategia? El análisis  de la Cadena de Valor de  Michael E. Porter puede ser útil a  estos propósitos  CORPORATIVA   COMPETITIVA   OPERATIVA  ¿En qué negocios debemos estar? y  ¿cómo vamos a gestionarlo?  F igura 14: Niveles de estrategia  ESTRATEGIA (NIVELES)  Estrategias ok.qxd   21/3/05  17:25  Página 67 \nS iguiendo  a  José  María  Sainz  de Vicuña  (2003)  el  alcance  de  las decisiones estratégicas de cualquier empresa pasa por un  proceso a realizar en cinco fases:  1.    La  definición  del  negocio ,  que  significa  concretar  al  menos  los  siguientes  aspectos:  qué  tipo  de  necesidades  v an  a  ser  satisfechas  (funciones  del  producto  o  servicio);  qué segmentos de consumidores van a ser atendidos por  la  empresa  (segmentos  y  áreas  geográficas);  y  con  qué  tecnologías van a ser realizados los productos o servicios.  T odo ello comparado con nuestros competidores.  2. Una vez hecha la definición del negocio, las  estrategias  de cartera   deben concretar todas las actividades o unida-  des de negocio (UEN) que la empresa quiere abordar.  3. A continuación, se deberá definir la  estrategia compe-  titiva   a seguir dentro de cada negocio, siendo las estrate-  gias genéricas identificadas por Michael Porter de tres ti-  pos:  liderazgo  en  costes,  diferenciación  y  enfoque  o  con-  centración en un segmento o nicho del mercado.  4.  Las   estrategias  de  crecimiento   definen  las  pautas  de  actuación para cuando la empresa se ha marcado objeti-  vos de crecimiento. Concretamente definen si la empresa  debe  crecer  mediante  desarrollo  interno  o  mediante  de-  sarrollo externo (alianzas, fusiones, absorciones, etc.).  5. Las  estrategias operativas   o funcionales deben estable-  cer los planes de acción de cada una de las áreas o depar-  tamentos de la empresa.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 68  De fi nición del Negocio  A  la  hora  de  definir  el  negocio,  el  enfoque  de  marketing  su-  giere que es más eficaz para la empresa definir su campo de  actividad  en  relación  con  la  función,  necesidad  satisfecha  o  beneficios producidos por el producto, que en relación con el  producto  tangible  que  comercializamos  para  satisfacer  esa  necesidad. Es de esta manera como lo percibe el comprador,  tanto  si  se  trata  de  un  consumidor  final  como  de  un  cliente  empresarial.  La  definición  del  negocio  se  debe  sustentar  en  las  tres  di-  mensiones siguientes:  •  El  servicio  o  la  función  base  aportada  por  el  producto  al  cliente ( qué ).  • Las tecnologías existentes, susceptibles de producir la fun-  ción para el cliente ( cómo ).  •  Los  diferentes  grupos  de  compradores  que  forman  parte  del mercado objetivo de nuestra empresa ( a quién ).  El siguiente cuadro muestra un ejemplo de definición de ne-  gocio de una empresa líder europea en cosmética.  Estrategias ok.qxd   21/3/05  17:25  Página 68 \nC omo  decíamos  en  los  apartados  anteriores,  en  un  Plan  Es-  tratégico, las estrategias de cartera deberán incidir en prime-  ra     instancia  sobre  la(s)  actividad(es)  que  deberá  desarrollar  la  empresa,  es  decir,  sobre  la  cartera  de  negocio  de  nuestra  empresa.  Pa ra     la definición de las estrategias de cartera contamos con  diversas  herramientas  de  trabajo,  que  pasamos  a  analizar  a  continuación:  •    La  matriz  de  posición  competitiva  McKinsey-General  Electric   constituye una herramienta de gran utilidad para  el  diagnóstico  de  la  situación  de  una  empresa.  Las  varia-  bles que manejamos para su construcción son dos:  •  El atractivo del mercado   al que nos dirigimos corres-  ponde al eje de ordenadas, en una escala de alto, medio  y  bajo.  • La  posición   en la que nos encontramos  frente a nues-  tros  competidores   corresponde  al  eje  de  abcisas,  en  una escala de débil, media y fuerte.  Pa ra     v alorar  el   atractivo  del  mercado/sector   tendremos
