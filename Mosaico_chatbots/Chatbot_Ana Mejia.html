O  • Factores de mercado:   dimensión del mercado, tasa de creci-  miento global y por empresa, potencial de diferenciación, po-  der de negociación con los clientes, barreras de entrada y de  salida, rentabilidades medias, etc.   • Factores tecnológicos:   intensidad de la inversión, nivel de  cambio tecnológico, acceso a materias primas, etc.   • Factores económicos y financieros:   economías de escala y  experiencia, márgenes de contribución, etc.   • Factores sociales:   tendencias y actitudes sociales, normati-  va  legal, grupos de presión, etc.  F ACTORES QUE MIDEN LA POSICIÓN COMPETITIVA  • Factores de mercado:   dimensión del mercado, tasa de creci-  miento global y por empresa, potencial de diferenciación, po-  der de negociación con los clientes, barreras de entrada y de  salida, rentabilidades medias, etc.  • La  posición en el mercado:   cuota de mercado, gama de pro-  ductos, cumplimiento de las necesidades del cliente y rentabi-  lidades obtenidas.  • La  posición económica y tecnológica:   posición relativa en  costes, capacidad utilizada y posición tecnológica.  • La  posición de capacidades propias:   experiencia y habilida-  des de la empresa, sistemas de distribución utilizados, organi-  zación y gestión interna,y diferenciación de los competidores.  UEN 3  UEN2  UEN 4  Alto Atractivo del Mercado Medio  Bajo  Baja   Media  Posición Competitiva  Fi gura 15: Matriz de posición competitiva - Fuente: McKinsey-General Electric  Alta  UEN 1 MATRIZ DE POSICIÓN COMPETITIVA  Estrategias ok.qxd   21/3/05  17:25  Página 70 \nción introducimos el concepto de UEN que permite resu-  mir tres características:  * Es un solo negocio de la empresa o un conjunto de ne-  gocios relacionados entre sí, sobre el que la empresa pue-  de planificar separadamente del resto de la compañía.  * Tiene sus propios competidores.  *  La  UEN  está  a  cargo  de  un  gerente  responsable  de  su  operativa y de sus resultados económicos y al que la alta  dirección  de  la  organización  le  encarga  objetivos  de  pla-  nificación estratégica y recursos apropiados.  La  matriz  de  crecimiento-participación  pretende  establecer  dos aspectos:  • La posición competitiva de la UEN dentro de la industria.  • El flujo neto de efectivo necesario para operar en la UEN.  La siguiente imagen representa la matriz de crecimiento-par-  ticipación; la matriz se divide en cuatro cuadrantes, la idea es  que cada UEN ubicada en alguno de los cuadrantes tenga una  posición diferente de fondos de flujos, una administración di-  ferente para cada una de ellas y una posición de la empresa en  cuanto a qué tratamiento debe darse a su portafolio.  Las  UEN  se  caracterizan,  según  el  cuadrante  donde  queden  ubicadas, en estrellas, signos de interrogación, vacas y perros.  S us características son las siguientes:  •    M atriz  de  dirección  del  crecimiento  de  Ansoff   es  la  he-  rramienta más conocida para estudiar la dirección estraté-  gica  de  crecimiento  de  una  empresa.  La  matriz  de  creci-  miento de Ansoff responde al binomio producto–mercado  en función de su actualidad y de su novedad, para desem-  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   71  UEN SITUADAS EN EL CUADRANTE  ESTRELLAS  • Alta participación relativa en el  mercado  • Mercado de alto crecimiento  • Consumidoras de grandes cantidades  de efectivo para financiar el crecimiento  • Beneficios significativos  UEN SITUADAS EN EL CUADRANTE  V ACAS  • Alta participación en el mercado  • Mercados de crecimiento lento  • Generan más efectivo del que  necesitan para su crecimiento en el  mercado  • Pueden usarse para crear o  desarrollar otros negocios  • Márgenes de beneficios altos  UEN SITUADAS EN EL CUADRANTE  PERROS  • Baja participación en el mercado  • Mercados de crecimiento lento  • Pueden generar pocos beneficios o a  veces pérdidas  • Generalmente deben ser  reestructuradas o eliminadas  UEN SITUADAS EN EL CUADRANTE  SIGNOS DE INTERROGACIÓN  • Baja participación en el mercado  • Mercados creciendo rápidamente  • Demandan grandes cantidades de  efectivo para financiar el crecimiento  • Generadoras débiles de crecimiento  • La empresa debe evaluar si sigue  invirtiendo en este negocio  LA MATRIZ DE CRECIMIENTO - PARTICIPACIÓN  ESTRELLAS   SIGNOS DE INTERROGACIÓN  V ACAS LECHERAS 1.0  ALTA ALTO % de Crecimiento en el Mercado Participación Relativa en el Mercado  Fi gura 16: Matriz de crecimiento-participación  BAJO BAJA PERROS  Estrategias ok.qxd   21/3/05  17:25  Página 71 \nbocar en una opción estratégica de expansión o de diver-  sificación, según los casos. Los recuadros 1, 2 y 3 del gráfi-  co reflejan opciones de expansión, mientras que el recua-  dro 4 marca la opción de diversificación.  El siguiente esquema representa gráficamente la matriz de  crecimiento de Ansoff:  El  criterio  general  es  que  toda  empresa  debe  agotar  todas  las posibilidades de expansión (penetración, desarrollo de  nuevos productos y desarrollo de nuevos mercados) antes  de abordar una estrategia de diversificación.  Las  características  de  cada  una  de  las  opciones  de  direc-  ción del crecimiento son las siguientes:   (1) Estrategia de penetración.   La estrategia de penetración  de mercado es la más segura de las estrategias formuladas.  P uede ir dirigida a mejorar la atención del cliente (aumen-  tando  la  unidad  de  compra,  reduciendo  la  obsolescencia,  haciendo publicidad de otros usos, facilitándole la compra  o  mediante  incentivos  en  los  precios  para  aumentar  los  usos),  o  atraer  clientes  de  la  competencia  (marcando  las  diferencias con la marcas de la competencia o aumentan-  do los medios de apoyo de las ventas). De su aplicación ob-  tendremos  las  siguientes  ventajas:  la  experiencia  desarro-  llada a lo largo del tiempo en lo que a nuestro producto se  re fiere y al mercado en el que éste se mueve.  (2)  Estrategia  de  desarrollo  de  nuevos  productos .  La  es-  trategia de desarrollo de nuevos productos implica, como  su nombre indica, un cambio que puede formalizarse de  muy diferentes modos. Nos movemos en un mercado que  ya  conocemos,  pero  que  a  su  vez  está  imponiendo  una  adaptación  del  producto  a  los  nuevos  gustos  y  necesida-  des de los usuarios. El cambio puede manifestarse adaptando el producto a otras  ideas u otros diseños, secuencias y componentes, modifican-  do su color, sonido, olor, forma, tamaño, movimiento o sen-  cillamente creando más versiones (modelos y tamaños).  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 72  EJEMPLO DE ESTRATEGIA DE PENETRACIÓN La estrategia de penetración tiene un gran éxito en las empre-  sas fabricantes de productos alimenticios. La empresa valen-  ciana Papas Vicente Vidal, S.A. ha seguido esta estrategia y co-  mo resultado de la misma ha conseguido incrementar de ma-  nera espectacular su cartera de clientes y sus ventas en los úl-  timos 20 años.  Su  estrategia ha sido ofrecer un producto de calidad, buen  precio y promociones continuas, con el fin de introducirse en  todos los mercados objetivos: tiendas tradicionales, pequeños  supermercados y grandes superficies. Su estrategia de pene-  tración ha dado muy buenos resultados en el mercado espa-  ñol y ha iniciado su introducción en el mercado europeo.  MATRIZ DE DIRECCIÓN DEL CRECIMIENTO (ANSOFF)  ACTUALES  NUEVOS  ACTUALES  Penetración de  mercado   1  Desarrollo de nuevos  mercados   3  NUEVOS  Desarrollo de nuevos  productos   2  Diversificación  4  PRODUCTOS  MERCADOS  F igura 17: Matriz de dirección del crecimiento   Estrategias ok.qxd   21/3/05  17:25  Página 72 \n(3)   Estrategia  de  diversificación.   C uando  la  alternativa  elegida  es  de  lanzar  nuevos  productos,  en  mercados  en  los que todavía no estamos presentes, estaremos optando  por una estrategia de diversificación. Cuando la diversifi-  cación es pura o radical, esta estrategia es la que compor-  ta  un  mayor  índice  de  riesgo,  dado  que  partimos  de  una  experiencia producto-mercado nulo. Las posibilidades de  éxito dependerán en muchos casos no sólo de las condi-  ciones del nuevo mercado al que nos vayamos a dirigir (si  presenta características idénticas, similares u opuestas al  que ya conocemos) o del tipo de producto (similar o dife-  r ente),  sino  también  de  las  prácticas  comerciales  que  re-  quiere  y  del  dominio  que  tengamos  de  la  tecnología  em-  pleada en su producción.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   73  Estrategias Competitivas  EJEMPLO DE ESTRATEGIA DE DESARROLLO DE NUEVOS PRODUCTOS  Un   ejemplo evidente de la práctica de la estrategia de desarrollo  de nuevos productos es la aplicada por los grandes almacenes  de El Corte Inglés. La estrategia ha supuesto el desarrollo de  nuevas formas comerciales creando Hipercor, desarrollando los  conceptos de teletienda y la tienda en casa, y desarrollando el  concepto de supermercado de barrio Supercor, el de tiendas de  conveniencia Opencor y las tiendas de moda joven Sfera.   EJEMPLO DE ESTRATEGIA DE DIVERSIFICACIÓN  La estrategia de diversificación puede actuar como un buen  medio alternativo de crecimiento. Las empresas de alimenta-  ción no han permanecido ajenas a este hecho; en los últimos  años han invertido muchos recursos en dar a conocer nuevos  productos con la misma marca. Este es el caso de la empresa  fabricante de pasta alimenticia: Pastas Gallo tiene hoy una ex-  tensa gama de productos en el mercado, salsas, sopas, comi-  da precocinada, etc.   Po r ter (1987) presenta tres estrategias genéricas (liderazgo  en  costes,  diferenciación  y  especialización)  que  una  em-  presa puede utilizar para hacer frente a las cinco fuerzas y  conseguir una ventaja competitiva. Cada una de las estra-  tegias genéricas de Porter (1987) tiene el potencial de per-  mitir  a  una  empresa  superar  los  resultados  de  sus  rivales  dentro del mismo sector.  Tr eacy  y Wiersema  (1999)  presentaron  tres  estrategias  al-  ternativas para que una empresa supere a sus rivales den-  tro del sector.  La primera de las estrategias de Porter (1987) es la estrate-  gia  de   liderazgo  en  costes   que  está  basada  en  la  creación  de  una  posición  de  bajo  coste  en  relación  con  las  empre-  sas  competidoras.  Con  esta  estrategia,  una  empresa  debe  manejar  las  relaciones  a  lo  largo  de  la  cadena  de  valor  y  debe también estar dispuesta a reducir costes en todas las  partes de las mismas.  S in  embargo,  Treacy  y Wiersema  (1999)  van  más  lejos  y  consideran que no es suficiente con ser líder en costes pa-  ra     superar al resto de empresas del sector, lo que la socie-  dad  debe  perseguir  es  la   excelencia  operacional   que  des-  criben de la siguiente forma:  Estrategias ok.qxd   21/3/05  17:25  Página 73 \n“ L as  compañías  operativamente  excelentes  ofrecen  una  combinación de calidad, precio y facilidades de compra de  sus  productos  que  ninguna  otra  compañía  de  ese  mercado  puede ofrecer. No son innovadoras en cuanto a sus produc-  tos  y  servicios  ni  tampoco  mantienen  una  relación  de  per-  sona a persona con sus clientes. Funcionan muy bien y ga-  r antizan  a  sus  clientes  precios  bajos  y  un  servicio  rápido  y  efectivo ”.  P or  otro  lado,  Porter  (1987)  presenta  la   estrategia  de  dife-  r enciación   como  segunda  alternativa,  la  elección  de  esta  estrategia requiere que la empresa (o UEN) cree productos  y/o  servicios  únicos,  y  que  estén  valorados  como  diferen-  tes  por  el  mercado.  El  éxito  reside  en  los  atributos  que  no  son el precio y por lo que el consumidor estará dispuesto a  pagar un sobreprecio.  S in embargo, la teoría de Treacy y Wiersema (1999) va más  allá en la estrategia de diferenciación, no basta con ser di-  ferente,  lo  que  la  sociedad  debe  conseguir  es  el   liderazgo  de producto , que describen de la siguiente forma:  “ U na compañía que desea conseguir el liderazgo de produc-  to continuamente sitúa sus productos en la esfera de lo des-  conocido, lo no probado y muy deseable. Sus practicantes se  concentran  en  ofrecer  a  sus  clientes  productos  o  servicios  que superan los resultados de los productos o servicios exis-  tentes. Lo que un líder de producto ofrece a sus clientes es el  mejor producto ”.  F inalmente  la  tercera  estrategia  definida  por  Porter  (1987)  es  la   especialización .  En  este  caso,  la  sociedad  debe  con-  centrar  sus  esfuerzos  en  gamas  de  productos,  grupos  de  compradores o mercados geográficos objetivos más limita-  dos. La especialización está basada en un estrecho ámbito  competitivo  dentro  de  un  sector.  Una  empresa  que  sigue  una  estrategia  de  especialización  selecciona  un  segmento  o grupo de empresas y diseña su estrategia para servirlos a  medida. El especialista consigue ventajas competitivas de-  dicándose  exclusivamente  a  estos  segmentos.  La  esencia  de la especialización es la explotación de un nicho particu-  lar del mercado que es diferente al resto del sector.  U na vez más, la teoría de Treacy y Wiersema (1999) va más  allá, no se trata únicamente de ser un especialista para do-  minar el mercado, la ventaja competitiva la otorga la estra-  tegia  del   conocimiento  íntimo  del  consumidor ,  que  des-  criben de la siguiente forma:  “ Un a  compañía  que  aporta  valor  a  través  de  las  relaciones  íntimas  con  los  consumidores  tiene  una  relación  con  sus  clientes  parecida  a  la  que  existe  entre  buenos  vecinos.   Las  compañías  que  mantienen  este  tipo  de  relaciones  con  sus  clientes  no  ofrecen  lo  que  el  mercado  quiere, sino  lo  que  un  determinado  cliente  en  particular  quiere. Este  tipo  de  com-  pañía funciona bien si conoce a la gente a la que vende y los  productos  y  servicios  que  necesitan.   Continuamente  está  cambiando los productos y servicios, y lo hace a precio razo-  nable. El  principal  activo  de  las  compañías  que  mantienen  estas relaciones estrechas es la lealtad a sus clientes ”.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 74  Estrategias ok.qxd   21/3/05  17:25  Página 74 \nAlgunas de las compañías más exitosas de nuestro tiempo  operan en sectores de bajo crecimiento y de una modera-  da rentabilidad, aplicando estrategias no particularmente  originales.  La  razón  de  su  extraordinario  éxito  es  la  aten-  ción que prestan a los detalles asociados con la implanta-  ción  estratégica.  Por  ejemplo  una  de  las  razones  de  que  Mc     Donald ́s  continúe  creciendo  y  siendo  rentable  en  un  momento en el que otras cadenas de comida rápida están  en declive es que ofrece un servicio rápido y fiable, come-  dores  y  áreas  de  servicio  limpias  y  empleados  atentos  y  amables.  El patrón colectivo de las decisiones y acciones adoptadas  hoy por los empleados responsables de las actividades ge-  neradoras  de  valor  crea  estrategias  funcionales  que  sirven  de guía al crecimiento y a las estrategias competitivas de la  empresa.  Las  responsabilidades  y  patrones  de  decisión  articula-  dos por las distintas funciones de la empresa son los si-  guientes: •   E strategia de marketing.  La función del área de marketing es ampliar el entorno  en  el  que  se  conoce  la  organización,  así  como  actuar  con  grupos  de  interés  externos  como  clientes  y  com-  petidores. El área de marketing es la encargada de ob-  tener  información  esencial  sobre  las  necesidades  de  los  nuevos  clientes,  las  demandas  previstas,  las  accio-  nes de los competidores y las nuevas oportunidades. •   E strategia operativa.  La  función  del  área  de  operaciones  es  crear  los  pro-  ductos y servicios con los que la empresa pueda con-  tar  para  competir  en  el  mercado.  Una  unidad  de  operaciones  eficaz  es  aquella  que  se  ajusta  a  las  ne-  cesidades  de  la  empresa,  que  concentra  sus  esfuer-  z os  en  adaptar  su  capacidad  y  sus  políticas  con  las  ventajas competitivas que persigue la sociedad. •   E strategia de investigación y desarrollo.  En  numerosas  organizaciones,  los  esfuerzos  en  I+D  son  esenciales  para  una  implantación  efectiva  de  la  estrategia.  La  estrategia  que  nace  de  las  decisiones  y  acciones de las actividades de I+D, ingeniería y sopor-  te técnico se denominan estrategias de investigación y  desarrollo.  •   E strategia de sistemas de información.  El objetivo de esta estrategia es proporcionar a la orga-  nización la tecnología y los sistemas mínimos necesa-  r ios para operar, planificar y controlar su actividad. En  algunos  casos,  unos  sistemas  de  información  integra-  dos  muy  bien  diseñados  sirven  de  base  para  una  ven-  taja competitiva, al permitir una gestión de costes más  agresiva que la de sus competidores, un uso más efec-  tivo de la información pertinente del mercado o la in-  tegración de las operaciones en la cadena de suminis-  tro de clientes y proveedores.  •   E strategia de recursos humanos.  La función del área de recursos humanos es actuar de  nexo de unión entre la dirección organizativa y los em-  pleados, y entre la organización y los grupos de interés  externo,  incluidos  los  sindicatos,  organismos  regula-  dores del Gobierno en materia laboral y de seguridad.  •   E strategia financiera.  El  principal  propósito  de  la  estrategia  financiera  es  proporcionar a la organización la estructura de capital  y  fondos  adecuados  para  implantar  las  estrategias  de  crecimiento y competitivas.  En  la  siguiente  página  presentamos  un  esquema  resumen  de las diferentes estrategias funcionales:   ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   75  Estrategias Funcionales  Estrategias ok.qxd   21/3/05  17:25  Página 75 \nECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 76  ESTRATEGIA OPERATIVA  La estrategia operativa pretende establecer los procesos clave en los que debe  concentrarse la organización para dar respuesta a la estrategia competitiva y a la  articulación de todos los procesos clave en una arquitectura organizativa adecuada  • Crecimiento rentable y sostenido  • Estructura de costes ajustada  • Generación de excedentes de  tesorería  • Estructura de capital y fondos  adecuada para implantar  estrategias de crecimiento y  competitivas  • Nexo de unión entre la dirección  organizativa y los empleados  • Nexo de unión entre la dirección  organizativa y los grupos de interés  externos  • Consolidar una plantilla estable y  formada  • Proporcionar  a la organización la  tecnología y los sistemas necesarios para  operar, planificar y controlar su actividad  • Potenciar ventajas competitivas como  resultado de un uso más efectivo de la  información  • Potenciar la imagen de la sociedad  en el exterior e interactuar con los  clientes, competidores, etc.  • Obtener información sobre las  necesidades de los clientes, las  demandas previstas, las acciones de  los competidores y las nuevas  oportunidades  • Crear los productos y servicios con  los que la empresa pueda competir  en el mercado  • Ser eficaz adaptando la capacidad  de la sociedad con sus políticas y  ventajas competitivas  • Potenciar las actividades de I+D en  ingeniería, soporte técnico, procesos, etc.,  para mejorar la eficacia de la sociedad y  su posición competitiva  • Contribuir a la implantación de la  estrategia  FINANCIERA  RECURSOS HUMANOS   SISTEMAS DE INFORMACIÓN  MARKETING   PROCESOS  I+D  Estrategias ok.qxd   21/3/05  17:25  Página 76 \nECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   77  IMPLANTACIÓN DE LA ESTRATEGIA  Estrategias ok.qxd   21/3/05  17:25  Página 77 \nOBJETIVOS DEL CAPÍTULO  • ¿Cuál es la estructura organizativa más adecuada para mi  organización?  •  ¿Cómo  traduce  mi  organización  su  estrategia  en  accio-  nes concretas?  • ¿Cómo debo estructurar el plan de acción de mi empre-  sa para que se ejecute con éxito?  ÍNDICE DEL CAPÍTULO  I. DISEÑO ORGANIZATIVO  II. PLANES DE ACCIÓN  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 78  Estrategias ok.qxd   21/3/05  17:25  Página 78 \nT oda empresa cuenta de forma implícita o explicita con cier-  to  juego  de  jerarquías  y  atribuciones  asignadas  a  los  miem-  bros o componentes de la misma. En consecuencia, se puede  establecer  que  la  estructura  organizativa  de  una  empresa  es  el    esquema  de  jerarquización   y    división  de  las  funciones  componentes  de  ella.  Jerarquizar  es  establecer  líneas  de  au-  toridad (de arriba hacia abajo) a través de los diversos niveles  y delimitar la responsabilidad de cada empleado ante un su-  pervisor inmediato. Esto permite ubicar a las unidades admi-  nistrativas  en  relación  con  las  que  le  son  subordinadas  en  el  proceso de la autoridad. El valor de una jerarquía bien defini-  da  consiste  en  que  reduce  la  confusión  respecto  a  quien  da  las  órdenes  y  quien  las  obedece.  Define  cómo  se  dividen,  agrupan y coordinan formalmente las tareas en los puestos.  T oda  organización  cuenta  con  una  estructura,  la  cual  puede  ser  formal  o  informal.  La  formal  es  la  estructura  explícita  y  oficialmente  reconocida  por  la  empresa.  La  estructura  infor-  mal es la resultante de la filosofía de la conducción y el poder  r elativo de los individuos que componen la organización, no  en  función  de  su  ubicación  en  la  estructura  formal,  sino  en  función de la influencia sobre otros miembros.  DISEÑO DE UNA ESTRUCTURA ORGANIZACIONAL  Los elementos claves para el diseño de una estructura organi-  zacional son los siguientes:  •    E specialización  del  trabajo  o  división  de  la  mano  de  obra , basada en el hecho de que, en lugar de que un indi-  viduo realice todo el trabajo, este se divide en una serie de  etapas y cada individuo termina una de las etapas.  •   D epartamentalización :  como  paso  previo  a  la  división  de los puestos por medio de la especialización del traba-  jo,  se  necesita  agruparlos  para  que  se  puedan  coordinar  las tareas comunes. La departamentalización es el proce-  so que consiste en  agrupar tareas o funciones   en conjun-  tos  especializados  en  el  cumplimiento  de  cierto  tipo  de  actividades.  Generalmente  adopta  la  forma  de  gerencias,  departamentos, secciones y áreas.  •    C adena  de  mando .  Es  una  línea  continua  de  autoridad  que  se  extiende  desde  la  cima  de  la  organización  hasta  el  escalón más bajo y define quién reporta a quién. Respon-  de  a  una  organización  jerárquica  y  muy  organizada  que  r esuelve dilemas de los empleados del tipo: ¿a quién acu-  do  si  tengo  un  problema? Y,  ¿ante  quién  soy  responsable?  En  la  cadena  de  mando  tenemos  presente  dos  importan-  tes  conceptos:   autoridad  y  unidad  de  mando .  La  autori-  dad se refiere al derecho inherente de una posición admi-  nistrativa para dar órdenes y esperar que se cumplan, y la  unidad de mando ayuda a preservar el concepto de una lí-  nea ininterrumpida de autoridad; si se rompe la unidad de  mando,  un  subordinado  podría  tener  que  atender  a  de-  mandas o prioridades conflictivas de varios superiores.  •  Extensión del tramo de control . Determina en gran par-  te  el  número  de  niveles  y  administradores  que  tiene  una  organización.  •  C entralización y descentralización . La centralización se  r efiere al grado hasta el cual la toma de decisiones se con-  centra en un solo punto de la organización, la descentra-  lización se da cuando hay aportes de personal de nivel in-  ferior  o  se  le  da  realmente  la  oportunidad  de  ejercer  su  discrecionalidad en la toma de decisiones, en una organi-  zación  descentralizada  se  pueden  tomar  acciones  con  mayor  rapidez  para  resolver  problemas,  más  personas  contribuyen con información.  •   Fo r malización.   Se   r efiere al grado en que están estanda-  r izados los puestos dentro de la organización. Si un pues-  to está muy formalizado, entonces su ocupante tiene una  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   79  Diseño Organizativo  Estrategias ok.qxd   21/3/05  17:25  Página 79 \nmínima posibilidad de ejercer su opinión sobre lo que se  debe hacer, cuándo se debe hacer y cómo se debe hacer.  C uando la formalización es baja, el comportamiento en el  puesto  no  está  programado  relativamente  y  los  emplea-  dos  tienen  mucha  libertad  para  ejercer  su  discrecionali-  dad en su trabajo.  Los  siguientes  principios  o  elementos  pueden  ser  tomados  en  consideración para el diseño de una estructura organizacional: •  To   da organización deberá establecerse con un objetivo  previamente  definido  y  entendido ,  incluyendo  las  divi-  siones o funciones que sean básicas al mismo tiempo: pa-  ra   que una organización sea eficaz, requiere que sus obje-  tivos  sean  claros  y  la  consecución  de  los  mismos  esté  apoyada  por  un  plan  de  organización  que  mantenga  las  políticas para llevar a cabo la acción.  •   La responsabilidad siempre deberá ir acompañada por  la  autoridad  correspondiente :  la  autoridad  no  se  puede  concebir separada de las responsabilidades, es decir, ésta  debe  ser  comprendida  por  la  persona  que  la  ejerza  y  por  los demás miembros de la organización.  •   La  delegación  de  la  autoridad  deberá  ser  descendente  para  su  actuación :  de  acuerdo  con  el  sistema  de  organi-  zación  que  se  establezca,  la  autoridad  debe  darse  de  un  nivel superior a otro inferior, la falta de una apropiada de-  lineación de autoridad produce demora, mala comunica-  ción, falta de control administrativo y, sobre todo, fuga de  r esponsabilidad.  •   La división del trabajo adecuado evitará duplicidad de  funciones:   una  lista  de  todas  las  funciones  que  se  de-  sarrollan  en  la  empresa  sirve  de  guía  para  asignarlas  a  áreas  o  divisiones  específicas,  estableciendo  y  determi-  nando  como  entidades  separadas  el  menor  número  de  funciones en que pueda ser dividido el trabajo.  •   C ada  empleado  debe  ser  responsable  ante  una  sola  persona : si no se respeta el principio básico de la \"unidad  de mando\", es imposible establecer responsabilidades. Es  necesario  diferenciar  ante  quién  se  es  responsable  y  las  cosas por las que se es responsable.  •   D ebe  estructurarse  una  organización  lo  más  sencilla  posible:   cada estructura deberá ser analizada con el obje-  to de asegurarse que esta resulte práctica, desde el punto  de vista de costos, si la misma implica costos elevados, la  organización tendrá que ser modificada.  TIPOS DE ESTRUCTURAS ORGANIZATIVAS, VENTAJAS Y DESVENTAJAS  El  siguiente  esquema  sintetiza  los  tipos  de  estructura  que  puede adoptar la organización en su proceso de crecimiento.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 80  PARA   IMPLANTAR   ESTRATEGIAS   CON   ÉXITO, LAS   EMPRESAS   DEBEN   TENER   ESTRUCTURAS   ORGANIZATIVAS  APROPIADAS Patrones de crecimiento habituales:  FASE 1 - ESTRUCTURA SIMPLE  • Estrategia: Base de ingresos baja; alcance del producto mercado simple  FASE 2 - ESTRUCTURA FUNCIONAL  • Estrategia: Incremento de los ingresos; dedicada a la integración vertical  FASE 3 - ESTRUCTURA DIVISIONAL  • Estrategia: Expansión en nuevos productos - mercados relacionados  y/o áreas geográficas  FASE 4 - ESTRUCTURA DIVISIÓN INTERNACIONAL, POR ÁREAS GEOGRÁFICAS,   POR PRODUCTOS, MATRICIAL  • Estrategia: Expansión en mercados internacionales  DISEÑO ORGANIZATIVO  Fi gura 19: Diseño organizativo  Estrategias ok.qxd   21/3/05  17:25  Página 80 \n•   E structura simple  La estructura simple es la más antigua y la más común de  las  formas  organizativas.  La  mayoría  de  organizaciones  son muy pequeñas y tienen una sola línea de productos o  una  línea  de  productos  muy  estrecha  en  la  cual  el  direc-  tor-propietario toma casi todas las decisiones.   La estructura simple es altamente informal y la coordina-  ción  de  las  tareas  se  realiza  a  través  de  la  supervisión  di-  r ecta.  La  toma  de  decisiones  se  encuentra  muy  centrali-  zada,  existe  poca  especialización  de  las  tareas,  pocas  re-  glas  y  regulaciones,  y  un  sistema  de  evaluación  y  recom-  pensa informal.  U na  empresa  pequeña  con  una  estructura  simple  a  me-  nudo  puede  favorecer  la  creatividad  y  el  individualismo,  puesto  que  existen  generalmente  pocas  reglas  y  regula-  ciones. Sin embargo, tal informalidad puede generar pro-  blemas.  Los  empleados  pueden  no  comprender  bien  sus  r esponsabilidades,  lo  que  puede  conducir  a  conflictos  y  confusiones. Los empleados pueden sacar provecho de la  ausencia de regulaciones y actuar en su propio beneficio.  T ales acciones pueden disminuir la motivación y la satis-  facción,  así  como  conducir  a  posibles  malos  usos  de  los  r ecursos  organizativos.  Además,  las  organizaciones  pe-  queñas  tienen  estructuras  planas  (es  decir,  pocos  niveles  verticales y jerárquicos) que limitan las oportunidades de  movilidad. Sin potencial para futuros avances, el recluta-  miento  y  la  retención  del  talento  pueden  convertirse  en  algo complicado.  •  E structura funcional  La estructura funcional se organiza en torno a los  inputs   o  actividades  requeridas  para  elaborar  productos  o  servi-  cios,  como  el  marketing,  operaciones,  finanzas,  I+D,  etc.  C entralizada y altamente especializada, esta estructura es  la más adecuada cuando se ofrece una línea de productos  limitada  en  un  segmento  de  mercado  determinado,  y  las  necesidades  de  los   stakeholders   externos  son  relativa-  mente  estables.  La  estructura  funcional  está  orientada  hacia  la  eficacia  interna  y  potencia  la  pericia  funcional.  R esulta especialmente apropiada para las organizaciones  que  quieren  explotar  economías  de  escala  y  efectos  de  aprendizaje a partir de actividades focalizadas.  Las  empresas  incipientes  utilizan  a  menudo  estructuras  funcionales  de  forma  muy  eficaz.  Este  tipo  de  estructura  también  puede  dar  buenos  resultados  en  empresas  que  persigan  una  estrategia  de  penetración  de  mercado,  por-  que prevé el alcance de la organización.  •   E structura divisional  La estructura divisional organiza las actividades según los   outputs   del  sistema  organizativo,  como  los  productos,  clientes o regiones geográficas.  C uando  una  empresa  aplica  una  estrategia  de  desarrollo  de productos, amplía la oferta de su línea e interactúa con  más  clientes,  distribuidores  y  proveedores.  Si  el  creci-  miento y la continuidad provocan confusión e ineficacias  administrativas,  la  empresa  debería  pasar  de  una  estruc-  tura  funcional  a  forma  divisional  o  grupo  de  productos.  Los  grupos  más  descentralizados  pueden  manejar  un  al-  cance  de  actividades  más  amplias  y  ser  más  receptivos  a  las diversas necesidades de los clientes.  Las  empresas  que  persiguen  estrategias  de  crecimiento  de desarrollo de mercado también añaden complejidades  que tal vez exijan una nueva estructura. Una empresa que  expande  sus  actividades  desde  una  base  de  mercado  re-  gional  a  una  base  nacional  puede  constituir  nuevas  uni-  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   81  Estrategias ok.qxd   21/3/05  17:25  Página 81 \ndades para los distintos segmentos de mercado geográfi-  cos. De este modo, pueden asignarse responsables regio-  nales  o  para  cada  unidad  divisional.  Asimismo,  una  em-  presa  que  busca  nuevos  grupos  de  consumidores  y  nue-  v as  aplicaciones  de  productos  puede  reorganizarse  en  grupos de clientes.  •   E structura matricial  Se     trata de una estructura que combina elementos de las  formas funcional y de producto/mercado. Este tipo de es-  tructuras  son  consideradas  por  algunos  como  el  paso  de  transición entre la forma funcional y la estructura de gru-  pos producto/mercado.  Las estructuras de matriz del proyecto son muy comunes  en  los  entornos  competitivos  turbulentos  e  inciertos,  en  los que la coordinación entre los diferentes departamen-  tos funcionales es de vital importancia, y las exigencias de  los    stakeholders   externos  son  diversas  y  cambiantes.  Las  estructuras  matriciales  pueden  mejorar  la  comunicación  entre  grupos,  aumentar  la  cantidad  de  información  que  la  organización  puede  manejar  y  emplear  de  forma  más  flexible al personal y al equipamiento.  En  una  estructura  matricial,  la  organización  es  funcional  y,       al  mismo  tiempo,  está  orientada  hacia  un  producto,  mercado o proyecto.  Las  estructuras  matriciales  pueden  provocar  confusión  en los empleados por tener demasiados jefes. Equilibrar  las  necesidades  de  las  diferentes  líneas  de  autoridad  y  coordinar tantos empleados y programas a la vez resulta  complicado.  Además,  el  gran  número  de  personas  que  participan  en  la  toma  de  decisiones  puede  retrasar  el  trabajo  y  aumentar  los  gastos  administrativos.  La  com-  plejidad  de  la  estructura  a  menudo  crea  ambigüedad  y  genera  conflictos  entre  los  directivos  funcionales  y  de  producto.  En  general,  las  organizaciones  de  múltiples  actividades  emplean cuatro tipos de estructuras: multidivisional, uni-  dad  de  negocio  estratégica  (UEN),  matriz  corporativa  y  transnacional. El siguiente cuadro muestra las caracterís-  ticas de cada una de ellas:  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 82  ESTRUCTURAS   NÚMERO DE ACTIVIDADES   RELACIÓN   NECESIDAD DE COORDINACIÓN   SINERGIA ESPERADA  Multidivisional   Pocas   Moderada/baja   Moderada/baja   Financiera Operativa limitada  UEN   Muchas   Grupos de actividades  relacionados  Moderada dentro de la UEN.  Baja entre las UEN  Operativa limitada dentro   de la UEN.  Financiera entre las UEN  Matriz corporativa   Pocas o muchas   Alta   Muy alta   Altas sinergias operativas  Tr ansnacional   Muchas en diferentes países   Alta   Muy alta   Altas sinergias operativas  Estrategias ok.qxd   21/3/05  17:25  Página 82 \nEl  análisis  y  la  elección  estratégica  tienen  poco  valor  para  la  organización, salvo que se puedan implantar las estrategias. El  cambio estratégico no se produce únicamente porque se crea  que  resulta  conveniente;  se  produce  si  se  puede  aplicar,  y  si  los miembros de la organización pueden llevarlo a la práctica.  En efecto, la estrategia debe traducirse en acciones concretas  para  ser  una  estrategia  efectiva.  Además,  es  importante  asig-  nar  un  responsable  que  supervise  y  ejecute  los  planes  de  ac-  ción marcados en los plazos previstos, así como asignar los re-  cursos humanos, materiales y financieros requeridos, evaluar  los  costes  previstos  y,  de  una  manera  especial,  jerarquizar  la  atención y dedicación que se debe prestar a dichos planes en  función de su urgencia e importancia.  Es probable que las decisiones estratégicas den lugar a impor-  tantes cambios. Por tanto, resulta esencial analizar qué tipo de  cambio  y  cómo  se  puede  controlar,  así  como  la  arquitectura  estratégica que hay que crear para garantizar el éxito. El análi-  sis de la arquitectura incluye toda una gama de cuestiones re-  presentadas en el siguiente esquema:  ARQUITECTURA DE LOS PLANES DE ACCIÓN  Los planes de acción deben cumplir una serie de requisi-  tos para acometer el logro de los objetivos estratégicos. El  primer  paso  en  la  elaboración  de  un  plan  de  acción  es  la   identificación  de  proyectos, acciones  e  iniciativas  a  aco-  meter . En esta fase debe designarse a los  r esponsables  de  cada objetivo estratégico, con el fin de que éstos propon-  gan  una  serie  de   acciones  y  proyectos   r elacionados  con  la  obtención  de  las  metas  fijadas  para  el  cumplimiento  del  mismo.  El  equipo  de  trabajo  debe  recopilar  toda  esta  información  y  realizar  un  primer  trabajo  de  agrupación  de  diferentes  iniciativas  en  proyectos  corporativos.  Al  fi-  nal de este trabajo quedará una lista de proyectos estraté-  gicos  que  la  compañía  quiere  acometer  en  los  próximos  años, todos ellos vinculados. Con el objetivo de concretar  más  los  planes  de  acción  determinados  y  que  su  conse-  cución  no  se  convierta  en  una  ardua  tarea  a  emprender  en  un  horizonte  temporal  excesivamente  amplio,  los  res-  ponsables  de  cada  objetivo  pueden  marcar   hitos  inter-  mediarios   que harán del plan de acción una realidad más  cotidiana.  La segunda fase, una vez identificadas las acciones a aco-  meter  para  conseguir  el  logro  de  los  objetivos  estratégi-  cos, es el establecimiento de fechas de consecución. Para  ello,  los  responsables  del  proyecto  deben  emprender  un  ejercicio de  priorización de proyectos.  Algunas  herramientas  pueden  ayudar  a  decidir  qué  pro-  y ectos son los más relevantes y prioritarios. Este es el ca-  so de la   matriz de priorización de los planes de acción:  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   83  Planes de Acción  PLANES DE ACCIÓN  Concepto  Relación de las acciones a acometer para el logro de los objetivos estratégicos con identificación clara de:  • Responsables  • Hitos intermedios • Acciones a acometer  • Fechas • Metas y fracasos  • Control, evolución y seguimiento  F igura 20: Planes de acción  Estrategias ok.qxd   21/3/05  17:25  Página 83 \nC ada una de las acciones que la organización se ha propues-  to  acometer  debe  situarse  en  esta  matriz  de  priorización  de  los planes de acción. El comité de dirección realizará el segui-  miento de las acciones de alta importancia (en algunos casos,  para ponerlas en marcha de inmediato y controlar su cumpli-  miento, y, en otros, para analizar el posible aumento de su ur-  gencia), mientras que los niveles operativos de la empresa se  encargarán  de  las  acciones  urgentes  de  menor  importancia,  que son menos prioritarias. Ot ra     herramienta  que  podemos  utilizar  para  acordar  la  priori-  dad adecuada a cada proyecto es la  matriz impacto y esfuerzo .  U na vez analizados qué proyectos son más estratégicos, es nece-  sario valorar el nivel de esfuerzo que supone su implantación. Al  va lorar  el  nivel  de  esfuerzo  frente  a  la  prioridad  estratégica  del  proyecto, se decide qué proyectos son prioritarios y cuáles no. Gu ía  de  actuación:  Deben  priorizarse  y  realizarse  con  antela-  ción los proyectos situados en los cuadrantes 1 y 2.  La  tercera  fase  consiste  en  hacer  una  definición  detallada  de  las acciones a adoptar. En una plantilla similar a la que propo-  nemos  a  continuación,  deberemos  recoger  todos  los  aspectos  mencionados referentes a las mismas.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 84  URGENCIA  BAJA  BAJA   ALTA  “No pasa nada” si no se ponen en marcha  T rasladar su realización a niveles operativos de la empresa  IMPORTANCIA  ALTA   VIGILANCIA ESTRATÉGICA Comité de Dirección Analizar incremento de urgencia  ACCIONES PRIORITARIAS  Comité de Dirección Implementación y Control  IMPORTANCIA ESTRATÉGICA  +  –  –   +     ESFUERZO DE LA IMPLANTACIÓN  1- Proyectos de alto valor estratégico  y bajo esfuerzo de implantación  2- Proyectos de alto valor estratégico  y alto esfuerzo de implantación  3- Proyectos de bajo valor estratégico  y bajo esfuerzo de implantación  4- Proyectos de bajo valor estratégico  y alto esfuerzo de implantación F igura 21: Priorización de los planes de acción  F uente: José María Sainz de Vicuña (2003)  F igura 22: Matriz de impacto y esfuerzo  F uente: José María Sainz de Vicuña (2003)  Estrategias ok.qxd   21/3/05  17:25  Página 84 \nP or último, el plan de acción requiere un  control y seguimiento ,  bien  analizando  sus  resultados  o  bien  las  causas  que  lo  provo-  can.  Además,  debe  hacerse  un   seguimiento   del  mismo  porque  en el entorno cambiante en el que desarrolla la actividad la em-  presa  pueden  cambiar  las  circunstancias  contempladas  en  el  momento en el que se establecieron los objetivos estratégicos.  D ebe adicionalmente establecerse un control del cumplimiento  del plan no como sistema de inspección, verificación o investi-  gación de lo ocurrido, sino como método para poder comparar  periódicamente  lo  realizado  con  los  objetivos  fijados,  analizar  las  desviaciones  y  corregirlas  mediante  la  adopción  de  nuevas  acciones.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   85  Área  Departamento  Responsable  2004   2005   2006   2007   2008  DEFINICIÓN DE ÁREA  Complete con las  acciones a acometer   por el área definida   Departamento  responsable de la  acción definida  Establezca la prioridad del proyecto   y el horizonte temporal en el que   debe acometerse  Responsable  del   departamento  para  cada acción  F igura 23: Plantilla de acciones a adoptar por la empresa  Estrategias ok.qxd   21/3/05  17:25  Página 85 \nEstrategias ok.qxd   21/3/05  17:25  Página 86 \n";

    const PDF2_TEXT_EMBEDDED = "                                                                                “La mejor estructura no garantizará los resultados ni el rendimiento. Pero la estructura   equivocada es una garantí a de fracaso”.       Peter Drucker    DIPLOMADO VIRTUAL EN    ALTA GERENCIA    M Ó DULO      I V    G ERENCIA   ESTRATÉGICA      \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    1                MÓDULO 4 :   GERENCIA ESTRATÉGICA          OBJETIVOS DE APRENDIZAJE          Comprender los conceptos básicos de la gerencia estratégica.          Identificar  la  importancia  de  la  planeación  estratégicas  como  un  proceso   fundamental  que  las  organizac iones  deben  implementar  para  conseguir  sus   objetivos.          Elaborar  los  elementos  básicos  de  la  planeación  estratégica  (misión,  visión,   objetivos estratégicos y estrategias)             CONTENIDO       4 .1   Conceptos Básicos.       4.2   Planeación Estratégica       4.3   La Gerencia Est ratégica .                                                            \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    2                      INTRODUCCIÓN       Según  Fred.  R  David  Gerencia  Estratégica  es  un  proceso  mediante  el  cual  se  formulan,   ejecutan y evalúan las acciones que permitirán que una organización logre los objetivos.       La  Gerencia  estratégica  requiere    la  identificación  de  amenazas  y  oportunidades  externas   de  una  empresa,  al  igual  que  las  debilidades  y  fortalezas  internas,  el  establecimiento  de   misiones de una compañía, la fijación de objetivos, el desarrollo de estrategias alternativas,   el  análisis  de  d ichas  alternativas  y  la  decisión  de  cuales  escoger.  La  ejecución  de  las   estrategias  requiere  que  la  empresa  establezca  metas,  diseñe  políticas,  motive  a  sus   empleados  y  asegure  recursos  de  tal  manera  que  las  estrategias  formuladas  puedan  ser   llevadas  a  cab o  en  forma  exitosa.  La  evaluación  de  estrategias  comprueba  los  resultados   de la ejecución y la formulación.       Por  otra  parte  se  debe  suministrar  los  incentivos  apropiados  para  atraer  y  motivar  a  los   gerentes claves de la organización. El éxito estratégico d ebe ocurrir en el ámbito individual   y organizacional .       La  gerencia  estratégica  es  un  proceso  apasionante,  que  le  sirve  a  una  organización  para   que  sea  PROACTIVA,  en  lugar  de  reactiva.  Permite  organizar  información  cualitativa  y   cuantitativa,  de  tal  manera  que  sirva  para  la  toma  de  decisiones  efectivas  en  las   circunstancias  actuales  de  incertidumbre  cuya  característica  primordial  es  el  cambio  que   supone  a  cualquier  organización  operar  inmersa  en  un  mercado  global  y  con  retos   enormes.  La  aplicación  de  la  Gere ncia  Estratégica  permite  el  monitoreo  continuo  de  los   hechos  y  las  tendencias  internas  y  externas  en  las  que  se  desenvuelven  las   organizaciones,  adecuándose,  previendo  los  cambios  y  buscando  un  crecimiento   sustentado.         Además la Gerencia Estratégica propo rciona el marco teórico para la acción que se halla   en la mentalidad de las organizaciones y sus empleados permitiendo que se analicen las    \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    3                situaciones en un  lenguaje común  y  decidan sobre las acciones  que se deben  emprender   en  un  periodo  razonable.  Good stein  (1997:9)  afirma  que  la  gerencia  estratégica  permite   que  los  lideres  de  las  organizaciones  liberen  la  energía  de  esta,  detrás  de  una  visión   compartida y cuenten con la convicción de que pueden llevar a cabo la visión.       La  gerencia  estratégica  brinda  u na  oportunidad  para  ajustarse  en  forma  constante  a  los   sucesos y acciones actuales de los competidores.                                                                                                               \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    4                   4 .1   CONCEPTOS BÁSICOS GERENCIA ESTRATÉGICA             PLANEACIÓN ESTRATÉGICA       Definición:  La  Planeación  estratégica  es  el  proceso  mediante  el  cual  quienes  toman   decisiones  en  una  organización  obtienen,  procesan  y  analizan  información  pertinente,   interna  y     externa,  con  el  fin  de  evaluar  la  situación  presente  de  la  empresa,  así  como  su   nivel de competitividad con el propósito de anticipar y decidir sobre el direccionamiento de   la Institución hacia el futuro.       Este proceso consiste fundamentalmente en respond er las siguientes preguntas:          ¿Dónde queremos ir?       ¿Dónde estamos Hoy?       ¿Adónde debemos ir?       ¿Adónde podemos ir?       ¿Adónde iremos?       ¿Cómo estamos llegando a nuestras metas?         \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    5                La planeación estratégica así entendida tiene los siguientes componentes fundamentale s :       1.     Los estrategas    2.     El Direccionamiento    3.     El Diagnóstico    4.     Las opciones    5.     La formulación estratégica    6.     La auditoría estratégica          LOS ESTRATEGAS       Se  definen  como  estrategas  aquellas  personas  o  funcionarios  de  la  empresa   (generalmente  Miembros  de  la  Junta  Directiva,   el  presidente  o  gerente  y  los   vicepresidentes)  a  quienes  corresponde  la  definición  de  los  objetivos  y  políticas  de  la   organización.       También  debe  caber  dentro  del  concepto  de  visión  estratégica,  que  estrategas  son  todas   aquellas  personas  de  una  organizaci ón  que  tienen  capacidad  para  tomar  decisiones   relacionadas con el desempeño presente o futuro de la organización.          EL DIRECCIONAMIENTO ESTRATÉGICO       Las  organizaciones  para  crecer,  generar  utilidades  y  permanecer  en  el  mercado  deben   tener muy claro hacia d ónde van, es decir haber definido su direccionamiento estratégico.       El direccionamiento estratégico lo integran  los principios corporativos, la visión  y la  misión   de la organización.         \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    6             EL DIAGNÓSTICO ESTRATÉGICO PLANEACIÓN ESTRATÉGICA         Comprende  las  acti vidades  tendientes  a  realizar  un  análisis  de  la  situación  actual  de  la   compañía  tanto  internamente  como  en  su  entorno.  Para  ello  es  indispensable  obtener  y   procesar  información  sobre  el  entorno  con  el  fin  de  identificar  allí  oportunidades  y   amenazas, así c omo acerca de las fortalezas y debilidades internas de la organización.          OPCIONES ESTRATÉGICAS PLANEACIÓN ESTRATÉGICA        La  compañía  deberá  definir  los  comportamientos  futuros  en  el  mercado,  analizar  el   comportamiento de su portafolio de productos, definir   los objetivos globales y los proyectos   estratégicos que le permitan lograr eficientemente y eficazmente su misión. Una vez se ha   definido el direccionamiento  y diagnóstico estratégico de la compañía, deberán explorarse   las  opciones  que  la  compañía  tiene  p ara  anticipar  tanto  sus  oportunidades  y  amenazas  ,   como sus fortalezas y debilidades.          FORMULACIÓN ESTRATÉGICA PLANEACIÓN ESTRATÉGICA        Los proyectos deben reflejarse en el  PRESUPUESTO ESTRATÉGICO .       Las  opciones  estratégicas  deberán  convertirse  en  planes  de  acción  concretos,  con   definición de responsables, para ello es indispensable:          Definir objetivos       Definir  estrategias  de  cada  área  funcional  dentro  de  los  proyectos  o  planes   estratégicos.       Diseño de planes de acción concretos            \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    7             LA AUDITORÍA ESTRATÉGICA       La  Auditoria  estratégica  cumple  una  función  de  inteligencia  en  el  proceso  decisorio  y  es   una herramienta útil para el control de gestión superior.        Tiene por finalidad identificar y revelar defectos e irregularidades que se pudieran detectar   en  una  organ ización  o  área  de  la  misma  donde  se  toman  decisiones  (hasta  el  nivel  más   bajo de supervisión) y sugerir medidas para corregir las decisiones no satisfactorias.        El  objeto  de  análisis  podrá  ser  cualquiera  de  los  elementos  del  proceso  administrativo   (planif icación, organización, dirección o control) tales como políticas y planes, diseño de la   estructura organizacional, los métodos de operación, la dirección de los recursos humanos   o el control financiero.          Formulación  de  estrategias :  es  el  proceso  que  conduce  a  la  fijación  de  la  misión  de  la   organización  para  establecer  debilidades,  fortalezas,  oportunidades  y  amenazas,   identificando  y  inte rrelacionando  factores  internos  y  externos  para  fijar  objetivos  y   estrategias.            \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    8             Unidad  estratégica  de  Negocios  (UEN) :  Es  la  unidad  organizacional  o  foco  de   planeación,  responsable  de  uno  o  más  productos  que  se  venden  a  los  clientes  y  que   enfrentan a los   competidores       Auditoria  Interna:     Establece  debilidades  y  fortalezas  de  la  organización.  Comprende  las   auditorias:  gerencial,  de  mercadeo,  financieras,  de  producción,  de  investigación  y   desarrollo       Planeación operacional : Es la selección de medios para per seguir metas, dadas por una   autoridad superior a corto plazo       Planeación Táctica:   Tiene relación con la selección de los medios para lograr metas de la   organización a mediano plazo       Planes  a  corto  plazo :  Son  planes  operativos  muy  detallados,  usualmente  se    hacen  a  un   año       Programación  a  mediano  plazo :  Es  el  proceso  se  preparan  e  interrelacionan  planes   específicos  y  funcionales  para  llevar  a  cabo  las  estrategias.  Generalmente  son  de  2  a  5   años.       Programación a largo plazo : son planes más generales cuyo tiempo   supera los 5 años.       Políticas:   Es la forma por medio de la cual las metas fijadas van a lograrse.       Estrategia  de  negocios :  Es  la  determinación  de  la  forma  en  que  una  organización   competirá en un negocio dado y se posicionara frente a la competencia.       Estr ategia  corporativa :  Es  la  determinación  de  los  negocios  en  los  que  competirá  una   organización y la asignación de recursos entre los mismos.         \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    9             Desarrollo de la estrategia : Hace referencia a los procesos mediante los cuales se pone   en practica cada  uno de l os tres niveles de estrategias, la de negocios, la corporativa  y la   institucional.       Implantación  de  la  estrategia :  Proceso  de  asegurar  que  la  estrategia  este  incluida  en   todo lo que hace la organización, buscando  la concordancia  entre objetivos estratégico s  y   las actividades diarias de la organización.       Objetivos globales : Resultados a largo plazo que una organización espera lograr.       Diagnostico  estratégico :  Análisis  que  se  hace  mediante  el  uso  de  la  matriz  D.O.F.A.   (debilidades, oportunidades, fortalezas,  amenazas).       Debilidades :  Actividades  u  obstáculos  que  dificultan  el  funcionamiento  optimo  de  la   organización.       Oportunidades :  Tendencias  económicas,  sociales,  políticas,  tecnológicas,  competitivas,   como hechos que pueden de forma significativa beneficiar a   una organización.       Fortalezas :  Actividades  o  atributos  internos  que  apoyan  el  logro  de  los  objetivos  en  la   organización.       Amenazas :  Tendencias  que  inhiben,  limitan  o  dificultan  el  desarrollo  operativo  de  una   organización.       Visión :  Declaración  amplia  y  suf icientes  de  donde  quiere  estar  la  organización  en  3  o  5   años.       Misión : Formulación de los propósitos de una organización. Expresan la razón de ser.       Estrategias:   Acciones necesarias para mantener y soportar el logro de los objetivos de la   organización.   \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    10                P lanes de Acción : Tareas que debe realizar cada unidad o area para poder concretar las   estrategias en un plan operativo que permita evaluación y seguimiento.       Extrapolar :  Aplicar  una  función  que  ha  sido  determinada  para  valores  pertenecientes  a   cierto  inter valo  o  valores  que  se  hallan  fuera  del  mismo.  Aplicar  una  ley  física  fuera  de  la   región en que ha sido verificada, admitiendo la hipótesis de que también es valido allí.       Metas :  Puntos  de  referencia  o  aspiraciones  que  las  organizaciones  deben  lograr  a  cort o   plazo,  medibles,  cuantificables,  cuantitativas,  realistas,  estimulantes,  coherentes  y   prioritarias.       Posición  competitiva :  Considerada  un  aspecto  importante  en  el  diseño  de  la  estrategia   del  negocio  y  es  el  modelo  general  para  la  competencia  en  los  merca dos  donde  ha   decidido competir.       Ventaja competitiva : Es aquella característica o atributo de la organización que la separa   de sus competidores y la medida en la que es diferente del resto del conjunto.       Segmentación  del  mercado :  Subdivisión  de  un  mercado    en  diferentes  subconjuntos  de   clientes  de  acuerdo  con  sus  necesidades  y  la  forma  en  que  compran  y  usan  un  bien  o   servicio .                                 \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    11             4 . 2   PLANEACIÓN ESTRATÉGICA          PROCESO DE PLANEACIÓN ESTRATÉGICA       La planificación es un proceso creativo y por ende tiene tanto secuencias lineales, esto es,   pasos  uno  tras  otro  en  orden,  como  también  secuencias  iterativas  donde  se  retrocede     a   pasos  anteriores  y  se  trabaja  en  una  secuencia  circular.  El  esquema  de  la  planificación   como  sistema  ilustra  las  relaciones  entre  distintos  momentos  claves  del  análisis  en  el   proceso.       Para  definir  las  estrategias  es  indispensable  el  conocimiento  del  en torno  externo  en  las   oportunidades  y  riesgos  actuales  y     potenciales  como  también  las  necesidades,  recursos,   fortalezas y carencias de la propia organización en relación a su misión en los segmentos   del mercado en el que se quiere ubicar. El triángulo visió n - entorno - organización es el punto   de arranque del proceso de planificación estratégica.      \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    12                Un  análisis  más  detallado  se  debe  hacer    a  nivel  operativo  sobre  las  expectativas,  las   necesidades y las preferencias de los consumidores, de los clientes, de los empleados, de   los proveedores, de los competidores, de los “complementadores”, esto es, del entorno   próximo de una institución en lo r eferente a lo que desean, buscan y esperan, o “la red de   valores”   (Nalebuff y Brandenburger, 1996).       Las preguntas claves versan sobre variedad de aspectos:          ¿Quiénes son nuestra competencia y que participación tienen en el mercado?          ¿Quienes son “compleme ntadores”           ¿Qué es lo que los consumidores prefieren de nuestros productos y de los de la    competencia?          ¿Qué servicios complementarios les agradan más a nuestros clientes?          ¿Cómo perciben los consumidores nuestra atención y la de competencia?          ¿Qué prefie ren los consumidores: precio menor o facilidades de pago?          ¿Cuáles son las empresas preferidas por nuestros proveedores y por qué?          ¿Nuestros empleados “quieren” trabajar para nosotros o “tienen” que trabajar?       EL ANÁLISIS DE LA  ORGANIZACIÓN.       El  propósit o  de  la  evaluación  institucional  es  descubrir  las  fortalezas  y  las  debilidades   internas en las operaciones de la organización   y  en  el  uso  de sus recursos para dar una   respuesta  adecuada  a  las  condiciones  del  entorno.  A  diferencia  de  los  factores  externos,    las condiciones internas son manejables y pueden ser modificadas.    \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    13             El  análisis  debe  enfocarse  a  las  funciones,  las  divisiones  de  trabajo,  las  interrelaciones   entre  ellas,  los  mecanismos  de  entrega  de  los  productos  y  servicios  y  capacidad  de  la   gerencia c omo equipo.        Los factores internos claves son la capacidad de:       • atraer y mantener clientes leales y de valor,    • producir a menor costo que la competencia,    • proveer productos o servicios en momentos y lugares la competencia no alcanza,    • atraer y manten er gente de calidad productiva y leal,    • ser mejores que ellos en el servicio, el precio, la promoción y distribución.       Un  proceso  sistemático  de  evaluación  de  fortalezas  y  debilidades  (como  también  para   evaluación del entorno) consiste en la construcción  de una matriz de evaluación siguiendo   cuatro pasos:          1.   Hacer un listado de áreas y criterios de evaluación de los factores clave.    2 . Definir una escala de ponderación de los criterios según su importancia.    3 . Evaluar mediante una escala la posición de la   institución.    4 . Calcular el impacto como producto de la ponderación y la posición.       Una  técnica  similar  puede  utilizarse  para  determinar  el  atractivo  de  una  industria  o  de  un   sector  de  servicios.  Como  criterios  importantes  para  la  evaluación  de  un  sector  se   consideran  el  tamaño,  el  crecimiento,  la  estructura  de  competencia,  la  rentabilidad,  la   diversidad de mercados, la vulnerabilidad a cambios tecnológicos, sociales o políticos.                     \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    14             FORMULACIÓN DE LA   MISIÓN, VISION,  OBJETIVOS   Y ESTRATEGIAS.       MISIÓN.         La misión define la razón de ser o el propósito de una institución para sus clientes externos   e  internos  y  para  la  sociedad  a  través  de     su  actividad  central  y  de  la  calidad  de  sus   productos y servicios. La declaración de misión muy completa debe recoger el sentido del   negocio y las expectativas de su valor agregado para sus clientes, accionistas, empleados   y ciudadanos.       Al mismo tiempo t iene que distinguir  a la institución de otras similares por  sus clientes, su   cobertura, su imagen de productos y servicios.       Con frecuencia la misión se la reduce generalmente a tres elementos:       •  L os productos o servicios claves de la institución,    • L a fu nción central que desempeña la institución, y    • L os clientes o mercados a quienes sirve.       Algunos ejemplos conocidos de misiones:          “Fabricar  mediante  la  química  cosas  mejores  para  una  vida  mejor”.  (Empresa   química Dupont)          “Hacer  de  compradores  de  la  famil ia  norteamericana”.  (Cadena  de  almacenes   Sears)   \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    15             La de un centro hospitalario especializado pudiera ser:          Brindar  servicios  de  diagnóstico,  prevención  y  tratamiento  de  enfermedades  de   cáncer para las   personas que lo soliciten.”       La amplitud del contenido d e la misión depende de la complejidad de la institución. En este   sentido  puede  ser  formulada  como  una  carta  magna  de  propósitos  centrales  frente  a   múltiples  actores  que  dependen  de  la  misma,  tales  como,  clientes,  empleados,   proveedores, comunidad.       Porque  no es fácil establecer la misión, muchas instituciones carecen de una definición de   la misma. La carencia de la definición de la razón de ser o la ambigüedad en su definición   pueden  tener  implicaciones  en  el  resto  del  proceso  de  planificación,  particularme nte  en   incoherencias en los proyectos.       Una  manera  de  llegar  a  su  definición  es  mediante  la  técnica  de  lluvia  de  ideas   (brainstorming)  donde  diversos  participantes  esclarecen  la  razón  de  ser  última.  Algunas   preguntas pueden ser útiles en este discernimient o:       • ¿Cuál es el propósito fundamental de la empresa hoy? ¿Cuál será en el futuro?    • ¿Cuál podría ser esta misión o propósito fundamental? ¿Cuál debería ser este?    • ¿A qué clientela servimos y cuáles son sus expectativas fundamentales sobre nuestra   empres a?    • ¿Cuáles son las responsabilidades fundamentales  de la institución con otros actores,   además de los clientes?         La  respuesta  a  estas  preguntas  puede  ayudar  para  una  formulación  adecuada  de  la   misión.  En  un  ejemplo  posterior  se  detalla  la  formulación  de     la  misión  de  un  centro   universitario, junto con su plan estratégico.      \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    16             VISIÓN.       El punto de comienzo para articular la jerarquía de  metas de una empresa es la visión   de   una compañía, que podíamos definir  como la declaración que determina dónde  queremos   llegar en el futuro. Una visión puede o no puede tener éxito, depende de si el resto sucede   según la estrategia de la empresa.       Las características de la visión de una  sociedad son las siguientes:          Es  un  objetivo  ampliamente  inspirador,  engloba  el  resto  de  objetivos  y  es  a  largo   plazo.       Aunque las visiones  no pueden ser  medidas por  un indicador específico  que valore   el  grado  en  el  que  están  siendo  alcanzadas,  proporcionan   una  declaración   fundamental de los valores, aspiraciones y metas de una organización.       Las visiones van obviamente mucho  más allá  de los simples objetivos financieros  y   luchan por capturar tanto las mentes como los corazones de los empleados.       Desarrollar e   implantar una visión es uno de los papeles centrales del líder.       Debe  evocar  imágenes  mentales  poderosas  y  motivadoras  (un  eslogan,  un   diagrama o imagen), cualquier cosa que enganche la atención.       Responde a la pregunta:  ¿QUÉ QUEREMOS SER?       En la definición   de la visión de la sociedad debemos evitar errores del tipo:          Debe existir coherencia entre la visión y la actuación de la dirección, no siendo una   expresión de mera palabrería, lejos de la realidad.   \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    17                La  visión  debe  estar  anclada  en  la  realidad  y  relacion ada  con  las  amenazas  y   oportunidades del entorno o con los recursos y capacidades de una organización.       Una  visión  simplemente  no  puede  ser  considerada  como  una  cura  mágica  para  la   enfermedad de una organización.       La gente siente dificultad para identificars e con una visión que pinta un gráfico futuro   color rosa, pero no tiene en cuenta el entorno hostil, en el cual la empresa compite,   o ignora algunas de las debilidades de la empresa.       Algunos ejemplos de visión de empresas:       “Ser marca líder de tecnología pu nta  en  el  mundo  audiovisual  en  un  entorno  de   crecimiento rentable  y sostenido”. Empresa fabricante de televisores, equipos  de   sonido, etc.          “Ser marca líder en el territorio nacional en edificación y servicios relacionados con   la  construcción  en  un  entorno     de  crecimiento  rentable  y  sostenido”.  Empresa   constructora.          “Ser  una  empresa  de  referencia  en  el  mercado  nacional  e  internacional  de   maquinaria auxiliar del sector de la automoción, ofreciendo un servicio correcto y de   calidad - precio adecuado, que aporte   seguridad, comodidad y fiabilidad al puesto de   trabajo  al  que  se  dirige  en  un  entorno  en  el  que  los  distribuidores  se  sientan   plenamente  respaldados”.  Empresa  de  maquinaria  auxiliar  del  sector  de   automoción.          “Ser  el  proveedor  mundial  líder  de  materiales    para  la  interconexión  de  alto   rendimiento y servicios relacionados para los mercados de ensamblaje de productos   electrónicos  y  componentes.  Para  lograrlo,  nos  concentraremos  en  innovación  y   servicio excepcional para nuestros clientes en todo el mundo”. Emp resa  fabricante   de materiales para la interconexión de alto rendimiento y servicios relacionados.          “Ser  una  empresa  con  una  sólida  estructura  organizacional  que  proporcione   bienestar a sus empleados, clientes y proveedores.      \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    18             OBJETIVOS             Hasta  aquí  hemos  hablado  tanto  de  la  visión  como  de  la  misión.  La  declaración  de  visi ón   de  la  sociedad  tiende  a  ser  bastante  amplia  y  puede  ser  descrita  como  una  meta  que   representa  un  destino  último  inspirador  y  motivador.  En  el  otro  lado,  la  declaración  de  la   misión es más específica y se refiere a cuestiones que conciernen a la razón de   ser de la   organización y las bases de su deseada ventaja competitiva en el mercado.         Los  objetivos  estratégicos  se  utilizan  para  hacer  operativa  la  declaración  de  misión,  es   decir, ayudan a proporcionar dirección a cómo la organización puede cumplir o tr asladarse   hacia los objetivos más altos de la jerarquía de metas, la visión y la misión.       Establecer  objetivos  requiere  un  criterio  para  medir  el  cumplimiento  de  los  mismos.  Si  un   objetivo  pierde  especificidad  o  mensurabilidad,  no  es  útil,  simplemente  porq ue  no  hay   manera  de  determinar  si  está  ayudando  a  la  organización  a  avanzar  hacia  la  misión  y   visión organizativa.       Para que los objetivos tengan sentido necesitan satisfacer varios criterios:          Mensurables.  Debe  haber  al  menos  un  indicador  o  criterio  que  m ida  el  progreso   hacia el cumplimiento del objetivo.      \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    19                Específicos.  Esto  proporciona  un  claro  mensaje  en  cuanto  a  qué  necesita  ser   realizado.       Apropiados.Debe ser consistente con la visión y misión de la organización.       Realistas.  Debe  ser  un  objetivo  alcanzab le  dadas  las  capacidades  de  la   organización  y  las  oportunidades  del  entorno.  En     esencia,  debe  ser  desafiante  y   factible.       Oportuno. Requiere tener un plazo de tiempo para el cumplimiento del objetivo.       Cuando  los  objetivos  satisfacen  los  criterios  anteriore s,  se  dan  muchos  beneficios  para  la   organización:          Ayudan  a  dirigir  a  los  trabajadores  de  toda  la  organización  hacia  metas  comunes.   Esto  ayuda  a  concentrar  y  conservar  recursos  valiosos  en  la  organización  y  a   trabajar conjuntamente de un modo más apropiado .          Los objetivos desafiantes pueden ayudar a motivar e inspirar a los trabajadores de la   organización  hacia  mayores  niveles  de  compromiso  y  esfuerzo.  Empíricamente,  ha   sido  demostrado  que  los  individuos  trabajan  más  duro  cuando  luchan  por  objetivos   específ icos que cuando se les pide simplemente que lo hagan lo mejor que puedan.          Siempre  existe  la  posibilidad  de  que  las  diferentes  partes  de  la  organización   persigan sus propias metas en lugar de las metas de la totalidad de la organización.   Aunque  bien  intenc ionados,  pueden  actuar  como  propósitos  que  se  cruzan  con  los   de la organización como conjunto. En esos casos, los objetivos significativos pueden   ayudar a resolver conflictos cuando surjan.          Cuando los objetivos son los más apropiados, proporcionan un crit erio para fijar las   recompensas  e  incentivos.  No  solamente  motivarán  en  mayor  medida  a  sus   empleados, sino que también ayudaran a asegurar un mejor sentido de la equidad e   imparcialidad en la asignación de recompensas. Ejemplos:         \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    20                Mantener  un  crecimiento    anual  mayor  al  5%  en  la  matrícula  de  estudiantes  para   primer curso durante los próximos tres años.          Mejorar  la  infraestructura  y  el  equipamiento  del  centro  con  inversiones  nuevas   anuales equivalentes al 50% de los ingresos por las matrículas.          Incrementar    la  productividad  de  los  maestros  en  relación  al  rendimiento  académico   promedio  y  a  la  razón  de  número  de  alumnos  por  maestro  mediante  el  fomento  de   actividades experimentales de auto aprendizaje durante los próximos tres años.          Disminuir el costo promedio  de alumno promovido11 del ciclo básico de $ 3.000 a $   2.500  en  el  lapso  de  tres  años,  manteniendo  los  estándares  académicos  de   promoción.       DEFINICIÓN DE ESTRATEGIAS.            Existen estrategias en los distintos niveles de una organización:          La  estrategia  corporativa  está  relacionada  con  el  objetivo  y  alcance  global  de  la   organización  para  satisfacer  las  expectativas  de  los  propietarios  o  principales   stakeholders,  y añadir valor a las  distintas partes (a  menudo negocios  individuales)   de  la  empresa.  La  definición  de  los  tipos  de  negocios,  la  cobertura  geográfica,  la   tipología de productos  o servicios  a ofertar se incluy en en el  nivel corporativo de la   estrategia.   \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    21                La  estrategia  competitiva  se  refiere  a  cómo  competir  con  éxito  en  un  determinado   mercado;  se  trata  de  saber  cómo  aventajar  a  los  competidores,  qué  nuevas   oportunidades  pueden  identificarse  o  crearse  en  los  merc ados,  qué  productos  o   servicios deben  desarrollarse en cada mercado, y  el  grado en  que  éstos satisfacen   las necesidades de los consumidores.          La  estrategia  operativa  se  ocupa  de  cómo  los  distintos  componentes  de  la   organización, en términos de recursos, pr ocesos, personas y sus habilidades, hacen   efectiva la estrategia corporativa y competitiva.       El  alcance  de  las  decisiones  estratégicas  de  cualquier  empresa  pasa  por  un  proceso  a   realizar en cinco fases:       1.   La  definición  del  negocio,  que  significa  concreta r  al  menos  los  siguientes   aspectos:  qué  tipo  de  necesidades  van  a  ser  satisfechas  (funciones  del  producto  o   servicio);  qué  segmentos  de  consumidores  van  a  ser  atendidos  por  la  empresa   (segmentos  y  áreas  geográficas);  y  con  qué  tecnologías  van  a  ser  realiza dos  los   productos o servicios. Todo ello comparado con nuestros competidores.       2.     Una  vez  hecha  la  definición  del  negocio,  las  estrategias  de  cartera  deben   concretar todas las actividades o unidades de negocio (UEN) que la empresa quiere   abordar.        3.   A co ntinuación, se deberá definir la estrategia competitiva a seguir dentro de cada   negocio,  siendo  las  estrategias  genéricas  identificadas  por  Michael  Porter  de  tres   tipos: liderazgo en costes, diferenciación y enfoque o concentración en un segmento   o nicho d el mercado.       4 .  Las  estrategias  de  crecimiento  definen  las  pautas  de  actuación  para  cuando  la   empresa  se  ha  marcado  objetivos  de  crecimiento.  Concretamente  definen  si  la   empresa  debe  crecer  mediante  desarrollo  interno  o  mediante  desarrollo  externo   (alianza s, fusiones, absorciones, etc.).   \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    22             5 .  Las  estrategias  operativas  o  funcionales  deben  establecer  los  planes  de  acción   de cada una de las áreas o departamentos   de la empresa.                      4 . 3   LA GERENCIA ESTRATÉGICA          IMPLEMENTACIÓN DEL PLAN       Un refrán popular traduce la dificultad de poner en práctica lo que se ha planificado: “Del   dicho al  hecho, hay  mucho trecho”. Muchas veces  grandes  esfuerzos  de    análisis  y  de   planificación  se  han  empolvado  en  las  estanterías  de  quienes  los  generaron.  La  causa   principal de este  hecho radica en que  muchas veces la gerencia  no se compromete  en  el   proceso de la planificación y lo delega a los “técnicos”.      \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    23             El primer  p aso hacia la implantación  de  un  plan  estratégico  es adaptar la  estructura  de  la   institución  a  la  estrategia  propuesta.  La  adecuación  puede  ser  difícil  sobre  todo  en   situaciones  de  rápido  crecimiento  o  de  crisis.  Adecuarse  significa  rediseñar  procesos   admin istrativos  y  sistemas,  para  crear  un  entorno  que  haga  factible  la  aplicación  de  las   nuevas estrategias. Pero también esto conlleva casi siempre a cambios en las habilidades   y  destrezas  de  las  personas  y  de  la  institución,  a  cambios  en  el  personal  y  requier e   también cambios en las actitudes y actuaciones de los gerentes.       La  empresa  consultora  McKinsey  propuso  el  modelo  de  siete  factores  (7  eSes  en  inglés)   que deben ser considerados cuando se modifican las  metas  y se definen  estrategias  para   alcanzarlas. El    modelo sugiere que todos los factores actúan entre sí y por ello deben ser   considerados  en la  ejecución. El  análisis de todos estos factores  busca institucionalizar la   estrategia,  esto  es,  hacerla  cultura  de  la  institución,  asimilarla  a  sus  valores  y  norma s  de   grupo,  como  primer  paso  para  su  implementación.  No  es  posible  aplicar  una  estrategia  si   esta no se adapta a la cultura de la organización. El papel protagonista en todo el proceso   es el del gerente o director general quien lidera e impulsa todo el pro ceso.             El  segundo  paso  para  lograr  que  se  lleve  a  la  práctica  es  hacer  operativa  a  la  estrategia,   esto es, convertirla en programas, proyect os y actividades que rijan los detalles de las    \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    24             operaciones  diarias.  La  aplicación  operativa  de  las  estrategias  corresponde  a  los  niveles   medios de mando dentro de la institución. En la planificación operativa se encuentran dos   tipos de planes:          operacion es únicas, y       operaciones recurrentes y continuas       Los  planes  relativos  a  operaciones  que  sólo  se  harán  una  vez  para  resolver  un  problema   específico  o  aprovechar  una  oportunidad.  Se  los  denomina  proyectos.  Un  conjunto  de   proyectos  en  torno  a  un  mismo  sector     o  función  se  lo  conoce  como  un  programa.  La   herramienta financiera para el manejo de proyectos y programas es el presupuesto, donde   se  establecen  las  erogaciones  o  egresos  de  inversión,  de  operación  y  los  ingresos   respectivos en períodos de tiempo.       Para  la  planificación  de  actividades  recurrentes  o  rutinarias  se  definen  políticas,   procedimientos  y  reglas  por  las  que  se  determinan  los  lineamientos,  limitaciones,  formas   específicas  de  actuación  que  permiten  encauzar  las  decisiones  en  formas  previstas  que   se an coherentes con los objetivos y al misión de la institución. Como ya se mencionó antes   las  políticas  establecen  directrices  y  restricciones  de  carácter  bastante  general  y  los   procedimientos  señalan  secuencias  de  actividades  que  han  de  seguirse  en  determi nadas   decisiones.  Las  reglas  son  normas  específicas  de  acción  que  son  obligatorias  en   determinadas situaciones.          Un plan es inútil a menos que sea comunicado, asimilado y practicado por todos los   empleados.          La  misión  y  los  valores  corporativos  han  de  ser    conocidos  y  sentidos  en  todas  las   acciones y decisiones de la institución.          El  plan  estratégico  ha  de  implementarse  a  través  de  las  actividades  del  plan   operativo de cada unidad estratégica.      \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    25                            “EL MAYOR RIESGO DE UN PLAN ES CONVERTIRSE EN ARCHIVO”                                                                     \n   DIPLOMADO VIRTUAL EN  ALTA  GERENCIA    |  GUÍA DID ÁCTICA 4   -   GERENCIA  ESTRATÉGICA    26                   BIBLIOGRAFIA :       La Elaboración del Plan Estratégico, Eco 3  Colecc iones. Editorial Altair.          CIBERGRAFIA       http://bvs.per.paho.org/texcom/cd048223/gerhosp2.pdf       http://isabelportoperez.files.wordpress.com/2012/08/acercamiento - a - la - gerencia -  estrategia.pdf       http://manuelgross.bligoo.com/elementos - de - planeacion - estrategica - m etodologia - y -  ejemplo - desarrollado       http://www.cece.gva.es/eva/docs/calidad/publicaciones/es/guia_planif.pdf                                                                      ACTUALIZADO   POR:    Sandra Quintero     function extractTextFromBackendResponse(raw) {

        try {
            const j = JSON.parse(s);
            if (Array.isArray(j)) return JSON.stringify(j);
            if (j && typeof j === 'object') {
                const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;

        } catch (e) {}
        return s;
