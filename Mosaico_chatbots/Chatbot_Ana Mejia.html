ica y, a la vez, muy  práctico para que todo directivo pueda verse reflejado en él  y  ponga  en  marcha  los  mecanismos  necesarios  para  dirigir  el rumbo de su empresa.  En  la  medida  en  que  este  libro  contribuya  a  que  los  accio-  nistas, directivos, profesionales de empresa y público en ge-  neral emprendan el proceso de reflexión e implantación es-  tratégica, tendremos éxito en nuestro empeño de contribuir  a la transferencia de conocimientos; y si logramos que algu-  na empresa cambie su rumbo y alcance el éxito gracias a es-  ta lectura, nos sentiremos mucho más que satisfechos.  Altair Consultores  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   5  Pr esentación  Estrategias ok.qxd   21/3/05  17:25  Página 5 \nECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 6  CAPÍTULO 1: INTRODUCCIÓN .............................................9 ¿Qué es estrategia?  Ca r acterísticas de las decisiones estratégicas  ¿Qué es un plan estratégico?  ¿Por qué realizar un plan estratégico?  P eligros de la planificación estratégica  ¿Quién debe realizar un plan estratégico?  F ases de elaboración de un plan estratégico  Ho ri z onte de planificación  Ca r acterísticas de una estrategia con éxito CAPÍTULO 2: METAS ESTRATÉGICAS .................................23 I. VISIÓN, MISIÓN, VALORES CORPORATIVOS  Y OBJETIVOS ESTRATÉGICOS  D efinición de la visión  D efinición de la misión  V alores corporativos  Objetivos estratégicos  II. UNIDADES ESTRATÉGICAS DE NEGOCIO (UEN)  CAPÍTULO 3: ANÁLISIS DEL ENTORNO .............................33  I. ANÁLISIS DEL ENTORNO GENERAL (ANÁLISIS PEST)  F actores económicos  F actores tecnológicos  F actores políticos  F actores sociales y demográficos  S eguimiento del entorno (resumen de indicadores) II. ANÁLISIS DEL ENTORNO COMPETITIVO (ANÁLISIS   DE LAS CINCO FUERZAS DE PORTER)  La amenaza de nuevos entrantes (barreras de entrada)  El poder de negociación de los clientes  El poder de negociación de los pr mpetitive edge:  competing through manufacturing.   W iley.  H enderson,  B.D.  (1989):  “The  origin  of  strategy”,   Harvard  B usiness Review . noviembre-diciembe; 67(6):139-43.  J ohnson  y  Scholes  (2001):   Di r ección  estratégica .  Pearson  E ducación, S.A., 5, Madrid.  K aplan, R.S. y Norton, D.P. (2001): “The strategy focused or-  ganisation”, Harvard Business School Press, Boston , MA.  K enichi, O. (1982):  The mind of strategist . Mc Graw Hill.   Kenn eth,  A.  (1971):   The  concept  of  corporate  strategy.   Mc  Graw Hill.  M intzberg  (1994):   The  rise  and  fall  of  strategic  planning .  Pr entice Hall.  M intzberg,  H.  (1988):   O pening  up  the  definition  of  strategy .  Englewood Cliffs, New Jersey.  Po r ter (1987):  Ve ntaja competitiva.   CECSA.  Po r ter  (1990):   Competitive  advantage  of  nations.   Fr ee  Press,  N ew York.  Po r ter  (1996): “What  is  strategy?”,   Ha rv ard  Business  Review .  noviembre- diciembre: 61-78.  Q uinn, J.B. (1980):  St r ategies for change: logical incrementa-  lism . Homewood, IL: Irwin.  Ru melt  (1980):   The  evaluation  of  business  strategy .  WF  G lueck.  S ainz de Vicuña Ancín (2003):   El   plan estratégico en la prác-  tica . ESIC, Madrid.  S pender  (1989):   I ndustry  recipes:   the  nature  and  sources  of  managerial judgement . Bail Blackweell, Oxford.  Tr eacy, M. y Wiersema, F. (1999):  The discipline of market le-  aders . Perseus Publishing.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   7  Bibliografía  Estrategias ok.qxd   21/3/05  17:25  Página 7 \nEstrategias ok.qxd   21/3/05  17:25  Página 8 \nECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   9  INTRODUCCIÓN AL PLAN ESTRATÉGICO  Estrategias ok.qxd   21/3/05  17:25  Página 9 \nECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 10  OBJETIVOS DEL CAPÍTULO  • ¿Tiene nuestra organización una estrategia explícita defi-  nida?  ¿Ha  sido  implementada  en  toda  nuestra  estructura  organizativa?  • ¿Qué características deben reunir las decisiones estraté-  gicas de nuestra organización?  •  ¿Cuál  es  el  objetivo  de  este  libro,  qué  es  un  Plan  Estratégico?  • ¿Qué beneficios aporta a mi organización la elaboración  de un Plan Estratégico?  • ¿Qué precauciones debo tomar a la hora de planificar la  estrategia de mi organización?  •  ¿Quién  debe  implicarse  en  la  elaboración  del  Plan  Estratégico?  • ¿Qué fases debe contener un Plan Estratégico?  • ¿En qué horizonte temporal debo ubicar la planificación  estratégica de mi organización?  •  ¿Qué  características  debe  cumplir  mi  estrategia  para  garantizar su éxito?  ÍNDICE DEL CAPÍTULO  I. ¿QUÉ ES ESTRATEGIA?  II. CARACTERÍSTICAS DE LAS DECISIONES ESTRATÉGICAS  III. ¿QUÉ ES UN PLAN ESTRATÉGICO?  IV. ¿POR QUÉ REALIZAR UN PLAN ESTRATÉGICO?  V.       P   ELIGROS DE LA PLANIFICACIÓN ESTRATÉGICA  VI. ¿QUIÉN DEBE REALIZAR UN PLAN ESTRATÉGICO?  VII. FASES DE ELABORACIÓN DE UN PLAN ESTRATÉGICO  VIII. HORIZONTE DE PLANIFICACIÓN  IX. CARACTERÍSTICAS DE UNA ESTRATEGIA CON ÉXITO  Estrategias ok.qxd   21/3/05  17:25  Página 10 \n¿Dispone usted de una estrategia? Por supuesto que sí. Es muy  poco probable que un directivo confiese lo contrario. El hecho  de  no  tener  una  estrategia  se  asocia  rápidamente  a  ideas  como indeciso, irregular o poco profesional.  La  formulación  de  la  estrategia  probablemente  sea  el  tema  más discutido y debatido del mundo empresarial. Diferentes  generaciones  de  líderes  empresariales  han  considerado  el  desarrollo de una buena estrategia como el factor diferencia-  dor del éxito. Directivos, académicos y consultores, todos bus-  cando la panacea de una estrategia ganadora, han contribui-  do a la cuestión y al debate. El trabajo por ellos realizado no ha  sido improductivo, y de hecho ha dado lugar al desarrollo de  va r ias escuelas de pensamiento estratégico, tal y como descri-  ben  Henry  Mintzberg,  Bruce  Ahlstrand  y  Joseph  Lampel  (1998) en su libro  St r ategy Safari , donde estudiosos y expertos  tienen opiniones y concepciones muy distintas de la estrate-  gia y ni siquiera se ponen de acuerdo sobre su definición.  I ncluso el papel de la estrategia se ha puesto en duda recien-  temente por quienes sugieren que nuestro entorno empresa-  r ial, tan dinámico y en rápida evolución, vuelve ineficaz una  estrategia a largo plazo y casi instantáneamente obsoleta.  S in  embargo,  hay  quien  sugiere  lo  contrario.  Por  ejemplo,  Po r ter (1987), tal vez el pensador académico más conocido del  mundo  en  el  tema  de  estrategia,  afirma  que  la  estrategia  nunca ha sido tan importante.   Pe ro     en  realidad,  ¿qué  significa  tener  una  estrategia?  Pocos  conceptos se utilizan tanto en el  management   y,       si les pregun-  tamos  a  muchos  directivos,  nos  responden  hablando  de  visión e ideales muy parecidos entre ellos:  “ D eseamos  convertirnos  en  la  primera  empresa  de  nuestro  mercado. Lo que más nos importa es una elevada satisfacción  de nuestros clientes. Ofrecemos a nuestros clientes productos y  servicios con una relación precio/calidad excelente. La calidad  es para nosotros algo más que una palabra hueca ”.  Este  tipo  de  explicación  es  importante,  pero  demasiado  glo-  bal.  La  posibilidad  de  llevarlo  a  la  práctica  pasa  en  primer  lugar  por  el  establecimiento  concluyente  de  los  objetivos  estratégicos de la empresa, pero no debemos quedarnos ahí.  Es más, lo que debe conseguirse por medio de una estrategia  es una aclaración sobre cómo van a alcanzarse esos objetivos.  ¿Qué  productos  vamos  a  ofrecer?  ¿En  qué  mercados?  ¿A  qué  tipo de clientes? ¿Se ajustan las capacidades de nuestros tra-  bajadores a la gama de servicios a ofrecer?  A demás,  las  preguntas  anteriores  sólo  se  pueden  responder  teniendo  en  cuenta  la  situación  de  la   competencia .  Si  una  empresa  compite  con  otra  por  los  escasos  recursos  de  los  compradores, ésta deberá presentar ventajas específicas fren-  te  a  sus  competidores,  para  convencer  al  comprador  de  que  compre sus productos o servicios.   S er  diferente   es  lo  que  garantiza  la  existencia  de  la  empresa.  Cr ear esta diferenciación es lo que muchos autores ven como  el núcleo verdadero de la estrategia, en concreto M. Treacy y   F.       W   iersema (1999) opinan que “ para que una empresa pueda  tener éxito, debe definir para los clientes utilidades únicas y que  nadie más ofrezca en un determinado mercado ”.  En  la  economía  actual  existen  incontables  posibilidades  de  ser diferente. Según B.D. Henderson (1989), “ Lo que diferencia  a  los  competidores  puede  ser  el  precio,   la  forma  de  venta,   la  posibilidad  de  suministro  (...)  o  la  cercanía  geográfica  (...).  P uesto  que  las  empresas  pueden  combinar  estos  factores  de  forma  múltiple,   existen  numerosas  posibilidades  para  cada  una de ellas de mejorar su propia ventaja, ampliando aquello  que la haga destacar especialmente frente a sus competidores ”.  Las  organizaciones  empresariales  no  pueden  aprovechar  simultáneamente todas las posibilidades existentes de la dife-  r enciación. Existe el peligro de perder el propio perfil al inten-  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   11  ¿Qué es Estrategia?  Estrategias ok.qxd   21/3/05  17:25  Página 11 \ntar ofrecer cuantas más características de diferenciación posi-  bles.  Cuando  alguien  intenta  serlo  todo  para  todos,  termina  siendo nada para nadie.  La  necesidad  de  disponer  de  una  selección  con  un  enfoque  claro de elementos de diferenciación conduce a la necesidad  de tener una estrategia. Porter (1987) describe una estrategia  como  “ la  creación  de  una  posición  de  mercado  única  y  con  contenido  que  incluya  una  serie  de  actividades  empresariales  diferenciadoras ”.  Pe ro   todavía hay más, Porter (1987) lanza un segundo mensa-  je de advertencia: “ la estrategia no es eficacia operativa ”.  La eficacia empresarial tal y como la define Porter (1987) con-  siste en “ r ealizar actividades comparables mejor que la compe-  tencia ”.     Es  necesario  mejorar  constantemente  la  eficacia  empresarial para poder trabajar con una rentabilidad superior  a  la  media. Y  sin  embargo,  esto  por  sí  solo  tampoco  es  sufi-  ciente. Sólo unas pocas empresas han conseguido imponerse  con éxito a sus competidores por un tiempo prolongado y tan  sólo gracias a su eficiencia empresarial. Probablemente esto se  deba a que los mejores procedimientos de actuación se difun-  den  rápidamente.  Los  competidores  son  capaces  de  copiar  rápidamente  métodos  de  gestión,  técnicas  nuevas  o  formas  sobresalientes para el cumplimiento de las necesidades de los  clientes, así en opinión de Porter (1987): “ La   eficacia empresa-  rial  se  ha  incrementado  a  lo  largo  del  último  decenio  de  una  forma impresionante y, sin embargo, son muchas las empresas  que sufren la disminución del rendimiento ”.  A modo de conclusión y continuando con las ideas de Porter  (1987)  podemos  afirmar  que   “ estrategia  es  seleccionar  el  con-  junto  de  actividades  en  las  que  una  empresa  destacará  para  establecer  una  diferencia  sostenible  en  el  mercado ”.       C   ontinúa  diciendo Porter (1987) que “ la diferenciación surge de las acti-  vidades que se elijan y de cómo se lleven a cabo ”.  S in embargo, existe un problema añadido respecto a las es-  trategias  fallidas:   en  la  mayoría  de  los  casos  (en  torno  al  70%), el  verdadero  problema  no  es  la  mala  estrategia...  sino  la mala ejecución . Este hecho pone de manifiesto la impor-  tancia no sólo de los procesos de definición de la estrategia,  sino también, y esto es casi más importante, la forma de lle-  v ar  dicha  estrategia  a  la  práctica,  convirtiendo  la  estrategia  en casi un trabajo diario para todo el conjunto de personas  de una organización.  A  estos  dos  aspectos  clave  en  la  dirección  estratégica  de  las  empresas, el proceso de  definición   de la estrategia –plan estra-  tégico– y la  implementación   de dicha estrategia, va dirigido el  contenido del presente libro.  F inalmente y si lo anterior no le ha resultado suficiente, le pre-  sentamos a continuación una serie de definiciones de estrate-  gia obtenida de diversos expertos en estrategia.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 12  DEFINICIONES DE ESTRATEGIA  “ La   definición de las metas y objetivos a largo plazo de una  empresa, la adopción de acciones y la asignación de los recur-  sos necesarios para la consecución de estos objetivos”.  Chandler  (1962).  “ U na estrategia es el modelo o plan que integra los principa-  les objetivos, políticas y sucesión de acciones de una organiza-  ción en un todo coherente. Una estrategia bien formulada  ayuda a ordenar y asignar los recursos de una organización  de una forma singular y viable, basada en sus capacidades y  carencias internas relativas, en la anticipación a los cambios  del entorno y en las eventuales maniobras de los adversarios  inteligentes ”.   J.B. Quinn (1980).  “ La   estrategia es el modelo de objetivos, propósitos o metas y  Estrategias ok.qxd   21/3/05  17:25  Página 12 \nECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   13  Ca r acterísticas de las Decisiones Estratégicas  U na vez demostrado que la planificación formalizada es  muy  útil  para  la  empresa,  porque  permite  obtener  ven-  tajas competitivas sostenibles en el tiempo que conduz-  can  a  la  organización  hacia  el  éxito  empresarial  espera-  do,  podemos  retomar  las  siguientes  características  de  la  planificación  estratégica  definidas  por  Johnson  y  Scho-  les (2001):  •  Puede  proporcionar  medios  estructurados  de  aná-  lisis  y  reflexión  sobre  problemas  estratégicos  com-  plejos, obligando a los directivos a preguntar y cues-  tionar lo que consideran dado.  •  Puede  utilizarse  como  medio  para  implicar  al  per-  sonal  en  el  desarrollo  estratégico,  ayudando  así  a  crear un sentimiento de propiedad de la estrategia.  • La planificación estratégica puede también ayudar  a comunicar la estrategia intentada.  •  Puede  utilizarse  como  un  medio  de  control  para  r evisar  periódicamente  los  resultados  y  progresos,  comparándolos con los objetivos acordados o con la  dirección estratégica previamente acordada.  •  Puede  ser  útil  como  medio  de  coordinación;  por  ejemplo,  reuniendo  diversas  estrategias  de  las  UEN  (Unidades Estratégicas de Negocio) en una única es-  trategia global o garantizando que los recursos de la  organización se coordinen para aplicar la estrategia.  •  Puede  fomentar  una  visión  a  largo  plazo  de  la  es-  trategia  mejor  que  la  que  se  tendría  de  no  existir  la  planificación.  de las principales políticas y planes para alcanzarlos, plantea-  dos de tal manera que definen en qué negocio está o va a estar  la compañía y la clase de compañía que es o que va a ser ”.   K. Andrews (1971).  “ La   estrategia empresarial, en una palabra, es ventaja com-  petitiva... El único propósito de la planificación estratégica  es permitir que la empresa obtenga, tan eficientemente como  sea posible, una ventaja sostenible sobre sus competidores. La  estrategia corporativa supone, así, un intento de alterar las  fortalezas relativas de la compañía para distanciarse de sus  competidores de la manera más eficiente ”.       K. Ohmae (1982).  “ Estrategia es una búsqueda deliberada de un plan de acción  que cree y desarrolle una ventaja competitiva de la empresa.  Pa ra   cualquier empresa, la búsqueda es un proceso iterativo  que comienza con el reconocimiento de donde está y qué  tiene ahora. Sus competidores más peligrosos son los que más  se le parecen. Las diferencias entre la empresa y sus competi-  dores son el fundamento de su ventaja. Si tenéis empresas y  son viables, ya tenéis alguna clase de ventaja, no importa  cuán pequeña o sutil... El objetivo es agrandar el alcance de  su ventaja, lo que sólo puede conseguirse a costa de otro ”.  B. D.     He nderson (1989).  Estrategias ok.qxd   21/3/05  17:25  Página 13 \nEn la sociedad del siglo XXI impera la planificación; prác-  ticamente  la  totalidad  de  los  aspectos  de  nuestras  vidas  están  planificados.  Planificamos  nuestro  futuro  cuando  somos  jóvenes,  planificamos  nuestra  carrera  profesional,  planificamos la educación de nuestros hijos antes de que  nazcan, etc. En la vida personal como en el mundo de los  negocios  cualquier  ausencia  de  planificación  puede  con-  ducirnos irremediablemente al caos y al fracaso.   Si     no  estamos  dispuestos  a  abandonar  a  la  suerte  del  azar los aspectos fundamentales de nuestra vida, tampo-  co  deberíamos  hacerlo  con  nuestros  negocios,  ya  que  al  fin  y  al  cabo  son  determinantes  en  nuestro  porvenir  co-  mo personas.  En  ocasiones,  conocemos  negocios  de  alta  rentabilidad  y  r esultados óptimos que en un momento del tiempo se es-  tancan, entran en recesión e incluso en quiebra. ¿Es cosa  del  azar,  la  mala  suerte?  ¿Se  ha  producido  un  cambio  re-  pentino  en  la  demanda,  en  el  mercado?  ¿Podríamos  ha-  ber previsto ese futuro a tiempo de cambiar las cosas?  No   sólo podríamos, sino que además deberíamos haberlo  hecho.  La  evolución  del  mundo  empresarial  hacia  una  competencia  cada  vez  más  agresiva  nos  obliga  a  no  con-  formarnos  con  mantenernos  en  el  tiempo,  nos  obliga  a  estar  permanentemente  alerta  y  con  el  deseo  de  progre-  sar, crecer y ser más rentables, eficaces y competitivos; de  otro modo estamos destinados al fracaso.  “ El     mundo  es  un  teatro  de  cambios  y  ser  constante  en  la  naturaleza  sería  una  inconstancia ”.     A.  Cowley  (1617-  1668), diplomático y escritor inglés.  La  decisión  de  elaborar  un  Plan  Estratégico  es  sólo  uno  de  los  aspectos  que  demuestra  que  nuestra  organización  posee  ese  deseo  de  planificar,  de  crecer,  de  marcar  las  pautas de la evolución de la organización.  El  Plan  Estratégico  es  un  excelente  ejercicio  para  trazar  las  líneas  que  marcarán  el  futuro  de  nuestra  empresa.  D ebemos ser capaces de diseñar el porvenir de la empre-  sa  y,  lo  que  es  más  importante,  transmitir  estas  pautas,  contrastarlas  y  convencer  al  resto  de  los  agentes  que  interactúan  con  la  organización  de  cuál  es  el  camino  ha-  cia  el  éxito.  Como  bien  afirma  G.K.  Chesterton  (1874-  1936): “ La     idea  que  no  trata  de  convertirse  en  palabras  es  una  mala  idea,   la  palabra  que  no  trata  de  convertirse  en  acción, es a su vez una mala palabra ”.  ¿Por  qué  consideramos  el  Plan  Estratégico  como  un  sím-  bolo  de  planificación,  de  organización  y  de  encauza-  miento de cualquier negocio hacia la consecución de sus  objetivos?  Un     P lan Estratégico es el documento que sintetiza a nivel  económico-financiero,  estratégico  y  organizativo  el  posi-  cionamiento actual y futuro de la empresa.  ¿Por  qué  hablamos  de  tres  niveles?  Porque  el  Plan  Estra-  tégico  debe  revisar  todas  las  áreas  de  la  empresa  inclui-  das  en  estos  tres  niveles.  Debe,  además,  someterlas  a  examen  y  determinar  la  estrategia  a  seguir  en  lo  que  concierne  a  las  variables  que  como  empresa  podemos  controlar, así como predecir la evolución de las variables  externas  que  afectan  inevitablemente  a  la  evolución  de  la empresa.  Si     usted  es  empresario  y  está  leyendo  este  libro,  en  prin-  cipio  es  porque  existen  aspectos  de  su  organización  que  le preocupan y/o inquietan. Un Plan Estratégico es siem-  pre útil para definir:  • Cuál es el momento  presente  que vive la empresa y  cómo se ha llegado hasta aquí.  •  Cuál  es  el   objetivo   que  nos  hemos  marcado  como  empresa, a dónde queremos llegar.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 14  ¿Qué es un Plan Estratégico?  Estrategias ok.qxd   21/3/05  17:25  Página 14 \nM anifestar dichas preocupaciones no es suficiente, en los  negocios  como  en  la  vida  se  trata  de  ser  proactivo  y  no  r eactivo;  cuanto  más  conscientes  seamos  de  nuestra  si-  tuación  y  adoptemos  las  medidas  necesarias  para  con-  vertir esta situación en la situación más parecida a nues-  tro objetivo, mayor será nuestra probabilidad de éxito.  En  el  contexto  de  un  mercado  global  en  el  que  competi-  mos  hoy,  no  podemos  contentarnos  con  estar  presentes,  con  navegar  a  la  deriva  esperando  que  los  hechos  se  su-  cedan, se trata ante todo de fijarse un rumbo y poner los  medios para seguir la dirección que nos hemos marcado,  como bien dice S. Covey (1997): “ Pa ra     un velero sin rum-  bo, cualquier viento es favorable ”.   E videntemente  aquel  que  no  se  fija  objetivos,  no  corre  el  r iesgo de no cumplirlos, pero tampoco alcanza el éxito.  El  Plan  Estratégico  es,  por  lo  tanto,  un  documento  cuya  elaboración  nos  obligará  a  plantearnos  dudas  acerca  de  nuestra  organización,  de  nuestra  forma  de  hacer  las  co-  sas,  y  a  marcarnos  una  estrategia  en  función  de  nuestro  posicionamiento actual y del deseado.  Este ejercicio de reflexión será determinante en el porve-  nir  de  la  empresa  y  en  la  imagen  de  la  misma  en  el  exte-  r ior,  porque  la  intención  de  mejorar,  de  marcarse  objeti-  vos,  de  fijarse  una  meta  no  sólo  nos  beneficia  a  nosotros  mismos como organización, sino que además contribuye  a  dar  una  imagen  seria  y  organizada  de  la  empresa  en  el  exterior.  El Plan Estratégico es además la tarjeta de presentación de  la  idea  del  emprendedor  frente  a  todos  los  grupos  con  los  que  la  empresa  pretende  entablar  relaciones:  accionistas,  entidades  financieras,  trabajadores,  clientes,  proveedores,  etc. Por ello, el emprendedor debe recoger en el plan estra-  tégico  toda  la  información  relativa  a  la  puesta  en  marcha  del negocio.  A modo de conclusión, podríamos terminar este apartado  con  la  siguiente  definición  de  Plan  Estratégico  aportada  por Dess y Lumpkin (2003): “ E ntendemos por Plan Estraté-  gico  el  conjunto  de  análisis,   decisiones  y  acciones  que  una  organización  lleva  a  cabo  para  crear  y  mantener  ventajas  comparativas sostenibles a lo largo del tiempo ”.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   15  ¿Por qué realizar un Plan Estratégico?  El objetivo del Plan Estratégico puede variar en función de  diversos  aspectos;  del  tipo  de  empresa,  de  la  situación  económico-financiera de la misma, de la madurez del ne-  gocio,  etc.  En  cualquier  caso,  lo  que  no  varían  son  los  be-  neficios de realizar un Plan Estratégico, ya que sea cual sea  la estructura, el tipo de negocio, el tamaño o el posiciona-  miento en el mercado de la organización empresarial, nos  permite  analizar  la  viabilidad  técnica,  económica  y  finan-  ciera del proyecto empresarial.   El  Plan  Estratégico,  realizado  de  una  forma  sistemática,  proporciona  ventajas  notables  para  cualquier  organiza-  ción empresarial:  • Obliga a la Dirección de la empresa a pensar, de forma  sistemática, en el  futuro .  •  Identifica  los   cambios   y  desarrollos  que  se  pueden    esperar.  • Aumenta la  predisposición   y preparación de la empre-  Estrategias ok.qxd   21/3/05  17:25  Página 15 \nLa  planificación  estratégica  no  es  en  sí  misma  una  ga-  r antía de éxito, es el primer paso en la selección y defini-  ción  de  un  rumbo  cuyo  objetivo  final  es  la  permanencia  y el éxito de la empresa en el mercado.  El  desarrollo  de  una  estrategia  debe  entenderse  como  una combinación de procesos, a lo largo de los cuales los  agentes  involucrados  pueden  incurrir  en  una  serie  de  errores.   Entre  los  peligros  que  conlleva  la  formalización  de  la  planificación  estratégica,  siguiendo  a  H.  Mintzberg,  (1994):  • El éxito o el fracaso de la aplicación de la estrategia  está fuertemente unido a la capacidad de los respon-  sables  de  la  misma.  En  la  definición  de  la  estrategia  de una organización es necesario tener en cuenta las  dimensiones  culturales  y  políticas  de  la  misma,  un  proceso de planificación no debe poderse extrapolar  de  una  organización  a  otra,  incluso  cuando  tienen  comportamientos  similares  y  operan  en  el  mismo  sector.   La  estrategia  de  Coca-Cola  nunca  podría  aplicarse  a  P epsi, a pesar de que operen en el mismo mercado y  compartan prácticamente al 50% el mismo.  •  La  definición  de  la  estrategia  en  la  mayoría  de  ca-  sos  es  responsabilidad  del  Departamento  de  Planifi-  cación o de un equipo de altos directivos, por lo tan-  to, no tiene por qué ser compartida por el resto de la  organización. Cuando sólo una parte de la organiza-  ción tiene acceso a la información relativa a las deci-  siones  estratégicas,  existe  el  peligro  de  que  el  resto  de  la  organización  no  se  sienta  partícipe  del  proyec-  to  o  no  comparta  las  decisiones  tomadas  acerca  del  futuro de la compañía.  •  Los  directivos  responsables  de  la  aplicación  de  las  estrategias  pueden  estar  saturados  con  la  operativa  diaria de la organización y deciden ceder el control y  la responsabilidad de las funciones estratégicas a es-  pecialistas.  Sin  embargo,  los  especialistas  no  tienen  poder en la organización para hacer que las cosas se  hagan.  El  resultado  puede  ser  que  la  planificación  estratégica se convierta en un objetivo idílico ajeno a  la realidad operativa de la empresa.  •  En  las  grandes  compañías,  el  proceso  de  planifica-  ción  estratégica  puede  resultar  complicado,  de  for-  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 16  P eligros de la Planificación Estratégica  sa para el cambio.  • Mejora la  coordinación   de actividades.  • Minimiza las respuestas no racionales a los eventos in-  esperados ( anticipación ).  •  Reduce  los   conflictos   sobre  el  destino  y  los  objetivos  de la empresa.  • Mejora la  comunicación .  • Los  r ecursos   disponibles se pueden ajustar mejor a las  oportunidades.  • El plan proporciona un marco general útil para la revi-  sión continuada de las  actividades .  • Un enfoque sistemático de la formación de estrategias  conduce a niveles más altos de  r entabilidad sobre la in-  v ersión   (creación de valor).  Estrategias ok.qxd   21/3/05  17:25  Página 16 \nma que los agentes o grupos de la empresa contribu-  y en  sólo  parcialmente,  no  entendiendo  la  globali-  dad. Esto es particularmente relevante en las empre-  sas de gran tamaño.  • Si la compañía tiene miras restringidas, existe el peli-  gro  de  acabar  confundiendo  contenido  y  continente.  La estrategia de la empresa no es lo mismo que el plan  estratégico.  La  estrategia  es  la  dirección  a  largo  plazo  que  sigue  la  organización  y  no  un  documento  escrito  depositado en el despacho de los directivos.  •  El  exceso  de  detalle  en  el  proceso  de  planificación  estratégica  puede  derivar  en  análisis  exhaustivos  que,  aun  siendo  sólidos  por  sí  mismos,  pueden  no  tener en cuenta los principales aspectos estratégicos  de  la  organización.  En  ocasiones,  en  las  empresas  existe  un  exceso  de  papeleo  administrativo  que  ge-  nera sobrecarga de trabajo, del que no se obtiene be-  neficio alguno.  •  La  planificación  puede  terminar  perdiéndose  en  la  búsqueda  de  determinantes  de  los  últimos  resul-  tados  (indicadores  económicos,  datos  del  sector,  evolución  de  variables  del  entorno,  etc.)  o  de  la  es-  trategia  correcta.  Resulta  improbable  que  la  estrate-  gia  correcta  surja  de  forma  natural  del  proceso  de  planificación.  Puede  ser  más  importante  definir  una  dirección  estratégica  más  general,  en  la  que  exista  cierto grado de flexibilidad.  T eniendo  en  cuenta  los  límites  que  presenta  el  proceso  de  planificación  estratégica  e  intentando  evitar  los  erro-  r es  más  comunes,  la  organización  debe  desarrollar  el  proceso  estratégico  más  adecuado,  realista  y  efectivo  que conduzca al éxito.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   17  ¿Quién debe realizar un Plan Estratégico?  La  idea  del  Plan  Estratégico  debe  surgir  de  la  dirección  de  la  organización,  del  dueño,  de  la  directiva,  del  geren-  te,  en  función  de  la  estructura  de  la  sociedad.  Es  decir,  de  la  persona  o  personas  cuya  misión  es  dirigir  la  em-  presa hacia el éxito.  En  ocasiones,  la  ayuda  de  un  experto  es  imprescindible  para  elaborar  un  Plan  Estratégico  que  sea  útil,  creíble  y  técnicamente coherente.  El  paralelismo  con  la  salud  de  las  personas  es  muy  útil,  cuando  simplemente  nos  encontramos  resfriados  o  con  un  dolor  leve,  solemos  automedicarnos  acudiendo  sim-  plemente a la farmacia más cercana. Sin embargo, cuan-  do el mal que sufrimos es de mayor gravedad y nuestros  conocimientos  nos  impiden  sacar  conclusiones  objeti-  v as acerca del origen del mismo, acudimos a un especia-  lista.  No  se  nos  ocurriría  en  este  caso  automedicarnos  porque  el  diagnóstico  supera  nuestra  capacidad  de  co-  nocimiento.   Si     no somos capaces de dejar en manos de un inexperto  nuestra  salud  y  no  nos  aventuramos  a  sacar  conclusio-  nes  acerca  de  un  campo  que  desconocemos,  ¿por  qué  deberíamos hacerlo con la salud de nuestro negocio?  La  falta  de  formación  del  empresario  y  su  afán  de  logro  puede  provocar  una  especie  de  optimismo  excesivo  que  le hace creer que todo es posible. Esa visión empresarial,  la  capacidad  de  generar  ideas  nuevas  beneficiosas  para  Estrategias ok.qxd   21/3/05  17:25  Página 17 \nel  negocio,  es  fundamental,  pero  debe  ir  siempre  acom-  pañada en la planificación de un análisis coherente de la  posibilidad  de  éxito  del  negocio,  un  análisis  hecho  con  “la cabeza” y no tanto “con el corazón”.  La  experiencia  avala  que  la  decisión  de  acudir  a  profe-  sionales  externos  para  tratar  asuntos  que  pueden  diferir  de  las  capacidades  diarias  de  una  organización  o  cuya  dedicación  supone  un  coste  de  oportunidad  excesiva-  mente elevado, es una decisión que garantiza el éxito del  proyecto.  La clave de éxito del proyecto es la correcta planificación  del  mismo  y  la  perfecta  coordinación  entre  la  organiza-  ción  y  los  profesionales  externos.  Sólo  en  el  caso  en  el  que  estas  premisas  se  cumplan,  el  grado  de  satisfacción  de ambas partes será elevado y el proyecto será conside-  r ado como un éxito.  El  trabajo  en  equipo  es  siempre  una  garantía  de  éxito:  cuando  se  equilibra  lo  que  se  desea  hacer  con  la  capaci-  dad para hacerlo es cuando mas probabilidades de éxito  alcanza  el  proyecto.  Toda  la  organización  debe  involu-  crarse en la ejecución del Plan Estratégico.  N adie  conoce  la  organización  de  la  empresa  mejor  que  su creador, su gerente y el equipo que trabaja diariamen-  te en ella. Por ello, en la ejecución de un plan estratégico  coherente y realista debe participar toda la organización  o,     en su caso, aquellas personas que desempeñan activi-  dades  que  suponen  toma  de  decisiones  determinantes  en la evolución de la sociedad.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 18  Estrategias ok.qxd   21/3/05  17:25  Página 18 \nEn la elaboración de un Plan Estratégico podemos distinguir  tres etapas fundamentales: F igura 1: Fases del Plan Estratégico  El esquema detallado de las tres fases del Plan Estratégico es  el siguiente:  1.   El  análisis  estratégico ,  puede  ser  considerado  como  el  punto inicial del proceso. Consiste en el trabajo previo que  debe ser realizado con el fin de formular e implantar eficaz-  mente  las  estrategias.  Para  ello,  es  necesario  realizar  un  completo análisis externo e interno que constaría de los si-  guientes procesos:  • Analizar los propósitos y los objetivos organizativos. La   visión,   misión  y  objetivos  estratégicos   de  una  empresa  forman una jerarquía de metas que se alinean desde am-  plias declaraciones de intenciones y fundamentos para la  ventaja  competitiva  hasta  específicos  y  mensurables  ob-  jetivos estratégicos.   •    Analizar  el   entorno .  Es  necesario  vigilar  y  examinar  el  entorno así como analizar a los  competidores . Dicha in-  formación es crítica para determinar las oportunidades y  amenazas en el entorno.   ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   19  Fa ses de elaboración de un Plan Estratégico  Análisis  Estratégico  Implantación   de la Estrategia  Formulación  Estratégica  F igura 2: Esquema detallado de las fases del Plan Estratégico   ANÁLISIS  DIAGNÓSTICO   ELECCIÓN DE ESTRATEGIAS  IMPLANTACIÓN DE ESTRATEGIAS  F ASE I (METAS)   Esquema del Plan Estratégico   V isión, Misión y Valores Corporativos   Unidades Estratégicas de Negocio  F ASE III   (DIAGNÓSTICO ESTRATÉGICO)   Análisis DAFO   Análisis CAME  F ASE IV   (ELECCIÓN DE ESTRATEGIAS)   Definición del Negocio   Estrategia Corporativa (Cartera de Negocio)   Estrategia Competitiva   Estrategias Funcionales  F ASE V   (IMPLANTACIÓN DE ESTRATEGIAS)   Diseño de la Organización   Planes de Acción  F ASE II (ESTADO ACTUAL)   Análisis del Entorno:  • Entorno General  • Entorno Competitivo   Análisis Interno:  • Cadena de Valor  Estrategias ok.qxd   21/3/05  17:25  Página 19 \nPr oporcionamos dos niveles de entorno:  •  El   entorno  general ,  que  consta  de  varios  elementos  que denominaremos los segmentos políticos, económi-  cos,  tecnológicos  y  sociales,  segmentos  en  los  que  se  producen  tendencias  y  eventos  clave,  con  un  impacto  potencial dramático en la empresa.  •  El   entorno  sectorial  o  entorno  competitivo ,  que  se  encuentra  más  cercano  a  la  empresa  y  que  está  com-  puesto por los competidores y otras organizaciones que  pueden  amenazar  el  éxito  de  los  productos  y  servicios  de la empresa.  •  Análisis interno . Dicho análisis ayuda a identificar tan-  to  las  fortalezas  como  las  debilidades  que  pueden,  en  parte,  determinar  el  éxito  de  una  empresa  en  un  sector.  Analizar  las  fortalezas  y  relaciones  entre  las  actividades  que  comprenden  la  cadena  de  valor  de  una  empresa  puede  constituir  un  medio  de  descubrir  fuentes  poten-  ciales de ventaja competitiva para la empresa.  • Valorar los  activos intangibles   de la empresa. El conoci-  miento de los trabajadores y otros activos intelectuales o  intangibles  de  una  empresa  es  fundamental,  puesto  que  son  cada  vez  más  importantes  como  inductores  de  ven-  tajas  competitivas  y  de  creación  de  riqueza  en  la  econo-  mía  actual.  Además  del  capital  humano,  valoraremos  el  grado  en  el  que  la  organización  crea  redes  y  relaciones  entre sus empleados, clientes, proveedores y aliados.  2. La formulación estratégica   de una empresa se desarrolla  en varios niveles:  •    E strategias  corporativas .  La  estrategia  corporativa  se  dedica a cuestiones que conciernen a la cartera de nego-  cios de la empresa. Dicha estrategia se centra en dos pre-  guntas:  • ¿En qué negocios deberíamos competir?  •  ¿Cómo  podemos  gestionar  la  cartera  de  negocios  para  crear sinergias entre los negocios?  •  E strategia competitiva   o a nivel de unidad de negocio.  Las  empresas  de  éxito  se  esfuerzan  por  desarrollar  bases  para  lograr  una  ventaja  competitiva,  ventaja  que  pueda  consistir  en  un  liderazgo  en  costes  y/o  en  la  diferencia-  ción,  sea  especializándose  en  un  reducido  segmento  de  mercado  o  abarcando  un  sector  de  actividad  concreto  con un alcance amplio. •  E strategias operativas . Se considera que una empresa es  una  serie  de  funciones  (marketing,  producción,  recursos  humanos,  investigación  y  desarrollo,  etc.)  y  la  manera  de  entenderla  es  analizar  el  desempeño  de  cada  una  de  esas  funciones  con  relación  a  las  ejecutadas  por  la  competen-  cia. Para ello, utilizaremos el   Análisis de la Cadena de Valor .  El Análisis de la Cadena de Valor es una herramienta geren-  cial  para  identificar  fuentes  de  ventaja  competitiva.  El  pro-  pósito de analizar la cadena de valor es identificar aquellas  actividades de la empresa que pudieran aportarle una ven-  taja competitiva potencial. Poder aprovechar esas oportuni-  dades  dependerá  de  la  capacidad  de  la  empresa  para  des-  arrollar,  a  lo  largo  de  la  cadena  de  valor  y  mejor  que  sus  competidores, aquellas actividades competitivas cruciales.  3. La implantación estratégica   r equiere asegurar que la em-  presa posee adecuados controles estratégicos y diseños or-  ganizativos.  Es  de  particular  relevancia  garantizar  que  la  empresa  haya  establecido  medios  eficaces  para  coordinar  e integrar actividades, dentro de la propia empresa, así co-  mo con sus proveedores, clientes y socios aliados.  •    C onseguir  un  control  eficaz  de  la  estrategia .  Las  em-  presas son incapaces de implementar satisfactoriamente  las  estrategias  seleccionadas  a  menos  que  ejerciten  un  control estratégico eficaz.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 20  Estrategias ok.qxd   21/3/05  17:25  Página 20 \nEl  control  de  la  información  requiere  que  la  organización  vigile  y  examine  el  entorno,  y  responda  eficazmente  a  las  amenazas y oportunidades.  En este sentido, el Cuadro de Mando Integral se ha conver-  tido  en  el  instrumento  por  excelencia  para  asegurar  una  adecuada implantación de la estrategia en la empresa.  •    Cr ear  diseños  eficaces .  Para  triunfar,  las  empresas  deben  tener estructuras y diseños organizativos que sean coheren-  tes con su estrategia.  •  Cr ear una organización inteligente y ética . Una estrategia  de  liderazgo  eficaz  debe  dedicarse  a  establecer  una  direc-  ción, diseñar la organización y desarrollar una organización  comprometida con la excelencia y el comportamiento ético.   A demás, dado el rápido e impredecible cambio en el entor-  no competitivo actual, la estrategia de la empresa debe cre-  ar una empresa aprendedora. Esto permite que la organiza-  ción  pueda  beneficiarse  del  talento  individual  y  colectivo  existente dentro de la organización.  •   F omentar  el  aprendizaje  corporativo  y  la  creación  de  nuevas estrategias . El éxito actual no garantiza el éxito futu-  ro . Con el rápido e impredecible cambio en el mercado glo-  bal, las empresas, sea cual sea su tamaño, deben seguir bus-  cando  oportunidades  para  crecer  y  encontrar  nuevas  for-  mas  de  renovar  su  organización.  Dentro  de  las  corporacio-  nes,  el  comportamiento  emprendedor  autónomo  de  los  individuos  que  lideran  nuevos  productos  puede  surgir  de  cualquier  punto  de  la  organización,  cubriendo  funciones  y  actividades emprendedoras esenciales.  Al  hablar  de  Plan  Estratégico  de  la  empresa,  nos  estamos  r efiriendo al plan maestro en el que la alta dirección reco-  ge las decisiones estratégicas corporativas que adopta hoy  (es  decir,  en  el  momento  en  que  realiza  la  reflexión  estra-  tégica  el  equipo  de  dirección)  en  referencia  a  lo  que  hará  en el horizonte de planificación escogido que, por lo habi-  tual, suele ser de  tres años .  El horizonte temporal del Plan Estratégico vendrá definido  por  la  índole  de  las  decisiones  estratégicas  que  estemos  adoptando, así distinguimos:  • Decisiones estratégicas de mayor alcance (más de 10-  15 años).  • Decisiones estratégicas de largo alcance (3-5 años).  • Decisiones operativas (1 año o menos). Un     horizonte  temporal  de  3-5  años  es  el  período  más  ade-  cuado para que la sociedad tenga el tiempo suficiente para  poner en marcha los planes de acción, donde se materiali-  zan  las  estrategias  de  largo  alcance  y,  al  mismo  tiempo,  no  es  un  período  excesivamente  amplio  que  dé  lugar  al  plan-  teamiento  de  objetivos  de  mayor  alcance  cuya  definición,  alcance y seguimiento son cada vez más difíciles conforme  se amplía el horizonte temporal de planificación.  U na  sociedad  es  como  un  ser  vivo  que  evoluciona  cons-  tantemente por sí misma y en su entorno. El Plan Estraté-  gico  deberá  ser  revisado  en  el  horizonte  de  planificación  mediante revisiones anuales, con el fin de comprobar que  efectivamente  el  rumbo  que  tomamos  es  el  acertado  y  que vamos encaminados a la consecución de los objetivos  planteados.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   21  Ho ri z onte de Planificación  Estrategias ok.qxd   21/3/05  17:25  Página 21 \nS iguiendo  a  Gimbert  (2003),  podemos  afirmar  que “ ningún  método  o  criterio  de  evaluación  nos  garantiza ‘a  priori’, antes  de su puesta en práctica, que una estrategia tendrá éxito. A lo  máximo que podemos aspirar como empresa, de modo antici-  pado  a  la  aplicación  de  su  estrategia, es  a  conocer  si  ésta  no  funcionará debido a sus imperfecciones e incoherencias ”.  R umelt  (1980)  nos  ofrece  como  medio  para  detectar  que  la  estrategia no funcionará, antes de su puesta en práctica, una  serie  de  criterios,  a  modo  de  filtros,  de  manera  que,  si  en  al-  guno de ellos, la estrategia no pasa la prueba, podemos estar  seguros de que esta estrategia no iba a funcionar.   Estos filtros son:  1.  La  estrategia  deberá  tener  prevista  la  creación  o  manteni-  miento  de  una  ventaja  competitiva  ( filtro  de  la  ventaja  com-  petitiva ).  2.  La  estrategia  debe  representar  una  respuesta  adaptable  al  medio externo y a los cambios críticos que ocurren en él ( fil-  tro de la consonancia con el entorno ).  3.  La  estrategia  no  deberá  presentar  metas  y  políticas  incon-  sistentes entre sí ( filtro de la consistencia ).  4.  La  estrategia  no  debe  sobrepasar  los  recursos  disponibles  ( filtro de la factibilidad ).  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 22  Ca r acterísticas de una Estrategia con Éxito  Estrategias ok.qxd   21/3/05  17:25  Página 22 \nECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   23  METAS ESTRATÉGICAS  Estrategias ok.qxd   21/3/05  17:25  Página 23 \nOBJETIVOS DEL CAPÍTULO  • ¿Qué queremos que sea nuestra empresa? ¿Por qué exis-  timos?  ¿En  qué  negocios?  ¿Cómo  los  desarrollamos?  ¿En  qué creemos?  Las respuestas a estas preguntas son las declaraciones de  principios de nuestra organización: visión, misión y valo-  r es corporativos.  •  ¿En  qué  negocios  somos  competitivos?  ¿Dónde  se  con-  centra nuestra fuerza de venta? ¿En qué mercados ofrece-  mos nuestros productos/servicios?  •  Concepto  de  Unidad  Estratégica  de  Negocio  (UEN)  y  cartera de actividades.  ÍNDICE DEL CAPÍTULO  I. VISIÓN,  MISIÓN, VALORES  CORPORATIVOS Y  OBJETIVOS  ESTRATÉGICOS  II. UNIDADES ESTRATÉGICAS DE NEGOCIO (UEN)  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 24  Estrategias ok.qxd   21/3/05  17:25  Página 24 \nECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   25  Visión, Misión, Valores   Co r porativos y Objetivos Estratégicos  Las  organizaciones  deben  tener  claramente  articulados  las  metas  y  los  objetivos  para  canalizar  por  toda  la  organización  los  esfuerzos  de  los  individuos  hacia  fines  comunes.  Las  me-  tas  y  los  objetivos  también  proveen  medios  para  asignar  re-  cursos eficazmente.  La  visión,  misión  y  objetivos  estratégicos  de  una  empresa  for-  man una jerarquía de metas que se alinean desde amplias de-  claraciones de intenciones y fundamentos para la ventaja com-  petitiva hasta específicos y mensurables objetivos estratégicos.  C uando una empresa está elaborando su primer Plan Estraté-  gico, se suele enfrentar, por primera vez, a la definición de las  decisiones estratégicas de más largo alcance: la  visión , la  mi-  sión ,  el   propósito  estratégico   (misión+visión)  y  los   v alores  corporativos .  Pa ra   las empresas que ya han elaborado un proceso de refle-  xión  estratégica  a  lo  largo  de  su  historia,  se  trata  de  hacer  una  revisión  de  declaraciones  previamente  definidas;  a  pe-  sar de ello, se requiere un esfuerzo de reflexión para redefinir  estas declaraciones institucionales de máximo nivel y alcan-  ce temporal. F igura 3: Decisiones estratégicas de más largo alcance   F uente: Adaptación de R.S. Kaplan y D.P. Norton (2001)  DEFINICIÓN DE LA VISIÓN   El  punto  de  comienzo  para  articular  la  jerarquía  de  metas  de  una  empresa  es  la   visión   de  una  compañía,  que  podía-  mos definir como la declaración que determina dónde que-  r emos  llegar  en  el  futuro.  Una  visión  puede  o  no  puede  te-  ner  éxito,  depende  de  si  el  resto  sucede  según  la  estrategia  de la empresa. Las  características  de  la  visión  de  una  sociedad  son  las  si-  guientes: •  Es  un  objetivo  ampliamente   inspirador ,  engloba  el  resto  de objetivos y es a   largo plazo .  •  Aunque  las  visiones  no  pueden  ser  medidas  por  un  in-  dicador  específico  que  valore  el  grado  en  el  que  están  siendo  alcanzadas,  proporcionan  una   declaración  fun-  damental  de  los  valores,   aspiraciones   y    metas   de  una  organización.  •  Las  visiones  van  obviamente  mucho  más  allá  de  los  simples  objetivos  financieros  y  luchan  por   capturar   tan-  to las  mentes   como los  corazones de los empleados .  •  Desarrollar  e  implantar  una  visión  es  uno  de  los  papeles  centrales del  líder .  • Debe evocar imágenes mentales poderosas y motivadoras  (un  eslogan,  un  diagrama  o  imagen),  cualquier  cosa  que   enganche la atención .  • Responde a la pregunta:  ¿QUÉ QUEREMOS SER?  En  la  definición  de  la  visión  de  la  sociedad  debemos  evitar  errores del tipo:  • Debe existir  coherencia   entre la visión y la actuación de la  dirección, no siendo una expresión de mera palabrería, le-  jos de la realidad.  • La visión debe estar anclada en la  r ealidad   y relacionada  con  las  amenazas  y  oportunidades  del  entorno  o  con  los  r ecursos y capacidades de una organización.  VISIÓNQué queremos ser MISIÓNPor qué existimos V ALORESEn qué creemos OBJETIVOS ESTRATÉGICOSQué debemos hacer OBJETIVOS Y METAS   a medio y corto plazoQué pasos debemos dar  Estrategias ok.qxd   21/3/05  17:25  Página 25 \n• Una visión simplemente no puede ser considerada como  una  cura mágica   para la enfermedad de una organización.  •  La  gente  siente  dificultad  para  identificarse  con  una  vi-  sión  que  pinta  un  gráfico  futuro  color  rosa,  pero  no  tiene  en cuenta el  entorno hostil,   en el cual la empresa compite,  o ignora algunas de las  debilidades   de la empresa.  Algunos ejemplos de visión de empresas:  DEFINICIÓN DE LA MISIÓN   La  misión   de una compañía difiere de la visión en que abarca  tanto el propósito de la compañía como la base de la compe-  tencia y la ventaja competitiva.  Mi entras  que  la  declaración  de  visión  es  amplia,  la  declara-  ción de misión ha de ser más específica y centrada en los me-  dios a través de los cuales la empresa competirá.  Las  características  de  la  misión  de  una  sociedad  son  las    siguientes:  •  Abarca  tanto  el   propósito  de  la  compañía   como  la  base  de  competencia   y la  v entaja competitiva .  •  Declaración  más   específica   y  centrada  en  los   medios   a  través de los cuales la empresa competirá.  • Incorpora el concepto de gestión de los   grupos de inte-  rés , sugiriendo que las organizaciones deben responder a  múltiples agentes relacionados con ellas para sobrevivir y  prosperar.  •  Una  buena  declaración  de  misión  debe  comunicar  por-  que una organización es  especial   o diferente.  • La misión debería cambiar cuando las condiciones com-  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 26  EJEMPLOS DE LA VISIÓN DE UNA EMPRESA  “ Se r marca líder de tecnología punta en el mundo audiovisual  en un entorno de crecimiento rentable y sostenido ”. E   mpresa  fabricante de televisores, equipos de sonido, etc.  “ Se r marca líder en el territorio nacional en edificación y servi-  cios relacionados con la construcción en un entorno de creci-  miento rentable y sostenido ”.       Empresa constructora.  “ S er una empresa de referencia en el mercado nacional e inter-  nacional de maquinaria auxiliar del sector de la automoción,  ofreciendo un servicio correcto y de calidad-precio adecuado,  que aporte seguridad, comodidad y fiabilidad al puesto de tra-  bajo al que se dirige en un entorno en el que los distribuidores  se sientan plenamente respaldados ”.       Empresa de maquinaria  auxiliar del sector de automoción.  “ S er el proveedor mundial líder de materiales para la intercone-  xión de alto rendimiento y servicios relacionados para los mer-  cados de ensamblaje de productos electrónicos y componentes.  Pa ra   lograrlo, nos concentraremos en innovación y servicio  ex cepcional para nuestros clientes en todo el mundo ”. E   mpresa  fabricante de materiales para la interconexión de alto rendi-  miento y servicios relacionados.  “ S er una empresa con una sólida estructura organizacional que  proporcione bienestar a  sus empleados, clientes y proveedores.  Consolidar el liderazgo regional de nuestra empresa, sostenien-  do un crecimiento y mejora integral en nuestra organización,  proyectando confianza en nuestro trabajo ”.       Empresa distribui-  dora de agua purificada.  “ S erá una empresa petrolera estatal, con autonomía adminis-  trativa, que ampliará su marco de acción considerando la com-  petencia y la imagen de sus productos. La empresa será eficien-  te, con personal calificado, integrada en forma vertical y aliada  estratégicamente con el sector privado, bajo el marco del mono-  polio natural que esta actividad representa, de manera compe-  titiva a nivel internacional ”.       Empresa petrolera estatal.  Estrategias ok.qxd   21/3/05  17:25  Página 26 \npetitivas cambian dramáticamente o la empresa se enfren-  ta a nuevas amenazas y oportunidades.  • La misión es algo que debe ser acometido. El objetivo pri-  mordial  hacia  el  que  debe  dirigir  los   planes    y    programas  que se marque.  • Responde a la pregunta:  ¿POR QUÉ EXISTIMOS?   ¿EN QUÉ NEGOCIOS? ¿CÓMO LOS DESARROLLAMOS?  Algunos ejemplos de misión de empresas:  V ALORES CORPORATIVOS  Los valores corporativos son los ideales y principios colectivos  que  guían  las  reflexiones  y  las  actuaciones  de  un  individuo  (por ejemplo la lealtad a la propia familia), o un grupo de indi-  viduos (la solidaridad o el principio darwiniano de que sobre-  vivan los mejores). Son los ejes de conducta de la empresa y es-  tán íntimamente relacionados con los propósitos de la misma.  D ebemos responder a la pregunta de   ¿En qué creemos?  F igura 4: Conducta de la empresa: los valores intangibles  Los valores corporativos definen el carácter de una empresa y  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   27  CONDUCTA DE LA EMPRESA  ¿EN QUÉ CREEMOS?  EJEMPLOS DE LA MISIÓN DE UNA EMPRESA  “ Satisfacemos los deseos de tecnología punta, diseño vanguar-  dista y calidad en el mundo audiovisual, haciendo realidad  los deseos que nos confían nuestros clientes, comprometiéndo-  nos a diseñar cada pieza con profesionalidad y ética empresa-  rial, asegurando de este modo tanto la satisfacción de nuestros  clientes como del resto de grupos de interés de la sociedad ”.  Empresa fabricante de televisores, equipos de sonido, etc.  “ Satisfacemos la necesidad de construcción y de servicios rela-  cionados con la construcción en el territorio nacional, hacien-  do realidad los proyectos que nos confían nuestros clientes,  comprometiéndonos a construir cada obra con profesionali-  dad y ética empresarial, asegurando de este modo tanto la  satisfacción de nuestros clientes como del resto de grupos de  interés ”.       Empresa constructora.  “ C ubrimos las necesidades de diseño, fabricación, comerciali-  zación y servicio de asistencia técnica de maquinaria auxiliar  para el sector de la automoción (elevadores y equipos de lubri-  cación y engrase) ”.       Empresa de maquinaria auxiliar del sector  de automoción.  “ Ofrecer productos de calidad, a tiempo, con una excelente  actitud de servicio a precios accesibles e inmejorables, para  satisfacer las expectativas  de los consumidores de agua purifi-  cada. ” Empresa distribuidora de agua purificada  “ E mpresa petrolera estatal costarricense que contribuye con  el desarrollo energético nacional, cuya misión es satisfacer  tanto la demanda nacional de los combustibles derivados  del petróleo como la de los cementos asfálticos, con un alto  nivel de excelencia y cuidado del ambiente ”. E   mpresa  petrolera estatal.  Identidad  Corporativa  Filosofía  Empresarial  V alores   Corporativos  Estrategias ok.qxd   21/3/05  17:25  Página 27 \ndescriben  aquello  que  la  empresa  representa,  por  lo  tanto,  suelen estar definidos como parte del conjunto de proposicio-  nes que constituyen la identidad corporativa de la empresa.  Los  valores  dominantes  aceptados  por  la  empresa  se  pueden  expresar  en  términos  de  rasgos  de  identidad  de  la  organiza-  ción. La concreción de estos valores en criterios de actuación,  actitudes y comportamientos coherentes en todas las áreas de  actividad de la organización da lugar a una serie de principios  que conforman la cultura empresarial.  Los  valores  predominantes  en  las  sociedades  de  occidente  son la orientación al cliente, la importancia de la honestidad,  la  integridad  o  los  principios  éticos,  los  compromisos  con  la  calidad,  la  innovación,  la  importancia  de  la  protección  del  medio ambiente, etc.  La  filosofía empresarial   establece las reglas de conducta por  las que debe regirse la organización. Traduce los valores cor-  porativos de la empresa a descripciones más concretas de có-  mo aplicar los valores corporativos en la gestión de la organi-  zación. Sirve, por tanto, para orientar la política de la empre-  sa hacia los diferentes grupos de referencia.  La filosofía empresarial responde a la pregunta de  ¿cómo ha-  cemos las cosas?  La   identidad corporativa   de una empresa debe entenderse co-  mo el conjunto de características (atributos) que permiten dife-  r enciarla de otras organizaciones.   R esponde a la pregunta de  ¿Quiénes somos?  Encontramos la respuesta a esta pregunta en las declaraciones  de la visión y de la misión de la sociedad, y también en sus valo-  r es corporativos porque lo que hacemos, en qué negocios y có-  mo lo hacemos define quiénes somos.  OBJETIVOS ESTRATÉGICOS   H asta aquí hemos hablado tanto de la visión como de la misión.  La declaración de visión de la sociedad tiende a ser bastante am-  plia y puede ser descrita como una meta que representa un des-  tino  último  inspirador  y  motivador.  En  el  otro  lado,  la  declara-  ción de la misión es más específica y se refiere a cuestiones que  conciernen a la razón de ser de la organización y las bases de su  deseada ventaja competitiva en el mercado.  Los objetivos estratégicos se utilizan para hacer operativa la de-  claración de misión, es decir, ayudan a proporcionar dirección a  cómo la organización puede cumplir o trasladarse hacia los ob-  jetivos más altos de la jerarquía de metas, la visión y la misión.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 28  EJEMPLOS DE VALORES CORPORATIVOS DE UNA EMPRESA  • Con altos estándares de calidad.  • Con acabados del diseño más vanguardista.  • Con políticas de investigación y desarrollo que nos permitan  obtener la tecnología punta.  • Con seriedad en el compromiso que se adquiere con  el cliente.  • Con amparo de una marca de garantía.  • Con criterio de rentabilidad y creación de valor para el  accionista.  • Con vocación de liderazgo, capaz de dar respuesta a las necesi-  dades de la sociedad.  • Con cultura de calidad, competitividad, diseño vanguardista,  tecnología punta y ética empresarial. • En continua búsqueda de la satisfacción de los clientes y en  actitud de colaboración y confianza con nuestros proveedores. • Con una estructura integrada por personas con iniciativa,  motivadas, identificadas con el proyecto de la empresa y en per-  manente desarrollo profesional.  Estrategias ok.qxd   21/3/05  17:25  Página 28 \nEstablecer objetivos requiere un criterio para medir el cumpli-  miento  de  los  mismos.  Si  un  objetivo  pierde  especificidad  o  mensurabilidad, no es útil, simplemente porque no hay mane-  ra     de  determinar  si  está  ayudando  a  la  organización  a  avanzar  hacia la misión y visión organizativa.  Pa ra     que  los  objetivos  tengan  sentido  necesitan  satisfacer  va-  r ios criterios:  •  M ensurables.   D ebe haber al menos un indicador o criterio  que mida el progreso hacia el cumplimiento del objetivo.  •  E specíficos.   Esto proporciona un claro mensaje en cuanto a  qué necesita ser realizado.  •  Ap r opiados.   D ebe ser consistente con la visión y misión de  la organización.  •  R ealistas.   D ebe ser un objetivo alcanzable dadas las capaci-  dades de la organización y las oportunidades del entorno. En  esencia, debe ser desafiante y factible.  •  Op ortuno.   R equiere tener un plazo de tiempo para el cum-  plimiento del objetivo.  C uando  los  objetivos  satisfacen  los  criterios  anteriores,  se  dan  muchos beneficios para la organización:  •  Ayudan  a  dirigir  a  los  trabajadores  de  toda  la  organización  hacia metas comunes. Esto ayuda a  concentrar y conservar  r ecursos  valiosos   en  la  organización  y  a  trabajar  conjunta-  mente de un modo más apropiado.  • Los objetivos desafiantes pueden ayudar a  motivar e inspi-  rar a los trabajadores  de la organización hacia mayores nive-  les  de  compromiso  y  esfuerzo.  Empíricamente,  ha  sido  de-  mostrado  que  los  individuos  trabajan  más  duro  cuando  lu-  chan  por  objetivos  específicos  que  cuando  se  les  pide  sim-  plemente que lo hagan lo mejor que puedan.  • Siempre existe la posibilidad de que las diferentes partes de  la  organización  persigan  sus  propias  metas  en  lugar  de  las  metas de la totalidad de la organización. Aunque bien inten-  cionados, pueden actuar como propósitos que se cruzan con  los de la organización como conjunto. En esos casos, los ob-  jetivos  significativos  pueden   ayudar  a  resolver  conflictos  cuando surjan.  • Cuando los objetivos son los más apropiados, proporcionan  un  criterio  para  fijar  las  recompensas  e  incentivos.  No  sola-  mente  motivarán  en  mayor  medida  a  sus  empleados,  sino  que  también  ayudaran  a  asegurar  un  mejor  sentido  de  la   equidad e imparcialidad en la asignación de recompensas .  En la tabla siguiente, presentamos algunos ejemplos de objeti-  vos estratégicos que puede plantearse su organización: Estos objetivos, junto con aquellos que son aún más específi-  cos  (objetivos  a  corto  plazo,  componentes  esenciales  de  los  planes de acción), son críticos en la implantación de la estra-  tegia elegida por la sociedad, por ello serán definidos de for-  ma específica más adelante.  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   29  EJEMPLOS DE OBJETIVOS ESTRATÉGICOS DE UNA EMPRESA  • “Incrementar el valor económico de la corporación”  • “Crecimiento de la cifra de negocios”  • “Incrementar la rentabilidad”  • “Sostenibilidad”  • “Incrementar la cifra de ventas en las líneas de negocio”  • “Fidelización de la clientela”  • “Ofrecer al cliente una gama de productos y servicios excelentes”  • “Mantener y mejorar la reputación de marca”  • “Alcanzar la excelencia en la gestión de compras”  • “Gestión ABC de artículos”  • “Desarrollar una estructura organizativa coherente   y definida”  • “Motivación de la organización”  Estrategias ok.qxd   21/3/05  17:25  Página 29 \nLa  Unidad  Estratégica  de  Negocio  se  define  como  una  parte  de  la  empresa  cuyos  productos  o  servicios,  fuerza  de  ventas,  competidores y clientes son significativamente diferentes del  r esto de las actividades de la empresa.  Se  sustenta básicamente en tres dimensiones:  • El servicio o la función base aportada por el producto al  cliente ( producto ).  •  Las  tecnologías  existentes,  susceptibles  de  producir  la  función para el cliente ( tecnología ).  • Los diferentes grupos de compradores que forman parte  del mercado objetivo ( mercado ).  R esulta de suma importancia que haya claridad respecto a las  necesidades  de  los  consumidores  o  clientes,  así  como  saber  cuáles  son  los  competidores  de  una  UEN  particular,  porque  la  base  de  las  decisiones  estratégicas  competitivas  consiste  en saber cómo satisfacer estas necesidades para lograr algún  tipo de ventaja competitiva para la organización.  La UEN es una unidad organizativa con fines puramente es-  tratégicos. Puede o no ser una parte estructural independien-  te dentro de la organización.  En este momento del proceso de análisis estratégico y previo  al  inicio  del  análisis  del  entorno  y  el  análisis  interno  que  lo  componen, deberíamos definir las UEN de la sociedad como  en el esquema que presentamos a continuación:   ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 30  U nidades Estratégicas de Negocio (UEN)  UNIDADES ESTRATÉGICAS DE NEGOCIO (UEN) Y  Y CARTERA DE ACTIVIDADES  F igura 5: Unidades Estratégicas de Negocio y cartera de actividades   Servicios  Productos/Servicios derivados   Productos/Servicios derivados  UEN 1   UEN 2  Producto 1   Producto 2   Servicio 3   Producto 1   Producto 2   Servicio 3  Producto   Producto   Servicios  Estrategias ok.qxd   21/3/05  17:25  Página 30 \nEn el siguiente cuadro, mostramos algunos ejemplos de UEN  de las empresas cuya visión y misión hemos definido en este  mismo capítulo.   ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   31  EJEMPLOS DE UEN DE UNA EMPRESA  En el ejemplo de “Empresa fabricante de televisores, equi-  pos de sonido, etc.”, podrían ser dos las UEN: “Alta tecnolo-  gía” y “Gran consumo” con sus productos y servicios rela-  cionados en cada UEN.  En el ejemplo de “Empresa constructora”, podrían ser dos  las UEN: “Construcción privada” y “Construcción pública”.  En el ejemplo de “Empresa de maquinaria auxiliar del sec-  tor de automoción”, las UEN podrían ser las siguientes:  “E levadores”,“Lubricación” y “Repuestos”.  En el ejemplo de “Empresa distribuidora de agua purifica-  da”, las UEN podrían ser “Consumo doméstico” y “Consumo  industrial”.  En el ejemplo de “Empresa petrolera estatal”, las UEN  podrían ser: “Petróleo puro” y “Derivados del petróleo”.  Estrategias ok.qxd   21/3/05  17:25  Página 31 \nEstrategias ok.qxd   21/3/05  17:25  Página 32 \nECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   33  ANÁLISIS DEL ENTORNO  Estrategias ok.qxd   21/3/05  17:25  Página 33 \nOBJETIVOS DEL CAPÍTULO  •  ¿Cuál  es  el  impacto  de  los  factores  externos  en  nuestra  organización?  • ¿Cómo solventa nuestra organización el efecto de los fac-  tores del entorno? (beneficios y desventajas)  •  ¿Qué  seguimiento  realiza  nuestra  empresa  de  la  evolu-  ción de dichos factores?  • ¿Cuál es el impacto en nuestra organización de su entor-  no competitivo?  • ¿Cómo se enfrenta nuestra organización a las barreras de  entrada,  el  poder  de  negociación  de  clientes  y  proveedo-  re s,   los productos sustitutivos y la rivalidad entre sus com-  petidores?  • ¿Cómo establece nuestra organización ventajas competi-  tivas sobre sus rivales?  • ¿Cuáles son sus factores clave de éxito y cómo los fomen-  ta en su sector de actividad?  • ¿Cuál es la posición de la sociedad frente a sus rivales más directos?  • ¿Cuál es la capacidad de nuestra sociedad para segmentar el  mercado y acercarse más a las necesidades del consumidor? • ¿Cómo se comportan los competidores directos de nues-  tra organización?  ÍNDICE DEL CAPÍTULO  I. ANÁLISIS DEL ENTORNO GENERAL (ANÁLISIS PEST)  II. ANÁLISIS DEL ENTORNO COMPETITIVO (ANÁLISIS   DE LAS CINCO FUERZAS DE PORTER)   ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 34  Estrategias ok.qxd   21/3/05  17:25  Página 34 \nLas estrategias no deben surgir de la nada, deben responder al  entorno del negocio, de ahí la importancia de realizar un aná-  lisis de la situación actual del entorno general de la sociedad.   Pr onosticar,  explorar  y  vigilar  el  entorno  es  muy  importante  para detectar tendencias y acontecimientos clave del pasado,  presente  y  futuro  de  la  sociedad.  El  éxito  o  supervivencia  de  la  sociedad  se  debe  en  numerosas  ocasiones  a  la  capacidad  que desarrolla la misma para predecir los cambios que se van  a producir en su entorno.  La  metodología  empleada  para  revisar  el  entorno  general  es  el    Análisis  PEST   que  consiste  en  examinar  el  impacto  de  aquellos  factores  externos  que  están  fuera  del  control  de  la  empresa,  pero  que  pueden  afectar  a  su  desarrollo  futuro.  N uestra  recomendación  es  que  la  sociedad  se  convierta  en  una organización activa en cuanto a la exploración del entor-  no, vigilancia de las tendencias y anticipación de la posición  de sus competidores en el futuro.  En  el  Análisis  PEST  definiremos  cuatro  factores  clave  que  pueden  tener  una  influencia  directa  sobre  la  evolución  del  negocio. El siguiente esquema sintetiza dichos factores:  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   35  Análisis del Entorno General (Análisis PEST)  F igura 6: Análisis del entorno general  ANÁLISIS DEL ENTORNO GENERAL  •   PIB / Ciclo económico  •   Demanda  • E  mpleo  • Infl  ación  •   Costes energía  •   Eventos especiales  •   Legislación fiscal  •   Legislación sobre   medio ambiente  • P  rotección del consumidor  •   Cambios políticos  •   Incentivos públicos  • I  nnovaciones  tecnológicas  •   Internet  • I  ncentivos públicos  •   Envejecimiento de la población  • P  rolongación de los  jóvenes en el hogar  •   Nivel de riqueza  •   Movimientos migratorios  •   Nuevos estilos de vida  ANÁLISIS PEST  F ACTORES TECNOLÓGICOS F ACTORES ECONÓMICOS  F ACTORES POLÍTICOS   F ACTORES SOCIALES  Estrategias ok.qxd   21/3/05  17:25  Página 35 \nEn  el  análisis  de  los  factores  clave  del  entorno  deberemos  r esponder a cuatro preguntas básicas:  •  ¿Cuáles  son  los  factores  que  pueden  tener  relevancia  en  el  sector  en  el  que  desarrolla  su  actividad  mi  socie-  dad?  •  ¿Cuáles  de  entre  estos  factores  relevantes  tienen  un  impacto importante para mi empresa?  •  ¿Cuál  es  la  evolución  prevista  de  estos  factores  en  un  horizonte temporal de 3-5 años?  •  ¿Qué  oportunidades  o  desventajas  genera  para  mí  la  evolución prevista de dichos factores?  F ACTORES ECONÓMICOS   La  evolución  de  determinados  indicadores  macroeconó-  micos puede tener influencia sobre la evolución del sector  en el que opera la sociedad. C ada  sociedad  deberá  escoger  aquellos  indicadores  eco-  nómicos cuya evolución ha tenido o puede tener una in-  fluencia  importante  en  su  entorno  y,  por  lo  tanto,  en  su  futuro. E xisten multitud de factores económicos influyentes en el  entorno de una sociedad, pero no todos tienen un impac-  to  relevante  sobre  la  actividad  del  sector,  por  lo  tanto,  la  sociedad  deberá  escoger  aquellos  cuya  evolución  puede  r esultar útil consultar.  En  el  siguiente  cuadro  proponemos  algunos  de  estos  fac-  tores económicos, sería imposible enumerarlos todos por-  que  en  función  del  sector  en  el  que  trabaje  la  sociedad  tendrán más relevancia unos u otros:  F ACTORES TECNOLÓGICOS   Los  factores  tecnológicos  generan  nuevos  productos  y  servi-  cios, y mejoran la forma en la que se producen y se entregan  al usuario final. Las innovaciones pueden crear nuevos secto-  r es y alterar los límites en los sectores existentes.  En el siguiente cuadro, proponemos algunos de estos factores  tecnológicos:  F ACTORES POLÍTICOS   Los procesos políticos y la legislación influencian las regulacio-  nes del entorno a las que los sectores deben someterse. Las le-  gislaciones gubernamentales pueden beneficiar o perjudicar de  forma  evidente  los  intereses  de  una  compañía.  En  el  siguiente  cuadro, proponemos algunos de estos factores políticos:  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 36  EJEMPLOS FACTORES ECONÓMICOS  • La evolución del PIB y del ciclo económico  • La demanda del producto  • El empleo  • La inflación  • Los costes de energía  • Los costes de las materias primas  • La celebración de eventos especiales  EJEMPLOS FACTORES TECNOLÓGICOS  • Innovaciones tecnológicas  • Internet y comercio virtual  • Acciones del Gobierno  • Incentivos públicos  Estrategias ok.qxd   21/3/05  17:25  Página 36 \nF ACTORES SOCIALES Y DEMOGRÁFICOS   La  demografía  es  el  elemento  del  entorno  más  sencillo  de  comprender  y  de  cuantificar.  Es  la  raíz  de  muchos  cambios  en  la  sociedad.  La  demografía  incluye  elementos  como  la  edad de la población, crecientes o decrecientes niveles de ri-  queza,  cambios  en  la  composición  étnica,  distribución  geo-  gráfica  de  la  población  y  disparidad  en  el  nivel  de  ingresos.  En el siguiente cuadro, proponemos algunos de estos factores  sociales y demográficos:  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   37  EJEMPLOS FACTORES POLÍTICOS  • Cambios políticos previstos  • Cambios en la legislación laboral  • Ayudas e incentivos por parte del Gobierno  • Legislación fiscal y de seguridad social  • Legislación referente al medio ambiente, seguridad   y prevención de riesgos  • Legislación referente a la protección del consumidor  • Incentivos públicos  EJEMPLOS FACTORES SOCIALES/DEMOGRÁFICOS  • Prolongación de la vida en familia de los jóvenes  • Nivel de riqueza de la sociedad  • Composición étnica de la sociedad  • Nuevo papel de la mujer trabajadora  • Nuevos estilos de vida y tendencias  • Envejecimiento de la población  Estrategias ok.qxd   21/3/05  17:25  Página 37 \nSEGUIMIENTO DEL ENTORNO (RESUMEN DE INDICADORES)   D ada la importancia que hemos reflejado que tiene el entor-  no de la sociedad en la evolución de la misma, sería impres-  cindible  que  ésta  realizara  un  seguimiento  continuado  del  mismo. Este seguimiento debe basarse en una serie de infor-  mes  públicos  e  indicadores  cuya  evolución  debe  vigilarse  de  cerca. En función de los factores escogidos, la sociedad debe-  rá escoger las fuentes de información más útiles y la frecuen-  cia del seguimiento de esta información relevante.  La  siguiente  tabla  recoge  algunos  de  los  indicadores  del  en-  torno que la sociedad debe vigilar:  ECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 38  El     Análisis  PEST  permite  estudiar  el  diferente  impacto  de  los factores externos en unas organizaciones o en otras. Las  influencias  del  entorno  no  tendrán  el  mismo  impacto  en  todas  las  organizaciones,  ni  siquiera  entre  aquellas  cuya  actividad  sea  similar  o  pertenezcan  a  un  mismo  sector  de  actividad.   Este planteamiento se centra en los generadores de globa-  lización en una industria.  INDICADORES DEL ENTORNO  Entorno   Políticos  Económico  Indicador  Legislación vigente y  proyectos de normas  Evolución del PIB y VAB  del sector  Evolución de la   demanda de productos  Evolución del empleo   en el sector  Evolución del consumo   y el coste de los  principales componentes  del producto  Frecuencia de  seguimiento  T rimestral  T rimestral  T rimestral  T rimestral  Mensual  Fuente  Boletín Oficial del Estado  Boletín Oficial del Estado  Informes sectoriales  Informes sectoriales  Revistas especializadas  Informes INE  Informes anuales  Ministerio de Trabajo  Boletín Oficial del Estado  Factor a considerar  Normativa de calidad, medio ambiente, seguridad, prevención   de riesgos laborales, protección del consumidor  Evolución del ciclo económico  Demanda del producto  Empleo  Coste materias primas  Estrategias ok.qxd   21/3/05  17:25  Página 38 \nECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO”   39  Análisis del Entorno Competitivo   (Análisis de las Cinco Fuerzas de Porter)  El  Modelo  de  las  Cinco  Fuerzas ,  desarrollado  por  Porter  (1987),  ha  sido  la  herramienta  analítica  más  comúnmente  utilizada  para  examinar  el  entorno  competitivo.  Describe  el  entorno competitivo en términos de cinco fuerzas competiti-  v as básicas:  1. La amenaza de nuevos entrantes   (barreras de entrada).  2. El poder de negociación de los clientes.  3. El poder de negociación de los proveedores.  4. La amenaza de productos y servicios sustitutivos.  5.  La  intensidad  de  la  rivalidad  entre  competidores  de  un sector.  C ada  una  de  estas  fuerzas  afecta  a  la  capacidad  de  una  em-  presa  para  competir  en  un  mercado  concreto.  Juntas  deter-  minan  la   r entabilidad  potencial  de  un  sector   determinado,  ya que estas cinco fuerzas actúan permanentemente en con-  tra de la rentabilidad del sector.  S iguiendo a Gimbert (2003), supongamos que estamos anali-  zando  la   ri v alidad    entre  las  empresas  de  un  sector,  la  lógica  nos indica que cuanto mayor sea ésta, más acciones realiza-  rán  unas  empresas  contra  las  otras  (guerras  de  precios,  pro-  mociones, etc.) y la rentabilidad bajará. No obstante, si ima-  ginamos  un  sector  muy  rentable  debido  a  su  baja  rivalidad,  pero  en  el  cual  es   fácil  entrar ,  en  cuestión  de  poco  tiempo  otras empresas penetrarán en él y la rentabilidad descenderá  alarmantemente.  S in  embargo,  si  el  sector  que  hemos  tomado  como  ejemplo  con  una  baja  rivalidad  estuviera  protegido  contra  nuevos  in-  gresos, esto aún no sería suficiente para garantizar que mantu-  viera  su  alta  rentabilidad,  debido  a  la  existencia  de  otras  dos  fuerzas:  una  relacionada  con  los   proveedores   del  sector  y  la  otra con sus  clientes , puesto que ambos tratarían de quedarse  con  la  máxima  proporción  de  esta  rentabilidad.  El  que  logra-  r an  o  no  su  intento  de  apropiarse  del  máximo  margen  de  las  empresas del sector dependería de su poder de negociación. P or último, si esto no fuera así y el poder de negociación de  clientes  y  proveedores  fuera  bajo,  nuestro  ejemplo  imagi-  nario de sector con las cuatro primeras fuerzas totalmente  a  su  favor  tendría  todavía  que  pasar  un  quinto  filtro  para  asegurarse una alta rentabilidad: la amenaza de  productos  sustitutivos .  Ahora ya sabemos la razón por la cual unos sectores son ren-  tables  y  otros  no.  En  los  sectores  rentables  las  cinco  fuerzas  tienen muy poco peso, mientas que en los poco rentables ha-  brá  alguna,  o  más  de  una,  de  estas  fuerzas  que  tendrán  un  peso  muy  importante.  Como  directivo  este  modelo  le  ayuda  a  decidir  si  su  empresa  debería  permanecer  en  un  sector  o  salir de él.  Así  mismo,  el  modelo  de  las  cinco  fuerzas  de  Porter  (1987)  nos  permite  evaluar  cómo  mejorar  la  posición  competitiva  de una empresa con respecto a cada una de las cinco fuerzas.  P or  ejemplo,  puede  utilizar  el  conocimiento  proporcionado  por el modelo de las cinco fuerzas para crear mayores barre-  r as de entrada que desanimen a nuevos rivales a competir en  su  mercado.  O  puede  desarrollar  fuertes  relaciones  con  sus  canales de distribución, o puede decidir buscar proveedores  que  satisfagan  la  relación  calidad/precio  necesaria  para  que  su producto o servicio sea de alto rendimiento.  A  continuación,  presentamos  el  esquema  de  las  cinco  fuer-  zas de Porter (1987):  Estrategias ok.qxd   21/3/05  17:25  Página 39 \nECO3 Colecciones:   “LA EL ABORACIÓN   DEL PLAN EST RA TÉGICO” 40  F igura 7: Análisis de las Cinco Fuerzas de Porter (1987) - Fuente: Adaptado de Porter (1987)  LAS CINCO FUERZAS DE PORTER  BARRERAS DE ENTRADA  EL PODER DE NEGOCIACIÓN DE LOS PROVEEDORES   EL PODER DE NEGOCIACIÓN DE LOS CLIENTES RIVALIDAD ENTRE LOS COMPETIDORES  PRODUCTOS SUSTITUTIVOS  Dentro de un sector no sólo tiene relevancia la actuación de los  elementos actuales, sino que la posible sustitución de los mismos  por otros de características más o menos parecidas producidas en  otros sectores puede cambiar el devenir del mismo sector en un  plazo muy corto de tiempo  La rivalidad entre competidores actuales se detecta   por la existencia de maniobras competitivas para hacerse con una  posición. Las empresas usan tácticas como las guerras de precios,  las guerras publicitarias, los lanzamientos de productos o el  incremento de servicios y garantías para los consumidores. La  rivalidad se da cuando los competidores sienten la presión o actúan  con arreglo a una oportunidad para mejorar su posición LA AMENAZA DE NUEVOS ENTRANTES (BARRERAS DE ENTRADA)   La  amenaza  de  nuevos  entrantes  hace  referencia  a  la  posibili-  dad  de  que  los  beneficios  de  las  empresas  establecidas  en  un  sector puedan descender debido a la entrada de nuevos compe-  tidores. El alcance de la amenaza depende de las barreras de en-  trada  existentes,  de  la  posibilidad  de  crear  nuevas  barreras  de  entrada y de la acción combinada de los competidores actuales.  C on este análisis lo que se pretende es determinar los condicio-  nantes que afectan a una empresa que quiera entrar en el sector  donde opera la sociedad.  Si   las barreras de entrada son altas y/o el nuevo entrante puede  anticipar  una  dura  revancha  de  los  competidores  existentes,  la  Posibilidad de que los beneficios de las empresas establecidas en un  sector puedan descender debido a la entrada de nuevos competidores  El poder de cada uno de estos grandes grupos de  compradores depende de las características de la  situación del mercado y de la importancia de las  compras de ese grupo comparadas con el negocio   total del sector  Los proveedores pueden ejercer una notable influencia  en un sector presionando en una subida del precio, en  el tiempo de entrega o en la calidad de los productos y,  de esta manera, exprimir la rentabilidad de un sector  Estrategias ok.qxd   21/3/05  17:25  Página 40 \namenaza de entrada será baja. Estas circunstancias desalientan  a  nuevos  competidores.  Existen  seis  fuentes  principales  de  ba-  rreras de entrada:  •   E conomías de escala : Las economías de escala se refieren  a  la  posible  reducción  de  los  costes  de  producción  cuando  aumenta  la  escala  de  producción,  es  decir,  el  número  de  unidades  producidas.  El  coste  de  una  unidad  de  producto  desciende  cuando  se  incrementa  el  volumen  total  de  pro-  ducción posible en un determinado período de tiempo. Esto  disuade  la  entrada,  ya  que  obliga  al  entrante  a  introducirse  produciendo a gran escala, arriesgándose a una fuerte reac-  ción por parte de las empresas existentes o si no, a introdu-  cirse a pequeña
