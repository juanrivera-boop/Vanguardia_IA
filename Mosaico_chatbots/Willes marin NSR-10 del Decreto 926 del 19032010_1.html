    <style>
        :root{--primary:#007bff;--secondary:#6c757d;--light:#f8f9fa;--dark:#343a40;--success:#28a745;--danger:#dc3545;--warning:orange;--radius:8px;--font:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;--bg:var(--light);--text:var(--dark);--card:#fff;--border:#ddd;--input:#fff;--iborder:#ccc;--bot-bg:#e9ecef;--bot-text:var(--dark);--user-bg:var(--primary);--user-text:#fff;--sys-bg:#fff3cd;--sys-text:#856404;}
        body.dark-mode{--bg:#212529;--text:#f8f9fa;--card:#343a40;--border:#495057;--input:#495057;--iborder:#6c757d;--bot-bg:#495057;--bot-text:#f8f9fa;--sys-bg:#332701;--sys-text:#ffeb8f;}
        body{font-family:var(--font);margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s;}
        .container{width:90%;max-width:800px;margin:20px auto;padding:20px;background:var(--card);border-radius:var(--radius);box-shadow:0 4px 12px rgba(0,0,0,.1);flex-grow:1;display:flex;flex-direction:column;gap:15px;}
        header{text-align:center;border-bottom:1px solid var(--border);padding-bottom:15px;}
        header h1{color:var(--primary);margin:0;font-size:1.6em;}
        header p{margin:5px 0 0;font-size:.9em;color:var(--secondary);}
        .toolbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;}
        button{background:var(--primary);color:#fff;border:none;padding:8px 15px;border-radius:var(--radius);cursor:pointer;font-size:.9em;transition:background .2s;}
        button:hover{background:#0056b3;}
        button:disabled{background:var(--secondary)!important;opacity:.65;cursor:not-allowed;}
        #theme-btn{background:var(--secondary);}
        #palette-btn{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
        .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
        .btn-export{background:var(--primary);color:#fff;border:none;padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-size:.85em;transition:background .2s;}
        .btn-export:hover{background:#0056b3;}
        .pdf2-section{padding:10px;border:1px dashed var(--border);border-radius:var(--radius);}
        .pdf2-section label.title{font-size:.85em;font-weight:bold;display:block;margin-bottom:6px;color:var(--secondary);}
        .file-row{display:flex;align-items:center;gap:10px;}
        .file-row input[type=file]{display:none;}
        .file-label{background:var(--secondary);color:#fff;padding:6px 12px;border-radius:var(--radius);cursor:pointer;font-size:.85em;}
        .file-label:hover{background:#545b62;}
        #pdf2-name{font-style:italic;color:var(--secondary);font-size:.85em;}
        #pdf2-status{font-size:.85em;margin-top:4px;font-weight:bold;}
        .suggested-questions-row{display:flex;flex-direction:column;gap:6px;}
        .sq-label{font-size:.85em;font-weight:600;color:var(--secondary);}
        .questions-select{width:100%;padding:8px;border:1px solid var(--iborder);border-radius:var(--radius);background:var(--input);color:var(--text);font-size:.9em;}
        .chat-display{height:360px;overflow-y:auto;border:1px solid var(--iborder);border-radius:var(--radius);padding:10px;background:var(--bg);line-height:1.6;}
        .chat-display .user-message,.chat-display .bot-message,.chat-display .system-message{margin-bottom:10px;word-wrap:break-word;}
        .chat-display .user-message,.chat-display .bot-message{background:transparent;color:inherit;padding:0;border-radius:0;max-width:100%;text-align:inherit;margin-left:0;}
        .message{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px;max-width:100%;}
        .message.user-message{flex-direction:row-reverse;justify-content:flex-start;}
        .avatar-img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #eee;background-color:#f0f0f0;}
        body.dark-mode .avatar-img{border-color:#444;background-color:#555;}
        .message-bubble{padding:10px 15px;border-radius:18px;max-width:85%;word-wrap:break-word;line-height:1.5;display:flex;flex-direction:column;}
        .user-message .message-bubble.user-bubble{background:var(--user-bg);color:var(--user-text);border-bottom-right-radius:5px;margin-left:auto;}
        .bot-message .message-bubble.bot-bubble{background:var(--bot-bg);color:var(--bot-text);border-bottom-left-radius:5px;margin-right:auto;}
        .chat-display .message-bubble strong{color:var(--primary);font-size:.9em;}
        .chat-display .bot-message .message-bubble p{margin:0 0 8px;}.chat-display .bot-message .message-bubble p:last-child{margin:0;}
        .chat-display .bot-message .message-bubble pre{background:var(--dark);color:var(--light);padding:10px;border-radius:5px;overflow-x:auto;}
        .chat-display .bot-message .message-bubble code{background:rgba(0,0,0,.1);padding:2px 4px;border-radius:3px;}
        body.dark-mode .chat-display .bot-message .message-bubble code{background:rgba(255,255,255,.1);}
        .chat-display .system-message{background:var(--sys-bg);color:var(--sys-text);text-align:center;font-style:italic;font-size:.9em;padding:8px 12px;border-radius:var(--radius);}
        .chat-display .system-message.error{background:#f8d7da;color:#721c24;}
        .thinking-animation{opacity:.75;animation:pulseThink 1s ease-in-out infinite;}
        @keyframes pulseThink{50%{opacity:1}}
        .input-area{display:flex;gap:10px;}
        #question-input{flex-grow:1;padding:10px;border:1px solid var(--iborder);border-radius:var(--radius);font-size:1em;resize:none;background:var(--input);color:var(--text);}
        #send-button{background:var(--success);padding:0 20px;display:flex;align-items:center;justify-content:center;gap:8px;}
        #send-button:hover{background:#1e7e34;}
        .loader{border:3px solid #f3f3f3;border-top:3px solid var(--primary);border-radius:50%;width:16px;height:16px;animation:spin 1s linear infinite;display:none;}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        footer{text-align:center;padding:12px;background:var(--dark);color:var(--light);font-size:.8em;margin-top:20px;}
        @media(max-width:600px){.input-area{flex-direction:column;}#send-button{width:100%;padding:12px;}}
    </style>

.4 – PERÍODO FUNDAMENTAL DE LA EDIFICACIÓN ................................................................................ ........................  E-39   E-A.4.5 –FUERZAS DE VIENTO..................................................................................................... ................................................  E-39   E-A.5 – DISTRIBUCIÓN DE FUERZAS ................................................................................................ ..........................................................  E-39   E-A.5.1 – FUERZA LATERAL  ...................................................................................................... ..................................................  E-39   E-A.5.2 – FUERZA VERTICAL...................................................................................................... ..................................................  E-39   E-A.6 – RESISTENCIA DE MUROS DE BAHAREQUE ENCEMENTADO .......................................................................... ...........................  E-40   Tabla E.A-1 Valores admisibles de trabajo en muros de bahareque encementado  ................................................... ...  E-40           \nNSR-10 – Título E – Casas de uno y dos pisos   iv         NOTAS:  \nNSR-10 – Capítulo E.1 – Introducción       E-1   TÍTULO E   CASAS DE UNO Y DOS PISOS        CAPÍTULO E.1   INTRODUCCIÓN        E.1.1 — GENERALIDADES     E.1.1.1 — ALCANCE  — El presente título establece los requisitos par a la construcción sismo resistente de viviendas   de uno y dos pisos de mampostería confinada y de bahareque encementado. Estos requisitos son de índole general y   están  dirigidos  a  todos  los  profesionales  de  la  ingenierí a  y  la  arquitectura  que  trabajan  en construcción de  vivienda,    así  no  sean  especialistas  en  cálculo  estructural.  En  este   Título  se  establecen  las  condiciones  estructurales  que    permitan  un  funcionamiento  adecuado  de  las  viviendas  de  uno  y  dos  pisos  ante  cargas  laterales  y  verticales  en  las    diferentes zonas de amenaza sísmica.      E.1.1.1.1  — En este título se dan los requi sitos mínimos que se deben seguir en  el diseño y construcción de viviendas   de uno y dos pisos, realizadas en muros de mampostería o en muros de bahareque encementado, que pertenecen al   grupo  de  uso   I   tal  como  lo  define  A.2.5.1.4  y  dentro  de  las  lim itaciones  establecidas  en  A.1.3.11,  es  decir,    construcciones de uno y dos pisos que formen parte de programas de máximo 15 viviendas y menos de 3000 m2 de   área construida. No obstante, si se desea, para viviendas estructuradas con muros de mampostería, puede llevarse a   cabo el diseño siguiendo los requisitos del Título A y el Título D del presente Reglamento.      E.1.1.1.2  — Las Casas de uno y dos pisos que se construyan en estructuras diferentes a los muros de mampostería o   de  bahareque  enceme ntado  ó  que  pertenez can  a  los  grupos  de  uso  II,  III  y  IV   tal  como  los  define  A.2.5  de  este    reglamento,  las  bodegas  y  similares,  deben  diseñarse  siguiendo  los  requisitos  de  los  capítulos  A.1  a  A.12  de  este    reglamento.         E.1.2 — DEFINICIONES     Acabado   —  Estado  final,  natural  o  artificial,  en  la  superficie  de  una  pieza  de  madera  o  guadua.  Estado  final  del    recubrimiento o del revoque.       Acción conjunta  — Participación de varios elementos estructurales con separación no mayor a 60 cm para soportar   una carga o sistema de cargas.       Alfarda  — Ver “vigueta”.      Aserrado   —  Proceso  mediante  el  cual  se  corta  una  troza  pa ra  obtener  piezas  de  madera  de  sección  transversal    cuadrada o rectangular.       Carrera  — Solera superior que corona una estructura de muros. Viga de amarre.      Cercha   —  Es  un  elemento  estructural reticulado  destinado  a  recibir  y  trasladar  a  los  muros  portantes  las  cargas  de    cubierta. Tiene una función equivalente a la de una correa.      Cimentación   —  Entramado  (malla  o  retícula)  de  vigas  de  concreto  reforzado  que  transfiere  las  cargas  de  la    superestructura al suelo.       Cinta de amarre  — Es un elemento complementario a las vigas de amarre con altura no menor de 100 mm, y cuyo   ancho es el espesor del elemento que remata.      Columna de amarre  — Es un elemento vertical reforzado que se coloca embebido en el muro.      Columna en madera o columna en guadua  — Pieza, generalmente vertical, cuyo trabajo principal es a compresión.  \nNSR-10 – Capítulo E.1 – Introducción       E-2      Concreto ciclópeo  — Concreto con adición de agregado de tamaños mayores al corriente (sobretamaño).      Contracción  — Reducción de las dimensiones de una pieza de madera causada por la disminución del contenido de   humedad.      Correa  — Elemento horizontal componente de la estructura de la cubierta.       Cuadrante   —  Elemento  que  se  coloca  diagonalmente  para  conformar  una  forma  triangular  cerrada  en  las  esquinas    de entrepisos y cubiertas, para limitar la deformación, en su propio plano, de los diafragmas.       Culata  — Parte del muro que configura el espacio entre la cubierta y los dinteles y que remata con la pendiente de la   cubierta. También se denomina cuchilla.       Diafragma  — Elemento estructural que reparte las fuerzas inerciales laterales a los elementos verticales del sistema   de resistencia sísmica, o sea, a los muros.       Distancia centro a centro  — Distancia del centro de un elemento de  unión al centro del elemento adyacente.      Elementos  especiales  de  cimentación   —  Son  elementos  atípicos  en  es te  título  y  que  resuelven  de  manera    particular  problemas  específicos  de  una  construcción  en  su  cimentación  tales  como  pilotes,  micropilotes,  realces,    muros de contención y plataformas de suelo mejorado.      Elementos suplementarios de cimentación  — Son elementos que complementan el trabajo de la cimentación en su   función de transferencia de cargas haci a el suelo, tales como elementos de cierre de los anillos en la malla, elementos   de estabilidad de elemen tos medianeros, etc.      Entramado  — Sistema estructural primario, horizontal, de una edificación.      Fibra  — Células alargadas con extremos puntiagudos y casi siempre con paredes gruesas.       Hinchamiento  — Aumento de las dimensiones de una pieza por causa del incremento de su contenido de humedad.      Losa-base  — Elemento de concreto o mortero con arena o grava colocado sobre material de afirmado y que sirve de   soporte al piso acabado.      Loseta  de  contrapiso   —  Es  el  elemento  de  concreto  con  agregado  fino  menor  o  igual  a  12.5  mm  (1/2\")  o  mortero    hecho con arenas gruesas, fundido direct amente sobre relleno compactado y que hace las veces de piso acabado en   el primer nivel.      Madera y/o guadua tratada  — Sometida a algún tipo de procedimiento, natural o químico, con el objeto de extraerle   humedad y/o inmunizarla contra el ata que de agentes xilófagos o pudrición.      Malla  de  cimentación   —  Conjunto  de  elementos  ortogonales  en  concreto  reforzado  o  en  ciclópeo  y  concreto    reforzado que forman anillos rectangulares en planta y hacen la  transferencia de cargas de la estructura de muros al   suelo de cimentación. Entramado.      Malla  expandida   —  Malla  que  no  se  basa  en  tejer  o  soldar  alambres  sino  que  resulta  de  expandir  una  lámina    metálica troquelada y perforada.      Malla con vena estructural  — Malla fabricada a partir de lámina expandida  y troquelada, con resaltes continuos que   la hacen autoportante.      Muro  — Elemento laminar vertical que soporta los diafragmas  horizontales y transfiere cargas a las cimentaciones.      Muros confinados  — Son muros de mampostería enmarcados por vigas y columnas de amarre.       Muros  de  carga   —  Son  muros  que  además  de  su  peso  propio  lle van  otras  cargas  verticales  provenientes  del    entrepiso y de la cubierta. Estos muros deben estar am arrados al diafragma y deben tener continuidad vertical.      Muros  de  rigidez   —  Son  muros  que  sirven  para  resistir  las  f uerzas  laterales  en  cada  dirección  principal  de  la   \nNSR-10 – Capítulo E.1 – Introducción       E-3   edificación. Cuando son transversales a los muros de carga, si rven adicionalmente para reduci r la esbeltez de estos.   Estos muros deben estar amarrados al diafragma y deben tener continuidad vertical.      Muros divisorios  — Son muros que no llevan más carga que su peso propio, no cumplen ninguna función estructural   para cargas verticales u horizontales y por lo tanto pueden ser removidos sin comprometer la seguridad estructural del   conjunto. No obstante, deben estar adheridos en su parte superi or al sistema estructural, con el fin de evitar su vuelco   ante la ocurrencia de un sismo.      Pañete  — Mortero de acabado para la superficie de un muro. Ta mbién se denomina mortero  de alisado, revoque, etc.      Parapeto  — Son los muros en mampostería por encima de la cubierta. Deben amarrarse como se indica en E.4.4.      Pie de amigo  — Elementos oblicuos que transfieren cargas desde elementos horizontales a los elementos verticales.      Pie-derecho  — Elemento vegetal de la estructura de un muro  de bahareque encementado, en posición vertical.      Preservació n  — Tratamiento para prevenir o contrarres tar la acción de organismos destructores.      Recebo  — Material granular seleccionado de relleno, que se coloca entre el suelo natural y el entrepiso. Este material   debe compactarse en forma adecuada.      Retiro  —  Espacio obligatorio entre construcción y el límite del lote o entre dos construcciones.      Recubrimiento  — Vaciado suplementario sobre una placa prefabricada que beneficia su trabajo como diafragma.      Recubrimiento de muros de bahareque encementado  — Material que conforma las caras de un muro.      Riostra  — Elemento que limita la deformabilidad de una estructura o de componentes de una estructura.      Revoque  — (Repello-Pañete-Enlucido) Capa exterior constituida por un mortero de cemento, agua y arena, y que se   aplica en la superficie de un muro.      Rolliza  — Estado cilíndrico natural de los tallos de guadua o madera.      Secado  — Proceso natural o artificial mediante el cual se  reduce el contenido de humedad de la madera o guadua.      Solera   —  En  muros de  bahareque  encementado,  es  el elemento  horizontal  que  sirve  de  base a  la estructura  de  un    muro  e  integra  las  cargas  de  los  pié-derechos.  En   muros  en  mampostería  y  muros  en  bahareque  encementado,    también es el elemento de remate del muro al nivel de la cubierta y que recibe las cargas transferidas por las correas.   Remate de muro o de cubierta.      Tirante   —  Elemento  que  une  caras  opuestas  de  elementos  de  borde  de  entrepisos  y  cubiertas,  en  tramos  con    longitudes de magnitud importante, para evitar  que se deformen fuera del plano de los muros.      Viga en madera o viga en guadua  — Pieza, generalmente horizontal, cuyo trabajo principal es a flexión.      Viga de amarre  — Es un elemento de concreto reforzado de no menos de 150 mm de altura que sirve para amarrar a   diferentes  niveles  los  muros  de  una  edificación.  La  viga  de  amarre  puede  estar  embebida  dentro  de  la  losa  de    entrepiso cuando ésta es de concreto reforzado, y en este caso puede tener el mismo espesor del entrepiso.      Viga  de  corona   —  Elemento  de concreto  reforzado  complementario   de  los cimientos en  concreto ciclópeo,  vaciado    directamente sobre ellos y que cumple funciones de amarre y repartición de cargas.       Vigueta  — Elemento estructural secundario de la cubierta, que trabaja a flexión y cortante.         E.1.3 — CRITERIOS BÁSICOS DE  PLANEAMIENTO ESTRUCTURAL     El  buen  comportamiento  sísmico  de  una  edificación  de  uno  y  dos  pisos  depende,  en  gran  parte,  de  que  en  su    planeamiento  estructural  se  sigan  algunos  criterios  genera les  apropiados,  entre  los  cuales  los  más  relevantes  se   \nNSR-10 – Capítulo E.1 – Introducción       E-4   indican a continuación:       E.1.3.1  —  SISTEMA DE RESISTENCIA SÍSMICA  — El sistema de resistencia sísmica para las casas contempladas   en  este  capítulo,  debe  garantizar  un  comportamiento  adecu ado,  tanto  individual  como  de  conjunto,  ante  cargas    verticales y horizontales. Esto se logra por medio de los siguientes mecanismos:      (a)    Un conjunto de muros estructurales dispuestos de ta l manera que provean suficiente resistencia ante los   efectos  sísmicos  horizontales  en  las  dos  direccione s  principales  en  planta,  teniendo  en  cuenta  sólo  la    rigidez  longitudinal  de  cada  muro.  Los  muros  estructurales  sirven  para  resistir  las  fuerzas  laterales    paralelas  a  su  propio  plano,  desde  el  nivel  donde  se   generan  hasta  la  cimentación  las  cargas  verticales    debidas  a  la  cubierta  y  a  los  entrepisos  si  los  hay  y  su  propio  peso.  Los  muros  estructurales  deben    diseñarse siguiendo las especificaciones dadas en el  capítulo E.3 para muros de mampostería confinada,   y en el capítulo E.7 para muros de bahareque encementado.   (b)    Un sistema de diafragmas que obligue al trabajo conj unto de los muros estructurales, mediante amarres   que transmitan a cada muro la fuerza lateral que deba  resistir. Los elementos de  amarre para la acción de   diafragma  se  deben  ubicar  dentro  de  la  cubierta  y  los  entrepisos  y  diseñarse  de  acuerdo  con  las    especificaciones dadas en el capítulo E.5.   (c)    Un sistema de cimentación que transmita al suelo la s cargas derivadas de la función estructural de cada   muro.  El  sistema  de  cimentación  debe  tener  u na  rigidez  apropiada,  de  manera  que  se  prevengan    asentamientos  diferenciales  inconvenientes.  El  conj unto  de  cimientos  debe  constituir  un  diafragma  y    diseñarse de acuerdo con el capítulo E.2.      E.1.3.2   —   DISPOSICIÓN  DE  MUROS  ESTRUCTURALES   —  Debido  a  que  los  muros  individualmente  resisten    principalmente  las  cargas  laterales  paralelas  a  su  plano,   es  necesaria  la  colocación  de  muros  en  dos  direcciones    ortogonales,  o  aproximadamente  ortogonales,  en  planta.   La  longitud  de  los  muros  en  las  dos  direcciones  debe  ser    aproximadamente igual.        E.1.3.3   —   SIMETRÍA   —  Con  el  fin  de  evitar  torsiones  de  toda  la  edificación,  ésta  debe  tener  una  planta  lo  más    simétrica posible. La edificación como un todo y los módul os que la conforman, deben ser simétricos con respecto a   sus  ejes.  Cuando  la  planta  asimétrica  sea  inevitable,  la   edificación  debe  dividirse  en  módulos  independientes  por    medio de juntas, de tal manera que los módulos individuales sean simétricos. La distribución simétrica de los muros   debe  verificarse  mediante  las  ecuaciones  E.3.6-2  y  E.7. 8-2,  según  los  muros  sean  construidos  en  mampostería    confinada o en bahareque Encementado, respectivamente.       E.1.3.4  —  INTEGRIDAD ESTRUCTURAL      E.1.3.4.1 —  General  —  Tanto la efectividad de los amarres en los di afragmas como el trabajo en conjunto de   muros  dependen  de  la  continuidad  vertical  de  los  muros   estructurales  y  de  la  regularidad  de  la  estructura,    tanto en planta como en altura. Por esta razón se debe tener en cuenta:       E.1.3.4.1.1  —  La continuidad vertical  — Para considerar un muro como muro estructural, éste debe   estar  anclado  a  la  cimentación.  Cada  muro  estructural  debe  ser  continuo  entre  la  cimentación  y  el    diafragma inmediatamente superior, sea el entrepiso o la cubierta. En casas de dos pisos, los muros   estructurales  que  continúen  a  través  del  entrepiso  d eben,  a  su  vez,  ser  continuos  hasta  la  cubierta    para  poder  considerarse  estructurales  en  el  se gundo  nivel,  siempre  y  cuando  no  se  reduzca  su    longitud en más de la mitad de la longitud que posee en el primer nivel y siempre y cuando se cumpla   en  cada  nivel  con  los  requerimientos  de  E.3.6  o   E.7.8,  según  los  muros  sean  construidos  en    mampostería confinada o en bahareque encementado,  respectivamente. Muros del segundo piso que   no tengan continuidad hasta la cimentación no podrán  considerarse como muros estructurales. Si un   muro anclado a la cimentación continúa a través del  entrepiso y es continuo hasta la cubierta, siendo   su longitud mayor en el segundo piso que en el primero, será considerado como muro estructural del   segundo piso, sólo en la longitud que tiene en el primer piso.      E.1.3.4.1.2  —  La regularidad en planta  — Debe evitarse la irregularidad geométrica en planta. Para   ello  debe  verificarse  que  se  cumplan  las  limitaciones  establecidas  en  la  figura  A.3-1,  para  las    irregularidades  2P  y  3P  y  evitarse  cualquier  otra   forma  de  irregularidad  en  planta.  Las  formas    irregulares  podrán  convertirse,  por  descomposici ón,  en  varias  formas  regulares,  cumpliendo  con  la    especificación para juntas sísmicas dada en E.1.3.4.3.       E.1.3.4.1.3  —  La regularidad en altura  — Deben evitarse las irregularidades geométricas en alzado.   Para  ello  debe  verificarse  que  se  cumplan  las  limitaciones  establecidas  en  la  figura  A.3-2,  para  las   \nNSR-10 – Capítulo E.1 – Introducción       E-5   irregularidades  3A  y  evitarse  cualquier  otra  forma  de  irregularidad  en  altura.  Cuando  la  estructura    tenga forma irregular en altura, podrá descomponers e en formas regulares aisladas, cumpliendo con   la especificación para juntas sísmicas dada en E.1.3.4.3.       E.1.3.4.2 —  Adiciones  —  Deben evitarse, o aislarse  convenientemente, las adicione s exteriores o reformas   interiores en materiales y sistemas constructivos difer entes al del resto de la edificación. No debe cambiarse o   modificarse  la  fachada  de  una  construcción  de  b ahareque  por  mampostería.  Así  mismo,  deben  evitarse    adiciones como cocinas, baños o habitaciones adicionales en mampostería para edificaciones estructuradas   con bahareque. Toda adición y modificación a las estructuras de bahareque debe construirse con este mismo   material,  a  menos  que  la  adición  o  modificación  es té  adecuadamente  aislada  del  resto  de  la  edificación,    cumpliendo lo establecido en E.1.3.4.3, para que trabaje independientemente de la estructura de bahareque,   resolviendo en sí misma su estabilidad y resistencia.      E.1.3.4.3 —  Juntas sísmicas       E.1.3.4.3.1 —  Se requieren juntas sísmicas en los siguientes casos:      (a)    Cuando la relación de la longitud con resp ecto al ancho, en planta, excede 3:1.   (b)    Cuando  el  terreno  tiene  pendientes  superiores  al  30%.  La  junta  sísmica  debe  colocarse    de manera que separe cada una de las viviendas sin que hayan muros medianeros entre   dos viviendas contiguas.   (c)    Cuando  en  conjuntos  de  casas  seriadas  medianeras,  coexisten  las  casas  de  bahareque    con otras de diferentes materiales, como mamp ostería, concreto reforzado, acero, etc.   (d)    Casas construidas independientemente.      E.1.3.4.3.2  — La junta sísmica debe tener una dimensión míni ma de j veces la altura  de la edificación,   medida hasta el caballete de la cubierta. El valo r de j debe establecerse con base en la tabla E.1.3-1      Tabla E.1.3-1  Espacio mínimo de separación     j  ( m/m)  Estructura  Mampostería  Bahareque    Edificación con aberturas de más  del 25% de las fachadas  0.015  0.020   Edificación con aberturas de meno s del 25% de las fachadas  0.010  0.015      E.1.3.4.3.3  —   Las  edificaciones  separadas  por  junta  sísmica  pueden  compartir  cimentaciones,  pero    deben separarse desde el nivel del sobrecimient o de manera que actúen independientemente.        E.1.3.5   —   PESO  DE  LOS  ELEMEN TOS  DE  CONSTRUCCIÓN   —  Las  fuerzas  que  genera  el  sismo  son  fuerzas    inerciales  y  por  lo  tanto,  mientras  mayor  sea  la  masa,  mayo r  será  la  fuerza  generada.  Este  aspecto  es  de  especial    importancia en las cubiertas, en las cuales deben evitarse elementos muy pesados como tanques para agua de 1 m3   ó más de capacidad            n         \nNSR-10 – Capítulo E.1 – Introducción       E-6      Notas    \nNSR-10  —  Capítulo E.2  —  Cimentaciones    E-7   CAPÍTULO E.2   CIMENTACIONES        E.2.1 — GENERALIDADES     E.2.1.1   —   INVESTIGACIÓN  MÍNIMA  —  En  todos  los casos se deben  cumplir  los  siguientes requisitos mínimos,  los    cuales deberán quedar consignados en un Memorial de Respon sabilidad suscrito por el profesional responsable de la   licencia de construcción:      (a)  Verificar el comportamiento de casas similares en  las zonas aledañas constatando que no se presenten   asentamientos  diferenciales,  agri etamientos,  pérdida  de  vertica lidad,  compresib ilidad  excesiva,    expansibilidad de intermedia a alta, colapsibilidad, etc., que permita concluir que el comportamiento de   las casas similares ha sido el adecuado.   (b)  Verificar en inmediaciones del sector a intervenir la ausencia de procesos de remoción en masa, áreas   de  actividad  minera  activa,  en  recuperación  o  suspendi da,  erosión,  cuerpos  de  aguas  u  otros  que    puedan afectar la estabilidad y funcionalidad de las casas.   (c)  Se  debe  realizar  mínimo  un  apique  por  cada  tres  unidades  construidas  o  por  cada  300  m2  de    construcción,  hasta  una  profundidad  mínima  de  2.0  m,  en  el  que  se  constate  la  calidad  razonable  del    suelo de cimentación.   (d)  En  los  apiques  indicados  en  (c)  deberán  quedar  determinados  los  espesores  de  los  materiales    inconvenientes para el apoyo directo y superficial de  la cimentación, como s on: descapote, escombros,   materia orgánica, etc., los cuales deberán ser retirados durante la construcción.      En  caso  de  que  los  resultados  de  la  investigación  mínima  indiquen  condiciones  inadecuadas  para  la  estabilidad  del    proyecto, se deberán realizar los estudios ge otécnicos indicados en el numeral E.2.1.2.      E.2.1.2  —  ESTUDIO GEOTÉCNICO  — Debe realizarse un estudio geotécnico que cumpla los requisitos del Título H   del reglamento en los siguientes casos:       (a)  Suelos que presenten inestabilidad lateral.   (b)  Suelos con pendientes superiores al 30%.   (c)  Suelos con compresibilidad excesiva.   (d)  Suelos con expansibilidad de intermedia a alta.   (e)  Suelos que present en colapsibilidad.    (f)  Suelos  en  zonas  que  presenten  procesos  de  remoción  en  masa,  áreas  de  actividad  minera  activa,  en    recuperación  o  suspendida,  erosión,  cuerpos  de  aguas  u  otros  que  puedan  afectar  la  estabilidad  y    funcionalidad de las casas.      E.2.1.3  —  LIMPIEZA  DEL  TERRENO  —   El  terreno  debe  limpiarse de  todo material orgánico  y  deben  realizarse  los    drenajes necesarios para asegurar una mínima incidencia de la humedad.      E.2.1.4  —  SISTEMA DE CIMENTACIÓN  — La cimentación estará compuesta por un sistema reticular de vigas que   configuren anillos aproximadamente rectangulares en planta, como  se ilustra en la figura E.2.1-1, y que aseguren la   transmisión  de  las  cargas  de  la  superestructura  al  suelo  en  forma  integral  y  equilibrada.  Debe  existir  una  viga  de    cimentación para cada muro estructural. Ningún elemento de cimentación puede ser discontinuo.           \nNSR-10  —  Capítulo E.2  —  Cimentaciones    E-8        Figura E.2.1-1 — Sistema reticular de vigas  que configuran anillos cerrados y continuos      E.2.1.5   —   CONFIGURACIÓN  EN  PLANTA   —  Si  uno  de  los  anillos  del  sistema  de  cimentación  tiene  una  relación    largo sobre ancho mayor que dos, o si sus dimensiones interiores son mayores de 4,0 m, debe construirse una viga   intermedia  de  cimentación,  así  no  sirva  de  apoyo  a  ningún  muro,  en  cuyo  caso  sus  dimensiones  mínimas  pueden    reducirse a 200 mm por 200 mm. La intersección de los elem entos de cimentación debe ser monolítica y los refuerzos   deben anclarse con ganchos estándar de 90 °  en la cara exterior del elemento transversal Terminal, como se muestra   en la figura E.2.1-2.           Figura E.2.1-2 — Ganchos de anclaje en  vigas de cimentación transversales         E.2.2 — ESTRUCTURACIÓN DE LOS CIMIENTOS     E.2.2.1  —  GENERAL  — Las vigas de cimentación deben tener refuerzo longitudinal superior e inferior y estribos de   confinamiento en toda su longitud.  Las dimensiones y el re fuerzo de los cimientos se pr esentan en la tabla E.2.2-1:      Tabla E.2.2-1   Valores mínimos para dimensiones, resistenci a de materiales y refuerzo de cimentaciones        Sistema   Estructural  Un piso  Dos Pisos  Resistencia   Mínima,    MP a    Mampostería  250 mm  300 mm  cf   Anchura  Bahareque  200 mm  250 mm   Mampostería  200 mm  300 mm  Altura  Bahareque  150 mm  200 mm   yf    420  Acero Longitudinal   Estribos     4 No. 3 (ó 10M)  No. 2 a 200 mm  4 No. 4 (ó 12M)   No. 2 a 200 mm  240   Mampostería  No. 3  No. 3  Acero  para  anclaje  de    muros  Bahareque  No. 3  No. 4  412   17  \nNSR-10  —  Capítulo E.2  —  Cimentaciones    E-9      E.2.2.2   —   CIMIENTOS  EXCÉNTRICOS   —  Los  cimientos  pueden  colocarse  excéntricos  en  los  casos  en  que  haya     medianería o junta sísmica. Su geometría y refuerzo d eben ser iguales a los mínimos  especificados en E.2.2.2.      E.2.2.3  —  CIMENTACIONES SOBRE TERRENO INCLINADO  — Cuando la inclinación del terreno exija la ejecución   de  cortes  para  la  construcción  del  proyecto  y/o  sistem as  de  contención,  éstos  se  deben  diseñar  atendiendo  las    disposiciones  del  Título  H  y  disponiendo  los  elementos  adicionales  requeridos  para  resistir  las  cargas  laterales  allí    especificadas.      E.2.2.3.1   —  Para  pendientes  superiores  al  20%  debe  garan tizarse  la  estabilidad  en  la  cimentación,    empleando procedimientos tales como pilares en concreto de sección circular, dispuestos en las esquinas del   borde  inferior  de  ladera,  a  distancias  no  mayores  de  5  m  entre  centros  y  anclados  no  menos  de  1  m  en  el    suelo natural. La esquina de la malla de cimentación correspondiente a cada pilar se debe anclar mediante 4   barras del N° 4 (1/2”) ó 12M (12 mm) formando una canastilla de 150 mm x 150 mm que debe penetrar en el   pilar al menos 500 mm y anclarse en los elementos de la malla de cimentación. La configuración de los pilares   y su refuerzo se ilustra en la figura E.2.2-1           Figura E.2.2-1  —  Pilares para estabilizar pendientes mayores del 20%      E.2.2.4  —  SOBRECIMIENTOS  — El nivel inferior de las vigas de cimentación deberá estar a una profundidad mínima   de  500  mm  por  debajo  del  nivel  de  acabado  del  primer  piso.    Debe  construirse  sobre  ellas  un  sobrecimiento  que    puede fabricarse con mampostería confinada o con mamposterí a reforzada, siguiendo los requerimientos del Título D   o de los  capítulos E.3 y E.4 del Título E, o con concreto , de acuerdo con los requisitos del Título C, que sobresalga,   mínimo  80  mm.  El  sobrecimiento  debe  anclarse  debidament e  a  la  cimentación  mediante  barras  de  refuerzo.  Los    sobrecimientos  en  mampostería  deben  rematarse  con  vi gas  de  amarre  que  garanticen  la  conformación  de  un    diafragma  en  el  nivel  del  contrapiso,  estructuradas  de  acuer do  con  lo  establecido  en  el  numeral  E.4.4.  De  allí  en    adelante, se construye el entrepiso del primer piso útil.      E.2.2.4.1   —  Cuando  el  terreno  es  inclinado,  con  una  pendiente  mayor  al  5  %,  el  sobrecimiento  se  debe    construir con altura constante en los muros paralelos a las curvas de nivel y una altura variable o escalonada   en  los  muros  perpendiculares  a  las  curvas  de  nivel.  No  deben  construirse  vigas  de  cimentación  que  tengan    superficies inclinadas en contacto con el suelo.        E.2.2.4.2  — Cuando la profundidad del estrato de suelo comp etente es mayor de 700 mm, puede reducirse la   altura del sobrecimiento, colocando la viga de cimentac ión sobre un relleno de concreto ciclópeo. Este relleno   debe tener una anchura mínima de 300 mm y una altura mínima de 200 mm.  Para la elaboración del concreto   ciclópeo debe utilizarse material pétr eo con tamaño máximo igual a la mit ad de la anchura del relleno pero sin   exceder 250 mm. El volumen ocupado por este agregado no debe ser superior al 40 % del volumen total del   relleno ciclópeo. El resto del volumen debe llenarse con  concreto de la misma o mejor calidad del concreto de   las vigas de cimentación.     \nNSR-10  —  Capítulo E.2  —  Cimentaciones    E-10   E.2.2.5  — La losa de contrapiso debe aislarse lateralmente  del sobrecimiento sobre el que se apoyan los muros, no   debe conectarse estructuralmente con  la estructura de ci mentación y en ningún caso debe considerarse como parte   integral de la cimentación.         E.2.3 — INSTALACIONES HIDROSANITARIAS     E.2.3.1   —  Las  instalaciones  hidrosanitarias  deben  colocarse  por   encima  de  la  malla  estructural  de  cimentación,  a    través del sobrecimiento o por debajo de la malla de cimentació n, caso en el cual la distancia vertical entre el fondo de   la malla y el borde superior de la tubería debe ser mayor de 100 mm. La intersección entre los elementos de la malla   de  cimentación  y  la  zanja  de  la  instalación  se  debe  rellenar  con  un  concreto  pobre.  En  ningún  caso  pueden    empotrarse las instalaciones hidrosani tarias en las vigas de cimentación.         E.2.4 — ESPECIFI CACIONES ESPECIALES     E.2.4.1   —   JUNTAS   —  La  cimentación  debe  contener  juntas  a  distancias  no  mayores  de  30  m,  a  menos  que  un    estudio  geotécnico  completo  realizado  de  acuerdo  con  las   especificaciones  del  Título  H,  resulte  en  distancias    diferentes.      E.2.4.2   —   MUROS  DIVISORIOS  NO  ESTRUCTURALES   —  Los  muros  divisorios  no  estructurales  deben  apoyarse    sobre  cimentaciones  similares  a  las  de  los  muros  estructurales,  excepto  que  pueden  tener  las  dimensiones    especificadas para edificaciones de un piso, independientemente del número de pisos de la construcción.                 n            \nNSR-10 – Capítulo E.3 – Mampostería Confinada       E-11    CAPÍTULO E.3   MAMPOSTERÍA CONFINADA        E.3.1 — GENERALIDADES     E.3.1.1   —   SEGÚN  SU  FUNCIÓN   —  Los  muros  de  las  casas  de  uno  y  dos  pisos,  en  mampostería  confinada,    contempladas dentro del alcance del presente Título  del Reglamento, se clasifican en dos grandes grupos:      E.3.1.1.1   —   Muros  confinados  estructurales   —  Se  consideran  muros  estructurales  aquellos  que  resisten    las fuerzas horizontales causadas por  el sismo, o el viento, además de soportar las cargas verticales, muertas   y vivas, en el caso de que constituyan soporte del entrepiso y/o cubierta       E.3.1.1.2   —   Muros  no  estructurales   —  Son  aquellos  muros  que  cumplen  la  función  de  separar  espacios    dentro de la casa y que no soportan ninguna carga adicional a su peso propio.      E.3.1.2  —  MUROS CONFINADOS ESTRUCTURALES  — Sólo se consideran como muros estructurales, en un nivel   determinado,  aquellos  que  presentan continuidad  vertical des de  la  cimentación  hasta  el  diafragma superior  del  nivel    considerado, que no tienen ningún tipo de aberturas, y que están confinados.      E.3.1.3   —   AMARRE  DE  LOS  MUROS  NO  ESTRUCTURALES   —  Los  muros  no  estructurales,  interiores  o  de    fachada, deben amarrarse o trabarse con los muros perpendiculares a su plano y los diafragmas.      E.3.1.4  —  PERDIDA DE SECCIÓN  — Cuando un muro estructural pierda en algún punto más del 50 por ciento de su   sección debido a una bajante o a algún otro elemento pertene ciente a las instalaciones interiores, debe considerarse   que  el  muro  se  ha  fraccionado  en  dos  muros,  los  cuales  deben  analizarse  y  diseñarse  como  elementos    independientes, confinando cada uno de ellos independientemente.         E.3.2 — UNIDADES DE MAMPOSTERÍA     E.3.2.1  — Las unidades de mampostería que se utilicen en las casas de uno y dos pisos pueden ser de concreto, de   arcilla cocida o de silical. Las unidades de mampostería pueden ser de perforación vertical, de perforación horizontal ó   macizas y deben cumplir las especificaciones establecidas  en las normas NTC expedidas por el Instituto Colombiano   de Normas Técnicas y Certificación, ICONTEC, que se relacionan a continuación:      E.3.2.1.1  — Unidades de concreto      (a)  Las  unidades  (bloque)  de  perforación  vertical  portante  de  concreto  deben  cumplir  con  la  norma    NTC 4026 (ASTM C90)   (b)  Las  unidades  portantes  de  concreto  macizas  (tolete),  deben  cumplir  con  la  norma  NTC  4026    (ASTM C55)   (c)  Las  unidades  de  concreto  de  resistencia  clase  baja,  deben  cumplir  con  la  norma  NTC  4076    (ASTM C129)      E.3.2.1.2  — Unidades de arcilla      (a)  Las  unidades  (bloque)   de  perforación  vertical   de  arcilla  deben  cumplir   con  la  norma  NTC  4205    (ASTM C34)   (b)  Las  unidades  de  arcilla  macizas  (tolete)  deben  cumplir  con  la  norma  NTC  4205  (ASTM  C62,    C652)   (c)  Las unidades de arcilla de resistencia clase baja, deben cumplir con la norma NTC 4205 (ASTM   C56, C212, C216).      E.3.2.1.3   —  Unidades  sílico-calcáreas  —   Las  unidades  sílico-calcáreas  deben  cumplir  con  la  norma  NTC    922 (ASTM C73).        \nNSR-10 – Capítulo E.3 – Mampostería Confinada       E-12    E.3.3 — MORTERO DE PEGA     E.3.3.1   —  Los  morteros  de  pega  utilizados  en  construcciones  de  uno  y  dos  pisos  deben  tener  buena  plasticidad  y    consistencia y deben garantizar la retención del agua mínima  para la hidratación del cemento. Su función principal es   la de adherir las unidades de mampostería y para ello se deben establecer dosificaciones apropiadas que garanticen   su calidad. Su resistencia mínima a la compresión a los 28 días debe ser 7.5 MPa (75 kgf/cm2), medida en cilindros de   75  mm  de  diámetro  por  150  mm  de  altura.  Su  dosificación  entre   material  cementante  (cemento  y  cal)  respecto  a  la    arena cernida por malla No. 8, no puede ser inferior a 1:4 en volumen.         E.3.4 — ABERTURAS EN LOS MUROS     E.3.4.1   —  Las  aberturas  en  los  muros  deben  ser  pequeñas,  bien  espaciadas  y  no  pueden  estar  ubicadas  en  las    esquinas. El área de los vanos de un muro no debe ser mayor al 35% del área total del muro.      E.3.4.2   —   DISTANCIA  MÍNIMA  ENTRE  ABERTURAS   —  Entre  las  aberturas  de  un  mismo  muro  debe  existir  una    distancia suficiente. La distancia mí nima entre aberturas debe ser mayor a 500 mm. Y en ningún caso debe ser menor   que la mitad de la dimensión mínima de la abertura.      E.3.4.3   —   REFUERZO  DE  LAS  ABERTURAS   —  Se  deben  reforzar  los  vanos  con  vigas  y  columnas  de  concreto    reforzado  alrededor  de  los  mismos  y  la  longitud  total   en  planta  de  los  vanos  debe  ser  menor  que  la  mitad  de  la    longitud total en planta del muro      E.3.4.3.1  — No se deben dejar aberturas continuas en la parte superior del muro, cerca de las columnas de   confinamiento, por que se puede presentar el efecto de columna corta.         E.3.5 — ESPESOR DE MUROS     E.3.5.1  —  DEBIDO A LA ALTURA LIBRE  — Para muros estructurales la distancia libre vertical entre diafragmas no   puede exceder 25 veces el espesor efectivo del muro. En el caso de cubiertas que constituyan diafragmas inclinados,   la medida vertical puede tomarse como la distancia libre entre  el diafragma inferior de entrepiso o de cimentación y la   altura media del diafragma; y cuando haya vigas de amarre a  la altura de dintel, la distancia vertical puede tomarse   hasta  este  nivel,  verificando  tanto  la  distancia  por  debajo  del   dintel  como  la  distancia  hasta  el  punto  más  alto  de  la    culata de remate, la cual debe tener una cinta de amarre en su remate.      E.3.5.2  —  DEBIDO A LONGITUD LIBRE HORIZONTAL  — Para los muros estructurales la distancia libre horizontal   no puede exceder 35 veces el espesor efectivo del muro. Se  debe tomar como distancia libre horizontal la existente   entre columnas de amarre o entre muros transversa les trabados con el muro bajo consideración.      E.3.5.3   —   ESPESOR  MÍNIMO  DE  MUROS  ESTRUCTURALES  CONFINADOS   —  En  ningún  caso,  el  espesor    nominal  de  los  muros  estructurales  de  carga  puede  ser  inferior  al  establecido  en  la  tabla  E.3.5-1.  Estos  espesores    mínimos  nominales  pueden  disminuirse  solo  cuando  se  realiza  el  diseño  completo  de  la  edificación  de  acuerdo  con    los requisitos del Título A y del Título D de este Reglamento.      Tabla E.3.5-1   Espesores mínimos nominales para muros    estructurales en casas de uno y dos pisos (mm)      Número de niveles de construcción   Dos Pisos   Zona de   Amenaza   Sísmica    Un   Piso   1 °  Nivel  2 °  Nivel   110  110  100    100  110  95    Alta   Intermedia   Baja   95  110  95    Nota: Para estos espesores mínimo s nominales no se deben tener en cuenta   los pañetes y acabados        \nNSR-10 – Capítulo E.3 – Mampostería Confinada       E-13    E.3.6 — LONGITUD DE  MUROS CONFINADOS     E.3.6.1   —   GENERAL   —  Para  poder  garantizar  que  la  edificación  tenga  capacidad  de  disipación  de  energía  en  el    rango inelástico, debe proveerse una longitud mínima de muros confinados en cada una de las direcciones principales   en planta. Los muros confinados pueden ser muros  de carga o muros transversales de rigidez.      E.3.6.2  —  LOCALIZACIÓN  — Para poder garantizar que el comportami ento individual y de conjunto sea adecuado,   los muros confinados deben ubicarse buscando la mejor simetría y la mayor rigidez torsional de la edificación. Esto se   logra disponiendo muros confinados simétricos lo más cerca posible a la periferia.      E.3.6.3  —  CANTIDAD DE MUROS EN CADA DIRECCIÓN  — Para proveer un reparto un iforme de la responsabilidad   de  resistir  las  fuerzas  sísmicas  en  el  rango  inelástico ,  los  muros  confinados  que  se  dispongan  en  cada  una  de  las    direcciones principales deben tener longitudes similares.  Las longitudes de aquellos muros confinados que estén en   un mismo plano vertical, no deben sumar más de la mitad de  la longitud total de muros confinados en esa dirección.       E.3.6.4   —   LONGITUD  MÍNIMA  DE  MUROS  CONFINADOS   —  La  longitud  de  muros  confinados  requerida  en  cada    una de las direcciones principales de la edificación, en metros, no puede ser menor que la que se obtiene por medio   de la ecuación E.3.6-1      M   A    o   p    L min   t =     (E.3.6-1)      donde:      L min     =  longitud mínima de muros estructurales en cada dirección (m)   M o     =  coeficiente que se lee en la tabla E.3.6-1   t     =  espesor efectivo de muros estructurales en el nivel considerado (mm)   A p     =  se considera en m2 como sigue:      (a)  Igual al área de la cubierta en construcciones de un piso con cubierta en losa de concreto.   (b)  Igual al área de cubierta para muros del segundo nivel en construcciones de dos pisos, cuando la cubierta   es una losa de concreto.   (c)  Igual  al  área  de  cubierta  más  el  área  de  entrepiso  para  muros  de  primer  nivel  en  construcciones  de  dos    pisos con cubierta consistente en una losa de concreto.   (d)  Cuando  se  emplee  una  cubierta  liviana,  los  valores  del  área  determinados  para  cubiertas  de  losa  de    concreto según (a), (b), o (c), pueden multiplicarse por 2/3.      Tabla E.3.6-1   Coeficiente    M o     para longitud mínima de muros estructurales confinados *      Zona de Amenaza   Sísmica   Valores     A a         Valores     M o      0.40  33.0    0.35  30.0    0.30  25.0   Alta   0.25  21.0    0.20  17.0   Intermedia  0.15  13.0    0.10  8.0   Baja  0.05  4.0    (*)  Los  valores  de     A a   dependen  de  la  zona  sísmica  en  donde  se  construye  el    proyecto. Para ello consultar el mapa de la figura A.2.3.2   y la tabla A.2.3-2.      E.3.6.5   —   MUROS  QUE  SE  TIENEN  EN   CUENTA  PARA  CUMPLIR  LA  LONGITUD  MÍNIMA   —  Para  efectos  de    contabilizar la longitud de muros confinados en cada direcció n principal, sólo deben tenerse en cuenta aquellos muros   que  están  confinados,  que  son  continuos  desde  la  cimentac ión  hasta  la  cubierta,  y  que  no  tienen  ninguna  abertura    entre columnas de confinamiento.  \nNSR-10 – Capítulo E.3 – Mampostería Confinada       E-14       E.3.6.6   —   DISTRIBUCIÓN  SIMÉTRICA  DE  MUROS   —  Los  muros  deben  estar  distribuidos  de  manera    aproximadamente simétrica. Por lo tanto, debe cumplirse c on la ecuación E.3.6-2, tomada en su valor absoluto:      (L    b)   B mi  L   2    mi   0.15 B  ⎡   ⎤    ∑   − ⎢   ⎥    ∑ ⎣   ⎦    ≤     (E.3.6-2)       En donde:      L mi     =    longitud de cada muro (en m) en la dirección    i   .   b     =    la distancia perpendicular (en m) desde cada muro en la dirección  i , hasta un extremo del rectángulo menor   que contiene el área de la cubierta o entrepiso (véase figura E.3.6-1).   B     =    longitud  del  lado  (en  m),  perpendicular  a  la  dirección     i   ,  del  rectángulo  menor  que  contiene  el  área  de  la    cubierta o entrepiso.           Figura E.3.6-1  —  Descripción del rectángulo menor que contiene el área de la cubierta o entrepiso      E.3.6.7  —  VERIFICACIÓN  DE   LA  RESISTENCIA  DE  MUROS  —   En  los  casos  en  los  cuales  no  se  cumplan  los    requisitos  expresados  en  E.3.6.4,  deberá  aumentarse  la  l ongitud  total  de  muros  en  cada  dirección,  en  cada  nivel,  a    menos  que  se  demuestre,  por  medio  de  un  procedimiento  de  análisis  estructural,  basado  en  los  Títulos  A  y  D  del    presente Reglamento, que una longitud de muros inferior a la es pecificada por la ecuación E.3.6-1, es suficiente para   resistir las cargas horizontales calculadas.      E.3.6.8   —    VERIFICACIÓN  DE  LA  ASIMETRÍA  DE  MUROS  EN  PLANTA   —  En  los  casos  en  los  cuales  no  se    cumplan  los  requisitos  expresados  en  E.3.6.6,  debe  hace rse  de  nuevo  la  distribución  de  los  muros  en  planta  hasta    lograr cumplir con la ecuación E.3.6-2. Sí en este proceso  se reduce la longitud total de muros en cualquier dirección   y  cualquiera  de  los  niveles,  debe  verificarse  de  nuevo  el  cu mplimiento  con  la  ecuación  E.3.6-1,  de  acuerdo  con  lo    estipulado en E.3.6.5.            █          Rectángulo menor que   contiene el área de   cubierta o entrepiso   AP   Ap  =  Planta de   la edificación  \nNSR-10 – Capítulo E.4 – Elementos de confinamiento en mampostería confinada       E-15    CAPÍTULO E.4   ELEMENTOS DE CONFINAMIENTO  EN MAMPOSTERÍA CONFINADA        E.4.1 — GENERALIDADES     E.4.1.1  — En las edificaciones de uno y dos pisos que se co nstruyan siguiendo los requisito s del presente Título del   Reglamento,  los  muros  estructurales  son  muros  de  mampostería  confinada.  Deben  seguirse  las  disposiciones    establecidas  en  este  capítulo  para  los  elementos  de  co nfinamiento  (columnas,  viga s  y  cintas),  las  cuales    corresponden a un procedimiento de diseño empírico. En caso de que se deseen realizar variaciones con respecto a   lo requerido aquí, la totalidad del diseño debe realizarse de acuerdo con el Título D del Reglamento.         E.4.2 — MATERIALES   E.4.2.1  —  ESPECIFICACIONES MÍNIMAS  — Las siguientes son las especificaciones mínimas establecidas para los   materiales utilizables en la construcción de los elementos de confinamiento:      (a)  Concreto  — El concreto debe tener una resistencia a la compresión a los 28 días,   f c ′   , igual o superior a   17.5 MPa.   (b)  Acero de refuerzo  — El acero de refuerzo longitudinal puede ser liso o corrugado. En ningún caso, el   acero de refuerzo puede tener un límite de fluencia,    f y  inferior a 240 MPa.         E.4.3 — COLUMNAS DE CONFINAMIENTO     E.4.3.1   —   GENERAL   —  En  general,  las  columnas  de  confinamiento   se  construyen  en  concreto  reforzado.  Las    columnas de confinamiento deben anclarse a la cimentación,  pudiendo utilizarse empalmes por traslapo en la base de   la columna, y deben rematarse anclando el refuerzo en  la viga de amarre superior. Cuando una columna tenga dos   niveles,  se  puede  realizar  un  empalme  por  traslapo  en  ca da  nivel.  Las  columnas  de  confinamiento  se  deben  vaciar    con posterioridad al alzado de los muros estructurales y directamente contra ellos.      E.4.3.2  —  DIMENSIONES  — La sección transversal de las columnas de amarre debe tener un área no inferior a 20   000 mm² (200 cm2), con espesor igual al del muro que confina.      E.4.3.3   —   UBICACIÓN   —  Deben  colocarse  columnas  de  amarre  en  los  extremos  de  los  muros  estructurales    seleccionados, en las intersecciones con otros muros estructurales y en lugares intermedios a distancias no mayores   de  35  veces  el  espesor  efectivo  del  muro,  1.5  veces  la   distancia  vertical  entre  elementos  horizontales  de    confinamiento ó 4 m.      E.4.3.4 - REFUERZO MÍNIMO -  El refuerzo mínimo de la columna de confinamiento debe ser el siguiente:      (a)  Refuerzo  longitudinal  —  No  debe ser  menor de  4 barras N° 3  (3/8”)  ó 10M (10  mm)  ó  3 barras N °   4    (1/2”) ó 12M (12 mm).   (b)  Refuerzo  transversal   —  Debe  utilizarse  refuerzo  transversal   consistente  en  estrib os  cerrados  mínimo    de  diámetro  N °   2  (1/4”)  ó  6M  (6  mm),  espaciados  a  200  mm.  Los  primeros  seis  estribos  se  deben    espaciar a 100 mm en las zonas adyacentes a los elementos horizontales de amarre.         E.4.4 — VIGAS DE CONFINAMIENTO      E.4.4.1   —  En  general,  las  vigas  de  confinamiento  se  construyen   en  concreto  reforzado.  El  refuerzo  de  las  vigas  de    confinamiento  debe  anclarse  en  los  extremos  terminales  con  ganchos  de  90 ° .  Las  vigas  de  amarre  se  vacían    directamente sobre los muros estructurales que confinan.      E.4.4.2   —   DIMENSIONES   —  El  ancho  mínimo  de  las  vigas  de  amarre  debe  ser  igual  al  espesor  del  muro,  con  un    área transversal mínima de 20 000 mm2 (200 cm2). En vigas que requieran enchaparse, el ancho especificado puede   reducirse hasta en 75 mm, siempre y cuando se incremente su altura, de tal manera que el área transversal no sea  \nNSR-10 – Capítulo E.4 – Elementos de confinamiento en mampostería confinada       E-16    inferior a 20 000 mm² (200 cm2).       E.4.4.3   —   UBICACIÓN   —  Deben  disponerse  vigas  de  amarre  form ando  anillos  cerrados  en   un  plano  horizontal,    entrelazando  los  muros  estructurales  en  las  dos  direcciones  principales  para  conformar  diafragmas  con  ayuda  del    entrepiso ó la cubierta. Deben ubicarse amarres en los siguientes sitios:      (a)  A nivel de cimentación  — El sistema de cimentación constituye el primer nivel de amarre horizontal.   (b)  A  nivel  del  sistema  de  entrepiso  en  casas  de  dos  niveles   —  Las  vigas  de  amarre  pueden  ir    embebidas en la losa de entrepiso. En caso de utilizarse una losa maciza de espesor superior o igual a   75 mm, se puede prescindir de las vigas de amarre en la zona ocupada por este tipo de losa, colocando   el refuerzo requerido para la viga dentro de la losa.   (c)  A nivel del enrase de cubierta  — Se presentan dos opciones para la ubicación de las vigas de amarre   y la configuración del diafragma.   •   Vigas horizontales a nivel de dinteles más cintas de amarre como remate de las culatas.   •   Vigas de amarre horizontales en los muros sin culatas combinadas con vigas de amarre inclinadas,   configurando  los  remates  de  las  culatas.  En  este  ca so,  se  debe  verificar,  de  acuerdo  con  E.3.5.1,  la    necesidad o no de amarre a nivel de dinteles.       E.4.4.4  —  REFUERZO MÍNIMO  — El refuerzo mínimo de las vigas de amarre debe ser el siguiente:      (a)  Refuerzo longitudinal  — El refuerzo longitudinal de las vigas de amarre se debe disponer de manera   simétrica  respecto  a  los  ejes  de  la  sección,  mínimo   en  dos  filas.  El  refuerzo  longitudinal  no  debe  ser    inferior a 4 barras N° 3 (3/8”) ó 10M (10 mm), dispuestos en rectángulo para anchos de viga superior o   igual  a  110  mm.  Para  anchos  inferiores  a  110  mm,  y  en  los  casos  en  que  el  entrepiso  sea  una  losa    maciza, el refuerzo mínimo debe ser dos barras N °  4 (1/2”) ó 12M (12 mm) con límite de fluencia,    f y no   inferior a 420 MPa.    (b)  Refuerzo  transversal   —  Considerando  como  luz  el  espacio  comprendido  entre  columnas  de  amarre    ubicadas  en  el  eje  de  la  viga,  o  entre  muros  estruc turales  transversales  al  eje  de  la  viga,  se  deben    utilizar  estribos  de  barra  N °   2  (1/4”)  ó  6M  (6  mm),  espaciados  a  100  mm  en  los  primeros  500  mm  de    cada extremo de la luz y espaciados a 200 mm en el resto de la luz.      E.4.4.4.1  — Cuando una viga de amarre cumpla funciones adicionales a las aquí indicadas, como servicio de   dintel o de apoyo para losa, ésta debe diseñarse de acuerdo a los requisitos del Título C de este Reglamento,   adicionando a la armadura requerida por las cargas la aquí exigida para la función de amarre.         E.4.5 — CINTAS DE AMARRE      E.4.5.1  — Se consideran las cintas de amarre como element os suplementarios a las vigas de amarre, utilizables en   antepechos  de  ventanas,  en  remates  de  culatas,  en  remates  de   parapetos,  etc.  Indistin tamente,  se  puede  utilizar    como cinta de amarre cualqui era de los siguientes elementos:      (a)  Un elemento de concreto reforzado de altura superior o igual a 100 mm, con ancho igual al espesor del   elemento  que  remata  y  reforzada  mínimo  con  dos bar ras  longitudinales N° 3  (3/8”)  ó  10M  (10 mm).  El    refuerzo  transversal  debe  ser  el  necesario  para  mantener  en  la  posición  deseada  las  barras    longitudinales.   (b)  Un elemento construido con piezas de mampostería  tipo U, reforzado longitudinalmente con mínimo dos   barras N° 3 (3/8”) ó 10M (10 mm) ó una barra N °  4 (1/2”) ó 12M (12 mm), e inyectado con mortero de   inyección de resistencia a la compresión no inferior a 7.5 MPa.      E.4.5.2   —  Las  cintas  de  amarre  deben  construirse  de  tal  ma nera  que  se  garantice  el  trabajo  monolítico  con  el    elemento que remata. El refuerzo longitudinal de las cintas de amarre se debe anclar en los extremos terminales.             n      \nNSR-10 – Capítulo E.5 – Losas de entrepiso, cubiertas, muros divisorios y parapetos      E-17   CAPÍTULO E.5   LOSAS DE ENTREPISO, CUBIERTAS,   MUROS DIVISORIOS Y PARAPETOS        E.5.1 — LOSAS  DE ENTREPISO     E.5.1.1   —   GENERAL   —  El  entrepiso  debe  diseñarse  para  las  cargas   verticales  establecidas  en  el  Título  B  del    presente Reglamento. Debe poseer suficiente rigidez en su  propio plano para garantizar su trabajo como diafragma.   Cuando el sistema de entrepiso utilizado no garantice el trabajo de diafragma, no se puede utilizar el presente Título   para el diseño de la edificación.      E.5.1.2   —   REQUISITOS   —  Los  sistemas  de  entrepiso  que  trabajan  como  diafragma  deben  estar  construidos    monolíticamente. Se deben cumplir los siguientes requisitos:      (a)  Las  losas  de  entrepiso  en  concreto  reforzado  deben  cumplir  lo  dispuesto  en  el  Título  C  de  este    Reglamento.   (b)  Los  esfuerzos  de  contacto  por  las  cargas  concentr adas  de  dinteles,  vigas  o  elementos  de  placa,  no    pueden exceder el 40 % de la resistencia bruta especificada para las unidades de mampostería.   (c)  Cuando se utilicen placas prefabricadas el espesor real mínimo del muro debe ser de 120 mm y el apoyo   de  la  placa  no  puede  ser  inferior  a  20  mm.  Para  considerarla  como  diafragma  se  debe  utilizar  un    recubrimiento con espesor mínimo 25 mm con resisten cia a la compresión al menos de 7,5 MPa a los 28   días  y  reforzado  al  menos  en  la  dirección  transversa l  a  la  de  carga.  Los  elementos  de  la  losa  deben    apuntalarse provisionalmente hasta que se garant ice el trabajo de conjunto de losa y de muro.      E.5.1.3  —  ESPESOR  MÍNIMO  DE  LOSAS  —   El  espesor  mínimo  de  una  losa  depende  del  sistema  de  entrepiso    utilizado y del tipo de apoyo o elementos de  soporte de acuerdo con  la tabla E.5.1-1      Tabla E.5.1-1   Espesor mínimo de losas      CONDICIÓN DE APOYO  TIPO DE LOSA  Simplemente apoyada  Un apoyo continuo  Continuo con voladizo   Maciza  L/20  L/24  L/10    Aligerada  (Viguetas  en    una dirección)  L/16  L/18.5  L/8       E.5.1.3.1   —  Si  la  losa  se  construye  con  elementos  pref abricados,  estos  deben  unirse  entre  ellos  y  deben    conectarse a las vigas que rodean la vivienda      E.5.1.4  —  LOSAS MACIZAS  — Las losas macizas están conformadas por una sola sección de concreto, el cual se   encuentra  reforzado  en  ambas  direcciones.  La  losa  debe   tener  por  lo  menos  dos  muros  de  apoyo  y  estos  siempre    deben ser opuestos. Para losas apoyadas en sus cuatro l ados la dirección principal será del sentido más corto.      E.5.1.4.1  —  Refuerzo mínimo  — El refuerzo mínimo de acero que debe colocarse en la losa maciza será el   estipulado  por  la  tabla  E.5.1-2.  El  refuerzo  indica do  solo  puede  ser  utilizado  para  condiciones  de  carga    estructuras del grupo de uso I.     \nNSR-10 – Capítulo E.5 – Losas de entrepiso, cubiertas, muros divisorios y parapetos      E-18   Tabla E.5.1-2   Refuerzo mínimo en losas macizas     Refuerzo Mínimo  Luz de Diseño   (m)   Espesor Mínimo   (mm)   Principal  Secundario    1.0 – 2.0  80  1 N° 4 cada 300 mm  1 N° 2 cada 200 mm   2.1 – 2.5  100  1 N° 4 cada 300 mm  1 N° 2 cada 150 mm   2.6 – 3.0  120  1 N° 4 cada 250 mm  1 N° 3 cada 250 mm   3.1 – 3.5  150  1 N° 4 cada 250 mm  1 N° 3 cada 200 mm   3.6 – 4.0  180  1 N° 4 cada 200 mm  1 N° 2 cada 150 mm,   arriba y abajo      E.5.1.4.2  — Luces mayores a las indicadas en la tabla E. 5.1-2 no son recomendables para losas macizas y   su diseño se debe realizar con los procedimientos es tablecidos en el Titulo C del presente Reglamento.      E.5.1.5  —  LOSAS ALIGERADAS  — Las losas aligeradas son utilizadas para salvar luces más grandes que las losas   macizas. Este sistema reemplaza parte de la sección de conc reto por material aligerarte, el cual pude ser de cajones   de madera, casetones de esterilla de guadua, ladrillos o bloques.      E.5.1.5.1  —  Componentes de una losa aligerada  — Generalmente una losa aligerada esta conformada por   cuatro componentes principales. Una torta inferior de co ncreto, los elementos aligerantes, la placa superior y   las viguetas en concreto reforzado.      E.5.1.5.1.1  —  La torta inferior  — La torta inferior se construy e con un mortero de arena y cemento   con  una  dosificación  mínima  de  un  aparte  de  ce mento  por  tres  de  arena.  Debe  tener  un  espesor    mínimo  de  20  mm  y  máximo  de  30  mm.  Se  debe  reforzar  con  alambrón  cada  300  mm  en  ambas    direcciones o con malla de gallinero con ojo de 25 mm      E.5.1.5.1.2  —  Los elementos aligerantes  — Estos elementos se colocan de tal manera que formen   las cavidades de las viguetas.       E.5.1.5.1.3  —  La placa superior  — Es un concreto fundido monolíticamente con el sistema de piso.   El espesor de la placa debe ser de 50 mm. La placa se debe reforzar con varilla N° 2 cada 300 mm   en ambas direcciones o con malla electro-soldada equivalente a la cuantía anterior.      E.5.1.5.1.4   —   Las  viguetas   —  Son  los  elementos  que  contienen  el  refuerzo  principal  de  la  losa.  El    ancho de las viguetas debe ser mínimo de 80 mm y su espaciamiento máximo entre ejes será de 600   mm.      E.5.1.5.2  —  Refuerzo mínimo  — El refuerzo mínimo de acero que debe colocarse en la losa aligerada será   el estipulado por la tabla E.5.1-3. El refuerzo indic ado solo puede ser utilizado para condiciones de carga para   estructuras del grupo de uso  I .      Tabla E.5.1-3   Refuerzo mínimo para viguetas de losas aligeradas       Luz (m)   Espesor   total   placa   (mm)   Refuerzo   inferior   continuo   Refuerzo inferior   complementario   en el centro de la   luz   Refuerzo   superior   continuo   Refuerzo superior   complementario para vigas   de varias luces en los   apoyos internos   Estribos   1.0– 2.5  150  1 N° 4    1 N° 4    N° 2 cada   80 mm   2.6 – 3.5  200  1 N° 4    1 N° 4    N° 2 cada   80 mm   3.6 – 4.5  280  1 N° 4  1 N° 3  1 N° 4  1 N° 3  N° 2 cada   120 mm   4.6 – 5.5  350  1 N° 4  1 N° 3  1 N° 4  1 N° 3  N° 2 cada   150 mm  \nNSR-10 – Capítulo E.5 – Losas de entrepiso, cubiertas, muros divisorios y parapetos      E-19      E.5.1.5.2.1   —  Los  refuerzos  especificados  en  la  tabla  E.5.1-3,  solo  son  aplicables  para  una  carga    muerta de muros y acabados de máximo 1 kN/m2, y una carga viva de 1.8 kN/m2. Para condiciones   de cargas diferentes a las expresadas en este numeral, el diseño de la placa debe hacerse según lo   estipulado en el Titulo C del presente Reglamento.         E.5.2 — CUBIERTAS      E.5.2.1   —   GENERAL   —  Los  elementos  portantes  de  cubierta,  de   cualquier  material,  deben  conformar  un  conjunto    estable  para  cargas  laterales.  Por  lo   tanto,  se  deben  disponer  sistemas   de  anclaje  en  los  apoyos  y  suficientes    elementos de arriostramiento como tirantes, contravientos,  riostras, etc. que garanticen la estabilidad del conjunto.      E.5.2.2  —  SOLERAS  — Las correas o los elementos que transmitan las cargas de cubierta a los muros estructurales   de carga, deben diseñarse para que puedan transferir las ca rgas tanto verticales como horizontales y deben anclarse   en la solera que sirve de amarre al muro confinado (viga o cinta de amarre).      E.5.2.3  —  CUBIERTAS EN CONCRETO  — Cuando la cubierta sea construida en concreto reforzado debe cumplir los   requisitos de E.5.1. Deben tomarse precauciones para evitar  que la exposición directa a la radiación solar produzca   expansiones y contracciones que lesionen la integridad de los muros estructurales.      E.5.2.4  —  SECCIONES Y ESPACIAMIENTOS DE ELEMENTOS PORTANTES DE CUBIERTAS  — Pueden utilizarse   los valores dados en las tablas E.9.2-1 y E.9.2-2, para  construcción de cubiertas con correas de guadua y correas de   madera, respectivamente.         E.5.3 — MUROS DIVISORIOS     E.5.3.1  —  GENERAL  — Los muros divisorios sólo cumplen la función de separar espacios dentro de la edificación y   por lo tanto no se consideran estructurales. Deben ser capace s de resistir las fuerzas que el sismo les impone bajo su   propio  peso.  Los  muros  divisorios  de  mampostería  deben  estar  adheridos  a  la  estructura  general  de  la  edificación    mediante  mortero  de  pega  en  los  bordes  de  contacto  con   los  diafragmas  superior  e  inferior  y  con  los  muros    estructurales  adyacentes.  Deben  tomarse  todas  las  precauci ones  para  evitar  que,  ante  la  ocurrencia  de  un  sismo,    estos muros divisorios se vuelquen, especialmente cuando  no son de altura total y no lleguen al diafragma estructural   en su parte superior. Cuando el muro divisorio consista  en un solo paño aislado, debe anclarse al diafragma superior   por  medio  de  refuerzos  resistentes  a  tracción,  que  impidan   su  vuelco.  Los  elementos  divisorios  en  materiales  más    flexibles (madera, canceles, cartón y yeso, plástico, etc.) se deben anclar a la estructura principal.         E.5.4 — PARAPETOS Y ANTEPECHOS      E.5.4.1   —   GENERAL   —  Los  parapetos  actúan  como  elementos  en  voladizo  sometidos  a  una  fuerza  horizontal    perpendicular a su propio plano.       E.5.4.1.1  —  Parapetos  — Todo tipo de parapeto de altura igual o inferior a 1.5 m se debe anclar al diafragma   inmediatamente  inferior  mediante  una  cinta  de  remate  y  columnas  de  amarre  ubicadas  a  distancias  no    mayores  de  3  m,  teniendo  siempre  una  columna  de  am arre  en  cada  extremo.  Los  parapetos  de  alturas    mayores a la indicada deben diseñarse siguiendo las prescripciones del Título D.      E.5.4.1.2   —   Antepechos   —  Los  antepechos  de  mampostería  para  balcones  se  deben  anclar  al  diafragma    inferior  mediante  una  cinta  de  remate  y  columnas  ubicadas  en  las  esquinas,  en  los  extremos  y  a  distancias    intermedias no mayores de 1.5 m.                  n         \nNSR-10 – Capítulo E.5 – Losas de entrepiso, cubiertas, muros divisorios y parapetos      E-20      Notas    \nNSR-10 – Capítulo E.6 – Recomendaciones adiciona les de construcción en mampostería confinada       E-21   CAPÍTULO E.6   RECOMENDACIONES ADICIONALES DE CONSTRUCCIÓN EN   MAMPOSTERÍA CONFINADA        E.6.1 — GENERALIDADES     E.6.1.1  — Por ser de carácter muy general las disposiciones establecidas en los capítulos anteriores y por no requerir   supervisión  técnica  especial  para  las  construcciones   aquí  establecidas,  las  actividades  de  construcción  deben  ser    especialmente  cuidadosas  con  objeto  de  que  el  funcionam iento  previsto  de  la  obra  en  eventos  sísmicos  sea    apropiado.  El  grado  de  generalización  involucrado  no  exime  de  las  verificaciones  de  calidad  en  los  materiales    utilizados, del cumplimiento de la s tolerancias establecid as a lo largo de este reglamen to, ni de los procedimientos de   obra  realizados  al  mejor  nivel  posible.  A  continuación  se   establecen,  de  manera  simplificada  y  también  general,  los    procedimientos de ejecución de la construcción.         E.6.2 — CIMENTACIONES   E.6.2.1  —  ADECUACIÓN DEL TERRENO  — En esta fase se deben retirar los materiales no apropiados para soporte   de la edificación como son escombros, material vegetal, s uelo suelto, etc. Igualmente se deben realizar los drenajes   interiores  y  laterales  necesarios  y  se  deben  determinar  los  niveles  necesarios  de  tuberías  y  de  la  malla  de    cimentación.  Si  fuere  necesario,  se  deben  ejecutar  las   plataformas  de  suelo  mejorado,  compactado  en  capas  no    mayores de 150 mm ni menores de 100 mm.       E.6.2.2  —  ZANJAS  — Se deben realizar de manera simultánea las zanjas requeridas para las instalaciones y para la   malla de cimentación. Del fondo de las zanjas para los element os estructurales se debe retirar el material suelto y se   debe colocar un mortero pobre de limpieza de unos 40 mm de espesor.        E.6.2.3   —   COLOCACIÓN  DE  LAS  ARMADURAS   —  Tanto  los  refuerzos  longitudinales  como  los  refuerzos    transversales  deben  estar  separados  del  suelo  natural  no  menos  de  50  mm  en  suelo  seco,  ni  menos  de  75  mm  en    suelo  húmedo.  Las  tolerancias  en  recubrimientos  y  colocación  de  las  armaduras  con  respecto  a  lo  indicado  en  los    planos debe ser de 10 mm. Una vez colocadas las armaduras de  la cimentación, se deben fijar y anclar las armaduras   de arranque de las columnas en los sitios indicados en los planos.      E.6.2.4  —  COLOCACIÓN DEL CONCRETO  — El concreto de la malla de cimentación se debe colocar empezando   por  los  ejes  de  los  muros  de  carga  y  siguiendo  con  los  ejes  transversales  en  barrido  continuo.  La  suspensión    provisional  del  vaciado  del  concreto  se  debe  hacer  mediante  juntas  verticales  en  los  ejes  de  los  muros  de  rigidez    (transversales  a  los  de  carga).  Durante  la  compactación  del   concreto  colocado  debe  evitarse  cualquier  modificación    en la posición de las armaduras de arranque de las columnas.         E.6.3  —  MUROS ESTRUCTURALES Y COLUMNAS DE CONFINAMIENTO     E.6.3.1  — En la ejecución de los muros se de be utilizar el siguiente procedimiento.      (a)  Hiladas de sobrecimiento  — Se debe picar, limpiar y humedecer la  parte superior del concreto ciclópeo   donde  se  coloca  el  mortero  de  pega  de  la  primera  hilada.  Este  mortero  debe  contener  un    impermeabilizante  integral.  La  primera  hilada  de  sobrecimiento,  o  hilada  madrina,  debe  ir  rematada  con    mortero que también contenga impermeabilizante integral.   (b)  Ejecución del muro  — La construcción del muro se debe ejecutar siguiendo el patrón de colocación de   las  unidades,  teniendo  la  precaución  de  dejar  los  espacios  requeridos  para  las  columnas  de    confinamiento.  Al  momento  de  la  ejecución  del  muro,  se  deben  colocar  los  conectores  flexibles    establecidos para las intersecciones con muros no estructurales.      E.6.3.2   —   EJECUCIÓN  DE  LAS  COLUMNAS  DE  CONFINAMIENTO   —  Una  vez  se  haya  dispuesto  el  refuerzo    vertical y el refuerzo horizontal de las columnas, se deben  colocar los testeros laterales que constituyen la formaleta   de las columnas, permitiendo que el concreto fundido haga contac to con la superficie terminal del muro confinado, la   cual debe estar libre de rebabas y de materiales que restrinjan la adherencia entre el concreto y la mampostería. El  \nNSR-10 – Capítulo E.6 – Recomendaciones adiciona les de construcción en mampostería confinada       E-22   refuerzo  vertical  de  la  columna  debe  sobresalir  de  la  s uperficie  de  enrase  la  cantidad  necesaria  para  realizar  los    empalmes por traslapo con la columna superior si la hubiese;  el remate del refuerzo vertical debe anclarse, llevándolo   hasta  la  parte  superior  de  la  viga  de   confinamiento,  ut ilizando  ganchos  de  90 ° .  La  parte  superior  del  gancho  debe    quedar a distancia no mayor de 50 mm de la cara superior de la viga ó cinta de remate.      E.6.3.3  —  EJECUCIÓN DEL CONTRAPISO  — Una vez vaciadas las columnas de confinamiento del primer piso se   deben  ejecutar  los  rellenos  complementarios  en  recebo  entre  el  suelo  natural  y  la  loseta  de  contrapiso.  Sobre  la    superficie  nivelada  del  recebo,  se  deben  colocar  las  armaduras  de  la  loseta,  para  proceder  a  vaciar  el  material  de    ésta,  (concreto  con  agregado  fino  o  mortero  con  arena  gr uesa),  llevándola  siempre  hasta  la  cara  de  los  muros    estructurales y las columnas.      E.6.3.4  —  EJECUCIÓN DE LOS MUROS NO ESTRUCTURALES  — En los sitios indicados en los planos, se debe   construir  la  primera  hilada,  con  mortero  colocado  directamen te  sobre  el  contrapiso.  Las  conexiones  requeridas  para    intersecciones se deben anclar en  las correspondientes juntas de pega.         E.6.4  —  LOSA DE ENTREPISO     E.6.4.1   —  La  colocación  de  los  elementos  prefabricados  del  entrepiso,  si  los  hay,  y  de  las  formaletas,  cimbras,    testeros, etc. debe realizarse de acuerdo con los planos.      E.6.4.2  — Una vez se hayan colocado las armaduras de vigas, las conexiones mecánicas especiales, las armaduras   de la losas, etc., se puede proceder al vaciado y compac tación del concreto del entrepiso, sometiéndolo a un proceso   de  curado  adecuado.  Deben  haber  transcurrido  por  lo  menos  24  horas  entre  el  vaciado  de  las  columnas  de    confinamiento y el vaciado de la losa de entrepiso.       E.6.4.3   —  A partir  de  ejecución  de  la  losa  de  entrepiso  el proceso de ejecución  del segundo  nivel  es  idéntico  al del    primer nivel hasta la altura de dinteles.         E.6.5 — CULATAS, AMARRES Y CUBIERTAS     E.6.5.1   —  En  esta  fase  del  proceso  constructivo  se  deben  ejecutar  las  vigas  de  amarre,  las  soleras,  las  culatas    laterales  (cuchillas)  y  los  anclajes  de  cubierta.  Las  columnas  se  deben  vaciar  previamente  hasta  altura  de  dinteles    dejando la longitud de refuerzo para empalmes ó con la longitud total del mismo hasta nivel de remate.      E.6.5.2  — Los remates de todo tipo de refuerzo longitudinal de columnas, vigas de amarre ó cintas, debe terminar en   ganchos estándar a 90 ° , anclando cada refuerzo de un elemento, en  el elemento que le sea transversal.         E.6.6 — COMPLEMENTOS     E.6.6.1  — Los aspectos de construcción aquí dispuestos, se pueden complementar con lo establecido en los capítulos   D.4 y D.10 del presente Reglamento.            n            \nNSR-10 – Capítulo E.7 – Bahareque encementado      E-23   CAPÍTULO E.7   BAHAREQUE ENCEMENTADO        E.7.1  —  INTRODUCCIÓN     E.7.1.1   —  El  presente  capítulo  contiene  los  requisitos  míni mos  necesarios  para  otorgar  a  las  casas  de  bahareque    encementado,  con  uno  y  dos  pisos,  un  grado  de  sismo  resistencia  tal  que  minimice  la  posibilidad  de  que  la    construcción  colapse  durante  eventos  sísmicos  fuertes  de  baja  probabilidad  de  ocurrencia,  que  sufra  daños    estructurales  mínimos  durante  eventos  sísmicos  mode rados  y  que  no  sufra  daños  estructurales  durante  eventos    sísmicos leves de alta probabilidad de ocurrencia.      E.7.1.2   —  El  presente  documento  no  sustituye  la  intervenci ón  y  la  competencia  profesional  de  los  Ingenieros  y    Arquitectos,  cuya  responsabilidad  y  participación  en  el   diseño  y  construcción  de  edificaciones  se  reglamenta  en  el    Título VI de la Ley 400 de 1997.          E.7.2 — ALCANCE     E.7.2.1   —  En  este  capítulo  se  dan  los  requisitos  mínimos  que  se  deben  seguir  en  el  diseño  y  construcción  de    viviendas de uno y dos pisos, realizadas en bahareque encementado, que pertenecen al grupo de uso  I,  tal como lo   define A.2.5.1.4 y dentro de las limitacio nes establecidas en A.1.3.11, es decir,  construcciones de uno y dos pisos que   formen parte de programas de máximo 15 viviendas y menos de 3000 m2 de área construida.       E.7.2.2   —  Para  el  diseño y  construcción  de  programas  de  viviendas  de  uno  y dos pisos con  más de  15 unidades  o    más de 3000 m2 de área construida, se requiere la realización de  estudios completos de análisis y diseño estructural   de acuerdo con el siguiente derrotero:   (a)    Estudios geotécnicos de acuerdo con el Título H   (b)    Cimentaciones en concreto de acuerdo con el Título C   (c)    Sobre cimentaciones en concreto de acuerdo con el Título C.   (d)    Sobre cimentaciones en mampostería de acuerdo con el Título D.   (e)    Análisis  estructural  de  acuerdo  con  las  previsio nes  de  diseño  sismo  resistente  del  Título  A,  los    requerimientos para cálculo de cargas del Título B, y los requisitos de análisis del Apéndice E-A   (f)  Diseño y construcción de entrepisos y cubiertas de madera, de acuerdo con los requisitos para diseño y   construcción del Título G.   (g)    Diseño  y  construcción  de  los  componentes  en  bahar eque  en  cementado,  no  reglamentados  por  lo    anterior, se llevará a cabo con base en lo establecido en el presente capítulo.          E.7.3 — GENERALIDADES     E.7.3.1  —  DEFINICIÓN  —   El  bahareque  encementado  es  un  sistema  estructural  de  muros  que  se  basa  en  la    fabricación  de  paredes  construidas  con  un  esqueleto  de  guadua,  o  guadua  y  madera,  cubierto  con  un  revoque  de    mortero de cemento aplicado sobre malla de  alambre, clavada en esterilla de guadua  que, a su vez, se clava sobre el   esqueleto del muro.      E.7.3.2  —  CONSTITUCIÓN  —   El  bahareque  encementado  es  un  si
