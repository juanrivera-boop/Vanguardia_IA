stema  constituido  por  dos  partes  principales:  el    entramado y el recubrimiento. Ambas partes se  combinan para conformar un material compuesto.      E.7.3.2.1  —  Entramado  — El entramado está constituido por dos soleras o elementos horizontales, inferior y   superior,  y  pie-derechos  o  elementos  verticales,  conect ados  entre  sí  con  clavos  o  tornillos.  El  marco  del    entramado,  es  decir  las  soleras  y  el  pie-derechos  exteriores,  pueden  construirse  con  guadua  o  con  madera    aserrada. El resto del entramado se constr uye con guadua. Puede contener diagonales.      E.7.3.2.2  —  Recubrimiento  — El recubrimiento se fabrica con mo rtero de cemento aplicado sobre malla de   alambre, tal como se especifica en E.7.4.5. La malla  debe estar clavada sobre esterilla de guadua, o sobre un   entablado. La esterilla debe ir anclada a los pié-derec hos mediante clavos y alambre dulce trenzado entre los   clavos.     \nNSR-10 – Capítulo E.7 – Bahareque encementado      E-24      E.7.4 — MATERIALES     E.7.4.1 — GUADUA     E.7.4.1.1   —  El  material  predominante  de  este  sistema  constructivo  es  la  guadua,  cuya  mejor  calidad  se    consigue en plantas en estado maduro, es decir, mayores de 4 años. No puede utilizarse guadua con más del   20%  de  contenido  de  humedad  ni  por  debajo  del  10%.   En  todo  caso,  el  contenido  de  humedad  debe  estar    cercano a la humedad de equilibrio ambi ental para madera, tal como se def ine en la Figura 2.3, del numeral   “2.2.1. Influencia del secado sobre los Elementos de  Madera”, del Manual de diseño para maderas del Grupo   Andino.        E.7.4.1.2   —  La  guadua  debe  inmunizarse  para  evitar  el  ataqu e  de  insectos  xilófagos.  El  inmunizado  no    constituye protección contra otros  efectos ambientales, de manera que la guadua no puede exponerse al sol   ni al agua, en ninguna parte de la edificación, pues la acción de los rayos ultravioletas produce resecamiento,   fisuración, decoloración y pérdida de brillo, y los cambios de humedad pueden causar pudrición.      E.7.4.2 — MADERA Y COMPLEMENTARIOS      E.7.4.2.1 —  La calidad de la madera aserrada y de los elementos metálicos de unión deberá regirse por G.1.3   de este Reglamento.       E.7.4.2.2   —  La  clasificación  mecánica  de  las  maderas  us adas  en  muros,  entrepisos  y  cubiertas  deberá    corresponder, como mínimo, al grupo ES6,  según G.1.3.5 del presente Reglamento.      E.7.4.3 — MORTERO      E.7.4.3.1  —   La  calidad  del  mortero  de  cemento  para  el  revoque  de  muros  y  para  el  relleno  de  cañutos  se    regirá  por  D.3.4.  La  clasificación  mínima  requerida   será  la  correspondiente  al  mortero  tipo  N,  con  una    proporción en volumen de máximo 4 partes de arena por una parte de cementante.       E.7.4.3.2 —  Las calidades del cemento y de la cal, en caso de agregarse ésta, son las indicadas en el aparte   D.3.2 del Reglamento.      E.7.4.4 — CONCRETO Y ACERO DE REFUERZO      E.7.4.4.1 —  Las calidades del concreto y de las armaduras para cimentaciones, de las vigas de amarre y de   los  elementos  de confinamiento  de mampostería, donde  s ean aplicables,  se  regirán  por  lo  establecido  en  el    capítulo C.3.      E.7.4.5 — MALLAS DE REFUERZO DEL REVOQUE      E.7.4.5.1 —  Podrán usarse los siguientes tipos:      (a)    Malla  de  alambre  trenzado  con  diámetro  máximo  de  1,25  mm  (BWG  calibre  18),  de  abertura    hexagonal no mayor a 25,4 mm.   (b)    Malla de alambre electrosoldado con diámetro máxi mo de 1,25 mm (BWG calibre 18), de abertura   cuadrada no mayor a 25,4 mm.   (c)    Malla de revoque de lámina metálica expandida, sin vena estructural.   (d)    Malla de revoque de lámina metálica expandida, con vena estructural.      E.7.4.5.2  —   El  uso  de  las  mallas  listadas  en  el  numeral  anterior  no  exime  del  uso  de  esterilla  de  guadua  o    entablado  de  madera,  a  menos  que  se  demuestre,  por  medio  de  pruebas  experimentales,  que  el    comportamiento  del  material  resultante  es,  cuando  menos,  equivalente  al  material  con  la  esterilla  o  el    entablado, al tenor de lo dispuesto en los artículos 13º y 14º de la Ley 400 de 1997.       \nNSR-10 – Capítulo E.7 – Bahareque encementado      E-25   E.7.5 — CLASIFICACIÓN DE MUROS     Los muros de una casa de uno o dos pisos de bahareque ence mentado, dentro del alcance del presente Capítulo, se   clasifican en tres tipos .       E.7.5.1  —  MUROS  ESTRUCTURALES  CON  DIAGONALES  —   Son  muros,  o  segmentos  de  muros,  estructurales,    compuestos  por  solera  inferior,  solera  superior  (o  carr era),  pie-derechos,  elementos  inclinados  y  recubrimiento  con    base  en  mortero  de  cemento,  colocado  sobre  malla  de  alam bre,  clavada  sobre  esterilla  de  guadua  o  entablado  de    madera.  Estos  muros  reciben  cargas  verticales  y  resi sten  fuerzas  horizontales  de  sismo  o  viento.  Los  muros    estructurales con diagonales deben colocarse en las esquinas de la construcción y en los extremos de cada conjunto   de muros estructurales.       E.7.5.2  —  MUROS  ESTRUCTURALES  SIN  DIAGONALES  —   Son  muros,  o  segmentos  de  muros,  estructurales,    compuestos  por  solera  inferior,  solera  superior  (o  carrer a),  pie-derechos  y  recubrimiento  con  mortero  de  cemento,    colocado sobre malla de alambre, clavada sobre ester illa de guadua y que carecen de elementos inclinados. Deben   utilizarse únicamente para resistir carg as verticales. No deben constituirse en segmentos de los extremos de muros.       E.7.5.3  —   Tanto  los  muros  estructurales  con  diagonales  como  los  que  no  tienen  diagonales  deben  construirse    apoyados sobre vigas de cimentación o en  sobrecimientos, a su vez apoyados s obre vigas de cimentación. Los muros   estructurales deben tener continuidad desde la cimentación ha sta el diafragma superior con  el cual están conectados.      E.7.5.4 — MUROS NO ESTRUCTURALES —  Los muros que no soportan cargas diferentes a las de su propio peso   se conocen con el nombre de muros no estructurales. Esto s muros no tienen otra función que la de separar espacios   dentro de la vivienda. Los muros no estructurales interiores  deben conectarse con el diafragma superior por medio de   una  conexión  que  restrinja  su  volcamiento,  pero  que  impida   la  transmisión  de  cortante  o  carga  vertical  entre  la    cubierta o el entrepiso y el muro no estructural. Los muro s no estructurales no necesitan ser continuos y no requieren   estar anclados al sistema de cimentación.         E.7.6 — COMPOSICIÓN DE MUROS      E.7.6.1  — Los muros de bahareque encementado deben componerse de un entramado de guaduas o de guaduas y   madera,  constituido  por  elementos  horizontales  llamados  so leras  (la  solera  superior  también  se  llama  carrera),    elementos verticales llamados pie-derechos y recubrimient o de mortero de cemento. Las guaduas no deben tener un   diámetro inferior a 80 mm. El espaciamiento horizontal entre  pié-derechos no debe ser inferior a 300 mm ni superior a   600 mm, entre ejes.      E.7.6.2   —  El  recubrimiento  de  mortero  debe  aplicarse  sobre  una  malla  de  alambre  delgado  (diámetro  no  superior  a    1,25 mm), que a su vez se clava sobre esterilla de g uadua, de acuerdo con lo especificado en E.7.4.5.      E.7.6.3   —  La  sección  de  las  soleras  tendrán  un  ancho  mínimo  igual  al  diámetro  de  las  guaduas  usadas  como  pie-  derechos  y  una  altura  no menor  de 100  mm.  Es  preferible construir  las soleras,  inferior  y superior  de  cada  muro en    madera  aserrada,  ya  que  sus  uniones  permiten  mayor  rigi dez  y  son  menos  susceptibles  al  aplastamiento  que  los    elementos de guadua.      E.7.6.4   —  Los  muros  de  bahareque  encementado  podrán  tener recubrimiento por ambos  lados.  Si no  es  posible,  la    longitud  efectiva  del  muro  con  recubrimiento  por  un  solo  lado  debe  considerarse  como  la  mitad  de  su  longitud  total    real, para efectos de los requerimientos  especificados en E.7.8.1 y E.7.8.2.         E.7.7 — DIAFRAGMAS      E.7.7.1  — Las soleras deben conformar conjuntamente con los entrepisos y la estructura de la cubierta un diafragma   que traslade las cargas horizontales a los muros estructurale s. Deben proveerse uniones o vínculos entre los muros y   los diafragmas, como se indica en el numeral E.8.3 del presente Título.       E.7.7.2  — Deben colocarse tirantes y cuadrantes en el nivel de so lera superior de cada piso, para garantizar el efecto   de  diafragma.  Los  cuadrantes  bastan  cuando  los  espacios  rectangulares  entre  muros  no  superan  relaciones  de  1,5    sobre 1 entre lado mayor y lado menor. Para relaciones  mayores, deben colocarse tirantes que dividan los espacios   rectangulares en espacios con relaciones menores de 1,5 sobre 1.  \nNSR-10 – Capítulo E.7 – Bahareque encementado      E-26      E.7.7.3  — Los diafragmas deben existir en los nivele s de cimentación, de entrepisos y de cubierta.          E.7.8 — LONGITUD DE MUROS EN CADA DIRECCIÓN      Para proveer un reparto uniforme de la responsabilidad para re sistir las fuerzas sísmicas en  el intervalo inelástico, los   muros  estructurales  que  se  dispongan  en  cada  una  de  las  direcciones  principales  deben  cumplir  con  las  siguientes    condiciones:      E.7.8.1 — LONGITUD MÍNIMA  — La longitud de muros en cada dirección debe satisfacer la ecuación E.7.8-1      i   B   p   L   C   A    ≥     (E.7.8-1)      En donde:     iL     =   longitud mínima total de muros continuos (en m), sin aberturas, en la dirección    i      BC     =  coeficiente (en m-1), especificado en la tabla E.7.8-1, en función de la aceleración espectral  aA    para el   sitio donde se realice la cons trucción, de acuerdo con A.2.3.   pA     =   área de la cubierta (en m2), para viviendas de un piso, o para los muros del segun especificada  por  la  ecuación  E.7.8-1,  es  suficiente  para    resistir las cargas horizontales calculadas.      E.7.8.4  —  VERIFICACIÓN  DE  LA  ASIMETRÍA  DE  MUROS  EN  PLANTA  —   En  los  casos  en  los  cuales  no  se    cumplan  los  requisitos  expresados  en  E.7.8.2,  debe  hacers e  de  nuevo  la  distribución  de  los  muros  en  planta  hasta    lograr cumplir con la ecuación E.7.8-2. Sí en este proceso  se reduce la longitud total de muros en cualquier dirección   y  cualquiera  de  los  niveles,  debe  verificarse  de  nuevo  el  cu mplimiento  con  la  ecuación  E.7.8-1,  de  acuerdo  con  lo    estipulado en E.7.8.3.      E.7.8.5  —  ENCHAPES  PARA  MUROS  —   Deben  evitarse  los  enchapes  pesa dos  en  fachadas.  En  baños,  debe    enchaparse  completamente  la  zona  húmeda,  para  lo  cual  se  recomienda  colocar  el  enchape  pegado  con  mortero    impermeable. Todo enchape de fachada debe estar adecuadamente fijado para evitar que se desprenda durante los   sismos.         E.7.9 — COLUMNAS DE GUADUA     Las  columnas  son  elementos  estructurales  proporcionados   para  resistir  cargas  verticales,  en  forma  aislada  o  en    combinación  con  los  muros  estructurales.  Las  columnas  no  deben  considerarse  componentes  del  sistema  de    resistencia sísmica en vivienda s en bahareque encementado.        E.7.10 — UBICACIÓN Y  DISEÑO DE COLUMNAS     E.7.10.1  —   Las  columnas  se  localizarán  en  puntos  de  la  edificación  donde  la  magnitud  o  la  posición  de  las  cargas    verticales  transmitidas  por  cubiertas  o  entrepisos  exced an  la  capacidad  de  los  muros  estructurales,  o  donde  no  se    disponga de ellos, como es el caso de galerías abiertas, corredores y aleros.      E.7.10.2  —   Si  las  columnas  se  construyen  en  guadua,  debe   evitarse  la  acción  directa  del  sol  y  del  agua.    Necesariamente deben aislarse del piso por medio de un dado en concreto o en mampostería y una unión, como se   indica en el numeral E.8.5.2 de este Título.      E.7.10.3 —  El número de guaduas requeridas para cada columna  se debe estimar con base en la tabla E.7.10-1.      Tabla E.7.10-1   ApAp  =  Planta de   la edificación    Rectángulo menor   que contiene el   área de cubierta o   entrepiso  \nNSR-10 – Capítulo E.7 – Bahareque encementado      E-28   Carga admisible en Columnas de guadua (kN)*      Número de guaduas     Altura (m)  1  2  3  4    1.0  43.1  86.2  129.3  172.4    1.5  38.6  77.2  115.8  154.4    2.0  28.7  57.4  86.1  114.8    2.5  18.4  36.8  55.2  73.6    3.0  12.8  25.6  38.3  51.1    3.5  9.4  18.8  28.2  37.6    4.0  7.2  14.4  21.6  28.    *   Para   guaduas   de   más   de   100   mm   de   diámetro   y   10   mm   de    espesor   de   pared       E.7.10.4 —  Si se requiere más de una guadua para formar la columna éstas deben conectarse entre sí con zunchos   con espaciamientos que no excedan un tercio de la altura de la columna.       E.7.10.5 —  Si las columnas se construyen en madera, deben diseñarse de acuerdo con el Título G.      E.7.10.6 —  Si las columnas se construyen en acero, debe n diseñarse de acuerdo con el Título F.      E.7.10.7 —  Si las columnas se construyen en concreto, deben diseñarse de acuerdo con el Título C.       E.7.10.8 —  Si las columnas se construyen en mampostería,  deben diseñarse de acuerdo con el Título D.         E.7.11 — AMARRES Y CONT INUIDAD DE COLUMNAS     E.7.11.1  —   Las  columnas  deben  conectarse  entre  sí  y  con  los  muros  estructurales  vecinos.  Además,  las  columnas    deben conectarse con el diafragma que soportan con una uni ón articulada, que no transmita tensiones de flexión.                  █      \nNSR-10 – Capítulo E.8 –Entrepisos y uniones en bahareque encementado      E-29    CAPÍTULO E.8   ENTREPISOS Y UNIONES EN BAHAREQUE ENCEMENTADO      E.8.1 — ENTREPISOS   El  entrepiso  debe  soportar  las  cargas  verticales  establecidas   en  el  Título  B.  Debe  poseer  suficiente  rigidez  en  su    propio plano para garantizar su trabaj o como diafragma y debe consistir en:      (a)    Largueros, viguetas o alfardas que soporten el recubrimiento o piso.   (b)    El recubrimiento debe resistir la  fuerza cortante y puede hacerse de:   1.  Esterilla de guadua, malla de refuerzo electrosoldado y mortero de cemento,   2.  Malla expandida, malla de refuerzo electrosoldado y mortero de cemento, o   3.  Tablas de madera clavadas a la estructura de soporte del entrepiso.   (c)    Las soleras o carreras, que enmarcan el diafragma y  forman parte del sistema de resistencia en su plano.      E.8.1.1 —  Como se señala en E.7.7, los entrepisos deben formar  un diafragma que trabaje como un conjunto. Para   ello, los elementos del entrepiso deben estar debidamente vi nculados. Sin embargo, no es necesario que el entrepiso   funcione como un diafragma infinitamente rígido en su propio plano.        E.8.1.2 —  No se permiten entrepisos en losa de concreto para viviendas en bahareque encementado construidas de   acuerdo con el presente Capítulo.         E.8.2 — COMPOSICIÓN DE ENTREPISOS     E.8.2.1   -  En  la  construcción  con  bahareque  encementado,  el   entrepiso,  las  soleras  y  carreras,  se  construirán  con    madera estructural con una clasificación de, por lo meno s, Grupo ES6, de acuerdo con G. 1.3.5. Alternativamente, en   el  caso  de  construir  la  estructura  de  entrepiso  en  guadu a,  deben  colocarse  guaduas  dobles,  una  encima  de  la  otra,    zunchadas entre sí, haciendo de largueros a las distancias indicadas en la tabla E.8.2-1. Debe colocarse, como friso   de borde, una vigueta de madera de sección vertical equivalent e a la altura de las dos guaduas que constituyen los   largueros  y  entre  cada  larguero,  compuesto  por  dos  guaduas  apiladas,  un  taco  de  madera,  de  tal  manera  que  se    reduzca  el  riesgo  de aplastamiento  de  las  guaduas.  Los cañutos  donde  se  apoyan  las  guaduas  y  los que  entren en    contacto  con  los  muros  deben  llenarse  con  mortero  de  ceme nto.  Se  requieren  arriostr amientos  transversales  o    atraques intermedios entre los largueros.      Tabla E.8.2-1   Secciones requeridas para entrepisos con viguetas de guadua*           Espaciamiento S (m)   Luz (m)  0.25  0.5  0.75  1.00   2,0  1 guadua  2 guaduas   V   2 guaduas   V   2 guaduas   V   2.5  2 guaduas   V   2 guaduas   V   2 guaduas   V   2 guaduas   V   3.0  2 guaduas   V   2 guaduas   V   3 guaduas   V   3 guaduas   V   3.5  2 guaduas   V   3 guaduas   V   3 guaduas   V   3 guaduas   V   4.0  2 guaduas   V   3 guaduas   V   3 guaduas   V  —   4.5  3 guaduas   V   3 guaduas   V  —  —    *Para una carga muerta de 1.1 kN/m2 y una carga viva de 1.8 kN/m2   * Guaduas de 110mm de diámetro y 10 mm de espesor de pared   V= guaduas dispuestas en arreglo vertical.      E.8.2.2 —  Como recubrimiento del entrepiso puede usarse un mortero de cemento reforzado con malla electrosoldada  \nNSR-10 – Capítulo E.8 –Entrepisos y uniones en bahareque encementado      E-30    D50  o  equivalente,  es  decir,  que  aporte  alrededor  de  0,5  cm2  de  área  de  acero,  por  metro  lineal  de  malla.  Sobre  el    mortero  se  deben  colocar  acabados  livianos  como  colorantes  integrados,  pinturas  o  baldosas  de  vinilo.  No  debe    utilizarse  baldosas  de  cemento  u  otros  pisos  pesados   y  rígidos,  a  menos  que  se  realicen  análisis  y  diseño    estructurales completos para toda la vivienda.       E.8.2.3 —  Si el entrepiso se construye con madera aserrada, la s secciones y espaciamientos serán los indicados en   las  tablas  E.8.2-2a,  E.8.2.2b,  E.8.2. 2c,  E.8.2.2d  y  E.8.2.2e.  El  recubrimi ento  debe  ser  de  listones  o  tablones  de    madera de 15 mm de espesor mínimo. Se requieren atraques intermedios para evitar el pandeo de los largueros.         Tabla E.8.2-2a   Secciones   requeridas   para   entrepisos   con   viguetas   de   madera   ES1   y   ES2*   (mm)       Espa    Según el material utilizado para la conexión entre guaduas  o entre madera y guaduas, las uniones se clasifican en:      E.8.4.1 — UNIONES CLAVADAS —  Se reservan para esfuerzos muy bajos ent re elementos de madera aserrada y   guadua,  como  por  ejemplo  de  pie-derecho  a solera en  muro.  No se  aceptan  para  la  unión de  dos  o  más  elementos    rollizos  de  guadua,  ya  que  la  penetración  y  el  impacto  de   los  clavos  producen  fisuración  de  la  guadua  debido  a  la    preponderancia  de  fibras  longitudinales.  Las  uniones  cl avadas  deben  usarse  solamente   para  ajuste  temporal  del    sistema durante el armado y no deben tenerse en cuenta como  conexiones resistentes entre  elementos estructurales.     \nNSR-10 – Capítulo E.8 –Entrepisos y uniones en bahareque encementado      E-32    E.8.4.2 — UNIONES PERNADAS —  Cuando sea necesario perforar la guadua  para introducirle pernos, debe usarse   taladro de alta velocidad y evitar impactos.       E.8.4.2.1  —   Todos  los  cañutos  a  través  de  los  cuales  se  atraviesen  pernos  o  barras  deben  rellenarse  con    mortero de cemento.       E.8.4.2.2 —  El mortero debe ser lo suficientemente fluido para  penetrar completamente dentro del cañuto. El   mortero  de relleno  debe proporcionarse  con  la  mínima   cantidad de  agua  necesaria para  obtener  una  fluidez    suficiente para inyectarse con muy poca presión, y sin  exceder una relación 4 sobre 1, por volumen, entre el   agregado fino y el cemento. Pueden usarse aditiv os reductores de agua de mezclado, no corrosivos.       E.8.4.2.3  —   Para  vaciar  el  mortero  debe  perforarse  la  gua dua  mediante  taladro  de  alta  velocidad  en  puntos    próximos a los tabiques de cada uno de los dos extrem os del cañuto que va a rellenarse. A través de uno de   los  orificios  se  inyectará  el  mortero  presionándolo  a  través  de  un  embudo  o  con  la  ayuda  de  una  bomba    manual. El orificio en el extremo opuesto si rve para el escape del aire atrapado.      E.8.4.2.4 —  Los pernos pueden fabricarse con barras de refu erzo roscadas en obra o con barras comerciales   de rosca continua.      E.8.4.3 — UNIONES ZUNCHADAS —  Las uniones zunchadas pueden utilizarse pa ra fabricar conexiones articuladas.   Para conexiones que deban resistir trac ción, la pletina debe diseñarse para gar antizar que no es el vínculo débil de la   unión. La unión no debe trabajar, en total, con más de 10 kN de esfuerzo de tracción.         E.8.5 — TIPOS DE UNIONES DE  ACUERDO CON LA FUNCIÓN     Las uniones entre los elementos de guadua y madera dentro de los muros de bahareque pueden ser del tipo uniones   clavadas. Las uniones de muros de bahareque entre sí y de  los componentes del bahareque con la cimentación y con   la  cubierta  deben  cumplir  funciones  estructurales,  t anto  de  rigidez  como  de  resistencia.  Las  uniones  entre    componentes, de acuerdo con su función, se clasifican en:      E.8.5.1 — UNIÓN CIMIENTO-MURO —  Los muros deben estar conectados efectivamente con la cimentación, sea en   contacto directo con las vigas de cimentación o atravesando los sobrecimientos.      E.8.5.1.1 —  Unión con soleras de madera aserrada  —  Cuando se utilice madera aserrada para las soleras,   la conexión con los cimientos se realizará con barras roscadas, ancladas a los mismos y de tal manera que   atraviesen las soleras y se fijen a éstas, con tuercas y arandelas. La madera debe separarse del concreto o   de la mampostería con papel impermeable u otra barrera similar.      E.8.5.1.2  —   Unión  con  soleras  de  guadua   —   Para  muros  fabricados  sólo  con  elementos  de  guadua,  los    muros  deben  conectarse  a  los  cimientos  fijando  los  pi e-derechos  necesarios,  de  acuerdo  con  E.7.8.3,  a  la    cimentación, tal como se establece para columnas de guadua en E.7.26.2.       E.8.5.2  —  UNIÓN  COLUMNA-CIMIENTO  —   La  guadua  no  debe  estar  en  contacto  directo  con  el  suelo,  la    mampostería o el concreto. La guadua se apoyará sobre un sepa rador de metal u otro material impermeable, como se   muestra en el Apéndice E-B.       E.8.5.2.1  —   Las  fuerzas  de  compresión  deben  transmitirse  a  tr avés  del  separador  a  la  cimentación.  Las    fuerzas de tracción se deben transmit ir a través de conexiones pernadas.  Un perno debe atravesar el primero   o  el  segundo  cañuto  de  la  guadua.  El  cañuto  atravesado  y  cualquier  cañuto  por  debajo  de  éste,  deben    rellenarse  con  mortero.  El  cañuto  debe  tener  un  nudo   en  su  extremo  inferior.  El  perno  se  debe  anclar  al    cimiento a través de pletinas o barr as con ojales, o barras dobladas, en  cada uno de sus extremos. El perno y   las  barras  de  sujeción  tendrán  un  diámetro  mínimo  de   9,5  mm,  mientras  que  si  se  utilizan  pletinas,  éstas    deben  tener  mínimo,  3,2  mm  de  espesor  y  50  mm  de  anchura.  Esta  conexión  debe  resistir  tracción  y  no  es    apropiada para resistir momento y se muestra en el Apéndice E-B.      E.8.5.2.2 —  El separador debe actuar también como elemento re sistente a corte, es de cir, como tope para el   movimiento  horizontal  entre  el  muro  y  el  cimiento.  Para  ello,  el  separador  debe  abrazar  el  elemento  de    guadua. Debe existir una unión completa por lo menos c ada 1,5 m, en los extremos de muros, en los bordes   de aberturas para puertas y en el punto medio del muro si su longitud es mayor de 1,5 m y menor de 3 m. El  \nNSR-10 – Capítulo E.8 –Entrepisos y uniones en bahareque encementado      E-33    separador-retenedor  puede  ser   una   pletina  de  acero  doblada  en  forma  de  U,  o  un  tubo  dentro  del  cual  se    empotra la guadua, tal como se ilustra en el Apéndice E-B.      E.8.5.2.3  —   Cuando  no  se  requiere  que  la  conexión  resist a  tracción,  la  guadua  puede  empotrarse  en  el    concreto y separarse de éste mediante una membrana bituminosa, como brea o asfalto.      E.8.5.2.4  —   Las  conexiones  con  los  cimientos   descritas  sirven  también  para  anclar  columnas  formadas  con    más de una guadua.      E.8.5.3 — UNIÓN COLUMNA-CUBIERTA —  La unión de las guaduas con la cubierta debe hacerse de forma similar   a  la  descrita  en  el  numeral  E.8.5.5  para  los  pié-derechos  de  los  muros.  Las  columnas  constituidas  por  más  de  una    guadua deben conectarse a la carrera superior del entrepiso  o de la cubierta, por medio de un elemento en madera   aserrada  que  garantice  el  contacto  completo  entre  el  el emento  horizontal  y  la  sección  transversal  de  todas  las    guaduas que componen la columna.       E.8.5.4 — UNIÓN ENTRE MUROS      E.8.5.4.1 —  Muros en el mismo plano  —  Los muros en el mismo plano se unen entre sí mediante pernos,   tuercas y arandelas, como se ilustra en el Apéndice  E-B. Debe haber por lo menos dos conexiones por unión,   colocadas cada tercio de la altura del muro. El perno debe tener, por lo menos 9.5 mm de diámetro. Si los pié-  derechos son de guadua los cañutos atravesados deben rellenarse con mortero.      E.8.5.4.2 —  Muros en planos perpendiculares  —  Cuando los muros que deben unirse están en diferentes   planos,  perpendiculares  entre  sí,  pueden  unirse  directamente  con  pernos,  tuercas  y  arandelas  en  una  sola    dirección,  o  a  través  de  un  elemento  adicional  en  la   intersección  de  los  muros,  utilizando  pernos,  tuercas  y    arandelas,  en  ambas  direcciones,  tal  como  se  ilustra  en  el  Apéndice  E-B.  El  espaciamiento  vertical  de  las    uniones es el mismo especificado en E.8.5.4.1.      E.8.5.5 — UNIÓN ENTRE MUROS Y CUBIERTA.      E.8.5.5.1  —   La  conexión  de  las  correas  con  los  muros  debe  hacerse  con  los  pié-derechos.  Esto  se  logra    mediante  un  perno  embebido  dentro  del  último  cañuto  co mpleto  del  extremo  superior  del  pie-derecho,  que    atraviesa la solera y la correa. Tanto el cañuto comp leto, como cualquier segmento de cañuto por encima de   él,  deben  rellenarse  con  mortero  de  ce mento  y  confinarse  con  zuncho  de   manera  que  se  evite  la  fisuración    longitudinal de la guadua debido a las tensiones de cortante por carga horizontal. Si la solera y/o la correa es   de guadua, deben rellenarse los cañutos atravesados con el perno de conexión.       E.8.5.5.2  —   Cuando  los  muros  se  fabriquen  mediante  paneles  debe  ponerse  un  elemento  continuo  uniendo    las  carreras  de  los  paneles.  La  conexión  con  la  cubier ta,  realizada  de  manera  similar  a  la  descrita  en  el    numeral  E.8.5.5.1,  mediante  perno  embebido  en  los  pi e-derechos  del  panel,  atravesando  tanto  la  carrera    superior del panel, como el elemento continuo, si rve también como elemento de unión entre éstos.        E.8.5.5.3 —  Las tejas deben amarrarse de las correas para formar un conjunto.       E.8.5.5.4  —   Si  se  construye  un  porche  anexo  a  los  muros  exteriores,  con  columnas  de  guadua,  la  cubierta    debe dotarse de un alero con las dimensiones necesarias para que no se exponga la guadua directamente a   la acción del sol y el agua.       E.8.5.5.5 —  Para aleros con más de 500 mm deberá construirs e un apoyo inclinado o pie de amigo, desde el   extremo exterior del alero hasta las columnas de guadua  que se quieren proteger, pero con una inclinación no   menor de 60º con la horizontal. El extremo inferior del pie de amigo debe apoyarse en una guadua distinta a   las  que  forman  las  columnas,  pero  que  está  zunchada  a  éstas  y  que  comparte  con  ellas  el  dado  de    cimentación. Las columnas deben estar espaciadas con distancias no mayores de 3 m.            █               \nNSR-10 – Capítulo E.8 –Entrepisos y uniones en bahareque encementado      E-34       Notas       \nNSR-10 – Capítulo E.9 – Cubiertas para construcción en bahareque encementado      E-35   CAPÍTULO E.9   CUBIERTAS PARA CONSTRUCCIÓN    EN BAHAREQUE ENCEMENTADO        E.9.1 — GENERAL     Los elementos portantes de la cubierta deben conformar un conjun to estable para cargas verticales y laterales, para lo   cual tendrán los anclajes y arriostramientos requeridos s egún se indica en el numeral E.8.5.5 de este capítulo.          E.9.2 — COMPOSICIÓN DE CU BIERTA Y SUS CONEXIONES     E.9.2.1  —   Las  correas  y  demás  elementos  que  transmitan  las  cargas  de  cubierta  a  los  muros  estructurales  deben    fijarse  entre  sí  y  conectarse  con  la  carrera  o  solera  su perior  que  sirve  de  amarre  de  los  muros  estructurales,  de    acuerdo con los numerales E.8.3 a E.8.5.      E.9.2.2  —   Las  correas  pueden  construirse  en  madera  aserrada   o  en  guadua.  Cuando  las  correas  se  construyen  en    guadua, los cañutos en contacto directo con el muro deben relle narse con mortero de cemento. En la tabla E.9.2-1 se   indican la composición y espaciamiento para correas en guadua.      Tabla E.9.2-1   Secciones requeridas para cubiertas con correas de guadua*      Espaciamiento S (m)  Luz (m)   0.50  1.00  1.50  2.00  2.50  3.00    2.0  1 guadua  2 guaduas V  2 guaduas V   2 guaduas V  2 guaduas V  2 guaduas V  2.5  2 guaduas V  2 guaduas V  2 guaduas V   2 guaduas V  2 guaduas V  3 guaduas V  3.0  2 guaduas V  2 guaduas V  2 guaduas V   3 guaduas V  3 guaduas V  3 guaduas V  3.5  2 guaduas V  3 guaduas V  3 guaduas V   3 guaduas V  3 guaduas V  3 guaduas V  4.0  2 guaduas V  3 guaduas V  3 guaduas V   3 guaduas V  —  —   4.5  3 guaduas V  3 guaduas V  3 guaduas V   —  —  —   *Para una carga muerta de 1.25 kN/m2 y una carga viva de0.5 kN/m2   * Guaduas de 110mm de diámetro mínimo y 10 mm de espesor de pared mínimo   V= guaduas dispuestas en arreglo vertical      E.9.2.3  —   Cuando  las  correas  se  construyen  en  madera  as errada,  las  secciones  y  espaciamientos  serán  las    indicadas en las tablas  E.9.2-2a. a E.9.2.2e         Tabla E.9.2-2a   Secciones requeridas para cubiert     function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }
    function rgbToHex(r, g, b) {
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
        return '#' + toHex(r) + toHex(g) + toHex(b);
    }
    function mixColors(colorA, colorB, amount) {
        const a = hexToRgb(colorA);
        const b = hexToRgb(colorB);
        return rgbToHex(a.r + (b.r - a.r) * amount, a.g + (b.g - a.g) * amount, a.b + (b.b - a.b) * amount);
    }
    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);
    }

    function applyPalette(palette) {
        currentPalette = palette;
        applyTheme(currentTheme);
        localStorage.setItem('downloaded-palette', JSON.stringify(palette));
    }
    function applyTheme(t) {
        currentTheme = t;
        document.body.classList.toggle('dark-mode', t === 'dark');
        themeBtn.textContent = t === 'dark' ? '☀️ Tema' : '🌙 Tema';
        const effectivePalette = buildThemePalette(t, currentPalette);
        setPaletteVariables(document.body, effectivePalette);
        setPaletteVariables(document.documentElement, effectivePalette);
        document.body.style.backgroundColor = effectivePalette.bgColor;
        document.body.style.color = effectivePalette.textColor;
        localStorage.setItem('theme', t);
    }
    themeBtn.addEventListener('click', () => { const n = currentTheme === 'dark' ? 'light' : 'dark'; applyTheme(n); });
    paletteBtn.addEventListener('click', () => { applyPalette(generatePalette()); });
    const savedPalette = JSON.parse(localStorage.getItem('downloaded-palette') || 'null');
    if (savedPalette) { applyPalette(savedPalette); }
    else if (INITIAL_PALETTE) { applyPalette(INITIAL_PALETTE); }
    else { applyPalette(generatePalette()); }
    applyTheme(currentTheme);

    // Second PDF (embedded or user-loaded)
    if (pdf2Text) { pdf2NameDisplay.textContent = pdf2Name + ' (incluido)'; pdf2StatusDisplay.textContent = '"' + pdf2Name + '" ya incluido.'; pdf2StatusDisplay.style.color = 'var(--success)'; }
    pdf2Upload.addEventListener('change', async (ev) => {
        const file = ev.target.files[0]; if (!file) return;
        if (!(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) {
            pdf2StatusDisplay.textContent = 'No es un PDF válido.'; pdf2StatusDisplay.style.color = 'var(--danger)'; return;
        }
        pdf2Name = file.name; pdf2NameDisplay.textContent = file.name;
        pdf2StatusDisplay.textContent = 'Procesando...'; pdf2StatusDisplay.style.color = 'var(--warning)';
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(e.target.result) }).promise;
                let text = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const tc = await page.getTextContent();
                    tc.items.forEach(item => text += item.str + ' ');
                    text += '\n';
                }
                pdf2Text = text;
                pdf2StatusDisplay.textContent = '"' + pdf2Name + '" cargado.'; pdf2StatusDisplay.style.color = 'var(--success)';
                addMsg('Segundo documento "' + pdf2Name + '" listo.', 'system');
            } catch(err) { pdf2StatusDisplay.textContent = 'Error al procesar.'; pdf2StatusDisplay.style.color = 'var(--danger)'; pdf2Text = ''; }
        };
        reader.readAsArrayBuffer(file);
    });

    function dismissThinkingAsSystem(text, asError) {
        const el = document.getElementById('thinking-msg');
        if (!el) return;
        el.className = 'system-message' + (asError ? ' error' : '');
        el.textContent = text;
        el.removeAttribute('id');
    }

    function addMsg(message, sender, isThinking = false) {
        const el = document.createElement('div');
        el.classList.add(sender === 'user' ? 'user-message' : sender.includes('system') ? 'system-message' : 'bot-message');
        if (sender.includes('error')) el.classList.add('error');
        if (sender === 'bot' && !isThinking) {
            const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
            const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;">' + html + '</div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else if (sender === 'bot') {
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong> <span class="thinking-animation">' + message + '</span></div></div>';
            el.id = 'thinking-msg';
        } else if (sender === 'user') {
            const userAvatarUrl = getAvatarUrl('user');
            el.innerHTML = '<div class="message user-message"><div class="message-bubble user-bubble"></div><img class="avatar-img" src="' + userAvatarUrl + '" alt=""></div>';
            el.querySelector('.user-bubble').textContent = message;
        } else {
            el.textContent = message;
        }
        chatDisplay.appendChild(el); chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }
    function updateLastMsg(message) {
        const el = document.getElementById('thinking-msg');
        const botAvatarUrl = getAvatarUrl('bot');
        const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
        const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
        if (el) {
            el.className = 'bot-message';
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;">' + html + '</div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            el.removeAttribute('id');
            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else addMsg(message, 'bot');
        chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }
    function escapeHtml(s) {
        if (s === undefined || s === null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getSessionHTML() {
        const clone = chatDisplay.cloneNode(true);
        const exportStyles =
            'body{font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;line-height:1.65;padding:28px;color:#333;max-width:880px;margin:0 auto;background:#fafafa;}' +
            'h1{color:#007bff;font-size:1.45em;margin-bottom:6px;}' +
            '.meta{color:#444;margin:6px 0;font-size:.95em;}' +
            'hr{border:none;border-top:1px solid #dee2e6;margin:22px 0;}' +
            '.chat-export{padding:4px 0;}' +
            '.chat-export .user-message,.chat-export .bot-message,.chat-export .system-message{margin-bottom:18px;}' +
            '.chat-export .system-message{text-align:center;color:#555;font-style:italic;padding:10px 14px;background:#fff3cd;border-radius:10px;border:1px solid #ffeaa7;}' +
            '.chat-export .system-message.error{background:#f8d7da;color:#721c24;border-color:#f5c6cb;}' +
            '.chat-export .message{display:flex;align-items:flex-end;gap:12px;}' +
            '.chat-export .message.user-message{flex-direction:row-reverse;}' +
            '.chat-export .avatar-img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid #e0e0e0;}' +
            '.chat-export .message-bubble{padding:12px 16px;border-radius:18px;max-width:78%;box-shadow:0 1px 2px rgba(0,0,0,.06);}' +
            '.chat-export .user-bubble{background:#007bff;color:#fff;}' +
            '.chat-export .bot-bubble{background:#e9ecef;color:#212529;}' +
            '.chat-export .bot-bubble strong{color:#007bff;}' +
            '.chat-export .bot-bubble p{margin:0 0 10px;}.chat-export .bot-bubble p:last-child{margin:0;}' +
            '.chat-export pre{background:#2d2d2d;color:#f8f8f2;padding:12px;border-radius:8px;overflow-x:auto;font-size:.9em;}' +
            '.chat-export code{background:#eee;padding:2px 6px;border-radius:4px;font-size:.9em;}' +
            '.chat-export ul,.chat-export ol{margin:8px 0;padding-left:22px;}';
        return '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sesión de chat</title><style>' + exportStyles + '</style></head><body>' +
            '<h1>Sesión de chat</h1>' +
            '<p class="meta"><strong>Documento:</strong> ' + escapeHtml(PDF_NAME) + '</p>' +
            '<p class="meta"><strong>Tema del chatbot:</strong> ' + escapeHtml(CHATBOT_THEME) + '</p>' +
            '<p class="meta"><strong>Modelo:</strong> ' + escapeHtml(MODEL) + '</p>' +
            '<hr><div class="chat-export">' + clone.innerHTML + '</div></body></html>';
    }

    function downloadSessionHtml() {
        const blob = new Blob([getSessionHTML()], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Sesion_Chat_' + Date.now() + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
