 de   la   tipología   estructural   empleada   en   los   diferentes    espacios   que   conforman   la   unidad:       2.1.1   Plataformas y   Torres   de   Apartamentos.       Para la cimentación y por las características del terreno, se empleó una combinación   entre   pilas   excavadas    manualmente   en   concreto   reforzado   con   resistencia   de   28   Mpa   (280   kg/cm2   –   4000   psi)   para   el   fuste    y   49   Mpa   ( 490   kg/cm2   –   7 000   psi)   para   el   cabezote   y   para las   vigas   de   cimentación   21   Mpa   (210    kg/cm2   –   3 000   psi) .   A   continuación,   se   describe   el   sistema   empleado   para   torre   3 :   En   la   torre  se   emplearon pilas excavadas   manualmente   de    ( 1 m a 1.8m)    de diámetro   variable entre pilas ,  y una   profundidad promedio   de   22   m,   enlazadas   con   vigas   de   fundación   de   40 x 60   cm.    Las   torres   están   diseñadas   y   construidas   en   sistema   de   pórticos   de   concreto   reforzado.   Las losas de entrepiso   son  con vigas descolgadas   y tienen un espesor total de  5 0   cm igualmente   fundidas en concreto reforzado   con resistencia de 2 8   Mpa ( 2 8 0   kg/cm2  –   4 0 00 psi).   Las   columnas   son   en   concreto   reforzado   y   con    resistencias   variables   a   medida   que   asciende   de  35   Mpa ( 350   kg/cm2  –   5 000 psi) 2 1   Mpa   (2 1 0    kg/cm2    –     3 000  psi).     Esto  quiere  decir  que  todas  las      columnas   y     las     losas     con     sus     vigas   son    estructurales;  razón   por   la   cual   no   se   puede         hacer ninguna variación en ellos como lo es  el demoler,   canchar o golpear , ya que   causarían   serios   problemas   no   solo   en   su   apartamento,   sino   posiblemente   en    el   de   sus   vecinos,   o   más   aún,   atentar   contra   la   solidez   y   estabilidad   del   edificio.       Los muros en mampostería según la tipología de los apartamentos son todos los que   conforman   las    fachadas   y   las   divisiones   interiores.       Está diseñado cumpliendo con las normas contenidas en el Código Colombiano de   Construcciones   Sismo -  Resistentes   NSR - 10       Como propietario, usted debe saber que la estructura no requiere en sí ningún   mantenimiento   especial.    Únicamente,   debe   saber   que   el   diseño   de   todos   sus   elementos,   tanto estructurales (los descritos arriba)   como  los  no  estructurales  (mampostería,     tubería,   ascensor,   acabados,     entre   otros),   se   ajustan   a   los    requisitos   legales   vigentes,   y  que     los   procesos   constructivos   se   realizaron   siguiendo   estrictamente   los    diseños   y   las   recomendaciones   de   las   normas   técnicas   colombianas   aplicables   en   la   construcción,   y   de    acuerdo   con   lo   exigido   por   el   Código   Colombiano   de   Construcciones   Sismo   resistentes.       Las  fisuras  que  se  puedan  presentar  en  los  muros  obedecen  a  un  comportamiento     normal   de   toda    estructura   recién   construida   por   efectos   de   expansión   y   retracción   de   los   concretos   y   materiales   empleados    en   ella,   cambios   de   temperatura   y   de   humedad,   así   como   por   los   pequeños   asentamientos   diferenciales   que    se   van   dando   a   medida   que   se   va   cargando   el   edificio   con   la   ocupación   de   los   apartamentos   y   la   puesta    en   funcionamiento   de   todo   su   equipamiento     (motores,   bombas,   ascensores,   tanques   de   almacenamiento    de   agua   y   subestación   de   energía).     Para   su   mantenimiento   se deben resanar las fisuras, instalar cinta -  malla, pulir y pintar con el fin de evitar el   deterioro   y   la   mala   apariencia   del   acabado;   es   por   eso   que   se    recomienda   dar   una   mano   de   vinilo   al   menos   una   vez   al   año.       Los   movimientos   sísmicos,   el dad,   eflorescencias, entre otras.   Una vez   entregada a satisfacción, la  responsabilidad del mantenimiento de la   fachada recae   sobre   la   administración   de   la   urbanización.   El   mantenimiento   debe   realizarse   periódicamente    (mínimo   cada   dos   años   o   antes   si   se   detectan   humedades   o   anomalías   provenientes   de   la   fachada),   y    debe   constar   del   procedimiento   completo   de   reposición   de   chapas   fisuradas   o   deprendidas,   reposición   de    sellos   elásticos   de   la   mamposterías   y   ventanas,   resanar   rebites porosos entre   ladrillos,   lavado e hidrofugado.    Estas     actividades  deben  contratarse  con  una    empresa  especializada,  dado  que  se  requiere   personal    capacitado   para   ejecutar   trabajos   en   altura,   por   otro   lado,   es   necesario   contar   con   la   experiencia   y   la    formación   adecuada   para   el   manejo   de   los   productos   químicos requeridos ; tener presente que de  utilizar   productos químicos inapropiados pueden   ocasionar,   por   ejemplo,   averías   en   el   esmalte   de   las   piezas   que    componen   la   fachada,   lo   que   a   largo   plazo   ocasionará   daños   serios   a   la   mampostería.       Es responsabilidad de la administración realizar  revisiones mensuales del estado   general   de   la   fachada    que   pueda   anticipar   la   necesidad   de   alguna   intervención.             2.2.2   Mampostería   Revocada   y   Estucada.       Son   todos   los   muros   divisorios   al   interior   de   los   apartamentos   y   el   punto   fijo ,   estos   fueron   levantados en   mampostería sucia revocada, estucada y pintada.   Como se mencionó   anteriormente, es normal que se   presenten algunas fisuras durante la vida útil de la   estructura debida a diferentes factores. Es importante   señalar que toda fisura en una   obra   civil   tiene   su   razón   de   ser   y   su   explicación,   y   que   las has    en   los   zócalos   de   madera,   entre   otros.     El   uso   de   cepillos   puede   ocasionar   rayones   en   la   pintura,   por    lo   que   estos   elementos   no   deben   utilizarse   en   la   limpieza   de   puertas   o   paredes.    •   En   caso   de   que   decida   cambiar   los   acabados   de   los   muros   de   su   apartamento,   le   recomendamos    asesorarse   bien,   ya   que   algunos   tipos   de   pinturas   y   la   mayoría   de   los   materiales   para   acabados,    requieren   tratamientos   de   la   superficie   antes   de   su   aplicación.             RECOMENDACIÓN:  Los daños que se produzcan en acabados, en materiales y/o   elementos suministrados   e instalados por el propietario durante la construcción o   posterior a la entrega del apartamento, no será   responsabilidad de la constructora su   reparación.       2.3   ELEMENTOS   ADICIONALES   DE   LA   FACHADA.       2.3.1   Lagrimales   y   sillares.    Los lagrimales de los balcones, sillares de plataforma de parqueaderos y áticos de   remate   de l a torre    fueron   vaciados   en   concreto.   Al   igual   que los   muros,   se   deben   lavar con agua y jabón  suave, evitando   la utilización de cepillos o ácidos que puedan   producir   descascaramiento   de   la   superficie.       Las   fisuras   que   se   presentan   en   los   muros   obedecen   a   un   comportamiento   normal    de   toda   estructura   recién   construida   por   efectos   de   retracción   y   expansión   de   los    concretos   y   materiales   empleados   en   ella,   así   como   por   los   pequeños    asentamientos   diferenciales   que   se   van   presentando   a   medida   que   se   incrementa    la  carga  del  edificio  con  la  ocupación  de  los  apartamentos  y  la  puesta  en    funcionamiento     de     todo     su     equipamiento     (motores,     bombas,     ascensores     y    subestación   de   energía).    Para su mantenimiento, se deben resanar las fisuras, instalar cita - malla, pulir y    pintar  con  el  fin  de  evitar  el  deterioro  y  mala  apariencia  del  acabado.  Le(s)    recomendamos   dar   una   mano   de   vinilo   al   menos   cada   año.   \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO       En   caso   de   aparecer   manchas   que   no   limpien   con   jabón,   se   puede   utilizar   varsol,   pero   debe   enjuagarse    rápido   y   muy   bien.       Al   igual   que   los   muros,   las   fisuras   y   dilataciones   que   se   presentan   en   estos   elementos   obedece   a   efectos    de   retracción   y   expansión   del   concreto   por   estar   expuestos   directamente   a   los   cambios   de   temperatura   y    la   intemperie.       Para   su   mantenimiento   se   deben   resanar   las   fisuras   con   el   fin   de   evitar   el   deterioro   y   la   mala apariencia   de su acabado y aplicar una lija suave para volver a restaurar su   apariencia.       Al   momento   en   que   la   administración   de   la   copropiedad   contrate   labores   de   mantenimiento de la fachada   (lavado e hidrofugado), se debe informar a la empresa   designada para llevar a cabo el mantenimiento,   que debe tener especial cuidado con   estos   elementos,   así   como   también   con   los   marcos   de   las   ventanas   y    los   pasamanos   de   los   balcones,   ya   que   los   productos   que   utilizan   pueden   producir   manchas   en   el acabado   de  estos.          RECUERDE:   El   buen   aspecto   y   la   armonía   del   conjunto   residencial   no   son   solamente   un   concepto   de    estética,   si   no   un   requerimiento   de   Planeación   Municipal   por   lo   tanto   y   de acuerdo al   reglamento de   propiedad horizontal las fachadas de la urbanización no   deben   ser   modificadas .          2.4   PINTURA.       En   el   proyecto   se   aplicaron   dos   tipos   distintos   de   pinturas.   A ado   a   las   peladuras   ocasionadas   por   rayones   y   golpes   en   estos   elementos,   ya    que   de   quedar   expuesto   el   metal,   se   puede   presentar   corrosión,   y   si   se   deja   avanzar,   puede   entrar   al   alma    del   material   y   dañar   el   elemento   considerablemente.       RECUERDE:  El buen aspecto y la armonía de la urbanización no son solamente un   concepto de estética,   sino también un requerimiento de Planeación Municipal, por lo   tanto,   y   de   acuerdo   al   reglamento   de    propiedad   horizontal,   las   fachadas   de   la   urbanización   no   deben   ser   modificadas .       2.5   CUBIERTAS.       2.5.1   Cubierta   para   último   piso.       La   estructura   de   cubierta   para   el   último   piso   es   en   losa   de   concreto   aligerada   y   sobre   la   cual, en su   acabado, se utilizó una capa primera capa de manto asfaltico 3mm y la   segunda   capa   manto   edil   3mm    granillado .       En ningún caso se debe perforar la losa para alguna instalación especial porque se   afectaría   el   manto    impermeabilizante.     En   caso   de   presentarse   algún   daño,   favor   hacer   la   respectiva   reparación   con   personal    idóneo   y   capacitado   en   el   tema.       Se   debe   prohibir   el   libre   acceso   de   personal   no   autorizado   a   la   zona   de   tanques,   terraza   y   equipos   de    presión,   la   circulación   sin   control   puede   ocasionar   goteras   en   este   tipo   de   cubiertas.       En   caso   de   presentarse   goteras   de   la   losa   superior   se   debe   acudir   a   personas   expertas   en   la   aplicación   de    los   mantos.       No   utilizar   la   losa   de   cubierta   para   almacenar   o   concentrar   cargas   altas.   Recuerde   que   la función de una   losa de cubierta es muy diferente al de una losa de entrepiso de   apartamentos,   por   ende,   el   diseño    estructural   de   cargas   varía   considerablement s,   lavaplatos,   lavaderos,   lavadoras,   duchas, desagües de   piso en los  apartamentos y los desagües de piso en la zona   cubierta   del   primer   piso   de   los   bloques,   y    desagües   de   baños,   piscina   y   parqueaderos   cubiertos   de   plataforma.   En   su   construcción   se   utilizó   tubería    PVC   sanitaria   color   marfil   con   tubería   de   ventilación   PVC   liviana   solo   para   la   ventilación   secundaria   y    terciaria   de   las   redes.   La   red   baja   por   buitrones   desde   el   último   nivel   de   la   torre   hasta   llegar   a   cajas   de   empalme en primer nivel en 6 ” , y de allí pasa a tuberías de diámetros Mayores o   iguales   6 ”   que    entregan   el   agua   a   los   colectores   de   Empresas   Públicas   de   Medellín.   La   red   fue   construida   con   los   diámetros,    materiales   y   pendientes   suficientes   para   garantizar   los   caudales   y   las   velocidades   de   arrastre   requeridas   para    este   tipo   de   proyectos   según   el   manual   RAS.       La   red   de   desagües   residuales   está   provista   de   una   red   de   ventilación   en   PVC   liviana   para prevenir la   pérdida de los sellos hidráulicos de los sifones, evitar malos olores y   permitir el flujo rápido de las aguas   sin la  formación de émbolos de aire durante la   descarga   vertical.       Las tuberías han sido diseñadas para conducir por gravedad los elementos sólidos   suspendidos   en   aguas    sin   presión.       Toda   la   tubería   del   apartamento   fue   instalada   en   el   sistema   de   materiales   P.V.C.   y   por   lo   tanto   debe    tenerse   especial   cuidado   con   su   tratamiento.       Los   elementos   biodegradables,   tales   como   los   desechos   humanos,   no   presentan   mayor   dificultad para su   conducción.   En cambio, la mayor fuente de problemas se presenta   con  elementos no biodegradables como   plásticos, preservativos, toallas higiénicas,   pañales   desechables,   arenas   que   no   se   degradan   y   pueden    obstruirlas,   o   elementos   químicos   que   produzcan   demasiada   espuma   y   deterioren   el   material   de   fabricación    de   las   tuberías.       Los   accesorios   PVC   con   sifón   de   registro   se   deben   revisar   cada   tres   meses   para   remover   los   elementos    que   en   él   se   acumulen   y   se   debe   utilizar   cinta   de   teflón   al   colocarlos   nuevamente   con   el   fin   de   evitar    posibles   fugas.   (Esto   se   debe   verificar   con   el   constructor,   pero   si   se   obedeció   a   las   indicaciones   del    diseño   se   especificaron   no   sifones   con   registro   sino   rejillas   de   6 ” ,   ver   que   en   los   planos   dice   copa   6 ”   x   4 ”   \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO       desde   estas   rejillas   debe   hacerse   el   registro   y   limpieza).    Para   el   caso   de   los   apartamentos   no   tiene   razón   dejar   sifones   con   registro   ya   que   estos   quedan   tapados    por   cielo   y   las   desobstrucciones   deben   hacerse   desde   el   mismo   apartamento,   desde   las   mismas   rejillas    usando   pescas,   nosotros   dejamos   el   uso   de   sifones   con   o   sin   registro   a   decisión   del   constructor.       Por   las   rejillas   de   piso   se   pueden   presentar   malos   olores   debido   a   su   poca   utilización   o   a   la   descomposición    del   agua   existente   en   el   mismo   como   sello,   o   la   carencia   de   ésta.   Recomendamos verter agua para   rehacer el sello hidráulico, principalmente en los   meses   calurosos   y   en   los   lugares   donde   se   presente    mucha   evaporación.       En   caso   de   obstrucción,   evite   introducir   alambres   o   similares   dentro   de   la   tubería;   recomendamos   en   estos    casos   llamar   a   un   técnico   para   evitar   daños   en   el   sistema.       2.6.2   De   Aguas   Lluvias.       Son   los   encargados   de   evacuar   las   aguas   provenientes   de   la   lluvia.       Recoge las aguas de los patios, terrazas y cubiertas en los bloques, y cubiertas,   parqueaderos   descubiertos    y   filtros   en   la   plataforma   de   parqueo.   La   red   se   construyó   en   tubería   PVC   Sanitaria,   con   diámetros   a   partir    de   las   4 ” .     La   red   baja   por   buitrones   desde   el último nivel de la torre hasta llegar a cajas de empalme   ubicadas en el primer piso,   pasando   luego   a   tuberías   de   10 ”   que   entregan   el   agua   a   la   red   de   Empresas    Públicas   de   Medellín.   La   red   fue   construida   con   los   diámetros,   materiales   y   pendientes   suficientes   para    garantizar   los   caudales   y   las   velocidades   de   arrastre   requeridas   para   este   tipo   de   proyectos. Con el fin de   garantizar el libre flujo del agua por esta red, se recomienda  la limpieza   permanente   de   las   canoas   y   los    bajantes   de   las   cubierta   y plataformas ,   y   así mismo , los desagües   de   balcones   y   terrazas   con   sus   respectivas    rejillas   o   granadas.          La   red   de   aguas   lluvias   como   su   nombre   lo   indica,   fue   diseñada   para   evacuar   solamente   aguas lluvias, por   lo tanto, no se debe conectar a ella la red de aguas residuales.   Además,   y   por   no   contar   con   sifones,    producir   permanentemente   malos   olores.    Con   el   fin   de   garantizar   el   libre   flujo   por   esta   red,   se   recomienda   la   limpieza   permanente   de   las   canoas   y    los   desagües   de   los   bajantes   de   las   cubiertas   y   terraza ,   así   como   también   del   primer   nivel   de   la   plataforma.       Con   respecto   a   las   aguas   lluvias,   se   deben   tener   las   siguientes   consideraciones:    2.6.2.1   Zonas   Verdes.       Son   muy   importantes   en   el   manejo   de   las   aguas   lluvias   ya   que   absorben   un   porcentaje   alto   de   ellas.   Por    esta   razón,   deben   conservarse   como   tales.       Las   rejillas   y   sumideros   necesitan   de   un   aseo   permanente   para   evitar   que   las   tuberías   se   obstruyan.     Por    esto   es   recomendable   recoger   la   grama   el   mismo   día   del   corte   y   las   hojas   permanentemente.       2.6.2.2   Zonas   Duras.       Las arenas o agregados pétreos son  altamente abrasivos, razón por la cual se puede   reducir la vida útil   de las tuberías; además, puede presentar sedimentación en su   recorrido no permitiendo la libre circulación   de más sólidos.   Por lo tanto, es muy   importante   no   permitir   su   evacuación   por   ellas.      \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO       El   hundimiento   de   pisos,   más   notorio   en   pisos   duros,   es   una   señal   inequívoca   de   rotura   de tuberías; cuando   esto suceda se debe buscar una persona experta para las   reparaciones   necesarias,   y   así   evitar   peores    daños.       En   las   cajas   de   inspección,   tanto   fluviales   como   de   aguas   negras,   cárcamos   y   tuberías,   se  acumulan   periódicamente basuras, arenas, etc. Los propietarios deben programar   las   revisiones   periódicas   de   estos    elementos   para   asegurar   su   limpieza.       2.7   INSTALACIONES   HIDRÁULICAS.       El   edificio   cuenta   con   instalaciones   Hidráulicas   acordes   con   los   requerimientos   exigidos por las Empresas   Públicas de Medellín, entidad que suministra los servicios   de   acueducto   en   l a zona urbana   del Municipio    de  Itagui .       En   el   presente   capítulo,   encontrará   las   características   técnicas   de   las   diferentes   redes   con   las   que   cuenta    el     edificio,     así     como     las     recomendaciones     necesarias     para   garantizar un  buen  funcionamiento  de  las   mismas en su apartamento y en las zonas   comunes   del   edificio. Se   utilizó tubería PVC para la red de   agua fría y de C - PVC para la red de agua   caliente.       2.7.1   Acometidas   Hidráulicas.       La urbanización cuenta con una acometida principal de 2 ”   de diámetro que se   alimenta de la red de   Empresas Públicas de  Medellín, ubicado en la zona de acceso   peatonal de esta unidad (portería), lo   que garantiza el flujo de agua necesario para   alimentar   los   requerimientos   de   los   apartamentos   y   de   las    zonas   comunes.   Adicionalmente,   cada   apartamento   cuenta   con   una   acometida   individual   de   1/2 ”   con   su    propio   contador   de   agua.       Las   tuberías   llegan   a   los   apartamentos   a   través   de   buitrones   que   pasan   por   los   puntos   fijos   de   todos   los    pisos.   En   los   puntos   fijos,   en   el   cuarto   de   aseo   contiguo   al   ascensor,   se   encuentran   también   los   gabinetes    en   donde   se   pueden   inspeccionar   los   contadores   de   acueducto.          2.7.2   Sistema   Hidroneumático   y Bombas.       La acometida principal de la urbanización abastece dos (2) tanques de fibra de vidrio de 89m ³   de capacidad,     ubicados en nivel 1, que abastecerán de agua las tres torres.     En el mismo cuarto, se encuentran las bombas de impulsión que surten de agua a cuatro   (2) tanques de     fibra de vidrio en cada una de las torres, la capacidad de cada tanque es de 12m ³ .       Sistema de impulsión :  Equipo de presión BOOSTER - PRESS para una presión de 159 Psi  –   111 mca,   con un caudal de 111 GPM  –   7 L/S, compuesto por tres (3)  electrobombas al 100%. Tablero de   control y mando con tres arrancadores térmicos para 25HP a 220 voltios, alternado y simultaneo. Tablero   certificado. Este sistema se encuentra en el nivel 1 y funciona para las tres torres.         El sistema es manejado desde un tablero de control automático que   garantiza que las bombas trabajen de   Recuerde que los contadores no deben ser manipulados por personal diferente    al   de   Empresas   Públicas de Medellín.   \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO       manera alternada, lo cual facilita trabajar en el   equipo en el momento de requerirse un mantenimiento   preventivo o un trabajo de   reparación.     Las   válvulas   se   entregan   a   la   copropiedad   en   su   posición   normal   de    trabajo,   y   NUNCA 2   deben   manipularse,   a   menos   que   sea   por   personal   calificado.       Todo el sistema se encuentra protegido por cheques para evitar daños que pueda   ocasionar   el   agua   en    caso   de   cortes   de   energía.       Equipo de  presión:   2 Electrobombas sumergibles tipo lapicero de 1.5 HP trifásica a 220V,     operando al 100% de flujo cada una. Tanque hidro acumulador de 24 litros. Este sistema se encuentra     localizado en la cubierta de cada torre y funciona para   cada torre independiente .       El   sistema   de   bombeo   fue   suministrado   e   instalado   por   la   firma   Caputti & Veira .       2.7.2.1   Instrucciones   de   funcionamiento,   manejo   y   control   del   equipo   Hidrofló     y      bombas   de   impulsión.       •   En las bombas de impulsión se debe tener en cuenta que tanto las  válvulas de   succión   como   las    de   la   descarga   estén   abiertas.    •   Verificar   que   los   tanques   inferiores   si   tengan   agua   de   lo   contrario   el   flotador   debe   estar   en   posición    apagado.    •   Si  las  bombas  no  están  funcionando  posiblemente  los  tanques  superiores  están   llenos,   de   lo    contrario   se   debe   revisar   que   las   llaves   de   la   tubería   de   gravedad   no   estén   cerradas.    •   El equipo de presión, para saber que esté funcionando debe estar marcando 40   libras   en   adelante,    si   marca   cero   significa   que   los   breakers   están   apagados   ó   los   tanques   donde   succiona   no   tienen    agua.    •   Revisar   los   flotadores   eléctricos   que   si   estén   funcionando.    •   Revisar   conexiones   eléctricas   superiores.                                                      2   Manipular   las   llaves   del   sistema   hidráulico   de   bombeo   pueden   causar   problemas   en   las   bombas   e   incluso      fundir   los   motores   de las   mismas   \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO          2.7.2.2   Mantenimientos   periódicos.       •   Revisar   mensualmente   la   precarga   de   aire   en   el   tanque   hidrofló.    •   Revisar   mensualmente   el   estado   de     las   conexiones   eléctricas   tanto   en   el   tablero   como   en   los    motores,   corregir   según   sea   el   caso.    •   Verificar   mensualmente   las   presiones   de   encendido   y   apagado   del   sistema.    •   Verificar   semanalmente   el   amperaje   y   voltaje   de   operación   de   los   motores.    •   Verificar mensualmente el estado mecánico de las bombas y  motores, muy   especialmente   en   los    flotadores   mecánicos   que   lleva   cada   tanque   en   su   zona   de   llenado, estos por ser mecánicos con   el tiempo tienden a corroerse por estar en   contacto con el agua, de dañarse los tanques se   llenarían sin  control y se   rebosarían   causando   pérdidas   y   posibles   daños   a   las   bombas   por   su    cercanía.    •   Efectuar   las   demás   revisiones   recomendadas   por   los   fabricantes   de   las   bombas,   motores,   controles    según   los   manuales   respectivos.   (Mantenimiento   preventivo   a   los   equipos   cada   3   meses).       2.7.2.3   Procedimientos   cuando   el   sistema   no   opera.       •   Verificar   que   el   breaker   este   prendido.    •   Verificar   que   el   selector   principal   este   en   automático.    •   Verificar que   el   segundo   selector   este en   posición   central   entre   la   bomba   N º   1   y   bomba   N º   2    para   que   se   presente   la   automatización   debida.    •   Verificar   que   no   exista   falla   en   los   rieles   térmicos   de   las   motobombas.    •   Verificar   el   nivel   de   agua   de   succión.    •   Verificar   que   la   presión   del   acueducto   no   esté   por   encima   de   70   psi.    •   Verificar   que   las   válvulas   de   paso   libre   en   las   descargas   estén   abiertas.    •   Verificar   la   operación   del   flotador   eléctrico.    •   Verificar   el   funcionamiento   del   flotador   mecánico.          2.7.3   Instalaciones   Hidráulicas   Internas.       El   agua   se   distribuye   a   través   de   un   trazado   de   tubería   de   PVC   RDE   21   de   1/2 ”   Y   3/4 ”   de diámetro   para el agua fría. El agua que sale del calentador es distribuida por el   apartamento   a   través   de   tubería    de   CPVC   de   1/2 ”   y   3/4 ” .   La   tubería   va   por   el   cielo   y   baja   por las paredes a sus respectivas salidas   hidráulicas. Por lo  antes expuesto, se debe   tener especial cuidado si usted decide cambiar el cielo raso   del apartamento o de los   baños.          Recuerde   que   las   rutinas   de   mantenimiento   son   la   clave   para   la   buena   operación    y     estabilidad     del  sistema,    cualquier  omisión  a  estas     recomendaciones  son    causal  de  no  responsabilidad  por  parte  de  la  constructora  en  caso  de  daño  o    avería   del sistema.   \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO            La llave ubicada después del contador de su apartamento debe permanecer cerrada   cuando el apartamento   vaya a pasar un largo tiempo desocupado, con el fin de evitar   inundaciones   en   caso   de   fallos   en   la    grifería   y   en   los   diferentes   aparatos   que   requieran   abasto   permanente   de   agua.       Si usted va a  instalar aparatos que requieran instalaciones hidráulicas especiales o   acometidas hidráulicas,   como  neveras,  dispensadores  de  agua,  aire  acondicionado,     entre  otros,  debe  hacerlo  con  personal   capacitado y especializado que garantice su   trabajo.   Las   fugas   y   humedades   que   se   produzcan   debido   a    la   instalación   de   este   tipo   de aparatos, y los daños que ocurran como consecuencia de las mismas, no   serán   responsabilidad   de   la   constructora   bajo   ninguna   circunstancia.       Antes   de   colocar   chazos   y   tornillos   en   paredes   y/o   losas,   se   debe   verificar   los   planos   de   las   redes   con   el    fin   de   no   perforarlas.       En   el   caso   de   ausencias   prolongadas,   o   que   el   apartamento   permanezca   desocupado,   deberá   cerrar   el    control   general   del   agua   y   gas,   lo   que   se   consigue   cerrando   la   llave   de   paso   que   hay   en   el   respectivo    contador.       2.7.4   Trabajos   de   Mantenimiento.       2.7.4.1   Fugas.       Deben   ser   corregidas   rápidamente   para   evitar   el   desperdicio   de   agua   y   daños   mayores   por   humedad.       Es   importante   anotar   que   los   cielos   de   los   baños   son   hechos   en   drywall   (yeso - cartón),   por   lo   tanto,   no    pueden   ser   sometidos   a   humedad,   esta   puede   generar   hongo   o   moho   que   se   propaga   en   el   material   con    facilidad,   por   lo   cual   es   recomendable   remplazar   la   porción de cielo que entra en contacto con la  humedad   y pintar el ambiente completo   para   evitar parches.          RECUERDE:     Las     garantías     por     fuga     de     abastos     son     de     tres     (3)  fuegos quedan dominados por la acción de   solamente unos pocos rociadores que se encuentran en las   cercanías inmediatas del   foco   del incendio.    7 -     La actuación de los rociadores no se ve impedida por el humo o el calor, como   puede   sucederles   a   los bomberos.    8 -   Los   rociadores   automáticos   pueden   aplicar   agua   rápida   y   eficazmente   sobre   el   foco   del   incendio.    Un  Sistema  de    Rociadores  Automáticos  de  Tubería Mojada  como  el  del proyecto     PACIFICA ,   es   un    sistema   fijo   de   Protección   contra   Incendios   que   utiliza   tuberías   llenas   de   agua   a   presión,   alimentadas   desde   \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO       un   abastecimiento   fiable.   En   condiciones   normales   de  operación las tuberías de agua están llenas de agua.   Cuando se produce un   incendio, el calor generado provoca la actuación de los rociadores de la zona   del   incendio   lo que   permite que fluya el   agua.    •   En cada piso hay un centro de control compuesto por una válvula mariposa   monitoreada,   un    cheque,   un   sensor   de   flujo,   un   manómetro   sobre   la   tubería   que   va a la alimentación del sistema   en cada piso y marca la presión de salida en   este   y   una   válvula   de   drenaje   o   prueba   del    sistema.   Recordemos   el   sistema   es   automático   no hay que   mover nada.       Planta   Centro   de   Control             •   En  cada  escalera de  evacuación  hay  una  toma  de bomberos,  para que estos     directamente   puedan controlar el incendio conectando sus mangueras y de   necesitarse inyectando agua desde   el  camión hacia estas tomas en caso de   acabarse   el volumen   destinado por el   proyecto para    tal   fin:              \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO       Planta os.     Cada    gabinete   está   sellado   por   la   empresa   prestadora   del   servicio   y   es   quien  se   encarga   de   su   manipulación.     El    cuarto   técnico   debe   mantenerse   cerrado   y       asegurado   con   llave.       Los   contadores   y   las   cajas   de   los   mismos   tienen   unos   sellos   de   Empresas   Públicas   de   Medellín.   Por   ningún    motivo   se   deben   retirar   o   romper   estos   sellos.   Si   considera   que   su   contador tiene algún problema, debe   recurrir a Empresas Públicas de Medellín para   hacer   la   reclamación.             2.8.1.5   Acometidas   particulares.    La acometida particular de cada apartamento es el conjunto de cables que lleva la   energía desde los   contadores hasta el inmueble y ésta se  entrega junto con el   apartamento. Debido a que dicha acometida   pasa por los buitrones ubicados en los   puntos fijos de las Torres, no está permitido que los propietarios   realicen trabajos   adicionales, ni modificaciones, sin informar antes a la administración y Empresas   Públicas   de Medellín. Cualquier daño o reparación de la misma corren por cuenta del   propietario.       Los   materiales   utilizados   en   las   acometidas   cumplen   con   las   normas   técnicas   y   con   los   requerimientos de   Empresas Públicas de Medellín. La construcción de la misma se   realizó cumpliendo con los diseños   establecidos  para  la  misma,  garantizando  que  los   cables     tengan     los     calibres     necesarios     según     los    requerimientos   de   los   apartamentos.       No es normal que la acometida de su apartamento requiera reparaciones. Si tiene   problemas   con   la    estabilidad   o   con   el   flujo   eléctrico   de   su   apartamento,   revise   su   caja   de   breakers   y   los   aparatos   eléctricos    que   están   funcionando   en   su   apartamento.       La  acometida  principal  es  una  red  de  alto  voltaje,  y  su    intervención  puede    generar lesiones graves e incluso la muerte, por lo que las reparaciones de la    misma     deben     ejecutarse     únicamente     por     personal     técnico     especializado     y    autorizado  por  la  administración  para  tal  fin.  Nunca  permita  que  se  realicen    trabajos en la acometida principal sin autorización. Esta acometida es de uso y    propiedad de EPM. Quienes son los únicos autorizados para su intervención o    mantenimiento.    RECUERDE:  Los  contadores  no  deben  ser  manipulados  por  personal  ajeno  a    Empresas   Públicas   de   Medellín.   La   alteración   de   los   elementos   de   medida   puede    llegar   a constituir un   delito.   \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO                2.8.1.6   Instalaciones   eléctricas   internas   (Apartamentos).       Las   redes   eléctricas   de   los   apartamentos   fueron   construidas   siguiendo   los   requerimientos   del   diseñador,    utilizando   alambre   marca   Centelsa   y/o   procables   THW   en   calibres   8,   10,   y   12.   El   alambrado   de   los    apartamentos   se   canalizó   a   través   de   tubería   eléctrica  Conduit y SH40   de 1/2 ” , 3/4 ”   y 1 ” . El trazado   de la tubería varía de apartamento en   apartamento   según   su   tipología,   pero   al   respecto,   se   puede     indicar   que la tubería y los alambres de los tomacorrientes se  instaló   por piso, los   interruptores,   iluminación,    televisión,   teléfono   y   la   acomedida   principal   se   instaló   por   las   paredes   de   los   apartamentos   y   por   el   cielo    falso.       Las   instalaciones   de   los   apartamentos   se   encuentran   divididas   en   circuitos,   los   cuales   se   manejan   del    tablero   de     breakers     ubicado     en     la     zona     de     ropas   de     los     apartamentos.   Los     circuitos     se     encuentran    protegidos   por   breakers   enchufables   de   2x20 A   amperios   (1   unidad - estufa ) y 1x20 amperios (5 unidades    el resto del apartamento ) de pendiendo del piso; el tablero maneja   voltajes   entre   los   120   y   los   208    voltios.       Existen   una   serie   de   recomendaciones   a   tener   en   cuenta   para   mantener   su   instalación   eléctrica   y   evitar    daños   en   sus   valiosos   electrodomésticos.   Le   recomendamos   seguir   las   siguientes   instrucciones   para   evitar    inconvenientes   al   respecto:       •   En   caso   de   dañarse   un   breaker,   inmediatamente   reemplácelo   por   otro   de   la   misma   capacidad. Nunca   habilite un circuito sin la protección de un breaker (lo que se   conoce como puente), ya que   estos elementos reducen la posibilidad de corto   circuitos   y   daños   en   los   electrodomésticos.    •   Nunca remplace un breaker por otro de menor calidad, amperaje ó capacidad   mayor   o   menor.    •   Nunca   use   agua   u   otros   líquidos   para   limpiar   el   tablero   de   breakers.   Cuando   limpie   la   parrilla   o   el    horno,   le   recomendamos   apagar   el   breaker   de   2x20   amperios   que   es el que le da servicio a este   circuito,  y  por  favor  asegúrese  de  que  estén     completamente  secos  antes  de  energizarlos   nuevamente.   Si están mojados o   húmedos   al   momento   de   energizarlos,   se   pueden   presentar   corto    circuitos   o   mal   funcionamiento.    •   En   caso   de   reformas   o   reparaciones,   le   recomendamos   acudir   a   personal   calificado,   y   consultar   los    diseños   y   los   planos   aprobados.    •   Revise muy bien los requerimientos de voltaje y amperaje de los  aparatos que   conecta a las   instalaciones eléctricas de su apartamento para no sobrepasar la   capacidad   del   toma   corriente   o    de   los   interruptores.    •   Si usted vive con menores de edad, le recomendamos el uso de tapones o   protecciones   especiales    para   los   toma   corrientes.    •   Si   falla   la   energía   en   alguno   de   los   circuitos   de   la   instalación   de   su   apartamento,   revise   la   caja   de    breakers,   ya   que   alguno   puede   estar   apagado.   Si   el   problema   se   vuelve   repetitivo,   es   probable   que    algún   electrodoméstico   esté   causando   un   corto,   o que haya algún problema con el alambrado de la   red. En caso de ser así, le   recomendamos   que   consulte   a   un   especialista   en   instalaciones   eléctricas.    RECOMENDACIÓN: No realice nunca trabajos en las instalaciones eléctricas ni    permita que personas sin la capacitación adecuada los ejecuten, no sólo por el    riesgo que esto implica para la persona que ejecuta los trabajos, sino también    porque   esto   puede   dañar seriamente sus   electrodomésticos.   \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO       •   Si   la   energía   falla   en   todo   el   apartamento,   verifique   si   la   empresa   proveedora   del   servicio (EPM)   reporta daños en el sistema de suministro. En caso de no   reportarse   daños   o   suspensiones   de    energía,   verifique   que   los   breakers   de   su   caja   estén en posición de encendido. Si aún persiste el   problema, verifique que los   breakers   de   2x 4 0   amperios   que   corresponden   a   su   apartamento   no    estén   apagados. Los breakers 2x 4 0 principales de cada apartamento se encuentran   ubicados   en    el   gabinete   de   contadores   al   cual   corresponda   su   apartamento,   para   realizar   esta   actividad   deberán    estar   acompañados   por   personal   de   la   administración,   pues   son   ellos   los   que   manejas   las   llaves   de    estos   gabinetes.    •   Los circuitos se encuentran distribuidos de forma equilibrada, de acuerdo a un   diseño   eléctrico.   El    uso   adecuado   de   los   mismos   le   garantiza   que   sus   instalaciones   eléctricas   y   sus   electrodomésticos    funcionarán   correctamente.       En   cada   tablero   de   breakers,   se   identifican   todos   los   circuitos   para   así   saber   cuál   se   debe   desactivar    en   caso   de   una   reparación.       IMPORTANTE:   Adicionalmente,   en   cocina   y   baños,   existen   unas   tomas   aislados   con falla a tierra  “ gfci ” ,   cuya función primordial es la de evitar una posible   electrocución   por   presencia   de   agua.     Este   funciona   a    manera   de   breaker,   el   cual   se   acciona   ante   la   presencia   de   esta   o   de   un   cortocircuito.     Se   debe   investigar    la   posible causa que generó el corto, eliminarla y proceder nuevamente a activar   éste,   accionando   su    mecanismo   a   manera   de   s w ich.          Recomendación:   Si llegare a ocurrir que ante un cortocircuito se presenta ausencia   total   de   energía,   se    maniobran   los   breakers   del   tablero   ubicado   en   la   cocina   y   si   no   se   obtiene ninguna respuesta positiva,   posiblemente se ha disparado el breaker 2x 4 0   ubicado en la parte superior de su medidor particular de   energía ubicado en el piso   en los pisos pares   de cada torre.   Si el problema persiste, llamar a una   persona calificada  para que   determine y solucione   el   problema.       2.8.2   Alumbrado   Público.       2.8.2.1   Fuera   de   la   urbanización.       Esta   red   tiene   a   su   cargo   las   zonas   verdes,   andenes   y   vías   exteriores   del   conjunto   y   es   regulada   y    manejada   por   Empresas   Públicas   de   Medellín.       2.8.2.2   Dentro   de   la   urbanización.       Su función es la de iluminar las zonas verdes y senderos hacia el interior de la   urbanización.     Su    operación   y   mantenimiento   está   a   cargo   de   la   copropiedad.          Recuerde:   El   uso   inadecuado   de   las   instalaciones   eléctricas,   las   modificaciones    no     autorizadas,     la     conexión     de     aparatos     con     capacidades     mayores     a     las    permisibles, exoneran de responsabilidad por daños al constructor. Asesórese    bien  antes  de  intervenir  de  cualquier  forma  las  instalaciones    eléctricas  de  su    apartamento,   o   de las   zonas   comunes   de   la   urbanización.   \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO       2.8.2.3   Telecomunicaciones   (Telefonía,   Televisión   e   Internet).       El   sistema   de   telecomunicaciones,   tanto   en   acometidas   principales   como   en   las   de   los   propios   apartamentos    fue   instalado   por   CLARO ,   con   excepción   de   las   tuberías   y   las   cajas   telefónicas.   El   alambrado   se   conduce    desde   la   red   externa   a   un   gabinete   ubicado en piso 4  en   donde,   como   se   mencionó   en   un   aparte   anterior   de    este   mismo   manual,   se   cuenta   con   toda   la   tecnología   de   punta   necesaria   para   prestar   el   mejor   servicio    ajustándose   a   las   necesidades   de   cada   usuario.     De   allí   ingresa   la   acometida   al   cuarto   técnico   ubicado en   el  P 1   de la plataforma, mediante una canastilla tipo cablofit o tipo malla  y llega   al   gabinete   destinados    para   tal   fin.       Desde   el   cuarto   técnico   las   acometidas   son   conducidas   a   cajas   ubicadas   por   cada   piso   y   en   las   que   se    encuentran   adicionalmente   regletas   de   compartimiento   que   derivan   el   servicio   a   cada   apartamento,   y   cuya    función   principal   es   minimizar   las   interferencias   y   ubicar más fácilmente cualquier  problema técnico en un   apartamento determinado o   incluso   en   el   mismo   sistema.       De allí se ingresa a los apartamentos hasta llegar a una caja    PAU  general de distribución   50 x 30    localizada en la zona de ropas ,   en   donde   se   ubicaría   el   modem   en   el   que   se   encuentran   concentrado    todo   el   sistema   de   telecomunicaciones   para   el   apartamento.       Los   daños   que   se   presenten   en   el   sistema   de   telecomunicaciones   de   su   apartamento   o   de   la   copropiedad,    deben   reportarse   a   CLARO .       El   mantenimiento   de   los   cables   que   van   desde   la   red   de   CLARO   hasta   la   caja   de   distribución,   corresponde   a    ellos.   Cualquier   anomalía   comunicarla   a   la   sección   de   daños   de   esa   entidad.       La acometida va desde la caja de distribución hasta la toma ubicado en la sala de su   apartamento   sin    ningún   tipo   de   empalme   y   de   allí   se   hace   la   distribución   hacia   el   interior.   Igualmente,   cualquier   anomalía   se    puede   comunicar   a   la   sección   daños   y   allí   determinarán   su   origen   y   el   responsable   de   su   reparación.       2.8.2.4   Citofonía.       Todo el sistema fue  instalado por   Claro , es un sistema de telefonía virtual. La central tiene comunicación     con todos los apartamentos y el ascensor. El cuarto de   telecomunicaciones está ubicado en el piso 4 de    la torre 1       Los   ascensores   cuentan   con   intercomunicador   entre   las   cabinas,   la   portería   y   el   cuarto   de   máquinas .       Para   su   conocimiento,   el   sistema   completo   de   citofonía   en   zonas   comunes   cuenta   con   dos años de garantía   contra defectos de fabricación. Esta garantía se encuentra   respaldada   por   ESTILO .       2.8.2.5   Salidas   especiales       La   constructora   no   es   responsable   en   ningún   momento   de   los   problemas   que    se   presenten   en   su   servicio   de   televisión   por   cable   o   satelital,   ni   se   hará   cargo    de     reparaciones     o  daños     que     ocasione  el     personal  de  las  empresas  de    televisión  por o.   \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO       ▪   Evite   el   uso   de   blanqueadores,   detergentes,   ceras   a   base   de   petróleo   o   cualquier   otra   sustancia    ácida, estos atacan el   brillo.    ▪   Use   jabón   con   PH   neutro.    ▪   Evite   golpes   fuertes,   ya   que   pueden   fisurar   o   quebrar   el   material.    ▪   Evite  derrames excesivos de grasa por largo tiempo, recoja el   exceso   con   una   toalla   de papel.    ▪   Evite derrames de sustancias ácidas y grasas (vinos, cítricos y   aceites), que originan manchas   notorias. Recuerde que una vez que un elemento   de   estos   se manche   no puede   ser   recuperado a   su estado   anterior.    ▪   No utilice esponjillas metálicas ni lijas para remover las manchas, ya que estos   utensilios   pueden   generar   ralladuras sobre la   superficie.    ▪   No   utilice   limpiadores   ni   químicos   con   bases   ácidas   o   que   contengan   soda   cáustica.    ▪   Evite colocar vasijas calientes sobre el mesón constantemente para esto existen     en   el   mercado    superficies   refractarias   que   protegen   el   mesón   del   calor   directo.    ▪   Utilice la tabla auxiliar cuando sea necesario manipular objetos corto punzantes   como   cuchillos.       Los mesones de cocina y baños fueron suministrados por  Piedras y Aglomerados , si presenta   cualquier    inquietud,   puede   comunicarse   con   esta   empresa   al   teléfono   que   aparece   en   el   listado   de   proveedores.       En   baños   y   cocinas   usted   encontrará   quar z tone   blanco  el   cual   presenta   juntas   o   uniones   con   elementos    de   otros   materiales   (lavaplatos   en   acero   y   lavamanos   de   cerámica).   A   pesar   de   que   las   juntas   entre   estos    elementos   se   sellan   con   siliconas   y   masillas,   la   dilatación normal   de estas juntas no garantiza el sello   hermético al paso del agua. Por esta   razón, no se deben poner elementos húmedos a escurrir directamente   sobre los   mesones. Se debe revisar y  realizar inspección de estas juntas y su respectivo   mantenimiento    por lo   menos 1   vez cada   semestre.       2.13     CARPINTERIA   METÁLICA.       2.13.1     Cerraduras.       El  proveedor  de  las  cerraduras  de  los  apartamentos  es  Ideace.  Las  cerraduras     instaladas   en   los    apartamentos   son   de   cuatro   tipos   diferentes,   las   cuales   se   relacionan   a   continuación:       -   Portón principal:  Cerradura  Ideace  metálica maciza   tubular  Ref.   210 principal : Cilindro exterior y   paso libre interior .   Las   chapas   de   todos los portones   principales   son   iguales para   mantener    uniformidad   en   los   puntos   fijos.       -   Cerraduras   de   alcobas:   La   especificación   típica   de   estos   elementos   es   manija   Cerradura   Ideace   metálica   maciza   tubular   Ref.   211 alcoba: Cilindro Exterior, botón seguro interior.   Las   chapas   de    alcoba   incluyen   seguro   y   un   juego   de   dos   llaves.       -   Cerraduras de baños , vestier y zona de ropas :  La especificación típica de estos elementos es   Manija   Cer r adura     Ideace  metálica     maciza     tubular   Ref.   216 baño: falso cilindro exterior y botón   seguro interior.  Las   chapas   de   baño   incluyen   seguro,   pero   no   cuentan   con   llave,   ya   que   estas    abren   con   cualquier   llave.       NOTA:   Si   usted   va   a   cambiar   las   chapas   para   su   apartamento,   le   aconsejamos   seguir   las   recomendaciones    del   fabricante   para   el   cuidado   y   mantenimiento   de   las   mismas.      \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO       2.13.1.1     Mantenimiento.       Tanto   para   las   cerraduras   como   para   las   bisagras,   se   recomienda   lubricarlas   periódicamente   para   reducir    el     desgaste     que     sufren     los     componentes     metálicos     de     estos   elementos.     Se     deben     usar     productos    recomendados   para   tales   fines,   lo   cual   facilita   el   accionamiento   de   las   cerraduras   y   las   bisagras,   y   reduce    los   sonidos   molestos.       2.13.2       VENTANERÍA.       Es suministrada por ALCO S.A. La perfilería es en  a luminio   anodizado color natural   y vidrio   claro   nacional    para   la   ventanearía   y   para   las   puertas   vidrieras   y   algunas   referencias   de ventana   que   por   norma vigente    así   lo requieren.    Igualmente, la perfilería es  aluminio   anodizado color natural  y vidrio claro para la  ventanearía   y para las   puertas vidrieras, con espesores  de   4mm y   5 mm   respectivamente . Los   calibres de la perfilería y de los   vidrios cumplen con los requerimientos exigidos por   las   normas NSR - 10   para estos   elementos.       Las ventanas y puertas vidrieras deben deslizar suavemente, sin atrancarse en   ningún   punto   del   recorrido.    Se   recomienda   lubricar   periódicamente   los   rieles   con   pequeñas   cantidades   de   parafina   o   vaselina   para    garantizar   el   fácil   deslizamiento   de   las   naves   móviles.   No   utilice   grasa   para   lubricar   las   ventanas.     Si   sus    ventanas   se atascan en el recorrido, revise que no haya elementos atascados en el riel, o   que el riel no   se  haya  torcido por golpes o    demás. RECUERDE: Nunca  se pare   sobre   los   rieles   ya   que   pueden    torcerse.       Las   ventanas   corredizas   deben   desplazarse   con   suavidad   para   evitar   que   al   golpearse   se   descarrilen.   Es    importante   prestar   cuidado   con   la   posición   del   seguro   de   las   ventanas   al  abrir o cerrar las mismas para   evitar ralladuras.       En   las   ventanas   que   son   de   naves   cortas,   su   desplazamiento   se   debe   hacer   desde   la   parte   central   de   la    nave   para   que   no   “ cabecee ” .          En   caso   de   que   se   presente   humedad   en   el   sillar   de   la   ventana,   es   debido   a   que   la   parte   sellante   está    deteriorada   y   se   debe   aplicar   nuevamente   masilla   elástica   en   las   paredes   laterales   de   las   ventanas   en   la    unión   con   el   sillar.       Lubrique   periódicamente   los   rieles   de   desplazamiento   de   las   naves   móviles   con   vaselina   en   poca   cantidad,   NO    UTILICE   GRASA .       Si   va   a   resanar   ó   pintar   debe   proteger   el   aluminio   con   vaselina   ó   cinta   de   enmascarar.       No   recueste   objetos   pesados   sobre   las   ventanas,   éstos   ponen   en   peligro   los   vidrios,   y   los   empaques   se    pueden   desencajar       Recomendaciones:     ▪   Cierre   las   ventanas   con   cuidado,   no   las   tire.    ▪   Para la limpieza de los perfiles en aluminio, no utilice esponjillas metálicas   abrasivas.   Use   un   \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO       trapo   húmedo   limpio   o   una   toalla   de   papel   con   agua   limpia.    ▪   Para  el  proceso  de  la    limpieza  de  las  alas  corredizas  de  las  ventanas,  estas     pueden   ser    desprendidas   presionando   hacia   arriba   y   halando   al   interior.    ▪   Las   ventanas   deben   mantenerse   limpias   en   su   parte   inferior   y   superior,   para   no   entorpecer   el   libre    desplazamiento   del   ala   corrediza   y   del   agua   hacia   los   drenajes   de   la   ventana.    ▪   Las   ventanas   interiormente   son   selladas   en   sus   esquinas   y   tienen   drenajes   en   el   perfil   interior,   para    evitar   el   paso   de   agua   hacia   la   parte   interna.   Estos   drenajes   deben   permanecer   libres   de   cuerpos    extraños.    ▪   Los   vidrios   pueden   presentar   distorsión   en   la   imagen   horizontal   o   vertical;   esto   es   normal   por   ser    vidrio   estirado   que   es   el   único   que   se   produce   en   el   país.       En     caso     de     necesitar     una     reparación     o     cambio     de     un     vidrio     debe     remitirse   inmediatamente   a   ALCO    S.A.,   o   a   un   instalador   especializado.       2.13.3     Cabinas   de   Baño       Suministro     e     Instalación     de     C oarte ,     cabinas     tipo     batiente     perfilería     en     Aluminio   natural   y   Vidrio   Cristal    templado     6mm   según   se   requiera   cumplimiento   norma   vigente       2.13.3.1   Recomendaciones       Para el correcto funcionamiento de las cabinas instaladas, se deben realizar los   siguientes   procedimientos    que   garantizan   su     estabilidad.       Evitar   fuerzas   y   golpes   que   generen   desprendimiento,   rompimiento,   desborde,   rayado,   quemado     u     otros    deterioros   físicos   ocasionados   a   los   vidrios   templados,   especialmente   en   las   esquinas   de   los   vidrios   de   la    cabina   donde   un   golpe   súbito   puede   generar   ruptura.       No   apoyarse   en   las   cabinas   ya   que   no   están   diseñadas   para   soportar   peso   directo,   su   limpieza   debe ser   con   cuidado y suavidad.       Evitar   la   aplicación   de   líquidos   que   generen   deterioro   físico   a   los   elementos   cromados,   de   aluminio o   acero   inoxidable.       Evitar   el   mal   uso   generado   por   desmontes   provisionales,   forzamiento   u   otras   situaciones   que   impidan   el   correcto   funcionamiento   de los   elementos.       Se   debe   realizar mantenimiento   rutinario   sobre   los   perfiles   de   aluminio   y acero   inoxidable, para evitar   que el polvo u otros elementos se acumulen en las superficies   exteriores   y   al  interior   de ellos.       Se   deben   reponer   rodamientos   y   sellamientos   de   las   cabinas   cada   2   años.           \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO       2.13.3.2   Mantenimiento.       Para   el   vidrio   se   debe   realizar   limpieza   con   elementos   no   abrasivos   evitando   derrame   de   líquidos   detergentes   sobre   la   perfilería y   demás   accesorios.       La   limpieza   debe   ser   realizada   con   agua   tratada,   evitando   el   uso   de   aguas   con   un   PH   que   puedan   generar   corrosión   en   el   vidrio   y   los   elementos   metálicos.       Es de vital importancia, dado la frecuencia con que se presenta este  inconveniente,   que el personal de   aseo no use   thinner ni elementos corto punzantes que toque las   siliconas   pues las remueven y se    genera salida del agua.       Se   debe   tener   presente   que   el   contacto   de   la   perfilería   de   aluminio   o   acero   inoxidable   con   productos   a    base   de   cemento   generan   quemados   permanentes   sobre   ella.       En   las   cabinas   batientes   que   se   instalan   con   bisagras   y/o   chapetas   de   fijación   a   muro   o   piso   se   debe    tener   presente   que   por   las   dilataciones   mínimas   entre   el   vidrio   y   el   muro   o   en   la   junta   de   cerrado    entre   los   vidrios,   se   puede   presentar   alguna   salida   de   agua.       Antes   del   proceso   de   limpieza   verifique   que   no   existan   partículas   contundentes   que   con   la   fricción   puedan    originar   deterioro   del vidrio.       La   limpieza   se   puede   hacer   con   un   paño   húmedo,   nunca   en   seco,   usando   detergentes   neutros   solubles en   agua (NO ABRASIVOS).       No utilizar alcohol, acido fluorhídrico y/o ácido clorhídrico ya que ocasiona daños en   la   superficie   del    vidrio.   No   utilice   limpiadores   químicos   severos,   abrasivos,   soluciones   de   limpieza   con   base   ácida   o   alcalina.       Evite   el   contacto   directo   de   metales   y   otros   materiales   más   duros   que   el   vidrio,   evitará   rayones   o   la   rotura    de   algún   cristal.   Se   responderá   por   la   garantía   durante   un   año   por   defectos   de  fabricación.       No se debe realizar desmonte de cabinas por personal distinto al autorizado por el   proveedor. Se debe   tener especial cuidado sobre los bordes del vidrio templado ya   instalado   para evitar desbordados.       En caso de no seguirse estos aspectos, no se tendría reposición y reparación de los   elementos   instalados.          2.14     CARPINTERIA   DE   MADERA.       La   carpintería   en   Madera   de   los   apartamentos   fue   suministrada   e   instalada   por   varios   contratistas,   así:       -   Los   marcos,   alas   de   acceso   y   de   paso   fueron   instalados por   Productos de madera     Santa   Lucia   Muebles y Pisos S.A.S .    Los   closets   y  vestier   fueron   suministrados   e   instalados   por   Santa Lucia Muebles y     Pisos S.A.S .    -   Los   muebles   de   baño   fueron   suministrados   e   instalados   por   Productos de madera     SOCODA .    -     Los     zócalos     en     madera   en     los     apartamentos     fueron     suministrados     e instalados   por  Productos de   madera  Santa Lucia Muebles y Pisos S.A.S .   \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO       -     La     Cocina     de     los     apartamentos     fueron     suministradas     e     instaladas     por     S O C OD A         El    material  base  de  los  muebles  es  muy  sensible  al  agua,  por  lo  que  debe  evitarse  el     contacto    permanente   con   la   misma.   Las   películas   y   acabados   de   los   muebles,   a   pesar   de   ser   resistentes   al   desgaste,    deben   limpiarse   con ergentes   u   otros   productos   químicos    y   sales   al   interior   de   los   muebles   ya   que   podría   causar   emanaciones contaminantes que alteren la   estabilidad de la madera y produzca la   oxidación   de   los elementos.       2.14.8     Precauciones:       Por ser elementos de madera, el contacto con la humedad superficial debe ser   mínimo,   lo cual   implica   que   no   deben   ser expuestos   a   la   acción   directa   del agua.    Evitar al máximo los golpes fuertes en los elementos, pues constituyen su mayor   causa   de   deterioro.    Las alas de paso y closet soportan perfectamente el peso de las mismas y funcionan   adecuadamente en   condiciones normales de uso. Sin embargo, al verse sometidas a   otros esfuerzos (el peso de los niños,   por ejemplo), pueden  desprenderse de las   bisagras   y causar el deterioro   de las   mismas.    Para los interiores de closet, se debe tomar en consideración que fueron diseñados   para soportar el   peso normal de los elementos de vestuario. No se recomienda   guardar en ellos  elementos de peso   significativamente superior como herramientas o   libros   (en   cantidades   excesivas). Igualmente,   elementos   \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO       afilados   o   con   punta   pueden   deteriorar y resquebrajar la superficie del aglomerado. Recomendación que   se hace   extensiva   al   maletero.    Los colgaderos soportan adecuadamente el peso de la ropa colgada. No intente   someterlos a pesos   superiores pues tenderán a flectarse e incluso desprender los   soportes.    Programe   regularmente   la   lubricación   de   las   bisagras.          2.14.9     Recomendaciones   del   fabricante       2.14.9.1   Cuidados para las cocinas   termolaminadas, postformadas y/o fórmica y madecor       ▪   Nunca   utilizar   abrasivos   ni   detergentes   fuertes   o   productos   derivados   del   petróleo.    ▪   No ele o se ondule.   En el caso que se requiera recortar un perfil de la   estructura es necesario reforzarlo   previamente   para garantizar   que el   cielo no se   descuelgue.       La   carga   máxima   que   soporta   el   cielo   es   de   5 kg/M2,   por   esta  razón no   soporta el peso   de   un   hombre    ya   sea   que   se   apoye   en   la   parte   superior   o   se   cuelgue   del   mismo.   No   se   puede   instalar   ningún   elemento    sobre   él,   cómo   lámparas,   tv,   etc.   sin   la   instalación   del   previo refuerzo.       En  el  caso  de  presentarse  una  humedad  en  el    cielo,  el  área  mojada  deberá  ser     remplazada   inmediatamente, para evitar los hongos los cuales se pueden propagar   por   la placa y   es necesario para    que   el cielo no   se   ondule.       Si por algún motivo le cae agua al cielo, usted debe abrir unos pequeños orificios y   tocar   el   cielo   falso,    hasta   que   se   seque   naturalmente   y   llamar   al   técnico   especializado   para   su   correcta   reparación.   \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO         2.19     MANUAL DE LIMPIEZA Y MANTENIMIENTO DE PRODUCTO S FABRICADOS EN ACERO INOXIDABLE      Las  siguientes  son  las  recomendaciones  para  que  los    productos  que  ha  adquirido     mantengan  sus   propiedades físicas y preserven la resistencia a la corrosión, la   apariencia   física   e   higiene.   Los   principales    atributos   del   acero   inoxidable   son:   facilidad,   baja  rugosidad,  apariencia  higiénica,  fuerte    impacto  visual   (moderno y liviano) y bajo   costo   de   mantenimiento.       El acero requiere limpieza periódica como cualquier otro material cuando está en   servicio.   Los   componentes    de   los   aceros   inoxidables   en   construcciones   arquitectónicas están  expuestos a polución urbana, humo de   vehículos, polvo, agua   lluvia,   las   marcas   de   los   dedos,   el   humo   del   tabaco,   residuos   de   alimentos   entre    otros;   todos   ellos   afectan la   apariencia   original   y   atractiva   del acero   inoxidable.   De acuerdo a   la severidad   y al tipo de contaminación a la que esté expuesto el  acero inoxidable , el   mantenimiento se   puede   realizar   de   diferentes   maneras.       2.19.1     Limpieza   rutinaria       Para retirar la suciedad normal del acero y para restaurar o mantener su brillo, es   suficiente   un   lavado   de   agua   con   jabón. Periódicamente   ejecute   Las   siguientes   actividades:       Limpiar el acero con paño no abrasivo humedecido y jabón detergente líquido o en   crema,   que   no   tenga    blanqueador   a   base   de   cloro,   estregar   en   el   sentido   del   pulido   de   la lámina (Iijado normalmente vertical),   de manera consistente y pareja. NUNCA   estregar   en   sentido circular.   El paño   recomendado es   z abra o    trapo de   algodón.       Pasar luego un trapo húmedo limpio hasta retirar completamente el jabón. NUNCA   USE   MANGUERA   O    TRAPOS   DEMASIADO   HUMEDOS   PARA   RETIRAR   EL   JABON.       Pasar después un trapo limpio totalmente seco para retirar la humedad de la lámina,   esto   evita la    presencia   de   manchas   de   agua.       Verificar   que   sean   retirados   el   jabón   y   el   agua   para   evitar   que   se   presenten   manchas.       Nota     1:     Le     recomendamos     no     usar     esponjillas,     espátulas     o     herramientas     metálicas,   ya   que     pueden   generar   picaduras o ralladuras   en la   lámina .       Limpieza de manchas leves, aceites, grasas, o adhesivos:  Cuando la limpieza de   rutina   no   es   suficiente,    se   recomienda   realizar   alguno   de   los   siguientes   mantenimientos:       Ejecute los 5 pasos descritos en el numeral anterior, pero utilizando agua    caliente y   utilizando   para   estregar, un   cepillo de fibras   de   nylon.       Utilice disolvente orgánico (thiner), aplíquelo con un trapo o con cepillo de cerdas de   nylon, en el   mismo sentido del acabado del acero, luego, con un trapo humedecido,   retire completamente los residuos   de thiner, y con un trapo seco y limpio, seque   completamente   hasta retirar el   agua   de la lámina.       Ralladuras leves : en caso de que la lámina presente ralladuras leves, frote con un   paño ( z abra), en   el sentido del pulido, con presión  fuerte y constante, y realice   posteriormente las   labores   de   limpieza    rutinaria antes   descritas.   \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO          Nota :  en  caso  de  que  las  rallas  permanezcan,  póngase  en  contacto  con el  servicio  al   cliente   para    ofrecerle   más información   o   brindarle asesoría   técnica.    Manchas   o   ralladuras   intensas   y   oxidación:   En   caso   de   que   se   presenten   manchas   intensas; oxidación o   ralladuras muy visibles o profundas, comuníquese con servicio   al cliente, para recomendarle tratamientos   adicionales o enviar personal técnico que   le   asesore.       2.19.2     Sustancias   que   NO se   deben utilizar   porque   atacan   el   acero:       Evite el uso de los siguientes productos: hipoclorito de sodio, ácido clorhídrico, ácido   muriático, ácido   sulfúrico,  yodo,  amoníaco,  blanqueador,  solución  para  revelado de     rayos     X,     esponjillas     que     rallan     o    sueltan   partículas   metálicas   oxidables.   Estos   productos atacan en poco tiempo el acero inoxidable dando   origen a fenómenos de   corrosión irreversibles.       2.19.3     Importante.       El  acero  inoxidable ofrece  una  excelente  resistencia  ante  la  corrosión  atmosférica  en   zonas     urbano -  industriales   y   suburbanas   contaminadas.   El   aspecto   estético   permanece inalterable; a esto ayuda los   oportunos y periódicos tratamientos de   limpieza y   descontaminación   de   la superficie   del   acero durante   su    uso.             2.20     PRODUCTOS     EN     EL     MERCADO     QUE     SE     PUEDEN     UTILIZAR     PARA     LA        LIMPIEZA   DE   LOS   INMUEBLES.       Jabón   de   Coco   liquido   -   Supermercados    Moppy  -   Colombiana de Abarrotes Tel: 285 27 51 Medellín   Shampoo    K - Floor   -   Eliptica   Tel:   2668936   Medellín   Jabones   con PH Neutro       2.21     PRODUCTOS   QUE  NO   SE   DEBEN   UTILIZAR       Fabuloso,   Ajax,   Sampic,   Límpidos,   jabones   abrasivos,   o   con   un     PH   Alcalino   o   acido       3   GARANTÍAS Y SERVICIOS POSTVENTA       3.1   SE     DA     GARANTÍA     Y     ATENCIÓN     DE     POSVENTA     EN     LOS     SIGUIENTES        CASOS:          Calidad   deficiente   de   materiales   utilizados.       Trabajos   defectuosos   o   mala   instalación.       Daños   por   deficiencia   en   la   mano   de   obra.       Fisuras   de   conformidad   con   lo   establecido   en   el   numeral   3.3.       Daños   estructurales   en   los   inmuebles.   \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO          3.2   NO   SE   DA   GARANTÍA   Y   ATENCIÓN   DE   POSVENTA   EN   LOS   SIGUIENTES   CASOS:         Fisuras estructurales: voladizos, sillares o lagrimales de concreto, juntas   entre   mampostería   y   pantallas   o   losas   de   concreto,   dinteles   de   puertas   y   ventanas,   juntas   entre   marcos   y   muros.        Agrietamiento   y   daños   producidos   por   sismos,   según   ley   400   de   1997.      Daños   producidos   por   inundaciones,   aunque   éstos   hayan   sido   por   instalaciones   defectuosas,   sí   no   se   cortó   el   suministro   a   tiempo.      Daños producidos por rayos ó   incendios. El inmueble debe poseer una   póliza de servicio  que cubre estos eventos y debe ser tomada por los   propietarios.      Daños riódicos de acuerdo a   las   indicaciones dada en este manual. Se   reitera   que   son   normales   dentro   de   todo   el   tiempo   de   uso   del    inmueble.       Este procedimiento de atención de garantía de fisuras no implica el repinte de los   apartamentos   en   su    totalidad,   solo   se   repintan   los   muros   que   sean   intervenidos,   es   decir,   aquellos   muros   que   presentan   fisuración.       Los filetes de los muros no son objeto de garantía tal y como está expresado en este   manual   y     por   lo    tanto   su   reparación   es   responsabilidad   de   los   propietarios.       El   repinte   de   los   muros   se   hace   con   pintura   de   color   blanco   tal   y   como   fueron   entregados   los   inmuebles   con    la   especificación   del   proyecto.   No   se   entonan   colores   diferentes.      \nPacifica Torre 3   Carrera 61 No 33 - 65 Itagui - Ant            MANUAL     DE     MANTENIMIENTO     Y   FUNCIONAMIENTO       Los   muros   que   tengan   papel   de   colgadura,   cenefas,   dibujos,   molduras   de   yeso,   u   otros   acabados   que   no    hayan   sido   los   especificados   entregados   por   la   constructora,   no   serán   tenidos   en   cuenta   para   cambios   o    reposiciones.   El   repinte   se   hace   bajo   la   responsabilidad   expresa   y   por   escrito   del   propietario.   El   propietario    es   responsable   por   su cambio o reposición y toda actividad especial que se derive de esto corre por su    cuenta   y   riesgo.       Para la realización de los trabajos   de repinte, la constructora no reconoce dineros, ni   asume costos por   traslado de objetos,  enseres, o personas, ni arrendamientos y/o   hospedaje   en   otro   lugar   diferente   a   la    vivienda,   con   motivo   de   las   actividades   a   realizar   al   interior   del   inmueble.    Tampoco   se   reconocerán   dineros,   producto   de   actividades   o   trabajos   realizados   por   los   propietarios.
