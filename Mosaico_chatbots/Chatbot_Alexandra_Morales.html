eticiones, siempre considere lo siguiente:    1. Asegúrese de que todos tengan la oporunidad de contribuir. 2. En vez de confiar en   su memoria, prepárese para escribir lo que es dicho.     3. Asegúrese de orar por la   petición de cada niño. Es importante que ellos sepan que son importantes   para ti y   que s us oraciones son importantes. 4. Asegúrese de que nececidades especiales de su   iglesia o miembros de su iglesia sean mencionados       VERSÍCULO DE MEMORIA (6 minutos)    El versículo de hoy va a poner a prueba la capacidad de los niños de encontrar   escrituras en la Biblia. El objeto es ser el primero en encontrar un versículo específico.  \nEl maestro escogerá libros, capítulos y versículos al azar, tal como 1 Reyes 3:6, y tan   pronto que sea dicho, los niños deben encontrar la primera palabra en el versículo 6.   En este caso, el primer niño en decir “Salomón” es el ganador. Para darles la   opor tunidad a todos, haga que los ganadores ya no participen en los siguientes   versículos. Repita el juego hasta que ya no sea tan emocionante. Para un truco, diga   \"Eliseo 1:1.\"      LECTURA BÍBLICA Y DISCUSIÓN (15 minutos)    Introducción:    La semana pasada aprendimos que la Biblia es nuestra fuente para guianza espiritual.   Hoy vamos a aprender que la Biblia también es nuestra fuente de nuestra vida nueva   en Jesucristo. La Biblia nos dice que todos hemos nacido con pecado, pero también nos   di ce que por Jesucristo y lo que hizo por nosotros en la cruz, podemos tener una vida   nueva libre de pecados. 2 Corintios 5:17 dice: “Por lo tanto, si alguien está en Cristo, es   una nueva creación. ¡Lo viejo ha pasado, ha llegado ya lo nuevo!”    Lea Juan 3:1 - 8 (Jesus le enseña a Nicodemo)    Preguntas para discutir:    1. ¿Cuándo vino Nicodemo a Jesús?   (De noche.)    2. ¿Quién dijo Jesús que vería el reino de Dios?   (El que es nacido de nuevo.)    3. ¿Qué pregunta le hizo Nicodemo a Jesús?   (¿Cómo puede nacer uno de nuevo siendo ya   viejo?)    4. Según versículo 5, ¿cómo puede uno nacer de nuevo?   (Debe nacer del agua y del   espíritu.)    5. ¿Cuál es la diferencia entre ser nacido del agua y del espíritu y ser nacido del   cuerpo?    6. ¿A qué es comparado el Espíritu Santo en el versículo 8 y por qué?   (Al viento, porque   no se puede ver.)    EJERCICIOS PARA LA CLASE (15 minutos)    Artistas que cambian rápido (Juego)      ARTISTAS QUE CAMBIAN RÁPIDO    Un juego de moda, velocidad y de renovación espiritual.   \nTEMAS:    Nueva vida en Cristo, Nacidos de nuevo,   Espíritu Santo    MATERIALES:    2 camisas grandes y viejas    2 gorras    2 pares de guantes grandes    DURACIÓN:    Aproximadamente 15 minutos              LO QUE VA A HACER USTED:    Haga dos equipos con un número par. Si hay un número impar, uno puede ser el   árbitro. Si no, el maestro puede ser el árbitro. Ponga a los niños en una línea en un   lado del cuarto y ponga la ropa para cada equipo en el otro lado del cuarto. Esto será   una ca rrera para ver qué equipo puede ponerse toda la ropa primero y después   quitársela para que la siguiente persona del equipo pueda ponérsela. El equipo con el   último niño que se ponga la ropa primero es el ganador. El árbitro también es   importante porque ell os decidirán si los niños se ponen la ropa como deben. Hasta   que el árbitro diga \"ya,\" la siguiente persona no puede empezar.    LO QUE VA A DECIR USTED:    Todos hicieron un buen trabajo en ser artistas que cambian rápido. Pero lo que usas   afuera no es tan importante como lo que usas adentro. Jesús es nuestro artista que   cambia rápido. Él nos puede cambiar por dentro en poco tiempo. La Biblia nos señala   el ca mino a la salvación en Jesucristo. Cuando lo recibimos en nuestros corazones,   inmediatamente somos cambiados a nuestro nuevo ser. Hemos nacido de nuevo para   caminar una vida nueva, cambiada y llena del Espíritu Santo.       EJERCICIOS ALTERNATIVOS DE LA CLASE (10 minutos)    Lástima al ojo (Historia)      LÁSTIMA AL OJO    ¿Que vez cuando vez a otros?   \nTEMAS:    Cristiandad, Testigos      DURACIÓN:    Approximadamente 10 minutos       E l terreno estaba lleno de yerbas, piedras y vidrios   rotos. Algunas personas habian tirado su basura en   el terreno viejo y abandonado. Para hacerlo peor,   una casa que se estaba pudriendo estaba en medio   de el terreno. Las ventanas de la casa habían sido   rot as hace muchos años.      El rumor era que la casa estaba llena de ratas y ratones. La gente exageradamente   evitaban pasar por ese lugar, no había esperanza para aquella casa. La unica forma de   arreglar este lugar sería destrucción.          Una hermosa mañana en otoño, una mujer conocida como la Jardinera caminó por el   terreno. Las hierbas estaban al nivel de su cintura, las moscas volaban encima de la   basura y la casa se veía igual de fea como siempre. La mujer se paró y despues caminó   alred edor del terreno. Algunas personas del pueblo  se le quedaron viendo mientras   tomaba varias páginas de notas.    Y por el pueblo todos sabían lo que había pasado. La Jardinera había tenido suficiente,   iba a demandar que la ciudad limpiara el terreno. ¿Como podria ser que alguien   estubiera enojada con ella? El terreno era una desgracia para todo el pueblo. No   importab a que sería costosa la limpieza; la ciudad tiene que encontrar el dinero.   Simplemente no era bueno tener un terreno como ese en su pueblo.Alguien tenía que   hacer algo.    Varios días despues la Jardinera habló con el gobernador. El recepcionista se preparó   pa ra una lucha; \"verás, el gobierno simplemente no tiene el dinero que se necesita   para arreglar el terreno. La Jardinera caminó hacia el escritorio y sacó sus notas y le   dijo algo al recepcionista que el nunca olvidaría. Ella pregunto, \"¿Cuanto cuesta el   te rreno y la casa abondonada en la calle Tocino #371? Me gustaría compralo.\"    El recepcionista pensó en eso, el rumor del pueblo no pudo estarmás lejos de la   verdad. La Jardinera no quería destruir el terreno, sino que quería comprarlo. Vio los   pocos papeles que había de la casa y por fin pudo decir, \"Han habído muchos   impuestos que   no fueron pagados, asi que solo la casa te costaría mucho, sin incluir los   costos de arreglar el terreno.\"    La Jardinera contestó, \"No te preocupes por eso, el terreno esta a la venta o no?\"    El recepcionista se rascó su cabeza y dijo, \"Si, Señora, el terreno está a la venta.\" La   Jardinera compró el terreno.   \nLa Jardinera y su esposo trabajaron todo el verano, quitando las yerbas y la basura, y   arreglando la casa. Sembraron varios tipos de hermosas plantas y agregaron   caminitos de piedra. En la parte de atrás de la casa, pusieron una fuente. Cortaron los   árbole s y las otras plantas. El terreno que antes era una lástima al ojo ahora era un   lugar expectacular. Amor, tiempo y un poco de trabajo transformaron el terreno.   Ahora la gente iba al terreno mucho.    Lo que la Jardinera hizo despues sorprendió a todos del pueblo, puso un letrero en   frente de la casa que decía \"El Centro de Jardín, abierto al público, clases jardineras   gratis\". Ella quería enseñarle a otros como transformar lugares que eran una lástima   al ojo a un lugar hermoso. La Jardinera supo que este terreno podría ser transformada   porque cuando ella era jóven, alguien le enseñó a ella a arreglar su terreno.       Algunos son como la casa podrida en medio de el terreno llena de basura, se ven sin   valor y   muchos le exageran cuando evitan a ese tipo de personas. Talves sea el chavo   que molesta a todos en la escuela, o el vecino que estudia demaciado. La Biblia dice   que todos tenemos basura en nuestras vidas. La basura en nuestras vidas se llama   pecado. Las  Buenas Noticias son que ninguno de nosotros es considerado basura en   los ojos de Dios; de hecho el no quiere que ninguno se pierda. (2 Pedro 3:9) Dios se   quiere desaserce del pecado en nuestras vidas, pero no podemos hacerlo solos.   Necesitamos pedirele per dón a Jesús y también necesitamos un corazón nuevo. Y   somos \"nacidos de nuevo\" para seguir a Dios. Igual que la Jardinera en la historia de   hoy, debemos querer compartir las Buenas Nuevas con otros para que sus vidas   puedan ser transformadas por Dios. Recu erda, una vez que Dios haya transformó el   terreno de tu vida, necesitaras decirle a otros del cambio que Dios ha hecho en tu vida.   Cuando ves a otros, ¿Ves una lástima al ojo o un jardín?         APLICACIONES (4 minutos)    Ahora cuando escuches que alguien dice “Cristiano nacido de nuevo”, ya sabrás lo que   significa. Por supuesto, siendo nacido de nuevo es más que sólo cambiarse la ropa. De   hecho, cuando eres nacido de nuevo tu apariencia física no cambia para nada. Lo que   c ambia es lo que está dentro de ti, tu corazón. Cuando eres nacido de nuevo, ya no   perteneces al mundo, perteneces a Jesús. Y esta vida no es temporal como nuestros   cuerpos, es eterno. ¿Y qué es la fuente de esta vida nueva? ¡Claro, Jesús! Sabemos esto   porq ue está en la Palabra de Dios y la Palabra de Dios es la fuente de nuestra vida   nueva.    SIGUIENTE SEMANA    Ahora cuando escuches que alguien dice “Cristiano nacido de nuevo”, ya sabrás lo que   significa. Por supuesto, siendo nacido de nuevo es más que sólo cambiarse la ropa. De   hecho, cuando eres nacido de nuevo tu apariencia física no cambia para nada. Lo que   c ambia es lo que está dentro de ti, tu corazón. Cuando eres nacido de nuevo, ya no   perteneces al mundo, perteneces a Jesús. Y esta vida no es temporal como nuestros  \ncuerpos, es eterno. ¿Y qué es la fuente de esta vida nueva? ¡Claro, Jesús! Sabemos esto   porque está en la Palabra de Dios y la Palabra de Dios es la fuente de nuestra vida   nueva.    ORACIÓN PARA TERMINAR (2 minutos)    ¿Más información?      ORACIÓN PARA TERMINAR    Igual que la oración para abrir la clase, la oración para terminarlo es igual de   importante. No solo señala que la clase ha terminado, pero te da la oportunidad de   volver a decir cosas de la lección y volver a compartir lo que fue enseñado. Los niños   sabrá n que la lección tiene aplicaciones a la vida diaria cuando es parte de esta   oración. La oración para terminar necesita ser breve. Recuerde, los niños   probablemente están ansiosos de llegar a la siguiente fase de su día, y probablemente   no podrán quedarse  quietos para escuchar una oración larga.    La oración para terminar siempre debe incluir lo siguiente:    1. Alabanzas a Dios por la oportunidad de escuchar Su Palabra y aprender de ella.      2. Aplicación a la lección. Por ejemplo si la lección es de \"Tentaciones\", su oración   puede incluir pidiéndole al Espiritu Santo que le ayude a todos en la semana cuando   sean tentados.      3. Seguridad y salud para los niños.      4. Que otros puedan ver a Jesús en nuestras vidas.      PÁGINA PARA LLEVAR A LA CASA    Al final de la clase dele a cada niño una copia de la página para llevar a casa.        \n";

    function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }
    function rgbToHex(r, g, b) {
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
        return '#' + toHex(r) + toHex(g) + toHex(b);
    }
    function mixColors(colorA, colorB, amount) {
        const a = hexToRgb(colorA);
        const b = hexToRgb(colorB);
        return rgbToHex(a.r + (b.r - a.r) * amount, a.g + (b.g - a.g) * amount, a.b + (b.b - a.b) * amount);
    }
    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);
    }
    function getReadableTextColor(bgColor) { return getLuminance(bgColor) > 0.56 ? '#111827' : '#f8fafc'; }
    function generatePalette() {
        const hue = Math.floor(Math.random() * 360);
        const bg = hslToHex(hue, 45 + Math.floor(Math.random() * 20), 16 + Math.floor(Math.random() * 70));
        const text = getReadableTextColor(bg);
        const isDark = getLuminance(bg) < 0.5;
        const accent = hslToHex((hue + 35 + Math.floor(Math.random() * 60)) % 360, 80, isDark ? 55 : 45);
        const card = isDark ? mixColors(bg, '#ffffff', 0.08) : mixColors(bg, '#000000', 0.05);
        const border = isDark ? mixColors(card, '#ffffff', 0.18) : mixColors(card, '#000000', 0.12);
        const input = isDark ? mixColors(card, '#ffffff', 0.07) : mixColors(card, '#000000', 0.04);
        const inputBorder = isDark ? mixColors(border, '#ffffff', 0.12) : mixColors(border, '#000000', 0.1);
        const botBg = isDark ? mixColors(bg, '#ffffff', 0.12) : mixColors(bg, '#000000', 0.06);
        return {
            bgColor: bg,
            textColor: text,
            cardBgColor: card,
            cardBorderColor: border,
            inputBgColor: input,
            inputBorderColor: inputBorder,
            chatBubbleBotBg: botBg,
            chatBubbleBotText: text,
            chatBubbleUserBg: accent,
            chatBubbleUserText: getReadableTextColor(accent),

            secondaryColor: isDark ? mixColors(accent, '#ffffff', 0.2) : mixColors(accent, '#000000', 0.2),
            headerBorderColor: border,

    function buildThemePalette(theme, palette) {

    function addMsg(message, sender, isThinking = false) {
        const el = document.createElement('div');
        el.classList.add(sender === 'user' ? 'user-message' : sender.includes('system') ? 'system-message' : 'bot-message');
        if (sender.includes('error')) el.classList.add('error');
        if (sender === 'bot' && !isThinking) {
            const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');

            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else if (sender === 'bot') {

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }

        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

            '<p class="meta"><strong>Tema del chatbot:</strong> ' + escapeHtml(CHATBOT_THEME) + '</p>' +
            '<p class="meta"><strong>Modelo:</strong> ' + escapeHtml(MODEL) + '</p>' +
            '<hr><div class="chat-export">' + clone.innerHTML + '</div></body></html>';
    }

    function downloadSessionHtml() {
        const blob = new Blob([getSessionHTML()], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Sesion_Chat_' + Date.now() + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
</body>
</html>
