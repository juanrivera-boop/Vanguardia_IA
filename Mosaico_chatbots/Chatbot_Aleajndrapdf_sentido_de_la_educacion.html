lexión que conlleva aporta insumos importantes para generar procesos crítico-re-  flexivos que contribuyen a ampliar el saber pedagógico y a favorecer las capacidades   teóricas y técnicas requeridas para conducir a niñas y niños por trayectorias de desa-  rrollo más cualificadas. Algunos referentes para esta reflexión son:   •\t   Las relaciones que pueden construirse entre niñas y niños para propiciar formas   de encuentro, de reconocimiento mutuo, de convivencia y de respeto. \n68  ·    Serie de orientaciones pedagógicas para la educación inicial  •\t   Los  conocimientos,  sentimientos  y  expresiones  que  las  niñas  y  los  niños  pueden    elaborar sobre su entorno y sobre sus situaciones cotidianas.  •\t   El  ejercicio  o  realización  de  los  derechos  de  la  primera  infancia  en  sus  entornos    cotidianos con miras a procurar su desarrollo integral.  •\t   Cómo  propiciar  la  construcción  de  la  identidad  cultural,  social  y  personal  de  las    niñas y los niños con ayuda del entorno en que se encuentran, de las tradiciones en   que participan y de la resignificación de su realidad actual.  •\t   Cómo participan las niñas y los niños y de qué manera su participación potencia   su propio desarrollo.  •\t   Qué  actividades  generar,  qué  acciones  proponer,  qué  ambientes  propiciar  y  cuáles    interacciones pueden contribuir a crear nuevos desarrollos para la primera infancia.  Las maestras, los maestros y los agentes educativos promueven de manera inten- cional el desarrollo integral de las niñas y los niños. En las modalidades de educación   inicial  se  cuenta  con  un  equipo  de  talento  humano  idóneo  que  desde  su  rol  cumple    funciones importantes para aportar a la atención integral. Por su parte, la coordinado-  ra orienta las acciones educativas, y con el apoyo del auxiliar administrativo, vela por   la organización y funcionamiento del servicio de educación inicial. Los profesionales   de psicología, trabajo social, nutricionistas y enfermería participan y aseguran accio-  nes de cuidado, bienestar y potenciamiento del desarrollo, así como fortalecen y lide-  ran el trabajo con las familias. El personal de servicios, desde sus funciones, garantiza   condiciones óptimas para una adecuada alimentación, limpieza y mantenimiento de   los ambientes. Es en la concurrencia de las actuaciones de cada una de estas personas   y de otros actores que la educación inicial se desarrolla en condiciones de calidad.    \nSentido de la educación inicial   ·  69  A manera de síntesis  Los participantes en la educación inicial son las niñas, los niños, las familias, las   maestras,  los  maestros,  los  agentes  educativos  y,  en  general,  el  equipo  de  talen-  to humano de las modalidades, a quienes corresponden roles determinados en la   puesta  en  práctica  de  este  proceso.  La  familia,  como  socializadora  primaria,  les    proporciona los fundamentos de la cultura, les ayuda a satisfacer sus necesidades   básicas y les permite construir vínculos afectivos muy importantes, contribuyen-  do de esta manera a cimentar su desarrollo.  Los maestros, las maestras y los agentes educativos, en consonancia con la tarea  que lleva a cabo la familia y de acuerdo con sus particularidades socioculturales,   dispone  su  saber  pedagógico  para  el  ejercicio  de  una  práctica  responsable  y    comprometida que acoja a las niñas y los niños en primera infancia, reconozca   y potencie sus capacidades y contribuya a trazarles un desarrollo integral desde   la perspectiva de los derechos. Para poner en marcha este encargo se requieren   procesos  de  cualificación  permanente  para  todos  los  miembros  del  equipo  de    talento  humano  de  las  modalidades,  de  manera  particular,  para  las  maestras,    los maestros y los agentes educativos, para que reflexionen sobre su práctica y la   renueven, resignfiquen y fortalezcan.   ¿Qué procesos otorgan sentido a la educación inicial?  El desarrollo es el organizador de los procesos educativos de la primera infancia, en el   que cobra mucha importancia la calidad de las interacciones que establecen las maes-  tras, los maestros y los agentes educativos con las niñas y los niños, así como la calidad   de los ambientes enriquecidos en donde estas interacciones tienen lugar, requiriendo   de prácticas pedagógicas intencionadas. Ambos procesos merecen especial atención   en este apartado.   Interacciones significativas y relevantes   La  base  de  la  educación  inicial  son  las  interacciones  que  ocurren  en  forma  natural    entre la niña y el niño consigo mismos, con los demás y con sus entornos. El medio am-  biente natural, físico, social y cultural, los compañeros o amigos y los adultos ocupan   un espacio importante en la vida de las niñas y los niños y contribuyen a su proceso de   formación,  les  permiten  aprender  del  mundo  y  sus  visiones,  y  les  ayudan  a  desarro-  llarse. Para las niñas y los niños de primera infancia es fundamental ser escuchados y teni- dos en cuenta en relación con sus ritmos de desarrollo, intereses, emociones y formas de   ser. La relación significativa de la niña y el niño con las maestras, los maestros y agentes  \n70  ·    Serie de orientaciones pedagógicas para la educación inicial  educativos  les  posibilitará  sentirse  reconocidos,  queridos,    acogidos  y  valorados.  Esta  relación  es  la  que  contribuye  a    que  accedan  a  los  significados  de  la  cultura  y  y  la  manera    como se inscriben en la realidad social, por lo que, a partir   de esto,  se proponen acciones y experiencias pedagógicas   que intencionalmente buscan promover  su desarrollo. Estas interacciones suceden a propósito de las activi- dades rectoras de la primera infancia: juego, arte, literatu-  ra  y  exploración  del  medio.  Desde  estas  actividades,  que    conforman lo que les es propio y, por tanto, los caracteri-  za, se requiere de un conjunto importante de experiencias    que promuevan  la creatividad, el aprendizaje y el desarro-  llo de las niñas y los niños. Para la maestra, el  maestro y    el agente educativo esto implica planear y decidir su que-  hacer con el fin de acompañar a niñas y niños —a manera   de  andamiaje—  a  relacionar  su  mundo  personal  y  con  el    contexto social y cultural, en relación con las actividades   rectoras de la primera infancia.   Las  interacciones  que  viven  niñas  y  niños  de  primera   infancia  en  su  vida  cotidiana  ejercen  un  peso  importan-  te  en  sus  procesos  de  desarrollo,  no  como  actos  aislados,    sino  como  un  conjunto  de  configuraciones  que  depende    de las formas o estilos en que se disponen y realizan (Pa-  niagua, 2012). En este sentido, las interacciones significa-  tivas y relevantes son el punto de partida para definir las   intencionalidades  pedagógicas,  pues  a  través  de  ellas  se    logrará el potenciamiento de los procesos de desarrollo de  niñas  y  niños,  al  tiempo  que  se  favorecerá  la  construcción  de  relaciones  equitativas,    democráticas y transformadoras de la realidad social.   El  reconocimiento  de  la  historia  personal,  social  y  cultural  de  las  niñas  y  los  ni- ños  es  fundamental  para  una  acción  pedagógica  incluyente  en  cualquier  ambiente,    teniendo  en  cuenta  el  carácter  dinámico  de  la  misma  y  el  carácter  fundacional  que    tiene en la construcción de identidades en la primera infancia. La identificación de la   historia permite conocer el lugar que ha tenido la niña o el niño en la familia a partir   de los recuerdos-hitos que marcan su desarrollo y de las interacciones que los adultos   han entablado con ellas y ellos.  Ambientes enriquecidos y propicios para el desarrollo infantil   En  la  educación  inicial,  los  ambientes  se  comprenden  como  los  ámbitos  espaciales,    temporales y relacionales en los cuales cada niña o niño desarrolla sus propias expe-  riencias  de  vida.  De  igual  manera,  los  ambientes  hacen  referencia  a  los  sujetos  que    intervienen,  a  las  relaciones  que  allí  se  tejen  y  a  la  manera  como  se  apropian  y  usan   \nSentido de la educación inicial   ·  71  los  espacios  y  materiales  disponibles  para  provocar  experiencias  pedagógicas  signi-  ficativas.  Los  ambientes  en  que  se  plantea  y  ocurre  la  educación  inicial  son  creados  inten- cionalmente por las maestras, los maestros y los agentes educativos, y se caracterizan   por la libertad de expresión de las emociones, de los sentimientos, de las preguntas e   inquietudes y por las interacciones naturales, en tanto son condiciones que enrique-  cen y potencian el desarrollo infantil.  Así mismo, la calidez del ambiente educativo, el afecto, la confianza y la seguridad  son fundamentales para la promoción del desarrollo infantil. En este sentido, las ex- periencias de los educadores y sus conocimientos son fundamentales para reconocer   todos aquellos momentos, situaciones y actuaciones que han contribuido a promover   avances en el desarrollo de las niñas y los niños. El  ambiente  educativo  que  se  propone  y  las  interacciones  que  se  establecen  en  él   contribuyen al despliegue de las capacidades de las niñas y los niños, de tal manera que   la maestra, el maestro y el agente educativo procuren que ello les sirva como punto de   partida para forjar nuevos desarrollos y enriquecer la práctica educativa y pedagógica. Estos dos términos de la ecuación, es decir, las interacciones y los ambientes, in- dican que la labor pedagógica del agente educativo de la primera infancia toma forma   allí donde se reconocen los saberes y formas de acción de los niños y las niñas, es decir,   donde se les permite afianzar sus modos de relación y conocimiento, y al mismo tiem-  po  donde  se  plantean  nuevas  posibilidades  de  aprendizaje  derivadas  de  esos  modos    de relación y conocimiento. Los agentes educativos de la primera infancia construyen   entonces  esta  mediación  entre  los  desarrollos  alcanzados  por  los  niños  y  las  niñas  y    los desarrollos posibles (Ministerio de Educación Nacional, 2012: 32-33).    \n72  ·    Serie de orientaciones pedagógicas para la educación inicial  Por ello, el ambiente educativo trasciende la mirada plana de su organización para  convocar  a  maestras,  maestros  y  agentes  educativos  a  enriquecerlo,  de  manera  que    responda con claridad a las particularidades de las niñas y los niños y, al mismo tiem-  po, les proponga múltiples posibilidades para crear, transformar, significar, compren-  der  y  participar  en  su  configuración.  Así,  por  ejemplo,  cuando  se  disponen  espacios     en los que está permitido tocar, explorar, jugar, preguntar y sentir, las niñas y los niños   desarrollan  su  creatividad  como  capacidad  para  recrear,  sin  limitarlos  a  la  faceta  de    observadores pasivos. En este sentido, los ambientes en la educación inicial deben or-  ganizarse o crearse intencionalmente para que se constituyan en escenarios enrique-  cidos y significativos que:   •     Promuevan  posibilidades  de  juego,  exploración  del  medio,  literatura  y  expresión   artística.  •     Permitan  ser  resignificados  y  transformados  por  las  niñas  y  los  niños  a  partir  de   sus maneras de expresión.   •     Posibiliten la distribución planeada del mobiliario, los materiales y demás recur- sos  con  los  que  se  cuenta  para  promover  que  las  niñas  y  los  niños  experimenten    diversas acciones, retos e interacciones.  •     Faciliten el acceso de las niñas y los niños a los materiales y al desarrollo de diver- sas actividades de manera autónoma.  •     Tengan  en  cuenta  espacios  externos  de  índole  cultural  y  recreativa  como  biblio- tecas, parques, museos, casas de la cultura, ludotecas y demás espacios públicos y   comunitarios altamente significativos para el desarrollo de acciones pedagógicas   orientadas a fortalecer la participación de las niñas y los niños como ciudadanos y   ciudadanas, así como los procesos de apropiación y transformación cultural.   Experiencias pedagógicas intencionadas  Hablar de experiencias  pedagógicas intencionadas implica afirmar que la práctica  de   maestras, maestros y agentes educativos para promover el desarrollo de las niñas y los   niños  no  puede  dejarse  al  azar,  sino  que  debe  realizarse  en  forma  tal  que  sea  clara  la    influencia que se pretende ejercer en el desarrollo infantil, se dispongan los recursos   y medios que se requieren para ello y se organice el espacio de manera que favorezca   el alcance de los propósitos establecidos. Por ello es importante acudir a la planeación   como recurso que permite hacer explícito este proceso orientador de la acción peda-  gógica.  Como se ha mencionado antes, las intencionalidades pedagógicas se fundan en el  reconocimiento de las singularidades de niñas y niños, de las características de los en-  tornos en los que se desenvuelven cotidianamente y del conocimiento de las maestras,   los  maestros  y  los  agentes  educativos  sobre  desarrollo  infantil.  De  allí  la  diferencia    entre las prácticas pedagógicas que procuran su implementación como proceso de las   que se derivan de actividades discontinuas y desconocedoras de las particularidades   de las niñas y los niños que se educan.  \nSentido de la educación inicial   ·  73  Se  considera  importante  hacer  de  las  prácticas  actuales  de  educación  inicial  una   creación, una invención, una oportunidad para la fantasía, el sueño y la utopía de un   desarrollo infantil enriquecido e integral. Como se plantea a continuación, el desarro-  llo de la primera infancia es el reto a lograr, y ello no sobreviene espontáneamente: es   necesario planearlo y procurarlo. Es decir, que los desarrollos posibles no son en modo alguno metas que se dejan al   azar  o  desarrollos  que  sobrevienen  por  sí  solos,  sino  que  son  elementos  explícitos    que trazan para el agente educativo, un marco comprensivo y una hoja de ruta para   su trabajo pedagógico cotidiano (MEN, 2012: 33).  \n74  ·    Serie de orientaciones pedagógicas para la educación inicial  A manera de síntesis  Es  necesario  tener  presente  que  las  interacciones  significativas,  la  disposición  de  am-  biente enriquecidos y las experiencias  pedagógicas intencionadas son los procesos que   otorgan  sentido  a  la  educación  inicial  de  las  niñas  y  los  niños  de  primera  infancia.  En    consecuencia, las maestras, los maestros y los agentes educativos han de tener en cuenta   las siguientes consideraciones:   •\t   Las experiencias e interacciones propuestas se orienten hacia el conocimiento y   aprendizaje de las niñas y los niños sobre sí mismos, los otros, el mundo y las si-  tuaciones  que  los  rodean,  de  manera  que  pueden  conocer  su  realidad  y  contexto,    interactuar en él y dotarlo de sentido.   •\t   El  juego,  el  arte,  la  literatura  y  la  exploración  del  medio  no  son  medios,  fines,  ni    herramientas de la acción educativa y pedagógica, sino que hacen parte de la na-  turaleza del ser niña y niño, por lo que responden a su singularidad, a las formas   de expresar, representar, vivir, comprender, estar y ser en el mundo. Por lo tanto,   los  ambientes  y  la  experiencias  pedagógicas  deben  otorgarles  un  lugar  relevante    en la cotidianidad de la educación inicial.  •\t   La revisión de las rutinas que se han establecido con el propósito de promover en las   niñas y los niños estilos de vida saludables en relación con la alimentación, el autocui-  dado, la autonomía, el aseo personal, la actividad física y el descanso.  •\t   Las niñas y los niños puedan participar en diferentes espacios y escenarios, tanto   en espacios interiores como en el medio exterior. Estos espacios pueden ser de tipo   natural, cultural y social para enriquecer sus interacciones. Es necesario posibi-  litar  experiencias  en  las  que  las  niñas  y  los  niños  utilicen  diversos  materiales  y    objetos que mantengan su curiosidad e interés por descubrir, experimentar, crear,   imaginar, expresar y preguntar.  •\t   Los  ambientes  enriquecidos  promueven  la  autonomía,  la  toma  de  decisiones,  la    participación, la comunicación y el compartir con pares y adultos, así como la in-  teracción con diferentes objetos y materiales y la expresión de emociones e ideas a   través de diferentes lenguajes artísticos.   •\t   El análisis periódico de la disposición de los ambientes y las dinámicas relacionales   que se generan a partir de estos, entre las niñas, los niños y los adultos, con el propó-  sito de que se posibiliten espacios acogedores basados en el respeto, la valoración, el   afecto y el reconocimiento de cada uno de los integrantes de la comunidad educativa.   •\t   La  pregunta  constante  por  el  verdadero  sentido  y  pertinencia  de  las  actividades    que se proponen para el potenciamiento del desarrollo, si estas le apuntan a una   mirada integral y acorde con las características, momentos de desarrollo e intere-  ses de las niñas y los niños.  •\t   Los  momentos  de  la  atención  como  la  alimentación ,  el  lavado  de  manos,    el  cambio  de  pañal,  el  control  de  esfínteres,  el  sueño,  la  organización  de  los    espacios y materiales, entre otros, se convierten en situaciones de intercambio y   comunicación potenciadoras del desarrollo de niñas y niños.  \nSentido de la educación inicial   ·  75  ¿Cuáles son los espacios en los que acontece la educación inicial?  La educación inicial ocurre en las  modalidades que   se enmarcan en la atención integral a la primera in-  fancia en el país, y por el momento se ha avanzando   en la descripción y definición de la institucional y la   familiar.  Ambas  modalidades  comparten  una  mis-  ma  finalidad:  atender  y  promover  de  manera  inten-  cionada el desarrollo integral de la primera infancia   a  través  de  una  educación  inicial  de  calidad.  Ello  se    lleva a cabo con la participación de talento humano   idóneo  y  pertinente,  de  acuerdo  con  lo  establecido    en las condiciones de calidad19.  Las  modalidades  están  comprometidas  con  la   planeación y gestión articulada y armónica de las ac-  ciones que propenden por contar con las condiciones   materiales    y  humanas  que  hacen  efectivos  los  dere-  chos de las niñas y los niños. Así mismo, son las moda-  lidades las que generan oportunidades para que ellas   y ellos se expresen y comuniquen con pares y adultos,   al tiempo que cuentan con diversidad de experiencias   que les permiten construir y comprender el mundo. La  educación  inicial,  en  tanto  derecho  impostergable  de  la  primera  infancia,  parte   del reconocimiento de los intereses y particularidades personales, culturales y sociales   de  las  niñas,  los  niños  y  sus  familias,  así  como  de  las  características  y  condiciones  de    los contextos en que viven; avanza hacia una comprensión holística de gestión desde la   perspectiva interdisciplinaria de los equipos humanos; trabaja y desarrolla programas   y proyectos bajo los principios de eficiencia, transparencia y compromiso social con las   familias  y  las  comunidades  en  las  cuales  se  halla  inmersa  y  atiende  a  los  diferentes  li-  neamientos técnicos que el país precisó para la educación inicial.  Sumado a lo anterior, en la lógica de la integralidad, en ambas modalidades se coor- dinan y armonizan acciones del Estado (relacionadas con nutrición, salud, formación   y acompañamiento en el cuidado y la crianza) con las familias o cuidadores de las ni-  ñas y los niños. La educación inicial ocurre en espacios institucionalizados y no ins-  titucionalizados en los que se desenvuelven las niñas y los niños, a partir de una serie   de condiciones que allí se disponen. Los espacios institucionalizados son los centros   de desarrollo infantil y jardines infantiles, entre otros, y el no institucionalizado es la   modalidad familiar.    19     Para su revisión y estudio, se puede consultar la serie de orientaciones para favorecer la calidad de  la educación inicial, guía 50, Modalidades y condiciones para las modalidades de educación inicial,   Ministerio de Educación Nacional, 2014. \n76  ·    Serie de orientaciones pedagógicas para la educación inicial  A manera de síntesis  Como  se  ha  enfatizado  a  lo  largo  de  este  documento,  la  educación  inicial  se    caracteriza  por  fundamentar  su  intención  pedagógica  en  el  reconocimiento    de  las  características  y  particularidades  de  las  niñas  y  los  niños.  Por  ello,    independientemente  de  la  modalidad ,  prescribe  los  lugares  físicos  en  que  se    lleva a cabo y también los lugares para el desarrollo de los distintos procesos y   actividades, su duración y disposición horaria de acuerdo con las intenciones y   con las opciones u orientaciones pedagógicas que se asuman. Así mismo, propende   por la generación de mejores condiciones, dotando el quehacer y la atención del   talento humano idóneo, de recursos, tiempos, ambientes y condiciones de salud y   nutrición favorables para el desarrollo infantil.   \nSentido de la educación inicial   ·  77  ¿Qué se enseña y qué se aprende en la educación inicial?  Si se parte de reconocer a las niñas y los niños como seres singulares y diversos, que   viven en contextos particulares y con múltiples factores que intervienen en su creci-  miento,  maduración  y  desarrollo,  se  asume  una  postura  educativa  que  se  aleja  de  la    homogenización en cuanto a cantidad y tipo de conceptos aprendidos por ellas y ellos,   como  por  ejemplo,  saber  los  colores  o  recitar  los  números.  Entonces,  los  contenidos    de la educación inicial tienen que ver con generar oportunidades para jugar, explorar,   experimentar, recrear, leer historias y cuentos, apreciar el arte y entablar diálogos con   otros,  con  el  propósito  de  promover  un  desarrollo  que  haga  de  las  niñas  y  los  niños    seres sensibles, creativos, autónomos, independientes, críticos, reflexivos y solidarios.   Y ello toma en cuenta los propios ritmos de su desarrollo en cuanto a avances, apren-  dizajes,  intereses,  inquietudes,  dificultades,  necesidades  y  potencialidades,  es  decir,    todo aquello que la niña y el niño es y conoce, para comprenderlo mejor y, con esa base,   promover  su desarrollo.  A propósito de los contenidos, es pertinente descifrar qué aprenden las niñas y los  niños y qué enseñan las maestras, los maestros y los agentes educativos en la educa-  ción inicial.  Las propuestas educativas están configuradas por los elementos de salud,   nutrición y alimentación, el desarrollo de las capacidades de la primera infancia,  las   relaciones sociales, la promoción de la autonomía, la participación en el mundo social   y cultural y los vínculos afectivos, principalmente; es un entramado de elementos que   configuran el desarrollo integral del ser humano en estos primeros años de vida.  Mientras la educación preescolar, básica y media organizan su propuesta a través  de  la  enseñanza  de  temas  y  conceptos  que  se  derivan  de  áreas  específicas  o  para  el    desarrollo de competencias en matemáticas, ciencias naturales y sociales, entre otros,   la educación inicial centra su propuesta en acoger, cuidar y potenciar el desarrollo de   las niñas y los niños de primera infancia. Por lo tanto, se habla de un proceso de acom-  pañamiento e impulso de los procesos de desarrollo integral y armónico, y no solo se   enfatiza en su crecimiento cognitivo.  Con  esta  base  se  puede  decir  que,  en  la  educación  inicial,  las  niñas  y  los  niños   aprenden a convivir con otros seres humanos; a establecer vínculos afectivos con pa-  res y adultos significativos, diferentes a los de su familia; a construir normas; a rela-  cionarse con el ambiente natural, social y cultural; a conocerse; a ser más autónomos,   a desarrollar la confianza en sí mismos, a ser cuidados y cuidar a los demás; a sentirse   acogidos, seguros, partícipes, escuchados, reconocidos; a hacer y hacerse preguntas, a   indagar y a formular explicaciones propias sobre el mundo en el que viven; a descubrir   diferentes  formas  de  expresión;  a  descifrar  las  lógicas  en  las  que  se  mueve  la  vida;  a    solucionar problemas cotidianos; a sorprenderse con las posibilidades de movimiento   que ofrece su cuerpo; a apropiarse y hacer suyos hábitos de vida saludable; a enrique-  cer  su  lenguaje  y  a  construir  su  identidad  en  relación  con  su  familia,  su  comunidad,    su  cultura,  su  territorio  y  su  país.  En  fin,  aprenden  a  encontrar  múltiples  y  diversas    maneras de ser niñas y niños mientras disfrutan de experiencias de juego, de arte, de   literatura y de exploración del medio. \n78  ·    Serie de orientaciones pedagógicas para la educación inicial  Entonces,  se  puede  afirmar  que  el  juego,  la  exploración  del   medio,  las  expresiones  artísticas  y  la  literatura  inundan  la  edu-  cación  inicial,  la  llenan  de  fuerza  y  vitalidad  para  permitir  a  ni-  ñas y a niños vivirlos, experimentarlos, hacer parte de ellos tal y   como corresponde a su naturaleza infantil, a sus características,   intereses  y  necesidades  para  su  desarrollo.  Por  ello,  el  juego,  la    exploración  del  medio,  las  expresiones  artísticas  y  la  literatura    pueden considerarse contenidos de la educación inicial; median-  te  estos  contenidos  las  niñas  y  los  niños  encuentran  formas  de    acercamiento a su mundo individual y social y logran potenciar   su  desarrollo,  sin  que  ello  signifique  su  instrumentalización.  Es    decir, no se trata de que las actividades rectoras de la primera in-  fancia  se  constituyan  en  el   cómo   del  quehacer  pedagógico,  sino    en  el  sentido  mismo  del   qué   es  lo  que  se  privilegia  en  el  trabajo    cotidiano con niñas y niños. En la educación inicial no se definen contenidos temáticos o  disciplinares,  pues  la  práctica  se  dota  de  sentido  a  partir  de  los    intereses,  gustos,  preferencias  y  preguntas  que  surgen  en  la  re-  lación cotidiana entre  las niñas, los niños y los adultos. Por ello,   mientras  en  el  barrio  Los  Alpes  de  Santa  Marta,  durante  el  tra-  bajo  con  niñas  y  niños  están  tratando  de  resolver  cómo  surgen    las olas del mar porque alguien preguntó al respecto, en el barrio   Chipre de Manizales puede encontrarse otro grupo de niñas y ni-  ños  indagando por los nevados. De esta manera, no existe un plan   de  estudios  para  la  educación  inicial  ni  unos  conceptos  básicos    que deban aprenderse para pasar de un nivel a otro, pues el énfa-  sis  está  puesto  en  los  procesos  de  desarrollo  que  se  potencian  y    las capacidades que se derivan, por ejemplo, de las posibles hipó-  tesis que hacen niñas y niños para resolver sus preguntas, de sus   esfuerzos por encontrar respuestas coherentes.  En  este  sentido,  el  proceso  de  seguimiento  al  desarrollo  in- tegral de niñas y de niños también tiene una mirada diferente,   pues no se trata de evaluar conceptos o aprendizajes, sino de ca-  racterizar y valorar los procesos de desarrollo a partir del reco- nocimiento de las particularidades de las niñas y los niños. No se niega que ellas y ellos   aprendan conceptos al tiempo que desarrollan nociones que les permiten establecer   relaciones y complejizar su pensamiento; pero, como se ha mencionado, al ser el desa-  rrollo infantil un proceso integral, el quehacer pedagógico no se centra en lo cognitivo,   sino  que  reconoce  la  singularidad  de  las  niñas  y  los  niños  como  un  todo  armónico  e    integrado. Por ello, se reitera que la mirada que hace la educación inicial sobre el pro-  ceso de seguimiento al desarrollo de las niñas y los niños está centrada en sus propios   ritmos de desarrollo, en sus avances, aprendizajes, intereses, inquietudes y potencia-  lidades, es decir, en conocer profundamente a cada una de las niñas y los niños.  \nSentido de la educación inicial   ·  79  A manera de síntesis  Los  contenidos  se  refieren  lo  que  “aprenden”  las  niñas  y  los  niños  y  lo  que  “ense-  ñan” las maestras, los maestros y los agentes educativos, de acuerdo con el sentido   que se ha dado a la educación inicial. Desde este punto de vista, el juego, la explo-  ración  del  medio,  las  expresiones  artísticas  y  la  literatura  se  constituyen  en  las    actividades rectoras que hacen parte de la vida cotidiana de las niñas y los niños y,   en esta medida, puede decirse que forman parte de los contenidos de la educación   inicial.  Así,  el  entorno  educativo  es  un  espacio  en  el  que  se  vive  intensamente  la    primera infancia porque allí las niñas y los niños juegan, se acercan y disfrutan   de la literatura, exploran el medio y descubren diversas expresiones artísticas.  Lo  que  hace  la  maestra,  el  maestro  y  el  agente  educativo  es  propiciar   experiencias  pedagógicas  y  diseñar  ambientes  en  las  que  estén  presentes    el    juego, la exploración del medio, el acercamiento a la literatura y a las expresiones   artísticas, para provocar situciones en las que las niñas y los niños jueguen, creen,   inventen ,  imaginen,  se  relacionen,  comuniquen ,  construyan  conocimientos,    planteen hipótesis, tomen decisiones, expresen sus emociones e ideas, es decir, se   desarrollen de forma integral.  \n80  ·    Serie de orientaciones pedagógicas para la educación inicial  ¿Cómo se organiza el trabajo pedagógico en la educación inicial?  De  las  pedagogías  provienen  los  enfoques  y  estrategias  que  orientan  y  ayudan  a  dar    curso  a  las  acciones  de  las  maestras,  los  maestros  y  los  agentes  educativos  hacia  las    niñas y los niños. Estos enfoques hacen visibles valoraciones que los actores de la so-  ciedad (los educadores, en este caso) les otorgan a ellas y ellos, así como a los sentidos   de  la  educación,  los  propósitos  y  las  acciones  para  alcanzarlos.  Como  afirma  Peralta    (2012),  la  educación  de  la  primera  infancia  es  un  buen  reflejo  de  la  sensibilidad  del    país por su presente y por su futuro. Las estrategias pedagógicas involucran las acciones de la maestra, el maestro y el  agente educativo orientadas a propiciar, en la niña y el niño, un aprendizaje particu-  lar con respecto a su desarrollo integral. No son técnicas, recetas, pasos ni métodos a   seguir mecánicamente. Son selecciones intencionales de quien educa, por considerar   que con esos instrumentos o medios logra generar los propósitos y planes propuestos.   Como escogencia, significa que es posible contar con un repertorio de estrategias pe-  dagógicas  que  ya  algunos  autores  han  postulado,  aprovechar  aquellas  que,  según  los    pares, han funcionado, y continuar usando las que los educadores consideran que les   han servido para lograr sus propósitos o crear unas nuevas.  Del  mismo  modo,  las  estrategias  pedagógicas  configuran  el  cómo  para  el  desa- rrollo  de  la  práctica  pedagógica,  por  lo  que  tienen  en  cuenta  el  rol  del  adulto  y  las    posibilidades que ofrecen a las niñas y los niños, así como los recursos, tiempos, am-  bientes  e  intencionalidades  que  se  proponen  para  el  potenciamiento  de  sus  proce-  sos de desarrollo. En tanto estrategia intencionada, cuenta con una estructura que   la  caracteriza  y  que  deriva  en  el  desarrollo  de  procesos  y  no  de  actividades  discon-  tinuas;  así  mismo,  favorece  la  reflexión  sobre  el  hacer  y  su  ajuste  desde  el  sentido    pedagógico que se deriva del marco de la educación inicial. La elección de las estra-  tegias pedagógicas debe tener en cuenta que las niñas y los niños son protagonistas   de  su  desarrollo  y  que  las  maestras,  los  maestros,  las  familias  o  cuidadores  son  ac-  tores importantes de este proceso, dado que establecen vínculos de apego seguro y   relaciones  de  confianza  que  promueven  la  autonomía  y  las  experiencias  en  las  que    despliegan todas sus capacidades.   De acuerdo con las características de la educación inicial, las estrategias pedagó- gicas deberán ser dinámicas, incluyentes, garantes de la participación activa de niñas   y niños, reconocedoras y respetuosas de sus ritmos de desarrollo. Al tiempo, es nece-  sario  que  sean  coherentes  con  las  intencionalidades  de  formación  propuestas  en  el    proyecto  pedagógico,  pues  las  estrategias  se  constituyen  en  camino  para  el  logro  de    dichas intencionalidades.  Así, por ejemplo,  si en  el  proyecto  pedagógico se  establece    como fin de la formación el desarrollo de niñas y niños autónomos, críticos, reflexivos   y reconocedores de la diversidad, las estrategias pedagógicas deberán posibilitar que,   en la interacción cotidiana, niñas y niños tengan la posibilidad de desarrollar dichas   características;  por  ejemplo,  la  autonomía  y  toma  de  decisiones  puede  potenciarse  a    través de los rincones de trabajo, pues allí cada niña y cada niño elige dónde estar, qué   hacer, cómo avanzar y con quién trabajar, entre otros.      \nSentido de la educación inicial   ·  81  Las  estrategias  pedagógicas  más  cercanas  a  lo  que  pro- pone  la  educación  inicial  son  los  talleres,  los  proyectos  de    aula y los rincones de trabajo o de juego. Estas estrategias se   enriquecen  a  través  de  la  organización  de  los  espacios  (por    ejemplo, de las aulas especializadas o de la disposición de los   materiales), la definición de los recursos, el establecimiento   de los tiempos (siendo clave que se responda a los intereses   de  niñas  y  niños  y  se  rompan  las  rutinas  que  delimitan  los    tiempos institucionales, que a veces no están sincronizados   con los tiempos de las niñas y los niños), la definición de los   roles  que  se  les  otorguen  a  las  niñas,  los  niños  y  sus  fami-  lias,  y  la  relación  con  las  prácticas  culturales  (por  ejemplo,    en la celebración de fiestas propias, en los posibles espacios   ancestrales que se puedan conforman como ambientes edu-  cativos al interior de la modalidad, en la participación de los   sabedores mayores, abuelos y abuelas, etc.).    Las respuestas a las siguientes preguntas orientan la elec- ción  de  estrategias  pedagógicas  que  respondan  al  sentido  de    la educación inicial, a las características de las niñas y los ni-  ños  y  a  la  generación  de  interacciones  y  ambientes  para  po-  tenciar el desarrollo de manera integral y significativa:   •\t   ¿Qué estrategias pedagógicas promueven el juego, la literatura, el arte y la explo-  ración  del  medio  bajo  las  premisas  que  reconocen  a  las  niñas  y  los  niños  como    sujetos activos, con capacidades, singulares y diversos?  •\t   ¿De qué forma la acción pedagógica puede responder a los intereses y caracterís-  ticas de desarrollo de las niñas y los niños?  •\t   ¿De qué manera están dispuestos los ambientes para promover el desarrollo inte-  gral de las niñas y los niños? ¿Estos ambientes promueven la autonomía, la parti-  cipación, la toma de decisiones, la comunicación, la expresión de ideas y emocio-  nes de las niñas y los niños?  •\t   ¿Cómo se organizan las rutinas para el establecimiento de hábitos de vida saluda-  ble con niñas y niños?  •\t   ¿Cómo propiciar la participación de las familias, cuidadores y actores de la comu-  nidad educativa en la práctica cotidiana?   •\t   ¿Las  estrategias  pedagógicas  definidas  responden  a  las  intencionalidades  plan-  teadas en el proyecto pedagógico? Se concluye que las estrategias  orientan y organizan el trabajo pedagógico, en tanto   responden a la pregunta de cómo este se lleva a cabo y se estructura. Son la maestra,   el maestro y el agente educativo quienes eligen y disponen estas estrategias para ofre-  cer  a  las  niñas  y  los  niños  las  posibilidades  de  desarrollo,  organizando  los  recursos,    tiempos, ambientes e intencionalidades. \n82  ·    Serie de orientaciones pedagógicas para la educación inicial  Para terminar...  Por último, es importante reconocer que si bien se han logrado avances significativos en   la configuración de la identidad de la educación inicial, aún hace falta continuar cons-  truyendo y fortaleciendo el camino para la garantía de una educación inicial oportuna,   pertinente y de calidad. En este sentido, se plantean algunos retos y desafíos importan-  tes que convocan a los diversos actores que cotidianamente se relacionan con las niñas   y los niños de primera infancia en los diferentes entornos de su trascurrir vital.    Posicionamiento de la identidad de la educación inicial desde el reconocimiento   de la individualidad   Como se mencionó a lo largo del documento, reconocer la singularidad de niñas y ni-  ños para potenciar su desarrollo es un aspecto básico de la educación inicial. Sin em-  bargo,  aún  es  común  que,  en  el  trabajo  pedagógico,  las  maestras,  los  maestros  y  los    agentes  educativos  sientan  que  es  imposible  dar  respuesta  a  la  heterogeneidad  sin    caer en planeaciones diferentes o que trasciendan los contenidos que históricamente   se han asociado con la educación de la primera infancia. Por ello resulta fundamental   aportar conocimientos a la pedagogía de la educación inicial, con prácticas situadas y   referentes educativos que, de manera permanente, respondan a la diversidad y desde   allí enriquezcan su quehacer.  Al mismo tiempo, avanzar en el reconocimiento y valoración de las diferencias im- plica poner en el centro de la acción pedagógica a las niñas y los niños, descentrándo-  se  de  contenidos  homogéneos  o  estandarizados  (como  los  definidos  en  los  planes  de   estudio). De esta manera es posible lograr que,   desde la interacción cotidiana de niñas, niños   y  adultos  se  generen  relaciones  que  permitan    la  equidad,  el  reconocimiento,  el  respeto,  la    solidaridad,  la  democracia,  la  participación,    etc.  Este  es  un  reto  primordial.  Así  mismo,  la    educación  inicial  requiere  dar  vida  a  una  pe-  dagogía  de  la  hospitalidad,  que  acoja  a  niñas    y  niños,  sus  intereses,  preguntas,  asombros,    dudas y vivencias para su ingreso a la cultura,   al mundo propio, a la vida social. Una pedago-  gía en la que la maestra, el maestro y el agente   educativo reflexionen sobre el encuentro y las   formas como se lleva a cabo, las concepciones,   las experiencias , los materiales y todo aquello   que  contribuye  a  la  promoción  del  desarrollo    integral de la primera infancia. \nSentido de la educación inicial   ·  83  Articulación entre la educación inicial y la educación preescolar  Es  fundamental  avanzar  en  el  proceso  de  articulación  entre  la  educación  inicial  y  la    educación  preescolar,  de  manera  que  se  logre  armonizar  el  tránsito  de  niñas  y  niños    a la educación formal sin que haya traumatismos ni se desconozcan las capacidades   desarrolladas  por  ellas  y  ellos  durante  su  primera  infancia.  Esta  articulación  impli-  ca  también  reconocer  que  la  educación  inicial  tiene  sentido  en  sí  misma  y  que,  por    ello, no se trata de definir una serie de contenidos temáticos o capacidades que deben   desarrollar  las  niñas  y  los  niños  como  preparación  para  el  preescolar,  sino  de  esta-  blecer una ruta clara que favorezca la entrega pedagógica que la maestra, el  maestro   y  el  agente  educativo  hará  a  quienes  acompañen  a  las  niñas  y  a  los  niños    en  grados    posteriores  o  en  otras  instituciones,  teniendo  como  centro  el  reconocimiento  de  sus    características particulares para que continúe potenciándose su desarrollo. Como lo   expresa Zabalza:  La condición básica, pues, del curriculum escolar es ofrecer todo aquel conjunto de   experiencias  (variadas,  ricas,  potentes  desde  el  punto  de  vista  de  su  aportación  al    desarrollo, etc.) que permita continuar el proceso iniciado en la educación infantil,   esto  es,  hacer  posible  el  máximo  desarrollo  de  todas  y  cada  una  de  las  capacidades    infantiles tanto en el ámbito de las aptitudes intelectuales y operativas como en el   ámbito de las actitudes y hábitos (Zabalza, 2000: 1).  De esta manera, es necesario avanzar en un proceso de articulación que reconoz- ca los procesos, capacidades, conocimientos, saberes y experiencias de las niñas y los   niños durante su paso por la educación inicial, para hacerlos más sistemáticos, de ma-  nera que favorezcan su acercamiento a las construcciones disciplinares.   Definición del lugar de la educación inicial como estructurante de la atención in-  tegral en cada uno de los entornos de la vida cotidiana de niñas y niños  Al comprenderse como uno de los estructurantes de la educación inicial en el marco   de  la  atención  integral  de  la  primera  infancia,  es  indispensable  descifrar  particular-  mente, en los entornos salud y espacio público, cuál es el lugar de la educación inicial,   cómo se lleva a cabo y de qué manera la maestra, el maestro y el agente educativo in-  gresa a estos entornos, dialoga y trabaja conjuntamente con los demás actores que allí   están presentes. Por ejemplo, las experiencias enmarcadas desde la pedagogía hospi-  talaria, en algunos servicios de salud, evidencian la necesidad de establecer un trabajo   intersectorial  entre  los  agentes  de  salud  y  los  agentes  educativos  para  garantizar  el    derecho a la educación inicial de las niñas y los niños, indistintamente de su situación   o su condición de enfermedad.   Sin  embargo,  el  camino  es  aún  largo,  pues  se  requiere  seguir  capitalizando  expe- riencias e ir construyendo caminos para que en cada entorno se pueda atender de ma-  nera integral a la primera infancia.  \nCréditos   fotográficos  Archivo fotográfico Ministerio de Educación Nacional:  Portada, página 14.  Archivo fotográfico Presidencia de la República:   Páginas 12, 20, 22, 56.  Centro de Expresión Artística Mafalda:   Página 71.  Cabildo Indígena Misak de Pisitau:   Página 35.  Claudia Ximena Alvarado:  Páginas 28, 75.  Cristian Trochez:  Páginas 52, 64.  Daniel Gómez:  Páginas 38, 60, 78, 79.  Diana Ibeth Urueña Mariño:  Página 82.  Doris Andrea Suárez:  Páginas 42, 76.  Escuela Maternal, Universidad Pedagógica Nacional:  Páginas 51, 63.  Fundación PLAN:  Página 46.  Hellen Maldonado:  Páginas 37, 38.  Instituto Colombiano de Bienestar Familiar:  Páginas 18, 27.  Isabel Calderón:  Páginas 66, 73.  Jeison Ulloa:  Página 70.  Laura Micaham:  Páginas 30, 81.  Mauricio Vargas:  Página 36.  Organización Internacional para las Migraciones (OIM):  Página 24. \n\nBibliografía   Bárcena,  F.  y  Mélich,  J.  (2000).   La  educación  como  aconteci-  miento ético: natalidad, narración y hospitalidad.  Madrid: Pai-  dós.  Blanco,  R.  (2009).  “La  atención  educativa  a  la  diversidad:  las    escuelas  inclusivas” .     Calidad,  equidad  y  reformas  en  la  ense- ñanza.    Comp.  Marchesi,  A.;  Tedesco,  J.  C.  y  Coll,  C.  Madrid:   Fundación Santillana, OEI, 87-89.  — (2012). “Educación inclusiva y atención a la diversidad”.   Pe- ralta,  V.  y  Hernández,  L.  (Coord.).   Antología  de  experiencias  de    la educación inicial Iberoamericana. La educación que queremos   para  la  generación  de  los  bicentenarios.   Madrid:  OEI,  BBVA  y    Unicef. Colección Infancia, Metas Educativas 2021, 80-86.  Candal Rocha, E. (1999). “A Pedagogia e a educação infantil” .   Revista  Iberoamericana  de  Educación   22  (enero - abril).  Ma-  drid: OEI.  Cerda Gutiérrez, H. (2003).  Educación preescolar: historia, le-  gislación, currículo y realidad socioeconóm     function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }
    function rgbToHex(r, g, b) {
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');

    }

        return rgbToHex(a.r + (b.r - a.r) * amount, a.g + (b.g - a.g) * amount, a.b + (b.b - a.b) * amount);
    }
    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);
    }
    function getReadableTextColor(bgColor) { return getLuminance(bgColor) > 0.56 ? '#111827' : '#f8fafc'; }
    function generatePalette() {
        const hue = Math.floor(Math.random() * 360);
        const bg = hslToHex(hue, 45 + Math.floor(Math.random() * 20), 16 + Math.floor(Math.random() * 70));
        const text = getReadableTextColor(bg);
        const isDark = getLuminance(bg) < 0.5;
        const accent = hslToHex((hue + 35 + Math.floor(Math.random() * 60)) % 360, 80, isDark ? 55 : 45);
        const card = isDark ? mixColors(bg, '#ffffff', 0.08) : mixColors(bg, '#000000', 0.05);
        const border = isDark ? mixColors(card, '#ffffff', 0.18) : mixColors(card, '#000000', 0.12);
        const input = isDark ? mixColors(card, '#ffffff', 0.07) : mixColors(card, '#000000', 0.04);
        const inputBorder = isDark ? mixColors(border, '#ffffff', 0.12) : mixColors(border, '#000000', 0.1);
        const botBg = isDark ? mixColors(bg, '#ffffff', 0.12) : mixColors(bg, '#000000', 0.06);
        return {
            bgColor: bg,
            textColor: text,
            cardBgColor: card,
            cardBorderColor: border,
            inputBgColor: input,
            inputBorderColor: inputBorder,
            chatBubbleBotBg: botBg,
            chatBubbleBotText: text,
            chatBubbleUserBg: accent,
            chatBubbleUserText: getReadableTextColor(accent),
            primaryColor: accent,
            secondaryColor: isDark ? mixColors(accent, '#ffffff', 0.2) : mixColors(accent, '#000000', 0.2),
            headerBorderColor: border,
            systemMessageBg: isDark ? mixColors(bg, '#fde68a', 0.2) : mixColors(bg, '#fde68a', 0.28),
            systemMessageText: isDark ? '#fef3c7' : '#78350f'
        };
    }
    function buildThemePalette(theme, palette) {
        const base = palette || {
            primaryColor: '#2563eb',
            secondaryColor: '#6b7280',
            bgColor: '#ffffff',
            textColor: '#1f2937',
            cardBgColor: '#ffffff',
            cardBorderColor: '#d1d5db',
            inputBgColor: '#ffffff',
            inputBorderColor: '#cbd5e1',
            chatBubbleBotBg: '#f3f4f6',
            chatBubbleBotText: '#1f2937',
            chatBubbleUserBg: '#2563eb',
            chatBubbleUserText: '#ffffff',
            headerBorderColor: '#e5e7eb',
            systemMessageBg: '#fef3c7',
            systemMessageText: '#92400e'
        };
        const isDark = theme === 'dark';
        const bgColor = isDark ? mixColors(base.bgColor || '#ffffff', '#000000', 0.72) : '#ffffff';
        const textColor = getReadableTextColor(bgColor);
        const cardBgColor = isDark ? mixColors(bgColor, '#ffffff', 0.08) : '#ffffff';
        const cardBorderColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.16) : '#d1d5db';
        const inputBgColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.06) : '#ffffff';
        const inputBorderColor = isDark ? mixColors(cardBorderColor, '#ffffff', 0.12) : '#cbd5e1';
        const chatBubbleBotBg = isDark ? mixColors(bgColor, '#ffffff', 0.12) : '#f3f4f6';
        const chatBubbleBotText = textColor;
        const headerBorderColor = cardBorderColor;
        const systemMessageBg = isDark ? mixColors(bgColor, '#fde68a', 0.2) : '#fef3c7';
        const systemMessageText = isDark ? '#fef3c7' : '#92400e';
        return {
            ...base,
            bgColor,
            textColor,
            cardBgColor,
            cardBorderColor,
            inputBgColor,
            inputBorderColor,
            chatBubbleBotBg,
            chatBubbleBotText,
            headerBorderColor,
            systemMessageBg,
            systemMessageText
        };

    function setPaletteVariables(target, palette) {

        target.style.setProperty('--primary', palette.primaryColor || '#007bff');

        target.style.setProperty('--bg', palette.bgColor || '#f8f9fa');

        target.style.setProperty('--iborder', palette.inputBorderColor || '#cccccc');
        target.style.setProperty('--bot-bg', palette.chatBubbleBotBg || '#e9ecef');

        target.style.setProperty('--sys-bg', palette.systemMessageBg || '#fff3cd');
        target.style.setProperty('--sys-text', palette.systemMessageText || '#856404');
    }

    pdf2Upload.addEventListener('change', async (ev) => {
        const file = ev.target.files[0]; if (!file) return;
        if (!(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) {
            pdf2StatusDisplay.textContent = 'No es un PDF válido.'; pdf2StatusDisplay.style.color = 'var(--danger)'; return;
        }
        pdf2Name = file.name; pdf2NameDisplay.textContent = file.name;
        pdf2StatusDisplay.textContent = 'Procesando...'; pdf2StatusDisplay.style.color = 'var(--warning)';
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(e.target.result) }).promise;
                let text = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const tc = await page.getTextContent();
                    tc.items.forEach(item => text += item.str + ' ');
                    text += '\n';
                }
                pdf2Text = text;
                pdf2StatusDisplay.textContent = '"' + pdf2Name + '" cargado.'; pdf2StatusDisplay.style.color = 'var(--success)';
                addMsg('Segundo documento "' + pdf2Name + '" listo.', 'system');
            } catch(err) { pdf2StatusDisplay.textContent = 'Error al procesar.'; pdf2StatusDisplay.style.color = 'var(--danger)'; pdf2Text = ''; }
        };
        reader.readAsArrayBuffer(file);
    });

            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));

    function updateLastMsg(message) {
        const el = document.getElementById('thinking-msg');
        const botAvatarUrl = getAvatarUrl('bot');
        const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
</body>
</html>
