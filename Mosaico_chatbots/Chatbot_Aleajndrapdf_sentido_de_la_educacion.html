propiados  para  este    momento  del  desarrollo  infantil.  Por  este  camino  se  distancia  de  la  educación  que    prepara para la básica primaria y transita por senderos que promueven la articu-  lación entre atención y educación, con el fin de propiciar un desarrollo de la primera   infancia en la perspectiva de derechos.  Las siguientes tendencias dan cuenta de este tercer momento del trazado his- tórico que se viene haciendo de la educación inicial:  •\t   El marco presentado en el trecer momento plantea que el concepto de educación   inicial amplía el derecho a la educación en este rango de edad, es decir, el dere-  cho a la educación no se da a partir de los 3 años, como lo concebía la educación   preescolar, sino que es a partir del nacimiento, convirtiendo así la educación de   la primera infancia en el primer nivel educativo del sistema colombiano.  •\t   La política pública de Atención Integral a la Primera Infancia resulta de   la experiencia vivida en el país, con la participación de diferentes actores   del  Estado  y  la  sociedad,  que  ha  sentado  las  bases  para    su  actual  imple-  mentación.  •\t   De 2000 a 2010 se intensifica en el país la discusión en torno al significado   de ser niña y niño de primera infancia, sus derechos y la educación inicial,   no desde la perspectiva del preescolar, sino con una mirada de atención in-  tegral  que  le  da  una  identidad  particular,  de  acuerdo  con  lo  dispuesto  por    la Ley 1098 de 2006. En 2007, el Ministerio de Educación Nacional se une   con mayor presencia a esta discusión.  •\t   El 2009 es un año fértil para la educación inicial, se avanza en la delimita-  ción de sus actuaciones y se inicia un proceso de definición y caracteriza-  ción de su servicio a través de tres modalidades.    •\t   La política pública de Atención Integral a la Primera Infancia impulsa desa-  rrollos importantes para la educación inicial en materia de línea pedagógica   y en las condiciones de calidad que caracterizan sus modalidades. \n38  ·    Serie de orientaciones pedagógicas para la educación inicial \nSentido de la educación inicial   ·  39  La educación inicial:    marco general  Como  se  desprende  de  lo  expuesto  en  el  capítulo  anterior,  referido  a  la  génesis  de  la    educación inicial, puede afirmarse que este concepto, reciente en el país, tiende a ge-  neralizarce  en  la  sociedad.  El  momento  actual  se  caracteriza  por  contar  con  un  es-  cenario  favorable,  que  convoca  a  los  diferentes    actores  sociales  a  una  nueva  actitud    y  sensibilidad  respecto  a    la  educación  de  las  niñas  y  los  niños  desde  su  nacimiento    hasta  su  ingreso  a  la  educación  fomal,  reconociendo  su  importancia  y  su  papel  en  el    desarrollo humano y social.  La  educación  inicial  continúa  en  proceso  de  construcción,  abierta  al  avance,  a  la   explicitación de la variedad de conceptos que caracterizan su campo de acción, a los   actores educativos que la promueven, a las modalidades en las que se organiza, a los   sujetos  a  los  que  se  destina  y  a  las  acciones  que  la  constituyen.  Las  particularidades    implicadas en la promoción de una educación que potencia el desarrollo de las niñas   y los niños según el momento y características propias de los procesos de desarrollo   que atraviesan, reconociendo las particularidades que se derivan de su cultura y de las   condiciones contextuales en que se desenvuelven, conduce a la necesidad de realizar   delimitaciones conceptuales, educativas y pedagógicas que permitan la consolidación   de un conocimiento de doble vía: del reconocimiento y la reflexión de las prácticas a la   conceptualización y construcción de conocimiento; del conocimiento existente hacia   la promoción y orientación de prácticas cada vez más significativas y cualificadas. Dentro de las concepciones que contribuyen a delimitar el campo de la educación  inicial se encuentran las que consideran que esta educación tiene sentido en sí mis-  ma, y no solo con referencia a la educación escolar (preescolar, transición, previa a la   primaria) de la que puede hacer parte como sistema educativo. Los distintos nombres   que asume en América Latina la educación de las niñas y los niños de primera infancia   dan cuenta de esta perspectiva que contribuye a despojarla del sentido autónomo que   tiene para ponerla al servicio de la educación preescolar, prebásica o preprimaria, o a   confundirla con los procesos propios de la crianza (educación maternal), o a atribuir-  le posibilidades que adelantan el desarrollo y aceleran el propio ritmo (estimulación   temprana o precoz), o a presentarla de manera general, sin especificar que se trata de   las niñas y los niños de 0 a 6 años (educación infantil, educación parvularia). Si bien   educación  inicial  puede  incluirse  en  este  último  grupo,  también  puede  considerarse    que, junto con educación de la primera infancia, son las mejores maneras de designar   la educación en este momento del ciclo vital.  En  esta  medida,  la  distancia  que  asume  la  educación  inicial  de  las  denominacio- nes  presentadas  hace  parte  de  su  comprensión  y  delimitación,  al  tiempo  que  define    posturas sobre lo que se entiende por ella, su sentido y cómo se implementa en la coti- \n40  ·    Serie de orientaciones pedagógicas para la educación inicial  dianidad. En esta medida, se trata de un asunto que va más allá de lo semántico, pues   compromete  la  manera  en  que  se  entiende  la  educación  de  las  niñas  y  los  niños  en    primera  infancia  y  aquello  que  le  es  propio  o  que  hace  parte  de  ella  (Peralta,  2007).    Es evidente que no se trata de un cambio de nombre, sino del sentido que configura la   denominación en sí misma y sus implicaciones en la comprensión de la concepción de   las niñas y los niños como sujetos de derecho, y de los propósitos que fundamentan el   quehacer pedagógico de las maestras, los maestros y los agentes educativos que ade-  lantan los procesos de educación.   La  educación  inicial  pone  en  el  centro  de  su  hacer  a  las  niñas  y  los  niños,  reco- nociendo  las  particularidades  que  singularizan  su  desarrollo  infantil,  por  lo  que  las    actuaciones  de  quienes  están  en  interacción  con  ellas  y  ellos  procuran  contribuir  a    la construcción de su identidad, acompañándolos en su proceso de inserción y cons-  trucción del mundo propio y social. Por consiguiente, promover el desarrollo integral   en  el  marco  de  la  educación  inicial  significa  reconocer  a  las  niñas  y  los  niños  en  el    ejercicio de sus derechos, saber de sus singularidades, intereses, gustos y necesidades,   y  atenderlos  mediante  las  actividades  que  implican  esos  intereses  en  sus  momentos    particulares de desarrollo.  De  esta  manera,  al  ser  el  juego,  la  literatura,  las  diversas  expresiones  artísticas   y la exploración del medio las actividades propias que caracterizan a la primera in-  fancia,  el  objetivo  de  la  educación  inicial  no  es  enseñar  contenidos  temáticos  de  la    manera en que se hace en la básica primaria, o tratar al niño como alumno en situa-  ción  escolar,  sino  desplegar  diferentes  oportunidades  para  potenciar  su  desarrollo   \nSentido de la educación inicial   ·  41  de  acuerdo  con  sus  características,  aprender  desde  las  preguntas  e  intereses  que    surgen en su vida cotidiana y valorar sus saberes, así como sus formas de ser y estar   en  el  mundo,  entre  otros,  a  propósito  de  ser  niño  y  niña:  jugar,  explorar,  inventar,    imaginar y crear.  La  especificidad  de  la  educación  inicial  está  puesta  en  el  reconocimiento  de  las    características, capacidades y habilidades de las niñas y los niños, lo cual es la base   para proponer e implementar procesos educativos oportunos y pertinentes que po-  sibiliten  la  generación  de  aprendizajes  en  forma  significativa,  orientados  al  desa-  rrollo integral en la perspectiva de sujetos de derechos, de seres sociales diversos y   singulares. Con el fin de contribuir a la reflexión sobre los marcos y posibilidades de la educa- ción inicial y a su delimitación, se destinará el desarrollo de este apartado a responder   los siguientes interrogantes:  •\t   ¿Qué es la educación inicial?   •\t   ¿Para qué educar en la primera infancia?  •\t   ¿Quiénes participan en la educación inicial?  •\t   ¿Qué procesos otorgan sentido a la educación inicial?  •\t   ¿Cuáles son los espacios en los que acontece la educación inicial?      •\t   ¿Qué se enseña y qué se aprende en la  educación inicial?  •\t   ¿Cómo se organiza el trabajo pedagógico en la educación inicial? Las  respuestas  a  estas  preguntas  ponen  de  presente  la  existencia  de  formas  de   educar distintas (enfoques y prácticas) con las cuales se cuenta hoy para mostrar un   camino  en  el  que  se  favorezca  el  desarrollo  integral  de  las  niñas  y  los  niños  en  este    momento vital. Esta diversidad resulta de una historia, de unas opciones teóricas, de   unas prácticas que el educador lleva a cabo y de una apertura a que todo esto sea re-  flexionado para generar nuevas y renovadas prácticas, pertinentes, oportunas y de ca-  lidad, que caractericen la educación de la primera infancia.   Antes de entrar en materia, es importante advertir que las razones que motivan las  respuestas anunciadas se anclan en el interés por cualificar las prácticas educativas con   las niñas y los niños de primera infancia que, se considera, están influenciadas por las   concepciones  que  se  tienen  sobre  educación,  niña  y  niño,  desarrollo  integral,  aprendi-  zaje y diversidad, entre otras. Si bien no todos estos asuntos temáticos y conceptuales   resultan igualmente tratados en extensión y profundidad en este documento, lo expues-  to  sirve  de  base  para  el  avance,  la  reflexión,  el  estudio  juicioso,  la  recuperación  de  las    prácticas y el cambio de abordajes de la educación inicial.  Se  busca  que  las  nuevas  concepciones  contribuyan  al  desarrollo  de  prácticas  más   coherentes,  y  que  estas  prácticas  renovadas  aporten  al  enriquecimiento  de  las  cons-  trucciones conceptuales, ya que entre mayor claridad se tenga sobre aquello que se sabe,   piensa y hace sobre la educación de la primera infancia, existen mayores posibilidades   de aportar al desarrollo de la misma por parte de todos los actores que involucrados en   este proceso.  \n42  ·    Serie de orientaciones pedagógicas para la educación inicial  ¿Qué es la educación inicial?  Educar  en  la  primera  infancia  significa  proponer,  por  parte  de  los  distintos  miembros    de la sociedad, acciones conducentes a lograr la inmersión de las nuevas generaciones   en la cultura, que contribuyan a su estructuración como seres sociales que aprenden a   convivir con otros, en la medida en que adquiere y hace propias las reglas y normas de la   sociedad, y en tanto cuenta con las condiciones de bienestar que les permiten tener una   vida digna; al mismo tiempo, es un proceso que responde a las apuestas sociales, cultu-  rales y políticas de una sociedad en relación con el sujeto que se desea formar. Al ser la   educación  un  acto  intencional,  se  considera  que  quienes  la  llevan  a  cabo  (educadores,    pedagogos y quienes hagan sus veces) han recibido esta delegación de la sociedad, por lo   que sus prácticas se institucionalizan a través de la definición de finalidades, espacios,   tiempos, actores, reglas y roles para realizarla, aunque ello no implique, necesariamen-  te, lugares físicos.  Durante su inserción en el mundo social, las niñas y los niños construyen su propia  realidad, generan aprendizajes, se desarrollan, potencian sus capacidades y adquieren   otras,  todo  ello  como  parte  de  los  procesos  de  socialización  en  los  que    participan  al    interactuar con la familia y al establecer relaciones con quienes les rodean, en todos   los entornos en los que transcurren su vida. El proceso de potenciamiento de las ca-  pacidades, las estructuras y las dotaciones con las que cuentan las niñas y los niños se   lleva a cabo a partir de las experiencias que disponen el medio y los adultos con quie-  nes entran en interacción. En el entorno hogar, estos procesos son los que configuran  \nSentido de la educación inicial   ·  43  la crianza y se constituyen en la base para los procesos posteriores que se adelantan en   el entorno educativo y posibilitan la construcción de la identidad, el reconocimiento   del otro y el desarrollo de la autonomía.   En este sentido, la educación inicial se caracteriza por complementar y potenciar la  educación  que  se  inicia  en  el  entorno  familiar,  entendida  esta  como  crianza,  al  tiempo    que  propone  procesos  de  calidad  que  favorecen  el  desarrollo  integral  de  las  niñas  y  los    niños  al  disponer  de  espacios,  tiempos,  recursos  e  intencionalidades  claras.  El  entorno    educativo se fortalece en la relación que establece con los otros entornos; por lo tanto, no   pretende constituirse en espacio aislado que solo depende y se alimenta de lo que sucede   en su interior. Así,  el  entorno  educativo  propende  por  la  generación  de  acciones  interrelaciona- das  e  intersectoriales  que  vinculan  a  los  diferentes  actores  que  se  encuentran  en  un    territorio,  de  manera  que  se  favorezca  la  atención  integral  a  la  primera  infancia,  es    decir, que todas las acciones de todos los actores confluyen en la atención y educación   de cada niña y cada niño. Ejemplo de ello es la permanente comunicación que sostiene   el entorno educativo con el entorno salud para realizar seguimiento a la actualización   del esquema de vacunación de niñas y niños de acuerdo con su edad, o la promoción   de prácticas saludables con las familias para generar mejores condiciones de higiene   y salubridad. A su vez, en cuanto al entorno espacio público, hacer uso de los parques,   las bibliotecas, ludotecas, museos, casas de la cultura u otros escenarios presentes en   el territorio resulta esencial para enriquecer la práctica pedagógica.  El hecho de que la educación inicial sea intencional significa que se realiza de ma- nera sistemática, estructurada y planeada para propiciar los aprendizajes que la niña   y el niño requieren en función de su desarrollo. La  sistematicidad  proviene de su or-  ganización con arreglo a criterios y decisiones que tienen que ver con los contenidos   y métodos y con las maneras como ellos se despliegan en los tiempos que se disponen   para  educar,  en  consideración  a  las  características  y  particularidades  de  las  niñas  y    los niños.  Considerar que la educación inicial se realiza en forma  estructurada  significa que  todos  los  componentes  de  la  atención  integral  están  articulados  y  hacen  parte  de  la    organización que se les ha dado; en otras palabras, el orden y las relaciones entre las   acciones educativas provienen de una intención que busca incidir de manera integral   en el desarrollo de las niñas y los niños, pues se origina en una concepción que entien-  de que son un todo no susceptible de fragmentaciones ni parcializaciones.  Al afirmar que es  planeada,  se está diciendo que se realiza conforme a unas inten- ciones  y  propósitos  preestablecidos  con  los  cuales  se  precisan  los  medios,  recursos,    estrategias y actividades para realizar la práctica pedagógica; la convergencia de estos   elementos con los propósitos educativos proporciona una fuerza enorme a la acción   educativa y una gran capacidad de incidir en la transformación y el cambio de la socie-  dad. El saber pedagógico orienta  el  hacer de la educación inicial. La educación inicial considera que las niñas y los niños, en cualquier momento de  su desarrollo, disponen de capacidades diversas que forman el acervo de habilidades,   construcciones y conocimientos con las que se relacionan y comprenden el mundo. Es  \n44  ·    Serie de orientaciones pedagógicas para la educación inicial  así como las niñas y los niños aprenden: en la interacción con los demás, con el medio   que  les  rodea  y  consigo  mismos.  Por  eso  quienes  acompañan  educativamente  deben    preguntarse  quiénes  son,  qué  capacidades  poseen,  han  desarrollado  y  pueden  desa-  rrollar, para que las acciones pedagógicas tengan una intención de acuerdo con ello y   con lo que propone la educación como finalidad.  Diferencias de la educación inicial con otras denominaciones y significados atri-  buidos a la misma  La educación inicial, como queda dicho, procura muy diversas experiencias dirigidas   a  promover  el  desarrollo  de  la  primera  infancia.  Sin  embargo,  también  proporciona    otro tipo de experiencias que se encargan de acompañar la transición de las niñas y los   niños, a manera de andamiaje, en el paso de la crianza a la educación inicial y de esta   a la educación preescolar.  La  diferencia  de  la  educación  inicial  con  la  educación  preescolar  se  hace  a  partir   de los rumbos y sentidos que esta ha asumido históricamente. En el contexto colom-  biano,  la  educación  preescolar  hace  parte  del  sistema  educativo  (de  acuerdo  con  lo    establecido en la Ley General de Educación de 1994) y, en general, se ha concebido e   institucionalizado en las prácticas mismas de los preescolares como el nivel prepara-  torio para la educación básica primaria; Las prácticas pedagógicas que allí se realizan   se concentran en el aprestamiento o el desarrollo de habilidades y conocimientos bá- \nSentido de la educación inicial   ·  45  sicos que permiten a niñas y niños prepararse, acomodarse y ajustarse a los requeri-  mientos de la educación formal.  En relación con su función de acompañar la transición de la niña y el niño al gra- do  de  educación  preescolar,    la  educación  inicial,  más  que  definirse  en  función  de    ser  preparatoria  para  este  grado,  tiene  sentido  en  sí  misma.  Esta  se    aleja  del  tra-  bajo  con  conocimientos  disciplinares  y  áreas  escolares,  pues  el  desarrollo  infantil    es  el  centro  de  la  acción  educativa.  Así,  la  educación  inicial  abarca  una  idea  más    amplia que la propia enseñanza tal y como está referida comúnmente en el contexto   escolar, donde tiende a hacerse énfasis en los aspectos cognitivos. Esta definición de   intencionalidades  pedagógicas  se  fundamentan  en  el  reconocimiento  de  las  carac-  terísticas de las niñas y los niños, las particularidades de los contextos en que viven,   sus ritmos de desarrollo, intereses, gustos, preferencias, preguntas e hipótesis, ente   otros.   En  cuanto  a  la  diferencia  entre  educación  inicial  y  estimulación  temprana  o  pre- coz, esta última alude a la introducción de una influencia externa sobre las niñas y los   niños para obtener de ellas y ellos una respuesta adecuada a ese estímulo. La princi-  pal crítica a esta idea tiene que ver con el hecho de que olvida la participación activa,   constructiva y natural de la niña o el niño en su propio desarrollo a través de la interac-  ción con el medio y los que le rodean. A su vez, la idea de “precoz” o “temprana” alude a   hacerlo suceder antes de tiempo o adelantándose al momento en el que suele ocurrir,   con lo que no está de acuerdo la educación inicial, en tanto lo que esta se propone una   educación  oportuna  y  rica  de  acuerdo  a  sus  momentos  de  desarrollo;  es  decir,  en  la    educación inicial se reconocen las particularidades de todos y cada uno, lo que implica   respetar sus ritmos de desarrollo, la diversidad de experiencias, necesidades e intere-  ses y los estilos o formas de aprendizaje, entre otros. Con respecto a la diferencia que puede establecerse entre educación inicial y edu- cación maternal, puede decirse que si bien la educación inicial potencia los procesos   de crianza que se inician en el entorno hogar y que son constitutivos de la educación   maternal, su propósito no es, necesariamente, darle continuidad o suplir la función de   las familias. Antes bien, frente a la crianza, la educación inicial se propone un recono-  cimiento y una articulación porque, en la familia, las niñas y los niños adquieren las   características, valores y tradiciones culturales que son fundamentales en el desarro-  llo infantil y que dan pie para generar acciones que enriquezcan dichos procesos en el   marco del desarrollo integral.  Para  reafirmar  lo  dicho,  Soto  y  Violante  (2008:  25)  comprenden  la  crianza  como   un  “proceso  educativo  característico  de  los  niños  en  sus  primeros  años”,  a  cargo  de    padres, madres y/o adultos cuidadores que desempeñen, en el seno familiar, las fun-  ciones del cuidado, la socialización y la adquisición de la identidad de las niñas y los   niños,  lo  que  incluye  alimentar,  nutrir  y  ayudar  a  crecer.  Este  proceso  tiene  especial    incidencia  en  el  desarrollo  infantil  por  el  vínculo  afectivo  que  construye  la  niña  y  el    niño  con  quienes  lo  promueven,  de  tal  manera  que  entre  más  oportuna  y  pertinente    sea la comprensión y respuesta a sus necesidades, hay mayores posibilidades de pro-  poner interacciones para propiciar el desarrollo integral.  \n46  ·    Serie de orientaciones pedagógicas para la educación inicial  Como se desprende de lo dicho, la labor intencional o no de la familia en el entor- no  hogar  no  puede  ser  sustituida  por  nadie.  Y  es  precisamente  en  este  punto  donde    la  crianza  se  hace  diferente  a  la  educación  inicial,  pues  esta  sí  asume  una  intención    expresa  en  sus  acciones  y  reconoce,  como  punto  de  partida  y  referente  necesario,  el    desarrollo propiciado en los procesos de crianza.   La educación inicial como acogida, cuidado y potenciamiento del desarrollo    A pesar de la distinción hecha entre educación inicial y crianza, es importante desta-  car que entre más pequeño sea la niña y el niño de los que se encarga la educación ini-  cial, mayor es la necesidad de integrar acciones que hacen parte directa de la crianza   —como el cuidado, la alimentación, el sueño o el cambio de pañales— con las acciones   educativas: propiciar experiencias artísticas, de juego, literatura y de exploración del   medio, entre otras, para lograr la inserción social de las niñas y los niños, su construc-  ción como sujetos, su autonomía y su participación activa de acuerdo con el momento   de vida en el que se encuentran.  De esta forma, se propone la comprensión de una educación inicial en la que se aco- ge, se cuida y se promueve el desarrollo de las niñas y los niños en la primera infancia. Al  recuperar  el  concepto  de  crianza  como  proceso  educativo  característico  de   los niños pequeños, [...] durante el desarrollo de las actividades (alimentación, higie-  ne, juego y sueño), se transmite a los niños el conjunto de saberes sociales propios   y valorados por la comunidad, al mismo tiempo que se ayuda a los pequeños a con-  quistar su autonomía. Entonces cambiar a un bebé conversando con él, haciéndole   cosquillas,  nombrándolo  y  tocándoles  sus  manos  y  pies,  sonriéndole  mientras  es-  pera que el adulto lo limpie es una situación educativa (Soto y Violante, 2008: 26).  \nSentido de la educación inicial   ·  47  Así,  acoger  y  cuidar  se  convierten  en  una  oportunidad  educativa  y  pedagógica.  Al   comprender la importancia de responder de manera oportuna a las necesidades propias   del momento de desarrollo de niñas y niños se otorga un lugar diferente a las prácticas   de  cuidado,  pues  no  se  tratan  como  acciones  asistenciales,  sino  como  oportunidades    para potenciar los procesos de desarrollo de ellas y ellos desde el reconocimiento de su   singularidad y como posibilidad de interacción y construcción permanente del mundo   social y cultural. En este marco, pensar en la educación inicial como acogida y cuidado   pone  de  manifiesto  la  importancia  del  vínculo  afectivo  que  se  construye  con  las  niñas    y  los  niños  a  través  de  las  interacciones  presentes  en  la  cotidianidad,  que  superan  las    rutinas y develan el sin fin de posibilidades que se desprenden de las características par-  ticulares de la primera infancia.     De  esta  manera,  la  educación  inicial  puede  pensarse  en  las  coordenadas  plantea- das por Bárcena y Mélich (2000) con respecto a la relación que implica la presencia   del rostro del otro (en este caso, de la niña y del niño), que invita a la hospitalidad, a la   acogida, al encuentro de alguien distinto a quien educa. Para los autores, la educación   resulta una experiencia única, irrepetible y singular entre los adultos, las niñas y los   niños. En esta relación es fundamental abrirse al otro, acogerlo y comprometerse con   él, lo que significa entablar una relación amorosa en la que el educador reconoce, po-  sibilita, potencia, apoya, acompaña y se involucra con ellas y ellos como principio del   quehacer pedagógico.  Esta  concepción  es  llamada  “educación  como  acontecimiento  ético”  porque  aco- ger al otro implica reconocer su experiencia, su recorrido, su mundo vital y compro-  meterse con él; es saber de la responsabilidad implícita en el acto educativo, ya que el   educador  es  responsable  del  otro.  La  alteridad  aparece  así  como  el  principio  básico    de esta relación, una alteridad que descentra al educador para pensar e identificar el   mundo del otro y buscar su potencialidad como dinamizadora de la acción educativa   y pedagógica. Por  eso,  para  potenciar  el  desarrollo  de  las  niñas  y  los  niños,  no  es  suficiente  el   contacto  espontáneo  con  el  medio,  los  adultos  o  los  pares,  sino  que  estas  relaciones    “naturales” se constituyen en la base para el trabajo pedagógico, siendo indispensable   partir de la observación de sus características e intereses para proponer experiencias   que acompañen y posibiliten el máximo desarrollo de ellas y ellos. Por lo tanto, poten-  ciar  el  desarrollo  requiere  de  un  trabajo  intencionado  por  parte  de  las  maestras,  los    maestros  y  los  agentes  educativos,  que  son  quienes  provocan  situaciones  retadoras    desde la creación de ambientes enriquecidos, experiencias pedagógicas y prácticas de   cuidado que promueven en las niñas y los niños interacciones y acciones cada vez más   complejas.  Comprender la educación inicial como acogida, cuidado y potenciamiento del de- sarrollo parte del principio ético y pedagógico de configurar escenarios que enriquez- can  los  procesos  de  desarrollo  de  niñas  y  niños,  de  reconocer  sus  particularidades    para potenciar, desde allí, las diferentes formas de ser y estar en el mundo que definen   la  singularidad  y  abren  múltiples  caminos  a  la  construcción  de  la  identidad,  el  desa-  rrollo de la autonomía y el despliegue de la creatividad. Acoger y cuidar implica per- \n48  ·    Serie de orientaciones pedagógicas para la educación inicial  mitirse descubrir en las niñas y los niños diferentes formas de relación, de construir la   identidad, de recrear, soñar, pensar, hacer, configurar, descifrar y significar el mundo   social y cultural.        La educación inicial y su  pedagogía  La educación inicial se lleva a cabo desde una pedagogía que reconoce las diferencias   y  que  se  piensa  en  clave  de  derechos.    La  pedagogía,  para  la  educación  de  la  primera    infancia, se entiende como un saber teórico-práctico que está en permanente elabo-  ración por parte de las maestras, los maestros y los agentes educativos, a partir de la   reflexión  sobre  su  práctica  educativa  con  las  niñas  y  los  niños  de  primera  infancia  y    con  las  teorías  y  pedagogías  que  se  han  elaborado  hasta  el  momento,  a  lo  largo  de  la    historia,  como  lugar  de  referencia  para  las  opciones  que  toman  para  educarlos.  Sig-  nifica que la pedagogía es un saber que continúa construyéndose en la práctica coti-  diana, con los aportes y actualizaciones de maestras, maestros y agentes educativos. Si  se  entiende  la  pedagogía  como  ese  saber  que  orienta  y  recoge  la  educación,  lo   que  sucede  con  ella  y  la  reflexión  sobre  el  quehacer  de  quienes  educan,  bien  podría    decirse que una educación intencional, como la inicial, requiere de una pedagogía que   dé sentido a las prácticas de cuidado, acogida y promoción del desarrollo de las niñas   y los niños. En este sentido, las maestras, los maestros y los agentes educativos pue-  den servirse de sus experiencias educativas con la primera infancia para orientar sus   prácticas siguientes, al tiempo que reflexionan sobre su labor educativa para hacer sus   elaboraciones pedagógicas en clave de procesos.  Por  ello  se  afirma  que  la  pedagogía  es  un  saber  práctico,  cuyo  objeto  son  los  sis- temas  de  acción  característicos  de  las  situaciones  y  experiencias  educativas  que  se    renuevan con cada grupo de niñas y niños con el que la maestra, el maestro o el agente   educativo interactúa en contextos histórico-culturales particulares. La pedagogía es   el producto de una acción reflexiva y crítica acerca de la propia práctica, que se cons-  tituye en fundamento para la siguiente acción.   Existe una pedagogía infantil, configurada por el saber del que se dispone en la li- teratura sobre educación, que sirve para orientar a quienes están a cargo de las niñas   y los niños durante su infancia. Este saber está compuesto por teorías y experiencias   que  algunos  pedagogos  han  planteado  para  iluminar  la  educación  infantil.  Fröebel,    Montessori, Decroly, Malaguzzi, entre otros, pueden encontrarse entre los pedagogos   más influyentes, y sus ideas continúan siendo pertinentes para el desarrollo de la edu-  cación. Gracias a ellos se ha avanzado en la importancia que adquiere la interacción   afectiva, cálida, solidaria y confiada del adulto con niñas y niños.  En  esa  medida,  las  maestras,  los  maestros  y  los  agentes  educativos  requieren  ser   afectuosos,  tener  buena  escucha,  ser  observadores  sensibles,  sostén  y  acompaña-  miento de niñas y niños a través de la creación de escenarios, contextos, experencias    y  prácticas  cotidianas  que  permitan  el  goce  y  disfrute  de  las  actividades  rectoras  de    la  primera  infancia.  Así  mismo,  los  educadores  deben  favorecer  la  transmisión  del    acervo cultural de una generación a otra (Rodríguez de Pastorino, en Soto y Violante,  \nSentido de la educación inicial   ·  49  2008).  Esta  pedagogía  requiere  considerar,  como  punto  de  partida,  los  intereses  de    cada niña y cada niño para definir cómo lograr experiencias pedagógicas significativas   que contribuyan a su constitución como sujetos. Otro  elemento  valioso  que  encuentra  lugar  en  esta  pedagogía  es  el  contexto  y  su   diversidad,  de  manera  tal  que  las  diferencias  socioambientales  y  culturales  necesa-  riamente  deben  incorporarse  a  las  formas  de  comprender  a  las  niñas  y  los  niños  y    de postular acciones para promover su desarrollo integral. El  saber pedagógico de la    educación  inicial  incluye  valores,  cultura,  ideas  y  concepciones  que  influencian  las    interacciones  que  se  establecen  con  las  niñas  y  los  niños.  Pues  bien,  lo  dicho  acerca    del reconocimiento del contexto, la cultura, las características individuales de niñas y   niños, aspectos centrales de la educación inicial, aplica aquí para mencionar que aco-  gerlos implica la valoración genuina de su lugar, su ser, su propia realidad y su equipaje   cultural.    La  pedagogía  de  la  educación  inicial  requiere  continuar  un  camino  que  refiere  el   encuentro  que  ocurre  en  las  situaciones  educativas,  subrayar  la  presencia  del  otro    en  la  interacción,  mostrar  el  proceso  de  acogida  y  dar  lugar  a  lo  que  específicamen-  te permite que el otro se vaya construyendo como sujeto crítico, autónomo, libre, ca-  paz  de  valerse  por  sí  mismo,  con  un  lugar  en  el  mundo  social  y  cultural  que  habita.    En  palabras  de  B á rcena  y  Mélich,  “en  esta  aventura,  lo  que  quizás  aprendemos  es  a   disponernos,  a  ser  receptivos,  a  estar  preparados  para   responder   pedagógicamente  a    las demandas de una situación educativa en la que otro ser humano nos reclama y nos   llama” (2000: 162). \n50  ·    Serie de orientaciones pedagógicas para la educación inicial  En la educación inicial se reconocen las diferencias  Reconocer las diferencias implica mencionar a cada niña y cada niño de primera in-  fancia, pues, como se ha enfatizado, las características propias del desarrollo, los gus-  tos, las preferencias, los intereses y necesidades (que pueden derivarse de su contexto   social y cultural o de sus condiciones físicas) conforman un sinnúmero de particula-  ridades que enriquecen el trabajo cotidiano con ellas y ellos.  La  diversidad  es  una  realidad  compleja  que  no  se  reduce  a  ciertos  grupos  de  la   sociedad.  Además  de  la  diferencia  entre  grupos  (nivel  socioeconómico,  culturas,    género,  etc.),  existen  diferencias  individuales  dentro  de  cada  grupo  (capacidades,    intereses,  motivaciones,  concepciones  del  mundo)  y  al  interior  de  cada  individuo    (las personas van adquiriendo múltiples identidades a lo largo de la vida por la con-  vivencia de nuevas experiencias) (Blanco, 2009: 91). Existe  una  serie  de  diferencias  que  se  derivan  de  condiciones  y  situaciones  que   históricamente han generado desigualdad y vulneración de derechos, por ejemplo, la  edad, ser mujer, tener una discapacidad, pertenecer a un   grupo étnico, ser víctima del conflicto o provenir del área   rural.  Cabe  señalar  que  las  situaciones  de  vulneración    afectan  en  mayor  medida  a  la  primera  infancia,  siendo    necesario  actuar  con  oportunidad,  pertinencia  y  rele-  vancia durante este momento del ciclo vital.  El  desarrollo  de  sociedades  más  igualitarias  y  democráti-  cas  pasa  necesariamente,  pero  no  solo,  por  sistemas  edu-  cativos más justos que garanticen a toda la población, y no   solo  a  ciertos  grupos  sociales,  una  educación  de  calidad    desde  el  nacimiento  y  a  lo  largo  de  la  vida,  y  por  la  crea-  ción  de  centros  educativos  más  plurales  e  inclusivos  que    acojan y den respuesta a las necesidades de aprendizaje de   niños  de  diferentes  contextos  sociales  y  culturales  y  con    distintas capacidades y situaciones de vida, de manera que   la  educación  cumpla  con  una  de  sus  grandes  finalidades:    contribuir a la cohesión social y al sentido de pertenencia a   la sociedad (Blanco, 2012:  80). En este sentido, lo diferencial está en que algunas niñas  y  niños  pueden  tener  una  mayor  especificidad  y  requerir  ajustes  en  su  atención,  en    términos pedagógicos, didácticos, físicos, culturales y sociales, entre otros, y mayores   recursos  materiales  y  simbólicos  que  beneficien  a  todo  el  grupo.  No  se  trata  de  dise-  ñar  prácticas  educativas  y  pedagógicas  para  cada  niña  y  cada  niño,  sino  de  conjugar    la riqueza que deriva de las diferencias para enriquecer los procesos de desarrollo de  \nSentido de la educación inicial   ·  51  todas y todos, posibilitando la exploración, la recreación, la acción y la transformación   del mundo. Por ello, la maestra, el maestro y el agente educativo requieren revisar, con   alguna periodicidad, con qué niñas y niños interactúan más y con cuáles menos, pues-  to que es más fácil establecer más interacciones con los niños comunicativos que con   quienes pasan desapercibidos, son más callados o más tímidos (Paniagua, 2012).    Por tanto, la promoción del desarrollo de la primera infancia ha de contribuir a que  las inequidades encuentren solución en términos de cerrar las brechas, por lo cual se   plantean desafíos importantes para la educación inicial en términos de avanzar en el   establecimiento  de  caminos  posibles  para  atender  las  diferencias  individuales  que    configuran la singularidad de cada niña y cada niño: derivadas de las afectaciones del   conflicto armado, de género, culturales, étnicas y sociales, así como de niñas y niños   con discapacidad.  El reconocimiento de las diferencias entonces, no solo toma en cuenta la cultura  diversa que atraviesa al país, también considera la edad, el sexo, las particularidades   de cada individuo y las condiciones en las que viven las niñas, los niños y sus familias   (Comisión Intersectorial para la Atención Integral de la Primera Infancia, 2013: 105). A continuación se presentan aspectos importantes de cada una de las diferencias  mencionadas, con el fin de suscitar la reflexión y enriquecimiento del quehacer peda-  gógico.  \n52  ·    Serie de orientaciones pedagógicas para la educación inicial  Diferencias individuales en la educación de la primera infancia.  El ser humano, en   el transcurso de su desarrollo, construye de manera particular sus formas de ser, ver y   estar en el mundo, apropiándose de los aportes del medio y de los otros y conllevando a   que lo que podría ser común se individualice y se convierta en único e irrepetible. Las   diferencias individuales se hacen manifiestas en las niñas y los niños de primera in-  fancia y es necesario reconocerlas para propiciar su desarrollo, atendiendo a su parti-  cularidad. Así lo plantea la política pública de Atención Integral a la Primera Infancia: Los ritmos particulares de maduración permiten apreciar que no todos caminan  o  hablan  al  mismo  tiempo.  Mientras  unos  se  tambalean  otros  salen  corriendo,  hay    quienes incluyen las palabras para comunicarse y quienes aún no las utilizan. Algu-  nos  viven  en  zonas  rurales,  otros  en  grandes  ciudades,  y  sus  familias  se  componen    de maneras particulares. Lo mismo pasa con el rol de los adultos que les rodean, las   condiciones  son  distintas  (Comisión  Intersectorial  para  la  Atención  Integral  de  la    Primera Infancia, 2013: 105).  Para  la  educación  inicial  es  importante  promover  el  desarrollo  de  cada  niña  y  cada   niño reconociendo su heterogeneidad, producto de características únicas e irrepetibles   dadas por un desarrollo no homogéneo ni lineal y que se particulariza teniendo en cuen-  ta las capacidades y potencialidades; la actividad propia que cada una y cada uno impri-  me a sus procesos de interacción en este momento del ciclo vital. Las diferencias exis-  tentes no excluyen los patrones comunes del desarrollo que, de acuerdo con ciertas con-  diciones, situaciones y características cruzan a los grupos de niñas y niños en relación   con la edad, el contexto, la cultura, el medio y las acciones que promueven su desarrollo. \nSentido de la educación inicial   ·  53  Es importante considerar que en cuanto sujetos de derechos las niñas y los ni- ños  son  únicos,  singulares  e  irrepetibles.  Desde  el  nacimiento  experimentan  un    proceso de individualización y diferenciación que posibilita reconocer sus carac-  terísticas  particulares,  sus  propios  ritmos  y  estilos,  sus  gustos,  sus  distintas  ca-  pacidades,  cualidades  y  potencialidades.  Cada  quien  hace  su  propio  recorrido  de    vida  en  su  camino  por  el  ciclo  del  desarrollo  de  acuerdo  con  sus  características,    las  particularidades  que  ha  tenido  su  proceso  de  cuidado,  sus  interacciones  con    pares y adultos, las oportunidades que le han ofrecido sus entornos y contextos y   sus aprendizajes (Comisión Intersectorial para la Atención Integral de la Primera   Infancia, 2013: 104). Así,  la  diversidad,  evidente  en  la  niña  y  el  niño  desde  el  comienzo  de  la  vida,  se   constituye en desafío y oportunidad para quienes contribuyen a promover su desarro-  llo, así como para ellas y ellos.  Entre estas diferencias es importante tener en cuenta los acontecimientos socia- les,  políticos  y  económicos  que  influencian  a  una  determinada  generación  de  niñas    y  niños,  sus  historias  y  biografías  personales  como  miembros  de  la  sociedad,  de  una    familia, de una comunidad y de un grupo de pares, sus capacidades para asumir even-  tos  y  situaciones  con  autonomía,  su  posibilidad  de  opinar  sobre  los  sucesos  a  que  se    enfrentan en el día a día (elegir un cuento, un juego, con quien jugar, etc.) y el recono-  cimiento de la cultura de la cual hacen parte (valores y expresiones artísticas y musi-  cales, piezas musicales y obras de arte), entre otras.  En  otras  palabras,  la  diversidad  de  lo  humano  invita  a  quienes  trabajan  con  las   niñas y los niños de primera infancia a reconocer y promover diferentes maneras de   constituir  la  identidad  de  cada  una  y  cada  uno  como  sujeto.  El  reconocimiento  de  la    individualidad exige tratamientos diferenciales que permitan el goce y ejercicio de los   derechos, así como la generación de condiciones para hacer posible el principio de no   discriminación. En otras palabras,   una educación inicial inclusiva no es únicamente  la ausencia de exclusión: hace parte de reconocer y hacer de las diferencias individua-  les una práctica cotidiana, y dirigir los procesos educativos hacia la búsqueda de una   cohesión  social  necesaria  para  asegurar  el  bienestar  y  la  participación  activa  de  sus    miembros en condiciones de equidad, respeto y solidaridad.  Por ello, el seguimiento al desarrollo de las niñas y los niños se realiza teniendo en  cuenta  todas  estas  diferencias  y  en  ningún  caso  bajo  la  concepción  de  un  desarrollo    homogéneo  que  se  cumple  en  forma  idéntica  para  todas  y  todos.  De  esta  manera,  el    seguimiento  que  se  realiza  en  la  educación  inicial  da  cuenta  de  las  particularidades    individuales, pero también de la construcción grupal que configura el ser social.       Diferencias de género en la educación de la primera infancia.  Una de las diferencias   individuales que particulariza el desarrollo es la de género. El hecho de ser mujer o ser   hombre  configura  diferencias  en  la  vida  social  y  cultural,  además  de  que  esta  última    contribuye a enfatizarlas. Las relaciones de género tienen que ver con asuntos cultu-  rales diversos en cada uno de los contextos, en términos de poder e influencia de uno  \n54  ·    Serie de orientaciones pedagógicas para la educación inicial  de ellos (hombre o mujer) y participación de los beneficios de la sociedad. Se reconoce   que desde el punto de vista histórico y cultural la mujer ha sido influenciada y subor-  dinada por el poder ejercido por el hombre en la vida social y familiar. El  género,  que  es  asumido  también  como  una  perspectiva,  implica  un  principio  de   equidad al momento de distinguir a la mujer y al hombre, a la niña y el niño. Los derechos   humanos y los derechos de las niñas y de los niños rechazan toda forma de discrimina-  ción en función del género, en virtud de la dignidad de todos los sujetos. Por ello, para la   educación  inicial  es  importante  reconocer  que  estas  diferencias  existen,  pero  no  con-  ducen a estigmatizaciones, a discriminaciones o derivan en capacidades, sentimientos   o expresiones distintas; por ejemplo, que los niños no lloran o que solo las niñas juegan   con muñecas, o que los niños son mejores en las actividades físicas que las niñas.  Las diferencias de género, si bien existen entre la niña y el niño de primera infan- cia,  no  conducen  a  ningún  privilegio  ni  a  un  tratamiento  distinto  en  función  de  sus    capacidades y de sus posibilidades de desarrollo. Aunque la cultura plasma su huella   en estas diferencias, enfatizando determinadas creencias, comportamientos, hábitos,   sentimientos, valores, expectativas, formas de pensar y prácticas diferenciadas según   el sexo, ello no puede implicar, de ninguna manera, procesos de discriminación hacia   alguno de ellos.     El género no es igual al sexo. Este último se refiere a las diferencias anatómicas y  biológicas que distinguen a las mujeres y a los hombres, a las características genéticas   con  las  que  se  nace.  A  lo  largo  del  ciclo  vital  del  desarrollo  de  mujeres  y  hombres  se    hacen evidentes estas diferencias anatómicas; sin embargo, ser niña y ser niño es una   construcción social, cultural e ideológica que se logra a lo largo de la vida, siendo más  \nSentido de la educación inicial   ·  55  compleja  que  la  marcada  por  las  características  biológicas.  Por  ello  puede  afirmarse    que el género hace parte de la impronta de la cultura en el desarrollo humano. La edu-  cación inicial aporta a esta construcción de ser niña y ser niño con un trato equitativo,   sin estereotipos, que son los que distorsionan las realidades, discriminan y descono-  cen  los  derechos:  “desde  la  perspectiva  de  género  enfocada  a  la  atención  equitativa,    que evite el predominio de uno de los sexos sobre el otro y reconozca las singularida-  des en las maneras de crecer, madurar y desarrollarse” (Comisión Intersectorial para   la Atención Integral de la Primaria Infancia, 2013: 106). Para  la  educación  inicial,  las  niñas  y  los  niños  pueden  jugar  los  mismos  juegos  o   compartir los mismos juguetes, pues para ellas y ellos implica gusto, placer, explora-  ción, aprendizaje y muchas posibilidades de interacción que pueden establecer; pue-  den  realizar  las  mismas  actividades  y  contar  con  oportunidades  equitativas  para  su    desarrollo integral.   Diferencias culturales y étnicas en la educación de la primera infancia.  Es impor-  tante  considerar  la  diversidad  de  niñas  y  niños  en  razón  de  su  cultura,  pertenencia    étnica y origen. Colombia, de acuerdo con la Constitución de 1991, es un Estado social   de derecho que reconoce su condición pluriétnica y multicultural.  Cada grupo humano al que pertenecen las niñas y los niños al nacer tiene sus pro- pias  tradiciones,  valores,  creencias,  costumbres,  lenguajes,  expresiones  artísticas  y    saberes.  Los  grupos  étnicos  cuentan  con  una  serie  de  características  culturales  que    los definen como tal, que los hace comunidad y grupo y que les permite diferenciarse   de los otros; sus tradiciones, cosmovisiones y cosmogonías configuran prácticas cul-  turales que se instauran en la relación cotidiana con niñas y niños. Así, la variabilidad   cultural pone de manifiesto maneras distintas de vivir, pensar, actuar y sentir por par-  te de comunidades indígenas, afrocolombianas, raizal, palenquera y Rrom.  Cabe  señalar  que  las  diferencias  culturales  y  étnicas  no  deben  pensarse  desde  la   generación  de  escenarios  exclusivos  en  donde  solo  pueden  participar  las  niñas  y  los    niños pertenecientes al grupo étnico; por el contrario, la apuesta de la educación ini-  cial es por adelantar procesos interculturales que favorezcan el reconocimiento de sí   mismos  para  avanzar  en  el  reconocimiento  del  otro.  Los  planes  de  vida  construidos    por  cada  grupo  establecen  las  líneas  que  orientan  la  organización  propia,  el  pensa-  miento, la historia y las apuestas políticas relacionadas con el derecho a la tierra, a la   justicia, a la educación, a la salud, a hablar su lengua materna y a mantener sus usos y   costumbres.  En este sentido, es necesario que el quehacer pedagógico procure la garantía de los  derechos de existencia y pervivencia de las diferentes culturas, sin pretender homo-  genizar  o  imponer  la  cultura  occidental  como  la  hegemónica  o  dominante,  de  forma    tal que se permita el aprendizaje e intercambio de costumbres, prácticas, valores, sim-  bologías, normas y representaciones de mundo que configuran la identidad individual   y colectiva del grupo al que pertenece cada niña y cada niño.  Del  mismo  modo,  es  fundamental  comprender  que  las  prácticas  culturales  de  ni- ñas  y  niños  de  las  zonas  rurales  son  diferentes  a  las  prácticas  de  quienes  viven  en  el   \n56  ·    Serie de orientaciones pedagógicas para la educación inicial  contexto  urbano.  El  contacto  permanente  con  los  animales,  los  tiempos,  las  rutinas,    las distancias, la comida, entre otras, son características que configuran su forma de   comprender y representar el mundo y de estar en él.  Por  ello,  las  maestras,  los  maestros  y  los  agentes  educativos  deben    tener  presen- tes  las características culturales y étnicas, pues en sí mismas constituyen una riqueza   invaluable para la definición de las intencionalidades pedagógicas. Al mismo tiempo,   determinan  las  variaciones  que  quizás  puedan  darse  en  las  actividades  rectoras  de    la  infancia:  por  ejemplo,  la  exploración  del  medio  de  un  niño  campesino  es  diferen-  te a la del niño que nunca ha tenido contacto con animales como el caballo o la vaca.   Vale la pena recordar que las preguntas, intereses y gustos de niñas y niños se derivan   precisamente  de  las  situaciones  que  viven  en  su  cotidianidad;  por  ello  la  cultura  y  el    contexto  socio-ambiental  resultan  ser  fundamentales  para  planear  experiencias  pe-  dagógicas en la educación inicial.   Diferencias  sociales  en  la  educación  de  la  primera  infancia.   Las  características    propias de lo social y las condiciones de vida de la población, entre otros factores, in-  fluencian la socialización de las niñas y los niños e inciden en su desarrollo. Las condi-  ciones de pobreza y vulnerabilidad pueden introducir variaciones en el desarrollo de   las niñas y los niños de primera infancia, algunas veces debilitándolo y afectando las   adquisiciones que ellas y ellos podrían haber hecho en otras condiciones.  El  volumen  de  capital  social,  cultural  y  simbólico  con  que  cuentan  las  niñas  y  los   niños se relaciona con las condiciones más enriquecidas o menos enriquecidas de los   contextos sociales en relación con dichos capitales. Para la educación inicial es funda- \nSentido de la educación inicial   ·  57  mental este reconocimiento, pues permite proponer experiencias diversas que permi-  tan ampliar el universo y las oportunidades de las niñas y los niños, y así compensar,   de alguna manera, algunas inequidades sociales. . La educación inicial actúa en comunicación con las comunidades y las familias  y,  en  estos  casos,  se  torna  importante  reconocerlas  como  legítimas  interlocutoras,    con  saberes  por  aportar  en  el  proceso  de  educación  de  las  niñas  y  los  niños.  Impli-  ca  un  trabajo  de  construcción  conjunta  y  de  cooperación  horizontal  que  permite    aprendizajes  mutuos  y  el  intercambio  de  conocimientosy  experiencias.  Al  mismo    tiempo,  las  diferencias  sociales  ponen  de  manifiesto  la  necesidad  de  avanzar  en  el    establecimiento y garantía de condiciones de calidad en clave de derechos, pues solo   así  se  lograrán  mejores  y  mayores  condiciones  para  generar  oportunidades  para  el    desarrollo  integral  de  niñas  y  niños,  cerrando  las  brechas  sociales  que  existen  ac-  tualmente en el país.   Educación para la primera infancia diferencial e inclusiva frente a la discapaci-  dad.  Las niñas y los niños con discapacidad deben contar con escenarios favorables,   sin que sean relegados ni marginados de las oportunidades que la sociedad ofrece por   considerar  que  están  destinados  solo  a  espacios  terapéuticos.  En  la  educación  de  la    primera  infancia  es  fundamental  prestar  atención  a  la  potenciación  del  desarrollo    integral  de  las  niñas  y  los  niños  con  discapacidad,  teniendo  en  cuenta  que  sus  pares    son actores fundamentales en la promoción de aprendizajes y en el avance de su desa-  rrollo. Es una responsabilidad de las maestras, los maestros y los agentes educativos   propiciar  una  educación  inclusiva  que  permita  construir  una  generación  de  niñas  y    niños que conviven naturalmente con la diversidad.  Es importante destacar que la discapacidad no es una enfermedad ni tampoco de- termina limitaciones en el desarrollo humano de niñas y niños, se trata de una condi-  ción  que  configura,  junto  con  las  demás  características  de  cada  niña  y  cada  niño,  su    ser singular e individual. Generalmente las limitaciones son de corte ambiental, pues   no se cuenta con escenarios que favorezcan la accesibilidad y permanencia de niñas y   niños en el entorno de educación inicial, o de tipo cultural, pues existen muchos ima-  ginarios relacionados con lo que significa la discapacidad. Es  fundamental  avanzar  en  la  resignificación  de  la  discapacidad  como  condi- ción que no impide el potenciamiento de los procesos de desarrollo de niñas y niños   para  generar  otras  formas  de  trabajo  que  favorezcan  su  participación  activa  en  las    diferentes experiencias que proponen las maestras, los maestros y los agentes edu-  cativos.  Por  ejemplo,  si  en  el  grupo  hay  una  niña  con  discapacidad  visual,  se  puede    enriquecer  la  práctica  pedagógica  a  través  del  diseño  de  materiales  que  permitan    su  exploración  a  través  del  sentido  del  tacto,  fortalecer  la  descripción  como  meca-  nismo  para  incluirla  en  la  narración  de  un  libro-álbum  o  disponer  en  el  ambiente    elementos que permitan orientar su desplazamiento por el espacio. Así, todo el gru-  po  de  niñas  y  niños  alcanzará  mayores  desarrollos,  pues  no  solo  reconocerán  las    diferencias  y  las  valorarán,  sino  que  también  enriquecerán  su  lenguaje  a  través  de    dichas descripciones.  \n58  ·    Serie de orientaciones pedagógicas para la educación inicial  Educación  para  la  primera  infancia    diversa  para  las  afectaciones  de  la  violen-  cia.    La  educación  de  la  primera  infancia  no  es  ajena  a  las  situaciones  de  violencia  y   conflicto armado que vive el país. Las niñas y los niños pueden nacer y crecer en me-  dio de afectaciones producto de ese conflicto armado, tales como el desplazamiento,   la  desmovilización  y  reintegración,  el  secuestro,  la  desaparición  y  los  mismos  actos    violentos  que  los  afectan  a  ellas  y  ellos,  así  como  a    sus    familias,  los  miembros  de  la    comunidad y sus pares. Para la educación inicial implica un reto importante esta con-  sideración, que conduce a tomar en cuenta, de manera sensible, los sentimientos, las   experiencias y las huellas que estas situaciones hayan dejado en las niñas y los niños.   Es fundamental, entonces, construir caminos para acompañar y apoyar la superación   de experiencias traumáticas con los equipos de trabajo psicosocial, con otros actores   claves de la sociedad y con los agentes que hacen parte de la atención integral. De esta manera, no se trata de hacer de la práctica pedagógica un espacio de terapia  para la superación de las afectaciones, sino de que a través de esta se reconozcan las   historias de vida para generar escenarios que favorezcan su elaboración y la construc-  ción  de  otras  posibilidades  de  comprensión  y  significación  del  mundo.  Aquí  cobran    vital relevancia las historias de vida de las niñas y los niños, reconocer sus orígenes y   las situaciones que han enfrentado, así como sus sueños, sus gustos, sus intereses, sus   emociones y sus sentimientos con el fin de determinar la pertinencia de las intencio-  nalidades  pedagógicas.  Cabe  señalar  que  indagar  sobre  las  posibles  situaciones  que    hayan  sufrido  niñas  y  niños  no  es  una  práctica  adecuada,  pues  las  y  los  revictimiza,    impidiendo su elaboración y duelo; por lo cual se reitera la importancia de involucrar   activamente a un equipo psicosocial para adelantar procesos de acompañamiento que   permitan actuar efectivamente ante cada situación.   A manera de síntesis  Se afirma que la pedagogía es el saber teórico-práctico que orienta la acción edu-  cativa con niñas y niños de primera infancia. La particularidad de esta pedagogía   consiste en que contribuye a orientar la acción pedagógica con los presupuestos de   reconocer  las  diferencias  y  singularidades  de  la  primera  infancia  y  ser  pensada    con enfoque de derechos. Los principales asuntos que es necesario destacar y re-  cordar sobre este tema son los siguientes:  •\t   Las maestras, los maestros y los agentes educativos elaboran  el saber peda-  gógico mediante procesos de reflexión sobre su práctica pedagógica.   •\t   La  pedagogía  ha  de  orientar  una  educación  para  la  primera  infancia  que    reconoce como punto de partida los intereses de cada una de las niñas y los   niños,  se  fundamenta  en  las  interacciones  afectivas,  fomenta  escenarios,    contextos, actividades y experiencias favorecedores del desarrollo integral   y  posibilita  el  goce  y  disfrute  de  las  actividades  rectoras  de  la  primera  in-  fancia: juego, exploración del medio, literatura y expresión artística. \nSentido de la educación inicial   ·  59  •\t   La pedagogía para la primera infancia asume las diferencias, por lo cual con-  sidera y reconoce las características propias del desarrollo de cada niña y cada   niño, de su contexto social y cultural, de ser mujer u hombre o de sus condicio-  nes físicas. Todas estas particularidades enriquecen el trabajo cotidiano que   realizan  las maestras, los maestros y los agentes educativos. Se trata, enton-  ces, de diseñar prácticas pedagógicas que conjuguen la riqueza que deriva de   las diferencias para fortalecer los procesos de desarrollo de todas y todos, de tal   forma que se aporte a la creación de una sociedad más justa y equitativa.  •\t   La educación de la primera infancia reconoce las diferencias individuales   propias del ser humano, que es único e irrepetible, convirtiendo en un reto   el promover el desarrollo de cada niña y cada niño, reconociendo su hetero-  geneidad, al tiempo que se construye colectivamente, en esa diferencia, con   el aprendizaje y aporte de todas y todos.   •\t   La pedagogía para la primera infancia orienta una educación inicial en la   que se reconocen las diferencias de género que se encuentran instaladas en   la vida social y cultural y que pueden afectar negativamente la promoción   del desarrollo de niñas y niños, si se les discrimina de juegos, expresiones o   espacios por creencias que se tienen. Niñas y niños pueden participar por   igual de las ofertas de la sociedad y pueden aprender a hacerlo en este esce-  nario de reconocimiento mutuo.  •\t   Para la pedagogía de la primera infancia es un desafío orientar una educa-  ción inicial que reconoce las diferencias propias la cultura, la pertenencia   étnica  y  el  origen.  Estas  diferencias  expresan  maneras  distintas  de  vivir,    pensar, actuar y sentir de parte de comunidades indígenas, afrocolombia-  nas, raizal, palenquera y Rrom, de las cuales niñas y niños pueden apren-  der.  Igual  puede  decirse  de  las  diferencias  que  aporta  la  pertenencia  a  un    contexto rural o urbano.  •\t   La  pedagogía  de  la  primera  infancia  toma  en  cuenta  una  educación  inicial    que reconoce las diferencias presentes en la sociedad, que se originan en las   condiciones  sociales  y  económicas  de  la  población,  y  procura  que  estas  no    afecten el ingreso de la niña y el niño a la sociedad y su participación en ella.   •\t   La pedagogía de la primera infancia orienta una educación inicial que pro-  cura escenarios favorables para las niñas y los niños con discapacidad, en   la que los pares contribuyen a su desarrollo y la discapacidad no se consi-  dera una limitante.  •\t   La pedagogía para la primera infancia no es ajena a la problemática de   conflicto y violencia que vive el país y a las repercusiones que ello provoca   en el desarrollo de la primera infancia. Por tanto, propone un trabajo de   acompañamiento y apoyo a las niñas y los niños que han padecido estos   sufrimientos, en colaboración con los equipos psicosociales necesarios y   adecuados para ello. \n60  ·    Serie de orientaciones pedagógicas para la educación inicial  La educación inicial como parte de la atención integral a la primera infancia  La atención integral se propone como un compromiso del Estado con  los terri-  torios para promover y garantizar el desarrollo infantil de las niñas y los niños   desde  su  gestación  hasta  cumplir  los  6  años,  mediante  un  trabajo  unificado  e    intersectorial que, desde la perspectiva de derechos y con un enfoque diferen-  cial, garantice las condiciones humanas, sociales y materiales que lo hacen po-  sible. En este marco, el cuidado, la crianza y la educación inicial son dos de los   estructurantes de la atención integral a la primera infancia que acontecen, con   preferencia,  en  los  entornos  hogar  y  educativo  respectivamente:  la  primera,  a    cargo de la familia o quienes cumplen su rol, y la segunda, a cargo de maestras,   maestros y agentes educativos.  En el entorno hogar se cuida y cría a las niñas y los niños, pero no se realiza  la educación inicial, ya que si bien su acción hacia ellas y ellos —intencional o   no— se realiza con una carga afectiva importante, a través de la cual se enseñan,   transmiten e incorporan los principales valores, hábitos, formas de ver y de vi- \nSentido de la educación inicial   ·  61  vir el mundo cultural y social propio de las familias y de la comunidad que los rodea,   ello  no  procede  con  arreglo  a  saberes  con  un  nivel  de  especialidad,  que  se  recogen  y    sistematizan  para  dotar  de  intención  las  acciones,  de  manera  que  se  potencien  inte-  gralmente los procesos de desarrollo de las niñas y los niños. Los saberes propios de   la educación familiar son fundamentalmente afectivos y, entonces, más espontáneos,   naturales, intuitivos y populares; no son saberes pedagógicos.  La  educación  inicial  es  inherente  a  la  atención  integral  y,  de  manera  específica,   aporta al propósito del desarrollo infantil desde los conocimientos, saberes y prácticas   de quienes interactúan directamente con las niñas y los niños, a través de estrategias y   experiencias intencionadas que se fundamentan en un conocimiento pedagógico que   existe para ello. Así las cosas, la educación inicial, junto con el cuidado, la crianza, la   salud, la alimentación, la nutrición, la recreación, el ejercicio de la ciudadanía y la par-  ticipación configuran lo que la política pública reconoce como la atención integral a la   primera infancia. La atención integral, reconocida como la forma a través de la cual los actores res-  ponsables de garantizar el derecho al pleno desarrollo de las niñas y niños en pri-  mera  infancia  materializan  de  manera  articulada  la  protección  integral,  implica    dar  pasos  significativos,  coherentes  y  consistentes  hacia  la  definición  colegiada    de  los  estructurantes  que  la  configuran  y  organizarse  para  garantizar  que  las  ac-  ciones  de  los  involucrados  concurran  en  torno  a  cada  niña  y  cada  niño,  de  forma    pertinente,  oportuna,  flexible,  diferencial,  continua,  complementaria  y  con  cali-  dad  (Comisión  Intersectorial  para  la  Atención  Integral  de  la  Primera  Infancia,    2013: 95). En esta línea de reflexión, si bien la educación inicial contribuye a la garantía del  desarrollo integral de las niñas y los niños de primera infancia, no es el único entor-  no ni el único estructurante que lo posibilita. Por ello, la educación inicial convoca al   trabajo articulado con distintos sectores y profesionales que tienen que ver directa e   indirectamente  con  el  desarrollo  de  las  niñas  y  los  niños,  quienes  con  su  diversidad    de  saberes  ejercen  influencia  sobre  ellas  y  ellos  y  su  desarrollo.  De  manera  directa,    se trata del conjunto de profesionales y personas que tienen bajo su responsabilidad   el cuidado y la atención de las niñas y los niños a lo largo de su trayectoria de vida, en   cualquier momento y en distintos entornos y sectores; son los agentes educativos y de   salud  y  todas  las  demás  personas  que  brindan  atenciones  en  esos  diversos  entornos.    Así lo plantea la Estrategia Nacional para la Atención Integral a la Primera Infancia:   “Es el caso de médicos, pediatras, maestros, terapeutas, profesionales de las ciencias   sociales, educativas y de la salud, así como madres comunitarias y agentes educativos   y culturales de los territorios” (Comisión Intersectorial para la Atención Integral de la   Primera Infancia, 2013: 262). Por último, los sectores y profesionales que se relacionan indirectamente con ni- ñas y niños de primera infancia son quienes planean, diseñan y toman decisiones en  \n62  ·    Serie de orientaciones pedagógicas para la educación inicial  torno a las políticas públicas para la primera infancia, quienes pertenecen a los equi-  pos técnicos de las instituciones y entidades y quienes apoyan la implementación de   las políticas a través de la generación de mejores condiciones para la atención integral   de las niñas y los niños. Estos actores son fundamentales, pues son quienes posibilitan   la generación de mayores y mejores condiciones para el logro de la atención integral   de niñas y niños en los territorios, siendo entonces necesaria su relación permanente   y oportuna con las modalidades de educación inicial.   A manera de síntesis   La educación inicial: :  •\t   Es un proceso intencional para promover el desarrollo de las niñas y los niños   menores de seis años mediante acciones interrelacionadas e intersectoriales   que vinculan, desde el ejercicio de educar, a los diferentes actores que se en-  cargan de esta función (maestras, maestros y agentes educativos). Es inten-  cional porque es sistemática, estructurada y planeada. Ello significa que las   acciones propuestas por las maestras, los maestros y los agentes educativos   no surgen espontáneamente o al azar, sino que se vinculan a propósitos e in-  tenciones formativas, se organizan, se disponen, se revisan, se reflexionan y,   en esta medida, se considera su pertinencia, oportunidad y calidad para los   propósitos formativos de las niñas y los niños.  •\t   Toma  en  consideración  a  la  niña  y  al  niño  como  sujetos  activos  y  partici-  pativos de su propio desarrollo, reconoce la diversidad de formas en que ese   desarrollo se construye, así como las capacidades y potencialidades que po-  seen y con base en las cuales han de ser educados.   •\t   No  se  confunde  con  la  crianza,  pero  entre  más  pequeños  son  la  niña  y  el    niño,  mayor  es  la  necesidad  de  integrar  la  función  de  cuidado,  acogida    y     educación.  •\t   Implica  procesos  de  acogida  y  cuidado  —de  hospitalidad—  a  través  de  los    cuales,  quien  educa,  reconoce  al  otro  en  su  diferencia  y  singularidad  y  se    vincula con él de manera responsable para potenciar desde allí su desarro-  llo.  •\t   Es un estructurante de la atención integral a la primera infancia, ocurre   en el entorno educativo, está a cargo de maestras, maestros y agentes   educativos y se propone como un compromiso del Estado los territorios   para promover y garantizar el desarrollo infantil de las niñas y los niños   desde su gestación hasta cumplir los seis años. La caracteriza un trabajo   unificado e intersectorial que, desde la perspectiva de derechos y con   un enfoque diferencial, garantiza la articulación de las acciones de los   involucrados en torno a cada niña y cada niño.  \nSentido de la educación inicial   ·  63  ¿Para qué educar en la primera infancia?  Con  base  en  los  aportes  de  la  literatura  actual  sobre  el  desarrollo  infantil  de  la  pri-  mera  infancia,  puede  afirmarse  que  es  un  momento  crucial  en  la  vida  de  las  perso-  nas. Durante los primeros años se configuran las relaciones emocionales y afectivas,   el  desarrollo  neurológico  y  físico,  la  interacción  con  el  mundo  exterior  y  los  otros,  la    construcción de la identidad y el desarrollo de la autonomía de las niñas y los niños.   También es posible deducir de estos estudios la importancia que tienen los adultos en   la promoción de estos aprendizajes. Su acompañamiento y ayuda resultan fundamen-  tales para hacer de la construcción de la subjetividad e identidad de niñas y niños un   proceso soportado en la protección y garantía de sus derechos.  De esta forma, las maestras, los maestros y los agentes educativos son los encarga- dos de favorecer el potenciamiento de sus capacidades y, al mismo tiempo, de generar   mejores y mayores oportunidades para su desarrollo integral, en consonancia con las   características e intereses propios, de sus familias y contextos.  En  este  sentido,  educar  a  la  primera  infancia  se  constituye  en  una  posibilidad  de   propiciar  un  sinnúmero  de  experiencias  que  les  permita  comprender  y  significar  el    mundo desde la diversidad que lo constituye. Reconocer, por ejemplo, la riqueza que   emana  de  las  diferencias  manifiestas  en  un  grupo  de  niñas  y  niños  de  dos  años,  en    donde  además  de  las  particularidades  derivadas  de  sus  ritmos  de  desarrollo,  intere-  ses, gustos y preferencias es posible encontrar características culturales relacionadas  \n64  ·    Serie de orientaciones pedagógicas para la educación inicial  con  la  pertenencia  o  no  a  un  grupo  étnico,  la  procedencia  (rural  o  urbana)  y  la  con-  formación  familiar,  entre  otras.  Todas  estas  diferencias  dotan  de  sentido  la  práctica    educativa y enriquecen las posibilidades pedagógicas para avanzar en la construcción   de relaciones equitativas, justas y democráticas, al tiempo que permite el intercambio   cultural y la resignificación de la propia realidad. Así, a través de los procesos que se adelantan en la educación inicial, las niñas y los  niños  de  primera  infancia  disfrutan  de  experiencias,  escenarios  y  ambientes  que  los    convocan a la construcción y el reconocimiento de sí mismos y de los otros, desde sus   capacidades  y  posibilidades  y  no  desde  sus  dificultades.  Por  ejemplo,  es  común  que    una niña o un niño con discapacidad no sea considerado por las demás niñas y niños   del grupo como alguien “especial” o con limitaciones, sino que reconocen en ella o él   sus  diferencias  en  las  formas  de  relación  y  desde  allí  construyen  subjetividades  que    favorecen el desarrollo de sus capacidades y habilidades en la cotidianidad; quizás le   pregunten sobre su condición, porque sienten curiosidad, pero no lo  consideran como   carente.  De  igual  manera,  la  educación  inicial  favorece  el  desarrollo  de  la   participación  infantil,  proceso fundamental en la formación de sujetos críticos, reflexivos, recono-  cedores,  propositivos,  innovadores  y  transformadores.  Del  mismo  modo,  potencia  la     autonomía  como proceso que permite el desenvolvimiento libre, espontáneo y seguro   de niñas y niños en los entornos en los que trascurre su vida; promueve la  creatividad    para resolver los problemas que se puedan presentar en su cotidianidad, para definir   diferentes  alternativas  y  actuar  en  una  situación,  para  crear  y  resignificar  su  propia    realidad, para inventar nuevas formas de actuar y estar. Desarrolla también capacida-  des para  comunicar  sus ideas, preguntas, comprensiones, construcciones, etc.  \nSentido de la educación inicial   ·  65  A manera de síntesis  Cabe señalar que las capacidades y procesos mencionados son determinantes en   la transformación social y cultural del país. Por ello, educar en la primera infan-  cia no solo se trata de un acto pedagógico, sino que conlleva claridades y compro-  misos políticos, sociales y culturales frente a la niña y el niño que se desea formar.   De esta manera, la educación inicial reconoce que:   •\t   Las niñas y los niños son sujetos de derechos y, en esta medida, protagonis-  tas  de  su  propio  desarrollo.  Para  la  educación  inicial  ello  implica  propiciar    y garantizar relaciones y experiencias que favorezcan la construcción de la   identidad, el desarrollo de la autonomía y la participación activa y genuina   de las niñas y los niños para dinamizar, incidir, construir, recrear y apropiar   las características del contexto en el que se desenvuelven. En este sentido, a   través de los procesos educativos, niñas y niños deben visibilizarse mediante   una atención pertinente, oportuna y de calidad que contribuya a su desarro-  llo integral.  •\t   Los  primeros  seis  años  de  vida  del  ser  humano  son  determinantes  en  su    desarrollo posterior. Como lo muestran investigaciones recientes, durante   este  momento  del  ciclo  vital  ocurren  procesos  críticos  relacionados  con  la    formación  de  la  inteligencia,  el  desarrollo  de  la  personalidad,  el  estableci-  miento de vínculos afectivos y la generación de conductas sociales.   •\t   Educar en la primera infancia contribuye a la disminución de la desigual-  dad e inequidad a través del mejoramiento de la calidad y las posibilidades   de acceso y permanencia de niñas y niños en el sistema educativo.   •\t   Invertir en programas y proyectos que benefician a las niñas y los niños   en la primera infancia tiene un retorno económico mayor que aquellos   realizados en otros momentos de la vida del ser humano, evitan problemas   severos en la adolescencia (y a lo largo de la vida) que requieren altas   inversiones y traen consigo altos costos sociales.  ¿Quiénes participan en la educación inicial?  Hacen parte fundamental y directa de la educación inicial las niñas y los niños de pri-  mera infancia, las familias, las maestras, los maestros, los agentes educativos y en ge-  neral  todo  el  talento  humano  que  integra  el  equipo  de  trabajo  de  las  modalidades  de    educación inicial, pues cada uno desde el rol que asume aporta al desarrollo integral   de las niñas y los niños.    Las niñas y los niños  son los actores principales de la educación inicial, pues a tra- vés  de  su  participación,  del  reconocimiento  de  sus  características  particulares,  in-  tereses,  gustos,  preferencias  y  necesidades  se  planean  y  organizan  las  acciones  que   \n66  ·    Serie de orientaciones pedagógicas para la educación inicial  buscan su desarrollo integral. Se destaca lo significativo que resulta para ellas y ellos   sentirse  reconocidos,  valorados  y  tomados  en  cuenta,  y  procurar  las  oportunidades    para que participen activamente en su proceso educativo, tal y como les corresponde   desde la perspectiva de derechos. Esta actitud y sensibilidad hacia la primera infancia   les permite desplegar sus capacidades y confiar en sus posibilidades para construir y   definir su singularidad.   Las  familias,   por  su  parte,  se  vinculan  a  la  educación  inicial  aportando  saberes  y   prácticas para que la tarea educativa se potencie con la articulación de lo que se hace   en el entorno hogar y lo que se lleva a cabo en el entorno educativo. No puede olvidarse   el papel fundamental de la familia en la educación de las niñas y los niños a través del   cuidado,  la  crianza  y  la  socialización  durante  la  primera  infancia.  Su  inserción  en  la    cultura pone de presente la necesidad de conocerla para entender las maneras parti-  culares como se inscribe en la sociedad, las formas de relación que entabla en su seno,   lo  propio  de  sus  pautas  y  prácticas  de  crianza,  los  valores,  creencias  y  experiencias    sobre los diversos aspectos que involucran la incidencia en el desarrollo de la primera   infancia  (concepción  de  niño  y  niña  y  de  su  desarrollo,  roles  en  el  cuidado  y  crian-  za, idea de autoridad, diferencias de género, hábitos y manejo de la enfermedad, entre   otras muchas).  De esta manera, valorar su papel y conectarlo con el de los actores que se encargan  de la educación inicial permite disponer de un acervo social, cultural y simbólico de gran   beneficio para el desarrollo infantil. Allí es donde, precisamente, cobra vital relevancia   la relación de la educación inicial con las familias, pues a través de esta se logra avanzar  \nSentido de la educación inicial   ·  67  en el fortalecimiento de su papel socializador, de cuidado y de crianza desde el recono-  cimiento de lo que saben y hacen, comprendiendo su historia y posibilitando la genera-  ción de nuevas perspectivas para relacionarse con sus hijas e hijos y  resignificando su   actuaciones y prácticas de crianza para  así contribuir a su desarrollo integral.   Las maestras, los maestros y los agentes educativos  que   acogen a las niñas y los ni- ños son los encargados de la educación con intencionalidades claras para promover su   desarrollo integral. Son actores fundamentales para la educación inicial, pues tienen   bajo su responsabilidad y compromiso mediar entre las herramientas de la cultura y   las capacidades de ellas y ellos para potenciar su desarrollo. De estos actores se espera   el establecimiento de vínculos de apego seguros,  relaciones de confianza y de acogida   mediante una interacción permanente con cada una de las niñas y los niños y con el   grupo.  Todos  los  procesos,  actividades  y  acciones  desarrollada  por  las  maestras,  los    maestros y los agentes educativos son fundamentales para la promoción del desarro-  llo infantil, ya que definen caminos y rutas posibles para el potenciamiento del desa-  rrollo de las niñas y los niños en primera infancia.  Para  la  maestra,  el  maestro  y  el  agente  educativo  es  prioridad  dejar  a  un  lado  sus    prejuicios  para  abrirse  al  encuentro  con  la  diversidad  que  se  le  presenta  al  encarar    la  situación  educativa.  Este  encuentro  entre  iguales,  en  dignidad  y  en  derecho,  es    también un encuentro asimétrico, intergeneracional, que ha de tener la capacidad de   transmutarse en igualdad a través de la capacidad del educador de descentrarse y aco-  ger la experiencia del otro, de cada niño y niña en su expresión individual y colectiva.   Las maestras, los maestros y los agentes educativos son actores claves en la educa- ción inicial porque, a través de su saber pedagógico, configuran prácticas educativas   coherentes, oportunas y pertinentes de acuerdo con las características de las niñas y   los niños; al mismo tiempo, hacen posible el potenciamiento del desarrollo infantil, no   solo desde la definición de diferentes experiencias cotidianas en las que las niñas y los   niños participan, sino que también convocan a las familias, favoreciendo la compren-  sión  y  resignificación  del  sentido  que  cobran  sus  pautas  y  prácticas  de  crianza  en  el    desarrollo de sus hijas e hijos.  Por  otra  parte,  el  intercambio  entre  maestras,  maestros  y  agentes  educativos  se   constituye en una oportunidad para avanzar en el análisis y retroalimentación de las   acciones pedagógicas. Al reflexionar sobre la práctica, en cuanto a lo que se hace y se   sabe,  pueden  decidir  y  proponer  prácticas  innovadoras,  cualificadas  y  con  sentido    para fortalecer su trabajo en relación con las niñas, los niños y sus familias.  De esta manera, la cualificación permanente de quienes se encargan directamente  de  la  educación  de  las  niñas  y  los  niños  de  primera  infancia  es  fundamental,  pues  la    ref
