   c  o l o m b i a   2014  i s b n    9 7 8 9 5 8 6 9 1 6 2 5 7   Esta serie de orientaciones pedagógicas para la educación inicial retoma elementos del documento   base para la construcción del lineamiento pedagógico de educación inicial del Ministerio de   Educación Nacional, 2012. Así mismo, desarrolla lo expuesto en el documento “Estrategia de   Atención Integral a la Primera Infancia. Fundamentos Políticos, Técnicos y de Gestión” elaborado   por la Comisión Intersectorial de Primera Infancia, 2013.   El contenido parcial de este documento puede ser usado, citado y divulgado siempre y cuando se   mencione la fuente y normas de derechos de autor.  La reproducción total debe ser autorizada por   el Ministerio de Educación Nacional  La versión digital de este documento se encuentra en www.mineducacion.gov.co y en   http:/www.colombiaaprende.edu.co/primerainfancia  La serie de orientaciones pedagógicas para la educación inicial se desarrolló en el marco del   Convenio de Asociación 529 de 2013 “Alianza Público Privada de Impulso y Sostenibilidad de la   Política Pública de Primera Infancia”    \nm i n i s t e r i o     d e     e d  U  c a c i ó n     n a c i o n a l   Ministra  María Fernanda Campo Saavedra  V  i c e m i n i s t e r i o      d e     p r e e s c o l a r  ,    b á s i c a    Y    m e d i a   Viceministro  Julio Salvador Alandete Arroyo  d i r e c c i ó n     d e     p r i m e r a     i n fa n c i a   Directora  Ana Beatriz Cárdenas Restrepo  s  U  b d i r e c c i ó n     d e     c a l i d a d     p r i m e r a     i n fa n c i a   Subdirectora  Claudia Milena Gómez Díaz  e  Q U  i p o     t  É  c n i c o     Profesionales especializados  Doris Andrea Suárez Pérez Hellen Maldonado Pinzón  e s p e c i a l i s ta    Q U  e     e l a b o r a r ó     e l     d o c  U  m e n t o      b a s e     pa r a     e s ta     o r i e n ta c i ó n  :   Marina Camargo Abello \nr e t r o a l i m e n ta c i ó n     a l     d o c  U  m e n t o  :   c o m i s i ó n     i n t e r s e c t o r i a l     d e     p r i m e r a     i n fa n c i a     Coordinadora  Constanza Liliana Alarcón Párraga  i n s t i t  U  t o     c o l o m b i a n o     d e     b i e n e s ta r     fa m i l i a r   Subdirección de Gestión Técnica para la Atención de la Primera Infancia  María Consuelo Gaitán Clavijo  e  s p e c i a l i s ta s    Q U  e    a  p o rta r o n   a l   d o c  U  m e n t o :   Adriana Carolina Molano · Adriana Lucía Castro Ana Beatriz Cárdenas · Carolina Turriago  Claudia Milena Gómez · Doris Andrea Suárez Graciela María Fandiño · Juan Carlos Amador Hellen Maldonado · Marieta Quintero Rafael Cano Ramírez · Yolanda Reyes \nUn recorrido por la historia de la educación de la primera infancia   .................... 13  De asistir a educar   .............................................................................................................. 14  Primer momento: hospicios, asilos y orígenes de los jardines infantiles   ............................ 15 Segundo momento: expansión y desarrollo de la educación preescolar    ............................. 24 Tercer momento: la construcción del concepto de educación inicial    .................................. 31  La educación inicial: marco general   ............................................................................ 39    ¿Qué es la educación inicial?   ......................................................................................................... 42    ¿Para qué educar en la primera infancia?   ................................................................................. 63    ¿Quiénes participan en la educación inicial?   .......................................................................... 65    ¿Qué procesos otorgan sentido a la educación inicial?   ....................................................... 69    ¿Cuáles son los espacios en los que acontece la educación inicial?   ............................... 75    ¿Qué se enseña y qué se aprende en la educación inicial?   ................................................. 77          ¿Cómo se organiza el trabajo pedagógico en la educación inicial?   ................................. 80  Para terminar   .................................................................................................................. 82 Bibliografía    ...................................................................................................................... 86  Tabla de contenido \n\nCarta de la ministra  Creemos que las condiciones están dadas como nunca para el cambio   social, y que la educación será su órgano maestro. Una educación,   desde la cuna hasta la tumba, inconforme y reflexiva, que nos inspire   un nuevo modo de pensar y nos incite a descubrir quiénes somos en   una sociedad que se quiera más a sí misma. [...] Por el país próspero y   justo que soñamos: al alcance de los niños.   Colombia al filo de la oportunidad   Gabriel García Márquez   El Ministerio de Educación Nacional, en el marco del Plan Sectorial 2010-2014   Educación de Calidad, el Camino para la Prosperidad, plantea que la educación   debe ser una oportunidad que se brinda a todas y todos los colombianos a lo   largo de la vida, comenzando por las niñas y los niños en primera infancia, a   través de los procesos de educación inicial en el marco de la atención integral.  Desde el 2010 nos hemos comprometido y hemos participado del trabajo  intersectorial en la construcción e implementación de la Estrategia Nacional de   Atención Integral a la Primera Infancia De Cero a Siempre. El horizonte de esta   apuesta conjunta ha sido promover el desarrollo integral de las niñas y los niños   desde una perspectiva de derechos y bajo un enfoque diferencial. “1, 2, 3, por la educación inicial, me la juego esta vez”, es la apuesta y com- promiso que ha desarrollado el Ministerio de Educación Nacional para avanzar   en la construcción de la línea técnica de la educación inicial, definida como un   derecho impostergable de la primera infancia y como una oportunidad clave   para el desarrollo integral de las niñas y los niños, para el desarrollo sostenible   del país y como primer eslabón que fortalece la calidad del sistema educativo   colombiano.  En este sentido, y en respuesta a ese gran compromiso de orientar la política  educativa, el Ministerio de Educación Nacional hace entrega al país de la línea   técnica para favorecer el desarrollo e implementación de la educación inicial en   el marco de la atención integral de manera pertinente, oportuna y con calidad, a   través de los referentes técnicos. La construcción de estos referentes es el producto   de múltiples ejercicios participativos, donde las diferentes regiones del país y los   diversos actores retroalimentaron los documentos que presentamos.  \nLos doce referentes técnicos de educación inicial en el marco de la atención  integral se agrupan de la siguiente forma:  •\t   La serie de orientaciones pedagógicas está compuesta por seis docu- mentos en los que se define el sentido de la educación inicial y se dan   elementos conceptuales y metodológicos para fortalecer el trabajo de   los agentes educativos.   •\t   La serie de orientaciones para favorecer la calidad de la educación inicial   en el marco de la atención integral agrupa cinco documentos en los que   se encuentran los referentes descriptivos que guían la gestión de la calidad   de las modalidades de educación inicial y las condiciones de calidad   de cada modalidad, así como las orientaciones y guías técnicas para el   cumplimento de las condiciones de calidad.   •\t   Por último, encontramos el referente técnico para la cualificación del   talento humano que brinda atención integral a la primera infancia. Estos documentos y guías se convierten en herramientas fundamentales para  promover el mejoramiento de la calidad de la educación inicial en el marco de   la atención integral y están a disposición para ser apropiados de acuerdo con   las condiciones y particularidades de los distintos contextos que caracterizan la   diversidad del país, de manera que se despliegue, en consonancia con estos,   una movilización que fortalezca la educación que brindamos a nuestras niñas y   niños en primera infancia, desde una perspectiva inclusiva, equitativa y solidaria. Para materializar esta apuesta, les invito a que desde su conocimiento y  experiencia doten de sentido estos referentes en tanto son documentos abiertos   que estarán en permanente revisión y actualización, dado que la pedagogía es   un saber en construcción. Las niñas y los niños en primera infancia son el presente de Colombia y tene- mos la valiosa oportunidad de promover mejores condiciones para que crezcan   en entornos educativos en los que sean reconocidos como sujetos de derecho,   seres sociales, singulares y diversos; es también la oportunidad de contribuir,   desde las acciones educativas, a la formación de ciudadanos participativos,   críticos, autónomos, creativos, sensibles, éticos y comprometidos con el entorno   natural y la preservación de nuestro patrimonio social y cultural.  Por ello invito al país a que se la juegue esta vez por la educación inicial, con  la implementación y apropiación de esta línea técnica.  ¡1, 2, 3, por la educación inicial, Colombia se la juega esta vez!  Ministra de Educación Nacional  María Fernanda Campo Saavedra  \nDurante los últimos quince años Colombia ha venido afianzando procesos para hacer que   la primera infancia ocupe un lugar relevante en la agenda pública, lo cual ha derivado   en la consolidación de una política cuyo objetivo fundamental ha sido la promoción del   desarrollo integral de las niñas y los niños menores de seis años. Esta política se expresa   en atenciones, ofertas de programas y proyectos que inciden en la generación de mejores   condiciones para las niñas, los niños y sus familias en los primeros años de vida, constitu- yéndose en una gran oportunidad de avance integral para ellas y ellos y para el desarrollo   sostenible del país.  Desde el año 2009, el Ministerio de Educación Nacional, mediante la formulación  de la Política Educativa para la Primera Infancia, abrió un camino para visibilizar y trazar   acciones que buscan garantizar el derecho que tienen todas las niñas y los niños menores   de seis años a una oferta que permita el acceso a una educación inicial de calidad.  Actualmente, el Ministerio de Educación Nacional asume y desarrolla la línea técnica  de la educación inicial, desde el marco de la atención integral, como un derecho imposter- gable y como uno de los estructurantes de la atención integral, de acuerdo con lo previsto   en el marco de la Estrategia Nacional para la Atención Integral a la Primera Infancia De   Cero a Siempre, desde la cual se viene impulsando un conjunto de acciones intersectoria- les y articuladas que están orientadas a promover y garantizar el desarrollo integral de la   primera infancia desde un enfoque de derechos, el cual se constituye en un horizonte de   sentido para asegurar que cada niña y cada niño cuente con las condiciones necesarias   para crecer y vivir plenamente su primera infancia.  Este proceso de construcción de la línea técnica tomó como referencia el reconocimiento  de aquellos aspectos que han configurado la educación de las niñas y los niños a lo largo   de la historia, las experiencias de las maestras, maestros, madres comunitarias y demás   agentes educativos que han aportado en la formación inicial de los ciudadanos colombia- nos, las apuestas de las entidades territoriales y de los grupos étnicos, así como los aportes   de las investigaciones que se han adelantado desde las organizaciones académicas.  Con el propósito de construir un consenso sobre el sentido de la educación inicial se  adelantó en todo el país un proceso de discusión del documento base que esbozaba el   enfoque y las apuestas en términos del trabajo pedagógico. En este proceso participaron   más de cuatro mil personas, actores clave vinculados a la educación inicial y de otros   sectores con quienes se realizaron conversatorios y debates presenciales y virtuales en los   que se retroalimentó el documento. Estos ejercicios de participación también impulsaron   iniciativas de algunas entidades territoriales y de instituciones de educación superior que   organizaron escenarios de discusión que aportaron a toda esta construcción conjunta. En este marco se define la educación inicial como derecho impostergable de la primera  infancia, que se constituye en elemento estructurante de una atención integral que busca   potenciar, de manera intencionada, el desarrollo integral de las niñas y los niños, partiendo   Introducción \ndel reconocimiento de sus características y de las particularidades de los contextos en   que viven y favoreciendo, al mismo tiempo, las interacciones que se generan en am- bientes enriquecidos a través de experiencias pedagógicas y prácticas de cuidado. Asumir la educación inicial como un estructurante de la atención integral a la  primera infancia implica reconocer la existencia de un entramado de elementos que   configuran el desarrollo integral del ser humano en estos primeros años de vida, razón   por la cual las acciones de educación inicial, en el marco de la atención integral,   están configuradas por los elementos de salud, nutrición y alimentación, además de   los aspectos vinculados al desarrollo de las capacidades de las niñas y los niños, los   comportamientos, las relaciones sociales, las actitudes y los vínculos afectivos, princi- palmente. Mientras la educación preescolar, básica y media organiza su propuesta   a través de la enseñanza de áreas específicas o del desarrollo de competencias en   matemáticas, ciencias naturales y sociales, entre otros, la educación inicial centra su   propuesta en el desarrollo y atención de la primera infancia.  En la educación inicial, las niñas y los niños aprenden a convivir con otros seres  humanos, a establecer vínculos afectivos con pares y adultos significativos, diferentes   a los de su familia, a relacionarse con el ambiente natural, social y cultural; a cono- cerse, a ser más autónomos, a desarrollar confianza en sí mismos, a ser cuidados y a   cuidar a los demás, a sentirse seguros, partícipes, escuchados, reconocidos; a hacer   y hacerse preguntas, a indagar y formular explicaciones propias sobre el mundo en   el que viven, a descubrir diferentes formas de expresión, a descifrar las lógicas en las   que se mueve la vida, a solucionar problemas cotidianos, a sorprenderse de las posi- bilidades de movimiento que ofrece su cuerpo, a apropiarse y hacer suyos hábitos de   vida saludable, a enriquecer su lenguaje y construir su identidad en relación con su   familia, su comunidad, su cultura, su territorio y su país.  Se trata de un momento en la primera infancia en la que aprenden a encontrar  múltiples y diversas maneras de ser niñas y niños mientras disfrutan de experiencias de   juego, arte, literatura y exploración del medio, que se constituyen en las actividades   rectoras de la primera infancia. Dichas actividades tienen un lugar protagónico en la   educación inicial, dado que potencian el desarrollo de las niñas y los niños desde las   interacciones y relaciones que establecen en la cotidianidad.  En ese sentido, son actividades constitutivas del desarrollo integral de las niñas y  los niños y se asumen como elementos que orientan el trabajo pedagógico. El juego   es reflejo de la cultura, de las dinámicas sociales de una comunidad, y en él las niñas   y los niños representan las construcciones y desarrollos de su vida y contexto. En cuan-  to a la literatura, es el arte de jugar con las palabras escritas y de la tradición oral,  \nlas cuales hacen parte del acervo cultural de la familia y del contexto de las niñas y   los niños. Por su parte, la exploración del medio es el aprendizaje de la vida y todo   lo que está a su alrededor; es un proceso que incita y fundamenta el aprender a   conocer y entender que lo social, lo cultural, lo físico y lo natural están en permanente   interacción. Por su parte, el arte representa los múltiples lenguajes artísticos que tras- cienden la palabra para abordar la expresión plástica y visual, la música, la expresión   corporal y el juego dramático. Es así como todos los desarrollos y aprendizajes que se adquieren durante este  periodo dejan una huella imborrable para toda la vida. Las experiencias pedagógi- cas que se propician en la educación inicial se caracterizan por ser intencionadas y   responder a una perspectiva de inclusión y equidad que promueve el reconocimien- to de la diversidad étnica, cultural y social, y de las características geográficas y   socioeconómicas de los contextos en los que viven las niñas, los niños y sus familias.  Por todo lo anterior, el Ministerio de Educación Nacional presenta su línea técnica  de educación inicial de calidad en el marco de la atención integral a través de una   serie de orientaciones pedagógicas que buscan guiar, situar, acompañar y dotar de   sentido las prácticas pedagógicas inscritas en la educación inicial. Estos referentes técnicos se encuentran integrados por seis documentos que abar- can el sentido de la educación inicial, las actividades rectoras de la primera infancia   como el juego, el arte, la literatura y la exploración del medio y, por último, el segui- miento al desarrollo integral de los niños y las niñas en el entorno educativo.  El conjunto de materiales está a disposición de todas las personas que trabajan  en la educación inicial para que sean contextualizados, apropiados y dotados de   sentido desde la experiencia propia y el saber que se ha construido en la interacción   que a diario tienen con las niñas y los niños. La intención fundamental es inspirar a las   maestras, maestros y agentes educativos para que hagan de la educación inicial un   escenario en el que los niñas y las niños jueguen, den rienda suelta a su imaginación y   creación, exploren, sueñen y se expresen con diferentes lenguajes; en otras palabras,   que se les permita vivir su primera infancia. Finalmente, se hace una invitación a explorar los contenidos de este documento,  de manera que sirvan de orientación para las acciones de quienes educan a las niñas   y a los niños en primera infancia, a partir de las realidades y retos que enfrentan día   a día, así como desde el saber pedagógico que han construido en su práctica. \n\nSentido de la educación inicial   ·  13  Un recorrido por la   historia de la educación   de la primera infancia  Cada sociedad, de acuerdo con su trayectoria histórica, ha tenido distintas concepciones   de la infancia, de su desarrollo y de su educación. Estas construcciones sociales están   influenciadas por las ideas y las prácticas culturales que están presentes en la vida dia-  ria, así como por los avances que se van dando en el conocimiento científico y cotidiano,   las movilizaciones de las poblaciones y las políticas públicas o normativas en curso.  Las maneras de nombrar y definir a las niñas y los niños, las formas de atenderlos,  cuidarlos y educarlos son dinámicas, cambiantes e históricas, de tal forma que lo que   se entiende actualmente por educación para la primera infancia  no es lo mismo que   lo que se entendía hace uno o dos siglos atrás. De esta manera, tanto las concepciones   de  niña  y  niño  como  las  de  su  desarrollo,  atención,  cuidado  y  educación  han  sufrido    cambios que han conducido a las ideas y prácticas que se tienen hoy. La variabilidad histórico-cultural de las concepciones de infancia invita a recono- cer  que  no  existe  una  naturaleza  infantil  como  fundamento  fijo,  permanente  y  esen-  cial  que  determina  la  existencia  de  todas  las  niñas  y  los  niños.  Más  bien,  la  niñez  se    define y asume en cada sociedad de manera distinta según características específicas,   dadas por esa naturaleza diversa que configura la existencia y la subjetividad respecto   a ellas y ellos.  Es  así  como  no  existe  una  única  infancia.  Las  infancias  son  múltiples  y  diversas,   dependiendo de los distintos espacios culturales en los que se encuentran las niñas y   los niños y según los procesos de transformación de esta noción que se manifiestan en   las prácticas de atención, cuidado y educación de las sociedades. No obstante, el hecho   de que se escriba más y se hable más de primera infancia y de su educación no significa   que haya consensos sobre estos conceptos. Se encuentran muchos lugares teóricos y   prácticos desde los cuales estos se enuncian y se posicionan.   Acudir a una memoria histórica es importante porque permite reconocer los ante- cedentes que han puesto marcas a la educación de la primera infancia, ayuda a ampliar   el marco de comprensión de las situaciones que enfrenta, las apuestas que plantea y   los  retos  que  encara  actualmente,  y  posibilita  una  acción  que  tome  en  cuenta  cómo    todo  ello  es  resultado  de  un  entramado  social,  cultural  e  histórico  que  lleva  consigo    construcciones y concepciones diferentes de infancia y de las maneras en que se pro-  cura su atención en la sociedad.  \n14  ·    Serie de orientaciones pedagógicas para la educación inicial  Interesa, por tanto, que quienes trabajan con las niñas y los niños de 0 a 6 años reco- nozcan cómo ha sido el relato de esa historia, cómo esta permea las concepciones, sabe-  res y prácticas referidas a ellas y ellos para así movilizar procesos reflexivos que traigan   consigo transformaciones y movilizaciones sociales, culturales y pedagógicas que redun-  den en procesos educativos cuyo punto de partida sea el reconocimiento de las niñas y los   niños como seres singulares, activos, participativos y con capacidades, con una historia   social y colectiva incorporada. Una educación inicial en el marco de la atención integral   oportuna, pertinente y de calidad, que promueva el desarrollo armónico e integral de la   primera infancia desde experiencias pedagógicas y prácticas de cuidado intencionadas   no parte de cero, se construye en un horizonte de pasado, presente y futuro. El propósito de este apartado es mostrar, en una especie de línea de tiempo, aquellas  ideas que han privilegiado una u otra forma de educación para las niñas y los niños en   primera infancia, cómo empieza a enunciarse su atención y cuidado a partir de las ins-  tituciones que los albergan y de las políticas que contribuyen a definir su lugar social1.   De asistir a educar   A lo largo del tiempo, la educación de las niñas y los niños menores de seis años ha cam-  biado. Para mostrar las transformaciones y caminos que ha tomado, es fundamental re-  montarse a la época en que la atención de la primera infancia era dominantemente asis-  1       El hilo conductor y estructura de los antecedentes de la educación inicial está basado en la publicación del  profesor e investigador Hugo Cerda (2003). \nSentido de la educación inicial   ·  15  tencial, para luego conocer los sucesos que dieron paso a un mayor énfasis pedagógico,   así como reconocer las tendencias que han emergido y que la han caracterizado.  Primer momento: hospicios, asilos y orígenes de los jardines infantiles   La presencia de hospicios y asilos2 en el país se remonta a la época de la Colonia, en la  cual las niñas y los niños abandonados o muy pobres que no podían ser atendidos ex- clusivamente en el hogar —espacio de la vida privada— ni educados por sus familias,   como se acostumbraba, estaban en estas instituciones. Los hospicios a los que se hace   mención eran orientados por comunidades religiosas y en ellos se les proporcionaban   los cuidados y protección necesarios para su supervivencia y bienestar, así como algo   de educación bajo algunos de los planteamientos pedagógicos de Fröebel y Montesso-  ri. Las atenciones allí brindadas, principalmente estaban impregnadas de un modelo   asistencial  que  buscaba  la  satisfacción  de  las  necesidades  básicas  de  alimentación,    salud, higiene y formación de hábitos (Cerda, 2003).  “Interesa  destacar  que,  con  independencia  del  estado  de  la  discusión  pedagógica    acerca de la educación infantil, el desarrollo de la oferta destinada a los niños peque-  ños parece responder en este período más a razones asistenciales que pedagógicas”   (Diker, s. f.: s. pág.). Hacia la segunda mitad del siglo XX, el modelo higienista3 introduce dos variantes a la  historia que se cuenta hoy de la educación de la primera infancia: la primera consiste en   la expansión de las instituciones que contribuyen a salvaguardar la salud de la población   y de la sociedad; la segunda trata de la introducción en la escuela de la preservación de   la higiene mediante el auge de la puericultura y la extensión de las campañas de mejora-  miento de la salud y alimentación infantil, vacunación y difusión de normas de higiene.  Aunque en 1851 la Escuelita Yerbabuena recibía niñas y niños menores de 6 años,  realizando por primera vez actividades pedagógicas y recreativas con ellos, con la in-  fluencia del ideario de Fröebel (Cerda, 2003), los primeros establecimientos educati-  vos para la primera infancia se remontan a los inicios del siglo XX, cuando funciona-  ban aproximadamente treinta centros preescolares en el país, en su mayoría de carác-  ter  privado.  Uno    de  ellos,  la  Casa  de  los  Niños  del  Gimnasio  Moderno,  que  sirvió  de    modelo para la creación de otras instituciones similares y donde se pusieron en prác-  tica las propuestas pedagógicas planteadas por Montessori y Decroly (Cerda, 2003).   2       El modelo de atención de estas salas fue tomado de las instituciones francesas del siglo XIX que atendían a  los hijos de la clase obrera. Por un lado, las cunas públicas que atendían a las niñas y los niños hasta los   28 meses, y por otro, las salas de asilo, donde se recibían desde los 2 hasta los 6 años.     3       El modelo higienista hace referencia a la concepción predominante en un momento histórico del país,  mediante la cual se postulaba la necesidad de intervenir las condiciones ambientales con medidas   higiénicas para evitar las enfermedades y, de esta manera, asumir el problema de la salud. \n16  ·    Serie de orientaciones pedagógicas para la educación inicial  A propósito, Muñoz y Pachón (1996: 182) exponen que:  Los  jardines  infantiles  fueron  una  gran  innovación  educativa.  El  niño  entre  3  y  6    años que había estado a cargo de la madre, a comienzos de siglo, pasaba ahora a ma-  nos de maestras improvisadas, o de verdaderas especialistas, que se encargaban de   fomentar el desarrollo psicomotor y la socialización de estos pequeños infantes. En  consonancia  con  lo  anterior,  en  América  Latina  sucedía  algo  semejante  con   la  educación  infantil.  A  finales  del  siglo  XIX  se  inicia  el  funcionamiento  de  escuelas    parvularias,  kindergarten  o  jardines  infantiles  en  los  que  se  contaba  con  mobiliario    acorde  a  las  características  de  las  niñas  y  los  niños,  así  como  con  material  didáctico    variado, todo esto sintonizado con las ideas de Comenio, Decroly, Fröebel, Montessori   y Agazzi (Reveco, 2012: 107). Estas primeras escuelas son evidencia del énfasis peda-  gógico con el que nace la educación para la primera infancia: con la influencia de los   planteamientos de la escuela activa que introduce una educación para las niñas y los   niños menores de seis años a su medida.  Otro  antecedente  que  marca  la  historia  de  la  educación  de  la  primera  infancia   en Colombia hace referencia a la creación del Instituto Pedagógico Nacional en Bo-  gotá  (1927),  dirigido  por  la  Dra.  Franzisca  Radke  —quien  hacía  parte  de  la  primera    Misión  Alemana  que  estuvo  en  el  país  hasta  1936—,  que  creó  una  sección  especial    para preparar docentes de kindergarten4. Su origen se encuentra en la necesidad de  formar  el  talento  humano  encargado  y  responsable  de  educar  y  atender  a  las  niñas    y a los niños menores de 6 años en los espacios que empiezan a institucionalizarse.   Así, la Dra. Radke creó, organizó y dirigió la escuela Montessori de Bogotá, donde se   formaron  las  primeras  maestras  preescolares.  Aunque  una  crisis  lleva  a  su  cierre    temporal,  es  reabierta  en  1956  “con  el  nombre  de  Instituto  de  Educación  Preesco-  lar”,  el  cual  se  constituye  en  antecedente  del  programa  de  Educación  Infantil  de  la    Universidad Pedagógica Nacional. Como dato interesante puede incluirse que en los   años cuarenta egresan las primeras maestras de preescolar que se formaron en las   pocas  instituciones  que  funcionaban  en  Bogotá,  Medellín,  Cali  y  Barranquilla  con    este propósito. Con respecto a la legislación, en 19395 se define y caracteriza la educación infantil  de la siguiente manera:  “Entiéndase  por  enseñanza  infantil,  aquella  que  recibe  el  niño  entre  los  5  y  7   años de edad, cuyo objetivo principal es crearle hábitos necesarios para la vida, jun-  tamente con el desarrollo armónico de la personalidad” (Cerda, 2003: 14).   4       Lo crea la Ley 25 en 1917 y se funda 10 años después. 16 años más tarde de su creación entra en  funcionamiento la sección de preescolar.   5       Cuando se establece el decreto 2101 del Ministerio de Educación Pública. \nSentido de la educación inicial   ·  17  Al mismo tiempo se consolida en el país el modelo higienista norteamericano, cu- yas prioridades eran la salud, la nutrición y otros aspectos vinculados a la seguridad y   el bienestar, como ya se mencionó. Como resultado de esta influencia y de las necesi-  dades del país en materia de abandono de las niñas y los niños, se crea en 1946 el Insti-  tuto Colombiano de Seguros Sociales (ICSS) y el Ministerio de Higiene, y se promulga   el Código del Niño o Ley Orgánica de la Defensa del Niño6, el cual se constituye en el  primer conjunto de leyes a favor de una población infantil que comienza a vivir ya los   rigores de la desnutrición, el abandono y el maltrato (Cerda, 2003: 14-15).  Para atender los problemas de mendicidad y abandono de las niñas y los niños pre- sentes en esta época, se estableció un conjunto de normas reglamentarias sobre la asis-  tencia de la mujer embarazada, de la madre soltera, del recién nacido, del niño lactante   y del infantil, es decir, se hace énfasis en la necesidad de proteger y cuidar a la niña y el   niño desde su nacimiento, así como a la madre que trabaja. Si bien fueron leyes y normas   6       Ley 83 de 1946. \n18  ·    Serie de orientaciones pedagógicas para la educación inicial  que eran necesarias, no se crearon los mecanismos legales y orgánicos para llevarlas a la   práctica, lo que dificultó la materialización de ese cuidado que las inspiraba.  Como  puede  derivarse  de  lo  dicho,  la  incorporación  de  la  mujer  al  ámbito  laboral   genera preocupación por la educación de la primera infancia y ello conduce a la bús-  queda de espacios que cuiden y eduquen a las niñas y los niños desde muy temprana  edad, lo que deviene en un impulso para la   creación  de  guarderías  y  la  formalización    de  la  educación  preescolar  entendida,  en    general,  como  una  etapa  de  preparación    para la educación primaria.  A  manera  de  ejemplo,  con  el  decreto   1276  de  1962  se  reglamenta  la  creación  y    funcionamiento  de  seis  Jardines  Infanti-  les  Nacionales  Populares  en  las  principa-  les ciudades del país, adscritos al Ministe-  rio  de  Educación  Nacional,  con  el  interés    de  garantizar  el  acceso  de  las  clases  me-  nos favorecidas a la educación preescolar,   considerada  como  la  primera  y  decisiva    acción  pedagógica  en  la  formación  inte-  lectual  y  afectiva  de  las  niñas  y  los  niños.    En estos jardines había dos grados de pre-  escolar  con  25  niñas  y  niños  cada  uno,  el   primero, para las edades de 4 a 5 años, y el otro, para niñas y niños de 5 a 6 años. Es en el decreto 1710 de 1963, artículo 9, que se expresa que:  “el  nivel  de  educación  preescolar  o  infantil  se  considerará  adscrito  a  la  educa- ción primaria, en cuanto a orientación y supervisión. Parágrafo. La educación pre-  escolar se estima como una etapa conveniente, pero no obligatoria para el ingreso al   nivel primario”.  En  19687  se  crea  el  Instituto  Colombiano  de  Bienestar  Familiar  (ICBF)  con  el  ob- jetivo de “proveer la protección del niño y procurar la estabilidad y bienestar familiar”,   dando vida en forma más generalizada a una concepción asistencialista, centrada en la   protección, vinculada al trabajo social y la nutrición y alejada, por mucho tiempo, de di-  rectrices educativas y pedagógicas propias de la educación preescolar existente en ese   momento.  Así,  se  da  origen  a  los  Centros  de  Atención  Integral  al  Preescolar  (CAIP)8,  orientados  a  la  atención  de  las  hijas  y  los  hijos  de  los  trabajadores,  los  cuales  vienen  a    sumarse a los jardines infantiles nacionales ya mencionados.    7       Ley 75.  8       Creados mediante la Ley 27 de 1974. \nSentido de la educación inicial   ·  19  A través del decreto 1576 de 1971 se crean otros 22 jardines infantiles nacionales,  con lo cual se amplía la oferta tanto en las grandes ciudades como en las intermedias.   Estos establecimientos debían cumplir tres funciones esenciales, a saber:  “a) Atender integralmente a los niños. b) Proyectar la acción educativa del plan- tel a la comunidad a través de labores de educación familiar. c) Servir de orientado-  res prácticos de la iniciativa privada en el campo de la educación preescolar” .  Más  adelante,  se  fueron  abriendo  más  jardines  departamentales  y  municipales  (Minis-  terio de Educación Nacional, 1996). Por su parte, los hogares comunitarios creados en 1972 son una modalidad de aten- ción orientada a niñas y a niños menores de 5 años de edad con el objetivo de brindar-  les atención en afecto, nutrición, salud, protección y desarrollo psicosocial. Las moda-  lidades de atención de estos hogares son: a) Hogares FAMI (Familia, Mujer e Infancia)   orientados a la atención de familias con mujeres gestantes, madres lactantes y niñas   y niños menores de 2 años; b) Hogares tradicionales que atienden a niñas y niños de 0   a 5 años, ya sea en el tipo hogar comunitario familiar, hogar comunitario grupal, hogar   comunitario múltiple, hogar comunitario múltiple empresarial y jardín social. Sobra  destacar  la  importante  y  valiosa  respuesta  que  el  Instituto  Colombiano  de   Bienestar  Familiar  (ICBF)  proporciona  al  momento  histórico  que  vive  el  país  en  re-  lación con la situación de abandono, problemas de salud y desnutrición, así como con   la entrada de las mujeres a la vida laboral, situaciones que hacen necesario establecer   más programas de carácter oficial para atender oportunamente a un mayor número de   población infantil y sus familias.  En 19769, mediante el decreto 088, se reestructura el sistema educativo colombia- no y se reorganiza el Ministerio de Educación Nacional. En el artículo 4 se plantea la   educación preescolar como el primer nivel educativo, lo que le da vida legal al sistema.   En el artículo 6 se plantea que: Se llamará educación preescolar la que se refiere a los niños menores de seis (6) años.   Tendrá como objetivos especiales el promover y estimular el desarrollo físico, afectivo   y espiritual del niño, su integración social, su percepción sensible y el aprestamiento   para las actividades escolares, en acción coordinada con los padres y la comunidad.  En el mismo decreto se crea la División de Educación Preescolar y Educación Es- pecial, a la cual se le asigna, como una de sus funciones, dirigir este nivel de educación   en toda la nación.  Avanzando en el tiempo, hacia 1979, el Instituto Colombiano de Bienestar Familiar  modifica el programa CAIP, cambiando su nombre por el de Hogares Infantiles, donde   se prioriza la participación de las familias y de la comunidad.  9       Recuperado el 10 de marzo de 2014 en http://www.mineducacion.gov.co/. \n20  ·    Serie de orientaciones pedagógicas para la educación inicial  El currículo de la Educación Preescolar, comenzó a gestarse en los años 1977 y 1978:  “cuando por primera vez se tomó conciencia sobre la necesidad de darle a esta mo- dalidad unos lineamientos para regular, orientar y organizar la actividad educativa y   pedagógica de un establecimiento preescolar” (Cerda, 2003: 18).  Pero es en 198410 cuando el Ministerio de Educación Nacional construye un Plan  de Estudios para todos los niveles, áreas y modalidades del sistema educativo. En este   momento plantea el objetivo de la educación preescolar de las niñas y los niños  entre   los  4  y  6  años de edad:  “Desarrollar  integral  y  armónicamente  sus  aspectos  biológico,  sensomotor,   cognitivo y socioafectivo, y en particular la comunicación, la autonomía y la crea-  tividad, y con ello propiciar un aprestamiento adecuado para su ingreso a la Edu-  cación Básica”. En ese mismo año (1984), después de varias discusiones y validaciones con distintos  actores de la comunidad educativa, se publica el “Currículo de preescolar (niños de 4 a   6 años)”.   En este documento se plantean cuatro formas de trabajo educativo: a) Trabajo  comunitario; b) Juego libre; c) Unidad didáctica y d) El trabajo en grupo. Además de las   anteriores, se definen las actividades básicas cotidianas. En el trabajo educativo, tanto   10     Mediante el Decreto 1002 de 1984. Recuperado el 10 de marzo de 2014 en http://www.mineducacion. gov.co/. \nSentido de la educación inicial   ·  21  para el juego como para la unidad, se hace referencia a que estos abordan los aspectos   perceptivo motriz, socioafectivo, de lenguaje,   creativo e intelectual del desarrollo.  Por  otra  parte,  con  la  creación  de  los  hogares  comunitarios  del  Instituto  Colom- biano de Bienestar Familiar en 1986 se recogen las experiencias y aprendizajes de las   modalidades  institucionales  y  se  proyecta  la  atención  de  las  niñas  y  los  niños  en  el    marco de la modalidad comunitaria. Así se entiende que: “El desarrollo infantil [está] estrechamente relacionado con los entornos de so- cialización de las niñas y los niños y las interacciones cotidianas [son] reconocidas   por su potencial educativo” (Comisión Intersectorial para la Atención Integral de la   Primera Infancia, 2013: 63). En  1987  se  presenta  el  segundo  documento  de  lineamientos  de  preescolar,  en  el   que se plantean las áreas y los temas que estructurarán el currículo, el cual estaba fun-  damentado tanto teórica como operativamente en lo relacionado con el trabajo peda-  gógico que se proponía para este nivel. Durante este tiempo, tanto el Ministerio de Educación Nacional como el Instituto  Colombiano  de  Bienestar  Familiar  asumen  la  responsabilidad  de  la  educación  de  la    primera infancia en el país: el Ministerio, a través del programa de preescolar y algu-  nos  programas  no  convencionales,  y  el  Instituto  mediante  las  diversas  modalidades    de  atención  —(Centros  Comunitarios  Infantiles  (CCI),  Hogares  Infantiles,  Centros    de  Atención  Integral  a  la  Primera  Infancia  (CAIP)—.  Estas  entidades  proponen  con    autonomía sus políticas y programas, conduciendo a un paralelismo en la atención y   educación a la primera infancia.      No obstante, en algunos momentos las dos entidades plantean un trabajo conjunto  que prefigura los esfuerzos de interinstitucionalidad que se discuten actualmente. Así,   en 1987, ambas instituciones proponen un trabajo integrado con el Ministerio de Salud   para atender las necesidades educativas y de salud de las niñas y los niños de primera in-  fancia, articulando el Programa de Educación Familiar para el Desarrollo Infantil (PE- FADI)11  y  el  Plan  Nacional  de  Supervivencia  y  Desarrollo  de  la  Infancia  (Supervivir)12  (Cerda, 2003).  En 1988 el Ministerio de Educación Nacional reestructura la División de Educación  Preescolar,  creando  el  Grupo  de  Educación  Inicial,  orientado  a  desarrollar  estrategias    y programas con el fin de ofrecer a las niñas y a los niños mejores condiciones para su   desarrollo integral. Entre ellos se encuentran programas no convencionales como:  11       Comenzó a partir de 1985 con el objetivo de proporcionar educación familiar para el desarrollo  intelectual y emocional de las niñas y los niños de 0 a 7 años de las zonas rurales, el saneamiento   ambiental y, sin duda alguna, el mejoramiento de la práctica de los adultos responsables de la atención y   el cuidado de las niñas y los niños.   12     Se desarrolló entre 1984 y 1992 con el fin de promover mejores condiciones de salud y nutrición para el   desarrollo de las niñas y los niños, reducir la mortalidad y la morbilidad por causas controlables y atender   a la mujer gestante y en edad fértil. \n22  ·    Serie de orientaciones pedagógicas para la educación inicial  •\t   Programa  de  Educación  Familiar  para  el  Desarrollo  Infantil  (PEFADI)  para    las  zonas  rurales  del  país.  Su  propósito  era  la  educación  familiar  para  el  de-  sarrollo intelectual y emocional de la niña y el niño, así como el saneamiento   ambiental. Las acciones que se llevaban a cabo eran coordinadas entre el Ins-  tituto  Colombiano  de  Bienestar  Familiar,  el  Ministerio  de  Educación  Nacio-  nal y las Secretarías de Salud.    •\t   Supervivir. Es un programa originado, en el mismo espíritu de PEFADI, para   los  sectores  más  vulnerables  de  las  zonas  urbanas.  Era  desarrollado  por  los    jóvenes bachilleres de los colegios estatales en sus horas de servicio social.   •\t   Apoyo al Componente Pedagógico en los Hogares Comunitarios de Bienestar   Familiar.  Con  este  programa,  el  Ministerio  de  Educación  Nacional,  apoyado    por maestras y maestros de preescolar, capacitaba a las madres comunitarias   en aspectos pedagógicos con el propósito de fortalecer las atenciones brinda-  das a las niñas y los niños. \nSentido de la educación inicial   ·  23  A manera de síntesis:  A manera de conclusión del primer momento, puede afirmarse que la atención a   la  primera  infancia  nace  con  una  doble  función  que  no  siempre  se  presenta  ar- ticulada.  Por  un  lado,  la  función  asistencial  tiene  que  ver  con  la  respuesta  a  las    necesidades básicas de las niñas y los niños, tales como protección, alimentación   y salud; si bien se requieren, no son suficientes para la promoción de su desarrollo.  Por su parte, a la función educativa se le asigna una finalidad, la de ser preparato- ria para el nivel de educación primaria, con lo cual se enfatiza el carácter de una edu-  cación en función del ingreso de las niñas y los niños al primer grado. Esta finalidad se   asume de dos maneras diferentes: por un lado, como “adelanto” a los procesos escolares   propios de la educación básica primaria, de manera particular en procesos de lectura,   escritura y operaciones matemáticas. Por otro lado, como una manera de introducir a   las niñas y a los niños a las dinámicas propias de la cultura escolar (Diker, s. f.: s. pág.). En cuanto a lo expuesto en la perspectiva histórica, este primer momento de la  educación de la primera infancia que va desde la Colonia hasta fines de los ochen-  ta está caracterizado por el tránsito de los hospicios y asilos, donde se atendía a las   niñas  y  los  niños  en  condiciones  de  excepcionalidad  (pobreza,  abandono,  orfan-  dad),  al  surgimiento  de  instituciones  educativas  y  programas  que  otorgan  otra    perspectiva de tratamiento a la atención infantil —más centrada en la atención o   en el cuidado— en los primeros seis años. La tensión entre asistir y educar se hace   presente, tal y como lo muestran las siguientes tendencias que resumen lo aconte-  cido en este primer momento:  •\t   Las niñas y los niños menores de 6 años eran atendidos en hospicios, asilos   o salas debido a una situación irregular de abandono, pobreza o enfermedad   que demandaba una especial atención, la cual era brindada en estos espacios.  •\t   De los hospicios y asilos se pasa a la creación de escuelas y jardines infanti-  les, por iniciativa del sector privado, con una muy importante orientación   pedagógica  basada  en  los  postulados  de  Comenio,  Fröebel,  Montessori  y    Decroly. La concepción educativa y pedagógica predomina en estos esfuer- zos aislados de educación a la primera infancia.  •\t   Los Jardines Infantiles Nacionales Populares adscritos al Ministerio de Edu-  cación  Nacional  evidencian  un  interés  particular  por  parte  del  sector  oficial    de  brindar  una  oferta  para  las  niñas,  los  niños  y  sus  familias,  la  cual  se  fue    extendiendo a las principales ciudades y luego a las ciudades intermedias.   •\t   La educación preescolar nace como una ruta que funciona como la única   posible a partir de la cual se piensa su extensión a amplios sectores de la   población. De esta manera, se tiende a asociar la educación de la primera   infancia con procesos de preparación para la vida escolar y para el ingreso   a la básica primaria. \n24  ·    Serie de orientaciones pedagógicas para la educación inicial  Segundo momento: expansión y desarrollo de la educación preescolar   A lo largo del siglo XX, la oferta de la educación preescolar tiene un auge importante,   mayor  en  el  sector  privado  que  en  el  oficial.  Esta  débil  institucionalidad  hace  que  la   educación  para  las  niñas  y  los  niños  corra  por  dos  canales  distintos,  de- finidos por sus condiciones socioeconómicas de origen, dando la  idea  de  que  el  preescolar,  el  jardín  infantil  o  kindergarten  es   para  quienes  pertenecen  a  los  estratos  socioeconómicos   altos  y  medios,  mientras  que  los  programas  y  acciones   del  Instituto  Colombiano  de  Bienestar  Familiar  son   para quienes se encuentran en los estratos bajos. Adi- cionalmente, los jardines infantiles privados reciben  niñas y niños desde los 2 hasta los 6 años, mientras   el Instituto los atiende desde los primeros meses de  vida  y  hasta  los  6  años  en  salacunas,  guarderías  y   otros programas.  Es fundamental destacar los aportes del Proyecto  Pedagógico  Educativo  Comunitario  (PPEC)  del  Ins- tituto  Colombiano  de  Bienestar  Familiar,  cuyo  origen   se  remonta  a  1990,  y  a  la  creación  de  la  modalidad  Fami- lia, Mujer e Infancia con los hogares comunitarios FAMI13. El  PPEC  se  centra  en  el  desarrollo  infantil  y  comunitario  como  ejes   del  desarrollo  humano  y  de  la  educación  de  niñas  y  niños;  enfatiza  en  la  interacción    (consigo mismo, con los otros y con el entorno) como motor del desarrollo infantil y en   la construcción de ciudadanía; reconoce las experiencias locales y regionales de aten-  ción a la primera infancia para retroalimentar el proyecto; promueve el trabajo cola-  borativo y cooperativo de las familias y la comunidad, y organiza la atención a través   de seis momentos: bienvenida, vamos a explorar, vamos a crear, vamos a jugar, vamos   a comer y vamos a casa (Pineda y otros, 2012). Todos estos aspectos resultan bastante   novedosos y representan avances importantes en la manera como se comprende a las   niñas y a los niños, y el tipo de atención que requieren para su desarrollo.  El PPEC se complementa con la ficha integral, instrumento que refiere tanto a las  acciones de las niñas y los niños como al trabajo de formación de los educadores, las   familias y la comunidad. Esta ficha contiene los aspectos más relevantes que influyen   en su calidad de vida: aspectos personales y de vivienda, de salud y nutrición, relacio-  nes familiares y desarrollo infantil. Sobre este último punto posteriormente se elabo-  ra la Escala de Valoración del Desarrollo, en la que se plantea que el eje conceptual que   articula el desarrollo de niñas y niños es el  sistema de relaciones  que construyen con   la realidad y, dentro de dicho sistema, los procesos psicológicos implicados. La escala   tiene en un vértice las relaciones y en el otro las etapas.  13     Mediante el acuerdo 021 de 1989. \nSentido de la educación inicial   ·  25  Las relaciones y los procesos que se plantean son:   •\t   Relación con los demás  •\t   Comunicación  •\t   Interacción  •\t   Construcción de normas  •\t   Relación consigo mismo   •\t   Identidad  •\t   Autoestima  •\t   Manejo corporal  •\t   Relaciones con el mundo que le rodea   •\t   Interés y conocimiento de los objetos  •\t   Relaciones causales  •\t   Representación de la realidad social Las etapas que se plantean son:  •\t   Primera edad       (0 a 12 meses)  •\t   Infancia temprana    (1 año y 1 mes a 3 años)  •\t   Edad preescolar    (3 años y 1 mes a 4 años y 6 meses)  •\t   Transición      (4 años y 7 meses a 6 años y 6 meses)    Este proyecto propone lo que podrían llamarse “elementos curriculares” que, aun- que  no  se  denominan  así,  cumplen  esa  función  al  especificar  aquellas  orientaciones    educativas que apuntan a los  qué  que “se deben trabajar en los hogares” (Ministerio de   Educación Nacional, 2012).  Por su parte, los hogares FAMI proponen apoyar el desarrollo de las niñas y los ni- ños menores de 2 años, su proceso de socialización y el mejoramiento de la nutrición   y de las condiciones de vida (Comisión Intersectorial para la Atención Integral de la   Primera Infancia, 2013). La  tendencia  de  estos  programas  no  convencionales  o  no  escolarizados  es  atender   necesidades  de  alimentación,  nutrición  y  cuidado  con  la  participación  de  la  comuni-  dad. A su vez, se empieza una fuerte lucha en contra de las concepciones que los relegan   como  programas  de  segunda  categoría,  buscando  apoyos  que  permitan  su  sostenibili-  dad, viabilidad y calidad para convertirlos en iniciativas educativas tan válidas y valio-  sas como los programas de educación formal. Por ello se hace necesario plantear polí-  ticas tendientes a un trabajo conjunto y a una mayor equidad en las ofertas educativas   para la primera infancia.     Un paréntesis: leyes y normas por la infancia   Para  mostrar  la  evolución  de  la  educación  inicial  es  necesario  hacer  un  paréntesis    para  mostrar  los  cambios  acontecidos  como  resultado  de  políticas  y  normativas  na- \n26  ·    Serie de orientaciones pedagógicas para la educación inicial  cionales e internacionales como la Declaración de la Convención sobre los Derechos   del Niño, la Declaración Mundial de Educación para Todos y la Constitución de 1991.   Con  todas  ellas  se  dio  un  impulso  bastante  grande  a  la  legitimación  de  la  educación    como  derecho  de  las  niñas  y  los  niños  y  se  generaron  cambios  estructurales  en  los    programas y atenciones que se venían brindando a la primera infancia, ahora bajo la   perspectiva de derechos. Con la Declaración de la Convención Sobre los Derechos del Niño, suscrita por Co- lombia  en  198914  y  que  entró  en  vigencia  el  2  de  septiembre  de  1990,  el  país  asume  un   compromiso con las niñas y los niños que implica adoptar las concepciones explícitas e   implícitas en esta declaración, así como su visibilización en la perspectiva de derechos:   (Comisión Intersectorial para la Atención Integral de la Primera Infancia, 2013)15  •\t   La igualdad sin distingo de raza, color, sexo, idioma, religión, opinión política o   de otra índole, origen nacional o social y posición económica;   •\t   Tener una familia considerada como grupo fundamental de la sociedad y me-  dio natural para su crecimiento y bienestar;   •\t   Tener un nombre, una nacionalidad y conocer a sus padres;   •\t   expresarse con libertad;   •\t   La crianza, el desarrollo y la educación;   •\t   La protección contra toda forma de abuso y maltrato;  •\t   El disfrute del más alto nivel de salud;   •\t   Un nivel de vida adecuado para su desarrollo;   •\t   El descanso y esparcimiento, el juego y las actividades recreativas;   •\t   Participar libremente en la vida cultural y en las artes. Conviene recordar que la Convención Internacional sobre los Derechos del Niño y  la adhesión de Colombia a ella, finalmente plasmada en la Constitución de 1991 y rati-  ficada mediante la Ley 12 del mismo año, se constituye en un hito histórico que impul-  sa el reconocimiento de las niñas y los niños como sujetos de derechos. Este punto de   referencia es pasaje obligado para mostrar la situación actual de la primera infancia y   la orientación de las políticas públicas hacia su atención integral. La  importancia  de  la  Declaración  Mundial  sobre  Educación  para  Todos,  “Satisfac- ción  de  las  necesidades  básicas  de  aprendizaje”  (Jomtien,  Tailandia,  marzo  de  1990)    radica  en  la  adquisición  del  compromiso  de  trabajar  en  el  marco  de  las  acciones  y  re-  comendaciones allí suscritas y en la alusión explícita a la educación inicial en el marco   de aprendizaje para toda la vida. En este sentido, el aprendizaje comienza desde el mis-  mo  momento  del  nacimiento;  la  familia,  la  comunidad  y  las  instituciones  son  agentes    14     La CDN fue adoptada y abierta a la firma y ratificación por la Asamblea General de Naciones Unidas en   su resolución 44/25 del 20 de noviembre de 1989.  15     Mediante la Ley 12 de 1991, Colombia adoptó los acuerdos suscritos en la Convención Sobre los  Derechos del Niño. \nSentido de la educación inicial   ·  27  y responsables del mismo; y los entornos son determinantes para que sea una realidad   (Jomtien, 1990). La  Constitución  de  1991  eleva  a  rango  constitucional  el  compromiso  del  país  por   las niñas y los niños, con lo cual se inaugura un periodo fértil de cambios que han con-  tribuido a la formulación de la política de primera infancia. Se destaca el papel de la   familia,  el  Estado  y  la  sociedad  para  el  cumplimiento  de  los  derechos  de  las  niñas  y    los niños con miras a garantizar su desarrollo integral, así como el reconocimiento a   la  diversidad  individual,  social,  económica,  étnica,  política,  religiosa  y  cultural  de  la    nación colombiana. Además de promover una concepción de niña y niño como sujetos   de derechos, establece la obligatoriedad de un grado de preescolar como mínimo.   La obligatoriedad de la educación preescolar   Entre 1991 y 1994 se formula el Plan de Acción a Favor de la Infancia que:  “Es  a  la  vez  un  diagnóstico  de  la  realidad  social,  económica,  física  y  educativa   del  niño  colombiano  menor  de  7  años,  y  un  conjunto  de  propuestas  para  erradicar    muchos de los problemas analizados”.  En este diagnóstico se afirma que el nivel de preescolar tiene un cubrimiento cercano   al 14%, o sea que, para ese momento (1989), atendía cerca de 330.000 niñas y niños, la   mitad de ellos en el sector privado, y la otra mitad en el sector público. En este plan se   menciona por primera vez el grado cero, que pretende resolver la ausencia de educa-  ción preescolar de las niñas y los niños que ingresaban a la escuela oficial. Igualmente,   se buscaba disminuir la repitencia y mejorar la calidad educativa de la educación bá-  sica primaria (Cerda, 2003). \n28  ·    Serie de orientaciones pedagógicas para la educación inicial  Con la promulgación de la Ley General de Educación16 en 1994, siguiendo los pre- ceptos constitucionales, se establece como obligatorio un año de educación preesco-  lar.  En  el  artículo  15  de  la  misma  ley  se  define  su  sentido,  indicando  que  se  entiende    como  aquella  educación  orientada  al  desarrollo  de  la  niña  y  el  niño  en  los  aspectos    biológico, cognoscitivo, psicomotriz, socioafectivo y espiritual mediante experiencias   de socialización pedagógicas y recreativas.  En  la  reglamentación  de  la  Ley17  se  determina  que  la  edu- cación  preescolar  está  dirigida  a  las  niñas  y  a  los  niños   menores  de  seis  años,  antes  de  iniciar  la  educación   básica, y está comprendida por tres grados, sien- do los dos primeros una etapa previa a la esco- larización, y el tercero, obligatorio. Adquiere  así  institucionalidad  el  Grado  Cero,  que   toma  en  cuenta  las  dimensiones  del  desa- rrollo  humano:  corporal,  comunicativo,   cognitivo, ético, estético, actitudes y valo-  res,  y  sigue  los  lineamientos  pedagógicos    para la educación preescolar18.  En  1996  se  promulga  la  resolución   2343  en  la  que  se  establecen  los  indica- dores  de  logros  curriculares  para  los  tres   grados del nivel de preescolar. Se afirma que  los indicadores de logros curriculares para es- tos  grados  se  formulan  desde  las  dimensiones   del desarrollo humano, mientras que para los otros  niveles, desde áreas obligatorias y fundamentales. Con  ello es importante destacar el reconocimiento a la especifi- cidad de los primeros grados de educación y sus diferencias con los demás.  En  el  decreto  2247  en  1997  se  establecen  normas  referentes  a  la  prestación  del   servicio  de  preescolar,     al  tiempo  que  permite  la  organización  de  este  nivel  de  edu- cación por parte del Ministerio de Educación Nacional. Este Decreto reconoce que,   tanto para las instituciones oficiales como privadas, el preescolar es uno de los ni-  veles  de  la  educación  formal,  tal  como  lo  plantea  el  artículo  11  de  la  Ley  115.  Se  es-  pecifica que la educación preescolar es la que se ofrece a niñas y niños de 3 a 5 años   y que sus grados son: prejardín, jardín y transición. Por un lado, se establecen como   principios  de  la  educación  preescolar  la  integralidad,  participación  y  lúdica,  y  por    otro,  se  afirma  que  los  procesos  curriculares  se  desarrollan  mediante  la  ejecución    16     Ley 115 de 1994.  17     Decreto 1860 de 1994.  18     Según la Resolución 2343 de 1996. \nSentido de la educación inicial   ·  29  de proyectos lúdico-pedagógicos y actividades que tengan en cuenta la integración   de las dimensiones del desarrollo humano. Es en el año de 1998 cuando el Ministerio de Educación Nacional publica una se- rie de documentos sobre lineamientos curriculares para todo el sistema educativo. En   ellos  se  disponen  los     “Lineamientos  pedagógicos  para  la  educación  preescolar”,     que  recogen las formulaciones hechas por Delors en Tailandia (1990). En estas se refiere   a cuatro aprendizajes fundamentales:  aprender a conocer, aprender a hacer, aprender   a  vivir  juntos   y   aprender  a  ser .  Así  mismo,  se  presentan  algunos  elementos  sobre  las    dimensiones del desarrollo humano: socioafectiva, corporal, cognitiva, comunicativa,   estética, espiritual y ética.  A manera de síntesis   La década de los ochenta a los noventa fue muy prolífica en la formulación de polí-  ticas educativas favorecedoras de la educación de las niñas y los niños en primera   infancia, en términos de la educación preescolar, por el impulso que tuvo una mi-  rada distinta hacia las niñas y los niños con la adhesión del país a la Convención   de los Derechos del Niño, las orientaciones de la Constitución Política en ese sen-  tido y los desarrollos del sector educativo, acordes con estos marcos, en particular   la Ley 115 de 1994. Estos  acontecimientos  trazan  un  hito  importante  en  la  formulación  de  polí- ticas  educativas  en  materia  de  educación  preescolar,  como  la  adopción  del  grado    obligatorio,  que  conlleva  al  cubrimiento  educativo  de  un  primer  grado  antes  del    ingreso a la educación formal para todas las niñas y los niños colombianos. En las   ciudades, el grado obligatorio impulsa que las niñas y los niños mayores de 5 años   que  asistían  a  los  hogares  infantiles,  hogares  comunitarios  y  jardines  infantiles    ingresen a los colegios oficiales. A manera de síntesis, pueden trazarse las siguientes tendencias del desarrollo  de la educación de la primera infancia en esta década:  •\t   El desarrollo de las orientaciones y las experiencias del Ministerio de Edu-  cación  Nacional  y  el  Instituto  Colombiano  de  Bienestar  Familiar  estuvie-  ron dirigidas a las niñas y a los niños menores de 6 años, otorgándole mayor   importancia a programas institucionales y otros que no necesariamente re-  querían de una instalación física, con lo cual se buscaba solucionar los pro-  blemas  de  cobertura  y  calidad  educativa,  así  como  contribuir  con  la  aten-  ción a las poblaciones vulnerables.  •\t   La educación preescolar queda inscrita en el Ministerio de Educación Na-  cional como grado obligatorio, el cual fue denominado “grado cero” (poste-  riormente,  grado  de  transición),  con  el  objetivo  de  preparar  a  las  niñas  y   \n30  ·    Serie de orientaciones pedagógicas para la educación inicial  a  los  niños  para  asumir  la  educación  primaria.  Esta  educación,  si  bien  se    dirige al desarrollo de las niñas y los niños, se inscribió en una práctica que   tiende  a  fortalecer  las  áreas  de  conocimiento  de  la  básica  primaria,  antes    que los propósitos de bienestar y desarrollo que requieren las niñas y los ni-  ños en sus momentos iniciales de vida.  •\t   El avance en participación y responsabilidad de las familias con la educa-  ción de sus hijas e hijos se hace visible a través de los programas guberna-  mentales que se promueven. Sin embargo, aún persiste una atención frag- mentada por sectores e inequitativa en razón a las condiciones socioeconó-  micas de las poblaciones.  •\t   A  finales  del  siglo  XX,  mientras  las  transformaciones  en  concepciones  y    prácticas  son  más  proclives  a  una  mirada  de  la  niña  y  el  niño  desde  una    perspectiva  de  derechos,  la  educación  de  la  primera  infancia,  con  carácter    obligatorio, se plantea desde la educación preescolar y se identifica como el   grado de transición a la básica primaria. De igual manera, mientras algu-  nas  niñas  y  niños  cuentan  con  tres  años  de  educación  preescolar  privada    (jardín infantil), un gran número asiste solo al grado de transición o grado   cero obligatorio.    •\t   Persiste la tensión entre la función asistencial y la educativa en la atención   a la primera infancia, así como la búsqueda de una especificidad pedagógica   para la educación a la primera infancia, no en la idea de miradas irreconci-  liables, sino como lecturas distintas que tienen que converger en la organi-  zación e implementación de la educación para las niñas y los niños menores   de 6 años.   •\t   Se avanza en el planteamiento de lineamientos curriculares que proponen   pilares  y  dimensiones  que  estructuran  y  otorgan  particularidad  a  la    educación preescolar.   \nSentido de la educación inicial   ·  31  Tercer momento: la construcción del concepto de educación inicial   La importancia de la educación de la primera infancia tiene una revitalización signifi-  cativa en las últimas dos décadas. Por ello se hace necesario hacer una revisión de las   políticas y avances técnicos a nivel mundial, regional y nacional que han configurado   un marco fundamental para construir el concepto de educación inicial en el país, en-  tendida como aquella que va dirigida a las niñas y los niños desde su nacimiento hasta   los seis años y que amplía la idea de la educación preescolar sustancialmente. Para  la  preparación  del  Foro  Mundial  sobre  la  Educación,  Marco  de  Acción  de   Dakar,  “La  educación  para  todos:  cumplir  con  nuestros  compromisos  colectivos”,    realizado  en  abril  de  2000,  los  países  de  América  Latina,  el  Caribe  y  América  del    Norte  evaluaron  los  logros  de  los  objetivos  y  metas  formuladas  en  la  región  luego    de  los  diez  años  de  la  Conferencia  Mundial  de  Educación  para  Todos,  en  la  que  se    habían  comprometido  con  la  cobertura  y  calidad  de  todos  los  niveles  de  la  educa-  ción. En el foro se reafirmó lo pactado en Jomtien (1990) y se enunció, como primer   objetivo: “Desarrollar y mejorar bajo todos sus aspectos la protección y la educación de la  primera infancia, con énfasis en los niños más vulnerables y más desfavorecidos”. En febrero del 2000, en Santo Domingo, los países renovaron sus compromisos con  la Educación para Todos, en el Marco de Acción Regional. En este marco   se   reconoce  que, a pesar de los logros obtenidos en la década, se requiere atender los desafíos refe-  ridos a “incrementar la inversión social en la primera infancia, aumentar el acceso a   programas de desarrollo infantil y mejorar la cobertura de la educación inicial”.   Luego,  en los compromisos, se hace explícita la importancia de:  La  inversión  en  programas  de  desarrollo  integral  de  los  niños  y  niñas  meno- res de cuatro años; sostener los logros alcanzados e incrementar la atención edu-  cativa  inicial  a  partir  de  los  cuatro  4  años  de  edad  con  estrategias  centradas  en    la  familia,  la  comunidad  o  centros  especializados,  especialmente  para  los  niños    y  niñas  en  situaciones  de  desventaja;  mejorar  la  calidad  de  los  programas  de  de-  sarrollo  integral  y  educación  de  la  primera  infancia  mediante     el  fortalecimiento   de los sistemas de capacitación y acompañamiento a la familia;   el fortalecimiento  de los procesos de monitoreo y evaluación; el establecimiento de mecanismos de   articulación entre las instituciones que prestan servicios y programas relaciona-  dos con la supervivencia y desarrollo de los niños y niñas menores de seis años; el   mejor aprovechamiento de las tecnologías y medios de comunicación (Ministerio   de Educación Nacional, 2012). Concretamente,  respecto  al  tema  de  educación  inicial,  se  hace  la  Declaración  del   Simposio  Mundial  de  Educación  Parvularia  o  Inicial,  “Una  educación  inicial  para  el    siglo XXI”,   (Santiago de Chile, marzo de 2000) .  En los considerandos, se encuentra: \n32  ·    Serie de orientaciones pedagógicas para la educación inicial  •     Que todas las niñas y los niños del mundo tienen derecho a una educación, nu- trición y salud que aseguren su supervivencia, crecimiento y el pleno desarro-  llo de sus potencialidades;  •    Que los primeros años de vida, incluyendo el período prenatal, son cruciales y  decisivos para el desarrollo integral de la persona;  •     Que  la  educación  inicial  es  una  etapa  educativa  con  identidad  propia  y  que   hace efectivo el derecho a la educación;  •    Que la educación inicial debe comenzar desde el nacimiento, con el fin de lo- grar el desarrollo integral de la persona y prevenir futuras dificultades;  •     Que  la  educación  inicial  y  el  cuidado  de  la  salud  y  nutrición  tienen  un  efecto   positivo  en  la  reducción  de  las  desigualdades  socioeconómicas  y  de  aprendi-  zaje. Por  último,  se  menciona  la  Conferencia  Mundial  sobre  Atención  y  Educación  de   la Primera Infancia (AEPI), celebrada del 27 al 29 de septiembre de 2010 en Moscú,   considerada como la primera reunión mundial sobre el tema en relación con las niñas   y los niños menores de seis años, en la cual se explicitan aspectos como:     •\t   La AEPI es el cimiento de la Educación para Todos (EPT) y el primer   paso para   cumplir todos sus demás objetivos.   •\t   La AEPI puede mejorar el bienestar de los niños pequeños, en particular   los del mundo en desarrollo, donde hay una probabilidad de cuatro sobre   diez para que un niño viva en la pobreza extrema y donde 10,5 millones  \nSentido de la educación inicial   ·  33  de  niños  menores  de  cinco  años  mueren  anualmente  a  causa  de  enfer-  medades evitables.   •\t   La AEPI ejerce un efecto positivo en la escolaridad posterior y aumenta   la matrícula en la enseñanza secundaria, en particular entre las niñas.   •\t   La AEPI, en tanto que facilita el cuidado fiable de los niños, constituye   un  apoyo  esencial  para  los  padres  que  trabajan,  en  particular  para  las    madres.   •\t   La AEPI iguala las condiciones de partida, al reducir las desigualdades   entre los ricos y los pobres, por lo que es un componente fundamental   para quebrar el ciclo de la pobreza intergeneracional. Desde  comienzos  de  la  década  del  2000,  la  educación  de  la  primera  infancia  está   en  la  agenda  pública  de  todos  los  Estados,  suscitando  reflexiones  a  todo  nivel,  tanto    en  lo  normativo  y  lo  operativo  como  en  lo  pedagógico.  De  manera  particular,  en  Co-  lombia,  la  construcción  del  concepto  de  educación  inicial  ha  tenido  un  camino  que    ha  conllevado  a  la  movilización  de  diferentes  actores  y  sectores,  como  se  muestra  a    continuación. La Constitución Política de Colombia de 1991 y la Ley General de Educación   plan- tearon un marco político y normativo importante para la educación de la primera in-  fancia. Sin embargo, la construcción de una política para esta población se inició con   una  movilización  social  en  el  año  2002,  la  cual  se  consolidó  en  el  2005,  al  iniciar  el    Programa de Apoyo para la Construcción de la Política de Primera Infancia.     En este  se organizaron siete comisiones encargadas de hacer un balance de los desarrollos en   primera infancia. Paralelamente  a  esto,  el  país  avanzó  en  la  reformulación  del  Código  del  Menor  y  en   2006 promulga la Ley 1098, Código de la Infancia y la Adolescencia,   en la cual se exponen  varias premisas no negociables por las que la sociedad debe responder, tales como la pro-  tección integral (artículo 7) y el interés superior de las niñas, los niños y los adolescentes   (artículo 8). Sin embargo, es en el artículo 29, referido al derecho al desarrollo integral en   la primera infancia, en el que se define   la primera infancia y se habla explícitamente de la  educación inicial como un derecho impostergable. Este artículo expone:  La primera infancia es la etapa del ciclo vital en la que se establecen las bases para  el  desarrollo  cognitivo,  emocional  y  social  del  ser  humano.  Comprende  la  franja  po-  blacional que va de los cero (0) a los seis (6) años de edad. Desde la primera infancia,   los niños y las niñas son sujetos titulares de los derechos reconocidos en los tratados   internacionales, en la Constitución Política y en este Código. Son derechos imposter-  gables de la primera infancia, la atención en salud y nutrición, el esquema completo   de  vacunación,  la  protección  contra  los  peligros  físicos  y  la  educación  inicial.  En  el    primer mes de vida deberá garantizarse el registro civil de todos los niños y las niñas. Lo anterior se constituye en la base para avanzar hacia la delimitación y construc- ción  del  sentido  de  la  educación  inicial,  la  cual,  como  se  expone  en  el  artículo,  hace   \n34  ·    Serie de orientaciones pedagógicas para la educación inicial  referencia a la educación brindada a las niñas y los niños desde su nacimiento y hasta   los 6 años, con la claridad de que las niñas y los niños entre 5 y 6 años de edad están   en  el  grado  obligatorio  de  preescolar  (transición),  de  acuerdo  con  lo  estipulado  en  la    normatividad colombiana (Ministerio de Educación Nacional, 2012).  En el 2006, como consecuencia de los trabajos realizados en el marco del Progra- ma  de  Apoyo  para  la  Construcción  de  la  Política  de  Primera  Infancia,  se  organiza  el    Segundo Foro Internacional: Movilización por la Primera Infancia,   el cual se consti- tuyó en la base para la expedición de la Política Pública Nacional de la Primera Infan-  cia “Colombia por la primera infancia”   (Conpes social 109). Este documento expone  una serie de líneas generales relacionadas con los antecedentes de las políticas desde   los años sesenta a los noventa, así como la experiencia en el campo del desarrollo de la   primera infancia.  En  materia  de  educación  inicial,  en  el  Conpes  109  de  2007,  se  plantea  la  primera   definición de educación inicial en los siguientes términos:  La educación para la primera infancia es un proceso continuo y permanente de  interacciones y relaciones sociales de calidad, oportunas y pertinentes que posibi-  litan a los niños y las niñas potenciar sus capacidades y adquirir competencias para   la vida, en función de un desarrollo pleno que propicie su constitución como sujetos   de derechos. A partir de allí se despliega una serie de oportunidades para avanzar en la concep- tualización  de  la  educación  inicial,  y  como  se  verá  a  continuación,  es  el  marco  para    consolidar acciones conducentes a garantizar el derecho a la educación de las niñas y   los niños de primera infancia desde el marco de la atención integral.    El 2009 fue un año fértil y varios sucesos impactaron en el camino de la construc- ción y delimitación del concepto de educación inicial. Por una parte, el Ministerio de   Educación Nacional lanzó la Política Educativa para la Primera Infancia en el Marco   de una Atención Integral en la cual se propuso: Garantizar el derecho que tiene todos los niños y niñas menores de cinco años a  una oferta que permita el acceso a una educación inicial, en el marco de una aten-  ción integral, especialmente para aquellos en condición de vulnerabilidad, así como   la generación de estrategias que fomenten su permanencia y continuidad en el sis-  tema educativo.   En la política se plantea la importancia de la atención integral para el desarrollo in- fantil, así como las estrategias que se diseñaron para promover el acceso a este nivel edu-  cativo. En ese sentido se propusieron tres modalidades de atención que se definieron y   desarrollaron de acuerdo con la guía 35: Guía operativa para la prestación del servicio de   atención integral a la primera infancia (Ministerio de Educación Nacional, 2009):  Modalidad  entorno  familiar.   Buscaba  atención  integral  en  cuidado,  nutrición  y   educación  inicial  a  niñas  y  niños  menores  de  5  años  ubicados  en  zonas  rurales  o  ur- \nSentido de la educación inicial   ·  35  banas, atendidos y educados por sus familias, fortaleciendo la labor educativa que se   brinda en el hogar.  Modalidad entorno comunitario.  Pretendía brindar atención integral a las niñas  y los niños menores de 5 años acogidos actualmente por los hogares comunitarios del   Instituto  Colombiano  de  Bienestar  Familiar,  como  complemento  a  los  servicios  de    cuidado y nutrición con un componente educativo.  Modalidad entorno institucional.  Estaba dirigida a niñas y niños ubicados en zo- nas rurales y urbanas atendidos por instituciones especializadas en atención integral,   donde se ofrecen los componentes de cuidado, nutrición y educación inicial durante 5   días de la semana, en jornadas de 8 horas diarias.  Con la Ley 1295 de 2009 de abril de 2009   se reglamenta la atención integral de la  primera infancia. A través de esta, el Estado plantea contribuir a mejorar la calidad de   vida de las madres gestantes y de las niñas y los niños menores de seis años, particu-  larmente los que se encuentran clasificados en los niveles 1, 2 y 3 del Sisbén. Así mis-  mo, se declara que los derechos de las niñas y los niños comienzan desde la gestación   y que se garantizarán los derechos consagrados en la Constitución Nacional y en las   leyes que desarrollan sus derechos. Tanto la Política Educativa como la Ley 1295 de 2009 se constituyen en el marco  bajo el cual el Ministerio de Educación Nacional lideró el Programa de Atención Inte-  gral a la Primera Infancia durante 2009 y 2013. En este programa se atendieron más   de 400.000 niñas y niños y se construyeron 72 infraestructuras.      \n36  ·    Serie de orientaciones pedagógicas para la educación inicial  En noviembre del mismo año se realizó el Foro Mundial de Grupos de Trabajo por la  Primera Infancia: Sociedad Civil y Estado en Cali, Colombia, en el que se desarrollaron   tres focos principales: avances y sostenibilidad de la política pública de primera infan- cia; atención integral a la primera infancia con   enfoque  diverso,  y  alcance  y  responsabilidad    de  la  sociedad  civil  con  la  primera  infancia.  El    foro hizo aportes importantes a las discusiones   y  avances  que  se  venían  planteando  desde  el    Gobierno  nacional  e  involucró  a  los  gobiernos    locales  para  que  se  sintonizaran  todos  por  la    primera infancia. A  finales  de  ese  año,  el  Ministerio  de  Edu- cación Nacional publicó el  Documento No. 10:   Desarrollo infantil y competencias en la prime-  ra infancia,  el cual se presenta como una opor-  tunidad  que  permite  a  los  agentes  educativos    asumir  prácticas  educativas  pertinentes  que    faciliten  el  desarrollo  de  competencias  en  los    niños  y  las  niñas  colombianas  (Ministerio  de   Educación Nacional, 2009). En el texto se abordan los conceptos de desarrollo, com-  petencia  y  experiencias  reorganizadoras.  Estos  tres  conceptos  son  desplegados  en    tres grupos de edades: 0 a 1 año, 1 a 3 años y 3 a 5 años.  En  particular,  este  documento  representó  para  el  país  un  avance  significativo  en   relación con la manera en que se concebía el desarrollo de la primera infancia:  “Ahora,  la  nueva  cara  de  las  teorías  del  desarrollo  muestra  un  funcionamiento   desigual, que abandona la sucesión estable de las etapas”. (Ministerio de Educación   Nacional, 2009: 19).  La política pública de Atención Integral a la Primera Infancia actual, que se materia- liza a través de la Estrategia De Cero a Siempre, ha plasmado los avances en las concep-  ciones  sobre  primera  infancia,  desarrollo  infantil,  educación  inicial,  atención  integral,    entre otros; esta propone orientaciones de política para el trabajo con las niñas y los ni-  ños en el país y en los territorios, y deja abierta la construcción para que la nación y los   territorios participen en ella mediante un diálogo constructivo basado en los saberes y   experiencias actuales.  En  el  marco  de  esta  política  el  Ministerio  de  Educación  Nacional  ha  planteado   que  la  educación  inicial  busca  potenciar  de  manera  intencionada  el  desarrollo  in-  tegral de las niñas y los niños, partiendo del reconocimiento de sus características   y de las particularidades de los contextos en que viven, favoreciendo interacciones   que  se  generan  en  ambientes  enriquecidos  a  través  de  experiencias  pedagógicas  y    prácticas  de  cuidado  (Comisión  Intersectorial  para  la  Atención  Integral  de  la  Pri-  mera Infancia, 2013).  \nSentido de la educación inicial   ·  37  A manera de síntesis   A partir del compromiso adquirido por el país, en el marco de la convención de los   derechos  del  niño,  se  inicia  un  proceso  que  convoca  a  muchos  actores  sociales  a  la    definición de orientaciones de políticas para el beneficio de la primera infancia. Con   el propósito de diferenciar la especificidad de este momento del ciclo vital y tras la   búsqueda  del  desarrollo  integral  como  propósito  de  toda  acción  destinada  a  mate-  rializar  la  perspectiva  de  derechos,  el  país  emprende  reflexiones,  programas  y  ac-  ciones que dan cuerpo a lo que actualmente se entiende por “desarrollo”, “educación   inicial” y “niña y niño de 0 a 6 años”. Poco  a  poco,  el  Ministerio  de  Educación  Nacional  precisa  el  significado  de  la   atención  integral  a  la  primera  infancia  y  la  entiende  como  un  proceso  educativo    orientado a promover el desarrollo de todas las niñas y los niños del país, desde su   nacimiento,  a  través  de  referentes  educativos  y  pedagógicos  a
