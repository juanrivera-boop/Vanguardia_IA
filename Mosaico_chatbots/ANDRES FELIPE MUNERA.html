    <style>
        :root{--primary:#007bff;--secondary:#6c757d;--light:#f8f9fa;--dark:#343a40;--success:#28a745;--danger:#dc3545;--warning:orange;--radius:8px;--font:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;--bg:var(--light);--text:var(--dark);--card:#fff;--border:#ddd;--input:#fff;--iborder:#ccc;--bot-bg:#e9ecef;--bot-text:var(--dark);--user-bg:var(--primary);--user-text:#fff;--sys-bg:#fff3cd;--sys-text:#856404;}
        body.dark-mode{--bg:#212529;--text:#f8f9fa;--card:#343a40;--border:#495057;--input:#495057;--iborder:#6c757d;--bot-bg:#495057;--bot-text:#f8f9fa;--sys-bg:#332701;--sys-text:#ffeb8f;}
        body{font-family:var(--font);margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s;}

        header{text-align:center;border-bottom:1px solid var(--border);padding-bottom:15px;}
        header h1{color:var(--primary);margin:0;font-size:1.6em;}
        header p{margin:5px 0 0;font-size:.9em;color:var(--secondary);}
        .toolbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;}
        button{background:var(--primary);color:#fff;border:none;padding:8px 15px;border-radius:var(--radius);cursor:pointer;font-size:.9em;transition:background .2s;}
        button:hover{background:#0056b3;}
        button:disabled{background:var(--secondary)!important;opacity:.65;cursor:not-allowed;}
        #theme-btn{background:var(--secondary);}
        #palette-btn{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;}
        .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
        .btn-export{background:var(--primary);color:#fff;border:none;padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-size:.85em;transition:background .2s;}
        .btn-export:hover{background:#0056b3;}
        .pdf2-section{padding:10px;border:1px dashed var(--border);border-radius:var(--radius);}
        .pdf2-section label.title{font-size:.85em;font-weight:bold;display:block;margin-bottom:6px;color:var(--secondary);}
        .file-row{display:flex;align-items:center;gap:10px;}
        .file-row input[type=file]{display:none;}
        .file-label{background:var(--secondary);color:#fff;padding:6px 12px;border-radius:var(--radius);cursor:pointer;font-size:.85em;}
        .file-label:hover{background:#545b62;}
        #pdf2-name{font-style:italic;color:var(--secondary);font-size:.85em;}
        #pdf2-status{font-size:.85em;margin-top:4px;font-weight:bold;}

        .sq-label{font-size:.85em;font-weight:600;color:var(--secondary);}
        .questions-select{width:100%;padding:8px;border:1px solid var(--iborder);border-radius:var(--radius);background:var(--input);color:var(--text);font-size:.9em;}
        .chat-display{height:360px;overflow-y:auto;border:1px solid var(--iborder);border-radius:var(--radius);padding:10px;background:var(--bg);line-height:1.6;}
        .chat-display .user-message,.chat-display .bot-message,.chat-display .system-message{margin-bottom:10px;word-wrap:break-word;}
        .chat-display .user-message,.chat-display .bot-message{background:transparent;color:inherit;padding:0;border-radius:0;max-width:100%;text-align:inherit;margin-left:0;}
        .message{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px;max-width:100%;}
        .message.user-message{flex-direction:row-reverse;justify-content:flex-start;}
        .avatar-img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #eee;background-color:#f0f0f0;}
        body.dark-mode .avatar-img{border-color:#444;background-color:#555;}
        .message-bubble{padding:10px 15px;border-radius:18px;max-width:85%;word-wrap:break-word;line-height:1.5;display:flex;flex-direction:column;}
        .user-message .message-bubble.user-bubble{background:var(--user-bg);color:var(--user-text);border-bottom-right-radius:5px;margin-left:auto;}
        .bot-message .message-bubble.bot-bubble{background:var(--bot-bg);color:var(--bot-text);border-bottom-left-radius:5px;margin-right:auto;}
        .chat-display .message-bubble strong{color:var(--primary);font-size:.9em;}
        .chat-display .bot-message .message-bubble p{margin:0 0 8px;}.chat-display .bot-message .message-bubble p:last-child{margin:0;}
        .chat-display .bot-message .message-bubble pre{background:var(--dark);color:var(--light);padding:10px;border-radius:5px;overflow-x:auto;}
        .chat-display .bot-message .message-bubble code{background:rgba(0,0,0,.1);padding:2px 4px;border-radius:3px;}
        body.dark-mode .chat-display .bot-message .message-bubble code{background:rgba(255,255,255,.1);}
        .chat-display .system-message{background:var(--sys-bg);color:var(--sys-text);text-align:center;font-style:italic;font-size:.9em;padding:8px 12px;border-radius:var(--radius);}
        .chat-display .system-message.error{background:#f8d7da;color:#721c24;}

        .input-area{display:flex;gap:10px;}

        #send-button{background:var(--success);padding:0 20px;display:flex;align-items:center;justify-content:center;gap:8px;}
        #send-button:hover{background:#1e7e34;}
        .loader{border:3px solid #f3f3f3;border-top:3px solid var(--primary);border-radius:50%;width:16px;height:16px;animation:spin 1s linear infinite;display:none;}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        footer{text-align:center;padding:12px;background:var(--dark);color:var(--light);font-size:.8em;margin-top:20px;}
        @media(max-width:600px){.input-area{flex-direction:column;}#send-button{width:100%;padding:12px;}}

    const PDF_TEXT = "MANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 1 \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 2  Í Í NDICE NDICE ÍNDICE  1 ALBAÑILER Í A CONFINADA  ¿Qué es albañilería confinada?  ¿Por qué es importante?  Conjunto estructural  Componentes de la albañilería confinad a  Proceso constructivo  2 PROCESOS DE CONSTRUCCIÓN  3.1  3.2  3.3  3.4  3.5  3.6  1.1  1.2  1.3  1.4  1.5  Doblado del acer o Columnas  Vigas  Losas aligeradas  Escaleras  2.1  2.2  2.3  2.4  2.5  3 CONTROL DE CALIDAD DEL CONCRETO  Introducción  Mezclado del concreto Transporte  Vaciado  Compactación  Curado \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 3  4  S EGURIDAD E HIGIENE EN  O BRA 5 ANEXOS  Materiales en muros portantes  Materiales en cimientos corridos  Materiales en columnas, vigas, techo  Implementos utilizados en la dosificación  de morteros y concretos  Simbolo g ía de  p lanos estructurales  5.1  5.2  5.3  5.4  5.5  4.1  4.2  4.3  4.4  4.5  4.6  Accidentes, tipos y causas  Tú y la seguridad en obra Requisitos del lugar de trabajo: orden y limpieza  Equipos de protección persona (E.P.P.)  Manipulación y transporte de materiales Prevención contra caídas  4.7  4.8  Demolición manual  Reglas de oro \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 4  PRESEN PRESEN T T A A CI CI Ó Ó N N PRESENTACIÓN  Con este manual de construcción para maestros de obra  CORPORACIÓN ACEROS AREQUIPA S.A.   quiere contribuir al logro de  un mejor nivel tecnológico de los trabajadores de la construcción.  La elaboración de este manual ha contado con el asesoramiento y revisión  de ingenieros calificados y su objetivo es reforzar los conocimientos  del maestro de obra adquiridos en el trabajo cotidiano. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 5  Figura 1. Albañileria Confinada  1.1 ¿QUÉ ES ALBAÑILERÍA CONFINADA?  La  albañilería  confinada  es  la  técnica  de  construcción  que  se  emplea    normalmente para la edificación de una vivienda. En este tipo de construcción   se utilizan generalmente ladrillos de arcilla cocida, columnas de amarre, vigas   soleras, etc.  En este tipo de viviendas primero se construye los cimientos corridos y luego   los muros de ladrillo, seguidamente se procede a vaciar el concreto de las   columnas de amarre y, finalmente, se construye el techo en conjunto con las   vigas.  (Ver figura 1).  1. ALBAÑILERÍA CONFINADA  1.2 ¿POR QUÉ ES IMPORTANTE LA ALBAÑILERÍA CONFINADA?  Desde hace muchos años, las viviendas de este tipo son las construcciones más   populares en las zonas urbanas de nuestro país y en la actualidad esta tendencia   continúa.  Por otro lado, si tú estás a cargo de una obra de este tipo, debes tener en cuenta   por lo menos estos tres siguientes factores:  a.  El diseño estructural.  b.  El control de los procesos constructivos.  c.  El control de la calidad de los materiales.  . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 6  Es importante que consideres estos tres factores, ya que para que una vivienda   pueda soportar exitosamente los efectos devastadores de un terremoto, debe   tener una estructura sólida, fuerte y resistente.  Un  sismo  causará  daños  a  una  vivienda,  si  esta  carece  de  diseño  estructural    o  si  fue  mal  construida   (ver  figura  2).   La vivienda  puede  incluso  derrumbarse,    causando  pérdidas  materiales  importantes,  heridas  graves  a  sus  ocupantes  y    hasta la muerte de alguno de ellos.  Figura 2. Vivienda dañada debido al terremoto  de Pisco, 15 Agosto, 2007.   (ver figura 3). \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 7  Zona 1: Sismicidad Baja Zona 2: Sismicidad Media Zona 3: Sismicidad Alta  Zona 4: Sismicidad Muy Alta  Figura 3. Zonas Sísmicas en el Perú  1.3 CONJUNTO ESTRUCTURAL  La estructura de una vivienda se encarga de soportar su propio peso y los efectos   de un terremoto. Está formada por los siguientes elementos:  (ver figura 4).  Conozcamos ahora cada uno de ellos con detenimiento:  1.3.1 Cimentación  Debido  a  la  presencia  de  muros  portantes,  el  tipo  de  cimentación  que  se  usa    generalmente, es el denominado “cimiento corrido”. Este se construye con:  Figura 4.   Cimentación   Muro   Arriostres Losa aligerada  Concreto ciclópeo = Cemento + Hormigón + Agua + Piedra zanja (mediana o grande).  . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 8  He aquí algunos requisitos mínimos que debe cumplir:  Es importante tener en cuenta que las medidas del cimiento corrido dependen   básicamente de dos factores:  a. Del tipo de suelo  b. Del peso total a soportar  Veamos cada uno de ellos:  a. Tipo de suelo:  Existen  diferentes  tipos  de  suelo  y  cada  uno  de  ellos  tiene  sus  propias    características (arcilloso, arenoso, peso máximo a soportar, grado de humedad,   cantidad de sales, sulfatos, etc.).  En  Lima,  por  ejemplo,  una  gran  parte  de  la  ciudad  tiene  un  terreno  gravoso    (grava  y  arena)  al  que  se  le  denomina  comúnmente  cascajo  u  hormigón.  Sin    embargo, la periferia de la ciudad, conformada por el Cono Sur, el Cono Norte   o  la  expansión  hacia  el  Este  (La  Molina,  etc.)  no  tienen  estos  terrenos,  sino    principalmente,  arenas  sueltas  y  limos  arcillosos.  Existen  también  terrenos    pantanosos (Chorrillos).  Como verás, es importante conocer las características del terreno para definir   las  medidas  del  cimiento  corrido.  Este  “factor  suelo”  es  considerado  por  el    proyectista  cuando  realiza  el  diseño  estructural  de  la  vivienda  de  albañilería    que vas a construir.  Figura 5.   Sobrecimiento: Ver plano Ver plano (Mín. 0.30) Ver plano Concreto: f’c = 100 Kg./cm2 + 25% PM (4”) Cimiento: Concreto: f’c = 100  Kg./cm2 + 30% PG (10”) PM = Piedra Mediana (hasta 4”) PG = Piedra Grande (hasta 10”) \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 9  Aunque cada proyecto incluye planos de cimentación que indican, entre otras   cosas,  la  profundidad  de  excavaciones,  las  medidas  de  sus  cimientos  y  la    cantidad de refuerzo necesario; a modo de información referencial y orientadora   podemos considerar lo siguiente:    ◊  Suelo normal: conglomerado o mezcla de grava y arena.    ◊  Suelo blando: arena suelta o arena fina o arcilla o suelo húmedo.  Figura 6.   Muro soga o cabeza  Profundidad zanja Suelo natural Suelo rellenado y compactado Mín  50 cm Ancho cimiento Altura sobrecimiento INFORMACIÓN REFERENCIAL a1.- Profundidad mínima zanja: Altura mínimo: Ancho mínimo: a2.- Cimiento: Altura cimiento La cimentación NO debe apoyarse  en suelos formados por rellenos o  depósitos de basura, sino sobre  terreno natural.  100 cm para suelo normal 120 cm para suelo blando 40 cm para suelo normal 60 cm para suelo blando 80 cm para suelo normal 100 cm para suelo blando Datos válidos solo para  viviendas de 1 o 2 pisos \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 10  Si el suelo es blando, es recomendable considerar un sobrecimiento armado:  b. Peso total a soportar  Este es el segundo factor del cual dependen las medidas definitivas y precisas   del cimiento corrido.  El peso total a soportar no es igual para todos los cimientos. Algunos soportan   más que otros; dependiendo del número de pisos y también de la ubicación (en   planta) de los cimientos. Esto también lo toma en cuenta el ingeniero proyectista   cuando realiza el diseño estructural de la vivienda.  1.3.2 Muro  En  este  punto  nos  referiremos  a  los  muros  portantes,  que  constituyen  el    segundo elemento estructural a estudiar.  El  ladrillo  King  Kong  debe  cumplir    exigencias de la Norma E070.  Es  importante  saber  que  un  muro    portante no es lo mismo que un “tabique”.  Figura 7.   n.f.p. + .10 .40INFORMACIÓN REFERENCIAL Concreto: f’c = 175 Kg./cm2 (mínimo) Refuerzo: (cantidad mínima) 4    1/2”: Estribos    6mm.: 1 a .05,  3 a .10, c/e. Rto. .25  Figura 8.   Ladrillo King Kong  Muro portante = Ladrillo King Kong + Mortero  \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 11  El ladrillo pandereta se debe usar en la construcción de tabiques.  Tabique = Ladrillo pandereta + Mortero  Los muros portantes le proporcionan la fortaleza y la solidez necesarias a una   vivienda, es decir, la vuelven más resistente. Observa la figura 10. Ahí se muestra   uno de los trabajos que realizan estos muros: soportar y transferir peso (o carga)   de cada uno de los pisos de una vivienda.  Figura 10. Proceso de transferencia de cargas.  Figura 9.   ¡Prohibido!   Es peligroso usar este material para construir un muro portante. Techo Techo Cimiento corrido Cimiento corrido  2  Pisoo 1  Pisoo Muro portante Muro portante \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 12  Como  se  puede  apreciar,  una  edificación  es  la  superposición  de  varios  pisos    separados  por  los  techos  (losas  aligeradas  de  concreto  armado),  los  cuales  se    apoyan  en  los  muros  (en  toda  su  longitud)  por  medio  de  las  vigas  soleras.  En    el caso de una vivienda de dos pisos, la transferencia de los pesos de un nivel a   otro sucede de la siguiente manera  (ver figura 10):    ◊  Todo el peso del segundo piso es distribuido a los muros de ese mismo nivel de   la manera que indican las flechas.    ◊  Igualmente, el peso del primer piso es distribuido a sus propios muros como   indican las flechas, sumándose a esto todo el peso del segundo piso. Como se   ve, en este caso, los muros del primer piso soportan el doble de peso que los del   segundo.    ◊  Finalmente, todo el peso acumulado que llega a los muros del primer piso es   transferido a la cimentación y esta lo transfiere al terreno.  V V Fuerza sísmica Y X Muros Portantes Muros Portantes Muros Portantes Estudio Cocina Comedor Sala Fuerza sísmica  Figura 11. Efectos de un sismo en una vivienda:  fuerzas horizontales actuando sobre ella. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 13  Por otro lado, estos mismos muros portantes tienen que realizar otro trabajo   adicional: soportar y transferir las fuerzas que producen los sismos. Al ocurrir un   sismo, este produce una fuerza (V) que se distribuye a cada muro portante  (ver   figura 11),  ocasionándole mayor presión. Esta fuerza puede llegar en cualquier   dirección.  Es  importante  mencionar  que,  con  cierta  frecuencia,  los  muros  portantes    tienen  que  realizar  estos  dos  trabajos  al  mismo  tiempo,  lo  cual  demanda  un    gran esfuerzo para cada muro portante y por esta razón es importante utilizar   excelentes  materiales,  contar  con  buena  mano  de  obra  y  tener  un  diseño    estructural adecuado (planos estructurales). Por eso toma en cuenta estas dos   recomendaciones.  a.  Necesidad de tener muros portantes en las dos direcciones (X, Y):  Un  sismo  es  un  fenómeno  natural  que  ocasiona,  entre  otros  efectos,  que  la    vivienda  se  sacuda  como  si  alguien  la  empujara  lateralmente.  Estas  fuerzas    pueden  sacudir  a  la  vivienda  en  distintas  direcciones  (X,  Y).  Por  lo  tanto,  la    edificación  debe  tener  muros  dispuestos  a  lo  largo  de  dichas  direcciones,  de    modo que le proporcionen fortaleza.  (ver figuras 12 y 13).  Comedor v Cocina Escalera Estudio Sala Dirección de la fuerza sísmica  Y X  Figura 12. Planta. Muros portantes  que resisten la fuerza sísmica. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 14  Los  muros  portantes  trabajan  principalmente  en  dirección  longitudinal,  es    decir, a lo largo. Esto significa que en una casa como la de la figura 12, los muros   dispuestos  en  la  dirección  “Y”,  son  los  que  deberán  soportar  las  fuerzas  del    sismo en esa dirección; y los muros dispuestos en la dirección “X”,  (ver figura 13)   son los que deberán soportar la fuerza sísmica de esta dirección.  Los  problemas  comienzan  cuando  en  una  vivienda  hay  escasos  muros  en  una    dirección  u  otra,  o  si  estos  son  de  poca  longitud.  De  presentarse  esta  grave    deficiencia,  las fuerzas  del  sismo  pueden  ocasionar  la  rajadura y  el  colapso  de    los muros. El diseño estructural de una vivienda permite conocer si los muros   serán de cabeza o de soga y la longitud que deberán tener.  Figura 13. Planta: Muros portantes  que resisten la fuerza sísmica.   Dirección de la fuerza sísmica X V Y Comedor   Cocina Escalera EstudioSala \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 15  b.  Densidad de muros:  Te  enseñaremos  una  manera  sencilla  para  pre  dimensionar  los  muros  de  una    vivienda.  Es  muy  importante  controlar  la  cantidad  de  muros  portantes  que  debe  tener    una vivienda  en  cada  una  de  las  direcciones  (X, Y) y  de  los  pisos  a  construirse.    Este control lo puedes hacer cumpliendo los siguientes pasos:  Paso N.° 1:  Calcula el área techada de cada piso en metros cuadrados (m 2 ).  Paso N.° 2:  Calcula el área horizontal de muros confinados requeridos.  Paso N.° 3:  Calcula el área horizontal total de muros portantes que piensas construir.  Paso N.° 4:  Compara el resultado del paso N° 2 con el del N° 3. Debe cumplirse lo siguiente:  Área de muros (primer piso) (segundo piso) (primer piso) (segundo piso) (segundo piso) Área de muros   Área techo 120 cm2   Área techo   Área techo= = x x +  120 cm2 m2 m2  Ejemplo de aplicación:  Consideremos una vivienda de dos pisos, cuyo croquis se muestra en la que se   usarán ladrillos de mediana calidad para su construcción. Ahora calculemos:  Paso N.° 1:  Calculamos el área de cada techo aligerado (concreto armado).  Área de muros (Paso 3) Área de muros (Paso 2) DEBE SER MAYOR QUE \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 16  Paso N.° 2:  Calculamos  el  área  mínima  de  muros  portantes  que  debería tener  la vivienda.    Para ello utilizamos estas fórmulas:  Área techo (1° piso) = 7.45 x 10.50 = 78.22 m2 Área techo (2° piso) = 7.45 x 10.50 = 78.22 m2 Total = 156.45m2  Esto significa que en cada dirección del primer piso debe haber como mínimo   un total de 18.774 cm 2  de área de muro.  Esto significa que en cada dirección del u refuerzo deben ser calculados según la intensidad del trabajo   que realiza el muro y según la separación entre columnas.  Si se tienen muros muy largos, se deberá colocar columnas cada 3 m o 3.5 m si   son de soga; o cada 5 m si son de cabeza. En la vivienda del ejemplo anterior, se   deberá colocar columnas tal como se muestra en la figura 15.  1.3.4 Losa Aligerada  Los  techos  forman  parte  de  la  estructura  de  una  vivienda,  están  hechos  de    concreto  armado  y  se  utilizan  como  entrepisos.  Pueden  apoyarse  sobre  los    muros portantes, vigas o placas.  Las losas aligeradas cumplen básicamente tres funciones:    ◊  Transmitir hacia los muros o vigas el peso de los acabados, su mismo peso, el   peso de los muebles, el de las personas, etc.    ◊   Transmitir  hacia  los  muros  las  fuerzas  que  producen  los  terremotos   (ver   figuras 11, 12 y 13).    ◊   Unir  los  otros  elementos  estructurales,  columnas,  vigas  y  muros,  para  que    toda la estructura trabaje en conjunto, como si fuera una sola unidad.  Para que se puedan cumplir a cabalidad estas funciones, debes tener en cuenta   las  siguientes  recomendaciones  con  relación  a  las  losas  aligeradas   (ver  figura    16).    ◊  Deben ser iguales en todos los pisos.    ◊  Como máximo: largo = 3 veces ancho.    ◊  Las aberturas para escaleras no deben ser excesivas ni en número ni en tamaño   y de preferencia deben estar ubicadas en la zona central. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 20  Figura 15. Planta típica. Columnas, vigas.  Viga amarre Viga amarre Columnas   Viga amarre Viga solera Viga solera Viga Viga solera Viga solera Viga solera Viga solera  Figura 16. Formas de losas aligeradas.  Aceptable Azotea Evitar Aberturas Largo   Ancho  3 pisoo 2 pisoo 1 pisoo \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 21  1.4 COMPONENTES DE LA ALBAÑILERÍA CONFINADA  En este tipo de construcciones, los componentes que se usan son los siguientes:  Veamos ahora cada uno estos componentes en detalle.  1.4.1 Ladrillo  En  el  mercado  existe  actualmente  diversos  tipos  de  ladrillos  con  los  cuales    se  pueden  construir  los  muros  portantes. Algunos  son  de  buena  calidad,  pero    hay otros que no deben utilizarse. En general, existen dos tipos de ladrillos: los   sólidos y los tubulares.  Los ladrillos tubulares son los ladrillos pandereta  (ver figura 17),  los cuales, como   ya se explicó anteriormente, no son los más apropiados para la construcción de   los muros portantes por su poca resistencia y fragilidad. Los ladrillos King Kong   son los que más se usan. En el mercado existen dos tipos:    ◊  Ladrillo     ◊  Fierro de Construcción    ◊  Mortero     ◊  Concreto  He  aquí  algunas  recomendaciones  a  tener  en  cuenta  al  momento  de  comprar    nuestros ladrillos:    ◊  Deben cumplir las exigencias de la Norma Técnica E070.    ◊  No deben tener materias extrañas en su superficie o interior  (ver figura 18).    ◊  Deben estar bien cocidos, no quemados.    ◊  Deben emitir un sonido metálico al golpearlo con un martillo.    ◊  No deben estar agrietados  (ver figura 19).    ◊  No deben presentar manchas blanquecinas de origen salitroso.  Es poco resistente y poco durable. Ladrillo artesanal.Ladrillo Arcilla cocida (King Kong).   Ladrillo maquinado. Es más resistente y más durable. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 22  1.4.2 Mortero  El mortero es un elemento clave en la capacidad resistente del muro portante.   No debes olvidar que las funciones básicas del mortero son:    ◊  Pegar o unir ladrillo con ladrillo.    ◊  Corregir las irregularidades de los ladrillos.  Dada la importancia de este componente, es necesario preparar un mortero de   buena calidad. Para eso debes tener cuidado con dos aspectos fundamentales:  a. La calidad de sus ingredientes.  b. La dosificación, es decir, la cantidad de cada ingrediente que debe usarse en   la preparación de la mezcla.  Figura 17, 18 y 19.  Figura 17   Figura 18 Figura 19  Mortero = Cemento + Arena gruesa + Agua. . . . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 23  a. Calidad de los ingredientes:  Cemento:  - Debe ser fresco.  Arena:  - Debe ser limpia, sin restos de plantas, cáscaras, etc.  Agua:  - Bebible.  - Limpia.  - Libre de ácidos.  b. Dosificación:  La  dosificación  volumétrica  apropiada  está  descrita  en  la  Norma  Técnica  de    Edificaciones E-070. Estas son las medidas:  Ambos morteros se usan en muros portantes.  1.4.3 Fierro de Construcción  La  calidad  de  las  estructuras  de  concreto  armado  depende  en  gran  medida    de la eficiencia de la mano de obra empleada en su construcción. Los mejores   materiales e ingeniería utilizados en el diseño estructural carecen de efectividad   si los procesos constructivos no se han realizado en forma correcta  (ver figura   20).  Uno de los procesos constructivos más importantes es la calidad del habilitado   del  refuerzo  que  se  colocará  en  la  estructura.  Hay  que  cuidar  que  este  tenga    las  adecuadas  “dimensiones  y  formas”,  así  como  también  que  cumpla  las    especificaciones indicadas en los planos estructurales.  Precisamente  en  el  “Capítulo  2”,  te  daremos  algunas  recomendaciones    importantes sobre los fierros.  P1   1   3 - 3.5 P2   1   4 - 5 Tipo   Cemento   Arena \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 24  1.4.4 Concreto  Otros de los procesos constructivos a los que hay que poner especial cuidado   son los que tienen que ver con el concreto.  La calidad final de este depende de los siguientes factores:    ◊  Características de los ingredientes.    ◊  Dosificación, es decir, la cantidad de cada ingrediente que debe usarse en la   preparación de la mezcla.    ◊  Producción.    ◊  Transporte.    ◊  Colocación.    ◊  Compactación.    ◊  Curado.  En el “Capítulo 3” de este manual, te damos algunas recomendaciones.  Figura 20. Buen ladrillo pero... estribo deficiente.  Escasa longitud del gancho. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 25  1.5 PROCESO CONSTRUCTIVO  Como  ya  se  ha  mencionado  anteriormente,  la  calidad  de  los  procesos    constructivos influye en la fortaleza o fragilidad de la estructura de una vivienda   y de todo tipo de edificaciones. A continuación veremos algunos ejemplos y sus   respectivas recomendaciones:  1.5.1 Espesor de las juntas  La Norma E-070 (*) nos dice lo siguiente:  “En  la  albañilería,  con  unidades  asentadas  con  mortero,  todas  las  juntas    horizontales  y  verticales  quedarán  completamente  llenas  de  mortero.  El    espesor de las juntas de mortero será como mínimo 10 mm y el espesor máximo   será 15 mm”.  La  razón  por  la  cual  la  Norma  limita  el  espesor  de  las  juntas  es  muy  sencilla.    Si  el  espesor  de  las  juntas  es  mayor  de  15  mm   (ver figura  21),   esto  hace  que  el    muro portante se debilite sustancialmente. Una manera práctica de evitar esto,   es  usando  el  escantillón  en  el  momento  en  que  se  está  asentando  el  ladrillo.    Además, se debe cuidar también, que la junta no sea menor de 10 mm, ya que no   pegaría bien ladrillo con ladrillo, es decir, la unión quedaría débil.  (*)  La  Norma  E-070  es  parte    del  Reglamento  Nacional  de  Edificaciones.    Esta  norma  nos    proporciona  importantes    recomendaciones  sobre    las     construcciones de albañilería.  Figura 21. Excesivo espesor de la junta. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 26  Por  otro  lado,  obsérvese  la  figura  22.  Ahí  se  ve  que  las  juntas  no  están    completamente  llenas  de  mortero.  Esto  debilita  el  muro  portante  y  por  lo    tanto, la estructura.  a. El endentado del muro  b. Las mechas de anclaje  Revisemos cada uno de los procedimientos:  a. Endentado del muro:  Como  se  sabe,  el  endentado  del  muro    recibirá  tanto,  el  vaciado  del  concreto  de  la    columna, logrando que la unión entre ambos   sea óptima.  La  Norma  E-070  se  refiere  a  este  tema  y    nos  dice:  “La  longitud  del  diente  no  debe    exceder  los  5  cm  y  deberá  limpiarse  de  los    desperdicios  de  mortero  y  de  partículas    sueltas  antes  de  vaciar  el  concreto  de  la    columna de confinamiento.”  1.5.2 Unión muro portante - columna  Para  que  todos  los  elementos  estructurales  (vigas,  columnas,  techos,  muros,    cimientos) trabajen  en  conjunto,  como  si  se tratara  de  una  sola  pieza,  es  muy    importante  que  la  unión  entre  ellos  sea  buena;  por  ejemplo,  la  unión  entre  el    muro  portante  y  sus  columnas  de  confinamiento  debe  ser  consistente   (ver   figura 23).  En la obra, esta buena unión se logra mediante dos procedimientos:  Figura 22. Fraguado deficiente. Zona débil susceptible al agrietamiento.  Figura 23.  Máx. 5cm Longitud del diente \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 27  Si  el  “diente”  es  mayor  de  5  cm,   (ver  figura    23),   es  probable  que  este  se  rompa  debido  al    peso  del  concreto  que  lo  impacta  cuando  se    hace  el  vaciado.  Y  si  el  “diente”  no  se  rompió    debido a este impacto, el concreto no llenará   completamente el espacio entre los “dientes”   y formará “cangrejeras”.  (ver figura 24).  b. Mechas de anclaje:  En  el  caso  de  emplearse  una  conexión  a  ras,  se  deberá  contar  además  con    “mechas”  de  anclaje  compuestas  por  Corrugado  4.7  mm.  de  Aceros  Arequipa.    (ver capítulo 2, figura 42).  1.5.3 Instalaciones eléctricas y sanitarias  a. Instalaciones secas: eléctricas y telefónicas  Oportunamente, debes proveer a los muros de los espacios y canales requeridos   para  alojar  tuberías  y  cajas  de  las  instalaciones  eléctricas   (ver  figura  25)   para    evitar así el inconveniente y peligroso picado de los muros luego de construidos   (ver figura 26).  Si picamos, debilitamos los muros portantes (estructura).  Figura 25.  Concreto Caja Rectangular Planta ELEVACIÓN  Figura 24. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 28  Los tubos  para  las  instalaciones  eléctricas, telefónicas,  etc.,  se  alojarán  en  los    muros, solo cuando estos tengan un diámetro menor o igual a 55 mm. Si esto   sucediera, la colocación de los tubos en los muros se hará en cavidades dejadas   durante  la  construcción  de  los  muros  portantes  que  luego  se  rellenarán  con    concreto. Si no fuera así, se colocarán en los alvéolos (huecos) de los ladrillos.   Siempre,  los  recorridos  de  las  tuberías  serán  verticales   (ver  figura  26)   y  por    ningún motivo se picará o se recortará el muro para colocarlas.  b. Instalaciones sanitarias  Algunas  veces,  se  suele  colocar  las    tuberías  después  de  construidos  los    muros  portantes.  Para  hacerlo,  pican    la  albañilería,  instalan  el  tubo  y  luego    resanan  la  zona  afectada  con  mortero.    Este  es  un  procedimiento  constructivo    incorrecto  que  afecta  a  la  estructura  y  la    debilita    (ver  figura  27).   Por  esta  razón,  la    Norma Técnica no lo aprueba.  Para  este  caso,  en  particular,  la  Norma    E–070  dice  lo  siguiente:  “Los  tubos  para    las instalaciones sanitarias y los tubos con   diámetros  mayores  que  55  mm,  deben    tener  recorridos  fuera  de  los  muros    portantes  o  en  falsas  columnas,  o  en    ductos especiales o también en muros no   portantes (tabiques)”.  Figura 26. No picar muro portante. ¡Se debilita!  Figura 27.    Pésimo \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 29  El muro que se utilice para pasar los tubos con diámetros mayores que 55 mm   ya no será portante. Se debe tratar de usar muros que están en la dirección en   la que hay más muros portantes (por ejemplo en la dirección Y de la figura 12).   Para dividir el muro adecuadamente y que siga siendo portante, se debe colocar   columnas de confinamiento en cada extremo.  Para construir la falsa columna se puede seguir este procedimiento:    ◊  Envuelve previamente el tubo con alambre N° 16.    ◊  Coloca el tubo antes que empieces el asentado del ladrillo.    ◊  Asienta el ladrillo dejándolo endentado a ambos lados del tubo.    ◊  Coloca una mecha en cada hilada conforme vas asentando el ladrillo, cuidando   de colocarlo alternadamente uno a cada lado del muro.  (ver figura 28).    ◊   Prepara  y  vacía  cuidadosamente  el  concreto  con  una  consistencia  un  poco    más fluida que el que normalmente preparas para las columnas.  Concreto: f’c = 175kg/cm2   Cemento/Arena/Confitillo 1:2 11/2    ◊  Compacta cuidadosamente.  Figura 28. 1   6 mm. corrugado en cama de  mortero cada 1 hilada (alternando lado muro).  Mecha   Planta Tubo PVC 4”50 cm50 cm ELEVACIÓN  1 ,3 ,5 ,etc. hiladaoo   o 2 ,4 ,6 ,etc. hiladaoo   o \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 30    ◊   Para  darle  al  muro  un  acabado  final  de  calidad  y  evitar  rajaduras,  te    recomendamos utilizar la malla para tarrajeo, según el siguiente procedimiento:  1.-  Habilitar la malla a la medida y forma   requerida,  es  decir,  que  cubra  la  falsa    columna  en  toda  su  altura.  En  cuanto    a  su  ancho,  debe  sobrepasar  los  20  cm    más allá del endentado  (ver figura 29).  2.-  Fijar la malla con clavos (1”) al muro   que se va a tarrajear.  (ver figura 30).  3.-   Prepara  la  mezcla  (mortero)  en  la    proporción: 1 de cemento por 5 de arena   fina.  4..-  Procede a tarrajear el muro teniendo   cuidado  de  que  su  espesor  esté  entre    1.0 y 1.5 cm  (ver figura 31).  Tarrajeando sobre la malla fija.  Figura 31.  Malla colocada preparada para recibir el tarrajero.  Figura 30.  Fijando con clavos la malla para tarrajero.  Figura 29. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 31  2.1 DOBLADO DEL ACERO  2.1.1 Ganchos y dobleces  Las barras de acero se deben doblar por   diferentes  motivos,  por  ejemplo,  para    formar  los  estribos.  Estos  dobleces    deben  tener  un  diámetro  adecuado    para  no  dañar  el  acero   (ver  figura  32).    Por Estribos: fierro Aceros Arequipa 6 mm o 3/8” Ver planos  Sobrecimiento Cimiento \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 36  Veamos ahora cuatro aspectos importantes con relación a la columna:  2.2.1 Conexión entre columna de amarre y muro portante  Dado que las cargas que actúan en una   vivienda  convencional  son  elevadas,  es    importante  que  el  muro  de  ladrillo y  la    columna de amarre estén fuertemente   unidos,  para  que  así  ambos  puedan    soportar los efectos de estas fuerzas.  Esta  fuerte  y  sólida  unión  se  logra  por    medio  del  endentado  del  muro   (ver   figura  41).   Si  no  ha  sido  posible  hacer    el  endentado  del  muro,  entonces    tendrás que reforzarlo como se indica a   continuación:  Figura 41.   Endentado (ladrillos sobresallidos) ELEVACIÓN MURO Columna  Figura 42.   50   50 10 50COLUMNA PLANTA 2   corrugado 4.7 mm en cama de mortero cada 3 hiladas Si hay muro a ambos lados de la columna, colocar refuerzo, como se indica a continuación Si hay muro a un solo lado de la columna, colocar refuerzo, como se indica a continuación ELEVACIÓN  o  .   . . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 37  2.2.2 Conexión entre columna de amarre y viga transversal  Para lograr una conexión más efectiva entre la columna y la viga, puedes hacer   lo siguiente:    ◊  Luego que los muros llegaron a su altura (H), vaciar el concreto de las columnas   hasta donde se indica en la figura 43. Esta es la primera etapa.    ◊  La segunda etapa consiste en completar el vaciado del concreto de la columna,   como se indica en las figuras 43 y 44, lo que debe hacerse al mismo tiempo que   el vaciado del concreto de las vigas soleras y del techo.  Figura 43.   Concreto de columna vaciado junto con el techo y vigas (Segunda etapa) Sobrecimiento Nivel techo 40 cm H Cimiento Concreto vaciado después de levantar muro (Primera etapa) Nivel de vaciado 1   etapa \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 38  2.2.3 Separación máxima entre columnas de amarre  Según  el  Reglamento  Nacional  de  Edificaciones,  la  separación  máxima  entre    columnas  (ver figura 45)  debe ser el doble de la altura del paño de ladrillo (H). Si   es mayor, existe el riesgo de que aparezcan grietas en la parte central del muro.   Por otro lado, se recomienda que la altura de piso a techo (H) sea de 3 metros   como máximo.  Figura 44.    Viga solera 40 cm HRefuerzo de la viga, insertada en columna de confinamiento  Concreto de columna vaciado junto con el techo y vigas. (Segunda etapa). Concreto vaciado después de levantar muro. (Primera etapa). .  Figura 45.   Viga solera H Columna de amarre Separación máxima = 2H Altura de piso a techo (máximo 3 m)  . . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 39  Ejemplo:  Si  en  una vivienda  convencional  de  albañilería,  la  altura  del  paño  de  ladrillo  es    2.40  m  (altura  de  piso  a  techo),  entonces,  según  el  Reglamento  Nacional  de    Edificaciones, la separación entre ejes de columnas debe ser como máximo:  Separación máxima = 2 x 2.40 = 4.80 m.  Importante: no dice que deba ser 4.80 m, dice que, como máximo, debe llegar a   4.80 m  2.2.4 Reducción de sección de columnas  a. Cuando hay empalme:  Cuando hay que hacer empalmes del refuerzo de una columna en zonas donde   se  produce  disminución  en  las  medidas  de  su  sección  (ver  cortes YY, X-X  en  la    figura 46), se debe proceder de la siguiente manera:    ◊  Restar: T – t  Si el resultado es menor o igual a 7.5 cm, entonces:    ◊  El refuerzo de la columna del piso inferior se deberá doblar tal como se muestra   en  la  figura  46,  para  que  así  proveamos  las  mechas  correspondientes  para  el    empalme a realizarse en el piso superior.    ◊  La parte doblada deberá tener una inclinación menor o igual a la indicada en la   figura 47. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 40  Figura 46 y 47.  t T t b Y Inclinación máxima = 1:6 Empalme   Corte Y-Y (Columna más chica) T Corte X-X (Col
