ección y su refuerzo deben ser calculados según la intensidad del trabajo   que realiza el muro y según la separación entre columnas.  Si se tienen muros muy largos, se deberá colocar columnas cada 3 m o 3.5 m si   son de soga; o cada 5 m si son de cabeza. En la vivienda del ejemplo anterior, se   deberá colocar columnas tal como se muestra en la figura 15.  1.3.4 Losa Aligerada  Los  techos  forman  parte  de  la  estructura  de  una  vivienda,  están  hechos  de    concreto  armado  y  se  utilizan  como  entrepisos.  Pueden  apoyarse  sobre  los    muros portantes, vigas o placas.  Las losas aligeradas cumplen básicamente tres funciones:    ◊  Transmitir hacia los muros o vigas el peso de los acabados, su mismo peso, el   peso de los muebles, el de las personas, etc.    ◊   Transmitir  hacia  los  muros  las  fuerzas  que  producen  los  terremotos   (ver   figuras 11, 12 y 13).    ◊   Unir  los  otros  elementos  estructurales,  columnas,  vigas  y  muros,  para  que    toda la estructura trabaje en conjunto, como si fuera una sola unidad.  Para que se puedan cumplir a cabalidad estas funciones, debes tener en cuenta   las  siguientes  recomendaciones  con  relación  a  las  losas  aligeradas   (ver  figura    16).    ◊  Deben ser iguales en todos los pisos.    ◊  Como máximo: largo = 3 veces ancho.    ◊  Las aberturas para escaleras no deben ser excesivas ni en número ni en tamaño   y de preferencia deben estar ubicadas en la zona central. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 20  Figura 15. Planta típica. Columnas, vigas.  Viga amarre Viga amarre Columnas   Viga amarre Viga solera Viga solera Viga Viga solera Viga solera Viga solera Viga solera  Figura 16. Formas de losas aligeradas.  Aceptable Azotea Evitar Aberturas Largo   Ancho  3 pisoo 2 pisoo 1 pisoo \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 21  1.4 COMPONENTES DE LA ALBAÑILERÍA CONFINADA  En este tipo de construcciones, los componentes que se usan son los siguientes:  Veamos ahora cada uno estos componentes en detalle.  1.4.1 Ladrillo  En  el  mercado  existe  actualmente  diversos  tipos  de  ladrillos  con  los  cuales    se  pueden  construir  los  muros  portantes. Algunos  son  de  buena  calidad,  pero    hay otros que no deben utilizarse. En general, existen dos tipos de ladrillos: los   sólidos y los tubulares.  Los ladrillos tubulares son los ladrillos pandereta  (ver figura 17),  los cuales, como   ya se explicó anteriormente, no son los más apropiados para la construcción de   los muros portantes por su poca resistencia y fragilidad. Los ladrillos King Kong   son los que más se usan. En el mercado existen dos tipos:    ◊  Ladrillo     ◊  Fierro de Construcción    ◊  Mortero     ◊  Concreto  He  aquí  algunas  recomendaciones  a  tener  en  cuenta  al  momento  de  comprar    nuestros ladrillos:    ◊  Deben cumplir las exigencias de la Norma Técnica E070.    ◊  No deben tener materias extrañas en su superficie o interior  (ver figura 18).    ◊  Deben estar bien cocidos, no quemados.    ◊  Deben emitir un sonido metálico al golpearlo con un martillo.    ◊  No deben estar agrietados  (ver figura 19).    ◊  No deben presentar manchas blanquecinas de origen salitroso.  Es poco resistente y poco durable. Ladrillo artesanal.Ladrillo Arcilla cocida (King Kong).   Ladrillo maquinado. Es más resistente y más durable. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 22  1.4.2 Mortero  El mortero es un elemento clave en la capacidad resistente del muro portante.   No debes olvidar que las funciones básicas del mortero son:    ◊  Pegar o unir ladrillo con ladrillo.    ◊  Corregir las irregularidades de los ladrillos.  Dada la importancia de este componente, es necesario preparar un mortero de   buena calidad. Para eso debes tener cuidado con dos aspectos fundamentales:  a. La calidad de sus ingredientes.  b. La dosificación, es decir, la cantidad de cada ingrediente que debe usarse en   la preparación de la mezcla.  Figura 17, 18 y 19.  Figura 17   Figura 18 Figura 19  Mortero = Cemento + Arena gruesa + Agua. . . . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 23  a. Calidad de los ingredientes:  Cemento:  - Debe ser fresco.  Arena:  - Debe ser limpia, sin restos de plantas, cáscaras, etc.  Agua:  - Bebible.  - Limpia.  - Libre de ácidos.  b. Dosificación:  La  dosificación  volumétrica  apropiada  está  descrita  en  la  Norma  Técnica  de    Edificaciones E-070. Estas son las medidas:  Ambos morteros se usan en muros portantes.  1.4.3 Fierro de Construcción  La  calidad  de  las  estructuras  de  concreto  armado  depende  en  gran  medida    de la eficiencia de la mano de obra empleada en su construcción. Los mejores   materiales e ingeniería utilizados en el diseño estructural carecen de efectividad   si los procesos constructivos no se han realizado en forma correcta  (ver figura   20).  Uno de los procesos constructivos más importantes es la calidad del habilitado   del  refuerzo  que  se  colocará  en  la  estructura.  Hay  que  cuidar  que  este  tenga    las  adecuadas  “dimensiones  y  formas”,  así  como  también  que  cumpla  las    especificaciones indicadas en los planos estructurales.  Precisamente  en  el  “Capítulo  2”,  te  daremos  algunas  recomendaciones    importantes sobre los fierros.  P1   1   3 - 3.5 P2   1   4 - 5 Tipo   Cemento   Arena \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 24  1.4.4 Concreto  Otros de los procesos constructivos a los que hay que poner especial cuidado   son los que tienen que ver con el concreto.  La calidad final de este depende de los siguientes factores:    ◊  Características de los ingredientes.    ◊  Dosificación, es decir, la cantidad de cada ingrediente que debe usarse en la   preparación de la mezcla.    ◊  Producción.    ◊  Transporte.    ◊  Colocación.    ◊  Compactación.    ◊  Curado.  En el “Capítulo 3” de este manual, te damos algunas recomendaciones.  Figura 20. Buen ladrillo pero... estribo deficiente.  Escasa longitud del gancho. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 25  1.5 PROCESO CONSTRUCTIVO  Como  ya  se  ha  mencionado  anteriormente,  la  calidad  de  los  procesos    constructivos influye en la fortaleza o fragilidad de la estructura de una vivienda   y de todo tipo de edificaciones. A continuación veremos algunos ejemplos y sus   respectivas recomendaciones:  1.5.1 Espesor de las juntas  La Norma E-070 (*) nos dice lo siguiente:  “En  la  albañilería,  con  unidades  asentadas  con  mortero,  todas  las  juntas    horizontales  y  verticales  quedarán  completamente  llenas  de  mortero.  El    espesor de las juntas de mortero será como mínimo 10 mm y el espesor máximo   será 15 mm”.  La  razón  por  la  cual  la  Norma  limita  el  espesor  de  las  juntas  es  muy  sencilla.    Si  el  espesor  de  las  juntas  es  mayor  de  15  mm   (ver figura  21),   esto  hace  que  el    muro portante se debilite sustancialmente. Una manera práctica de evitar esto,   es  usando  el  escantillón  en  el  momento  en  que  se  está  asentando  el  ladrillo.    Además, se debe cuidar también, que la junta no sea menor de 10 mm, ya que no   pegaría bien ladrillo con ladrillo, es decir, la unión quedaría débil.  (*)  La  Norma  E-070  es  parte    del  Reglamento  Nacional  de  Edificaciones.    Esta  norma  nos    proporciona  importantes    recomendaciones  sobre    las     construcciones de albañilería.  Figura 21. Excesivo espesor de la junta. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 26  Por  otro  lado,  obsérvese  la  figura  22.  Ahí  se  ve  que  las  juntas  no  están    completamente  llenas  de  mortero.  Esto  debilita  el  muro  portante  y  por  lo    tanto, la estructura.  a. El endentado del muro  b. Las mechas de anclaje  Revisemos cada uno de los procedimientos:  a. Endentado del muro:  Como  se  sabe,  el  endentado  del  muro    recibirá  tanto,  el  vaciado  del  concreto  de  la    columna, logrando que la unión entre ambos   sea óptima.  La  Norma  E-070  se  refiere  a  este  tema  y    nos  dice:  “La  longitud  del  diente  no  debe    exceder  los  5  cm  y  deberá  limpiarse  de  los    desperdicios  de  mortero  y  de  partículas    sueltas  antes  de  vaciar  el  concreto  de  la    columna de confinamiento.”  1.5.2 Unión muro portante - columna  Para  que  todos  los  elementos  estructurales  (vigas,  columnas,  techos,  muros,    cimientos) trabajen  en  conjunto,  como  si  se tratara  de  una  sola  pieza,  es  muy    importante  que  la  unión  entre  ellos  sea  buena;  por  ejemplo,  la  unión  entre  el    muro  portante  y  sus  columnas  de  confinamiento  debe  ser  consistente   (ver   figura 23).  En la obra, esta buena unión se logra mediante dos procedimientos:  Figura 22. Fraguado deficiente. Zona débil susceptible al agrietamiento.  Figura 23.  Máx. 5cm Longitud del diente \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 27  Si  el  “diente”  es  mayor  de  5  cm,   (ver  figura    23),   es  probable  que  este  se  rompa  debido  al    peso  del  concreto  que  lo  impacta  cuando  se    hace  el  vaciado.  Y  si  el  “diente”  no  se  rompió    debido a este impacto, el concreto no llenará   completamente el espacio entre los “dientes”   y formará “cangrejeras”.  (ver figura 24).  b. Mechas de anclaje:  En  el  caso  de  emplearse  una  conexión  a  ras,  se  deberá  contar  además  con    “mechas”  de  anclaje  compuestas  por  Corrugado  4.7  mm.  de  Aceros  Arequipa.    (ver capítulo 2, figura 42).  1.5.3 Instalaciones eléctricas y sanitarias  a. Instalaciones secas: eléctricas y telefónicas  Oportunamente, debes proveer a los muros de los espacios y canales requeridos   para  alojar  tuberías  y  cajas  de  las  instalaciones  eléctricas   (ver  figura  25)   para    evitar así el inconveniente y peligroso picado de los muros luego de construidos   (ver figura 26).  Si picamos, debilitamos los muros portantes (estructura).  Figura 25.  Concreto Caja Rectangular Planta ELEVACIÓN  Figura 24. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 28  Los tubos  para  las  instalaciones  eléctricas, telefónicas,  etc.,  se  alojarán  en  los    muros, solo cuando estos tengan un diámetro menor o igual a 55 mm. Si esto   sucediera, la colocación de los tubos en los muros se hará en cavidades dejadas   durante  la  construcción  de  los  muros  portantes  que  luego  se  rellenarán  con    concreto. Si no fuera así, se colocarán en los alvéolos (huecos) de los ladrillos.   Siempre,  los  recorridos  de  las  tuberías  serán  verticales   (ver  figura  26)   y  por    ningún motivo se picará o se recortará el muro para colocarlas.  b. Instalaciones sanitarias  Algunas  veces,  se  suele  colocar  las    tuberías  después  de  construidos  los    muros  portantes.  Para  hacerlo,  pican    la  albañilería,  instalan  el  tubo  y  luego    resanan  la  zona  afectada  con  mortero.    Este  es  un  procedimiento  constructivo    incorrecto  que  afecta  a  la  estructura  y  la    debilita    (ver  figura  27).   Por  esta  razón,  la    Norma Técnica no lo aprueba.  Para  este  caso,  en  particular,  la  Norma    E–070  dice  lo  siguiente:  “Los  tubos  para    las instalaciones sanitarias y los tubos con   diámetros  mayores  que  55  mm,  deben    tener  recorridos  fuera  de  los  muros    portantes  o  en  falsas  columnas,  o  en    ductos especiales o también en muros no   portantes (tabiques)”.  Figura 26. No picar muro portante. ¡Se debilita!  Figura 27.    Pésimo \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 29  El muro que se utilice para pasar los tubos con diámetros mayores que 55 mm   ya no será portante. Se debe tratar de usar muros que están en la dirección en   la que hay más muros portantes (por ejemplo en la dirección Y de la figura 12).   Para dividir el muro adecuadamente y que siga siendo portante, se debe colocar   columnas de confinamiento en cada extremo.  Para construir la falsa columna se puede seguir este procedimiento:    ◊  Envuelve previamente el tubo con alambre N° 16.    ◊  Coloca el tubo antes que empieces el asentado del ladrillo.    ◊  Asienta el ladrillo dejándolo endentado a ambos lados del tubo.    ◊  Coloca una mecha en cada hilada conforme vas asentando el ladrillo, cuidando   de colocarlo alternadamente uno a cada lado del muro.  (ver figura 28).    ◊   Prepara  y  vacía  cuidadosamente  el  concreto  con  una  consistencia  un  poco    más fluida que el que normalmente preparas para las columnas.  Concreto: f’c = 175kg/cm2   Cemento/Arena/Confitillo 1:2 11/2    ◊  Compacta cuidadosamente.  Figura 28. 1   6 mm. corrugado en cama de  mortero cada 1 hilada (alternando lado muro).  Mecha   Planta Tubo PVC 4”50 cm50 cm ELEVACIÓN  1 ,3 ,5 ,etc. hiladaoo   o 2 ,4 ,6 ,etc. hiladaoo   o \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 30    ◊   Para  darle  al  muro  un  acabado  final  de  calidad  y  evitar  rajaduras,  te    recomendamos utilizar la malla para tarrajeo, según el siguiente procedimiento:  1.-  Habilitar la malla a la medida y forma   requerida,  es  decir,  que  cubra  la  falsa    columna  en  toda  su  altura.  En  cuanto    a  su  ancho,  debe  sobrepasar  los  20  cm    más allá del endentado  (ver figura 29).  2.-  Fijar la malla con clavos (1”) al muro   que se va a tarrajear.  (ver figura 30).  3.-   Prepara  la  mezcla  (mortero)  en  la    proporción: 1 de cemento por 5 de arena   fina.  4..-  Procede a tarrajear el muro teniendo   cuidado  de  que  su  espesor  esté  entre    1.0 y 1.5 cm  (ver figura 31).  Tarrajeando sobre la malla fija.  Figura 31.  Malla colocada preparada para recibir el tarrajero.  Figura 30.  Fijando con clavos la malla para tarrajero.  Figura 29. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 31  2.1 DOBLADO DEL ACERO  2.1.1 Ganchos y dobleces  Las barras de acero se deben doblar por   diferentes  motivos,  por  ejemplo,  para    formar  los  estribos.  Estos  dobleces    deben  tener  un  diámetro  adecuado    para  no  dañar  el  acero   (ver  figura  3 m   25 cm Estribos: fierro Aceros Arequipa 6 mm o 3/8” Ver planos  Sobrecimiento Cimiento \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 36  Veamos ahora cuatro aspectos importantes con relación a la columna:  2.2.1 Conexión entre columna de amarre y muro portante  Dado que las cargas que actúan en una   vivienda  convencional  son  elevadas,  es    importante  que  el  muro  de  ladrillo y  la    columna de amarre estén fuertemente   unidos,  para  que  así  ambos  puedan    soportar los efectos de estas fuerzas.  Esta  fuerte  y  sólida  unión  se  logra  por    medio  del  endentado  del  muro   (ver   figura  41).   Si  no  ha  sido  posible  hacer    el  endentado  del  muro,  entonces    tendrás que reforzarlo como se indica a   continuación:  Figura 41.   Endentado (ladrillos sobresallidos) ELEVACIÓN MURO Columna  Figura 42.   50   50 10 50COLUMNA PLANTA 2   corrugado 4.7 mm en cama de mortero cada 3 hiladas Si hay muro a ambos lados de la columna, colocar refuerzo, como se indica a continuación Si hay muro a un solo lado de la columna, colocar refuerzo, como se indica a continuación ELEVACIÓN  o  .   . . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 37  2.2.2 Conexión entre columna de amarre y viga transversal  Para lograr una conexión más efectiva entre la columna y la viga, puedes hacer   lo siguiente:    ◊  Luego que los muros llegaron a su altura (H), vaciar el concreto de las columnas   hasta donde se indica en la figura 43. Esta es la primera etapa.    ◊  La segunda etapa consiste en completar el vaciado del concreto de la columna,   como se indica en las figuras 43 y 44, lo que debe hacerse al mismo tiempo que   el vaciado del concreto de las vigas soleras y del techo.  Figura 43.   Concreto de columna vaciado junto con el techo y vigas (Segunda etapa) Sobrecimiento Nivel techo 40 cm H Cimiento Concreto vaciado después de levantar muro (Primera etapa) Nivel de vaciado 1   etapa \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 38  2.2.3 Separación máxima entre columnas de amarre  Según  el  Reglamento  Nacional  de  Edificaciones,  la  separación  máxima  entre    columnas  (ver figura 45)  debe ser el doble de la altura del paño de ladrillo (H). Si   es mayor, existe el riesgo de que aparezcan grietas en la parte central del muro.   Por otro lado, se recomienda que la altura de piso a techo (H) sea de 3 metros   como máximo.  Figura 44.    Viga solera 40 cm HRefuerzo de la viga, insertada en columna de confinamiento  Concreto de columna vaciado junto con el techo y vigas. (Segunda etapa). Concreto vaciado después de levantar muro. (Primera etapa). .  Figura 45.   Viga solera H Columna de amarre Separación máxima = 2H Altura de piso a techo (máximo 3 m)  . . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 39  Ejemplo:  Si  en  una vivienda  convencional  de  albañilería,  la  altura  del  paño  de  ladrillo  es    2.40  m  (altura  de  piso  a  techo),  entonces,  según  el  Reglamento  Nacional  de    Edificaciones, la separación entre ejes de columnas debe ser como máximo:  Separación máxima = 2 x 2.40 = 4.80 m.  Importante: no dice que deba ser 4.80 m, dice que, como máximo, debe llegar a   4.80 m  2.2.4 Reducción de sección de columnas  a. Cuando hay empalme:  Cuando hay que hacer empalmes del refuerzo de una columna en zonas donde   se  produce  disminución  en  las  medidas  de  su  sección  (ver  cortes YY, X-X  en  la    figura 46), se debe proceder de la siguiente manera:    ◊  Restar: T – t  Si el resultado es menor o igual a 7.5 cm, entonces:    ◊  El refuerzo de la columna del piso inferior se deberá doblar tal como se muestra   en  la  figura  46,  para  que  así  proveamos  las  mechas  correspondientes  para  el    empalme a realizarse en el piso superior.    ◊  La parte doblada deberá tener una inclinación menor o igual a la indicada en la   figura 47. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 40  Figura 46 y 47.  t T t b Y Inclinación máxima = 1:6 Empalme   Corte Y-Y (Columna más chica) T Cort gura 50   Figura 51  Muro portante con viga solera. El muro trabaja en toda su longitud. ¡Es mucho mejor!  . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 43  Los  estribos  serán  espaciados  según  lo  ordenen  los  planos  correspondientes,    teniendo  en  cuenta  que  en  el  centro  la  separación  máxima  es  25  cm  y  en  los    extremos debe ser 10 cm  (ver figura 54).  Figura 52 y 53.  Viga solera (VS) Ancho mínimo Refuerzo mínimo VS: 4 barras de 3/8” Estribos: fierro de 6 mm o 3/8” 1 a 5 cm, 5 a 10 cm, resto: 1 a 25 cm Losa aligerada Viga solera (VS) Ancho mínimo Losa aligerada 25 cm   15 cm 20 cm ó Mínimo 17 cm 20 cm ó Mínimo 17 cmMuro de ladrillo (cabeza) Muro de ladrillo (soga) Figura 52   Figura 53  Figura 54.  Estribos: Fierro de 6 mm o 3/8” 1 a 5 cm, 5 a 10 cm, en cada extremo, resto: 1 a 25 cm Estribado mínimo 40 mm \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 44  2.3.1 Encofrado de vigas  Los  elementos  principales  de  los  encofrados  de  vigas  son:  el    fondo    del      encofrado,  los  tableros  de  los  costados  formados  por  tablas,  barrotes  y    tornapuntas de soporte, y las “T”, formada por los cabezales, los pies derechos   y las crucetas.  El fondo generalmente está formado por tablas o tablones de 1 1/2” de sección   por el ancho que corresponde al ancho de las vigas.  En  los  tableros  de  los  costados,  se  emplea  tablas  de  1”  o  de  1  1/2”  montadas    sobre barrotes de 2” x 3” o 2” x 4” de sección.  Las “T” de madera cumplen la función de soportar las cargas. Los pies derechos   y cabezales deben tener secciones de 2” x 3” o 2” x 4” y la altura requerida para   alcanzar el nivel del vaciado  (ver figura 55).  En  primer  lugar,  se  colocarán  los  pies  derechos  que  soportarán  el  encofrado.    Estos  se  regulan  al  contacto  con  el  suelo  por  medio  de  cuñas  de  madera.  Por    ningún motivo se debe utilizar piedras, cartón o cualquier otro material débil,   pues pueden fallar con el peso al que serán sometidos.  Figura 55. Estructura del encofrado de vigas. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 45  La distancia entre estos pies derechos deberá ser como máximo de 90 cm, de   ser mayor se podrían producir hundimientos en el entablado  (ver figura 56).  Los tablones o tableros de los costados, que servirán para dar forma a la sección   de viga, contarán con espaciadores de madera y pasadores de alambre N° 8  (ver   figura 57).  Con estos dos elementos se garantiza que el ancho de las vigas sea el   que se especifica en los planos.  Figura 56. Elementos del encofrado de vigas  Figura 57. Espaciadores.  e \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 46  Los barrotes, que sirven de apoyo a los tablones de los costados de la viga, serán   soportados por elementos diagonales llamados tornapuntas, que los arriostran   con los cabezales de las “T”.  Una  vez  armado  el  encofrado,  debe  verificarse  que  esté  perfectamente    horizontal. Para eso, contamos con la ayuda de un nivel de mano.  CONSIDERACIONES    ◊  Antes  de  empezar  a  encofrar,  se  deberá verificar  que  la  superficie  del  suelo    sobre  la  cual  se  apoyarán  los  puntales,  esté  bien  compactada  y  tenga  de    preferencia falso piso. De esta manera, evitaremos que los puntales se hundan   y desnivelen el encofrado.    ◊  No es recomendable usar pies derechos que estén conformados por piezas de   madera empalmadas, ya que los empalmes podrían fallar durante el vaciado y   producir hundimiento del encofrado y posibles accidentes.  2.3.2 Fierro en vigas  Los  planos  de  estructuras  especificarán  las  medidas  de  los  cortes  y  de  los    doblados de las barras longitudinales y de los estribos de las vigas.  Durante  la  instalación  de  la  armadura,  debe  verificarse  que  los  diámetros  de    las  varillas  utilizadas  concuerden  con  el  plano  de  estructuras.  También,  debe    comprobarse que el espaciamiento de los estribos sea el indicado, en especial   en las zonas pegadas a las columnas, ya que allí siempre se especifica una mayor   concentración.  Por ejemplo, si el plano dice:  2 @ 0.05, 4 @ 0.10 y resto @ 0.25 c/ext. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 47  Esto significa que los estribos se deben de colocar de la siguiente manera:  También  se  debe  revisar  que  las  armaduras  de  fierro  no  choquen  en  ningún    punto con sus encofrados. Esto garantizará que después del vaciado, las piezas   de fierro tengan el debido recubrimiento de concreto. Para esto, se deben usar   dados de concreto que permitan los siguientes recubrimientos  (ver figura 59):    ◊  En vigas de confinamiento, el recubrimiento debe tener 3 cm.    ◊  Para las vigas peraltadas, este recubrimiento deberá ser de 4 cm.    ◊  Para las vigas chatas, bastará con 2 cm.  Figura 59. Armaduras de fierro y encofrados  Empalme Recubrimiento   Estribos Viga de confinamiento Dado de concreto Viga peraltada Encofrado Detalle del doblado Dado de concreto Muro El fierro no debe tocar al encofrado  . Figura 58. Elementos de encofrados de losas aligeradas  Viga 2 Estribos cada 5 cm 4 Estribos cada 10 cm El resto cada 25 cm Columna   Columna   Columna Viga   Viga  . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 48  Otro  aspecto  importante  a  revisar,  es  la  ubicación  y  la  longitud  de  empalme    entre  barras  longitudinales.  En  cuanto  a  la  ubicación,  los  empalmes  de  los    fierros, que se encuentran en la parte superior de la viga, deberán hacerse en la   zona central; mientras que el empalme de los fierros, que se encuentran en la   parte inferior de la viga, deberá hacerse cerca de sus extremos  (ver figura 60).  Las  longitudes  mínimas  de  traslape  de  las  barras  serán  las  indicadas  en  los    planos de estructuras.  Cuando dos vigas se encuentren en una esquina, deberán hacerse ganchos de   doblado horizontales en ambas. La longitud de estos ganchos se especifica en   los planos de estructuras  (ver figura 61).  Figura 60. Zonas recomendabes para empalmes  Columna L/3   L/3   L/3 L/4L/4L/4 Viga h L/4  . Figura 61. Ganchos de doblado . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 49  Todos los dobleces deberán hacerse en frío, respetando el diámetro mínimo de   doblado para no causar fisuras en la barra.  CONSIDERACIONES    ◊  Se debe empalmar como máximo la mitad de las varillas que se encuentren en   una misma sección.    ◊   Se  deben  alternar  los  empalmes.  Si  no  se  puede,  y  solo  se  van  a  colocar    concentrados  en  una  sección,  habrá  que  aumentar  su  longitud  por  un  factor    que depende del diámetro de la varilla.    ◊  Nunca se debe empalmar en cambios de sección.  2.4 LOSAS ALIGERADAS  Las  losas  aligeradas, comúnmente   llamadas   techos, son   elementos   estructurales   importantes  que  deben  ser  diseñados  y  construidos   cuidadosamente.  Están    conformadas por viguetas, ladrillos, losa y refuerzo  (ver figura 62).  2.4.1 Encofrado de la losa aligerada  Los  ladrillos  para  techos  generalmente  miden  30  cm  de  ancho  por  30  cm  de    largo, con diferentes alturas que dependen de la longitud libre de los techos y   que pueden ser de 12 cm, 15 cm o 20 cm.  Según el  espesor de la losa  aligerada indicada en los planos, el alto de los  ladrillos   debe  ser  5  cm  menor  que  el  espesor  del  techo  propuesto.  Por  ejemplo,  si  se    trata de aligerado de 25 cm, el alto de los ladrillos será de 20 cm.  Figura 62. Detalle general aligerado  Refuerzo diámetro variable ver casos Refuerzo por temperatura Corrugado 4.7 mm. o 6 mm. cada de 25 cm  Losa5 cm 10   30 cm   10 12 ó 15 cm Ladrillo de techo Vigueta  . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 50  Cada m 2  de una losa aligerada que tiene   un  espesor  de  20  cm  tiene  un  peso  de    300  kg  aproximadamente.  Asimismo,    para  un  espesor  determinado  de  losa    tenemos  los  siguientes  pesos.  (Estos    valores  no  consideran  el  peso  de  los    trabajadores y herramientas durante la   construcción).  17 20 25 30 270 300 350 400 Espesor de losa (cm)   kg/m2  Los encofrados de las losas aligeradas están constituidos por  (ver figura 63):    ◊  Tablones de 1 1/2” de espesor por   8” de ancho mínimo.    ◊  Soleras de 2” x 4” de sección.    ◊  Pies derechos (o puntales)      de 2” x 3” de sección.    ◊   Frisos  de  1  1/2”  de  sección,  en    alturas variables, según el espesor   del techo aligerado.  Para  armar  el  encofrado  será    necesario  contar  con  soleras    corridas  soportadas  por  pies    derechos  espaciados  como    máximo a cada 90 cm.  Luego, se procederá a colocar los tablones  sobre las soleras (en sentido  contrario   a  estas).  Estos  tablones  servirán  para  apoyar  los  ladrillos  y  para  ser  fondo  de    encofrado de las viguetas, por tal motivo el espacio entre los ejes de tablón a   tablón será de 40 cm.  Para delimitar el vaciado del techo, se colocarán frisos en los bordes de la losa,   con una altura igual a su espesor.  Finalmente,  por  seguridad,  se  colocarán  refuerzos  laterales  en  los  puntales    o  pies  derechos  que  soportan  el  encofrado.  Se  recomienda  que  estos  vayan    extendidos  horizontalmente y  amarren todos  los  puntales  en  la  parte  central    de los mismos.  Figura 63. Techo aligerado . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 51  CONSIDERACIONES    ◊  Al igual que en las vigas, para regular la altura de los pies derechos al contacto   con el suelo, no deben usarse piedras ni triplay o cualquier otro material débil,   pues pueden fallar con el peso al que serán sometidos.    ◊   Los  pies  derechos  deben  estar  en  posición  vertical  y  no  inclinados  para  que    puedan funcionar adecuadamente en el apuntalamiento del techo.    ◊   Una  vez  armado  el  encofrado,  debe  verificarse  que  esté  perfectamente    horizontal.    De  lo  contrario,  después  se  tendrá  que  corregir,  por  un  lado,  con  el    tarrajeo  del cielo raso, y por otro, con el contrapiso del  nivel superior y ocasionará   gastos innecesarios.  2.4.2 Preparación de la losa  a. Colocación de los ladrillos de techo  Una vez que el entablado del techo se ha terminado, y que el fierro de las vigas   ya  esté  ubicado,  se  procederá  a  la  colocación  de  los  ladrillos  y  luego  a  la  del    fierro en las viguetas y la losa de techo  (ver figura 64).  Cuando  se  coloquen  los  ladrillos  de techo,  estos  deberán  estar  alineados  uno    detrás  de  otro,  sin  que  queden  espacios  vacíos  entre  ellos  para  evitar  que  se    filtre el concreto durante el vaciado. Se deberá verificar que estos ladrillos no   estén rajados ni partidos.  Figura 64. Proceso para colocar ladrillos en el techo  Fierro de vigueta   Ladrillo de techo Dado de concreto Espacio para vaciar las viguetas Fierro de temperatura Fierro viga  . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 52  b. Instalaciones sanitarias y eléctricas  Dentro  de  una  losa  aligerada  de  techo,  quedan  empotradas  una  serie  de    instalaciones,  como  las tuberías  de  la  red  de  agua y  desagüe y  las tuberías  de    electricidad que alimentan a los puntos de luz. Por esta razón, es muy importante   tomar  precauciones  (sobre  todo  con  las  tuberías  de  desagüe)  para  evitar  que    atraviesen las viguetas y corten su continuidad y resistencia. En el caso de las   tuberías de luz, las cajas octogonales no deben colocarse sobre el encofrado de   las viguetas, sino en el lugar de los ladrillos.  Si  en  algunas  zonas  hubiese  una  concentración  de  estas tuberías  de  desagüe,    sería  recomendable  convertir  esta  área  de  losa  aligerada  en  losa  maciza,  es    decir,  retirar  los  ladrillos  y  vaciar  toda  el  área  en  concreto  con  su  respectivo    refuerzo de fierro  (ver figura 65).  Igualmente, a veces existen muchos cruces de tuberías de agua o luz dentro de   la losa de concreto que va sobre los ladrillos. Como esta losa tiene solo 5 cm de   espesor, estas tuberías pueden quedar expuestas o con muy poco recubrimiento.   En estos casos, es necesario amarrarlas con alambre N° 16 y tratar de pegarlas   contra los ladrillos lo más que se pueda.  Figura 65. Procedimiento al toparse con tuberías de desagüe . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 53  2.4.3 Tuberías que pasan a través de la losa aligerada  Hay  que  evitar  que  los  tubos  de  las  instalaciones  sanitarias  atraviesen  las    viguetas  del  techo,  las  vigas  chatas  o  las  peraltadas   (ver  figura  66),   ya  que    los  debilitan.  Si  por  alguna  razón  hay  que  colocar  tubos  en  la  posición  que  se    muestra  en  la   (figura  66) ,  entonces  se  deberán  colocar  adosados  al techo  por    la parte inferior o superior  (ver figura 67);  de lo contrario, se deben cambiar sus   posiciones y colocarlos, como indica la  (figura 68) , dentro del ladrillo de techo.  Figura 66.  Viguetas Ladrillo de techo  Tubo P.V.C   4”  ó   2”  Figura 67.  Techo Tubo adosado 4” o 2” Muro de ladrillo Refuerzo viga solera  Figura 68.   Ladrillo de techo  Tubo P.V.C   4”  ó   2” \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 54  c. Colocación del fierro en viguetas y losa  El fierro de viguetas se coloca entre las filas de ladrillo de techo y se enganchan   en el fierro de las vigas de confinamiento que van sobre los muros de ladrillo.  El fierro de la losa, llamado también fierro de temperatura, se coloca sobre los   ladrillos  y  en  sentido  perpendicular  a  las  viguetas,  apoyados  sobre  dados  de    concreto de 2 cm. de espesor, que se colocan encima de los ladrillos de techo   (ver figura 69).  El fierro de temperatura tiene como función evitar el agrietamiento de la losa.   Generalmente, se utiliza varillas de 6 mm o 4.7 mm. Estas varillas se amarran a   los bastones de las viguetas y a las vigas de amarre cada 25 cm de distancia.  En  la  figura  70  se  muestran  los  detalles  para  el  anclaje  del  refuerzo  de  las    viguetas  de  la  losa  aligerada.  En  el  primer  detalle,  el  aligerado  se  apoya  en  un    muro de cabeza y en el segundo, el aligerado se apoya en un muro de soga; en   caso se debe doblar también el fierro de abajo.  Figura 69. Colocación del fierro en viguetas y losa   Viga de confinamiento   Vigueta Dados para recubrimiento  . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 55  d. Encofrado de frisos  Posteriormente, cuando el techo aligerado está encofrado y las vigas y viguetas   armadas, se procede a colocar los frisos en todo el contorno del techo aligerado.  Los frisos deben ser de madera de 1 1/2” de espesor y la altura de estos se define   de acuerdo al tipo de ladrillo que se utiliza. Se considerará 5 cm más que la altura   del ladrillo utilizado, de esta manera el vaciado de losa llegará a este nivel como   límite. Esto quiere decir que si utilizamos ladrillos de 20 cm de altura, la altura   de los frisos será de 25 cm y los listones de refuerzo se colocarán a cada 90 cm,   como se muestra en la figura 71.  Figura 70.   Refuerzo viga solera   Cuando el muro es 15 cm doblar también el fierro de abajo Refuerzo viga solera 25 cm (Muro de ladrillo) Refuerzo aligerado (diámetro varible)   Refuerzo aligerado (diámetro varible) 15 cm (Muro de ladrillo) 17 ó 20 cm   17 ó 20 cm 4 cm 4 cm  Detalle anclaje en extremos de viguetas. (Muro de cabeza). Detalle anclaje en extremos de viguetas. (Muro de soga).  Figura 71. Encofrado de frisos   0.90 m Friso  . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 56  CONSIDERACIONES    ◊   Deberá  verificarse  que  el  acero  inferior  de  las  viguetas  esté  2  cm  por    encima del encofrado, así se garantiza que el acero inferior tenga el adecuado   recubrimiento de concreto.    ◊   Durante  todos  estos  trabajos,  hay  que  tener  mucho  cuidado  al  pararse    sobre  los  ladrillos  de  techo,  ya  que  estos  son  muy  frágiles.  Por  esta  razón  es    recomendable  poner  tablones  para  poder  pisar  sobre  ellos  y  evitar  posibles    accidentes.  2.4.3 Tuberías que pasan a través de la losa aligerada  Antes de colocar el concreto en la losa, se debe verificar que la ubicación de los   fierros, de las tuberías de electricidad, de agua y de desagüe, se encuentren en   buen estado y de acuerdo a lo establecido en los planos. Es decir, que consideren   los alineamientos e inclinaciones de las tuberías preestablecidas y la ubicación   exacta de los puntos de salida de accesorios de baño y cocina (inodoro, ducha,   lavatorios, drenajes, etc).  Por otro lado, se debe verificar también que el encofrado esté completamente   horizontal, los frisos herméticos y los pies derechos estables.  Posteriormente, se debe humedecer el encofrado de las vigas y los ladrillos de   techo,  para  que  no  absorban  el  agua  del  concreto. Asimismo,  se  debe  colocar    tablas de madera para que las personas que trabajarán en el vaciado de techo   no  caminen  directamente  sobre  el  fierro  porque  pueden  doblarlo  y  se  debe    modificar su ubicación y recubrimiento.  a. Proporción de la mezcla de concreto  Para la preparación de la mezcla, se deberá consultar la resistencia indicada en   los planos. Por lo general, al igual que en las vigas y columnas, para una casa de   2 o 3 pisos, esta resistencia a compresión del concreto es de 210 kg/cm2. Esto   quiere decir, que sobre una superficie cuadrada de concreto de 1 cm de lado, se   puede aplicar una carga de 210 kg antes de que se rompa.  La proporción recomendable para obtener esta resistencia, es de una bolsa de   cemento,  con  2/3  buggy  de  arena  gruesa,  2/3  buggy  de  piedra  chancada  y  la    cantidad  de  agua  necesaria  para  obtener  una  mezcla  pastosa  que  permita  un    buen trabajo. Verificar antes la calidad de estos insumos. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 57  Este concreto, al igual que en las columnas y vigas, debe hacerse de preferencia   usando  una  mezcladora,  ya  que  hacerlo  de  manera  manual  produce  mezclas    que no son uniformes.  b. Vaciado y compactado del concreto  Durante  el vaciado  se  debe  llenar  primero  las vigas y viguetas, y  luego  la  losa    superior  hasta  cubrir  una  altura  de  5  cm.  Para  una  buena  compactación  del    concreto, se debe usar un vibrador mecánico o chucear la mezcla con una barra   de  construcción.  Hay  que  tener  cuidado  de  no  vibrar  en  exceso,  porque  de  lo    contrario, los componentes del concreto se pueden separar  (ver figura 72).  Es importante tener en cuenta que el proceso de vaciado es continuo. Eso quiere   decir, que no se debe postergar el trabajo cuando ya se inició.  Figura 72. Proceso de vaciado y  compactación de concreto en techo   Concreto Vibradora eléctrica Fierro de columna Friso  . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 58  c. Nivelación  Finalmente, la losa de techo debe quedar lo más nivelada posible. Esta operación   se  hace  pasando  una  regla  de  madera  o  de  aluminio  sobre  la  superficie   (ver   figura 73).  El acabado de la losa debe ser rugoso, para permitir la adherencia al contrapiso.  d. Curado  Debido  a  la  gran  superficie  expuesta  al  aire,  una  losa  de  concreto  es  muy    susceptible  a  fisurarse,  debido  a  la  contracción  por  temperatura  en  estado    todavía fresco.  La  mejor  manera  de  evitar  este  problema,  es  mediante  el  mojado  con  agua.    Este  se  debe  iniciar  unas  horas  después  del  vaciado  y  debe  prolongarse  los  7    días  posteriores.  Esto  evitará  las  rajaduras  y  hará  que  el  concreto  alcance  su    resistencia definitiva.  Para evitar que el agua se escurra por los bordes de la superficie, se recomienda   colocar arena  fina en estos  bordes, a manera de una barrera.  A  este  procedimiento   se le conoce con el nombre de curado con arroceras  (ver figura 74).  Figura 73. Nivelación . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 59  CONSIDERACIONES    ◊   Los  frisos  del  techo  aligerado  podrán  ser  retirados  al  cabo  de  24  horas  del    vaciado del concreto.    ◊   Después  de  10  días  de  haberse  realizado  el  vaciado,  se  procederá  al     desencofrado  de  las  vigas.  Las  losas  aligeradas  se  podrán  desencofrarse    también, pero previendo de dejar puntales cada, ciertos tramos.  Arroceras  Figura 74. Arroceras . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 60  2.5 ESCALERAS  La escalera de concreto es una losa dentada e inclinada, que nos permite subir   o bajar de un nivel a otro.  Una  escalera  está  conformada  por  tramos,  descansos y  barandas.  Los  tramos    están  formados  por  escalones;  y  los  escalones,  por  pasos  y  contrapasos   (ver   figura 75).  Figura 75. Elementos estructurales de una escalera  . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 61  Las  escaleras  pueden  ser  construidas  dentro  o  fuera  de  la  vivienda  y  las    condiciones que deberán cumplir son las siguientes:    ◊   Las  escaleras  contarán  con  un  máximo  de  diecisiete  pasos  entre  un  piso  y    otro. Si el número es mayor, se deberá intercalar un descanso que tendrá como   mínimo 0.90 m de longitud.    ◊   En  cada  tramo  de  escalera,  los  pasos  y  los  contrapasos  serán  uniformes,    debiendo cumplir con un mínimo de 25 cm para los pasos y un máximo de 18 cm   para los contrapasos  (ver figura 76).  2.5.1 Trazo de escalera  Sobre  la  superficie  del  muro  que  se  encuentra  a  un  extremo  de  la  escalera,    se  marca  el  inicio y  el fin  del tramo  a trazar. A  la  distancia vertical,  se  le  divide    entre  el  número  de  contrapasos; y  a  la  distancia  horizontal,  se  le  divide  entre    el número de pasos  (ver figura 109).  Con estos puntos de referencia y la ayuda   de una wincha y un nivel, hacemos el trazo respectivo. Luego se traza el fondo   de  escalera,  teniendo  en  cuenta  que  el  espesor  mínimo  es  de  15  cm  o  el  que    especifique los planos.  Figura 76. Paso y contrapaso de una escalera   Figura 77. Trazo de la escalera   Losa de techo Espesor mín. 15 cm  . . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 62  2.5.2 Encofrado de escalera  Siguiendo la línea que marca el fondo de la escalera, se arma la rampa que servirá   de base para el encofrado.  Luego,  se  encofran  los  contrapasos,  usando  tablas  de  1  1/2”  de  espesor  que    tengan un largo igual al ancho de la escalera.  Estas tablas se deben asegurar con tacos de madera en sus extremos, y además,   se debe colocar un listón de refuerzo en el centro de las tablas para que no se   curven por la presión del concreto fresco  (ver figura 78).  2.5.3 Colocación del fierro de escalera  Primero se coloca la armadura de acero longitudinal y transversal que va en el   fondo de la rampa. Recuerde que debemos colocar dados de concreto que nos   garanticen el debido recubrimiento. Luego, se coloca el acero superior, bastones   de una longitud que debe estar indicada en el plano de estructuras.  En el extremo inferior y superior de la escalera debe haber “mechas” de acero   provenientes de la cimentación o de la losa de techo según corresponda. Estas   deben  cumplir  con  las  longitudes  determinadas  en  los  planos  y  servirán  para    enganchar los refuerzos de la escalera a la estructura del edificio  (ver figura 79).  Figura 38. Estructura del encofrado de una escalera  . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 63  2.5.4 Preparación del concreto  El  concreto  a  usarse  deberá  ser  de  la  misma  calidad  que  el  de  las  columnas  y    el de los techos. La proporción recomendable es de una bolsa de cemento por   2/3 buggy de arena gruesa, 2/3 buggy de piedra chancada y la cantidad de agua   necesaria para obtener una mezcla pastosa que permita un buen trabajo.  2.5.5 Vaciado del concreto  Antes  de  iniciar  el  vaciado,  se  deberá  humedecer  con  agua  el  encofrado,  esto    evitará que la madera seca absorba el agua del concreto.  El  transporte  del  concreto  se  efectuará  mediante  latas,  que  deberán  estar    limpias para evitar cualquier contaminación de la mezcla.  Figura 79. Colocación del fierro de escalera . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 64  El concreto se debe empezar a vaciar por la parte más baja y debe terminarse   por la parte superior. Si lo hacemos en sentido contrario, el concreto resbalará   por la rampa de la escalera, produciéndose la separación de la piedra del resto   de la mezcla.  El  vaciado  debe  hacerse  de  manera  continua  hasta  terminar  toda  la  escalera.    Durante este proceso debe compactarse el concreto con una vibradora. En caso   de no contar con una, se chuzará con una varilla de acero.  El  desencofrado  debe  hacerse  después  de  7  días,  tiempo  durante  el  cual    debemos humedecer el concreto con agua para evitar rajaduras y garantizar el   buen desarrollo de la resistencia.  CONSIDERACIONES    ◊  Es muy frecuente que no se le dé la debida atención al acabado del concreto   en  los  pasos  y  contrapasos.  Esto  puede  traer  posteriores  picados  y  nivelados    que se pueden evitar fácilmente, si se usa un buen encofrado y se pone un poco   de esmero en el acabado final.    ◊  Antes del trazo y después del encofrado, es recomendable chequear que las   dimensiones de cada una de las secciones de la escalera sean las correctas. Para   ello,  debemos  verificar  las  alturas  de  los  contrapasos  que  generalmente  son    como máximo 18 cm y el ancho de los pasos que son de 25 cm. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 65  3.1 INTRODUCCIÓN  El concreto es un material muy utilizado en las obras que se ejecutan en nuestro   medio  para  construir  la  estructura  de  una  edificación.  Esta  es  una  razón  más    que suficiente para optimizar su calidad, ya que de él depende la excelencia de   la estructura.  Al  concreto  podemos  considerarlo  como  una  piedra  que  se  ha  obtenido    artificialmente,  primero,  mezclando  una  serie  de  ingredientes;  luego    transportándolo,  colocándolo,  compactándolo  y  curándolo  apropiadamente,    de  tal  manera  que  este  adquiera  las  características  que  se  ha  establecido    previamente,  como  por  ejemplo,  consistencia,  impermeabilidad,  resistencia  a    la compresión (f`c), etc.  3. CONTROL DE CALIDAD DEL CONCRETO  Algunas veces, por indicación del ingeniero, hay que añadirle ciertas sustancias   químicas  llamadas  “aditivos”,  con  el  propósito  de  mejorar  o  modificar  algunas    de sus propiedades.  Concreto = Cemento + Arena gruesa + Piedra chancada + Agua + Aditivos  3.1.1 Características del concreto   a.  Su elevada resistencia a fuerzas de compresión  (ver figura 80).  b.  Su escasa capacidad para soportar fuerzas de estiramiento  (ver figura 81).  c.   Su  elevada  resistencia  para  soportar  altas  temperaturas,  provenientes,  por    ejemplo, de incendios  (ver figura 82).  d.   Su  impermeabilidad,  es  decir,  la  dificultad  de  no  dejar  pasar  el  agua  u  otro    líquido a su interior.  e.  Su consistencia, es decir, el grado de fluidez de la mezcla para que le sea fácil   desplazarse dentro del encofrado y llegar hasta el último “rincón”.  f.   El  concreto,  como  cualquier  material,  puede  experimentar  deterioro  con  el    tiempo debido al medio que lo rodea. Por ejemplo:  Concreto = Cemento + Arena gruesa + Piedra chancada + Agua. . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 66    ◊  El clima al cual está expuesto (brisa marina, heladas, deshielos, sol, frío, etc.).    ◊  El suelo que rodea a una cimentación.  3.1.2 Calidad del concreto  Para  obtener  un  concreto  de  buena  calidad,  no  solo  es  necesario  contar  con    ingredientes de buena calidad, que además estén combinados en las cantidades   correctas; es necesario también tener en cuenta cómo se hace el mezclado, el   transporte,  el  vaciado,  la  compactación  y  el  curado.  Estos  procesos  influirán    directamente en la calidad de este importante material.  Si  uno  o  varios  procesos  se  realizan  de  manera  deficiente,  se  obtendrá  un    concreto  de  mala  calidad,  aún  utilizando  las  cantidades  exactas  de  cemento,    arena, piedra y agua.  3.2 MEZCLADO DEL CONCRETO  Son  tres  los  aspectos  básicos  e  importantes  que  hay  que  considerar  en  este    proceso:  3.2.1  Características de los ingredientes  3.2.2  Dosificación  3.2.3  Mezcla  Figura 80, 81 y 82.   Concreto: Buena resistencia a la compresión Figura 80   Concreto: Escasa resistencia al estiramiento. Se rompe fácilmente Figura 81 Concreto: Buena resistencia al fuego. Protege al fierro Figura 82 \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 67  Examinemos ahora con detenimiento cada uno de los elementos:  3.2.1 Características de los ingredientes  a. Cemento  Dado  que  este  ingrediente  tiene  gran    influencia  en  varias  de  las  propiedades    del concreto, es indispensable que esté   en buenas condiciones.  Para  lograrlo,  sigue  las  siguientes    recomendaciones:    ◊  No coloques el cemento directamente   sobre el suelo.    ◊  Protégelo de la lluvia  (ver figura 83).    ◊  De preferencia colócalo en un almacén   cerrado, en el cual no haya presencia de   humedad.    ◊  Usa el cemento por orden de llegada.  b. Arena Gruesa    ◊  Debe ser de cantera natural.    ◊  Debe estar libre de: restos de   plantas, partículas escamosas, arcilla   salitre, otras sustancias dañinas.    ◊   Deben  tener  perfil  preferentemente    angular.    ◊   Debe  ser  de  partículas  duras,    compactas y resistentes. Figura 84.   Figura 83.   PROTEGER EL CEMENTO \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 68  c. Piedra chancada    ◊  Debe ser grava natural triturada.    ◊  Debe estar limpia, ser dura y   compacta.    ◊  Textura preferentemente rugosa.    ◊  Perfil preferentemente angular o   semiangular.  d. Agua  El  Reglamento  Nacional  de  Edificaciones  nos    recomienda  que  en  la  preparación  y  en  el    curado, usemos agua potable. Por supuesto, el   agua no debe haber sido utilizada previamente   en otras tareas.  Cuando  se  usa  agua  no  potable  (acequia,  río,    etc.)  o  agua  potable  usada,  estas  pueden    contener impurezas (compuestos químicos) las   cuales pueden afectar seriamente la calidad del   concreto.  He aquí algunas consecuencias si no sigues esta   recomendación:    ◊  Disminuye su resistencia (f ́c).    ◊  Altera el tiempo en el que el concreto se endurece totalmente.    ◊  Causa corrosión en el refuerzo.    ◊  Puede producir también eflorescencia (polvo de color blanco conocido como   salitre) sobre la superficie.  3.2.2 Dosificación  Dosificación  quiere  decir,  utilizar  la  cantidad  apropiada  de  cada  uno  de  los    ingredientes que echaremos a la mezcladora para elaborar el concreto.  Dichas  cantidades  deben  proporcionarle  al  concreto  las  características  que    indican los planos estructurales y que mencionamos en el punto 3.1.1.  Figura 85.   Figura 86.  \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 69  Los criterios mínimos a tenerse en cuenta en la dosificación de los ingredientes   del concreto son:    ◊  Consistencia requerida del concreto.    ◊  Resistencia a la compresión especificada en el plano.  La consistencia es la fluidez de la mezcla recién preparada, es decir, la capacidad   que tiene para desplazarse dentro de los encofrados y así llegar hasta el último   rincón de estos cuando se haga el vaciado. Esto implica que la cantidad de agua   que debe echarse en el batido debe ser tal que se obtenga un concreto con una   fluidez apropiada, de lo contrario, se formarán las conocidas “cangrejeras” que   son dañinas e indeseables.  En  cuanto  a  la  resistencia  a  la  compresión  (f’c),  su  valor  está  indicado  en  los    planos  estructurales  y  es  sumamente  importante  que  el  concreto  que  se    prepare alcance dicho valor.  El factor que determina esta resistencia es la relación agua/cemento, es decir,   la cantidad de agua aportada a la mezcla comparada con la cantidad de cemento   incorporada  en  ella.  Mientras  menor  sea  la  cantidad  de  agua,  mayor  será  la    resistencia  del  concreto.  Esta  consideración  es  fundamental  y  debe  tenerse    siempre presente.  Como  podrás  darte  cuenta,  se  debe  utilizar  una  cantidad  equilibrada  de  agua    (ni  mucha  ni  poca)  de tal  manera  que  cuando  se  endurezca  el  concreto  fresco    alcance la resistencia (f’c) indicada en los planos.  En el Capítulo 5 (Anexos), se presenta algunos casos de dosificaciones sugeridas   utilizadas en obra, las cuales deben tomarse solo como información referencial,   puesto  que  pueden  variar  dependiendo  del  lugar  donde  se  lleve  a  cabo  la    construcción. Estas variaciones se deben, entre otras causas, a las características   propias  de  la  arena  y  de  la  piedra.  Es  conocido,  por  ejemplo,  que  la  arena  y  la    piedra usada en Lima para la elaboración del concreto no son iguales a la arena y   piedra de Huancayo. Los materiales de Puno no son iguales a los de Huamachuco   (La Libertad), es decir, todos ellos son de características diferentes. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 70  3.2.3 Mezcla  Un  concreto  de  calidad  satisfactoria  requiere  que  sus  ingredientes  estén    adecuadamente  mezclados,  a  fin  de  obtener  una  masa  homogénea y  de  color    uniforme.  Por  lo  tanto,  los  equipos  y  procedimientos  a  usarse  deberán  ser    capaces de lograr una mezcla con estas características. Para lograrlo, considera   lo siguiente:  Hay  dos  formas  de  realizar  el  mezclado:  una  es  manual  y  la  otra  con  equipo    mecánico  (ver figura 87).  De estos dos procedimientos, el más recomendable es   trabajar con equipo mecánico (mezcladora), porque con él se logran los objetivos   del mezclado descritos anteriormente.    ◊  Debe garantizar una descarga de la mezcla sin que se separe la piedra chancada   del resto de los ingredientes.    ◊  El tambor giratorio y la canaleta de entrada y de salida no deben tener restos   de concreto endurecido ni perforaciones.    ◊  Debe ser operada a la capacidad y la velocidad recomendadas por el fabricante.    ◊   El  depósito  empleado  en la medición  de agua  debe encontrars e adecuadamente   marcado a fin de controlar la cantidad de esta.  Figura 87. Forma de Mezclado   Manual Mecánico Mejor  . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 71  3.3 TRANSPORTE  Para  lograr transportar  el  concreto  de  manera  correcta,  es  decir,  de  modo tal    que  contribuya  a  conservar  su  calidad,  debes  poner  en  práctica  las  siguientes    recomendaciones:    ◊  La ruta elegida no debe tener obstáculos ni baches, además debe ser la más   corta posible.    ◊  El traslado del concreto debe ser ágil, sin correr.    ◊   Debes  utilizar  la  cantidad  suficiente  de  personal,  para  vaciar  el  concreto    rápidamente.  También es importante que consideres lo siguiente:    ◊   Durante  el  traslado  de  la  mezcla  hay  que  evitar  la  pérdida  de  alguno  de  los    ingredientes (pasta de cemento, agua por evaporación).    ◊  Si la mezcla es algo “aguada”, evita transportarla distancias largas. Evita utilizar   carretillas o buggies con ruedas sin jebe.  Figura 88. Traslado adecuado del concreto . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 72  3.4 VACIADO  El  vaciado  del  concreto  en  los  encofrados  debe  realizarse  cuidadosamente    para  obtener  un  concreto  compacto,  resistente  y  durable.  He  aquí  algunas    recomendaciones que debes considerar:    ◊  Durante el vaciado no está permitido agregarle agua a la mezcla.    ◊  El concreto que muestre indicios de endurecimiento no debe colocarse.    ◊   El  tiempo  transcurrido  entre  el  mezclado  y  el  vaciado  debe  ser  el  menor    posible.    ◊  La colocación de la mezcla en el encofrado debe hacerse a la menor distancia   posible de su posición final  (ver figura 89).    ◊  No depositar grandes cantidades del concreto en un solo sitio para luego ser   extendido.    ◊  No colocar concreto bajo lluvia fuerte, a menos que se cuente con protección   para que no le caiga agua.    ◊  Antes de hacer el vaciado, humedecer ligeramente los encofrados.    ◊   En  lugares  de  climas  cálidos,  por  ejemplo  en  Piura,  el  vaciado  debe  hacerse    de  preferencia  por  las  noches.  De  ser  así,  deberá  contarse  con  suficiente    iluminación y medidas de seguridad a fin de evitar accidentes.  Figura 89. Concreto colocado cerca de su posición final  Refuerzo Encofrado Concreto colocado cerca de su posición final Mucha caída Manga  .  . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 73  3.5 COMPACTACIÓN  El  concreto  fresco  recién  colocado  en  el    encofrado puede contener espacios vacíos   en  su  interior  (cangrejeras),  ocasionadas    debido  al  aire  atrapado  por  este  en  el    momento del vaciado. Si se permite que el   concreto  endurezca  bajo  esta  condición,    no  será  completamente  compacto;  será    débil  y  pobremente  adherido  al  acero  de    refuerzo  (ver figura 90).  La  consolidación,  conocida  también  como  compactación,  es  el  proceso  por  el    cual el aire atrapado en la mezcla fresca es sacado de la misma. Para lograrlo se   han  desarrollado  diferentes  procedimientos.  La  elección  del  más  conveniente    dependerá principalmente de la consistencia de la mezcla.  El método que comúnmente se utiliza en obra, y que es el más recomendado, es   el que se realiza mediante el uso de un vibrador  (ver figura 91).  A continuación, algunas recomendaciones:    ◊   No  debe  concentrarse  la  vibración  en  un    solo sitio por más tiempo del necesario, por   lo  que  se  recomienda  no  sobrepasar  los  10    segundos.    ◊  La aguja de la vibradora debe ser introducida   verticalmente,  evitando  movimientos    bruscos  (ver figura 92).    ◊   Si  no  cuentas  con  este  equipo,  entonces    tendrás  que  “chucear”  la  mezcla,    introduciendo y  sacando verticalmente  una    varilla de fierro liso de 1/2” repetidamente.  Figura 92.  Aguja de vibradora ¡INCORRECTO! La aguja esta inclinada ¡CORRECTO! La aguja esta ingresando verticalmente Aguja de vibradora  Figura 90.   Figura 91.   . . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 74  3.6 CURADO  El  curado  es  un  proceso  que  consiste  en  mantener  en  un  ambiente  húmedo    el  concreto  por  varios  días  después  del  vaciado,  con  el  propósito  de  que  este    adquiera  la  totalidad  de  su  resistencia  (f’c)  especificada  en  el  plano  y  además    para evitar probables rajaduras superficiales.  Los  agentes  más  perjudiciales  para  el  concreto  recién  vaciado  son  el  sol  y  el    viento,  porque  lo  secan  excesivamente.  Debe  evitarse  que  estos  lleguen  a  la    mezcla.  El concreto alcanza un porcentaje significativo de su resistencia tan solo a los 7   días del vaciado. Por ejemplo, si se usa un cemento tipo I, su resistencia llegará   a la semana aproximadamente al 70% del f’c especificado. Su resistencia final, al   100%, dependerá en gran medida de su curado.  De  no  realizarse  el  correspondiente  curado,  el  resto  de  la  resistencia  que  le    falta adquirir, puede perderse por un secado prematuro del concreto, lo cual lo   convertiría en un material de baja calidad.  Para evitar esta peligrosa situación, el concreto debe curarse al menos durante   7 días, y en trabajos de mayor trascendencia, hasta 14 días.  Actualmente,  existen  diversas formas  para  realizar  el  curado,  pero  el  objetivo    de  todas  ellas  es  el  mismo:  garantizar  un  buen  contenido  de  humedad  en    el  concreto  para  que  así  desarrolle  las  propiedades  que  lo  convertirán  en  un    material de buena calidad y resistencia.  Los procedimientos más utilizados en obra son:    ◊  La continua y directa aplicación de agua  (ver figura 93a).    ◊  Para el caso de pisos o techos: las arroceras.    ◊  Mantas o alfombras empapadas con agua con las cuales se cubre el concreto   (ver figura 93 b).  Figura 93 (a) y (b).  Figura 93 (b) Columna de correcto Figura 93 (a) Agua directo al concreto Mantas saturadas de agua \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 75  4.1 ACCIDENTES, TIPOS Y CAUSAS  La  construcción  es  uno  de  los  sectores  de  mayor  importancia  en  la  actividad    económica  del  país,  tanto  por  su  contribución  al  desarrollo,  cuanto  por  los    puestos  de  trabajo  que  genera.  Al  mismo  tiempo,  sin  embargo,  es  uno  de  los    sectores  donde  el  riesgo  y  el  número  de  accidentes  ocurridos  ha  alcanzado    cifras preocupantes.  Por  lo  tanto,  es  importante  abordar  el  tema  de  la  seguridad  y  la  salud  de  los    trabajadores por ser la construcción una actividad especialmente peligrosa.  4.1.1 Accidente  Es todo acontecimiento súbito y violento ocurrido en la ejecución de un trabajo,   que puede producir un daño físico leve, grave o a veces la muerte, no solo a ti,   sino también a otras personas.  Los  accidentes  originan  además  retrasos  en  la  ejecución  de  la  obra,  así  como    daños a instalaciones y equipos.  4.1.2 Tipos de accidentes  La pérdida de salud de los trabajadores, ya sea debido a lesiones, incapacidades   permanentes o muertes ocurre debido a:  4. SEGURIDAD E HIGIENE EN OBRA  a. Golpes recibidos por:    ◊  Materiales transportados.    ◊  Materiales proyectados.    ◊  Caída de materiales, herramientas o equipos desde altura.  b. Accidentes por contacto:    ◊  Con la electricidad.    ◊  Con los clavos.    ◊  Con objetos punzantes o cortantes. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 76  c. Atrapamiento por:    ◊  Máquinas de transmisión polea – correa.    ◊  Derrumbes.  d. Caídas del trabajador:    ◊  Desde el andamio.    ◊  A través de aberturas en los techos.    ◊  Desde el elevador de plataforma.    ◊  Desde escaleras, techos y pasarelas.  e. Atropellos con:    ◊  Vehículos que avanzan.    ◊  Vehículos en retroceso.    ◊  Maquinaria.  f. Sobreesfuerzo por:    ◊  Posición incorrecta al levantar una carga.    ◊  Exceso de carga.  4.1.3 Causas de los accidentes  Cuando un accidente sucede, no se debe a la mala suerte. Tampoco es producto   de  la  casualidad.  Un  accidente  es  el  resultado  de  una  o  varias  causas  que  lo    producen; por lo tanto, estas situaciones pueden ser identificadas y controladas.   Es  necesario  investigar  la  causa  principal  de  un  accidente  para  evitar  su    repetición. Las principales causas de accidentes son:  a. Actos inseguros  b. Condiciones peligrosas  c. Factores externos \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 77  Analicemos ahora cada uno de estos factores:  a. Actos inseguros  Son  actos  que  realizas  o  que  dejas  de  realizar y  con  los  que  generas  un  riesgo    para ti y para otras personas.  Ejemplos:    ◊  Trabajar sobre una escalera   inestable  (ver figura 94).    ◊  Usar arnés sin estar enganchado a   un punto seguro.    ◊  Distracción (falta de   concentración en tu trabajo).    ◊  Cargar materiales, equipos y   herramientas en forma insegura.    ◊  Trabajar en estado de ebriedad.    ◊  Bromas en el trabajo.    ◊  Cansancio.    ◊  Desconocimiento.    ◊  Malos hábitos de trabajo.  b. Condiciones peligrosas  Las  condiciones  peligrosas  dependen  de  los  equipos,  de  las  instalaciones  o  de    las tareas mismas que realizas, por medio de las cuales se genera un riesgo para   ti o para tus compañeros de trabajo.  Ejemplos:    ◊  Cables de acero con mordeduras, retorcidos o con alambres cortados    ◊  Iluminación escasa durante los trabajos nocturnos.    ◊  Falta de orden y limpieza.    ◊  Equipos no protegidos adecuadamente.  Figura 94.  \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 78  c. Factores externos:  Son situaciones ocasionadas por factores ajenos a la obra, que pueden generar   un riesgo para ti. Estas situaciones especiales no pueden ser controladas, pero   debes estar atento.  Ejemplos:    ◊  Lluvias repentinas, caída de granizo, etc.  4.2 TÚ Y LA SEGURIDAD EN OBRA  El éxito de tu trabajo es muy importante para ti y para tu cliente; es por ello que   para  ser verdaderamente  exitoso  no  solo tienes  que  controlar  la  calidad  de  la    construcción, sino también las condiciones de seguridad en las que trabajas. De   esta  manera  evitarás  en  gran  medida  los  indeseados,  lamentables y  costosos    accidentes de trabajo.  4.2.1 Seguridad  Es el control de los accidentes y daños a los equipos o materiales. Las normas   de seguridad son indispensables para la ejecución exitosa del trabajo.  4.2.2 Compromiso y responsabilidades    ◊  La seguridad en obra es tan importante como la calidad de la construcción, los   costos y el avance de obra.    ◊  La prevención de accidentes debe ser un compromiso de todos los trabajadores.    ◊  Se debe integrar a toda práctica laboral, la preservación de vidas y bienes.    ◊  Debes intervenir activamente en los programas y metas de prevención.    ◊ Debes estar atento e informar inmediatamente toda condición insegura que   se presente en obra.  4.2.3 Lo que se espera de ti    ◊  Que trabajes siempre respetando las normas de seguridad.    ◊  Que veles por tu seguridad y la de tus compañeros de trabajo.    ◊   Que  cuides  tus  equipos  y  herramientas  manteniéndolos  en  buen  estado  de    conservación. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 79  4.2.4 En obra, no debes    ◊  Correr, salvo en el caso de una emergencia justificada.    ◊  Fumar o hacer fuego en áreas prohibidas.    ◊  Ingresar a trabajar en estado de ebriedad.    ◊  Ingresar al lugar de trabajo con bebidas alcohólicas o drogas.  (ver figura 95).    ◊  Realizar tareas con el torso desnudo.    ◊   Usar  cadenas  en  el  cuello,  llaveros    colgantes  o  cabello  largo  sin  recoger,    cuando  se  deban  operar  máquinas    rotativas o existan puntos de enganche.    ◊  Tomar  medicamentos  que  produzcan    sueño,  adormecimiento,  etc.  porque    afectan  tus  sentidos  y  te  restan    capacidad  física.  Ten  cuidado  con    aquellos  medicamentos  comprados    sin  receta  médica  y  en  farmacias    informales.  4.2.5 Conductas que debes aplicar siempre    ◊  Usa los equipos y elementos de seguridad adecuados.    ◊   Si  tú  o  alguno  de  tus  compañeros  ha  sufrido  cualquier  lesión  durante  la    realización de sus tareas, es tu obligación informar de inmediato a tu superior.    ◊   Realiza tus tareas  de  modo tal  que  NO te  expongas  al  peligro,  ni  expongas  a    tus compañeros.  (ver figura 96).  Figura 95.   Figura 96.  Caminando al borde en el piso 2 \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 80  4.3 REQUISITOS DEL LUGAR DE TRABAJO: ORDEN Y LIMPIEZA  Debes  mantener  tu  obra  constantemente  limpia  y  ordenada,  ya  que  esto    contribuye  no  solo  a  prevenir  lamentables  accidentes,  sino  también  a  evitar    interferencias en el avance de tu trabajo.  He  aquí  algunas  recomendaciones  de    seguridad:  1.-   Saca  o  aplasta  los  clavos  que    sobresalgan  de  las  piezas  de  madera    (ver la figura 97).  2.-  Al término de la jornada, deja limpia   tu zona de trabajo.  3.-  Ordena tus herramientas en el lugar   que les corresponde.  4.-    Mantén  el  andamio  libre  de  materiales y  herramientas  que  no  sean  de  uso    inmediato  (ver la figura 98).  5.-  Limpia los aceites y grasas derramados en los pisos  (ver la figura 99).   6.-  Retira los desechos y desperdicios de las zonas de trabajo y accesos.   7.-  Apila los materiales en forma segura y estable. No le des mucha altura.   8.-  Almacena las varillas correctamente para evitar tropiezos.  9.-  En jornadas nocturnas, las zonas de trabajo y las vías de circulación, deben   permanecer bien iluminadas.  Figura 97.   Figura 98 y 99.  Figura 98   Figura 99 .   . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 81  10.-  Asegúrate que los líquidos inflamables se guarden en recipientes y lugares   adecuados.  11.-  Señaliza adecuadamente tu obra.  12.-   Coloca  pantallas  protectoras  en  las  aberturas  de  los  techos  para  evitar    caída de materiales o accidentes personales  4.4 EQUIPOS DE PROTECCIÓN PERSONAL (E.P.P.)  En  materia  de  seguridad,  el  uso  de  los  E.P.P.  constituye  una  necesidad  para    prevenir accidentes o reducir sus efectos y así salvaguardar tu salud e integridad   personal.  Los E.P.P. son de diversos tipos y tienen diferentes propósitos. Cada uno de ellos   está diseñado y fabricado para protegerte en cada riesgo específico.  a. Vestimenta  No  utilices  prendas  muy  amplias  o  sueltas,  pueden  quedar  atrapadas  en  las    partes móviles de la maquinaria.  b. Protección de la cabeza  El  casco  te  protegerá  de  golpes,  así    como también de contactos eléctricos.  c. Protección de los pies  Los zapatos, botines y botas de seguridad   protegen  tus  pies  de  perforaciones,    aplastamientos y contactos eléctricos.  d. Protección de los ojos  Los  anteojos  o  gafas te  protegerán  los    ojos  cuando  estés  picando  concreto  o    mamposterías,  rasqueteando  o  lijando    paredes, cortando o esmerilando, etc. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 82  e. Protección facial  Esta  mascarilla  es  de  uso  obligatorio    cuando trabajes con sierras, amoladoras   u  otras  herramientas  o  equipos    similares.  f. Protección de oídos  Estos  protectores  atenúan  el  ruido    excesivo cuando trabajes con martillos,   neumáticos,  esmerilando  piezas  de    acero o aserrando madera.  g. Protección contra caídas  Siempre que realices trabajos en altura   (andamios,  montaje  de  estructuras    metálicas,  tendido  de  redes  eléctricas,    etc.), debes usar tu arnés de seguridad.  h. Protección respiratoria  Te  protege  de  gases  tóxicos,  polvos    nocivos y vapores orgánicos.  i. Protección anti caída  Te  protege  de  posibles  caídas  cuando    realices trabajos en altura. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 83  4.5 MANIPULACIÓN Y TRANSPORTE DE MATERIALES  Una  de  las  actividades  que  siempre  está  presente  en  toda  obra  (pequeña,    mediana  o  grande)  es  la  manipulación  y  transporte  de  materiales  o  equipos.  Considerando que generalmente estas tareas las realizas manualmente, existen   riesgos  de  accidentes  que  debemos  controlar  para  evitar  que  te  produzcan    lesiones en el cuerpo.  4.5.1 Recomendaciones    ◊  Antes  de  levantar y  mover  materiales  o  equipos,  observa  la  zona  por  donde    vas a caminar. No debe haber obstáculos que sortear.    ◊   Verifica  que  no  haya  cables  eléctricos  con  corriente  cuando  transportes    varillas corrugadas o tubos metálicos.    ◊  Si la carga a trasladar tiene astillas o bordes filosos, debes usar guantes.    ◊  No uses los músculos de tu espalda para levantar la carga  (ver figura 100).    ◊  Tu espalda debe mantenerse recta, es decir, el peso de la carga debe tomarlo   tus piernas  (ver figura 101).    ◊  No levantes materiales que pesen más de 25 kg.  4.5.2 Preparación de la carga    ◊  Empareja y protege los bordes metálicos filosos o disparejos.    ◊  Saca o aplasta los clavos o alambres que sobresalgan.    ◊  Si se trata de carga voluminosa no dejes que te impida ver  (ver figura 102).  Figura 100 y 101.  Figura 101Figura 100 Modo correcto de levantar la carga \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 84    ◊  Al levantar la carga, tus pies deben estar apoyados en piso firme y separados.    ◊  Amarra  con  cuerdas todo  material  plano  que  pueda  “volar”  por  la  acción  del    viento.    ◊  Coloca la carga solo sobre lugares seguros y suficientemente resistentes.    ◊  No levantes la carga más arriba de lo que alcanzas con comodidad.    ◊   Cuando  estés  transportando  tubos,  escaleras,  varillas  o  tablas,  debes    mantener la mirada en dirección al movimiento. Debes tener cuidado al voltear   en una esquina.  Figura 102.  Muchas lesiones serias en la columna   vertebral son causada por una incorrecta  manera de levantar las cargas.  RECUERDA \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 85  4.6 PREVENCIÓN CONTRA CAÍDAS  4.6.1 Riesgos de caídas  En la industria de la construcción, las caídas de altura constituyen la principal   causa de accidentes graves o mortales. El riesgo de caída, al cual estás expuesto,   está presente en la mayoría de las tareas que se ejecutan en una obra.  Por ejemplo:    ◊  Sobre los andamios  (ver figura 103).    ◊  En el perímetro de los techos  (ver figura 104).    ◊  Aberturas en los entrepisos, para los ascensores y escaleras  (ver figura 105).    ◊  En el elevador de plataforma.    ◊  Construcción de los encofrados  (ver figura 106).    ◊  Montaje de estructuras metálicas  (ver figura 107).  Figura 103, 104 y 105.  Figura 103   Figura 104 Figura 105  . . . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 86  Por eso es importante que cada vez que realices un trabajo en altura, estés siempre   alerta. Mantenerse alerta quiere decir que debes estar atento y concentrado en   cada movimiento que realizas. Evita la distracción, pues es una de las principales   causas de accidentes. Además, cuando se actúa precipitadamente o enojado, se   pierde la serenidad, la calma y por lo tanto, quedas más expuesto a un accidente.  Considera  en  tu  trabajo  diario  la  aplicación  de  estas  recomendaciones,  con  la    finalidad de evitar un accidente y sus lamentables consecuencias.  4.6.2 Prevención  En  general,  las  medidas  de  prevención  que  debes  aplicar  en  el  trabajo  diario    deben cubrir dos aspectos importantes:  a. La prevención de caídas  Lo  que  hay  que  procurar  es  evitar  que    al  moverte  o  desplazarte,  te  acerques    demasiado  al  área  de  riesgo.  Esto  se    puede  lograr,  por  ejemplo,  respetando    las vallas o barandas colocadas en obra    (ver figura 108).  Figura 106 y 107.  Figura 106 Figura 107  Figura 108.  . . \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 87  b. La protección contra caídas  Las  caídas  se  evitan  con  métodos  de    protección,  como  por  ejemplo  el  uso    del  arnés  o  cinturón  de  seguridad.    Al  usarlo,  avanzas  un  paso  más  hacia    tu  seguridad  personal,  pues  aunque    existe  el  riesgo  de  una  caída  en  altura,    con el uso del equipo correspondiente,   lograrás  minimizar  las  consecuencias.    (ver figura 109).  4.7 DEMOLICIÓN MANUAL  En  caso  de  realizar  una  demolición  manual,  considera  las  siguientes    recomendaciones:  4.7.1 Acciones de prevención  a. Antes de iniciar la demolición.    ◊  Inspecciona personal y minuciosamente la edificación a demolerse.    ◊  Asegúrate  que  no  existan  partes  inestables  de  la  edificación,  sostenidas  por    otras partes a demolerse.    ◊  Corta totalmente el suministro eléctrico, telefónico, de gas y de agua.    ◊  Protege la vía pública y las edificaciones vecinas con vallas o paneles de madera.  b. Durante el trabajo lucha contra el polvo.    ◊  Elimina el polvo lo más cerca posible de su punto de formación, en especial en   trabajos que se realizan en espacios cerrados.    ◊  Debes usar mascarillas con filtros para la protección de tus vías respiratorias.    ◊   Ante la presencia de partículas de sílice, su eliminación debe ser total y el uso   de mascarilla es obligatorio. Hay presencia de sílice en los trabajos de arenado,   perforaciones de roca, cortado de concreto, etc.  Figura 109.  c. Del personal y su protección.    ◊  No debe haber trabajadores ocupados en tareas de demolición en diferentes   niveles. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 88    ◊  Los trabajadores deben usar obligatoriamente:  (ver figura 110)  casco, zapatos   de seguridad, guantes, arnés, anteojos y mascarilla.  4.7.2 Procedimientos  a. Recomendaciones generales.    ◊  Elimina los vidrios.    ◊  La demolición debe empezar por la parte superior de la edificación y continuar   avanzando hacia abajo.    ◊  Evita que se acumulen los escombros para no sobrecargar la estructura.    ◊   No  derribes  las  partes  de  la  construcción  que  sostienen  otras  partes  (por    ejemplo, vigas que sostienen al techo).    ◊   Interrumpe  los  trabajos,  si  las  condiciones  climáticas  son  malas  (vientos    fuertes, lluvias, etc.)    ◊  Asegúrate  que  los  escombros  extraídos  estén  bien  ubicados  para  que  no  se    vayan a caer accidentalmente.    ◊  No utilices explosivos en áreas urbanas.    ◊  Todo  el  proceso  de  demolición  debe  estar  supervisado  constantemente  por    personal con experiencia en estos trabajos.  b. Equipo e instalaciones auxiliares.    ◊  Los andamios y escaleras no deben estar apoyados en la estructura a derribar.    ◊   Los  escombros  no  deben  ser  tirados  al vacío.  Utiliza  para  ello  conductos  de    descarga  (guías  tubulares,  mangas,  canaletas  cerradas  de  madera,  etc.)   (Ver   figura 111).  Figura 110.  Trabajador sin casco y ojotas. Un accidente no es producto de la mala suerte, tampoco de la casualidad. \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 89  Vía protegida  Canaleta  c. Derribo de muros.    ◊   Los  muros  deben  derribarse  por    piso, de arriba hacia abajo y por hiladas   completas  (ver figura 112).    ◊   Asegura  los  muros  que  no  están    bien  sustentados,  por  medio  de    puntales,  para  que  no  se  desplomen    bruscamente.    ◊  Si fuera necesario mantener un muro   en  pie,  debes  dejar  como  mochetas    los  otros  muros  que  acceden  a  este.    No derribarlos completamente.    ◊   No  someter  los  muros  a  una  presión  peligrosa  por  acumulación  excesiva  de    escombros contra ellos.  Figura 112. Demolición de muros  Muro  Inicio  Abajo Arriba  - El muro se divide en dos. -   Cada parte se derriba  desde el centro y hacia los lados.  d . Demolición de techos.    ◊   Haz  un  cerco  y  señaliza  la  zona  situada  inmediatamente  debajo  del  techo,    prohibiendo el ingreso de los trabajadores no involucrados en esta tarea.    ◊  No debilites las vigas de los techos, si aún no se han terminado las labores que   se ejecutarán sobre ellas.    ◊  Realiza la demolición empezando desde el centro hacia los extremos.    ◊   No  acumules  los  escombros  sobre  el  techo,  particularmente  sobre  la  zona    central.  Figura 111.  \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 90  4.8 REGLAS DE ORO  En general, sea cual fuera el trabajo que hagas en una obra, te recomendamos   que apliques diariamente estas importantes REGLAS DE ORO:  4.8.1 Antes de comenzar    ◊  Solicita información sobre las tareas que vas a realizar en la jornada.    ◊  Analiza los riesgos que puede conllevar.    ◊   Solicita  las  herramientas,  equipos  y  protecciones  personales  adecuadas,  así    como materiales necesarios.  4.8.2 Durante el trabajo    ◊  Utiliza las protecciones personales, respeta las señales de seguridad.    ◊  Cuida y respeta las protecciones colectivas. Observa siempre su estado.    ◊   No  te  expongas  innecesariamente  a  los  riesgos.  Las  protecciones  pueden    fallar.  4.8.3 Al finalizar la jornada    ◊  Procura dejar los bordes filosos debidamente protegidos.    ◊  Mantén el lugar de trabajo limpio y ordenado.    ◊  Reflexiona: ¿Estoy satisfecho de la seguridad de mi trabajo? ¿He abusado de la   confianza en mi trabajo?  Recuerda que la seguridad empieza contigo \nMANUAL DE CONSTRUCCIÓN PARA MAESTROS DE OBRA 91  5.1 MATERIALES EN MUROS PORTANTES  a.  Consumo de ladrillos y mortero.  5. ANEXOS  b.   Dosificación  en  volúmenes  (1)  mortero  de  asentado  según  Norma  E-070:    Albañilería.  Cabeza Soga Canto 66 39 29 2  1 0.5  Cantidad ladrillos (por metro cuadrado) Cantidad de mortero (bolsa por metro cuadrado)Tipo Amarre(*) (*) Usando ladrillo King Kong 18 huecos (0.23 x 0.13 x 0.09)  (1) Dosificación en volúmenes: medición de las cantidades de los ingredientes,   utilizando  el  mismo  recipiente,  pero  guardando  la  proporción         try {

            if (Array.isArray(j)) return JSON.stringify(j);
            if (j && typeof j === 'object') {
                const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;

    function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }
    function rgbToHex(r, g, b) {
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
        return '#' + toHex(r) + toHex(g) + toHex(b);
    }
    function mixColors(colorA, colorB, amount) {
        const a = hexToRgb(colorA);
        const b = hexToRgb(colorB);
        return rgbToHex(a.r + (b.r - a.r) * amount, a.g + (b.g - a.g) * amount, a.b + (b.b - a.b) * amount);
    }
    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;

        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
