............. \nCómo crear nuevos hábitos emocionales  74 .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. .................................................................. ............................................................. \nAna María Deik 75 7HÁBITOS  Cuando  hablamos  o  pensamos  en  hábitos,  por  lo   general  se  viene  a  nuestra  mente  el  hábito  de  hacer   ejercicio, de comer saludable, de meditar, de levantarnos  todas  las  mañanas  a  tal  hora,  de  acostarnos  quizás   temprano,  de  tomar  dos  litros  de  agua  al  día.  Estos   son  solo  algunos  ejemplos  de  los  que  conocemos  como   hábitos.  Y  quiero  contarles,  para  los  que  no  lo  tienen   integrado,  o  para  los  que  han  escuchado  solo  un  poco   sobre este tema, que hay HÁBITOS EMOCIONALES  que son saludables y otros que no. Por  supuesto,  los  primeros  hábitos  de  los  que  les   hablé, con los que estamos más familiarizados, son súper  importantes  para  nuestra  vida,  pero  en  este  capítulo  les   voy a hablar de los otros hábitos, ya que es fundamental  cómo alimentamos nuestra mente.  En  esta  época  del  mundo  las  personas  están   comenzando  a  darle  mayor  importancia  a  sus   pensamientos  y  sentimientos.  Por  ejemplo,  puedes  tener   el hábito de hacer ejercicio, pero cuando en el trabajo te  sucede algo inesperado con tu jefe o con un compañero,  y  te  entra  una  rabia  o  una  impotencia  tan  grande,  no   estás trabajando tu ser integral: cuerpo, mente, espíritu y  emociones. Y esto a la larga se va reduciendo a enfermarte  continuamente de distintas cosas. Cuidar  el  cuerpo  es  súper  importante,  como  bien   lo  sabemos,  pero  tiene  que  ir  acompañado  de  hábitos   emocionales  saludables  para  nuestra  mente.  Vamos   entonces  a  aprender  a  cuidar  nuestros  pensamientos  y   emociones. \nCómo crear nuevos hábitos emocionales  76 Es  bastante  probable  que  busquemos  la  salud,  por   un lado, pero que esta no vaya acompañada por buenos  HÁBITOS  EMOCIONALES.  Y  es  mucho  más  fácil   llegarlos a tener de lo que creemos.   Noticias que no le aportan nada a nuestra  mente  Como  sociedad  estamos  acostumbrados  a  tener  la   televisión prendida, a no perdernos las noticias a las nueve  de la noche, o a escuchar las noticias en la radio mientras  vamos  manejando.  Igualmente  hay  muchas  personas   conectadas a las noticias de Twitter, o buscan en Internet  lo  que  está  pasando  en  el  mundo.  Ya  sé  que  algunos  de   ustedes me van a decir: «Es que necesito estar enterado de lo que pasa en mi  país,  en  mi  continente,  en  el  planeta»,  pero  yo  les  voy  a   refutar esa idea con mi propia experiencia. Hace más de quince años que no veo noticias, que no  veo televisión. Sí tengo que reconocer que me fascina ver   [MZQM[\u0003W\u0003XMTyK]TI[\u0003MV\u00036M\\ÆQ`\u0014\u0003XMZW\u0003PIKM\u0003U]KPW\u0003\\QMUXW\u0003Y]M\u0003  yo elijo qué información entra en mi mente. Por supuesto  que igual me entero de cosas por mi papá, que siempre está  informado, o por mis hijos que me cuentan algunas cosas.  Por ello les refuto el tener que estar siempre informados.  Igual  lo  van  a  estar,  alguien  les  contará  que  hubo  un   terremoto en algún lugar del mundo, o que hay incendios  como  pasó  recientemente  en  Australia,  y  es  lamentable.   Pero yo pienso siempre: «¿qué puedo hacer al respecto?».  Con  mantenerme  informada  de  cada  tragedia  que  pasa   en  mi  ciudad,  país  o  en  el  mundo  entero,  no  soluciono   nada. Y es ahí donde siempre me pongo a pensar: «¿qué  puedo aportar yo a los demás seres humanos para ayudar  a que las cosas cambien?». Y pues aquí estoy escribiendo  este  libro  desde  mi  alma,  desde  mi  ser  esencial  hacia  tu   ser esencial. \nAna María Deik 77 Aportar  de  esta  forma  no  tiene  necesariamente  que   ver  con  escribir  un  libro,  muchísimas  personas  en  el   planeta  están  tomando  acciones  por  el  calentamiento   global,  por  erradicar  las  armas,  la  violencia,  entre   miles  de  otros  ejemplos.  Pero  bueno,  volvamos  al  tema.   Lo  importante  que  les  quiero  transmitir  es  qué  tipo  de   información aceptamos que entre a nuestras mentes. Eso  es fundamental en nuestra vida. Hay muchísima violencia  en las noticias, y sé que tú que me estás leyendo me puedes  decir: «a mí eso no me afecta», pero créeme, a la larga eso  va repercutiendo en la mente. Sean  amorosos  con  ustedes  mismos.  Los  invito  a   que  desde  hoy  comiencen  a  discriminar  qué  tipo  de   información  permiten  que  llegue  a  sus  oídos,  a  sus  ojos   y,  por  lo  tanto,  a  su  mente.  La  mente  hay  que  cuidarla   y  cultivarla  tal  cual  lo  hacemos  con  nuestro  cuerpo.   Conviértanse  en  los  guardianes  de  sus  mentes:  ustedes   tienen el poder de decidir qué entra, nadie más.  Con quiénes nos relacionamos  Aquí  vamos  de  nuevo  con  algo  a  lo  que  a  veces  nos   resistimos. ¿Saben qué es? El tipo de personas con las que  nos  relacionamos.  Al  respecto  nos  podemos  preguntar:   ¿esta  persona  aporta  algo  a  mi  vida?  Por  supuesto  que   todos tenemos distintas amistades muy diferentes entre sí  y muy valiosas al mismo tiempo. No les estoy diciendo que  ahora mismo vayan por la vida cortando a todo el mundo.  No  es  una  cuestión  de  juicio,  es  ponernos  a  pensar  y  a   entender que algunas personas no nos hacen bien. Más  adelante  en  el  libro  vamos  a  aprender  cómo   relacionarnos mejor con las personas que sí nos importan  y  con  las  que  tenemos  relaciones  permanentes:  nuestra   pareja, hijos, padres, colegas y amigos íntimos. Pero este  \nCómo crear nuevos hábitos emocionales  78 primer  paso  es  pensar  en  esas  personas  que  no  son  tan   importantes  en  nuestra  vida,  y  que  sí  les  damos  cabida   para que opinen, para que nos juzguen quizás, y así, estas  personas terminan alterando nuestro bienestar emocional.  Hay  personas  que  son  muy  tóxicas  y  todos  tenemos   claridad en que así es. Pero muchísimas veces, y pese a esta  claridad,  seguimos  frecuentándolas  porque,  pobrecito,   nadie lo quiere, o nos decimos y convencemos a nosotros  mismos:  «es  que  somos  amigas  desde  que  empezamos  a   gatear».  Tenemos  que  saber  que  hay  personas  a  las  que  les   gusta el drama continuo y que no van a cambiar. Nosotros  tenemos la opción de no escucharlas, de no entrar en sus  juegos,  de  no  participar  en  sus  dramas.  Es  como  si  esas   personas nos estuviesen invitando a una obra de teatro y  nosotros,  por  no  decir  que  no,  accedemos  jugar  ese  rol.   Y  pues  no.  Si  no  les  hace  bien  ¿por  qué  acceder  a  ello?   Vuelvo a la misma idea. ¿Qué estamos dejando que entre  a nuestra mente? Lo importante es lograr un equilibrio a través de una  sana gestión emocional. Desde que yo descubrí todas estas  herramientas  he  ido  cambiando  mi  vida  exponencialmente,   y  eso  es  lo  que  deseo  seguir  compartiendo  en  este  libro.   Deberíamos tener, aparte de gimnasios a donde ir a entrenar  el cuerpo, lugares donde poder ir a entrenar nuestra mente.  Sería maravilloso que en los colegios se les enseñara a los niños  a entrenar su mente y  aprender a gestionar sus emociones.  Pero para eso estamos aquí, si eres madre o padre, este libro  también  te  va  a  orientar  para  lograr  una  mejor  gestión   emocional con tus hijos. Ya veremos el cómo más adelante.  ¿No  es  maravilloso  poder  tener  las  herramientas  para   cambiar? ¿Y además que TODO esté en nuestras manos?  Es  un  poder  que  descubrimos  y  que  nunca  perdemos.   De hecho, siempre lo hemos tenido, solo que lo debemos  reencontrar,  y  eso  se  logra  conectando  con  nuestro  ser   esencial. \nAna María Deik 79 Recordemos  que  todo  está  interconectado,  y  que    IT\u0003 ÅVIT\u0003 TW[\u0003 XMV[IUQMV\\W[\u0003 [M\u0003 \\MZUQVIV\u0003 UIVQNM[\\IVLW\u0003   en nuestra vida, lo positivo y lo no tan positivo también.  Los demás no giran alrededor de nosotros  Tenemos que invertir la relación que se establece entre   causa  y  efecto.  Esto lo logramos dejando de buscar la causa  afuera,  y  dándonos  cuenta  desde  la  consciencia  que  lo   que realmente hay fuera son efectos, no causas. Y que si  me  enojé  con  una  amiga  y  siento  rabia,  esa  rabia  tiene   que ver con mi programación inconsciente. En este punto  es donde los invito a estar alertas. ¿Qué nos pasa cuando experimentamos situaciones de  malestar emocional? Lo más probable es que le echemos  la culpa a los otros de lo que está pasando, en vez de ver  hacia dentro de nosotros para llevar a la consciencia esa  emoción  y  entender  qué  es  lo  que  nos  molesta  tanto  de   dicha situación.  ¿Qué  podemos  hacer  para  dejar  de  sentirnos  de   esa  manera?  Por  lo  general  tenemos  la  creencia  de  que   todo  tiene  que  ver  con  nosotros,  y  con  esto  no  digo  que   no  se  puedan  enojar,  o  sentir  mucha  rabia.  Lo  que  les   quiero decir es que esa rabia les viene a comunicar algo  importante sobre ustedes mismos. Lo importante en este  caso, al sentir esa rabia, es no dejar que crezca sino todo  lo  contrario,  hacer  que  se  minimice,  porque  si  no  esto   terminará  afectándonos  a  nosotros,  en  nuestro  cuerpo   físico. Tenemos  que  estar  conscientes  que  los  juicios  que   estamos  haciendo  sobre  una  persona  hablan  más  de   mí  que  del  otro.  Los  invito  a  que  empecemos  a  prestar   atención, porque cuando llevamos la emoción, el impulso,  el juicio, las críticas del subconsciente al consciente, todo  cambia.  Es  como  si  se  transmutara.  Les  prometo  que  es   \nCómo crear nuevos hábitos emocionales  80 una sensación mucho más placentera: de alivio, de decir:  «esto lo puedo manejar desde la calma». Y desde la calma  estar conscientes que tenemos rabia, SI, no negar la rabia  ni desplazarla, pero sí hacerla consciente.  Presta atención a tus pensamientos  Buda  decía:  «Ni  tus  propios  enemigos  te  pueden   hacer  tanto  daño  como  tus  pensamientos».  Es  vital   y  fundamental  en  nuestra  vida  adquirir  el  hábito  de   prestarle  atención  a  nuestros  pensamientos,  ya  que   así  te  darás  cuenta  que  le  estás  prestando  atención  a   críticas que se repiten frente a las mismas situaciones.  Y si no actuamos para cambiar, la situación se nos va a  seguir presentando a lo largo de nuestra vida. Los invito a que aprovechen el hecho de poder observar  su  mente,  a  ver  qué  pensamientos  se  repiten,  y  así  van   a  ir  conociéndose  a  sí  mismos.  Ya  conocen  la  frase  que   dice  «El  conocimiento  es  PODER».  Pues  mi  intención   con  este  libro  es  que  nos  empoderemos  juntos(as).  No   les  voy  a  mentir.  El  camino  no  es  corto,  el  camino  del   autoconocimiento  es  toda  la  vida.  Ese  tema  lo  vamos  a   trabajar más profundamente cuando lleguemos a los seis  pasos  para  aprender  a  gestionar  las  emociones.  Ahora   comenzamos a llevar a la CONSCIENCIA la importancia  de tener BUENOS HÁBITOS EMOCIONALES. \nAna María Deik 81 El estrés  Ya  se  podrán  imaginar  qué  es  el  estrés,  ¿verdad?   Sabemos  que  todos  hemos  vivido  el  estrés  en  nuestras   vidas, es un denominador común de nuestro diario vivir.  Cuántas  veces  decimos:  «estoy  estresada(o)».  Yo  por  lo   menos  lo  solía  decir  todo  el  tiempo.  La  verdad  es  que   TODO me estresaba: los niños, el trabajo, el clima frío de  Santiago de  Chile,  las  deudas,  TODO.  En  Venezuela se   suele decir mucho: «Ay, chama, ¡qué estrés!».   -[\\n\u0003KWUXZWJILW\u0003KQMV\\yÅKIUMV\\M\u0003Y]M\u0003MT\u0003M[\\Zu[\u0003INMK\\I\u0003  tanto  la  salud  física  como  mental  de  los  seres  humanos.   ¿Podemos  tener  una  buena  calidad  de  vida  si  sufrimos   estrés  constantemente?  Ya  sabemos  que  la  respuesta  es   NO.  TODOS,  y  créanme:  TODOS  los  seres  humanos   necesitamos  aprender  a  manejar  el  estrés.  Y  más  que   aprender a manejarlo, podemos aprender a prevenirlo, de  manera que podamos lograr un estilo de vida más pleno   a\u0003OZI\\QÅKIV\\M\u0016\u0003  Y  volvemos  a  la  misma  pregunta.  ¿Qué  es  el  estrés?    ;MOV\u0003TI\u0003TQ\\MZI\\]ZI\u0003KQMV\\yÅKI\u0003XWLMUW[\u0003LMKQZ\u0003Y]M\u0003 «el estrés  implica  cualquier  factor  externo  o  interno  que  induce  a   un aumento en el esfuerzo por parte de la persona para  mantener un estado de equilibrio dentro de sí misma y en  relación  con  el  ambiente.  Es  un  conjunto  de  reacciones    Å[QWT~OQKI[\u0003a\u0003X[QKWT~OQKI[\u0003Y]M\u0003M`XMZQUMV\\I\u0003MT\u0003WZOIVQ[UW\u0003  cuando se lo somete a fuertes demandas». Busquemos  un  concepto  más  cercano.  Sabemos   que  el  estrés  es  una  reacción  de  nuestro  organismo   ante  situaciones  de  la  vida  o  pensamientos  y  emociones   que  tenemos.  Es  normal  y  sano  en  su  justa  medida,   pero  ¿qué  pasa  cuando  no  lo  podemos  manejar  y  se   va  incrementando?  Nos  solemos  enfermar.  Veamos  a   continuación  los  hábitos  emocionales  que  podemos   trabajar como práctica constante para evitar el estrés. \nCómo crear nuevos hábitos emocionales  82 1.  Estado de no Juicio:  Prestar atención a los juicios. Los juicios no hacen más  que envenenar nuestra sangre y nuestra mente. Tenemos  que  mantenernos  alerta.  El  evitar  hacer  juicios  es  una   disciplina dura, pero se puede lograr. Darte cuenta de los  pensamientos  automáticos  que  tienes.  Darte  cuenta  de   tus prejuicios. Y recordar siempre que cuando te vuelves  un observador de tu mente, la mente se queda en calma,   XWZY]M\u0003TI\u0003UMV\\M\u0003TW\u0003Y]M\u0003Y]QMZM\u0003M[\u0003Y]M\u0003\\\u0003\\M\u0003QLMV\\QÅY]M[\u0016\u00034I\u0003  mente te quiere atrapar en su diálogo. Entonces cuando  empiezas a hacer esas pequeñas cosas, comienzas a verlas  de otra manera. Y cuando ves las cosas de otra manera te  das cuenta de que TÚ tienes el poder de DECIDIR cómo  las quieres vivir. El  poder  lo  tenemos  nosotros,  no  podremos  cambiar   las  circunstancias,  pero  sí  que  podemos  decidir  cómo   vivirlas.  La  inteligencia  emocional  radica  en  cómo   recibimos  y  gestionamos  las  cosas  que  nos  pasan.  No   podemos controlar todas las situaciones o circunstancias  que vivimos en nuestra vida, pero SI podemos controlar  cómo reaccionamos ante ellas. Las  emociones  como  ya  hemos  hablado  antes  son   fundamentales  en  nuestra  vida.  No  hay  emociones  ni   buenas, ni malas. Lo importante es aprender a gestionarlas.  ¿Quieres  aprender  a  ser  el  dueño(a)  de  tu  vida?  Pues   empieza por ser el dueño(a) de tus pensamientos y de tus  emociones  y  no  dejes que te invadan, que te dominen  y  que se desborden en ti. Solo el saber y el estar consciente  de que TODO lo que nos rodea tiene que ver con nosotros,  nos produce un estado de paz y tranquilidad. Yo puedo sentir rabia, por ejemplo, si un adulto agrede  a mi hijo. Obviamente voy a sentir rabia, no sería sano no  sentirla. Amo a mi hijo y no quiero que nadie lo agreda.  \nAna María Deik 83 Pero  ¿voy  a  dejar  que  esa  rabia  se  desborde  en  mí  de   forma descontrolada o voy a gestionarla de forma sana?  Gestionarla  de  una  manera  sana  es,  sabiendo  primero,   que la rabia me ayuda a poner límites. Me permite decirle  a ese adulto que no se vuelva a meter con mi hijo, o me  puede  impulsar  a  denunciarlo,  entre  otras  cosas.  Pero  si   la rabia se desborda en mí y me entran ganas de pegarle  y lo hago, las consecuencias pueden llegar a ser terribles.  Además, si yo sirvo de modelo para mi hijo y no quiero  que  él  o  ella  se  descontrole,  yo  tengo  que  aprender  a   gestionar mi rabia. Como dice un meme que siempre me  ha gustado y lo he compartido cada vez que aparece en las  redes sociales en el que aparece un león con su cachorro.  El  León  le  dice  a  su  cachorro:  «Ten  cuidado  hijo»,  a  lo   que  él  responde:  «No,  papá,  tú  ten  cuidado  porque  yo   sigo tus pasos». Si  todo  te  lo  tomas  personalmente  vas  a  vivir   ofendido(a)  la  mayor  parte  de  tu  vida.  Tú  decides  qué   cosas  te  afectan  o  no  y  allí  reside  tu  poder.  ¿Vas  a  dejar   que tus emociones y pensamientos sigan reinando tu vida?  ¿Vas a seguir repitiendo los mismos hábitos emocionales  que te producen molestia, en vez de bienestar?  La felicidad no es estar riendo todo el día, la verdadera  felicidad  radica  en  estar  conscientes  que  tenemos  dos   polaridades,  en  saber  compaginar  los  dos  extremos,   porque sin conocer la oscuridad no podemos conocer la  luz. Somos seres duales. Por ende, siempre es bueno buscar  el  equilibrio  dentro  de  nosotros.  La  verdadera  felicidad   es  estar  en  un  estado  de  armonía  interior  entendiendo   que  las  emociones  son  necesarias  y  aceptando  que  nos   podemos  sentir  enojados,  tristes,  ansiosos.  Que  esas   emociones nos están enseñando algo de nosotros mismos  y debemos observarlas, aceptarlas y normalizarlas. Eso es  aprender  a  gestionarlas,  es  aprender  a  tener  NUEVOS   HÁBITOS EMOCIONALES que nos aporten a nuestra  \nCómo crear nuevos hábitos emocionales  84 vida para lograr el crecimiento personal que merecemos.  Porque  nos  merecemos  lo  mejor  de  este  mundo,  para   eso vinimos. Tú te mereces estar en paz, en armonía. Te  mereces  ir  conociéndote  a  ti  mismo(a)  y  de  esa  forma,   cada  día  que  pase,  te  vas  a  amar  más,  porque  te  vas  a   comprender realmente. Y al momento en el que empiezas  a vivir de a poco en un estado de consciencia consciente,  toda tu percepción cambia.  Lo  que  los  otros  hacen  por  supuesto  que  te  puede  generar   emociones,  pero  no  lo  harán  con  la  misma  intensidad   de  antes,  porque  ahora  eres  capaz  de  gestionarlas,  por   tanto,  logras  empezar  a  CREAR  NUEVOS  HÁBITOS    -57+176)4-;\u0003 XIZI\u0003 \\]\u0003 ^QLI\u0014\u0003 XIZI\u0003 Y]M\u0003 XWZ\u0003 ÅV\u0003 [MI[\u0003  dueño(a) de ella, de tus pensamientos y emociones. ¿Sabes  por qué? Porque realmente te mereces ser feliz. No viniste a  la Tierra a caminar por este camino que llamamos vida para  estar sufriendo todo el tiempo. Sí, puedes sentir dolor frente  a situaciones que van a ser dolorosas, pero puedes elegir no  sufrir. El sufrimiento es opcional. ¿Sabes lo maravilloso que es el saber y el estar consciente  que  tienes  el  poder  en  tus  manos?  Solo  hace  falta  que  te   decidas  a  emprender  este  camino  de  autodescubrir  tu   propio mundo. ¿No es maravilloso? Con el corazón en la  mano te cuento que para mí lo ha sido. Ha cambiado mi  relación  con  mis  padres,  con  mis  hijos,  con  mis  amigos,   conmigo  misma.  Porque  decidí  emprender  este  camino.    -[W\u0003VW\u0003[QOVQÅKI\u0003Y]M\u0003\\WLW\u0003MT\u0003\\QMUXW\u0003[MXI\u0003K~UW\u0003OM[\\QWVIZ\u0003  mis emociones, ni que todos mis hábitos emocionales sean  sanos.  Pero  sí  que  estoy  trabajando  en  ellos,  y  el  simple   hecho  de  hacerme  consciente  ha  cambiado  tantas  cosas   en  mi  vida  a  mi  favor,  que  las  quiero  compartir  contigo   para decirte que si lo decides lo puedes hacer y que, si ya  lo decidiste, al igual que yo, estás en este camino y debes  saber que no estás solo(a), que el camino es largo (de toda  la vida) y que hay que disfrutarlo.  \nAna María Deik 85 El  acto  más  amoroso  que  puedes  hacer  es  cuidar  tus   pensamientos y tus emociones. Y sonaré repetitiva hasta  el cansancio porque gestionar nuestro mundo emocional  es  algo  fundamental,  tanto  como  caminar,  estudiar,  y   comer sano. 2.    Ser  compasivos  y  ponernos  en  el  lugar  del   otro:  Ponernos en el lugar del otro es esencial para nuestro  crecimiento emocional. No podemos pretender que todos  estén  de  acuerdo  con  nosotros  todo  el  tiempo.  Cada   persona es un universo, y debemos entender que el otro  puede pensar diferente y aceptar que es así. Yo sé que es  difícil. A mí por lo menos me ha costado muchísimo, pero  lo  he  ido  logrando  a  través  del  tiempo.  Por  ejemplo:  el   otro día hablando por teléfono con mi mamá la noté con  el ánimo bajo. Yo estoy continuamente monitoreando lo  que siento y pienso. Estoy en proceso de transformación,  y sé que en algún momento se me hará más fácil porque  se volverá un hábito, pero hasta que eso no suceda estoy  cuidando mucho mi proceso. Entonces, le pregunté a mi  mamá qué le pasaba. Me contó con pocas palabras, y le  dije que mejor habláramos en otro momento si no tenía  ganas. Entonces decidimos hablar al día siguiente. Horas  más tarde yo estaba con mis hijos y pensé: «¿y si mi mamá  me necesita?». La llamé y le dije: «mami, te llamo porque  me gustaría saber si necesitas algo. ¿Estás bien?». Me dijo  que  sí,  que  se  le  iba  a  pasar,  y  yo  me  quedé  tranquila.    )T\u0003 ÅVIT\u0003 PIJTIUW[\u0003 W\\ZW\u0003 LyI\u0003 a\u0003 MTTI\u0003 [M\u0003 [MV\\yI\u0003 UMRWZ\u0014\u0003 KWV\u0003  más  ánimo.  La  empatía  es  ese  pensamiento  que  tuve  al   ponerme en el lugar de mi mamá.  \nCómo crear nuevos hábitos emocionales  86 3.  Autoindagación:  Es  darte  cuenta  cuando  reaccionas  de  una  forma   determinada  frente  a  un  estímulo  y  te  conviertes  en   observador de ti mismo. ¿Por qué estoy reaccionando de  esta  manera?  ¿Qué  hay  detrás  de  este  hábito  emocional   que me produce un malestar? En este estado no cuestionas  al  otro,  sino  que  te  observas  a  ti  mismo.  Es  un  hábito   emocional  sano  porque  lo  haces  liberando  los  juicios.   Tampoco  se  trata  de  que  realices  juicios  en  torno  a  tu   persona. Recuerda que la compasión tiene que empezar  por uno mismo(a). No hay culpables cuando te vuelves un  observador(a) de las situaciones desde la compasión.  Te  invito  a  que  observes  tus  hábitos  emocionales   (reacciones)  frente  a  ciertos  eventos,  y  eso  no  solo  te  va   a ayudar a conocerte a ti mismo(a), sino que también te  ayudará a bajar la intensidad de la emoción la próxima vez  que se presente el mismo evento o una situación similar,  y estarás así gestionando de una forma sana esa emoción.  Sí, la vas a sentir. Y Sí, es normal. Es lo más normal del  mundo.  No  estamos  acostumbrados  a  sentir  nuestras   emociones y dejarlas que recorran nuestro cuerpo. Por lo  general no las aceptamos y las evadimos de muchas formas:  comprando  compulsivamente,  consumiendo  alcohol  o   sustancias (distintas drogas), fumando cigarros. Pero ¿qué  pasa con esas emociones? Pues pasa no solo que no se van,  sino que se van acumulando en el cuerpo. ¿Les revelo un  secreto potente? Aunque no tengamos recuerdos, porque  muchos  de  ustedes  me  pueden  decir,  pero  Anita,  yo  no   recuerdo haber tenido abusos emocionales de ningún tipo  de parte de mis padres, el CUERPO NUNCA OLVIDA:  las  emociones  las  traemos  impresas  en  nuestro  cuerpo,   no  importa  que  no  recordemos  sucesos  de  nuestra  vida.   El  cuerpo  SÍ  tiene  memoria  emocional.  Por  eso  nos   \nAna María Deik 87 enfermamos,  por  eso  en  algún  momento  caemos  en   depresión o explotamos continuamente sin saber qué nos  pasa. Por eso es TAN IMPORTANTE OBSERVARNOS.  Los  invito  a  que  se  vuelvan  observadores  de  sí   mismos(as).  Es  como  jugar  a  los  detectives.  Lo  pueden   tomar  como  un  juego  si  se  les  hace  más  simple,  más   llevadero  o  divertido.  Para  mí  cada  descubrimiento  que   tengo  cuando  voy  haciendo  nuevos  hábitos  emocionales   me produce una sensación de sorpresa. Es como si fuese  una niña nuevamente. Una niña que descubre que puede   [WXTIZ\u0003M[I[\u0003ÆWZM[\u0003Y]M\u0003XIZMKMV\u0003TT]^QI[\u0003LM\u0003ITOWL~V\u0014\u0003a\u0003Y]M\u0003  vuelan por todo el aire. Y es que, la verdad es que SÍ soy  niña,  una  parte  de  mí  lo  es,  y  una  parte  de  ti  también.   Llevamos  a  nuestro  niño  o  niña  interior  siempre  con   nosotros.  Ahora es el momento adecuado para hablar de nuestra  historia  de  vida.  Los  hábitos  emocionales  que  traemos   están  condicionados  por  las  experiencias  que  hemos   vivido  en  nuestra  infancia,  adolescencia  y  juventud,  así   como  también  están  condicionadas  por  las  experiencias   que  hemos  heredado  de  nuestros  abuelos  y  de  nuestros   padres.  \n\nAna María Deik 89 8MI NIÑO(A) INTERIOR  Como  probablemente  hemos  escuchado  nuestro  niño(a)   interior  representa  nuestra  esencia.  Somos  nosotros  en   nuestro  estado  más  puro.  Ese  niño  interior  tenía  deseos,   sueños, tenía una forma y una consistencia pura, tangible  y  auténtica.  El  problema  es  que  a  medida  que  fuimos   creciendo  este  niño  interior  se  fue  postergando  con   creencias de los demás, con imposiciones de la sociedad,  con  ausencias  de  nuestros  padres,  con  sensación  de   abandono, con falta de validación y de escucha. Aquellos  sueños auténticos y puros se fueron desvaneciendo en el  aire,  se  volvieron  matices  blancos,  negros  y  grises,  y  ese   niño interior se fue apagando dentro de nosotros. Me  da  una  profunda  tristeza  cuando  pienso  en  ello,   pero  ¿les  cuento  algo  maravilloso?,  ese  niño  interior  de   cada  uno  de  nosotros  está  esperando  que  lo  vayamos  a   buscar, que lo rescatemos para que juntos volvamos  a ir  por nuestros sueños. Yo empecé a conectarme con mi niña interior después  que me casé. Recuerdo que vivíamos en Venezuela y en  ese  tiempo,  por  diversos  motivos,  yo  no  trabajaba.  Uno   de esos motivos era la inseguridad que reinaba en mi país  de crianza. De pronto, un día me encontraba sola en mi  departamento, tomé un lápiz y empecé a escribir sobre mi  jardín de sueños. Era un poema. En ese momento no lo  sabía, y no lo supe hasta muchas décadas después: estaba  rescatando  a  través  de  mis  escritos  a  mi  niña  interior,   que  pedía  a  gritos  salir  del  lugar  donde  se  encontraba.    Un fragmento del poema que recuerdo dice así:   \nCómo crear nuevos hábitos emocionales  90 ...y las noticias que me trae el cielo iluminan mi ansias.  Porque el jardín que guardó mis secretos trae una extraña  enseñanza,  que  el  tesoro  de  mis  sueños  debe  crecer  en   esperanzas del alma. Y me envuelve una suave brisa que  viene  del  horizonte  y  en  una  cálida  sonrisa  mi  corazón   esconde deseos del alma libre que mi cuerpo pospone, por  una mañana de luz y por un Dios que murió por nosotros  en  la  cruz...  y  las  estrellas  brillarán  bajo  un  sol  que  nos   calienta el cuerpo, y los anhelos quedarán despiertos en el  jardín de los sueños. Mi niña interior sabía que si mi alma tenía esperanza  podía  rescatar  mis  sueños  y  anhelos.  También  encontré   este otro poema: Deseo encontrar mi refugio Estará escondido dentro de mis sueños O en el detalle más pequeño. A lo mejor en la AMAPOLA O quizás en mis pensamientos Puede que en lo sublime de un encuentro. Y si busco en el océano Donde se duermen los anhelos ¿Estará mi refugio dentro de ellos? Cómo hacer para que al conseguirlo Lo pueda guardar para siempre Quizás en mi alma se mantenga latente Sería este un sitio seguro En el que me perdería en mi propio laberinto Al que siempre volvería. Sí, haré de mi alma un refugio \nAna María Deik 91 Porque allí es donde podría soñar y materializar. Y desde allí puedo esparcir mis dones a la  humanidad. Eso  lo  escribí  el  once  de  julio  del  año  2005,  antes   de  venirme  a  Chile.  Era  mi  niña  interior  hablándome,   saliendo a través de mis palabras. En mi caso, el escribir  hizo  que  me  conectara  con  ella,  porque  ella  también   amaba escribir.  Hace  unos  años  atrás,  hurgando  en  las  cajas  de   recuerdos  de  mi  mamá,  encontré  un  poema  mío  que   había escrito a los doce años. Al comenzar a leerlo entré  en  shock.  Dentro  de  mi  primera  colección  de  cuentos   llamada  Crecer  hay un cuento que se llama  La estrellita que  no podía brillar , y trata de una estrella que sufre  bullying  de  parte de las otras estrellas en la Vía Láctea porque le falta  una pata y, por ende, no puede brillar como todas. Cuando comencé a leer el escrito gastado en un viejo  papel  con  fecha  del  año  1986  las  lágrimas  comenzaron   a  resbalar  lentamente  por  mis  mejillas,  sin  ruido,  con   complicidad. El escrito contaba la historia de una luna a  la que le hacían  bullying  las estrellas en el cielo, burlándose  de los cráteres de su cara. Es increíble que yo guardara en  mi subconsciente esa historia durante veinticinco años y  la haya replicado con algunas variaciones en uno de mis  cuentos para niños. Eso había quedado guardado dentro  de mí y mi niña interior me lo estaba mostrando.  Otra señal de que mi niña interior se quería conectar  conmigo fue que al regresar a Chile se me ocurrió escribir  un  texto  con  la  mano  derecha  (yo  soy  zurda)  y  empezó   a  hablar  a  través  de  mis  escritos  mi  niña  interior.  Fue   realmente  impresionante.  Comencé  a  describir  cosas  de   cuando tenía tan solo un año y vivía en Santiago de Chile  en la casa de mis abuelos. Luego constaté con mi mamá  que lo que narraba era cierto. Les comparto un fragmento  de ese texto que se llama  Memorias de una chiquita . \nCómo crear nuevos hábitos emocionales  92 Aunque  tenía  apenas  un  año  y  unos  meses  percibo    Y]M\u0003UM\u0003O][\\IJI\u0003U]KPW\u0003TI\u0003VI\\]ZITMbI\"\u0003MT\u0003[WT\u0014\u0003TI[\u0003ÆWZM[\u0014\u0003TI\u0003  lluvia y el agua puesta de todas las formas me enloquecía.  Pero la playa comenzó a existir totalmente en mi universo  cuando  toqué  por  primera  vez,  en  Venezuela  a  los  dos   años de edad, las aguas tibias del Mar Caribe. Un mar tan  transparente que yo confundía con una piscina grande y  salada  llena  de  corales  y  peces  de  todos  los  colores.  Me   sumergía en sus  aguas cristalinas como una sirena chica  queriendo  vivir  en  ese  mundo  marino  y  etéreo  para   siempre.  También  esto  fue  una  osadía  para  mi  pobre   mamá, al tratar de sacarme inútilmente del mar cada vez  que nos íbamos de la playa, tanto así que mis lágrimas se  fundían  con  el  mar  prometiéndose  la  una  a  la  otra  que   pronto se volverían a encontrar. Recuerdo de mi país natal, Chile, mi fascinación por  las  uvas  blancas.  Me  sentaban  en  el  tope  de  la  cocina,   al  lado  del  fregadero.  Yo  tenía  puesto  un  lindo  delantal   blanco con algún dibujo que no logro descifrar al ahondar  en mis recuerdos. Me las pelaban una por una mientras  se me hacía agua la boca. Yo miraba a mi madre con mis  grandes ojos color marrón y esperaba para sentir el placer  de estrujarlas en mi boca hasta sacarles el jugo. Eran para  mí  como  una  limonada  refrescante  en  un  día  caluroso.   Algunas más dulces que ácidas. Era mi fruta preferida.  -[W[\u0003LyI[\u0003[QOVQÅKIZWV\u0003U]KPW\u0003MV\u0003UQ\u0003^QLI\u0003LM\u0003KPQY]Q\\I\u0016\u0003  Me  colocaban  en  el  jardín  de  la  casa  de  mis  abuelos   maternos  y  me  quedaba  horas  allí  observando  el  color   de  las  hojas,  sintiendo  el  aire  seco  y  caliente  del  verano   y  escuchando  los  sonidos  de  los  autos  de  la  calle  que  se   mezclaban  con  los  pajaritos  cantando  las  más  dulces   melodías. Me gustaba tocar las hojas, las olía, incluso las  metía en mi boca. Tenía varios juguetes, pero el jardín de  la casa era mi regalo más preciado. Allí era donde sentía  esa  paz  que  invade  a  las  bebés,  y  que  se  siente  solo  en   \nAna María Deik 93 los lugares divinos tocados por el cielo. Eran tiempos de  amor. Una  hermosa  mujer  de  tez  oliva  y  ojos  negros   profundos,  tan  profundos,  enigmáticos  y  solitarios  como   un hoyo negro en la galaxia me profesaba un sentimiento  tan grande y contradictorio como el que genera el tiempo.  Yo la sentía mía. Nadie me alimentaba, me cuidaba y me  mimaba  mejor.  Sabía  dentro  de  mi  alma  que  nunca  me   iba a abandonar. Y así fue. Esa hermosa mujer nunca lo  ha hecho y nunca lo hará. Cómo es que lo sé con certeza,  no importa. Cuando uno sabe desde el corazón, no hay  equivocación  que  valga.  Mamá  y  yo  siempre  estaremos   unidas pese a las vicisitudes de la vida. Ese  es  el  texto  que  quería  compartir  con  ustedes.  Es   mucho más largo, pero esa parte es mi memoria de cuando  era más chiquitita. Y claro que me había conectado con  mi niña interior. Ella me hablaba a través de las palabras  puestas  en  papel  y  desde  que  comenzó  a  hacerlo  nunca   más se detuvo, por eso hoy tengo más de cuarenta cuentos  infantiles  escritos  y  publicados.  Mi  niña  interior  es  mi   compañera  de  aventuras  en  esta  pasión  que  conjuga  la   escritura con la infancia, y la aventura que mezclan hoy  en  mi  vida  las  emociones  con  mi  deseo  profundo  de   aportar  a  la  humanidad.  Por  eso  escribo,  para  darle  un   sentido  a  mi  vida  y  para  transformarme  a  través  de  esa   búsqueda  y  poder  compartirla  con  ustedes.  Esa  es  mi   mayor satisfacción.  En el proceso MARAVILLOSO de autodescubrirme,  amarme,  cuidarme  y  aprender  a  gestionar  mi  mundo   emocional, había ido reconociendo a esa niña que se había  perdido  en  el  camino.  La  fui  rescatando  de  a  pedacitos,   con  mucho  amor,  y  dolor  también.  Quise  abrazarla  y   perderme con ella, pero tenía que ser valiente. No tenía,   quería   ser  valiente  y  tomé  la  decisión  de  rescatarla  por   \nCómo crear nuevos hábitos emocionales  94 completo.  Debo  confesar  que  todavía  lo  estoy  haciendo.   Es un proceso. La vida es el camino que recorremos, no el   ÅVIT\u0016\u00036W\u0003M[\u0003MT\u0003ZM[]T\\ILW\u0003TW\u0003Y]M\u0003QUXWZ\\I\u0016\u00038WZ\u0003MTTW\u0003PIa\u0003Y]M\u0003  decidir caminar. El año 2019 en uno de los talleres que impartí llamado  «El  Tren  de  las  Emociones»  les  hice  una  meditación  a   las  participantes  sobre  el  niño(a)  interior.  Una  semana   antes,  por  mail,  les  pedí  que  llevaran  una  fotografía  de   cuando tuviesen entre tres y seis años aproximadamente.  La  experiencia  fue  hermosa.  A  varias  se  les  cayeron  las   lágrimas cuando conectaron con esa niña que las estaba  esperando hacía tanto tiempo. Durante el  break  que tuvimos, una de las participantes  me  llamó  aparte  para  hablar,  ya  que  quería  contarme   algo  que  le  había  sucedido.  Cuando  se  puso  a  buscar   fotos de cuando era pequeña no encontró ninguna. Esto  le llamó profundamente la atención por lo que comenzó  a  indagar.  Lo  primero  que  hizo  fue  llamar  a  su  mamá,   y  allí  descubrió  cuál  fue  realmente  su  niñez.  No  tenía   ni  una  sola  foto  porque  había  estado  gran  parte  de  su   infancia  hospitalizada,  no  me  contó  el  por  qué,  pero  en   ese  momento  era  irrelevante.  Se  echó  a  llorar  conmigo   a mares. Estuvimos las dos abrazadas un rato. Ella había  conectado  con  su  niña  interior,  la  cual  había  estado   desvalida en un hospital. Una niña que se había sentido  sola tantas veces, quizás abandonada, desesperada, triste.  Para esa participante del taller su vida ya no iba a ser la  misma.  Ahora  estaba  comenzando  a  conectarse  con  su   niña, y el trabajo de ambas recién comenzaba.  Los invito a que hagamos un ejercicio para empezar a  reconectarnos con nuestro niño(a) interior. Con la mano  contraria, en mi caso que soy zurda con la mano derecha,  y los derechos con la mano izquierda, vamos a escribirle  unas  líneas  a  nuestro  niño(a)  interior.  Sin  juzgar  lo  que   escriban, solo conéctense y escríbanle una palabras. \nAna María Deik 95 Carta a nuestro niño(a) interior  ______________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________ ________________________________________ _________________________________________ _________________________________________ _________________________________________ _________________________________________                 ____________________        Firma  \nCómo crear nuevos hábitos emocionales  96 Y  ahora  se  preguntarán,  ¿por  qué  les  hablo  de  su   niño(a) interior? La razón es simple. Traemos en nuestra  memoria muchas emociones de cuando éramos pequeños.  Son tantas, que no las podríamos contabilizar, y cuando  esas necesidades no están siendo satisfechas nos frustramos  y  lloramos.  A  medida  que  crecemos  vamos  requiriendo   otro tipo de necesidades aparte de las básicas, que son las  afectivas. Necesitamos la atención de mamá y papá, sobre  todo de mamá. Y mientras crecemos vamos necesitando  más  y  más  afecto,  cariño,  respeto  por  parte  de  nuestros   progenitores: que nos escuchen, que nos validen, que nos  miren, que nos mimen, que nos abracen. Por ello, es importante que reconectemos con nuestros  niños(as), porque hoy somos cien por ciento responsables  de buscarlos y sanar juntos a ellos (as).  \nAna María Deik 97 9PRIMER PASO  AUTOCONOCIMIENTO ES PODER  Cuando aprendemos a conocernos, en verdad vivimos   -R. Shüller- Cuando  aprendemos  a  autoconocernos  nos   volvemos  conscientes  de  nuestras  capacidades,  de   las  potencialidades  que  poseemos,  reconocemos   nuestras  motivaciones  al  igual  que  nuestros  miedos.   El  autoconocimiento  nos  ayuda  también  a  estar   conscientes  de  nuestras  propias  emociones.  Nos   volvemos  observadores  de  nuestro  universo.  La  idea   es  que  nos  convirtamos  en  exploradores  de  nuestras    MUWKQWVM[\u0003   XIZI\u0003   I[y\u0003   XWLMZ\u0003   QLMV\\QÅKIZTI[\u0003   K]IVLW\u0003  aparezcan.  Es  poder  decirnos:  «ahí  está  el  enojo  que   siento; ahora estoy experimentando frustración; en este  momento  me  siento  feliz».  Necesitamos  entrenarnos    XIZI\u0003QLMV\\QÅKIZ\u0003a\u0003ZMKWVWKMZ\u0003V]M[\\ZI[\u0003MUWKQWVM[\u0016\u00032]VO\u0003  decía: «El contacto con uno mismo es la piedra angular  para  autorealizarnos,  para  alcanzar  ese  equilibrio  tan   necesario  y  alcanzar  el  bienestar.  Así,  mientras  no   volquemos  los  ojos  hacia  nuestro  interior,  seguiremos   viviendo de puntillas, por encima, como si de un sueño  se  tratara».  Si  no  te  conoces  a  ti  mismo,  no  puedes   conocer a los demás. Conocernos  a  nosotros  mismos  suena  simple,  lo  sé,   pero en verdad es un reto. ¿Qué tanto nos conocemos a  nosotros mismos? ¿Qué necesitamos? Las decisiones que  \nCómo crear nuevos hábitos emocionales  98 tomamos en nuestra vida surgen tanto del consciente como  del  inconsciente.  Siempre  estamos  tomando  decisiones,  incluso  la  de  no  ir  al  baño,  cuando  estamos  viendo  una   película que está buenísima y no queremos perdernos ni  un segundo. Tomamos decisiones cada vez que vamos a  salir, cuando hacemos una llamada telefónica, al decidir  llevar  a  nuestros  hijos  de  paseo,  o  si  no  queremos  ir  a   tomar un café con alguna amiga.   0Ia\u0003LW[\u0003NIK\\WZM[\u0003Y]M\u0003QVÆ]aMV\u0003MV\u0003TI\u0003\\WUI\u0003LM\u0003LMKQ[QWVM[\u0003  cuando  vienen  de  la  MENTE  CONSCIENTE,  y    \\QMVMV\u0003 Y]M\u0003 ^MZ\u0003 KWV\u0003 TI\u0003 ZMÆM`Q~V\u0003 a\u0003 MT\u0003 I]\\WKWVWKQUQMV\\W\u0016\u0003  Conocernos  suena  fácil,  pero  no  lo  es.  Tenemos  que   tomar el autoconocimiento como un reto en nuestra vida.  Es  una  de  las  cosas  más  importantes  que  tenemos  que   hacer para cambiar. A  continuación,  haremos  algunos  ejercicios  de   autoconocimiento.  Para  ello  hay  que  anotar  debajo    LM\u0003 KILI\u0003 ]VI\u0003 LM\u0003 TI[\u0003 LMÅVQKQWVM[\u0003 KQVKW\u0003 LM[MW[\u0014\u0003 QUX]T[W[\u0014\u0003  sueños,  pasiones,  miedos,  pensamientos,  emociones,  y   sentimientos.   Deseos  ¿Qué  es  lo  que  deseas  realmente?  Por  ejemplo,  en   mi  caso  yo  deseo  publicar  este  libro,  hacer  seminarios   relacionados  con  los  HÁBITOS  EMOCIONALES,   lanzar mi sexta colección de cuentos infantiles y escribir  otro libro que ya tengo en mente. ¿Cuáles son los tuyos?  1. _________________________________________ 2. _________________________________________ 3. _________________________________________ \nAna María Deik 99 4. _________________________________________ 5. _________________________________________  Impulsos  ¿Qué  te  hace  avanzar?  ¿Cuáles  son  tus  impulsos?   ¿Qué  es  lo  que  te  suelta  el  freno?  ¿Cuál  es  tu  motor?  A   mí, por ejemplo, me hace avanzar el crear contenidos, ya  sea en libros o en talleres. Otra cosa que me moviliza es la  escritura. También el hecho de ser la proveedora de mis  hijos es un motor en mi vida.  1. _________________________________________ 2. _________________________________________ 3. _________________________________________ 4. _________________________________________ 5. _________________________________________  Sueños  ¿Cuáles son tus sueños? ¿Con qué sueñas? Yo sueño con  viajar por muchos países del mundo. Uno de mis sueños  es escribir muchos libros para ayudar con mi experiencia  y conocimientos a otras personas. Otro de mis sueños es  llegar a escribir e ilustrar un cuento infantil.  1. _________________________________________ \nCómo crear nuevos hábitos emocionales  100 2. _________________________________________ 3. _________________________________________ 4. _________________________________________ 5. _________________________________________  Pasiones  ¿Cuáles  son  tus  pasiones?  Una  de  las  mías  es  bailar.   Otra  de  mis  pasiones  es  pintar  con  acrílico  ilustraciones   infantiles.  Estoy  pensando  alguna  otra...  ¿Ven  que  no   es  tan  fácil  escribir  estos  li aprender a estar en el momento presente con aceptación,  compasión y apertura a la experiencia. \nAna María Deik 111 10SEGUNDO PASO  MIS NECESIDADES AFECTIVAS  Como  ya  les  he  contado,  cuando  éramos  pequeños   hubo muchas necesidades afectivas que tuvimos y que no  fueron satisfechas, ya sea por abusos emocionales activos  o pasivos.  ¿Cuáles son los abusos  emocionales pasivos?  Que  nos  quitaran  la  mirada,  el  habla,  la  escucha.   Muchas  veces  nuestros  padres  de  forma  intencional  o   no, se comportaban de una forma determinada frente a  nuestras «demandas válidas»: de afecto, de validación, de  escucha, de contención.  ¿Y los abusos emocionales activos?    Son cuando de pequeños hemos presenciado gritos y  golpes entre nuestros padres, o cuando nos han gritado o  golpeado. Por ende, si estas necesidades a lo largo de nuestra vida  no  son  satisfechas,  vamos  creando  un  vacío  existencial.   Ese  vacío  existencial  puede  ser  grande,  mediano  o   pequeño según nuestra historia de vida, pero no importa  el tamaño, siempre repercute en nuestra adultez.  \nCómo crear nuevos hábitos emocionales  112 Cuando  descubrí  y  comprendí  el  concepto  del  vacío   existencial, pude conectar con ese vacío que sentía a los  doce  años,  y  cuya  naturaleza  me  costó  tanto  entender.   Desde que nos fuimos de Chile mis papás sufrieron mucho,  y como yo estaba pequeña y siempre acompañaba a mamá  fui  absorbiendo  sus  dolores,  sus  penas,  sus  frustraciones,   como si fuesen mías. Y ella se metía tanto en su mundo  que yo me sentía abandonada, rechazada. No tenía acceso  a ella, a que me mirara, a que estuviese presente conmigo,  ya que mamá no lograba gestionar su mundo emocional.  A esto debo sumar las peleas entre mi mamá y mi papá en  las que volaban ollas por el cielo. Claramente viví en mi  vida los dos tipos de abusos de parte de mis padres: tanto  pasivos como activos.  Yo  era  una  niña  sumamente  sensible  a  mi  entorno   y  vivía  en  un  ambiente  de  violencia  que  se  repetía  día   tras día en nuestras vidas. Tanto así que a los doce años  empecé a llorar sin saber qué me pasaba. Por supuesto en  esa época, en la que no había tantas herramientas como  las hay hoy en día, nadie entendía mi mundo emocional.  Por lo que la única herramienta poderosa que empecé a  usar fue la escritura. Por ello, empecé a escribir poemas y   ZMÆM`QWVM[\u0003LM\u0003TW\u0003Y]M\u0003[MV\\yI\u0003LM[LM\u0003XMY]M}I\u0016\u0003,M\u0003M[I\u0003NWZUI\u0003  aliviaba  un  poco  las  numerosas  emociones  que  sentía,  a   las  que  no  les  lograba  poner  nombre,  y  mucho  menos   podía gestionar.  Y  me  comencé  a  rebelar  siendo  muy  pequeña.   Recuerdo  que  desde  los  seis  años  comenzaba  a  discutir   con  mamá  sobre  lo  que  yo  opinaba  y  le  hacía  frente.   Yo  sentía  mucha  rabia  porque  mis  necesidades  no   estaban  siendo  satisfechas.  YO  TENÍA  EL  DERECHO   LEGÍTIMO  de  que  esas  NECESIDADES  fueran   SATISFECHAS y no lo estaban siendo. ¿Cuáles eran mis  \nAna María Deik 113 necesidades? De afecto, de que me escucharan, de que me  validaran, de que me miraran. Era tan simple y complejo  a la vez, porque también entiendo a madres y padres que  se  sienten  colapsar  con  sus  trabajos,  por  mantener  una   familia, por buscar la felicidad, el éxito, padres y madres  que  sienten  que  las  demandas  de  sus  hijos  los  superan.   Entonces, nuestras necesidades pasan hoy a ser uno de los  ÍTEMS fundamentales en la creación de nuevos hábitos  emocionales.  ¿Qué es lo primero que  tenemos que hacer?  1LMV\\QÅKIZ\u0003UQ[\u0003VMKM[QLILM[\u0003VW\u0003[I\\Q[NMKPI[\"\u0003LM\u0003I\\MVKQ~V\u0014\u0003  de  miradas,  de  complacencias,  de  descanso,  de  silencio,   de  hacer  las  cosas  que  necesito  y  que  me  gustan.  Tener   tiempo  para  relacionarme  con  mi  pareja,  de  que  me   aprueben, de que no me juzguen, de que no me critiquen.  Pueden  ser  necesidades  desde  las  más o no hace la felicidad. Ya estoy vieja(o) para eso. No sirvo para estar en pareja. Ser rico es malo. No puedo manejar mi rabia. Soy muy ansiosa(o). No soy bueno(a) para comunicarme. Mis hijos no me hacen caso. No soy un buen líder. No sirvo para hacer ejercicio. No puedo meditar, no logro nunca que mi mente se  aquiete. El dinero no crece en los árboles. El mundo es un lugar peligroso.  Creencias potenciadoras – que nos empoderan  Estas creencias activan tu poder personal. Cuando crees  que las cosas SÍ pueden ser posibles, experimentas valor y  te atreves a lograrlas. Cuando percibes las situaciones de  la vida como oportunidades surge el ENTUSIASMO y la  CURIOSIDAD.   §8WZ\u0003Y]u\u0003M[\u0003QUXWZ\\IV\\M\u0003QLMV\\QÅKIZ\u0003V]M[\\ZI[\u0003KZMMVKQI['\u0003 8WZY]M\u0003 IT\u0003 QLMV\\QÅKIZ\u0003 TI[\u0003 KZMMVKQI[\u0003 Y]M\u0003 VW[\u0003 TQUQ\\IV\u0003 TI[\u0003  llevamos a la consciencia y se nos hace más fácil cambiarlas,  y  a  su  vez  nos  hacemos  conscientes  de  las  creencias  que   nos  empoderan.  Estas  las  podemos  repetir  cada  vez  que   sintamos  que  una  emoción  nos  invade  y  que  nos  cueste   mucho gestionar.  \nCómo crear nuevos hábitos emocionales  124 Por ejemplo, pongamos el caso de que ahora me estoy  sintiendo  triste  o  frustrada  porque  una  venta  grande  se   me cayó y perdí a mi cliente, o si mi hijo está enfrentando  una situación de  bullying  en el colegio, o alguna situación  que se les venga a la mente en la que pueden sentir una  tristeza  o  frustración  compleja  de  gestionar.  Si  yo  tengo   dentro  de  mis  creencias  potenciadoras  algunas  de  estas   creencias:   Soy una persona optimista. Logro sortear las situaciones que se me presentan en        la vida. Soy perseverante. Soy creativa(o) para lidiar con situaciones complejas. Yo le doy fortaleza a mis hijos. Siempre tengo ventas. Mi negocio es próspero. Siempre encuentro la manera de salir adelante con        éxito, no importa cuáles sean las circunsta  en el alma y que, si por nosotros fuera,  no  dejaríamos  que  nada  les  pasara  en  la  vida.  Pero  esa   no es la realidad: lo sano es que ellos salgan al mundo a  experimentar, a vivir, a tomar decisiones. Y en ese mundo  nosotras no tenemos el control de lo que les pasa o no les  pasa. Entonces, yo puedo entender perfectamente a una  mamá que se deje invadir por la tristeza, el miedo, la rabia  si se encuentra en una situación compleja con algún hijo.  Pero  yo  les  pregunto:  ¿el  que  las  emociones  nos   invadan en esos momentos ayuda en algo a la situación?  Sabemos  que  NO  NOS  AYUDA  EN  NADA.  Entonces,   ¿qué  podemos  hacer?  Recurrir  a  nuestro  ARSENAL   DE  CREENCIAS  FORTALECEDORAS  para   empoderarnos,  para  gestionar  esas  emociones  que   estamos sintiendo, bajarles la intensidad y poder TOMAR  ACCIÓN.   \nCómo crear nuevos hábitos emocionales  126 ¿Cuáles  podrían  ser  ejemplos  de  tomas  de  acción  en   esta situación?   Ir al colegio a hablar con la profesora jefe. Escribir una carta a la directora. Buscar un profesional que pueda apoyar a              nuestro hijo a salir de esta situación con herramientas        poderosas que le sirvan también para la vida. Conversar con nuestro hijo para que sepa que tiene        nuestro apoyo absoluto. Conversar con el papá de nuestro hijo para buscar        una solución en conjunto. Hablar con los padres de los chicos(as) que le hacen         bullying . No estoy diciendo que si se encuentran en una situación  similar  (que  espero  que  no  lo  estén),  estas  sean  las  cosas   que  deban  hacer.  Solamente  son  algunos  ejemplos  de   las  estrategias  que  podemos  implementar  si  estamos   gestionando bien nuestras emociones, porque muchas de  las  situaciones  que  nos  pasan  en  la  vida  NO  están  bajo   nuestro control. Siempre vamos a estar viviendo distintos  tipos  de  situaciones  que  nos  producirán  emociones  que   necesitaremos aprender a gestionar, y esas emociones que  sintamos deben estar a nuestro favor.   -T\u0003KWVWKMZ\u0014\u0003QLMV\\QÅKIZ\u0014\u0003PIKMZ\u0003][W\u0003a\u0003[MZ\u0003KIXIKM[\u0003LM\u0003KZMIZ\u0003  más  CREENCIAS  POTENCIADORAS  es  un  hábito   emocional  preventivo,  porque  en  los  momentos  en  los   que  nos  sucedan  experiencias  o  situaciones  en  los  que   nos invaden emociones que antes no podíamos gestionar,  ahora  estaremos  conscientes  de  todas  las  CREENCIAS   que tenemos a la mano en las que nos podemos APOYAR  de  forma  constante.  ¡Qué  alivio  tener  una  herramienta   tan poderosa en nuestras manos! ¿Cierto?  \nAna María Deik 127 ¿Có UW\u0003X]MLW\u0003KWUMVbIZ\u0003I\u0003UWLQÅKIZ\u0003UQ[\u0003  creencias limitantes?     1.   Observarlas  para  que  se  comiencen  a   desintegrar  El  primer  paso  que  les  invito  a  hacer  para  empezar   a  desintegrar  sus  creencias  limitantes  es  observarlas.  ¿Se   recuerdan  cuando  hablamos  de  la  mente  consciente  y   subconsciente? Al comenzar a observar mi creencia desde  mi  mente  consciente  la  traigo  desde  mi  subconsciente,   y  estando  consciente  es  que  puedo  cambiarla.  Si  sigo   reaccionando  en  piloto  automático  no  lo  podré  hacer.    Por lo que, de forma consciente, debo cuestionarme: ¿Qué  estoy  pensando?  ¿Por  qué  estoy  pensando  eso?   ¿De dónde viene? ¿Qué tan grande es la situación? ¿Quién  sería yo sin esta creencia en un año, en cinco o en diez?  En  el  caso  de  la  creencia  limitante  de  que  no  puedo   ser  escritora  porque  siempre  me  dijeron  que  carecía  de   talento,  lo  que  debo  hacer  es  preguntarme:  «¿realmente  no  sirvo  para  escribir?  ¿No  sé  comunicar  a  través  de  las   palabras?». Albert Einstein dijo: «El genio se hace con un  1 % de talento y un 99 % de trabajo».  \u001a\u0016\u0003,MÅVQZ\u0003UQ[\u0003^ITWZM[  Es  fundamental  establecer  lo  que  realmente  es   importante  para  nosotros,  y  estar  conscientes  que  eso   «IMPORTANTE»,  puede  no  gustarles  a  mis  padres,   o  no  estar  alineado  con  la  sociedad  en  la  que  vivo.     -[\\W[\u0003^ITWZM[\u0003VW[\u0003Ia]LIZnV\u0003I\u0003LMÅVQZ\" \nCómo crear nuevos hábitos emocionales  128 Cuáles creencias son mías. Cuáles creencias son de otras personas. Cuáles creencias quiero conservar porque se alinean con mis valores. Cuáles creencias me limitan y no se alinean con mis valores.  3.  Romper  con  las  creencias  que  no  van   alineadas con mi ser   Mientras hacemos el proceso de observar y cuestionar  nuestras  creencias,  va  a  llegar  un  punto  en  el  que   tendremos que tomar la decisión de romper con algunas  de ellas. Obviamente eso es positivo para nosotros, pero  ¿será  igual  de  positivo  para  nuestros  amigos,  familia  o   comunidad? Tenemos que estar conscientes que muchas  veces  el  convertirnos  en  la  persona  que  deseamos  ser  y    [MO]QZ\u0003V]M[\\ZW[\u0003[]M}W[\u0003QV\\MZZ]UXQZn\u0003W\u0003UWLQÅKIZn\u0003TI\u0003NWZUI\u0003  en que conectamos con las personas que nos rodean.  Vamos  a  poner  unos  ejemplos  de  creencias   LIMITANTES. El reunirme con amigos va acompañado de consumir        alcohol o sustancias. Necesito consumir alcohol para pasarlo bien en grupo. Todo el mundo se toma por lo menos un trago. Me van a criticar si no tomo. Ahora  pongamos  el  caso  que  desde  pequeña  veía  en   mi casa muchas reuniones sociales, familiares, y siempre  estaba  el  alcohol  en  el  medio.  Y  que,  aunado  a  eso,  al   transitar  en  mi  período  de  adolescencia  repetía  los   mismos patrones que veía en mi casa. Consumía alcohol  \nAna María Deik 129 o  drogas  con  mis  amigos  para  «PASARLO  BIEN».  Y  de  pronto  me  doy  cuenta  que  ya  no  la  paso  bien   tomando, ni juntándome con personas que siempre están  consumiendo alcohol. O de pronto tengo ganas de tener  una vida más \u0003Å\\VM[[ . Comienzo a hacer deporte, a meditar,  y  ya  no  quiero  tener  el  hábito  de  consumir  alcohol  en   las reuniones
