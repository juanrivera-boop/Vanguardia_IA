edé  perpleja   mirando el video y luego apagué el celular. He escuchado  por ahí a varios profesionales hablando sobre emociones  negativas o positivas, pero la verdad es que las emociones  no son positivas, ni negativas: LAS EMOCIONES SON,  EXISTEN Y FORMAN PARTE DE NUESTRA VIDA  \nCómo crear nuevos hábitos emocionales  22 DIARIA.  Lo  que  sí  rescato  de  esta  noción,  es  que  hay   algunas que nos producen bienestar y otras malestar.  Las  emociones  afectan  la  manera  en  la  que  nos   relacionamos  con  nosotros  mismos  y  los  demás.  Son   indispensables para comunicarnos de forma asertiva con  otras personas: padres, hijos, colegas, amigos y conocidos.  Nuestro mundo emocional es prioritario para que todo el  resto en nuestra vida funcione de la manera en la que lo  deseamos:  sostengamos  relaciones  sanas  con  los  demás,   podamos  encaminarnos  hacia  la  realización  de  nuestros   sueños  de  una  forma  productiva,  tengamos  claridad   mental para actuar, y avancemos en nuestro trabajo. Cuando dejamos que nuestras emociones nos invadan,  nos cuesta mucho avanzar a través de la vida: se nos hace  muy  difícil  relacionarnos  asertivamente  con  los  demás,   la  frustración  nos  consume  y  la  rabia  o  la  tristeza  nos   van  carcomiendo  por  dentro.  Podemos  utilizar  nuestras   emociones  tanto  para  ayudarnos,  ya  que  nos  sirven  de   aliadas si las sabemos gestionar, como para hacernos mal,  ya que nos pueden jugar en contra. Durante mucho tiempo se ha conferido superioridad a  la razón por sobre las emociones, pero la verdad es que las   MUWKQWVM[\u0003VW[\u0003QVÆ]aMV\u0003Un[\u0003Y]M\u0003TI\u0003ZIb~V\u0014\u0003LMJQLW\u0003I\u0003Y]M\u0003  se hallan en una zona más profunda de nuestro cerebro y  engloban  todos  nuestros  estados  internos:  motivaciones,   deseos, necesidades y metas. Apenas nacemos adquirimos emociones básicas como  el miedo, la tristeza, la rabia y la alegría, que luego se van  haciendo más complejas como la frustración, la ansiedad,  la envidia o la melancolía. Cada ser humano experimenta  una  emoción  de  forma  particular,  dependiendo  de    ]VI\u0003 [Q\\]IKQ~V\u0003 M[XMKyÅKI\u0014\u0003 [][\u0003 M`XMZQMVKQI[\u0003 IV\\MZQWZM[\u0014\u0003  aprendizaje y carácter. Por ejemplo: puedo sentir tristeza  porque  mi  novio  no  me  quiere  de  la  forma  en  la  que   yo  necesito,  pero  esa  tristeza  se  une  a  las  experiencias  y   creencias  que  tengo  en  relación  a  parejas  anteriores,  a   \nAna María Deik 23 mi propia personalidad y a la situación actual que estoy  viviendo con mi pareja.  De  acuerdo  al  doctor  Leslie  Greenberg  (terapeuta  e   investigador considerado una de las mayores autoridades  a  nivel  mundial  sobre  el  trabajo  con  las  emociones  en   psicoterapia) las emociones se basan en el presente, pero   M[\\nV\u0003 QVÆ]MVKQILI[\u0003 XWZ\u0003 MT\u0003 XI[ILW\u0003 a\u0003 MRMZKMV\u0003 QVÆ]MVKQI\u0003  sobre  el  futuro.  Las  emociones  acontecen  en  el  aquí  y   en el ahora. En el «momento presente», que es lo único   Y]M\u0003M`Q[\\M\u0014\u0003XMZW\u0003[WV\u0003QVÆ]MVKQILI[\u0003XWZ\u0003MT\u0003XI[ILW\u0003\u0010XWZ\u0003TI[\u0003  experiencias  que  hemos  vivido,  por  lo  que  creemos,  por   los  patrones  familiares  que  traemos,  por  los  recuerdos),    a\u0003\\QMVMV\u0003QVÆ]MVKQI\u0003MV\u0003MT\u0003N]\\]ZW\u0014\u0003XWZY]M\u0003TI[\u0003IKKQWVM[\u0003Y]M\u0003  tomemos  hoy  con  respecto  a  nuestras  emociones  tienen   consecuencias en un mañana. A  continuación,  veremos  para  qué  nos  sirven  las   emociones  y  cuál  es  su  función.  El  doctor  Greenberg   propone cinco funciones de las emociones:    1)  La  emoción  es  una  señal  para  nosotros   mismos:  Las  emociones  vienen  a  darnos  información  de   nosotros  que  debemos  aprender  y  trabajar  para  crecer   como  personas.  Por  ejemplo,  si  una  situación  con  mi   madre  me  produce  mucha  rabia,  esa  emoción  intensa   me  está  diciendo  algo  de  mí  misma(o)  que  tengo  que   reconocer, comprender y aprender a gestionar.    2) La emoción nos prepara para la acción:  Si de pronto sentimos miedo porque vemos a alguien  que  viene  hacia  nosotros  a  robarnos,  ese  miedo  nos   prepara  para  salir  corriendo,  para  defendernos.  Nos   ayuda a actuar de forma inmediata.   \nCómo crear nuevos hábitos emocionales  24 3)  La  emoción  vigila  el  estado  de  nuestras   relaciones:  Si  yo  siento  mucha  tristeza  porque  mi  hijo  no  me   escucha, por ejemplo, esa emoción me está indicando que  mi relación con él no se encuentra bien, por ende, me dice  que  debo  hacer  algo  al  respecto  si  quiero  que  las  cosas   cambien entre nosotros.  4)  Las  emociones  evalúan  si  las  cosas  no  van   bien:  Cuando  tengo  problemas  con  mi  jefe(a),  o  me  siento   frustrada,  infeliz  y  enrabiada  constantemente,  eso  me   indica que las cosas no están bien en mi ambiente laboral  y  puedo  utilizar  ese  indicador  emocional  para  evaluar   si  me  quiero  cambiar  de  trabajo,  o  si  me  gusta  y  deseo   conservarlo. Me empuja a pensar qué puedo hacer para  cambiar la situación.   5)  Las  emociones  sirven  de  señales  a  los   demás:  Si mi madre ve que estoy triste todos los días, mi tristeza  le  indica  que  necesito  ayuda.  Por  ende  las  emociones   nos ayudan a que otras personas nos apoyen cuando las  necesitamos.  ¿Cuáles son las Emociones Básicas?  Existen seis emociones básicas que todos conocemos,  de las cuales se derivan emociones más complejas. Estas  emociones  básicas  son:  la  tristeza,  la  rabia,  el  miedo,   el  asco,  la  sorpresa  y  la  alegría.  Seguramente  las  has   experimentado todas en distintas situaciones de tu vida. \nAna María Deik 25 Miedo  Esta emoción tiene la función de protegernos. Cuando  sentimos  miedo  es  porque  algo  nos  está  amenazando  y   estamos en peligro. A mí me pasa que cuando recuerdo en  qué situaciones he sentido miedo en mi vida (que han sido  bastantes), me viene a la mente una experiencia que viví  a los catorce años en la isla de Margarita, en Venezuela.  Nos  acabábamos  de  bajar  del  Ferry  y  recuerdo  que  en   ese momento estaba parada esperando algo, y de pronto  unos perros comenzaron a perseguirme. Eran como cinco  o seis perros. Mi sensación fue de terror, y me hizo correr  hacia mis padres con el corazón latiéndome como caballo  desbocado.  El  miedo  también  nos  impulsa  a  darnos  cuenta  que   debemos dar un paso para salir de nuestra zona de confort.  Porque  el  miedo  tiene,  tanto  la  función  de  protegernos,   como  de  movilizarnos.  Por  ejemplo:  hace  un  tiempo  yo   sentía  mucho  miedo  de  hablar  en  público,  no  era  un   miedo que me defendía de un  peligro,  sino  uno  que me  paralizaba  frente  a  un  reto.  Sabiendo  lo  que  me  pasaba   decidí vencer ese miedo porque quería hacer un seminario  sobre emociones. Entonces trabajé las creencias que tenía  sobre  hablar  frente  a  otras  personas,  creencias  que  me   producían  miedo  e  impedían  que  avanzara  hacia  mis   sueños. Pero al mismo tiempo fue el miedo que sentía al  pensar en hablar en público lo que me motivó y movilizó  a superarlo.  El  miedo  venía  a  darme  información  valiosa  sobre   mí misma. Entonces lo trabajé, hice el seminario y logré  vencer ese miedo.  Sorpresa  Esta  emoción  me  encanta.  Debe  ser  porque  me   gusta  mucho  sorprender  a  otras  personas,  y  también   que me sorprendan. La sorpresa viene acompañada por  \nCómo crear nuevos hábitos emocionales  26 desconcierto, sobresalto y asombro. Muchas veces, o mejor  dicho  todas,  esta  emoción  antecede  a  otras  emociones   como el miedo, la alegría o la tristeza. Por  ejemplo:  si  mi  hermano  me  da  la  noticia  que  se   muda  de  país  y  yo  no  sabía  nada  de  eso,  primero  voy  a   sentir sorpresa por lo que me está contando, y seguramente  después voy a sentir tristeza porque no quiero que se vaya;  o puede que también sienta alegría porque va a concretar  sus sueños, y es muy probable que sienta ambas emociones,  mezcladas con alguna otra emoción como, por ejemplo:  la melancolía por los momentos vividos con él.  Asco  Al  igual  que  con  el  miedo  su  función  también  es  la   de  protegernos,  y  la  mayoría  de  las  veces  se  relaciona   con  los  alimentos.  Por  ejemplo,  el  olor  a  hígado  a  mí   personalmente me produce un asco tremendo, por tanto,  me  alejo  de  esa  comida  tan  rápido  como  puedo.  ¿Qué   alimentos les producen asco? ¿Algunos comportamientos  de  otros  les  producen  repulsión?  Recuerdo  que  en  la   universidad  yo  tenía  un  compañero  que  se  sacaba  los   mocos  y  se  los  comía.  No  les  puedo  contar  el  asco  que   aquello generaba en mí, y por supuesto yo no era capaz  de  darle  la  mano  después  de  ver  esta  escena  repetidas   veces dentro de la sala de clases.  Rabia  Esta  emoción  me  viene  a  decir  que  algo  ha  invadido   mis  límites  y  que  necesito  defenderme,  o  bien  que   alguna  situación  no  ha  resultado  como  yo  esperaba.  La   rabia  nos  empuja  muchas  veces  a  discutir,  a  salirnos  de   nuestras  casillas,  a  gritar  e  incluso  a  agredir  físicamente   al  otro.  Muchas  veces  cuando  nos  descontrolamos  con   esta  emoción,  terminamos  llorando  solos  y  sintiendo   culpa  por  las  reacciones  emocionales:  HÁBITOS   \nAna María Deik 27 EMOCIONALES que hemos tenido, una vez más, ante  una determinada situación. La mayoría de los que somos padres o madres sabemos  lo agotador que es repetirle las cosas veinte veces a nuestros  hijos.  Y  que  cuando  ya  vamos  en  la  número  veinte,  no   tenemos ni la misma paciencia, ni la misma compasión,  ni la misma empatía que cuando vamos por la repetición  número  cinco.  Todo  tiene  un  límite.  Entonces  nos   desbordamos en la rabia, porque en nuestras experiencias  anteriores  hemos  tenido  que  gritar  para  ser  escuchados.   Pero  ¿es  esta  la  manera  correcta?  No,  no  la  es.  Por  lo   mismo la importancia de gestionarnos emocionalmente. Por  otro  lado,  la  rabia  también  nos  sirve  para  poner   límites sanos con los demás. Por ejemplo: si a un niño le  quitan la colación, es obvio que le dé rabia, y esta rabia  lo  moviliza  a  enfrentarse  con  el  otro  niño  para  pedirle   su  merienda  de  regreso.  O  bien,  lo  mueve  a  contarle  a   su  maestra, o  a  sus  padres  sobre  dicho  evento.  Podemos    ]\\QTQbIZ\u0003TI[\u0003MUWKQWVM[\u0003XIZI\u0003V]M[\\ZW\u0003JMVMÅKQW\u0014\u0003XMZW\u0003PIa\u0003Y]M\u0003 KWVWKMZTI[\u0003M\u0003QLMV\\QÅKIZTI[\u0003XIZI\u0003IXZMVLMZ\u0003I\u0003OM[\\QWVIZTI[\u0016  Alegría  Esta emoción que a todos nos encanta nos viene a contar  que  algo  es  bueno  para  nosotros.  La  alegría  nos  anima   a  hacer  cosas  y  nos  provee  de  mucha  energía.  También   nos  produce  una  sensación  de  gratitud  y  de  bienestar.   ¿Alguna vez han sentido que le quieren agradecer a todo el  mundo? ¿Que quieren llamar a todos sus amigos y familia  para  contarles  algo  que  los  tiene  muy  felices?  Yo  me  he   sentido  feliz  muchas  veces  en  mi  vida.  Una  de  las  veces   que  recuerdo  haber  estado  más  contenta,  desbordando   energía, es cuando empecé a escribir este libro. Todavía  me  inunda  una  energía  y  una  felicidad  enorme.  ¿Saben   por qué? Porque mi propósito en la vida es ayudar a otras  personas  a  que  empiecen  a  crear  NUEVOS  HÁBITOS   \nCómo crear nuevos hábitos emocionales  28 EMOCIONALES. Y este libro es el primer paso que doy  en el camino que recorreré para lograr este sueño.  Tristeza  -[\\I\u0003 MUWKQ~V\u0003 M[\u0003 ]VI\u0003 LM\u0003 TI[\u0003 Y]M\u0003 UMRWZ\u0003 QLMV\\QÅKIUW[\u0003  al sentirla. Con ella nos invade la pena, el pesimismo y la   [WTMLIL\u0016\u00034I\u0003\\ZQ[\\MbI\u0003VW[\u0003IVQUI\u0003I\u0003ZMÆM`QWVIZ\u0003a\u0003VW[\u0003UW\\Q^ or un rato. Cuando medito. Al agradecer cuando me despierto en las mañanas        por las personas que están a mi alrededor. Cuando escribo en mi cuaderno de agradecimiento          una vez al día. Cuando ayudo a alguna persona que lo necesita. Al leer un libro que me abre la mente al conocimiento. Al escribir este libro siento armonía y paz. Pintar con acrílico ilustraciones infantiles. Bailar y cantar. Ver películas que nutren el alma. Es  bueno  escribir  sobre  las  emociones  que  vamos   sintiendo, y escribir en qué situaciones nos hemos sentido  así.  Es  un  ejercicio  simple  pero  poderoso,  porque  nos   permite darnos cuenta de las emociones que relacionamos  con  ciertas  experiencias.  ¿Y  saben  qué?,  esto  posibilita   que sea más fácil cuando sigan trabajando las emociones,  poder evocar, por ejemplo, la armonía y la paz. Al realizar este ejercicio, también me vuelvo consciente  de  que  si  repito  las  siete  situaciones  que  acudieron  a  mi   mente: estas me producirán armonía y paz. Ocurre igualmente con las emociones que me producen  malestar.  Por  ejemplo,  las  dos  que  yo  escogí  de  mi  lista   \nAna María Deik 31 son: la ansiedad y el estrés. ¿En qué situaciones he vivido  estas dos emociones juntas que me causan malestar? Las  que se me vienen a la mente son: Que mis hijos se peleen entre ellos. La situación incierta del país a nivel social y económico. Que mis padres me critiquen, me juzguen o que no        acepten que yo estoy haciendo las cosas diferentes a        como ellos piensan que tendrían que ser. El pensar que tengo mucho que hacer y poco tiempo        para hacerlo. Que mis hijos vivan tirando la ropa al suelo, no lleven        sus platos a la cocina y no hagan sus camas. Me produce estrés y ansiedad estar en un centro                     comercial atestado de gente. El pensar que a mis hijos les falte algo y yo no se los        pueda dar. Si ahora, en el momento presente, mientras les escribo  estas líneas pienso en qué emoción estoy sintiendo, podría  decir  que  estoy  motivada  y  feliz.  Pero,  al  hacer  este   ejercicio  junto  a  ustedes,  reconozco  que  pasé  por  otras   emociones. Al recordar, por ejemplo, qué situaciones me  produjeron  armonía  y  paz  logré  sentir  esas  emociones.   Al  contrario,  al  evocar  las  situaciones  que  me  vinieron   a  la  mente  en  la  segunda  lista  (de  malestar  y  displacer),   pude sentir el estrés y la ansiedad. Recuerden siempre que  las emociones se encuentran en el subconsciente, que es  desde donde operamos y actuamos el noventa y cinco por  ciento del tiempo. Eso lo veremos más adelante. Entonces, ¿se lograron conectar con las dos emociones  que escogieron al recordar distintas experiencias o eventos  en sus vidas? ¿Alguna de esas situaciones que escribieron  se repiten? A mí se me repite, por ejemplo, que mis hijos  se  peleen  entre  ellos.  Es  algo  que  no  puedo  controlar,   \nCómo crear nuevos hábitos emocionales  32 ¿verdad? Lo que sí puedo gestionar es la forma en que yo  reacciono frente a esas peleas. Esa reacción emocional es  un HÁBITO EMOCIONAL.  Por  otro  lado,  si  me  estresa  y  me  produce  ansiedad   ir  a  un  centro  comercial  cuando  está  lleno  de  personas,   puedo  optar  por  no  ir.  Lo  que  quiero  que  veamos  con    M[\\W[\u0003 LW[\u0003 MRMUXTW[\u0003 M[\u0003 Y]M\u0014\u0003 IT\u0003 QLMV\\QÅKIZ\u0003 TI[\u0003 [Q\\]IKQWVM[\u0003  que  me  producen  bienestar  emocional,  puedo  evocarlas   durante el día para traer ese tipo de emociones a mi vida.  Con respecto a las peleas entre nuestros hijos, si estas nos  causan  ansiedad  y  estrés,  podemos  preguntarnos:  «¿por  qué me siento de esa forma? ¿Cuánto me dura la emoción?  ¿Cómo puedo ayudar a mis hijos para que solucionen sus   KWVÆQK\\W[' ̄\u0016\u0003  Mi experiencia al aplicar la gestión de emociones con   UQ[\u0003PQRW[\u0003PI\u0003[QLW\u0003OZI\\QÅKIV\\M\u0016\u0003-[W\u0003VW\u0003[QOVQÅKI\u0003Y]M\u0003VW\u0003PIaIV\u0003  peleado  nunca  más,  por  supuesto.  Pero  últimamente  cuando  escucho  un  grito,  primero  respiro  y  luego  me   dirijo  hacia  ellos.  Intento  mantenerme  consciente  y  los   miro  como  si  estuviese  viendo  una  película  (así  no  me   involucro  en  la  emoción).  Luego  les  pregunto  qué  les   pasa, y si los puedo ayudar en algo. Cada uno me cuenta  su  versión  de  los  hechos  y  los  ayudo  a  lidiar  con  lo  que   pasó,  a  aprender  a  gestionar  lo  que  están  sintiendo  al   respecto, a pedir disculpas si es necesario. Por lo general  lo  que  empieza  en  una  pelea  entre  ellos,  termina  en  un   gran abrazo. Cuando  me  alejo  de  vuelta  a  lo  que  estaba  haciendo   y escucho que se dicen «te quiero», sonrío, doy gracias y  respiro hondo. ¿Y saben a quién le doy las gracias? A mí  misma. Porque ya no reacciono igual que antes. ¿Es fácil?  No. Claro que no lo es, pero sí es posible. Antes  yo  corría  donde  estaban  mis  hijos  hecha  una   furia  a  gritarles.  Una  vez  hasta  llegué  con  una  jarra  de   agua fría y se las arrojé encima para separarlos. Ellos se  \nAna María Deik 33 quedaron  atónitos  con  mi  reacción  emocional  ante  su   pelea.  Hoy  me  siento  feliz  porque  las  peleas  entre  mis   hijos ya no me causan las mismas emociones desbordantes  que  antes.  Por  supuesto  que  tampoco  son  motivo  de   felicidad.  Y  si  bien  me  puede  molestar  el  hecho  de  que   se peleen, lo gestiono y desde que aprendí este NUEVO  HÁBITO EMOCIONAL, puedo ayudarlos en sus peleas   [QV\u0003 KWV^MZ\\QZUM\u0003 MV\u0003 ]VI\u0003 XIZ\\QKQXIV\\M\u0003 Un[\u0003 LMT\u0003 KWVÆQK\\W\u0014\u0003  asistiéndolos  para  que  gestionen  mejor  lo  que  están   sintiendo.  Eso  facilita  bastante  las  cosas,  ya  que  vivimos   muchísimo más en armonía que antes. Ahora, te invito a que pienses en qué situaciones has  sentido  esas  dos  emociones  que  te  causaron  bienestar  y   a continuación escribe las siete actividades que te hayan  hecho  sentir  esas  dos  emociones  de  bienestar,  y  agrega   qué día vas a realizarlas. 1.- Meditar 10 minutos (día lunes)  _______________________________________ 2.- Leer un libro 20 minutos (día martes) _______________________________________ 3.- Meditar 10 minutos (día miercoles)  _______________________________________ 4.- Bailar y cantar 15 minutos (día jueves)  _______________________________________ 5.- Pintar con acrílico 40 minutos (día viernes)  _______________________________________ 6.- Leer un libro 20 minutos (día sábado) _______________________________________ 7.- Ver una película 2 horas (día domingo) _______________________________________   Y, por añadidura, abrazar a mis hijos todos los días. Por  ejemplo:  la  primera  actividad  que  yo  puse  en   \nCómo crear nuevos hábitos emocionales  34 mi  lista  fue  meditar,  entonces  la  voy  a  realizar  el  lunes.    El martes voy a realizar la sexta que anoté: leer un libro.  Y así voy escogiendo volver a repetir una actividad cada  día de la semana.  Lo importante es que no te pongas metas tan altas al  principio,  para  que  cuando  hayan  pasado  los  siete  días   hayas conseguido repetir esas experiencias.   Emociones que predominan en nosotros  ¿Qué  emociones  están  contigo  últimamente?  ¿Qué   emociones  sientes  tú  que  se  gatillan  frente  a  situaciones   recurrentes  en  tu  día  a  día?  ¿Qué  emociones  te  cuesta   gestionar?  Por  lo  general  existe  una  emoción  que  es   recurrente en nuestras vidas:  Con frecuencia nos sentimos ansiosos. Hay situaciones que nos producen rabia o frustración. Estamos inmersos en estados de melancolía o tristeza. A lo mejor nos mantenemos más en la emoción del        agradecimiento y gozo. O nos encontramos en un estado de apatía y                     desmotivación. Ya  hemos  visto  que  son  muchísimas  las  emociones   que nos pueden producir tanto bienestar como malestar  en  nuestras  vidas.  Es  importante,  por  lo  tanto,  que    QLMV\\QÅY]MUW[\u0003K]nTM[\u0003MUWKQWVM[\u0003XZMLWUQVIV\u0003MV\u0003V]M[\\ZW\u0003  diario  vivir  para  aprender  a  gestionarlas.  En  mi  caso,   por  ejemplo:  he  transitado  por  períodos  de  mi  vida  en   los  que  ha  predominado  la  tristeza  y  la  melancolía,  así   también como la rabia y la frustración. Las emociones van  variando, incluso las que son predominantes en nuestras  vidas, mutan. Por eso te pregunto: ¿cuál es la emoción o  \nAna María Deik 35 emociones que predominan en tu vida hoy? A lo mejor se  te repiten situaciones que te producen rabia y frustración  de forma constante, o estás desmotivado(a) y triste. «Conoce  tus  emociones  para  conocerte  a  ti  mismo»,  señalaba Sócrates. Al caminar a través de este aprendizaje  nos conectamos con nuestro ser esencial. Ese ser esencial  que  éramos  de  niños  y  que  se  fue  perdiendo  con  las   imposiciones  de  la  sociedad  en  la  que  vivimos,  con  las   creencias  que  nos  inculcaron,  con  los  juicios,  con  las   necesidades  afectivas  no  satisfechas  de  parte  de  nuestros   padres.  El ser esencial es aquella parte interna que te acompaña  a lo largo de toda tu vida y que te guía. Es escuchar a tu yo  interno: reconectarte con él. Las  emociones  nos  proporcionan  la  información   que  necesitamos  para  desarrollarnos  y  evolucionar.    Hasta  que  no  interiorices  este  aprendizaje  que  vienen  a   darte las emociones no avanzarás, y las mismas situaciones  volverán  a  presentarse  de  diferentes  formas  en  tu  vida.   Por  eso  es  importante  aprender  continuamente  sobre   qué vienen a decirte tus emociones. De esa forma podrás  reconectar contigo mismo  y  permitir que tu ser esencial  crezca y se desarrolle. A través de mis experiencias de vida y de mis procesos  de  sanación  emocional  he  ido  conectando  con  mi  ser   esencial  y  de  esta  forma  llevo  una  vida  más  plena  que   da  inicio  conmigo  misma  y  se  extiende  a  mis  hijos,  mis   padres, y las personas que me rodean.  No  digo  que  sea  fácil.  Cada  ser  humano  tiene  una   experiencia  diferente,  y  si  tú  estás  leyendo  este  libro  es   porque  estás  preparado  o  preparada  para  hacer  los   cambios  que  tu  vida  necesita:  para  convertirte  en  la   persona  que  tu  ser  esencial  necesita  que  seas.  Desde  la   conciencia, conectándote con tus deseos más profundos,  para así ser tu MEJOR VERSIÓN. \nCómo crear nuevos hábitos emocionales  36 Por  lo  general,  a  lo  largo  de  nuestra  vida  se  van   repitiendo situaciones que vienen de patrones aprendidos  durante  años,  adquiridos  quizás  desde  que  éramos   pequeños  o  durante  la  adolescencia  y  juventud.  En   mi  caso,  traía  en  mi  mochila  emocional  frustraciones,   miedos,  rabias,  sensación  de  abandono  de  pequeña,   necesidades  afectivas  no  satisfechas,  y  siempre  tuve  una   gran dependencia emocional con mis progenitores. Pero  ¿qué  es  la  dependencia  emocional?  El   centro  madrileño  de   psicología  y psiquiatría \u00035IV]MT\u0003-[K]LMZW\u0003TI\u0003LMÅVM\u0003KWUW\"\u0003  «(...)un  patrón  psicológico  que  incluye:  la  necesidad   de que otros asuman la responsabilidad en las principales   XIZKMTI[\u0003 LM\u0003 []\u0003 ^QLI\u0014\u0003 LQÅK]T\\ILM[\u0003 XIZI\u0003 \\WUIZ\u0003 LMKQ[QWVM[\u0003 XWZ\u0003 [y\u0003 UQ[UW[\u0014\u0003 LQÅK]T\\ILM[\u0003 XIZI\u0003 M`XZM[IZ\u0003 MT\u0003 LM[IK]MZLW\u0003  con  los  demás  debido  al  temor  a  la  pérdida  de  apoyo  u   aprobación,  se  siente  incómodo  o  desamparado  cuando   está solo debido a sus temores exagerados de ser incapaz  de  cuidar  de  sí  mismo  y  preocupación  no  realista  por   el  miedo  a  que  le  abandonen  y  tenga  que  cuidar  de  sí   mismo».  +]IVLW\u0003TMW\u0003M[\\I\u0003LMÅVQKQ~V\u0003PIa\u0003KW[I[\u0003Y]M\u0003ZMKWVWbKW\u0003a\u0003 W\\ZI[\u0003Y]M\u0003VW\u0016\u0003-NMK\\Q^IUMV\\M\u0003aW\u0003\\MVyI\u0003U]KPI\u0003LQÅK]T\\IL\u0003XIZI\u0003  tomar  decisiones  por  mi  cuenta  o  expresar  desacuerdo   frente a mis padres, pero nunca tuve temor de cuidarme a  mí misma (aunque por mucho tiempo lo hiciera pésimo) o  a la soledad. Siempre me ha gustado estar sola. De hecho,  en algún momento llegué a pensar si acaso podía ser una  ermitaña, pero no, no lo soy. Hay que mantenerse alerta acerca de las dependencias  emocionales que podamos tener con otros: ya sean hijos,  parejas, o padres. Siempre tenemos que apuntar a tener  una INDEPENDENCIA EMOCIONAL. ¿Les ha pasado  alguna vez que necesitan la aprobación de los demás para  \nAna María Deik 37 estudiar,  comprar  algo,  o  realizar  algún  viaje  soñado?   Se  cuestionan  qué  dirán  fulano  o  mengano  al  respecto,   e  incluso  puede  que  sientan  culpa  porque  ¿cómo  voy  a   gastar esa cantidad de dinero si la puedo invertir en mis  hijos? Podría ahorrar o comprar una casa...  Es importante dejar a un lado la actitud de víctima y  entender  de  una  manera  profunda  que  nosotros  somos   los responsables de nuestra vida. Nadie más. Es vital para  nuestra salud emocional: No dejar que los demás manden en nuestras vidas. Aprender a poner límites. No buscar la aprobación de otras personas. No aparentar lo que no somos. Es fundamental aprender a ¡CREAR HÁBITOS        EMOCIONALES SALUDABLES!    Siempre  van  a  existir  circunstancias  en  lo  externo,   experiencias  que  no  van  a  ser  fáciles,  ni  gratas,  pero   está  en  nosotros  cómo  actuamos  frente  a  ellas.  Esa  es  la   inteligencia  emocional.  No  dejar  que  las  emociones  nos   controlen,  sino  que  aprender  a  gestionarlas  para  tener   una  vida  plena.  Cuando  sientes  estas  emociones  que  te   desbordan  y  te  cuesta  gestionar,  tu  ser  esencial  te  está   mostrando algo de ti que necesitas descubrir. ¿Cuál es tu  camino de crecimiento personal? ¿Lo has pensado? ¿Qué  quieres de la vida? ¿Qué planes tienes para tu hoy y para  tu mañana? ¿Qué metas tienes? ¿Qué sueños todavía no  cumplidos  deseas  alcanzar?  Te  hablo  de  esto  porque  sin   progreso uno va muriendo lentamente por dentro. Si no  avanzamos, si no mejoramos, si no buscamos lograr una  mejor  versión  de  nosotros  mismos,  estamos  anulando   nuestro ser esencial. Lo que vinimos a hacer en el mundo,  por nosotros y por los demás. Cuando  hay  hábitos  emocionales  que  se  repiten   en  tu  vida,  tu  ser  esencial  te  está  pidiendo  que  tomes   \nCómo crear nuevos hábitos emocionales  38 acción, que aprendas de estos hábitos porque están para  enseñarte  algo  de  ti  mismo(a).  Es  tú  decisión  tomar  un   papel  activo  en  tu  vida.  Puedes  no  querer  hacerlo  y   quedarte en el lugar en el que estás, sin salir de tu zona  de confort y no progresar. Pero para CREAR NUEVOS  HÁBITOS  EMOCIONALES  tienes  que  tomar  acción   hacia  un  cambio.  Si  decides  no  hacerlo,  te  tengo  que   dar  una  mala  noticia:  este  libro  no  es  para  ti.  Pero  si   estás    dispuesto(a)  a  apostar  por  tu  propia  felicidad,   por  llevar  una  vida  más  plena,  en  paz,  con  relaciones   saludables  en  las  que  no  haya  abusos  emocionales,  libre   de  rabias  y  tristezas  exacerbadas,  y  quieres  adquirir  las   herramientas y estrategias necesarias  para conectarte con  tu  ser  esencial  para  comprenderte  mejor  a  ti  mismo(a),   aprender  a  gestionar  tu  mundo  emocional,  entender  de   dónde  vienen  tus  miedos,  tu  rabia,  y  tomar  acción  para   cambiar la forma en la que te enfrentas a situaciones, este  libro SÍ es para ti.  La vida nos va a seguir poniendo pruebas, porque a mí  no me gusta llamar a las situaciones que debemos resolver  «problemas».  No  son  problemas,  son  retos,  obstáculos,   desafíos, pero no problemas... ¿Qué les parece si de ahora  en adelante cuando se les presente una de estas situaciones  en  vez  de  decir  «tengo  un  problema»  cambian  esa   palabra  por  «tengo  un  reto»,  «tengo  una  oportunidad»,   «tengo un desafío»? Se darán cuenta cómo en su mente  la connotación se torna distinta, y la emoción que surge  ya no es de preocupación frente a algo que es complicado  de resolver, sino la de convicción en que es posible hacerlo  y está en sus manos conseguirlo, y que SÍ son capaces de  hacerlo (nunca lo olviden). Por  algo  estás  leyendo  este  libro,  porque  hay  cosas   en tu vida que quieres sanar. Porque en tu libre albedrío  decidiste cambiar. Quizás no sabes cómo hacerlo. Quizás  has pasado por varios cursos de autoayuda, de capacitación  \nAna María Deik 39 o cursos espirituales en los que has adquirido técnicas que  son válidas y que te han ayudado, pero que todavía no has  integrado a tu ser. TODO SUMA. Es un camino, es un  proceso que dura para toda la vida. Yo  pasé  por  muchísimos  cursos,  talleres,  seminarios   y  charlas.  Mi  búsqueda  empezó  a  los  diecinueve  años.   Empecé leyendo metafísica con algunas amigas. Recuerdo  esa época donde buscábamos ir más allá, entender qué nos  estaba  pasando  y  lograr  nuestros  sueños.  Pero  adivinen   qué: no teníamos ni idea sobre qué era lo queríamos de  la vida. Y claro, a los diecinueve o veinte años es bastante  difícil  saberlo.  Muy  distinto  es  estar  en  los  treinta  o   cuarenta  años  y  no  tener  claro  el  panorama.  A  mí  me   costó  muchísimo  tenerlo  claro.  La  vida  me  fue  dando   tumbos de un lado a otro. No, no fue la vida, ¿ven cómo  le estoy echando la culpa a la vida? La vida no me estaba  dando tumbos, sino que yo estaba dando tumbos EN LA  VIDA, que es muy diferente.  Recuerdo  una  época  en  que  todos  los  domingos  me   llevaban  a  Caracas  (a  una  hora  y  veinte  minutos  de  mi   ciudad)  para  asistir  a  una  terapia  con  un  señor  que  me   hipnotizaba. Lo que único que recuerdo era que me ponía  en la mano una pepa de zamuro, «una piedra espiritual  que protege de las energías negativas». No sé si mi mente  iba borrando cada experiencia que iba viviendo, o acaso  elegí  no  recordar,  ya  que  era  algo  demasiado  intenso   como para procesarlo.  Una  vez,  cuando  estudiaba  en  Boston,  nos  reunimos   con mis papás en la ciudad de Miami. Yo estaba sumida  en una depresión bastante grande y pesaba cerca de cien  kilos (midiendo un metro cincuenta y cinco). En mi afán de  tapar mis emociones, me las tragaba comiendo. Pero eso  no  aliviaba  mi  tristeza.  Esa  emoción  que  me  acompañó   durante tantos años como una sombra la iba cargando en  mi mochila emocional de vida. Eran piedras que llevaba,  \nCómo crear nuevos hábitos emocionales  40 por eso me costaba tanto caminar hacia mis sueños.  En aquella oportunidad mi madre, una mujer escéptica  que  no  creía  en  nada  del  mundo  espiritual,  cedió  a  los   encantos de la magia de lo que no vemos y acudimos junto  a mi papá y mi hermano camino a la Calle Ocho (donde  vive la mayoría de los cubanos en Miami), para que me  hicieran un «despojo», que en el idioma de la religión de   TI\u0003[IV\\MZyI\u0003[QOVQÅKI\u0003®]V\u0003JI}W\u0003ZQ\\]IT\u0003KWV\u0003ZIUI[\u0003Y]M\u0003[QZ^M\u0003  para limpiar espiritualmente a una persona».  Estaba  lloviendo  y  el  cielo  se  tornaba  oscuro.   ¡Imagínense  hasta  dónde  habían  llegado  mis  padres  por   querer  ayudarme!  Hoy  los  entiendo.  En  ese  momento   mi  desesperación  era  tan  grande  que  siempre  necesité   que  me  sacaran  del  estado  en  el  que  estaba.  Claro,  no   sabíamos en ese entonces que yo iba a tener que salirme  sola, porque ni la magia más grande del mundo me podría  haber sacado de allí si yo no lo decidía.  En el camino se nos atravesó un gato negro, cosa nada  buena  para  las  personas  supersticiosas  como  mi  papá,    XMZW\u0003 IT\u0003 ÅVIT\u0003 TTMOIUW[\u0016\u0003 6W\u0003 ZMK]MZLW\u0003 K~UW\u0003 MZI\u0003 TI\u0003 KI[I\u0016\u0003  Lo  que  sí  recuerdo  es  que  entramos  mi  mamá  y  yo.  En   ese entonces tenía veintitrés años y estaba estud pirar. Recién  ahora  se  está  reconociendo  la  importancia   de  tener  un  cuaderno  de  agradecimiento.  El  hecho   de  plasmar  las  emociones  y  sentimientos  en  un  papel   es  la  mejor  forma  de  entrar  en  calma  con  nuestros   estados  emocionales  y  mentales.  Es  una  herramienta   PODEROSA  que  podemos  utilizar  como  hábito  para   nuestra vida con el objetivo de lograr una mejor gestión de  nuestras emociones, pero requiere de práctica, constancia  y motivación, como todos los HÁBITOS.   §-V\u0003Y]u\u0003VW[\u0003JMVMÅKQI\u0003]V\u0003K]ILMZVW\u0003LM\u0003IOZILMKQUQMV\\W'\u0003  En  que  nos  proporciona  CLARIDAD,  EQUILIBRIO  y   CALMA. El simple hecho de tomarnos unos minutos al  día para escribir las cosas por las que estamos agradecidos  incide en una gran transformación de nuestra mente y de  nuestro  cuerpo.  Los  psicólogos  estadounidenses  Robert   Emmons  y  Michael  McCullough  incluso  publicaron  un   libro  llamado:   La  psicología  de  la  gratitud .  Estos  médicos   investigaron y comprobaron que las personas que tienen  un  DIARIO  DE  AGRADECIMIENTO  tienen  los    [QO]QMV\\M[\u0003JMVMÅKQW[\" \nAna María Deik 69 1.   Mejora  la  salud  física  y  mental.  Reduce  el  riesgo   de  sufrir  enfermedades  del  corazón,  regula  el  sueño  y   nos  ayuda  a  gestionar  el  miedo,  el  estrés  y  la  ansiedad.   Nos  ayuda  a  autoconocernos.  Recuerden  que  el   autoconocimiento  es  PODER.  Nos  ayuda  a  salir  de  la   confusión  mental,  favoreciendo  una  actitud  expansiva  y   abierta.  2.   Fortalece  nuestros  sentimientos  de  conexión  con   nuestro ser esencial, de propósito y de satisfacción en las  relaciones  personales  y  sociales.  Nos  ayuda  a  fortalecer   nuestros vínculos con la familia, amigos y colegas.  3.   Nos  lleva  a  lograr  una  mayor  alegría,  a  ser  más   optimistas,  a  tener  entusiasmo  por  la  vida,  por  nuestro   entorno,  a  vivir  con  más  determinación  y  energía.  Al   agradecer ponemos nuestro foco en lo positivo de nuestra  vida.  Empezamos  a  ver  el  vaso  más  que  lleno,  porque   estamos CONSCIENTES de todo lo bueno que tenemos  a nuestro alrededor.  4.  Nos proporciona mayor claridad, mejor capacidad  de  discernir  y  de  entender  en  el  momento  en  el  que  se   nos  presenten  distintas  situaciones  en  nuestra  vida.  La   gratitud nos conecta con la abundancia, nos sitúa en un  nivel  de  energía,  de  prosperidad,  y  nos  ayuda  a  seguir   atrayendo más cosas por las que estar agradecidos.  5.   El  estar  en  constante  actitud  de  agradecimiento   estimula  al  cerebro  a  buscar  con  más  consistencia  lo   constructivo en nuestra vida, en vez de lo destructivo.  6.   Mayor  grado  de  autoconsciencia.  Nos   comprendemos  a  nosotros  mismos,  conocemos  nuestros   valores y necesidades, lo que es importante para nosotros.  \nCómo crear nuevos hábitos emocionales  70 También  nos  hace  ver  lo  que  ya  no  queremos  que  esté   en  nuestras  vidas,  por  ejemplo,  adicciones,  patrones   emocionales de conductas, relaciones tóxicas, trabajos.  7.   Los  estudios  de  Emmons  y  McCullough  apuntan   a  que  las  personas  que  llevan  un  DIARIO  DE   AGRADECIMIENTO elevan las posibilidades de lograr  sus metas y conocer y perseguir su propósito de vida.  8.   Se  disminuye  el  que  reaccionemos  de  forma   impulsiva: A medida en la que vamos practicando nuestra  habilidad  de  AGRADECER,  nuestros  HÁBITOS   EMOCIONALES se fortalecen. 9.  Incrementa  nuestra  capacidad  de  observación,   concentración y atención. Cuando agradecemos estamos  haciendo el acto de repasar el día, la semana, el mes, el  año  y  nuestra  vida  en  general,  poniendo  nuevamente   nuestra atención y foco en todo por lo que deseamos estar  agradecidos. 10.  Incrementa  nuestra  AUTOESTIMA,  ya  que  lo   que escribimos es de nosotros y para nosotros. Es volver  a  conectarnos  de  forma  íntima  con  nuestro  ser  esencial   eliminando así el miedo y los juicios sobre mí mismo.  ;WV\u0003 QVKZMyJTM[\u0003 TW[\u0003 JMVMÅKQW[\u0003 Y]M\u0003 VW[\u0003 W\\WZOI\u0003 MT\u0003 \\MVMZ\u0003  nuestro  CUADERNO  DE  AGRADECIMIENTO.   Hace  un  año  yo  escribo  en  mi  cuaderno  de  Gratitud   y  les  puedo  decir  con  certeza  que  el  llevarlo  me  ha   ayudado  a  enfocarme,  a  conocerme  a  mí  misma,  y  a   incrementar  mi  autoestima.  Es  una  de  las  acciones  que   realizo  diariamente,  y  que  me  ayudó  a  encontrar  mi   propósito. Me toma solo diez minutos al día y ha sido una  experiencia mágica y maravillosa. Yo les recomiendo y los  \nAna María Deik 71 QV^Q\\W\u0003I\u0003PIKMZTW\u0003KWV\u0003XTMVI\u0003KWVÅIVbI\u0016\u0003-V\u0003UQ\u0003KI[W\u0003TW\u0003PIOW\u0003  por las mañanas, para mantener durante el día esa actitud  de estar agradecida por todo lo que me rodea, lo cual me  produce una sensación de gozo y tranquilidad invaluable. Ahora  los  invito  a  que  comencemos  con  un  paso   pequeño.  Vamos  a  escribir  en  las  siguientes  líneas  diez   cosas por las que estamos agradecidos(as). Les recomiendo  que traten de que no sean cosas materiales, sino más bien  relacionadas con la salud, con las personas que los rodean,  con el reconocimiento de sus fortalezas y de sus dones, de  pequeños  detalles  que  están  presentes  en  sus  vidas.  Este   tipo de cosas tiene más impacto que el agradecer las cosas  materiales.   Cosas por las que estoy agradecida(o)   1-............................................................. .................................................................. .................................................................. .................................................................. ....................................... 2-............................................................. .................................................................. .................................................................. .......
