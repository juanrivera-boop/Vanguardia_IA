ez nos deja de importar más el qué  dirán, entonces, me decido a recuperarme a mí misma, y  recuperar  mi  poder  esencial.  Y  ME  EMPODERO.  ¿No   es MARAVILLOSO?  -[\\W\u0003UM\u0003\\ZIM\u0003U]KPW[\u0003JMVMÅKQW[\u0016\u00034M[\u0003UMVKQWVW\u0003ITO]VW[\u0003  que se me vienen a la mente. Aumenta considerablemente mi autoestima. Paz y tranquilidad mental. Siento que no le debo nada a nadie. Dejo de depender emocionalmente de otros. Empiezo a tener muchos momentos de felicidad. Tengo mejores relaciones interpersonales. Me empodero a decir que NO y a poner mis límites. Me siento fuerte. Me siento auténtica. Ya no estoy rodeada de personas tóxicas. Me hago responsable ciento por ciento de mis                 decisiones. Tengo una mejor gestión de mis emociones. Mi comunicación empieza a ser asertiva, o más                asertiva. Mi salud mejora notablemente (cuando vamos soltando  estas  creencias,  nuestro  cuerpo  encuentra  un  equilibrio:   ya que no tiene que seguir luchando con lo que yo quiero,  pese a que hago lo contrario. Ahora mi cuerpo encuentra  un balance entre lo que yo digo, pienso, siento y hago). \nAna María Deik 131 Y  así  podría  pasar  todo  el  libro  nombrando  los    JMVMÅKQW[\u0003Y]M\u0003\\MVMUW[\u0003<7,7;\u0003MV\u0003V]M[\\ZI\u0003^QLI\u0003]VI\u0003^Mb\u0003  que empezamos a ROMPER con nuestras CREENCIAS  LIMITANTES.  Porque  empezamos  a  CAMINAR  por   donde  realmente  queremos  ir  por  la  vida.  E  incluso  nos   volvemos a conectar con nuestro niño(a) interior. ¿Saben  por qué pasa eso? Porque se van cayendo los muros que  fuimos construyendo con las creencias de otras personas  y  empezamos  a  SER  LIBRES.  ¿Y  cuándo  fuimos  libres   anteriormente?  Cuando  éramos  niños  y  estábamos  en   contacto con nuestro ser esencial: cuando soñábamos en  qué  queríamos  ser,  cuando  cantábamos  o  bailábamos,   o  jugábamos  fútbol,  cuando  nuestros  talentos  estaban    ÆWZMKQMVLW\u0016\u0003 A\u0003 PWa\u0003 \\MVMUW[\u0003 TI\u0003 WXWZ\\]VQLIL\u0003 LM\u0003 LMZZQJIZ\u0003  esos muros. ¿Es fácil? NO. ¿Es imposible? NUNCA. ¿Conlleva trabajo? SÍ. Pero les pregunto, y aquí les pido que sean totalmente  honestos.  ¿Vale  la  pena  hacerlo  por  ustedes  mismos?   ¿Vale  la  pena  para  que  logren  sus  sueños?  ¿Su  libertad   lo vale? ¿Vale la pena el esfuerzo para vivir el resto de su  vida como lo desean? En estos días descubrí cuáles creencias limitantes tenía  con  respecto  a  no  ser  tan  conocida  como  escritora.  Ya   sé  que  muchas  familias  y  niños  me  conocen  porque  mis    K]MV\\W[\u0003M[\\nV\u0003MV\u0003[][\u0003KI[I[\u0014\u0003XMZW\u0003VW\u0003UM\u0003ZMÅMZW\u0003I\u0003M[W\u0016\u00035M\u0003 ZMÅMZW\u0003I\u0003[ITQZ\u0003MV\u0003TW[\u0003UMLQW[\u0003LM\u0003KWU]VQKIKQ~V\"\u0003MV\\ZM^Q[\\I[\u0003  de  radio,  reportajes,  entre  otras  cosas.  Hasta  hace  muy   poco tiempo yo me repetía siempre: \nCómo crear nuevos hábitos emocionales  132 AW\u0003[Wa\u0003JIRW\u0003XMZÅT\u0003a\u0003I[y\u0003UM\u0003O][\\I\u0016  Me basta con lo que hago. No me gusta hablar frente a una cámara. No sirvo para grabar videos. Siento que me voy a quedar en blanco si me entrevistan. ¿Qué puedo decir que sea realmente importante? ¿Y si me equivoco? Todas estas creencias me acompañaron por años. Era   UQ\u0003R][\\QÅKIKQ~V\u0003XIZI\u0003VW\u0003[ITQZ\u0003LM\u0003UQ\u0003bWVI\u0003LM\u0003KWVNWZ\\\u0003XWZ\u0003  miedo,  porque  allí  me  encontraba  a  gusto.  En  mi  lugar   seguro. Pero llegó un momento en el que alcancé un tope:  después  de  todo  lo  que  había  escrito  y  publicado,  aún   sentía que me faltaba algo. Sabía en mi interior que tenía  que cruzar barreras que yo sola me había puesto, y  que  fácil no iba a ser.  Fácil era quedarme donde estaba. Hacía casi dos años  que me había comprado una cámara, luces y un micrófono  con el objetivo de abrir mi canal de YouTube, y adivinen  dónde estaban todas esas cosas. Guardadas en mi clóset.  No  encontraba  el  sentido  de  grabarme  hablando  de  los   cuentos infantiles. Esa idea no me llenaba: quería poder  ayudar a los demás y no sabía cómo. Eso me carcomía la  cabeza,  pero  tenía  además  todas  estas  creencias  que  no   me permitían avanzar en el camino que podía llenarme.  Y si no lo intentaba, nunca lo iba a saber. Así que empecé  a cambiar esas creencias. Ahora estoy creando creencias  que me empoderan: CREENCIAS POTENCIADORAS.  Por ejemplo:   Me encanta hablar en público. Tengo tantas cosas que decir. Si me quedo en blanco voy a ser yo misma y seguiré        adelante. \nAna María Deik 133 Me gusta dar entrevistas. Quiero empezar a hacer  lives  para aportar a la           comunidad.  9]QMZW\u0003ÅTUIZ\u0003^QLMW[\u0003XWZY]M\u0003UM\u0003MVKIV\\I\u0003PIJTIZTM[\u0003I\u0003\u0003       las personas y entregarles algo valioso. Todavía  no  tengo  TODAS  las  creencias  limitantes    QLMV\\QÅKILI[\u0014\u0003XMZW\u0003aI\u0003M[\\Wa\u0003KWV[KQMV\\M\u0003LM\u0003MTTI[\u0003MV\u0003OMVMZIT\u0003  y  a  medida  que  vaya  descubriéndolas  iré  cambiándolas   porque  estoy  alerta,  en  observación  de  mí  misma  y   conociéndome todos los días. Esto me está llevando de a  poco a donde deseo.  El otro día fui a una entrevista de radio por mi novela  Los  transeúntes  y casi ni dejé hablar al entrevistador. Me sonrío  cada vez que pienso en eso, porque no solo pude lograr  hablar  en  radio  en  vivo,  sino  que  hablé  con  propiedad.   Si  me  equivoqué  seguí  adelante  y  nadie  murió,  y  viví  la   experiencia  disfrutándola.  Eso  es  impagable.  Para  mí   conseguí algo grande: logré ampliar mi zona de confort,  pude cambiar varias de mis creencias y eso me hace feliz,  porque me permite ir logrando lo que me he propuesto.  Creencias limitantes vs hábitos emocionales  ¿Qué  tanto  tienen  que  ver  nuestras  creencias  con   nuestros hábitos emocionales? Mucho. Las creencias me  obstaculizan  el  lograr  tener  nuevos  hábitos  emocionales   por varios motivos. Vamos a poner un ejemplo:  Yo  tengo  la  creencia  que  para  que  mi  hijo  me  preste   atención tengo que gritarle, porque si le hablo de forma  pausada  y  suave  no  me  escucha.  Cada  vez  que  mi  hijo   \nCómo crear nuevos hábitos emocionales  134 no  me  presta  atención  yo  me  frustro,  me  voy  enojando   y  esa  emoción  va  subiendo  su  intensidad.  Eso  se  suma   a  mi  creencia  limitante  de  que  si  no  le  grito  no  me  va   a  escuchar.  ¿Qué  logra  esa  creencia?  Pues  que  yo  esté   completamente  convencida  de  que  la  única  forma  de   que  mi  hijo  me  escuche  es  gritándole.  Esa  creencia  es   mi  verdad  porque  la  he  experimentado  y  comprobado   una y otra vez. Pero ¿qué pasaría si cambio esta creencia  LIMITANTE?  ¿Si  pienso  que  mi  hijo  sí  me  puede   prestar atención sin yo tener la necesidad de gritarle? Es  normal  que  ese  pensamiento  nuevo  me  genere  dudas,   pero  también  me  hace  pensar  en  cómo  puedo  hacerlo   de otra manera.  Quizás  le  puedo  hablar  en  circunstancias  más   adecuadas, porque me doy cuenta que cuando quiero que  me preste atención y no lo hace, es cuando está ocupado  haciendo  algo.  El  llevarlo  a  la  consciencia  también  me   hace indagar si acaso siempre debo gritarle cuando quiero  que me preste atención, y en ese momento me doy cuenta  que no siempre es así, que en muchas circunstancias él me  ha prestado atención sin que yo le tenga que gritar. ¿En  qué  me  ayuda  darme  cuenta  de  mis  creencias?   En que cuando las llevo a la consciencia, puedo entender  cuáles creencias son limitantes y cuáles no. Por ejemplo: si  yo tengo la creencia de que no puedo controlar mi rabia,  de que soy una persona depresiva, de que soy una mujer  ansiosa. ¿Creen que me sería más fácil o más difícil lograr  gestionar mis emociones? Obviamente es muchísimo más  difícil. \nAna María Deik 135 \n\nAna María Deik 137 12CUARTO PASO  CAMBIA TU FOCO  El  foco  es  hacia  donde  dirigo  mi  atención.  A  veces   no  nos  damos  cuenta  que  cuando  estamos  sintiendo   emociones como la rabia, generalmente ponemos nuestro  foco  en  la  otra  persona.  Si  yo  me  enojo  con  mi  pareja   porque  no  encuentra  las  llaves  del  auto,  por  ejemplo,   pongo mi foco en él. Mi rabia es con él, y él es el culpable  de que yo me sienta así (según mi realidad). Pero les tengo  una noticia, tal como hemos hablado antes, las emociones  aparecen  para  entregarno    información  importante   acerca de nosotros mismos. Es conmigo la cosa, no con mi  pareja. Es lo que me pasa a mí con esta situación. Veamos  qué nos pasa cuando sentimos RABIA (una de las cuatro  emociones básicas en los seres humanos). Primero tiene que haber un estímulo, que en este caso  es que a mi pareja se le hayan perdido las llaves del auto.  Entonces lo primero que nos pasa...   1. Es que sentimos un gran malestar. Pero este malestar,  rabia,  enojo,  viene  por  las  necesidades  no  satisfechas  de   nuestra infancia (pueden ser necesidades de todo tipo: de  atención, de descanso, de silencio, de calma). 2. Lo segundo que nos pasa es que tendemos a culpar  a la otra persona. Pensamos que lo que el otro hace o dice  es lo que provoca mi rabia. Solemos decir: «Cómo tú me  has dicho, cómo tú me has hecho...». \nCómo crear nuevos hábitos emocionales  138 3. Eso es lo que nos pasa por dentro. La tercera cosa  que se nos mueve internamente cuando estamos enojados  es que tenemos el IMPULSO de reaccionar emocional y  automáticamente.  ¿Cuándo \u0014\u0003MV\\WVKM[\u0014\u0003a\u0003XWZ\u0003Y]u\u0003[M\u0003UIVQÅM[\\I\u0003TI\u0003ZIJQI'\u0003 ;M\u0003 UIVQÅM[\\I\u0003 K]IVLW\u0003 M[\\IUW[\u0003 XWVQMVLW\u0003 -4\u0003 .7+7\u0003 MV\u0003  las  cosas  que  NO  queremos,  que  NO  nos  gustan,  en  lo   que quisieramos que cambiara. Ahí es cuando nos vienen  sentimientos  de  rabia,  impotencia,  enfado  y  malestar.   Pero  ¿qué  pasaría  si  pusiéramos  el  enfoque  en  lo  que   queremos, en lo que deseamos, o en lo que necesitamos.  Me  puedo  preguntar:  ¿qué  puedo  hacer  yo  en  la   situación  de  que  a  mi  pareja  se  le  pierdan  las  llaves?   ¿Cómo puedo gestionar mi rabia? El  vacío  existencial  del  que  hablamos  anteriormente   se aloja en el subconsciente, y cuando nos hacemos estas  preguntas, cuando cambiamos de foco, cuando hacemos   stop   para  vernos  hacia  adentro,  sin  culpar  al  otro,  sin   criticarlo  ni  juzgarlo,  la  rabia  se  empieza  a  desvanecer.   Entonces podemos poner nuestro FOCO en una estrategia  para gestionar de forma asertiva nuestra rabia. De ese vacío emocional vienen los MALOS HÁBITOS  EMOCIONALES  que  manejamos  constantemente.   Pongo  la  palabra  MALOS  porque  nos  hacen  mal.  Si   yo  exploto  con  rabia  y  me  desbordo  frente  a  ciertas   situaciones,  eso  me  hace  mal,  y  esos  son  MALOS   HÁBITOS EMOCIONALES. Por eso mi propósito con  este libro es que empecemos a transitar el camino de crear  NUEVOS  HÁBITOS  EMOCIONALES  para  lograr   relacionarnos  mejor  con  nosotros  mismos  y  con  nuestro   entorno. Entonces vamos a dar un súper repaso a este punto tan  importante como es el cambiar de FOCO. \nAna María Deik 139 Lo  que  realmente  me  molesta  no  es  lo  que  el  otro   hace o dice, es lo que yo traigo en el subconsciente de mi  pasado.  Son  mis  juicios,  mis  quejas  y  mis  críticas.  Todo   lo que yo me digo a mí misma(o) es lo que me molesta. Y   [ITMV\u0003UQ[\u0003MUWKQWVM[\u0003I\u0003ÆW\\M\u0014\u0003KWUW\u0003MV\u0003M[\\M\u0003KI[W\u0003M[\u0003TI\u0003ZIJQI\u0016\u0003  Y  cuando  eso  pasa  es  porque  me  encuentro  totalmente   desconectada  de  mi  ser  interno,  lo  que  necesito,  mis   valores y lo que es importante para mí. Entonces, si en vez de poner el foco en cómo me siento  lo pongo en lo que YO NECESITO QUE MI PAREJA  HAGA, estoy poniendo el FOCO en el comportamiento  del otro. Porque quiero que encuentre las llaves, y cuando  las encuentre yo estaré bien. O quiero que no las pierda, o  que no sea tan despistado, o que sea más cuidadoso. ¿Han  escuchado  alguna  vez  que  nuestra  felicidad,   tranquilidad y armonía depende solo de nosotros mismos?  ASÍ ES. ¿Y saben qué? Esa rabia nos viene a traer algo.  Es  una  oportunidad  para  conocerme  más.  ¿Sabían   que  el  autoconocimiento  es  PODER?  Pero  tiene  más   PODER  cuando  desde  el  autoconocimiento  ejecutamos   el CAMBIO. Si esa rabia viene a mostrarme algo de mí,  lo  más  inteligente  es  tomar  esa  oportunidad.  Esa  rabia   viene a hablarme de: ¿Quién soy? ¿Qué necesito? ¿Cuáles son mis valores? ¿Qué es lo que aprecio? Y ¿qué tan distanciada estoy de lo que para mí es        realmente importante?  Dejar  a  un  lado  los  juicios  que  me  vienen  como   impulsos  del  subconsciente,  volverme  consciente  de  lo   que estoy sintiendo y hacer consciente esa emoción es MI  responsabilidad.  Porque  yo  les  pregunto  por  lógica:  esa   \nCómo crear nuevos hábitos emocionales  140 rabia que yo siento, que se desborda en mí en contra de mi  pareja, en este caso, ¿me trae algo bueno? ¿Qué pasaría si  yo actuara diferente? Si le dijera a mi pareja: «ya, mi amor,  se te perdieron las llaves, ¿dónde crees que puedan estar?  ¿Te ayudo a buscarlas? ¿Si agarramos mientras tanto las  de repuesto?». Qué diferente sería todo, ¿verdad? Porque  la rabia desbordada hace daño. Es un hábito emocional  (la reacción que tenemos) frente a ciertas situaciones que,  si  no  las  cambiamos,  se  van  a  seguir  repitiendo  durante   nuestra vida una y otra vez. Lo que realmente me molesta no es lo que mi pareja  hizo,  sino  lo  que  yo  me  digo  a  mí  misma  sobre  lo  que   el  otro  hace.  Siempre  estamos  pensando,  por  lo  general   emitiendo juicios de todo. Y seguramente en este caso mi  juicio es: «¡Qué despistado eres!», «Es que siempre te pasa  lo mismo, o siempre ME haces esto antes de salir». Hay personas a las que les molesta mucho el desorden,  que su hijo no coma, que la pareja sea olvidadiza, que no  sean escuchados por los otros, que lo juzguen o critiquen,   Y]M\u0003 TW[\u0003 PQRW[\u0003 TW[\u0003 LM[WJMLMbKIV\u0016\u0003 <M\u0003 QV^Q\\W\u0003 I\u0003 Y]M\u0003 \\M\u0003 ÅRM[\u0003  en  cuántas  y  cuáles  cosas  te  molestan.  Hagamos  una   pequeña lista de las cinco cosas que más te molestan de  una  persona,  puede  ser  un  hijo,  tu  pareja,  tu  madre,  tu   padre,  alguien  cercano  con  quien  tengas  relación  todos   los  días.  A  mí,  por  ejemplo,  me  molesta  que  mis  hijos   dejen tirados los zapatos y los bolsos cerca de la entrada  de  la  casa.  Trato  de  controlarme,  claro  está,  a  veces  he   explotado, y pese a que hoy tengo las herramientas para  gestionar de una forma asertiva mis emociones, también  me equivoco. Estoy trabajando en ello. El  otro  día  exploté.  Les  grité  a  mis  hijos  que  cómo   era  posible  que  tuvieran  un  desorden  siempre  cerca  de   la entrada, que casi me resbalo y me caigo. El mayor me  preguntó qué me pasaba y me pidió que me calmara, el  \nAna María Deik 141 menor en cambio se fue al sofá, enojado según él por mi  sobrerreacción. Lo que me pasó después es que me puse  a llorar y descargué lo que realmente me pasaba. Mis dos  hijos vinieron a abrazarme y me apoyaron. Yo me sentía  sobrecargada. Es verdad que ellos tienen que mantener el orden en  los  espacios  comunes  de  la  casa,  pero  yo  podía  haber   actuado de otra forma, no tenía por qué sentir esa rabia.  Pero  esa  rabia  me  venía  a  decir  cosas  de  mí  misma.  No   del  desorden  de  ellos.  Esa  rabia  me  vino  a  decir  que   necesitaba  descanso,  que  necesitaba  estar  sola,  como   ahora  que  escribo  estas  palabras.  En  este  momento  me   encuentro sola en mi habitación, los niños se fueron donde  un  amigo,  y  esto  es  lo  que  necesitaba.  Escribir,  drenar,   meditar, escuchar música tranquila e inspiradora.  La  mayor  parte  del  tiempo  cuando  le  pido  a  mis   hijos que ordenen lo hacen de buena voluntad, y eso me  produce paz y armonía. Cuando yo grito y me desbordo  me  hace  sentir  mal.  Entonces  como  hablábamos:  a  mí,   por  ejemplo,  me  molesta  el  desorden,  porque  cuando   veo desorden alrededor se me desordenan las ideas en mi  interior. Siento que si tengo todo en orden puedo trabajar  tranquila. Necesito orden fuera para seguir ordenada por  dentro. Vamos, entonces, con la lista de las cinco cosas que te  molestan de un hijo, pareja, padre, madre, alguna persona  cercana. 1............................................................... .................................................................. .................................................................. \nCómo crear nuevos hábitos emocionales  142 .................................................................. ........................... 2............................................................... .................................................................. .................................................................. .................................................................. ........................... 3............................................................... .................................................................. .................................................................. .................................................................. ........................... 4............................................................... .................................................................. .................................................................. .................................................................. ........................... 5............................................................... .................................................................. .................................................................. .................................................................. ........................... ¿Te  das  cuenta  que  cuando  llevamos  a  la  conciencia   la rabia, y entendemos que aquello que nos sucede con el  otro es lo que creemos que el otro debería ser o hacer, la  emoción baja en intensidad? Y desde ahí es mucho más  fácil gestionar la emoción, y es ahí cuando aprendemos a  tener un NUEVO HÁBITO EMOCIONAL. Los  invito  a  que  la  próxima  vez  que  sientan  rabia  o   \nAna María Deik 143 impotencia se enfoquen en ustedes, no en la otra persona.  Esa es una herramienta poderosa para cambiar y poder  tener un nuevo HÁBITO EMOCIONAL. \n\nAna María Deik 145 13QUINTO PASO  BAJA TUS EXPECTATIVAS  En  la  vida  cotidiana  nos  hemos  acostumbrado  a   crearnos expectactivas según las situaciones que vamos a  experimentar y las relaciones con los demás. Nos creamos  una  película  mental  sobre  lo  que  va  a  ocurrir,  sobre  las   reacciones  que  van  a  tener  las  otras  personas  o,  mejor   dicho,  las  reacciones  que  yo  espero  que  a  otra  persona   tenga. Por ejemplo: Una  mujer  le  prepara  una  sorpresa  a  su  esposo  para   el  día  de  su  aniversario.  Le  escribe  una  carta  y  prepara   la habitación llenándola de rosas. Tiene lista una botella  de champaña con dos copas. Y para darle una sorpresa le  dice que le duele mucho la cabeza y que lo espera en casa.   -V\u0003KIUJQW\u0014\u0003uT\u0003XZMÅMZM\u0003[ITQZ\u0003I\u0003KMVIZ\u0003XIZI\u0003KMTMJZIZ\u0003TW[\u0003LW[\u0003  en un lugar costoso y especial. Pero ellos no han hablado  de lo que cada uno quiere.  Èl,  un  poco  frustrado  por  la  situación  ya  que  quería   salir a cenar, espera encontrar a su esposa en cama viendo  alguna película. Se dice a sí mismo que no importa tanto,  que  pueden  salir  a  cenar  cualquier  otro  día  y  se  hace  la   idea de quedarse en casa con ella.  Para  la  esposa  este  día  es  súper  importante  y  se  crea   tantas expectativas, siente que hizo muchas cosas por él,  prepara tantas sorpresas... Y, cuando él llega a casa, abre la puerta con cuidado  para  no  hacer  ruido.  Está  pensando  en  el  bienestar  de   ella.  Ella,  se  encuentra  metida  en  la  cama  esperándolo   \nCómo crear nuevos hábitos emocionales  146 con  una  camisa  sexy  que  compró  para  la  ocasión.  Las   luces están apagadas.  Cuando él entra a la habitación lleva un regalo en la  mano.  Una  pulsera  especial  que  le  compró  al  salir  del   trabajo.  De  pronto,  ella  prende  las  luces  y  lo  sorprende   vestida con su nuevo  baby doll  y se le tira en los brazos. Él  no reacciona, ella se molesta. No logran comunicar lo que  sienten  y  la  reacción  de  ella  es  reprocharle  todo  lo  que   hizo para «ellos», y que él no lo valoró. Él todavía no ha tenido tiempo de hablar, y mientras  ella está disparando el arsenal de su rabia y frustración, él  le dice que no se esperaba esto. Ella le responde que claro,  que así son las sorpresas, que si acaso nunca le han dado  una. Y comienzan a discutir y en vez de entenderse, todo  va de mal en peor. Ella se va enojada a otra habitación a  dormir y él se queda despierto muchas horas sin entender  qué hizo mal. La  verdad  es  que  él  no  hizo  nada  malo.  Ella  tenía   tantas  expectativas.  Se  había  imaginado  una  y  otra  vez   lo maravilloso que iba a ser. Y yo no estoy diciendo con  esto  que  no  sea  bueno  visualizar,  es  muy  bueno  para  ir   hacia  nuestros  objetivos.  El  poder  de  la  visualización  es   poderoso. Pero luego de visualizar y sentir la experiencia  hay  que  soltarla  y  no  aferrarse  a  los  resultados.  Ella  no   la  soltó  y  se  aferró  tanto  que  ahora  duele.  Subió  tanto   que ahora se fue en picada. Y ese es el problema de tener  y  hacerse  expectativas  frente  a  los  demás.  Ya  que  luego   muy  posiblemente  venga  la  frustración,  la  desilusión,  la    LM[KWVÅIVbI\u0016 )Kn\u0003\\IUJQuV\u0003QVÆ]aMV\u0003TI[\u0003KZMMVKQI[\u0003Y]M\u0003\\MVMUW[\u0003a\u0003Y]M\u0003  traemos  en  el  SUBCONSCIENTE  como  programas   mentales.  Esta  chica,  además  de  haberse  hecho  altas   expectativas  de  su  novio  frente  a  la  sorpresa  que  ella  le   había preparado, seguramente tenía varias creencias que  le jugaron en contra para lograr gestionar sus emociones,  tales como: \nAna María Deik 147 Que ella siempre da más que lo que le dan sus parejas. Que su novio debe sorprenderla y consentirla. Que los hombre son todos iguales Ahora yo me pregunto ¿es posible vivir sin expectativas?  ¿Se  puede  lograr?  Vivir  sin  ninguna  expectativa  es  muy   difícil,  pero  se  puede  bajar  al  máximo  las  expectativas   que  tenemos  con  los  demás  (con  practica  y  paciencia).   Ahí vamos de nuevo con analizar qué creencias tenemos  que  nos  impulsan  a  crearnos  expectativas  de  los  demás.    Por ejemplo: Es mejor vivir con apego. Si no me aferro la persona se puede ir de mi lado.  8ZMÅMZW\u0003PIKMZUM\u0003M`XMK\\I\\Q^I[\u0003Y]M\u0003VW\u0003M[XMZIZ\u0003VILI\u0016  No sirvo para no esperar nada del otro. El otro me tiene que dar en la medida en la que yo le        doy. Creo que el apegarme es una manera de amar al otro. Demuestro amor cuando no puedo vivir sin esa                  persona. El amor duele. El amor verdadero conlleva sufrimiento. Sufrir por amor es parte de la vida. No me importa sufrir si es por amor. \nCómo crear nuevos hábitos emocionales  148 Vamos  a  hacer  un  ejercicio,  y  te  invito  a  que  seas   totalmente honesto(a) contigo mismo(a). Describe lo que  sientes  con  detalle  en  relación  a  cada  expectativa  que   tengas o que hayas tenido en relación a tu pareja. Y si no  tienes  pareja,  qué  expectativas  has  tenido  con  tu  última   pareja.  Quizás  tengas  la  expectativa  de  que  nunca  mire   a otra mujer, por ejemplo, o que se desviva por ti, que te  siga en todo, que sea detallista, o que sea proveedor.  1............................................................... .................................................................. .................................................................. .................................................................. 2............................................................... .................................................................. .................................................................. .................................................................. 3............................................................... .................................................................. .................................................................. .................................................................. 4............................................................... .................................................................. .................................................................. .................................................................. 5............................................................... .................................................................. .................................................................. .................................................................. \nAna María Deik 149 ¿Qué expectativas tienes en relación a tus hijos? ¿Qué  esperas  de  ellos  constantemente?  Quizás  esperas  que  no   griten, que se porten bien, que sean considerados con los  demás, que sean ordenados, que no te respondan mal, o  que te hagan caso en todo.  1............................................................... .................................................................. .................................................................. .................................................................. 2............................................................... .................................................................. ........................................ van al mismo camino, a la misma hoja de ruta por donde  ya no queremos seguir pasando. ¿Verdad? Por eso estamos  conectados en este libro, yo escribiéndolo y aprendiendo  de mis experiencias, y tú leyéndolo y aprendiendo de las  tuyas. Pero todos deseamos lo mismo: aprender a tomar  decisiones para accionar de otra forma que nos permita  \nAna María Deik 155 caminar  hacia  el  destino  que  queremos,  hacia  nuestros   sueños.  Mi  sueño  ahora  mismo  es  conectarme  contigo   en  este  camino.  Ya  nos  hemos  encontrado  y  estamos   recorriendo  JUNTOS  este  descubrimiento  de  nosotros   mismos, cada uno en su proceso.   ¿No es eso MARAVILLOSO?  ¿Qué hice yo ese día que hablé con esta mentora por  Instagram?  Quemé  todos  mis  barcos.  Y  no  solamente   eso, les quiero contar otra cosa de la que logré liberarme  recién  ahora,  a  mis  cuarenta  y  cinco  años,  pero  no   importa,  ¿verdad?  No  importa  cuántos  años  tengamos,   en qué período de nuestra vida estemos: lo importante es  tomar ACCIÓN. Cuando  hace  un  mes  me  embarqué  en  este  proyecto   yo  sabía  que  era  el  momento  de  salir  de  mi  zona  de   confort, de quemar todos mis barcos, pero no me atrevía,  dejaba que la emoción del MIEDO y mis CREENCIAS  LIMITANTES  salieran  de  mi  SUBCONSCIENTE  a   manejarme cada vez que yo pensaba siquiera al respecto  sobre hacer otra cosa. Acá les cuento la otra cosa de la que logré liberarme:  toda mi vida he tenido una dependencia emocional con  mis padres. Somos una familia muy unida, pero mis padres  fueron muy sobreprotectores conmigo y con mi hermano.  Siempre nos dieron todo, pero ese todo no era GRATIS,  venía  con  condiciones.  No  es  el  TODO  que  yo  le  doy   hoy  a  mis  hijos.  No  juzgo  a  mis  padres,  ellos  intentaron   hacer  lo  mejor  que  pudieron  con  las  herramientas  que   tenían a la mano, que eran escasas. Pero HOY, en cambio,  nosotros,  tú  y  yo  y  todos  tenemos  las  herramientas  para   CREAR la VIDA que  más  tiempo,   para ser capaces de sentirnos tristes, vivirlo, llorar, buscar  ayuda y seguir adelante, para sentir rabia y gestionarla de  forma  asertiva,  y  que  esa  rabia  nos  movilice  a  actuar,  a   mejorarnos a nosotros mismos y también a ponerles límites  a los demás, para lograr disfrutar cada pequeña cosa que  hacemos porque la estamos haciendo con AMOR. ¿Saben dónde pueden VIVIR su VIDA mejor? En el  PRESENTE.  El  presente  es  un  regalo,  por  eso  se  llama   presente. Es el aquí y el ahora. Quienes viven en el pasado  sufren, y quienes viven constantemente en el futuro viven  con  ansiedad,  porque  lo  único  seguro  que  tenemos  es   el  AQUÍ  y  el  AHORA.  Es  cuando  realmente  estamos   conectados  con  nuestra  esencia,  con  nuestro  ser:  con  lo   que somos de verdad. Los  invito  a  que  comiencen  a  estar  en  el  momento   presente,  si  no  lo  han  experimentado,  y  si  ya  lo  han   experimentado: practicarlo cada día más. También como  un  hábito,  quizás  lo  podríamos  probar  como  un  hábito   ROCA. ¿Qué les parece? Escribiéndoles estas palabras, a  las 4:15 de la madrugada se me acaba de ocurrir esa idea. \nCómo crear nuevos hábitos emocionales  170 Si  comenzamos  a  practicar  el  estar  en  el  momento   presente todos los días, aunque sea por un rato, a la semana  siguiente, que ya estaremos más conscientes, lo haremos  cada  vez  que  nos  acordemos.  Por  lógica  esto  nos  va  a   traer  la  incorporación  de  otros  hábitos,  como  empezar   a comer de forma consciente: por tanto, sería un hábito  adicional  al  HÁBITO  ROCA,  también  nos  llevaría  a   practicar  MINDFULLNESS  el solo hecho de estar más en  el momento presente. También nos costaría más salirnos  de nuestro centro porque vamos a estar experimentando  más estados de paz, tranquilidad y felicidad. Los invito a pensar en dos HÁBITOS ROCA que se  les venga a la mente y que se sientan motivados a lograr e  incorporar en su vida. Hagamos este ejercici     function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);

    function rgbToHex(r, g, b) {

    function mixColors(colorA, colorB, amount) {

    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;

        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);

    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);

        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }
    function escapeHtml(s) {
        if (s === undefined || s === null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getSessionHTML() {
        const clone = chatDisplay.cloneNode(true);
        const exportStyles =
            'body{font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;line-height:1.65;padding:28px;color:#333;max-width:880px;margin:0 auto;background:#fafafa;}' +
            'h1{color:#007bff;font-size:1.45em;margin-bottom:6px;}' +
            '.meta{color:#444;margin:6px 0;font-size:.95em;}' +
            'hr{border:none;border-top:1px solid #dee2e6;margin:22px 0;}' +
            '.chat-export{padding:4px 0;}' +
            '.chat-export .user-message,.chat-export .bot-message,.chat-export .system-message{margin-bottom:18px;}' +
            '.chat-export .system-message{text-align:center;color:#555;font-style:italic;padding:10px 14px;background:#fff3cd;border-radius:10px;border:1px solid #ffeaa7;}' +
            '.chat-export .system-message.error{background:#f8d7da;color:#721c24;border-color:#f5c6cb;}' +
            '.chat-export .message{display:flex;align-items:flex-end;gap:12px;}' +
            '.chat-export .message.user-message{flex-direction:row-reverse;}' +
            '.chat-export .avatar-img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid #e0e0e0;}' +
            '.chat-export .message-bubble{padding:12px 16px;border-radius:18px;max-width:78%;box-shadow:0 1px 2px rgba(0,0,0,.06);}' +
            '.chat-export .user-bubble{background:#007bff;color:#fff;}' +
            '.chat-export .bot-bubble{background:#e9ecef;color:#212529;}' +
            '.chat-export .bot-bubble strong{color:#007bff;}' +
            '.chat-export .bot-bubble p{margin:0 0 10px;}.chat-export .bot-bubble p:last-child{margin:0;}' +
            '.chat-export pre{background:#2d2d2d;color:#f8f8f2;padding:12px;border-radius:8px;overflow-x:auto;font-size:.9em;}' +
            '.chat-export code{background:#eee;padding:2px 6px;border-radius:4px;font-size:.9em;}' +
            '.chat-export ul,.chat-export ol{margin:8px 0;padding-left:22px;}';
        return '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sesión de chat</title><style>' + exportStyles + '</style></head><body>' +
            '<h1>Sesión de chat</h1>' +
            '<p class="meta"><strong>Documento:</strong> ' + escapeHtml(PDF_NAME) + '</p>' +
            '<p class="meta"><strong>Tema del chatbot:</strong> ' + escapeHtml(CHATBOT_THEME) + '</p>' +
            '<p class="meta"><strong>Modelo:</strong> ' + escapeHtml(MODEL) + '</p>' +
            '<hr><div class="chat-export">' + clone.innerHTML + '</div></body></html>';
    }

    function downloadSessionHtml() {
        const blob = new Blob([getSessionHTML()], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Sesion_Chat_' + Date.now() + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
