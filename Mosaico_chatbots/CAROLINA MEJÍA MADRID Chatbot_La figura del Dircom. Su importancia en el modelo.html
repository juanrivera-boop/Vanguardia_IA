<script>
    const PDF_TEXT = "Anàlisi 35, 2007   83-93  La figura del  Dircom.  Su importancia en el modelo de comunicación integral Francisca Morales Ana Mª Enrique Universitat Autònoma de Barcelona  Facultad de Ciencias de la Comunicación  Departamento de Comunicación Audiovisual y Publicidad  Francisca.Morales@uab.es  Anamaria.enrique@uab.es  Resumen  Este artículo aborda la función del  Dircom , ejecutivo responsable de la comunicación  tanto de empresas como de instituciones y su implicación en la consolidación en estos  últimos años del modelo de  comunicación integral.  Partiendo de una visión holística de  la dirección de comunicación, la figura del  Dircom  contribuye a gestionar de manera cohe-  rente y homogénea las tres áreas que abarca el modelo de comunicación integral: comu-  nicación de marketing/comercial, comunicación corporativa/institucional y la comunicación  interna.  Palabras clave :  Dircom , organización, comunicación integral, dirección de comunicación.  Abstract.  The concept of the  Dircom . His importance in the model of integral communication  This article approaches the function of the  Dircom , an executive responsible for the com-  munication of both companies and institutions and his implication in the consolidation in  the latter years of the model of integral communication. From a holistic point of view of  the communication management, the concept/role of the  Dircom   helps to manage, in a  coherent and homogeneous way, the three areas that involve the model of integral com-  munication: communication marketing , institutional communication and internal com-  munication.  Key words:   Dircom , organization, integral communication, communication management.  Sumario  1. Introducción  2. Comunicación de marketing  versus  comunicación integral  3. La dirección de comunicación   y su contribución a la consolidación   del modelo de comunicación integral  4. Conclusión  5. Bibliografía  6. Otras fuentes consultadas \n1. Introducción  En toda organización prolifera gran cantidad de informaciones, mensajes y  señales que implican movimientos y cambios permanentes en el desarrollo de  su actividad. Es así como el tráfico de las comunicaciones va ganando terre-  no, por lo que resulta imprescindible implantar orden y control sobre todas  ellas y prever la desorganización o entropía1 que la falta de una gestión efi-  ciente de las comunicaciones pueda producir. Las empresas, las instituciones y  las organizaciones en general, cada vez más, tienen la necesidad de interrela-  cionarse con el exterior y de crear un clima de implicación y motivación entre  las personas que la integran. El profesional que cuenta con un perfil capaz de  asumir esta tarea se denomina  Dircom  o  director de comunicación , entendien-  do a esta persona como la responsable de planificar, dirigir y coordinar todas  las actividades de comunicación que se implementan en una organización con  el fin de alcanzar y de consolidar una imagen positiva. Como señala Johnsson2,  el director de comunicación es la persona de la empresa que desarrolla y man-  tiene la red de contactos, dentro y fuera de ella.  La acuñación del término  Dircom   y su reconocimiento como profesión se  sitúa en el primer Congreso TOP-COM organizado en Francia en 1988. Entre  los objetivos que se marcaron sus organizadores y participantes se encontraba  el de realizar un manifiesto que contemplara las funciones del profesional de la  comunicación en las organizaciones. Weil, así lo explicaba en 19903, aseguraba  que se trató de una manifestación política para lograr el reconocimiento profe-  sional de unas funciones de comunicación que se realizaban con carácter irregular.  Presentaba al nuevo profesional como el nuevo director de comunicación glo-  bal y entre sus funciones señalaba: la publicidad de producto y marcas; las rela-  ciones públicas; las relaciones con la prensa; la comunicación con los poderes  públicos, bancos y universidades; el patrocinio; el mecenazgo; el marketing;  la decoración interior; la elección de despachos. Dentro del organigrama de la  empresa los ubicaba entre la dirección de marketing y la presidencia.  En España, la figura del Dircom emerge en los años noventa, coincidien-  do con la consideración de la comunicación como valor estratégico para las  empresas e instituciones. Ya en 1992, dentro de la Universidad existía la pre-  ocupación académica por incluir en sus estudios e investigaciones la proble-  mática que representaba el director de comunicación. Un incipiente perfil  profesional, cuyo rol se empezaba a vislumbrar como una posibilidad real a la  hora de afrontar el reto que, ya al inicio de los noventa, representaba para  las empresas e instituciones ofrecer una imagen de marca, global y diferenciada.  Esas inquietudes se concretaron en el seminario de Cuenca: El Director de  Comunicación;  jornadas  que  fueron  impulsadas  y  organizadas  desde  el  84   Anàlisi 35, 2007   Francisca Morales; Ana Mª Enrique  1.   WIENER (1969). Reconoce la entropía como una medida de desorganización en contrapo-  sición a la información que la considera una medida de organización.  2.   JOHNSSON, H. (1991).  La gestión de la comunicación.  Madrid: Ed. Ciencias Sociales.  3.   WEIL, P. (1990).  Communications obligue! Communication institutionelle et de management.  París: Les Éditions d’Organisation. \nDepartamento de Comunicación Audiovisual y Publicidad (CAVP) de la  Universidad Complutense de Madrid (UCM), dirigidas por los profesores Juan  Benavides y Rafael Alberto Pérez. Contaron con la colaboración y el apoyo  del  Instituto  de  Investigación  de  la  Comunicación  de  la  Universidad  Internacional Menéndez Pelayo y la revista  CONTROL . En esas jornadas, el  profesor Mario Herreros, catedrático de Comunicación Audiovisual, Publicidad  y Relaciones Públicas de la UAB, y el profesor José V. Idoyaga, de la Universidad  del País Vasco, coincidían en afirmar que la formación universitaria de profe-  sionales capaces de dirigir una correcta organización y gestión de la comuni-  cación  en  las  empresas  e  instituciones,  con  capacidad  para  una  correcta  planificación estratégica, ya estaba establecida en la universidad pública, «me  estoy refiriendo como pueden suponer a la licenciatura de Publicidad y  Relaciones Públicas». Por otro lado, en 1993, se crea en Madrid la primera  Asociación de Directores de Comunicación en España, ADC Dircom. Entre  sus objetivos se plantean promover, apoyar y consolidar la figura y las funcio-  nes del director de comunicación. Su presidente, en aquellas fechas Javier  Fernández del Moral, aseguraba que la asociación se había «convertido en un  punto de referencia para los profesionales del sector, al reunir en su seno a los  responsables de comunicación de las mayores empresas de España».  En la actualidad, estamos presenciando la consolidación de lo que Villafañe4 denomina «la cultura del corporate», entendida como la gestión de los activos  intangibles, entre ellos, la imagen y la reputación de las organizaciones.  Joan Costa5 señala que son varias las condiciones imprescindibles para que  se reconozca al  Dircom   en una organización:  —   Deberá depender directamente de la Alta Dirección de la Empresa.  —   Deberá comunicarse bien con «todas» las personas de la organización.  —   Será un estratega y planificador (él supervisa y orienta).  —   Deberá saber diferenciar la comunicación institucional/corporativa de la  comunicación de marketing/comercial.  —   Deberá saber vender el departamento dentro de la empresa y explicar su  utilidad para la organización.  —   Diseñará acciones, planes y programas de comunicación sobre la base de  objetivos estratégicos.  —   Coordinará e interpretará las necesidades de comunicación de los diferen-  tes departamentos de la compañía.  —   Supervisará todas las acciones, campañas, promociones e informaciones  desarrolladas por los diferentes departamentos.  —   Evaluará los resultados de las acciones de comunicación en función de los  objetivos.  La figura del  Dircom . Su importancia en el modelo de comunicación integral   Anàlisi 35, 2007   85  4.   VILLAFAÑE (2001). En  Dirección de comunicación empresarial e institucional.  Barcelona:  Gestión 2000.  5.   COSTA, J. (1997).  Gestionar la comunicación . Buenos Aires: Seminario Internacional de  Imagen y Comunicación. \nSin duda, estamos ante un gestor de las comunicaciones con un perfil poli-  valente y generalista, por lo que resulta complejo delimitar los requisitos bási-  cos en cuanto a las capacidades o a las habilidades personales, así como la  formación académica y profesional con las que se debe contar. No obstante,  Costa6 coincide con Martín7 en que el Dircom debe comprender la cultura  corporativa de la organización. Garrido8 cree que debe poseer habilidades direc-  tivas con capacidad de integrar equipos multidisciplinares. Por otro lado,  Villafañe9 comenta que, a pesar de que no existe un «profesiograma» defini-  do respecto al currículo académico-profesional al que debe responder un direc-  tor de comunicación, sí que es necesario que tenga la capacidad para traducir  la estrategia global de la organización a un esquema de imagen que debe desa-  rrollarse y controlarse a través de las técnicas de comunicación. Costa va más  allá de lo estrictamente profesional y apunta las siguientes cualidades o dotes  de un director de comunicación: humanista integral con sólida formación en  deberes morales y cívicos.  El   Observatorio Permanente de la Publicidad y el Corporate en España   en su  informe anual de 2001 establecía un criterio, como referencia para poder valo-  rar si una dirección de comunicación está consolidada o no dentro de su orga-  nización, y aseguraba que  debe estar ubicada orgánicamente en la primera línea  ejecutiva y, consiguientemente, su responsable debe participar en el comité de direc-  ción de la compañía o tener interlocución directa con la presidencia.  En la actualidad, las grandes compañías españolas, en su mayoría, cuen-  tan con un departamento de comunicación encargado básicamente de la ges-  tión de su comunicación e imagen corporativa. Según un estudio10 realizado  por la  Asociación DirCom   (2004), en nuestro país, el 78% de las empresas cuen-  tan con un departamento de comunicación, frente al 13%, donde no existe.  Por tanto, podemos hablar de una incipiente consolidación del departamento  de comunicación dada su presencia en el organigrama de la empresa.  La necesidad de coordinar un discurso coherente e íntegro tanto en el seno  de la organización como en su entorno contribuye a que el director de comu-  nicación, junto al órgano que representa, forme parte de la Alta Dirección de  la empresa (presidente, consejero delegado, director general...). Entendemos  el término staff como aquellas actividades especializadas o funcionales que  comprenden los diversos servicios de asesoramiento, que estructuralmente apa-  recen separados y no tienen poder para tomar decisiones. El staff de apoyo lo  constituyen departamentos o unidades especializadas situadas fuera de la línea  de trabajo11 operacional y suministran apoyo a la organización. La comunica-  86   Anàlisi 35, 2007   Francisca Morales; Ana Mª Enrique  6.   COSTA, J. (2001).  Director de comunicación empresarial e institucional . Barcelona: Edición 2000.  7.   MARTÍN, M (1998).  Comunicación empresarial e istitucional.  Madrid: Universitas.  8.   GARRIDO, F (2004).  Comunicación estratégica.   Barcelona: Gestión 2000.  9.   VILLAFAÑE, J. (2000).  La gestión profesional de la imagen corporativa.   Madrid: Pirámide.  10.   ADC DIRCOM (2004). «Presencia de departamentos de comunicación en grandes com-  pañías».  El estado de la comunicación en España . Madrid.  11.   Modelo «Line and Staff». En: BRECH, E. F. L. (1969).  Management su naturaleza y signifi-  cado . Barcelona: Oikos-tau. \nción forma parte del staff de apoyo que Mintzberg12 (1989) denomina  tecno-  estructura.  El discurso de comunicación ha de ser coherente, pero el profesional res-  ponsable de la comunicación, además, ha de ser un gestor integral de la comu-  nicación. La gestión de la comunicación en las organizaciones se basa en la  existencia de un departamento específico: la dirección de comunicación, con  un ejecutivo al frente, máximo responsable de toda la comunicación de la orga-  nización, que será gestionada de forma global. Este departamento depende y  reporta directamente con la máxima dirección de la empresa, y su principal  función es la de ser guardián de la imagen, al más alto nivel. Sin embargo, exis-  ten diferencias significativas en el modelo de gestión de la comunicación depen-  diendo del perfil de cada organización. Las empresas de productos de consumo  estructuran y gestionan su comunicación a partir del modelo de comunica-  ción de marketing. Sus objetivos se desarrollan en torno a unos productos con-  cretos con unas características específicas que deben introducir en el mercado  y lograr el mayor grado de participación —cuota de mercado— posible. El  valor de la «marca-producto» está muy asumido y, de hecho, no descubrimos  nada nuevo si afirmamos que es gracias a la marca y a valores emocionales que  se configura la «diferencia significativa»13 entre los productos, que los hace  diferentes y atractivos ante el consumidor potencial. No obstante, estas orga-  nizaciones trabajan sobre la base de un producto concreto, con unas propie-  dades específicas y objetivas; es en torno a ese producto y a su marca que se  desarrolla la actividad de comunicación. En muchas de estas empresas la marca  corporativa ni siquiera existe.  Por otro lado, las empresas de servicios públicos y las organizaciones en  general que no cuentan con un producto físico, tangible, para colocar en el  mercado, porque lo que ofertan son servicios, ideas, proyectos, en resumen  intangibles, su identidad e imagen pasa necesariamente por una marca insti-  tucional o corporativa que tendrá que posicionarse en la mente de los usua-  rios o posibles colaboradores para que les permita ser identificados y posicionados  favorablemente. La comunicación, en estos casos, aparece más necesaria desde  un enfoque global e integrador, porque debe conseguir comunicar valores, his-  toria, calidad, emociones, etc. Siempre desde una imagen de marca que será  la única, la de la organización en su conjunto, una imagen corporativa. En  estos casos, también se hace comunicación de marketing pero siempre como una  actividad más dentro de la estrategia de comunicación de la organización, no  como modelo a partir del cual se estructura y desarrollan todas las actividades  comunicativas.  En cuanto a las responsabilidades de este profesional, podemos enumerar  tantas como la estructura de la comunicación de la organización lo permita.  Partiendo de una visión holística de la gestión de la comunicación y aplican-  La figura del  Dircom . Su importancia en el modelo de comunicación integral   Anàlisi 35, 2007   87  12.   MINTZBERG, H. (1989).  Diseño de organizaciones eficientes.   Buenos Aires: Ed. El Ateneo.  13.   RICARTE, J. M. (2000).  Procesos y técnicas creativas publicitarias.  Barcelona: Servei de  Publicacions (UAB). \ndo el modelo de comunicación integral, el cual abordaremos a continuación,  nos encontramos con la que de un modo general resume su función primor-  dial: coordinar las distintas actividades de comunicación, conseguir una ges-  tión coherente de las mismas y homogeneidad de los mensajes e implicación de  todos los públicos en el proyecto empresarial. Este proyecto empresarial debe-  rá ser traducido por el director de comunicación en términos de imagen con el  fin de contribuir de manera positiva en el logro de los objetivos organizacionales.  2. Comunicación de marketing  versus   comunicación integral  Dada la falta de delimitación funcional y, por ende, la falta de unidad con-  ceptual en referencia a los órganos responsables de la comunicación de las orga-  nizaciones resulta una tarea ardua establecer estrictamente la evolución histórica  de sus estructuras. No obstante, se hace plausible pensar que las actuales estruc-  turas de comunicación de las organizaciones son el resultado de la evolución de  los antiguos departamentos de publicidad y gabinetes de prensa.  Dos modelos son básicos en la comunicación empresarial, el denominado  de comercialización o de marketing y el de comunicación integral14. La apli-  cación de uno u otro modelo está directamente relacionada con el perfil de la  organización a la que corresponde. El modelo de marketing ha entendido y  utilizado la comunicación como una técnica necesaria para alcanzar unos obje-  tivos concretos, mayoritariamente cuantitativos y básicamente relacionados  con la implantación de sus productos en los mercados. Por otro lado, el mode-  lo de comunicación integral aporta ese sentido de globalidad que permite ges-  tionar todas las acciones de comunicación —no sólo las que atañen a la  comercialización del producto/servicio—, concentrándolas bajo una misma  estructura y responsabilidad, lo que permite desarrollar su gestión como una fun-  ción estratégica más de la dirección de la compañía.  Existe una tendencia cada vez más generalizada, sobre todo entre las gran-  des compañías15, que tiende a estructurar sus comunicaciones teniendo en  cuenta esa visión de globalidad y coherencia. No obstante, es cierto que no  existen soluciones universales para estructurar la comunicación, sobre todo  porque cada organización desarrolla un modelo en función de sus necesida-  des (pensemos en las  pymes ).  Al hablar de la estructura de la comunicación en las organizaciones, en  muchos foros —empresas de productos de consumo, profesionales de la comu-  nicación— se asegura que la comunicación depende estructuralmente del mar-  keting, fruto del modelo de gestión que tradicionalmente se ha utilizado sobre  todo en las empresas de consumo, que en muchas ocasiones se ha convertido  en modelo a seguir por otras organizaciones y para otros objetivos de comu-  nicación muy distintos. Un ejemplo es la evolución del marketing con sus dis-  88   Anàlisi 35, 2007   Francisca Morales; Ana Mª Enrique  14.   MAZO,  J.  M.  (1994).   Estructura  de  la  comunicación  por  objetivos.   Barcelona:  Ariel  Comunicación.  15.   Ver Anuarios DirCom (Asociación de Directores de Comunicación), desde 1994. \ntintas aplicaciones en el ámbito social y político. En una investigación reali-  zada por Morales16 en 2002, se estudiaron tres tipos de organizaciones: una  empresa de productos de consumo; una empresa de servicios y una organiza-  ción no gubernamental. Ninguno de sus departamentos de comunicación  dependía estructuralmente de marketing. La comunicación en la empresa de ser-  vicios y en la organización no gubernamental se gestionaba desde un departa-  mento específico con un director de comunicación al frente que reportaba  directamente con Dirección General, y donde era función de sus directores de  comunicación la estructura y la gestión de todas las comunicaciones incluidas  las de marketing, al mismo nivel que el resto de técnicas de comunicación. El  modelo de gestión de la comunicación en la empresa de productos de consu-  mo estudiada fue reconocido como de «marketing-integral» y también estaba  situado, en la estructura general de la empresa, con dependencia directa de la  máxima dirección. El mismo estudio extrajo tres conclusiones:  a ) la dirección  de comunicación en las organizaciones depende de Dirección General;  b ) la  comunicación que depende estructuralmente de marketing es aquella que surge  de la aplicación de la «promotión» del marketing mix;  c ) hablar de comuni-  cación de las organizaciones implica pensar en todas las posibilidades que una  correcta estructura y gestión de las distintas técnicas y actividades de comuni-  cación puede aportar a una organización en su conjunto.  La Asociación de Directivos de Comunicación DirCom17 ese mismo año  manifestó que la principal función de la Dirección de Comunicación es ges-  tionar el desarrollo de las políticas y estrategias de comunicación desde una  perspectiva global, y presentó un organigrama de la Dirección de Comunicación  en que aseguraba pretender aclarar y situar a este departamento y a los profe-  sionales de la comunicación empresarial e institucional en el lugar que les  corresponde dentro de la organización, donde la Dirección de Comunicación  depende directamente de Presidencia y Dirección General, quedando las dis-  tintas comunicaciones de marketing, institucional, interna y relación con los  medios dependiendo directamente del director de comunicación.  3. La dirección de comunicación y su contribución   en la consolidación del modelo de comunicación integral  Durante la última década diversos autores18 han coincidido en afirmar que  la principal función de la dirección de comunicación radica en elaborar y  hacer ejecutar con eficiencia el plan estratégico de imagen de la compañía.  Para lograrlo este departamento debería participar activamente en el proceso  estratégico global de la organización, convirtiéndose en un punto importan-  te de referencia y apoyo para la Dirección General, asegurándose del correc-  La figura del  Dircom . Su importancia en el modelo de comunicación integral   Anàlisi 35, 2007   89  16.   MORALES, F. (2002).  La dirección de comunicación en la empresa/organización.  Trabajo de  nueve créditos. Barcelona: Universitat Autònoma de Barcelona.  17.   ADC DIRCOM (2002).  18.   COSTA (1999), JONSON, H. (1991), VILLAFAÑE (1998), Martín MARTÍN (1998). \nto planteamiento de las estrategias, estableciendo con claridad el concepto de  «identidad de la compañía», conociendo como es vista dentro y fuera por  todos sus públicos y su entorno, así como investigando sobre esa percepción  y cómo afecta a los objetivos generales de la organización la «imagen» que  todo ello genera. Por lo tanto crear, mantener y transmitir una imagen posi-  tiva de la compañía es parte fundamental de la actividad ejecutiva de comu-  nicación.  Para que la estructura de comunicación de una organización responda al  Modelo de Comunicación Integral , debe tener presente las distintas áreas sus-  ceptibles de generar comunicación en una organización. De la Dirección de  Comunicación deberían depender todas las áreas de comunicación de la  empresa, que concretamos básicamente en tres:  la comunicación corporativa/  institucional; la comunicación interna/organizacional y la comunicación comer-  cial/marketing .  3.1. Comunicación interna/organizacional  La comunicación corporativa o institucional se ocupa de la política de comu-  nicación de la organización y de su planificación estratégica, la gestión de la  cultura, identidad, imagen y reputación corporativa, relaciones con los accio-  nistas, relación con los medios, instituciones, administraciones públicas, res-  ponsabilidad social y gestión de la comunicación en situaciones de crisis. La  comunicación interna u organizacional implica a los miembros de la organi-  zación con el cometido de integrarles en el proyecto organizacional. Por últi-  mo, la comunicación comercial o de marketing se basa en los principios  mercadotécnicos de la colocación y promoción de productos y servicios, orien-  tada básicamente a sus clientes o consumidores.  Especial importancia adquiere la gestión de la comunicación corporativa  cuando la empresa se ve afectada por un fenómeno circunstancial y extraordi-  nario que deriva en una crisis. Como señala Enrique (2002) una situación de  crisis hace peligrar los objetivos de la organización, además de alterar las rela-  ciones que ésta posee con sus públicos. La organización va a necesitar que se  intervenga para minimizar o evitar posibles repercusiones que afecten nociva-  mente a su imagen y/o reputación. El director de comunicación no sólo debe  planificar qué hacer en términos comunicacionales para contrarrestar los efec-  tos negativos que la crisis pudiera producir. Su intervención en la gestión de  crisis comienza mucho antes, cuando la organización decide establecer un plan  de gestión de crisis que contenga las medidas básicas de prevención ante posi-  bles riesgos susceptibles de derivar en situaciones que pongan en peligro su  estabilidad. Hay crisis que no son evitables por parte de la organización.  Accidentes o fenómenos naturales son sucesos incontrolables por ella y lo único  que puede hacer es prever una serie de mecanismos que minimicen su impac-  to. En cambio, se pueden dar sucesos cuya aparición depende de acciones  humanas sobre las que la organización puede influir o controlar. Evitarlas  dependerá de la capacidad de gestión de la organización.  90   Anàlisi 35, 2007   Francisca Morales; Ana Mª Enrique \nPara que los directores de comunicación desarrollen una labor eficiente,  sobre todo en lo referente a la gestión de los valores intangibles, como son la  reputación, la marca, la responsabilidad social de las empresas, las relaciones  con los stakeholders, cada día más significativos entre las prioridades de las  grandes compañías19, la estructura de comunicación de las organizaciones no  puede prescindir, en su gestión, de la coordinación de ninguna de las tres áreas  mencionadas. Sin embargo, hay que reconocer la particularidad de la comu-  nicación interna que en la mayoría de los casos depende de Recursos Humanos  y algo similar ocurre con la comunicación comercial (de producto y de marca)  cuyas actividades de comunicación se desempeñan mayoritariamente desde el  departamento de marketing, siguiendo el modelo ya comentado, que Mazo  del Castillo denomina de «Comercialización o de Marketing». Aunque pau-  latinamente van aumentando los departamentos de comunicación interna den-  tro de las empresas20, éstos no siempre se sitúan en el lugar que dentro del  modelo de comunicación integral les corresponde. La comunicación de una  compañía, en su globalidad, no puede considerarse estratégica, en su pleno  sentido, si la comunicación interna no tiene esa misma consideración. Por lo  que debería ser función de la Dirección de Comunicación estructurar, coor-  dinar y controlar que todas las acciones de comunicación hacia el interior sean  parte integrante del plan estratégico de la compañía, del plan estratégico de  comunicación y del manual de funciones del director de comunicación.  Para una eficiente gestión de la comunicación integral, nos parece perti-  nente recuperar aquí la aportación de Villafañe (1998), que concreta en cua-  tro las principales funciones a desempeñar por la Dirección de Comunicación:  a)   La función normativa, que persigue la cohesión y la coordinación de todos  los activos de imagen, propios y ajenos, con los que cuenta la empresa.  b)   La función de servicio, que se expresa en el apoyo y el asesoramiento a  todos los departamentos y filiales de la compañía en sus cometidos comu-  nicativos, pero sin sustituirlos en el plano operativo.  c)   La función formativa, en una doble dirección: la capacitación comunicativa  y la transmisión de la cultura de la organización.  d)   La función prospectiva, respecto a la imagen corporativa de la empresa. En  este sentido, la Dirección de Comunicación debe convertirse en un obser-  vatorio permanente como mínimo de los competidores más directos, el  mercado, la opinión interna y externa, sobre la compañía.  Todo ello para contar con unas condiciones que sitúen a la comunicación  en posición de afrontar y hacer realidad los grandes objetivos que la máxima  La figura del  Dircom . Su importancia en el modelo de comunicación integral   Anàlisi 35, 2007   91  19.   VILLAFAÑE, J. (2005). «La comunicación empresarial y la gestión de los intangibles en  España y Latinoamérica». En:  El estado de la publicidad y el Corporate.   Madrid: CAP-UCM.  20.   Según López Triana, las tareas de comunicación interna encargadas a consultoras han pasa-  do de un 84% en 2000 al 48,10% en 2004. En: Villafañe. «La comunicación empresarial  y la gestión de los intangibles en España y Latinoamérica». \nautoridad de la organización espera de este departamento directivo. Queda  claro que para que la comunicación actúe en este nivel, condición básica e  indispensable es ser considerada función estratégica en sí misma.  4. Conclusión  Dircom  es el apócope de director de comunicación, ejecutivo responsable de  la comunicación de las organizaciones, partiendo de la consideración de esta últi-  ma como un elemento estratégico de gestión capaz de generar valor. Son dos  los modelos que pueden imperar en las estructuras de comunicación de cual-  quier organización: modelo de marketing/comercialización o modelo de comu-  nicación integral. Este último modelo es el que en los últimos tiempos intenta  consolidarse en la gestión de la comunicación con independencia del perfil de  organización en el que se desarrolle su actividad. Son tres las áreas que abarca  el modelo de comunicación integral: comunicación interna/organizacional,  comunicación corporativa/institucional y comunicación comercial/marketing.  La principal función de la Dirección de Comunicación consiste en coordinar  las distintas actividades de comunicación, conseguir una gestión coherente de  las mismas, así como homogeneidad de los mensajes e implicación de todos  los públicos en el proyecto empresarial. Por todo ello es imprescindible con-  tar con un profesional «humanista integral» responsable de la gestión de la  comunicación de la organización con capacidad para consolidar su imagen y  lograr una buena reputación21 corporativa. Más allá de su función integrado-  ra, el director de comunicación se presenta como un cargo estratégico para la  organización. Para conseguirlo, es imprescindible que el Dircom reporte direc-  tamente a la Alta Dirección.  5. Bibliografía  BENAVIDES DELGADO, Juan (1993).  Director de comunicación . Madrid: Edipo.  BENAVI     function extractTextFromBackendResponse(raw) {
        if (raw == null) return '';
        const s = String(raw).trim();
        if (!s) return '';
        try {
            const j = JSON.parse(s);
            if (Array.isArray(j)) return JSON.stringify(j);
            if (j && typeof j === 'object') {
                const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
                if (typeof c === 'string') return c.trim();
                if (typeof j.content === 'string') return j.content.trim();
                if (typeof j.text === 'string') return j.text.trim();
            }
            if (typeof j === 'string') return j;
        } catch (e) {}
        return s;
    }
    async function postBackendText(payload) {
        const body = { model: payload.model || 'openai-fast', prompt: payload.prompt };
        if (payload.system) body.system = payload.system;
        if (payload.json) body.json = true;
        const res = await fetch(BACKEND_BASE + '/api/ia/text', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const raw = await res.text();
        if (!res.ok) throw new Error('Error de API: ' + res.status + ' ' + res.statusText + '. ' + raw.substring(0, 200));
        return extractTextFromBackendResponse(raw);
    }

    // Theme and palette

    function hexToRgb(hex) {
        const normalized = String(hex || '#000000').replace('#', '');
        const full = normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized;
        const value = parseInt(full, 16);
        return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }
    function rgbToHex(r, g, b) {
        const toHex = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
        return '#' + toHex(r) + toHex(g) + toHex(b);
    }
    function mixColors(colorA, colorB, amount) {
        const a = hexToRgb(colorA);
        const b = hexToRgb(colorB);
        return rgbToHex(a.r + (b.r - a.r) * amount, a.g + (b.g - a.g) * amount, a.b + (b.b - a.b) * amount);
    }
    function getLuminance(hex) {
        const { r, g, b } = hexToRgb(hex);
        const toLinear = (value) => {
            const s = value / 255;
            return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
        };
        return 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    }
    function hslToHex(h, s, l) {
        const hue = ((h % 360) + 360) % 360;
        const saturation = Math.max(0, Math.min(100, s)) / 100;
        const lightness = Math.max(0, Math.min(100, l)) / 100;
        const hueToRgb = (p, q, t) => {
            let temp = t;
            if (temp < 0) temp += 1;
            if (temp > 1) temp -= 1;
            if (temp < 1 / 6) return p + (q - p) * 6 * temp;
            if (temp < 1 / 2) return q;
            if (temp < 2 / 3) return p + (q - p) * (2 / 3 - temp) * 6;
            return p;
        };
        const q = lightness < 0.5 ? lightness * (1 + saturation) : lightness + saturation - lightness * saturation;
        const p = 2 * lightness - q;
        const r = hueToRgb(p, q, hue / 360 + 1 / 3);
        const g = hueToRgb(p, q, hue / 360);
        const b = hueToRgb(p, q, hue / 360 - 1 / 3);
        return rgbToHex(r * 255, g * 255, b * 255);
    }
    function getReadableTextColor(bgColor) { return getLuminance(bgColor) > 0.56 ? '#111827' : '#f8fafc'; }
    function generatePalette() {
        const hue = Math.floor(Math.random() * 360);
        const bg = hslToHex(hue, 45 + Math.floor(Math.random() * 20), 16 + Math.floor(Math.random() * 70));
        const text = getReadableTextColor(bg);
        const isDark = getLuminance(bg) < 0.5;
        const accent = hslToHex((hue + 35 + Math.floor(Math.random() * 60)) % 360, 80, isDark ? 55 : 45);
        const card = isDark ? mixColors(bg, '#ffffff', 0.08) : mixColors(bg, '#000000', 0.05);
        const border = isDark ? mixColors(card, '#ffffff', 0.18) : mixColors(card, '#000000', 0.12);
        const input = isDark ? mixColors(card, '#ffffff', 0.07) : mixColors(card, '#000000', 0.04);
        const inputBorder = isDark ? mixColors(border, '#ffffff', 0.12) : mixColors(border, '#000000', 0.1);
        const botBg = isDark ? mixColors(bg, '#ffffff', 0.12) : mixColors(bg, '#000000', 0.06);
        return {
            bgColor: bg,
            textColor: text,
            cardBgColor: card,
            cardBorderColor: border,
            inputBgColor: input,
            inputBorderColor: inputBorder,
            chatBubbleBotBg: botBg,
            chatBubbleBotText: text,
            chatBubbleUserBg: accent,
            chatBubbleUserText: getReadableTextColor(accent),
            primaryColor: accent,
            secondaryColor: isDark ? mixColors(accent, '#ffffff', 0.2) : mixColors(accent, '#000000', 0.2),
            headerBorderColor: border,
            systemMessageBg: isDark ? mixColors(bg, '#fde68a', 0.2) : mixColors(bg, '#fde68a', 0.28),
            systemMessageText: isDark ? '#fef3c7' : '#78350f'
        };
    }
    function buildThemePalette(theme, palette) {
        const base = palette || {
            primaryColor: '#2563eb',
            secondaryColor: '#6b7280',
            bgColor: '#ffffff',
            textColor: '#1f2937',
            cardBgColor: '#ffffff',
            cardBorderColor: '#d1d5db',
            inputBgColor: '#ffffff',
            inputBorderColor: '#cbd5e1',
            chatBubbleBotBg: '#f3f4f6',
            chatBubbleBotText: '#1f2937',
            chatBubbleUserBg: '#2563eb',
            chatBubbleUserText: '#ffffff',
            headerBorderColor: '#e5e7eb',
            systemMessageBg: '#fef3c7',
            systemMessageText: '#92400e'
        };
        const isDark = theme === 'dark';
        const bgColor = isDark ? mixColors(base.bgColor || '#ffffff', '#000000', 0.72) : '#ffffff';
        const textColor = getReadableTextColor(bgColor);
        const cardBgColor = isDark ? mixColors(bgColor, '#ffffff', 0.08) : '#ffffff';
        const cardBorderColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.16) : '#d1d5db';
        const inputBgColor = isDark ? mixColors(cardBgColor, '#ffffff', 0.06) : '#ffffff';
        const inputBorderColor = isDark ? mixColors(cardBorderColor, '#ffffff', 0.12) : '#cbd5e1';
        const chatBubbleBotBg = isDark ? mixColors(bgColor, '#ffffff', 0.12) : '#f3f4f6';
        const chatBubbleBotText = textColor;
        const headerBorderColor = cardBorderColor;
        const systemMessageBg = isDark ? mixColors(bgColor, '#fde68a', 0.2) : '#fef3c7';
        const systemMessageText = isDark ? '#fef3c7' : '#92400e';
        return {
            ...base,
            bgColor,
            textColor,
            cardBgColor,
            cardBorderColor,
            inputBgColor,
            inputBorderColor,
            chatBubbleBotBg,
            chatBubbleBotText,
            headerBorderColor,
            systemMessageBg,
            systemMessageText
        };
    }
    function setPaletteVariables(target, palette) {
        if (!palette) return;
        target.style.setProperty('--primary', palette.primaryColor || '#007bff');
        target.style.setProperty('--secondary', palette.secondaryColor || '#6c757d');
        target.style.setProperty('--bg', palette.bgColor || '#f8f9fa');
        target.style.setProperty('--text', palette.textColor || '#343a40');
        target.style.setProperty('--card', palette.cardBgColor || '#ffffff');
        target.style.setProperty('--border', palette.cardBorderColor || '#dddddd');
        target.style.setProperty('--input', palette.inputBgColor || '#ffffff');
        target.style.setProperty('--iborder', palette.inputBorderColor || '#cccccc');
        target.style.setProperty('--bot-bg', palette.chatBubbleBotBg || '#e9ecef');
        target.style.setProperty('--bot-text', palette.chatBubbleBotText || '#343a40');
        target.style.setProperty('--user-bg', palette.chatBubbleUserBg || '#007bff');
        target.style.setProperty('--user-text', palette.chatBubbleUserText || '#ffffff');
        target.style.setProperty('--sys-bg', palette.systemMessageBg || '#fff3cd');
        target.style.setProperty('--sys-text', palette.systemMessageText || '#856404');
    }
    function applyPalette(palette) {
        currentPalette = palette;
        applyTheme(currentTheme);
        localStorage.setItem('downloaded-palette', JSON.stringify(palette));
    }
    function applyTheme(t) {

    pdf2Upload.addEventListener('change', async (ev) => {
        const file = ev.target.files[0]; if (!file) return;
        if (!(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) {
            pdf2StatusDisplay.textContent = 'No es un PDF válido.'; pdf2StatusDisplay.style.color = 'var(--danger)'; return;
        }

        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(e.target.result) }).promise;
                let text = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const tc = await page.getTextContent();
                    tc.items.forEach(item => text += item.str + ' ');
                    text += '\n';
                }
                pdf2Text = text;
                pdf2StatusDisplay.textContent = '"' + pdf2Name + '" cargado.'; pdf2StatusDisplay.style.color = 'var(--success)';
                addMsg('Segundo documento "' + pdf2Name + '" listo.', 'system');
            } catch(err) { pdf2StatusDisplay.textContent = 'Error al procesar.'; pdf2StatusDisplay.style.color = 'var(--danger)'; pdf2Text = ''; }
        };
        reader.readAsArrayBuffer(file);
    });

    function addMsg(message, sender, isThinking = false) {
        const el = document.createElement('div');

        if (sender.includes('error')) el.classList.add('error');

            const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
            const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
            const botAvatarUrl = getAvatarUrl('bot');

            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else if (sender === 'bot') {

            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong> <span class="thinking-animation">' + message + '</span></div></div>';
            el.id = 'thinking-msg';

            const userAvatarUrl = getAvatarUrl('user');

    function updateLastMsg(message) {
        const el = document.getElementById('thinking-msg');
        const botAvatarUrl = getAvatarUrl('bot');
        const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
        const html = marked.parse ? marked.parse(processedMessage) : processedMessage;

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        conversationHistory.push({ role: 'user', content: question });
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF de esta sesión y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros libros o materiales no incluidos, programación o tareas arbitrarias no vinculadas al texto, cotilleo, política o entretenimiento sin conexión con el PDF, etc.). ' +
            'Si la pregunta no guarda relación razonable con el documento ni con ese tema, responde ÚNICAMENTE con UNA línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento; si falta información en el PDF, dilo con claridad.';

        let prompt = 'Instrucciones del sistema:\n' + systemInstructions + '\n\n';
        prompt += 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n';

        // Incluir el historial completo de la conversación para dar contexto al modelo
        var historyBlock = conversationHistory.slice(0, -1).map(function(turn, index) {
            var speaker = turn.role === 'user' ? 'Usuario' : 'Asistente';
            return '[Turno ' + (index + 1) + '] ' + speaker + ': ' + turn.content;
        }).join('\n\n');
        if (historyBlock) {
            prompt += 'Conversación previa (historial del chat):\n' + historyBlock + '\n\n';
        }

        prompt += 'Pregunta: ' + question + '\n\nRespuesta:';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (raw.startsWith('[FUERA_DE_ALCANCE]')) {
                const texto = raw.replace('[FUERA_DE_ALCANCE]', '').trim();
                conversationHistory.push({ role: 'assistant', content: texto });
                dismissThinkingAsSystem(texto, true);
            } else {
                conversationHistory.push({ role: 'assistant', content: raw });
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }

        if (s === undefined || s === null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
</body>
</html>
